<!DOCTYPE html>
<html lang="en">
<head>
<meta name="robots" content="noindex, nofollow">

<meta charset="UTF-8">
<title>AMAN Restroom Pass — Neck Badge</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Crimson+Pro:ital,wght@0,400;0,600;1,400&family=Amiri:wght@400;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --green:#1a4a35;
    --green-dark:#123526;
    --gold:#b8872a;
    --gold-light:#d9ac54;
    --parchment:#f4ead6;
    --card-w:3in;
    --card-h:4.5in;
  }
  *{box-sizing:border-box;}
  body{ margin:0; background:#dcd5c8; font-family:'Crimson Pro', serif; color:#2a2a2a; }

  /* ---------- Toolbar ---------- */
  .toolbar{
    position:sticky; top:0; z-index:10;
    background:var(--green-dark); color:var(--parchment);
    padding:14px 20px; display:flex; flex-wrap:wrap; gap:14px 22px; align-items:center;
    font-family:'DM Mono', monospace; font-size:12.5px;
    box-shadow:0 2px 10px rgba(0,0,0,.25);
  }
  .toolbar h1{
    font-family:'Playfair Display', serif; font-size:16px; margin:0 12px 0 0;
    color:var(--gold-light); font-weight:700; letter-spacing:.02em;
  }
  .toolbar label{display:flex; align-items:center; gap:6px;}
  .toolbar select, .toolbar input[type=number]{
    font-family:'DM Mono', monospace; background:#0f2a1e; color:var(--parchment);
    border:1px solid var(--gold); border-radius:4px; padding:5px 8px; font-size:12.5px;
  }
  .toolbar input[type=number]{width:60px;}
  .toolbar button{
    font-family:'DM Mono', monospace; background:var(--gold); color:#1c1200; border:none;
    border-radius:4px; padding:7px 16px; font-weight:600; cursor:pointer; letter-spacing:.03em;
  }
  .toolbar button:hover{background:var(--gold-light);}
  .note{ width:100%; font-size:11px; opacity:.75; line-height:1.5; }

  /* ---------- Layout ---------- */
  .sheet{ display:flex; flex-wrap:wrap; gap:.3in; justify-content:center; padding:.5in .4in; }
  .pair{ display:flex; gap:.3in; align-items:flex-start; break-inside:avoid; }
  .card-wrap{ padding:0; break-inside:avoid; position:relative; }
  .side-label{
    text-align:center; font-family:'DM Mono',monospace; font-size:10px;
    letter-spacing:.15em; text-transform:uppercase; color:#666; margin-bottom:4px;
  }
  body.show-crop .card-wrap .badge-outer{
    padding:.15in; border:1px dashed #888;
  }

  /* ---------- Badge ---------- */
  .badge-outer{ padding:0; }
  .badge{
    width:var(--card-w); height:var(--card-h);
    border-radius:calc(min(var(--card-w),var(--card-h)) * 0.06);
    position:relative; overflow:hidden;
    font-size:calc(min(var(--card-w),var(--card-h)) * 6.2%);
    box-shadow:0 6px 22px rgba(0,0,0,.28);
    display:flex; flex-direction:column; align-items:center; text-align:center;
  }
  .badge .frame{
    position:absolute; inset:0.1em; border:2px solid var(--gold);
    border-radius:calc(min(var(--card-w),var(--card-h)) * 0.05); pointer-events:none;
  }
  .badge.men{ background:var(--green); color:var(--parchment); --bg:#1a4a35; }
  .badge.women{ background:var(--parchment); color:var(--green); --bg:#f4ead6; }
  .badge.women .frame{ border-color:var(--green); }

  /* lanyard hole */
  .hole-zone{ height:1.55em; width:100%; position:relative; flex:0 0 auto; }
  .hole{
    position:absolute; top:.32em; left:50%; transform:translateX(-50%);
    width:1em; height:1em; border-radius:50%;
    background:#00000022;
    border:.14em solid var(--gold);
  }
  .badge.women .hole{ border-color:var(--green); background:#1a4a3514; }

  .content{
    position:relative; z-index:1; width:100%; flex:1;
    padding:0 .55em .5em; display:flex; flex-direction:column; align-items:center;
  }

  .mark{ width:1.9em; height:1.9em; }
  .badge.men .mark{ color:var(--gold-light); }
  .badge.women .mark{ color:var(--gold); }

  .subtitle{
    font-family:'Playfair Display', serif; font-weight:700; font-size:1.15em;
    letter-spacing:.08em; margin-top:.3em;
  }
  .title{
    font-family:'Playfair Display', serif; font-weight:800; font-size:1.85em;
    letter-spacing:.02em; line-height:1.05; margin-top:.02em;
  }
  .figure{ width:2.6em; height:3.1em; margin:.3em 0 .1em; }
  .badge.men .figure{ color:var(--gold-light); }
  .badge.women .figure{ color:var(--gold); }

  .ornament{ width:62%; height:.6em; margin:.25em 0 .3em; }
  .badge.men .ornament{ color:var(--gold-light); }
  .badge.women .ornament{ color:var(--gold); }

  .footer{ margin-top:auto; padding-top:.35em; width:100%; border-top:1px solid; }
  .badge.men .footer{ border-color:rgba(216,172,84,.4); }
  .badge.women .footer{ border-color:rgba(184,135,42,.5); }
  .school-name{ font-family:'Playfair Display', serif; font-weight:700; font-size:.62em; }
  .found-line{
    font-family:'DM Mono', monospace; font-size:.4em; letter-spacing:.05em;
    text-transform:uppercase; opacity:.75; margin-top:.22em; line-height:1.5;
  }

  /* ---- back side ---- */
  .ar-label{
    font-family:'Amiri', serif; font-size:1.35em; line-height:1.1;
    margin:.3em 0 .25em; padding:.06em .5em; border-radius:.2em;
  }
  .badge.men .ar-label{ background:rgba(0,0,0,.18); color:var(--gold-light); }
  .badge.women .ar-label{ background:rgba(26,74,53,.08); color:var(--green); }

  .reminder-tag{
    font-family:'DM Mono', monospace; font-size:.5em; letter-spacing:.24em;
    text-transform:uppercase; opacity:.85; margin-bottom:.45em;
  }
  .duas{ width:100%; flex:1; display:flex; flex-direction:column; justify-content:center; gap:.4em; }
  .dua-box{ border-radius:.3em; padding:.32em .45em .36em; }
  .badge.men .dua-box{ background:rgba(244,234,214,.09); border:1px solid rgba(216,172,84,.4); }
  .badge.women .dua-box{ background:rgba(26,74,53,.05); border:1px solid rgba(184,135,42,.5); }
  .dua-head{
    font-family:'DM Mono', monospace; font-size:.46em; letter-spacing:.16em;
    text-transform:uppercase; margin-bottom:.28em; opacity:.8;
  }
  .badge.men .dua-head{ color:var(--gold-light); }
  .badge.women .dua-head{ color:var(--green); }
  .dua-ar{ font-family:'Amiri', serif; font-size:1.05em; line-height:1.5; direction:rtl; }
  .dua-translit{ font-style:italic; font-size:.58em; opacity:.9; margin-top:.22em; }
  .dua-en{ font-size:.52em; opacity:.75; margin-top:.1em; }

  .levels{
    display:flex; justify-content:center; gap:.6em; margin-top:.35em;
    font-family:'DM Mono', monospace; font-size:.42em; letter-spacing:.05em;
  }
  .lvl{ display:flex; flex-direction:column; align-items:center; gap:.2em; opacity:.85; }
  .lvl .dot{
    width:1em; height:1em; border-radius:50%; border:.12em solid currentColor;
  }

  @media print{
    .toolbar{ display:none; }
    body{ background:#fff; }
    .sheet{ padding:0; }
    .badge{ box-shadow:none; }
    .pair, .card-wrap{ page-break-inside:avoid; }
  }
</style>
</head>
<body>
<style>@media print{#amanHubNav{display:none !important;}}</style>
<div id="amanHubNav" style="position:sticky;top:0;z-index:99999;background:#123526;color:#f4ead6;padding:8px 18px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:12.5px;letter-spacing:.02em;display:flex;align-items:center;gap:10px;box-shadow:0 2px 8px rgba(0,0,0,.25);">
  <a href="index.html" style="color:#d9ac54;text-decoration:none;font-weight:600;">&larr; AMAN Admin Hub</a>
  <span style="opacity:.5;">/</span>
  <span style="opacity:.85;">Restroom Pass — Neck Badge</span>
</div>


<div class="toolbar no-print">
  <h1>AMAN Restroom Badge — Print Studio</h1>

  <label>Size
    <select id="preset">
      <option value="2.5,3.75">Compact — 2.5×3.75in</option>
      <option value="3,4.5" selected>Standard neck badge — 3×4.5in</option>
      <option value="3.5,5.5">Large — 3.5×5.5in</option>
      <option value="custom">Custom…</option>
    </select>
  </label>
  <label>W <input type="number" id="wIn" value="3" step="0.25" min="1.5" max="6"> in</label>
  <label>H <input type="number" id="hIn" value="4.5" step="0.25" min="2" max="8"> in</label>
  <label>Sets <input type="number" id="copies" value="1" step="1" min="1" max="10"></label>
  <label><input type="checkbox" id="doubleSided" checked> double-sided (front + back)</label>
  <label><input type="checkbox" id="showLevels" checked> level markers on back</label>
  <label><input type="checkbox" id="cropToggle"> cut guides</label>
  <button onclick="window.print()">Print</button>

  <div class="note">Print both sides on cardstock, trim, glue front-to-back, punch through the printed ring at top, and add a lanyard/badge reel. Set print Margins to <b>None</b> and Scale to <b>100%</b>.</div>
</div>

<div class="sheet" id="sheet"></div>

<template id="frontTpl">
  <div class="badge VARIANT">
    <div class="frame"></div>
    <div class="hole-zone"><div class="hole"></div></div>
    <div class="content">
      <svg class="mark" viewBox="0 0 100 100" fill="none">
        <path d="M18 88 L18 46 C18 16 34 6 50 6 C66 6 82 16 82 46 L82 88" stroke="currentColor" stroke-width="4.5" stroke-linecap="round"/>
        <path d="M32 62 C40 56 46 58 50 64 C54 58 60 56 68 62" stroke="currentColor" stroke-width="3.4" fill="none" stroke-linecap="round"/>
        <line x1="50" y1="62" x2="50" y2="82" stroke="currentColor" stroke-width="3.4" stroke-linecap="round"/>
      </svg>
      <div class="subtitle">GENDER_LABEL</div>
      <div class="title">RESTROOM<br>PASS</div>
      <svg class="figure figMEN" viewBox="0 0 100 130" fill="none">
        <path d="M33 22 Q50 4 67 22 L67 30 L33 30 Z" fill="currentColor"/>
        <circle cx="50" cy="44" r="17" fill="currentColor"/>
        <path d="M25 120 C25 76 36 60 50 60 C64 60 75 76 75 120 Z" fill="currentColor"/>
      </svg>
      <svg class="figure figWOMEN" viewBox="0 0 100 130" fill="none">
        <path d="M50 8 C24 8 13 34 13 58 C13 92 26 118 26 118 L37 118 C37 118 24 92 24 58 C24 35 34 15 50 15 C66 15 76 35 76 58 C76 92 63 118 63 118 L74 118 C74 118 87 92 87 58 C87 34 76 8 50 8 Z" fill="currentColor"/>
        <ellipse cx="50" cy="47" rx="15.5" ry="18.5" fill="var(--bg)"/>
        <path d="M31 118 C31 96 39 85 50 85 C61 85 69 96 69 118 Z" fill="currentColor"/>
      </svg>
      <svg class="ornament" viewBox="0 0 200 20" fill="none">
        <line x1="0" y1="10" x2="80" y2="10" stroke="currentColor" stroke-width="1.4"/>
        <line x1="120" y1="10" x2="200" y2="10" stroke="currentColor" stroke-width="1.4"/>
        <path d="M92 10 L100 3 L108 10 L100 17 Z" fill="currentColor"/>
      </svg>
      <div class="footer">
        <div class="school-name">Al‑Madrasatu An‑Nūriyyah</div>
        <div class="found-line">If found, please return to<br>the AMAN front office</div>
      </div>
    </div>
  </div>
</template>

<template id="backTpl">
  <div class="badge VARIANT">
    <div class="frame"></div>
    <div class="hole-zone"><div class="hole"></div></div>
    <div class="content">
      <div class="ar-label" dir="rtl" lang="ar">دَوْرَةُ الْمِيَاهِ</div>
      <div class="reminder-tag">Du'ā' Reminder</div>
      <div class="duas">
        <div class="dua-box">
          <div class="dua-head">Before Entering</div>
          <div class="dua-ar" lang="ar">بِسْمِ اللَّهِ، اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْخُبُثِ وَالْخَبَائِثِ</div>
          <div class="dua-translit">Bismillāh, Allāhumma innī a'ūdhu bika minal-khubthi wal-khabā'ith</div>
          <div class="dua-en">"In the name of Allah. O Allah, I seek refuge in You from male and female devils."</div>
        </div>
        <div class="dua-box">
          <div class="dua-head">After Leaving</div>
          <div class="dua-ar" lang="ar">غُفْرَانَكَ</div>
          <div class="dua-translit">Ghufrānak</div>
          <div class="dua-en">"I seek Your forgiveness."</div>
        </div>
      </div>
      <div class="levels LEVELROW">
        <div class="lvl"><div class="dot"></div>L1</div>
        <div class="lvl"><div class="dot"></div>L2</div>
        <div class="lvl"><div class="dot"></div>L3</div>
      </div>
    </div>
  </div>
</template>

<script>
  const root = document.documentElement;
  const sheet = document.getElementById('sheet');
  const frontTpl = document.getElementById('frontTpl').innerHTML;
  const backTpl = document.getElementById('backTpl').innerHTML;

  const presetSel = document.getElementById('preset');
  const wIn = document.getElementById('wIn');
  const hIn = document.getElementById('hIn');
  const copiesIn = document.getElementById('copies');
  const doubleSided = document.getElementById('doubleSided');
  const showLevels = document.getElementById('showLevels');
  const cropToggle = document.getElementById('cropToggle');

  function setSize(w,h){
    root.style.setProperty('--card-w', w+'in');
    root.style.setProperty('--card-h', h+'in');
  }

  function pickFigure(html, variant){
    const menSvg = html.match(/<svg class="figure figMEN"[\s\S]*?<\/svg>/);
    const womenSvg = html.match(/<svg class="figure figWOMEN"[\s\S]*?<\/svg>/);
    if(!menSvg || !womenSvg) return html;
    const combined = html.slice(menSvg.index, womenSvg.index + womenSvg[0].length);
    const keep = variant === 'men' ? menSvg[0] : womenSvg[0];
    return html.replace(combined, keep);
  }

  function buildFront(variant){
    let html = frontTpl.replaceAll('VARIANT', variant);
    html = html.replace('GENDER_LABEL', variant === 'men' ? "MEN'S" : "WOMEN'S");
    html = pickFigure(html, variant);
    return `<div class="card-wrap"><div class="side-label no-print">Front</div><div class="badge-outer">${html}</div></div>`;
  }

  function buildBack(variant){
    let html = backTpl.replaceAll('VARIANT', variant);
    html = html.replace('LEVELROW', showLevels.checked ? '' : 'style="display:none"');
    return `<div class="card-wrap"><div class="side-label no-print">Back</div><div class="badge-outer">${html}</div></div>`;
  }

  function render(){
    const n = Math.max(1, parseInt(copiesIn.value) || 1);
    let out = '';
    for(let i=0;i<n;i++){
      ['men','women'].forEach(variant=>{
        out += '<div class="pair">';
        out += buildFront(variant);
        if(doubleSided.checked) out += buildBack(variant);
        out += '</div>';
      });
    }
    sheet.innerHTML = out;
  }

  presetSel.addEventListener('change', () => {
    if(presetSel.value === 'custom') return;
    const [w,h] = presetSel.value.split(',').map(Number);
    wIn.value = w; hIn.value = h;
    setSize(w,h);
  });
  function customChange(){ presetSel.value = 'custom'; setSize(wIn.value, hIn.value); }
  wIn.addEventListener('input', customChange);
  hIn.addEventListener('input', customChange);
  copiesIn.addEventListener('input', render);
  doubleSided.addEventListener('change', render);
  showLevels.addEventListener('change', render);
  cropToggle.addEventListener('change', () => document.body.classList.toggle('show-crop', cropToggle.checked));

  setSize(3,4.5);
  render();
</script>
</body>
</html>
