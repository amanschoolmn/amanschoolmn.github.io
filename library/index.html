<style>
:root{
  --forest:#0d2418; --forest-2:#143626; --emerald:#1c5e45;
  --gold:#f8c020; --gold-2:#e2a812; --gold-soft:#f3d98a;
  --cream:#f6f0e1; --paper:#fffdf7; --ink:#1b2a22; --ink-2:#56665c;
  --line:rgba(13,36,24,.12); --shadow:0 12px 32px -16px rgba(13,36,24,.45);
  --pattern:url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='64' height='64'%3E%3Cg fill='none' stroke='%23f8c020' stroke-width='1'%3E%3Crect x='16' y='16' width='32' height='32'/%3E%3Crect x='16' y='16' width='32' height='32' transform='rotate(45 32 32)'/%3E%3Ccircle cx='32' cy='32' r='6'/%3E%3C/g%3E%3C/svg%3E");
  --f-head:'Playfair Display',Georgia,serif; --f-body:'DM Sans',system-ui,-apple-system,sans-serif; --f-mono:'DM Mono',ui-monospace,monospace; --f-ar:'Amiri',serif;
}
body[data-theme="ink"]{
  --cream:#08160e; --paper:#10281c; --ink:#f3ead3; --ink-2:#a8b9ad;
  --line:rgba(248,192,32,.16); --shadow:0 14px 34px -16px rgba(0,0,0,.8);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html{scroll-behavior:smooth;}
body{margin:0;background:var(--cream);color:var(--ink);font-family:var(--f-body);-webkit-font-smoothing:antialiased;transition:background .3s,color .3s;}
button{font-family:inherit;}
.wrap{max-width:1120px;margin:0 auto;padding:0 1.1rem;}

/* ============ PASSWORD GATE ============ */
body:not(.unlocked) .app,body:not(.unlocked) .viewer{display:none!important;}
body.unlocked .gate{display:none;}
body:not(.unlocked){overflow:hidden;}
.gate{position:fixed;inset:0;z-index:1000;background:var(--forest);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:1.4rem;overflow:auto;}
.gate::before{content:'';position:absolute;inset:0;background:var(--pattern);opacity:.07;background-size:64px 64px;}
.gate::after{content:'';position:absolute;inset:0;background:radial-gradient(520px 420px at 50% 32%,rgba(248,192,32,.16),transparent 70%);pointer-events:none;}
.gate-card{position:relative;z-index:1;width:100%;max-width:380px;text-align:center;}
.gate-logo{width:min(54vw,210px);height:auto;display:block;margin:0 auto .4rem;
  border-radius:28px;border:1px solid rgba(248,192,32,.45);box-shadow:0 0 0 6px rgba(248,192,32,.08),0 18px 50px -10px rgba(0,0,0,.7),0 0 60px rgba(248,192,32,.18);animation:floaty 6s ease-in-out infinite;}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.gate-ar{font-family:var(--f-ar);font-size:1.5rem;color:var(--gold);display:block;}
.gate-title{font-family:var(--f-head);font-weight:900;font-size:2.1rem;margin:.1rem 0 .3rem;color:#fbf4df;letter-spacing:.01em;}
.gate-sub{margin:0 0 1.5rem;color:#b9cbbd;font-size:.95rem;}
.pw{position:relative;}
.gate-input{width:100%;font:500 1rem var(--f-body);letter-spacing:.04em;padding:.95rem 3rem .95rem 1.1rem;border-radius:14px;border:1px solid rgba(248,192,32,.4);background:rgba(255,255,255,.06);color:#fff;outline:none;text-align:center;transition:border .2s,box-shadow .2s,background .2s;}
.gate-input::placeholder{color:#8fa597;letter-spacing:.02em;}
.gate-input:focus-visible,.search input:focus-visible{outline:none;}
.gate-input:focus{border-color:var(--gold);box-shadow:0 0 0 4px rgba(248,192,32,.16);background:rgba(255,255,255,.09);}
.eye{position:absolute;right:.5rem;top:50%;transform:translateY(-50%);width:2.4rem;height:2.4rem;border:none;background:none;color:#a9bfb0;cursor:pointer;border-radius:10px;display:grid;place-items:center;}
.eye:hover{color:var(--gold);}
.gate-btn{margin-top:.85rem;width:100%;font:700 .85rem var(--f-body);letter-spacing:.12em;text-transform:uppercase;padding:1rem;border-radius:14px;border:none;cursor:pointer;color:#241a02;
  background:linear-gradient(180deg,#ffd75a,var(--gold) 55%,var(--gold-2));box-shadow:0 10px 24px -10px rgba(248,192,32,.7),inset 0 1px 0 rgba(255,255,255,.5);transition:transform .15s,filter .2s;}
.gate-btn:hover{filter:brightness(1.05);} .gate-btn:active{transform:scale(.98);} .gate-btn:disabled{opacity:.55;cursor:wait;}
.gate-err{min-height:1.3rem;margin:.8rem 0 0;font-size:.88rem;color:#ff9c8f;}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.gate-card.shake{animation:shake .32s;}
.gate-foot{position:relative;z-index:1;margin:2rem 0 0;font:500 .72rem var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:#7e9a89;text-align:center;}

/* ============ HERO ============ */
.hero{position:relative;background:linear-gradient(180deg,#0d2418 0%,#0a1c13 100%);color:#fff;text-align:center;padding:calc(env(safe-area-inset-top) + 2.6rem) 1.2rem 5.4rem;overflow:hidden;}
.hero::before{content:'';position:absolute;inset:0;background:var(--pattern);background-size:64px 64px;opacity:.07;}
.hero::after{content:'';position:absolute;left:50%;top:-120px;width:760px;height:560px;transform:translateX(-50%);background:radial-gradient(closest-side,rgba(248,192,32,.22),transparent);pointer-events:none;}
.hero>*{position:relative;z-index:1;}
.badge{width:132px;height:auto;display:block;margin:0 auto .5rem;filter:drop-shadow(0 12px 28px rgba(0,0,0,.5));animation:floaty 7s ease-in-out infinite;}
.hero-ar{font-family:var(--f-ar);font-size:1.6rem;color:var(--gold);}
.hero h1{font-family:var(--f-head);font-weight:900;font-size:clamp(2.3rem,9vw,3.8rem);line-height:1.05;margin:.1rem 0 .55rem;
  background:linear-gradient(180deg,#fff7dc 10%,#f3d98a 55%,#e2a812);-webkit-background-clip:text;background-clip:text;color:transparent;}
.hero-tag{font-family:var(--f-head);font-style:italic;color:#cfe0d3;font-size:1.02rem;margin:0 auto;max-width:34ch;line-height:1.5;}
.stats{display:flex;justify-content:center;flex-wrap:wrap;gap:.6rem;margin-top:1.5rem;}
.stat{font:500 .72rem var(--f-mono);letter-spacing:.07em;text-transform:uppercase;color:#e9dfba;padding:.5rem .85rem;border:1px solid rgba(248,192,32,.35);border-radius:999px;background:rgba(248,192,32,.08);backdrop-filter:blur(6px);}
.stat b{color:var(--gold);font-weight:500;}
.wave{position:absolute;left:0;right:0;bottom:-1px;width:100%;height:56px;color:var(--cream);z-index:2;display:block;}

/* ============ TOOLBAR ============ */
.toolbar{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--cream) 86%,transparent);-webkit-backdrop-filter:blur(16px) saturate(1.4);backdrop-filter:blur(16px) saturate(1.4);border-bottom:1px solid var(--line);padding:.8rem 0 .7rem;margin-top:-1px;}
.search{position:relative;}
.search svg{position:absolute;left:1rem;top:50%;transform:translateY(-50%);color:var(--ink-2);pointer-events:none;}
.search input{width:100%;font:500 1rem var(--f-body);padding:.85rem 1rem .85rem 2.9rem;border-radius:14px;border:1px solid var(--line);background:var(--paper);color:var(--ink);outline:none;box-shadow:0 2px 8px -4px rgba(13,36,24,.2);transition:border .2s,box-shadow .2s;}
.search input::placeholder{color:var(--ink-2);opacity:.75;}
.search input:focus{border-color:var(--gold-2);box-shadow:0 0 0 4px rgba(248,192,32,.2);}
.row{display:flex;align-items:center;gap:.5rem;margin-top:.6rem;min-width:0;}
html,body{max-width:100%;overflow-x:hidden;}
.row .seg{min-width:0;overflow-x:auto;scrollbar-width:none;}
.sel{max-width:6.2rem;min-width:0;}
.scroll{overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;}
.scroll::-webkit-scrollbar{display:none;}
.chip{flex:0 0 auto;font:600 .8rem var(--f-body);padding:.5rem .9rem;border-radius:999px;border:1px solid var(--line);background:var(--paper);color:var(--ink-2);cursor:pointer;transition:all .2s;white-space:nowrap;}
.chip:hover{border-color:var(--gold-2);color:var(--ink);}
.chip.on{background:var(--forest);border-color:var(--forest);color:var(--gold);box-shadow:0 6px 14px -8px rgba(13,36,24,.8);}
body[data-theme="ink"] .chip.on{background:var(--gold);color:#1d1503;border-color:var(--gold);}
.chip .n{opacity:.6;margin-left:.3rem;font-weight:500;}
.seg{display:inline-flex;padding:3px;border-radius:12px;background:var(--paper);border:1px solid var(--line);flex:0 0 auto;}
.seg button{white-space:nowrap;font:600 .74rem var(--f-body);padding:.4rem .6rem;border-radius:9px;border:none;background:none;color:var(--ink-2);cursor:pointer;transition:all .2s;}
.seg button.on{background:var(--forest);color:var(--gold);}
body[data-theme="ink"] .seg button.on{background:var(--gold);color:#1d1503;}
.grow{flex:1;}
.sel{font:600 .76rem var(--f-body);padding:.5rem .7rem;border-radius:10px;border:1px solid var(--line);background:var(--paper);color:var(--ink-2);}
.icon-btn{width:2.35rem;height:2.35rem;border-radius:10px;border:1px solid var(--line);background:var(--paper);color:var(--ink-2);display:grid;place-items:center;cursor:pointer;flex:0 0 auto;}
.icon-btn:hover{color:var(--ink);border-color:var(--gold-2);}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px;}

/* ============ SHELVES + CARDS ============ */
main{padding:1.8rem 0 1rem;min-height:40vh;}
.shelf{margin-bottom:2.8rem;}
.shelf-head{display:flex;align-items:baseline;gap:.6rem;flex-wrap:nowrap;min-width:0;}
.shelf-head .orn{width:11px;height:11px;transform:rotate(45deg);background:var(--cat);border-radius:2px;flex:0 0 auto;align-self:center;box-shadow:0 0 0 4px color-mix(in srgb,var(--cat) 18%,transparent);}
.shelf-head h2{font:700 clamp(1.15rem,5.2vw,1.65rem) var(--f-head);white-space:nowrap;margin:0;color:var(--ink);}
.shelf-head .ar{white-space:nowrap;font-family:var(--f-ar);font-size:1.1rem;color:var(--gold-2);}
.shelf-head .cnt{white-space:nowrap;margin-left:auto;font:500 .75rem var(--f-mono);color:var(--ink-2);}
.shelf-line{height:1px;margin:.7rem 0 .6rem;background:linear-gradient(90deg,var(--cat),transparent 70%);opacity:.5;}
.shelf-blurb{margin:0 0 1.2rem;color:var(--ink-2);font-size:.95rem;font-family:var(--f-head);font-style:italic;}
.grid{display:grid;grid-template-columns:1fr;gap:1.2rem;}
@media(min-width:720px){.grid{grid-template-columns:repeat(2,1fr);}}
@media(min-width:1060px){.grid{grid-template-columns:repeat(3,1fr);}}

.card{position:relative;display:flex;flex-direction:column;background:var(--paper);border:1px solid var(--line);border-radius:22px;overflow:hidden;box-shadow:var(--shadow);cursor:pointer;
  transition:transform .28s cubic-bezier(.2,.8,.2,1),box-shadow .28s;animation:rise .7s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*70ms);}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.card:hover{transform:translateY(-5px);box-shadow:0 26px 44px -20px rgba(13,36,24,.6);}
.card:active{transform:scale(.99);}
.art{position:relative;height:104px;background:linear-gradient(135deg,var(--c1),var(--c2));border-radius:21px 21px 0 0;overflow:visible;}
.art::before{content:'';position:absolute;inset:0;background:var(--pattern);background-size:56px 56px;opacity:.16;}
.art::after{content:'';position:absolute;right:-40px;top:-60px;width:200px;height:200px;border-radius:50%;background:radial-gradient(closest-side,rgba(255,255,255,.28),transparent);}
.medal{position:absolute;left:1.15rem;bottom:-28px;width:58px;height:58px;border-radius:18px;background:linear-gradient(145deg,#173d2b,var(--forest));border:2px solid var(--gold);display:grid;place-items:center;color:var(--gold);box-shadow:0 10px 20px -8px rgba(0,0,0,.6);z-index:2;}
.medal svg{width:26px;height:26px;}
.art-top{position:absolute;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:center;padding:.8rem .9rem;z-index:3;}
.fmt{font:500 .64rem var(--f-mono);letter-spacing:.09em;text-transform:uppercase;color:#fff;padding:.28rem .6rem;border-radius:999px;background:rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.28);backdrop-filter:blur(6px);}
.new{font:700 .62rem var(--f-body);letter-spacing:.12em;color:#241a02;padding:.28rem .6rem;border-radius:999px;background:linear-gradient(180deg,#ffd75a,var(--gold));box-shadow:0 4px 10px -4px rgba(0,0,0,.5);}
.pin{width:2rem;height:2rem;border-radius:50%;border:1px solid rgba(255,255,255,.3);background:rgba(0,0,0,.28);color:rgba(255,255,255,.75);display:grid;place-items:center;cursor:pointer;backdrop-filter:blur(6px);transition:all .2s;}
.pin:hover{color:#fff;transform:scale(1.08);}
.pin.on{color:#241a02;background:var(--gold);border-color:var(--gold);}
.pin svg{width:15px;height:15px;}
.left-top{display:flex;gap:.45rem;align-items:center;}
.body{padding:2.2rem 1.25rem .5rem;flex:1;}
.card h3{font:700 1.2rem/1.25 var(--f-head);margin:0 0 .5rem;color:var(--ink);}
.desc{margin:0 0 .9rem;color:var(--ink-2);font-size:.93rem;line-height:1.6;}
.facts{display:flex;flex-wrap:wrap;gap:.4rem;}
.fact{font:500 .7rem var(--f-body);color:var(--ink);padding:.28rem .62rem;border-radius:999px;background:color-mix(in srgb,var(--cat) 10%,transparent);border:1px solid color-mix(in srgb,var(--cat) 28%,transparent);}
.foot{display:flex;align-items:center;gap:.7rem;padding:1rem 1.25rem 1.2rem;}
.aud{display:flex;flex-direction:column;gap:.15rem;font:500 .66rem var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);}
.aud b{font-weight:500;color:var(--ink);} 
.open{margin-left:auto;display:inline-flex;align-items:center;gap:.5rem;font:700 .8rem var(--f-body);letter-spacing:.04em;padding:.65rem 1.05rem;border-radius:999px;border:none;cursor:pointer;color:#241a02;
  background:linear-gradient(180deg,#ffd75a,var(--gold) 55%,var(--gold-2));box-shadow:0 8px 18px -8px rgba(226,168,18,.9),inset 0 1px 0 rgba(255,255,255,.55);transition:transform .2s,filter .2s;}
.card:hover .open{filter:brightness(1.06);transform:translateX(2px);}
.open svg{width:15px;height:15px;transition:transform .25s;} .card:hover .open svg{transform:translateX(3px);}
.size{font:500 .68rem var(--f-mono);color:var(--ink-2);}
.empty{text-align:center;color:var(--ink-2);padding:3.5rem 1rem;font-family:var(--f-head);font-style:italic;font-size:1.1rem;}

footer{margin-top:2rem;background:linear-gradient(180deg,#0d2418,#08160e);color:#cbdccf;text-align:center;padding:2.6rem 1.2rem calc(env(safe-area-inset-bottom) + 2.2rem);position:relative;overflow:hidden;}
footer::before{content:'';position:absolute;inset:0;background:var(--pattern);background-size:64px 64px;opacity:.05;}
footer>*{position:relative;}
footer img{width:64px;margin:0 auto .7rem;display:block;}
.motto{font:italic 600 1.05rem var(--f-head);color:var(--gold-soft);margin:0 0 .4rem;}
.small{font:500 .68rem var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:#7e9a89;margin:0;}

/* ============ VIEWER ============ */
.viewer{position:fixed;inset:0;max-width:100vw;z-index:200;display:flex;flex-direction:column;background:var(--cream);animation:fade .25s both;}
.viewer[hidden]{display:none;}
@keyframes fade{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.v-head{display:flex;align-items:center;gap:.8rem;padding:calc(env(safe-area-inset-top) + .75rem) 1rem .75rem;background:linear-gradient(180deg,#0d2418,#0a1c13);border-bottom:1px solid rgba(248,192,32,.3);}
.v-title{flex:1;min-width:0;font:700 1.02rem var(--f-head);color:var(--gold-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.v-x{flex:0 0 auto;position:relative;z-index:3;width:2.4rem;height:2.4rem;border-radius:50%;border:1px solid rgba(248,192,32,.4);background:rgba(248,192,32,.08);color:var(--gold);display:grid;place-items:center;cursor:pointer;}
.v-x:hover{background:var(--gold);color:#1d1503;}
.v-body{position:relative;flex:1;background:#fff;}
.v-body iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff;}
.v-msg{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:.7rem;padding:2rem;background:var(--cream);color:var(--ink-2);}
.v-msg h4{font:700 1.3rem var(--f-head);color:var(--ink);margin:0;}
.v-msg code{font:500 .85rem var(--f-mono);background:rgba(248,192,32,.2);padding:.2rem .5rem;border-radius:6px;color:var(--ink);word-break:break-all;}
.spin{width:34px;height:34px;border-radius:50%;border:3px solid rgba(13,36,24,.15);border-top-color:var(--gold-2);animation:sp 1s linear infinite;}
@keyframes sp{to{transform:rotate(360deg)}}
.v-foot{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap;padding:.7rem 1rem calc(env(safe-area-inset-bottom) + .7rem);background:var(--paper);border-top:1px solid var(--line);}
.v-foot a,.v-foot button{font:700 .76rem var(--f-body);letter-spacing:.05em;text-transform:uppercase;padding:.65rem 1rem;border-radius:999px;text-decoration:none;cursor:pointer;border:1px solid var(--line);background:transparent;color:var(--ink);}
.v-foot a.primary{border:none;color:#241a02;background:linear-gradient(180deg,#ffd75a,var(--gold) 55%,var(--gold-2));}
.v-foot .hint{margin-left:auto;font:500 .66rem var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);}
@media(min-width:900px){.viewer{inset:2.2vh 3vw;border-radius:22px;overflow:hidden;box-shadow:0 40px 100px rgba(0,0,0,.55);}.viewer::before{content:'';position:fixed;inset:0;background:rgba(5,14,9,.7);z-index:-1;}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important;}}
</style>
</head>

<script>
(function(){
  var SALT='aman-library-v1:', HASH='fbf884ba9ee12099c65ebc90deb1f1fb86fa677192b3b9cff8e92b92583fb088', KEY='aman_lib_unlocked';
  function sha256(str){
    var bytes=unescape(encodeURIComponent(str)).split('').map(function(c){return c.charCodeAt(0);});
    var K=[],H=[1779033703,3144134277,1013904242,2773480762,1359893119,2600822924,528734635,1541459225],p=2,n=0;
    function isP(x){for(var i=2;i*i<=x;i++)if(x%i===0)return false;return true;}
    function fr(x){return((x-Math.floor(x))*4294967296)|0;}
    while(n<64){if(isP(p)){K[n++]=fr(Math.pow(p,1/3));}p++;}
    var l=bytes.length*8;bytes.push(128);while(bytes.length%64!==56)bytes.push(0);
    bytes.push(0,0,0,0,(l>>>24)&255,(l>>>16)&255,(l>>>8)&255,l&255);
    function rr(x,c){return(x>>>c)|(x<<(32-c));}
    for(var o=0;o<bytes.length;o+=64){
      var w=[],i;
      for(i=0;i<16;i++)w[i]=(bytes[o+i*4]<<24)|(bytes[o+i*4+1]<<16)|(bytes[o+i*4+2]<<8)|bytes[o+i*4+3];
      for(i=16;i<64;i++){var s0=rr(w[i-15],7)^rr(w[i-15],18)^(w[i-15]>>>3),s1=rr(w[i-2],17)^rr(w[i-2],19)^(w[i-2]>>>10);w[i]=(w[i-16]+s0+w[i-7]+s1)|0;}
      var a=H[0],b=H[1],c=H[2],d=H[3],e=H[4],f=H[5],g=H[6],h=H[7];
      for(i=0;i<64;i++){
        var S1=rr(e,6)^rr(e,11)^rr(e,25),ch=(e&f)^(~e&g),t1=(h+S1+ch+K[i]+w[i])|0;
        var S0=rr(a,2)^rr(a,13)^rr(a,22),mj=(a&b)^(a&c)^(b&c),t2=(S0+mj)|0;
        h=g;g=f;f=e;e=(d+t1)|0;d=c;c=b;b=a;a=(t1+t2)|0;
      }
      H[0]=(H[0]+a)|0;H[1]=(H[1]+b)|0;H[2]=(H[2]+c)|0;H[3]=(H[3]+d)|0;H[4]=(H[4]+e)|0;H[5]=(H[5]+f)|0;H[6]=(H[6]+g)|0;H[7]=(H[7]+h)|0;
    }
    return H.map(function(x){return('00000000'+(x>>>0).toString(16)).slice(-8);}).join('');
  }
  function unlock(){document.body.classList.add('unlocked');}
  try{ if(sessionStorage.getItem(KEY)===HASH){unlock();return;} }catch(e){}
  var form=document.getElementById('gateForm'),pw=document.getElementById('gatePw'),err=document.getElementById('gateErr'),btn=document.getElementById('gateBtn'),fails=0;
  form.addEventListener('submit',function(ev){
    ev.preventDefault();
    if(sha256(SALT+pw.value)===HASH){
      try{sessionStorage.setItem(KEY,HASH);}catch(e){}
      unlock();
    }else{
      fails++;err.textContent='Incorrect password.';pw.value='';
      form.classList.remove('shake');void form.offsetWidth;form.classList.add('shake');
      if(fails>=3){btn.disabled=true;var t=Math.min(30,fails*5);err.textContent='Incorrect. Wait '+t+'s…';
        setTimeout(function(){btn.disabled=false;err.textContent='';pw.focus();},t*1000);}
      else pw.focus();
    }
  });
})();

  { id:'web-site', cat:'web', icon:'globe', title:'AMAN School Website', fmt:'Website', href:'https://amanschoolmn.org/', local:false, size:'',
    desc:'The live public site — programs, enrollment, and contact for new families.',
    facts:['Live'], aud:['Parent'], sort:20260101, isNew:false },
];

const state={cat:null,aud:null,sort:'category',pins:new Set()};
const PIN_KEY='aman_lib_pins', THEME_KEY='aman_lib_theme';
try{JSON.parse(localStorage.getItem(PIN_KEY)||'[]').forEach(id=>{if(items.some(i=>i.id===id))state.pins.add(id);});}catch(e){}
const savePins=()=>{try{localStorage.setItem(PIN_KEY,JSON.stringify([...state.pins]));}catch(e){}};
const $=id=>document.getElementById(id);
const esc=t=>String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
const catOf=id=>categories.find(c=>c.id===id);
const itemOf=id=>items.find(i=>i.id===id);

function match(it,q){
  if(state.aud && !it.aud.includes(state.aud)) return false;
  if(!q) return true;
  return [it.title,it.desc,it.fmt,catOf(it.cat).label,it.facts.join(' '),it.aud.join(' ')].join(' ').toLowerCase().includes(q.toLowerCase());
}

function cardHTML(it,i){
  const c=catOf(it.cat), pinned=state.pins.has(it.id);
  return `<article class="card" data-open="${it.id}" tabindex="0" role="button" aria-label="Open ${esc(it.title)}" style="--cat:${c.c};--c1:${c.c1};--c2:${c.c2};--i:${i}">
    <div class="art">
      <div class="art-top">
        <div class="left-top"><button class="pin${pinned?' on':''}" data-pin="${it.id}" aria-label="Pin ${esc(it.title)}" aria-pressed="${pinned}">${STAR}</button>${it.isNew?'<span class="new">NEW</span>':''}</div>
        <span class="fmt">${esc(it.fmt)}</span>
      </div>
      <div class="medal">${svg(it.icon)}</div>
    </div>
    <div class="body">
      <h3>${it.title}</h3>
      <p class="desc">${it.desc}</p>
      <div class="facts">${it.facts.map(f=>`<span class="fact">${esc(f)}</span>`).join('')}</div>
    </div>
    <div class="foot">
      <div class="aud"><span>For</span><b>${esc(it.aud.join(' · '))}</b></div>
      <span class="size">${it.size?esc(it.size):''}</span>
      <button class="open" tabindex="-1">${it.local?'Open':'Visit'} ${ARROW}</button>
    </div>
  </article>`;
}

function sorted(list){
  if(state.sort==='newest') return [...list].sort((a,b)=>b.sort-a.sort||a.title.localeCompare(b.title));
  if(state.sort==='az') return [...list].sort((a,b)=>a.title.localeCompare(b.title));
  return list;
}

function shelf(head,list,startIdx=0){
  const el=document.createElement('section'); el.className='shelf';
  el.innerHTML=head+`<div class="grid">${list.map((it,i)=>cardHTML(it,startIdx+i)).join('')}</div>`;
  return el;
}

function render(){
  const q=$('q').value.trim(), box=$('library'); box.innerHTML='';
  let total=0, idx=0;
  const pinned=items.filter(i=>state.pins.has(i.id)&&match(i,q));
  if(pinned.length){
    total+=pinned.length;
    box.appendChild(shelf(`<div class="shelf-head" style="--cat:#e2a812"><span class="orn"></span><h2>Pinned</h2><span class="cnt">${pinned.length}</span></div><div class="shelf-line" style="--cat:#e2a812"></div>`,sorted(pinned),idx)); idx+=pinned.length;
  }
  const rest=items.filter(i=>!state.pins.has(i.id)&&(!state.cat||i.cat===state.cat)&&match(i,q));
  if(state.sort!=='category'){
    if(rest.length){total+=rest.length; box.appendChild(shelf('',sorted(rest),idx));}
  } else {
    categories.forEach(c=>{
      const list=rest.filter(i=>i.cat===c.id); if(!list.length) return;
      total+=list.length;
      box.appendChild(shelf(`<div class="shelf-head" style="--cat:${c.c}"><span class="orn"></span><h2>${c.label}</h2><span class="ar" lang="ar" dir="rtl">${c.ar}</span><span class="cnt">${list.length}</span></div><div class="shelf-line" style="--cat:${c.c}"></div>${c.blurb&&!q?`<p class="shelf-blurb">${c.blurb}</p>`:''}`,list,idx)); idx+=list.length;
    });
  }
  if(!total) box.innerHTML=`<p class="empty">Nothing matches${q?` “${esc(q)}”`:''}. Try another word, or clear the filters.</p>`;
  wire(box);
}

function wire(box){
  box.querySelectorAll('[data-open]').forEach(el=>{
    const go=()=>openItem(itemOf(el.getAttribute('data-open')));
    el.addEventListener('click',go);
    el.addEventListener('keydown',e=>{if(e.target===el&&(e.key==='Enter'||e.key===' ')){e.preventDefault();go();}});
  });
  box.querySelectorAll('[data-pin]').forEach(b=>b.addEventListener('click',e=>{
    e.stopPropagation(); const id=b.getAttribute('data-pin');
    state.pins.has(id)?state.pins.delete(id):state.pins.add(id); savePins(); render();
  }));
}

/* ---------- viewer ---------- */
async function reachable(url){
  try{ const r=await fetch(url,{method:'HEAD',cache:'no-store'}); return r.ok; }
  catch(e){ return true; }              // offline / file:// — let the iframe try
}
async function openItem(it){
  if(!it.local){ window.open(it.href,'_blank','noopener'); return; }
  const v=$('viewer'), body=$('vBody'); $('vTitle').textContent=it.title;
  const big=parseFloat(it.size)>=3;
  body.innerHTML=`<div class="v-msg"><div class="spin"></div><span>Loading${big?' — large file, give it a moment':''}…</span></div>`;
  $('vFoot').innerHTML=`<a class="primary" href="${esc(it.href)}" target="_blank" rel="noopener">Open in new tab</a><button id="vPrint">Print / Save PDF</button><span class="hint">${esc(it.aud.join(' · '))}</span>`;
  v.hidden=false; document.body.style.overflow='hidden';
  if(!(await reachable(it.href))){
    body.innerHTML=`<div class="v-msg"><h4>This file isn’t in the library folder yet</h4><span>Upload it next to <code>index.html</code> with exactly this name:</span><code>${esc(it.href)}</code></div>`;
    $('vPrint').style.display='none'; return;
  }
  const f=document.createElement('iframe'); f.title=it.title; f.setAttribute('allow','fullscreen'); f.setAttribute('allowfullscreen','');
  f.addEventListener('load',()=>{const m=body.querySelector('.v-msg'); if(m) m.remove();});
  f.src=it.href; body.appendChild(f);
  $('vPrint').addEventListener('click',()=>{try{f.contentWindow.focus();f.contentWindow.print();}catch(e){window.open(it.href,'_blank','noopener');}});
}
function closeViewer(){ $('vBody').innerHTML=''; $('viewer').hidden=true; document.body.style.overflow=''; }
$('vClose').addEventListener('click',closeViewer);
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&!$('viewer').hidden) closeViewer();
  if(e.key==='/'&&document.activeElement.id!=='q'&&$('viewer').hidden){e.preventDefault();$('q').focus();}
});

/* ---------- controls ---------- */
function chips(){
  const row=$('shelves'); row.innerHTML='';
  const mk=(label,count,id)=>{const b=document.createElement('button');b.className='chip'+(state.cat===id?' on':'');b.innerHTML=`${label}<span class="n">${count}</span>`;b.onclick=()=>{state.cat=id;chips();render();};row.appendChild(b);};
  mk('All',items.length,null); categories.forEach(c=>mk(c.short,items.filter(i=>i.cat===c.id).length,c.id));
  const seg=$('aud'); seg.innerHTML='';
  [['Everyone',null],['Teachers','Teacher'],['Students','Student'],['Parents','Parent']].forEach(([l,v])=>{
    const b=document.createElement('button'); b.textContent=l; b.className=state.aud===v?'on':''; b.onclick=()=>{state.aud=v;chips();render();}; seg.appendChild(b);
  });
}
$('q').addEventListener('input',render);
$('sort').addEventListener('change',e=>{state.sort=e.target.value;render();});
function setTheme(t){document.body.setAttribute('data-theme',t);$('theme').innerHTML=t==='ink'?SUN:MOON;try{localStorage.setItem(THEME_KEY,t);}catch(e){}}
$('theme').addEventListener('click',()=>setTheme(document.body.getAttribute('data-theme')==='ink'?'parchment':'ink'));
let t0='parchment'; try{t0=localStorage.getItem(THEME_KEY)||'parchment';}catch(e){}
setTheme(t0);

const files=items.filter(i=>i.local).length;
$('stats').innerHTML=`<span class="stat"><b>${files}</b> files</span><span class="stat"><b>${categories.length-1}</b> shelves</span><span class="stat">Updated <b>${UPDATED}</b></span>`;
chips(); render();
</script>
</body>
</html>
