<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AMAN Library — Central Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;0,900;1,600&family=Crimson+Pro:ital,wght@0,400;0,500;0,600;1,400&family=Amiri:wght@400;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --forest:#1a4a35;
    --forest-dark:#0f2e21;
    --gold:#b8872a;
    --gold-light:#d9ad55;
    --parchment:#f4ead6;
    --parchment-dark:#e9dcc0;
    --card-top:#fffaee;
    --card-bot:#f8efd8;
    --ink:#2b241c;
    --ink-soft:#5c5142;
    --c-web:#8a6316;
    --c-curriculum:#1a4a35;
    --c-admin:#6b2737;
    --c-recognition:#204a4e;
    --c-ops:#3d3159;
    --c-brand:#7a4520;
  }

  body[data-theme="ink"]{
    --parchment:#0f2e21;
    --parchment-dark:#0b2419;
    --card-top:#163b29;
    --card-bot:#12301f;
    --ink:#f4ead6;
    --ink-soft:#c9b98e;
  }

  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:
      radial-gradient(ellipse at top, rgba(184,135,42,.10), transparent 55%),
      var(--parchment);
    color:var(--ink);
    font-family:'Crimson Pro', serif;
    -webkit-font-smoothing:antialiased;
    transition:background .25s ease,color .25s ease;
  }

  .page{max-width:920px;margin:0 auto;padding:0 1.1rem 3rem;}

  /* ---------- Hero ---------- */
  .hero{padding-top:2.4rem;}
  .hero-frame{
    position:relative;
    text-align:center;
    padding:1.6rem 1rem 1.8rem;
    border-top:1px solid rgba(184,135,42,.4);
    border-bottom:1px solid rgba(184,135,42,.4);
  }
  .hero-frame::before,.hero-frame::after{
    content:'';
    position:absolute;
    width:8px;height:8px;
    background:var(--gold);
    transform:translateX(-50%) rotate(45deg);
    left:50%;
  }
  .hero-frame::before{top:-4.5px;}
  .hero-frame::after{bottom:-4.5px;}

  .hero-logo-row{display:flex;align-items:center;justify-content:center;gap:.9rem;flex-wrap:wrap;}
  .logo-slot{
    width:64px;height:64px;border-radius:50%;
    overflow:hidden;
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;position:relative;
    box-shadow:0 1px 4px rgba(43,36,28,.25);
  }
  .logo-slot img{width:100%;height:100%;object-fit:cover;display:block;}
  .hero-titleblock{text-align:left;}
  @media (max-width:520px){ .hero-titleblock{text-align:center;width:100%;} }

  .eyebrow-ar{
    display:block;
    font-family:'Amiri',serif;
    font-size:1.3rem;
    color:var(--gold);
    margin-bottom:.2rem;
    letter-spacing:.02em;
  }
  .hero-title{
    font-family:'Playfair Display',serif;
    font-weight:700;
    font-size:2.35rem;
    margin:0;
    color:var(--forest-dark);
    letter-spacing:.01em;
  }
  body[data-theme="ink"] .hero-title{color:var(--gold-light);}
  .hero-sub{
    font-style:italic;
    color:var(--ink-soft);
    font-size:1rem;
    margin:.4rem 0 0;
    max-width:34ch;
  }
  .hero-meta{
    font-family:'DM Mono',monospace;
    font-size:.7rem;
    letter-spacing:.06em;
    text-transform:uppercase;
    color:var(--ink-soft);
    margin:.9rem 0 0;
    text-align:center;
  }

  /* ---------- Toolbar ---------- */
  .toolbar{
    position:sticky;
    top:0;
    z-index:20;
    background:color-mix(in srgb, var(--parchment) 92%, transparent);
    backdrop-filter:blur(6px);
    padding:1rem 0 .8rem;
    margin-top:1.4rem;
    border-bottom:1px solid rgba(184,135,42,.25);
  }
  .search-input{
    width:100%;
    font-family:'Crimson Pro',serif;
    font-size:1rem;
    padding:.7rem .9rem;
    border:1px solid rgba(184,135,42,.45);
    border-radius:3px;
    background:var(--card-top);
    color:var(--ink);
    outline:none;
  }
  .search-input::placeholder{color:var(--ink-soft);opacity:.7;}
  .search-input:focus-visible{border-color:var(--gold);box-shadow:0 0 0 3px rgba(184,135,42,.18);}

  .chip-row{
    display:flex;
    gap:.5rem;
    overflow-x:auto;
    margin-top:.7rem;
    padding-bottom:.15rem;
    scrollbar-width:none;
  }
  .chip-row::-webkit-scrollbar{display:none;}
  .chip{
    flex:0 0 auto;
    font-family:'DM Mono',monospace;
    font-size:.72rem;
    letter-spacing:.04em;
    text-transform:uppercase;
    padding:.4rem .75rem;
    border-radius:20px;
    border:1px solid rgba(43,36,28,.25);
    background:transparent;
    color:var(--ink-soft);
    cursor:pointer;
  }
  .chip.active{
    background:var(--chip-color,var(--forest));
    border-color:var(--chip-color,var(--forest));
    color:#fdf6e6;
  }
  .chip:focus-visible{outline:2px solid var(--gold-light);outline-offset:2px;}

  .control-row{
    display:flex;
    align-items:center;
    gap:.5rem;
    flex-wrap:wrap;
    margin-top:.7rem;
  }
  .ctl-select{
    font-family:'DM Mono',monospace;
    font-size:.68rem;
    letter-spacing:.04em;
    text-transform:uppercase;
    padding:.4rem .55rem;
    border-radius:20px;
    border:1px solid rgba(43,36,28,.25);
    background:transparent;
    color:var(--ink-soft);
  }
  .ctl-btn{
    font-family:'DM Mono',monospace;
    font-size:.68rem;
    letter-spacing:.04em;
    text-transform:uppercase;
    padding:.4rem .65rem;
    border-radius:20px;
    border:1px solid rgba(43,36,28,.25);
    background:transparent;
    color:var(--ink-soft);
    cursor:pointer;
  }
  .ctl-btn.active{background:var(--gold);border-color:var(--gold);color:#2b1f06;}
  .ctl-btn.primary{background:var(--forest);border-color:var(--forest);color:#fdf6e6;}
  .ctl-btn:focus-visible,.ctl-select:focus-visible{outline:2px solid var(--gold-light);outline-offset:2px;}
  .pin-indicator{
    margin-left:auto;
    font-family:'DM Mono',monospace;
    font-size:.65rem;
    color:var(--ink-soft);
  }

  /* ---------- Setup note ---------- */
  .setup-note{
    margin-top:1rem;
    font-size:.9rem;
    color:var(--ink-soft);
    border:1px dashed rgba(184,135,42,.5);
    border-radius:4px;
    padding:.15rem .9rem;
    background:rgba(184,135,42,.05);
  }
  .setup-note summary{
    cursor:pointer;
    padding:.6rem 0;
    font-family:'DM Mono',monospace;
    font-size:.72rem;
    letter-spacing:.05em;
    text-transform:uppercase;
    color:var(--forest-dark);
  }
  body[data-theme="ink"] .setup-note summary{color:var(--gold-light);}
  .setup-note p{margin:.2rem 0 .9rem;line-height:1.55;}
  .setup-note code{
    background:rgba(184,135,42,.15);
    padding:.1rem .35rem;
    border-radius:3px;
    font-family:'DM Mono',monospace;
    font-size:.85em;
  }

  /* ---------- Library ---------- */
  #library{opacity:0;transition:opacity .5s ease;margin-top:1.6rem;}
  body.loaded #library{opacity:1;}

  .cat-section{margin-bottom:2.4rem;}
  .cat-heading{
    display:flex;
    align-items:baseline;
    gap:.6rem;
    margin-bottom:.9rem;
    border-bottom:1px solid rgba(43,36,28,.15);
    padding-bottom:.5rem;
  }
  .cat-dot{
    width:9px;height:9px;border-radius:50%;
    background:var(--cat-color);
    flex:0 0 auto;
  }
  .cat-title{
    font-family:'Playfair Display',serif;
    font-weight:600;
    font-size:1.2rem;
    color:var(--ink);
    margin:0;
  }
  .cat-ar{
    font-family:'Amiri',serif;
    color:var(--ink-soft);
    font-size:1rem;
    margin-left:.1rem;
  }
  .cat-count{
    margin-left:auto;
    font-family:'DM Mono',monospace;
    font-size:.72rem;
    color:var(--ink-soft);
  }

  .card-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(250px,1fr));
    gap:.9rem;
  }

  .card{
    background:linear-gradient(180deg,var(--card-top),var(--card-bot));
    border:1px solid rgba(43,36,28,.14);
    border-left:4px solid var(--cat-color);
    border-radius:4px;
    padding:.85rem 1rem .95rem;
    box-shadow:0 1px 2px rgba(43,36,28,.06);
    transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease;
    position:relative;
  }
  .card:hover{transform:translateY(-2px);box-shadow:0 8px 18px rgba(43,36,28,.14);}

  .card-click{cursor:pointer;}
  .card-click:focus-visible{outline:2px solid var(--gold-light);outline-offset:2px;border-radius:3px;}

  .card-top{display:flex;justify-content:space-between;align-items:center;gap:.4rem;margin-bottom:.5rem;}
  .card-top-left{display:flex;align-items:center;gap:.4rem;}
  .card-code{
    font-family:'DM Mono',monospace;
    font-size:.68rem;
    letter-spacing:.05em;
    color:var(--cat-color);
  }
  .new-badge{
    font-family:'DM Mono',monospace;
    font-size:.58rem;
    letter-spacing:.04em;
    color:#fff;
    background:var(--gold);
    padding:.05rem .35rem;
    border-radius:3px;
  }
  .uploaded-badge{
    font-family:'DM Mono',monospace;font-size:.58rem;
    color:var(--forest);border:1px solid rgba(26,74,53,.35);
    border-radius:3px;padding:.03rem .35rem;
  }
  body[data-theme="ink"] .uploaded-badge{color:#6fcf97;border-color:rgba(111,207,151,.4);}

  .pin-btn{
    border:none;background:none;cursor:pointer;
    font-size:1rem;line-height:1;padding:0;
    color:rgba(43,36,28,.3);
    position:relative;z-index:2;
  }
  .pin-btn.pinned{color:var(--gold);}
  .pin-btn:focus-visible{outline:2px solid var(--gold-light);outline-offset:2px;}

  .status-pill{
    font-family:'DM Mono',monospace;
    font-size:.6rem;
    letter-spacing:.05em;
    padding:.18rem .45rem;
    border-radius:20px;
    border:1px solid currentColor;
  }
  .status-online{color:var(--forest);}
  body[data-theme="ink"] .status-online{color:#6fcf97;}
  .status-local{color:var(--gold);}

  .card-title{
    font-family:'Playfair Display',serif;
    font-weight:600;
    font-size:1.03rem;
    margin:0 0 .3rem;
    color:var(--ink);
  }
  .card-desc{
    font-size:.9rem;
    line-height:1.45;
    color:var(--ink-soft);
    margin:0 0 .7rem;
  }
  .card-bottom{display:flex;justify-content:space-between;align-items:center;gap:.5rem;}
  .format-tag{
    font-family:'DM Mono',monospace;
    font-size:.63rem;
    letter-spacing:.04em;
    text-transform:uppercase;
    color:var(--ink-soft);
    border:1px solid rgba(43,36,28,.2);
    border-radius:3px;
    padding:.15rem .4rem;
  }
  .card-right{display:flex;align-items:center;gap:.5rem;}
  .copy-btn,.upload-btn{
    font-family:'DM Mono',monospace;
    font-size:.6rem;
    letter-spacing:.04em;
    text-transform:uppercase;
    color:var(--forest);
    background:none;border:1px solid rgba(26,74,53,.35);
    border-radius:3px;padding:.15rem .4rem;cursor:pointer;
    position:relative;z-index:2;
  }
  body[data-theme="ink"] .copy-btn,body[data-theme="ink"] .upload-btn{color:#6fcf97;border-color:rgba(111,207,151,.4);}
  .card-arrow{color:var(--cat-color);font-size:1.05rem;}

  .pinned-heading .cat-dot{background:var(--gold);}
  .pinned-heading .cat-title{color:var(--gold);}

  .empty-state{
    text-align:center;
    color:var(--ink-soft);
    font-style:italic;
    padding:2.5rem 1rem;
  }

  /* ---------- Checklist view ---------- */
  .checklist-intro{font-size:.9rem;color:var(--ink-soft);margin:0 0 1.1rem;line-height:1.5;}
  .checklist-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:.5rem;}
  .checklist-item{
    display:flex;align-items:flex-start;gap:.6rem;
    background:linear-gradient(180deg,var(--card-top),var(--card-bot));
    border:1px solid rgba(43,36,28,.14);
    border-left:4px solid var(--cat-color);
    border-radius:4px;padding:.6rem .8rem;
  }
  .checklist-item input{margin-top:.3rem;accent-color:var(--gold);width:16px;height:16px;flex-shrink:0;}
  .checklist-item.done .cl-title{text-decoration:line-through;opacity:.55;}
  .cl-title{font-family:'Playfair Display',serif;font-weight:600;font-size:.95rem;color:var(--ink);}
  .cl-path{font-family:'DM Mono',monospace;font-size:.72rem;color:var(--ink-soft);display:block;margin-top:.1rem;}

  /* ---------- Viewer modal ---------- */
  .viewer-modal{position:fixed;inset:0;z-index:100;background:rgba(15,20,15,.75);backdrop-filter:blur(3px);}
  .viewer-modal[hidden]{display:none;}
  .viewer-panel{background:var(--parchment);width:100%;height:100%;display:flex;flex-direction:column;}
  @media (min-width:720px){
    .viewer-panel{width:92%;height:90%;margin:5% auto;border-radius:6px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.4);}
  }
  .viewer-header{display:flex;align-items:center;gap:.6rem;padding:.7rem 1rem;border-bottom:1px solid rgba(184,135,42,.3);background:var(--card-top);}
  .viewer-title{font-family:'Playfair Display',serif;font-weight:600;font-size:1rem;flex:1;color:var(--ink);}
  .viewer-close{background:none;border:none;font-size:1.4rem;line-height:1;cursor:pointer;color:var(--ink-soft);padding:.2rem .5rem;}
  .viewer-close:focus-visible{outline:2px solid var(--gold-light);}
  .viewer-body{flex:1;overflow:auto;background:#fff;position:relative;}
  .viewer-body iframe{width:100%;height:100%;border:none;display:block;}
  .viewer-msg{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:.9rem;padding:2rem;text-align:center;color:var(--ink-soft);background:var(--parchment);}
  .viewer-msg a.dl{background:var(--forest);color:#fdf6e6;padding:.6rem 1.1rem;border-radius:4px;text-decoration:none;font-family:'DM Mono',monospace;font-size:.8rem;}
  .viewer-footer{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center;padding:.6rem 1rem;border-top:1px solid rgba(184,135,42,.3);background:var(--card-top);}
  .viewer-footer a,.viewer-footer button{
    font-family:'DM Mono',monospace;font-size:.68rem;letter-spacing:.04em;text-transform:uppercase;
    padding:.4rem .7rem;border-radius:20px;border:1px solid rgba(43,36,28,.25);
    background:transparent;color:var(--ink-soft);cursor:pointer;text-decoration:none;
  }
  .viewer-hint{font-size:.68rem;color:var(--ink-soft);margin-left:auto;font-family:'DM Mono',monospace;max-width:220px;}

  /* ---------- Footer ---------- */
  .page-footer{
    text-align:center;
    margin-top:2.5rem;
    padding-top:1.5rem;
    border-top:1px solid rgba(184,135,42,.3);
  }
  .tagline{
    font-family:'Playfair Display',serif;
    font-style:italic;
    color:var(--forest-dark);
    font-size:.95rem;
    margin:0 0 .3rem;
  }
  body[data-theme="ink"] .tagline{color:var(--gold-light);}
  .footer-small{
    font-family:'DM Mono',monospace;
    font-size:.65rem;
    letter-spacing:.04em;
    color:var(--ink-soft);
    margin:0;
  }

  @media (max-width:480px){
    .hero-title{font-size:1.9rem;}
  }

  @media (prefers-reduced-motion:reduce){
    *{transition:none!important;animation:none!important;scroll-behavior:auto!important;}
  }

  /* ---------- Password gate ---------- */
  body:not(.unlocked) .page,body:not(.unlocked) .viewer-modal{display:none!important;}
  .gate{position:fixed;inset:0;z-index:1000;display:flex;align-items:center;justify-content:center;padding:1.2rem;
    background:radial-gradient(ellipse at top,rgba(184,135,42,.14),transparent 55%),var(--parchment-dark,#e9dcc0);}
  body.unlocked .gate{display:none;}
  .gate-card{width:100%;max-width:360px;text-align:center;padding:2rem 1.4rem 1.6rem;
    background:linear-gradient(180deg,var(--card-top),var(--card-bot));
    border:1px solid rgba(184,135,42,.45);border-radius:6px;box-shadow:0 12px 40px rgba(43,36,28,.2);}
  .gate-ar{font-family:'Amiri',serif;font-size:1.4rem;color:var(--gold);display:block;margin-bottom:.1rem;}
  .gate-title{font-family:'Playfair Display',serif;font-weight:700;font-size:1.6rem;margin:0 0 .3rem;color:var(--forest-dark);}
  .gate-sub{font-style:italic;color:var(--ink-soft);font-size:.95rem;margin:0 0 1.2rem;}
  .gate-input{width:100%;font-family:'Crimson Pro',serif;font-size:1.05rem;padding:.7rem .9rem;text-align:center;
    border:1px solid rgba(184,135,42,.45);border-radius:3px;background:#fffdf6;color:#2b241c;outline:none;}
  .gate-input:focus-visible{border-color:var(--gold);box-shadow:0 0 0 3px rgba(184,135,42,.18);}
  .gate-btn{margin-top:.8rem;width:100%;font-family:'DM Mono',monospace;font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;
    padding:.7rem;border-radius:3px;border:1px solid var(--forest);background:var(--forest);color:#fdf6e6;cursor:pointer;}
  .gate-btn:disabled{opacity:.6;cursor:wait;}
  .gate-err{min-height:1.2rem;margin:.7rem 0 0;font-size:.85rem;color:#8a2b2b;font-family:'DM Mono',monospace;}
  @keyframes gate-shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
  .gate-card.shake{animation:gate-shake .3s;}

  /* ---------- Library v2 ---------- */
  .chip-row.aud{margin-top:.5rem;}
  .chip-label{flex:0 0 auto;align-self:center;font-family:'DM Mono',monospace;font-size:.62rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft);opacity:.75;}
  .meta-row{display:flex;flex-wrap:wrap;gap:.3rem;margin:0 0 .7rem;}
  .meta-pill{font-family:'DM Mono',monospace;font-size:.6rem;letter-spacing:.03em;color:var(--cat-color);border:1px solid currentColor;border-radius:20px;padding:.1rem .45rem;opacity:.9;}
  body[data-theme="ink"] .meta-pill{color:var(--gold-light);}
  .aud-tags{font-family:'DM Mono',monospace;font-size:.6rem;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-soft);}
  .size-tag{font-family:'DM Mono',monospace;font-size:.6rem;color:var(--ink-soft);}
  .cat-intro{margin:-.4rem 0 .9rem;font-size:.9rem;color:var(--ink-soft);font-style:italic;}
  .viewer-footer .spacer{flex:1;}
</style>
</head>
<body>
<div class="gate" id="gate">
  <form class="gate-card" id="gateForm" autocomplete="off">
    <span class="gate-ar" lang="ar" dir="rtl">مكتبة أمان</span>
    <h1 class="gate-title">AMAN Library</h1>
    <p class="gate-sub">Staff access only. Enter the password to continue.</p>
    <input type="password" class="gate-input" id="gatePw" placeholder="Password" aria-label="Password" autocomplete="current-password" autofocus>
    <button type="submit" class="gate-btn" id="gateBtn">Unlock</button>
    <p class="gate-err" id="gateErr" role="alert"></p>
  </form>
</div>
<script>
(function(){
  var SALT='aman-library-v1:', HASH='fbf884ba9ee12099c65ebc90deb1f1fb86fa677192b3b9cff8e92b92583fb088', KEY='aman_lib_unlocked';
  function sha256(str){
    var bytes=unescape(encodeURIComponent(str)).split('').map(function(c){return c.charCodeAt(0);});
    var K=[],H=[1779033703,3144134277,1013904242,2773480762,1359893119,2600822924,528734635,1541459225],p=2,n=0;
    function isP(x){for(var i=2;i*i<=x;i++)if(x%i===0)return false;return true;}
    function fr(x){return((x-Math.floor(x))*4294967296)|0;}
    while(n<64){if(isP(p)){K[n++]=fr(Math.pow(p,1/3));}p++;}
    var l=bytes.length*8;bytes.push(128);while(bytes.length%64!==56)bytes.push(0);
    bytes.push(0,0,0,0,(l>>>24)&255,(l>>>16)&255,(l>>>8)&255,l&255);
    function rr(x,c){return(x>>>c)|(x<<(32-c));}
    for(var o=0;o<bytes.length;o+=64){
      var w=[],i;
      for(i=0;i<16;i++)w[i]=(bytes[o+i*4]<<24)|(bytes[o+i*4+1]<<16)|(bytes[o+i*4+2]<<8)|bytes[o+i*4+3];
      for(i=16;i<64;i++){var s0=rr(w[i-15],7)^rr(w[i-15],18)^(w[i-15]>>>3),s1=rr(w[i-2],17)^rr(w[i-2],19)^(w[i-2]>>>10);w[i]=(w[i-16]+s0+w[i-7]+s1)|0;}
      var a=H[0],b=H[1],c=H[2],d=H[3],e=H[4],f=H[5],g=H[6],h=H[7];
      for(i=0;i<64;i++){
        var S1=rr(e,6)^rr(e,11)^rr(e,25),ch=(e&f)^(~e&g),t1=(h+S1+ch+K[i]+w[i])|0;

      if(!query) return true;
      const q = query.toLowerCase();
      return [item.title,item.desc,item.format,catById(item.category).label,item.stats.join(' '),item.aud.join(' ')].join(' ').toLowerCase().includes(q);
    }
    return false;
  }

  /* ---------------- viewer ---------------- */
  function openViewer(item){
    if(!item.isLocal){ window.open(item.href,'_blank','noopener'); return; }
    const modal = document.getElementById('viewerModal');
    document.getElementById('viewerTitle').textContent = item.title;
    const body = document.getElementById('viewerBody');
    body.innerHTML = `<div class="viewer-msg">Loading…${parseFloat(item.size)>=3?'<br>This is a large file — give it a moment.':''}</div>`;
    const frame = document.createElement('iframe');
    frame.title = item.title;
    frame.addEventListener('load', ()=>{ const m = body.querySelector('.viewer-msg'); if(m) m.remove(); });
    frame.src = item.href;
    body.appendChild(frame);
    const footer = document.getElementById('viewerFooter');
    footer.innerHTML = `<a href="${esc(item.href)}" target="_blank" rel="noopener">Open in new tab</a>
      <button type="button" id="viewerPrint">Print / Save PDF</button>
      <span class="spacer"></span>
      <span class="viewer-hint">${esc(item.aud.join(' · '))}</span>`;
    document.getElementById('viewerPrint').addEventListener('click', ()=>{
      try{ frame.contentWindow.focus(); frame.contentWindow.print(); }
      catch(e){ window.open(item.href,'_blank','noopener'); }
    });
    modal.hidden = false;
    document.body.style.overflow = 'hidden';
  }
  function closeViewer(){
    document.getElementById('viewerBody').innerHTML = '';
    document.getElementById('viewerModal').hidden = true;
    document.body.style.overflow = '';
  }

  /* ---------------- rendering ---------------- */
  function cardHTML(item, cat, idx){
    const num = String(idx+1).padStart(2,'0');
    const pinned = state.pinned.has(item.id);
    return `
      <div class="card" style="--cat-color:${cat.color}">
        <div class="card-click" data-open="${item.id}" role="button" tabindex="0">
          <div class="card-top">
            <div class="card-top-left">
              <button type="button" class="pin-btn${pinned?' pinned':''}" data-pin="${item.id}" aria-label="Pin ${esc(item.title)}" aria-pressed="${pinned}">★</button>
              <span class="card-code">${cat.code}·${num}</span>
              ${item.isNew ? '<span class="new-badge">NEW</span>' : ''}
            </div>
            <span class="format-tag">${esc(item.format)}</span>
          </div>
          <h3 class="card-title">${item.title}</h3>
          <p class="card-desc">${item.desc}</p>
          <div class="meta-row">${item.stats.map(t=>`<span class="meta-pill">${esc(t)}</span>`).join('')}</div>
        </div>
        <div class="card-bottom">
          <span class="aud-tags">${esc(item.aud.join(' · '))}</span>
          <div class="card-right">
            ${item.size ? `<span class="size-tag">${esc(item.size)}</span>` : '<span class="size-tag">opens site</span>'}
            <span class="card-arrow" aria-hidden="true">→</span>
          </div>
        </div>
      </div>`;
  }

  function sortItems(items){
    if(state.sort === 'newest') return [...items].sort((a,b)=>b.dateSort-a.dateSort || a.title.localeCompare(b.title));
    if(state.sort === 'az') return [...items].sort((a,b)=>a.title.localeCompare(b.title));
    return items;
  }

  function wireCards(container){
    container.querySelectorAll('[data-open]').forEach(el=>{
      const open = ()=>openViewer(itemById(el.getAttribute('data-open')));
      el.addEventListener('click', open);
      el.addEventListener('keydown', (e)=>{ if(e.target===el && (e.key==='Enter'||e.key===' ')){ e.preventDefault(); open(); } });
    });
    container.querySelectorAll('[data-pin]').forEach(btn=>{
      btn.addEventListener('click', (e)=>{
        e.preventDefault(); e.stopPropagation();
        const id = btn.getAttribute('data-pin');
        if(state.pinned.has(id)) state.pinned.delete(id); else state.pinned.add(id);
        savePins(); render(); updatePinIndicator();
      });
    });
  }

  function section(headingHTML, items, cat){
    const el = document.createElement('section');
    el.className = 'cat-section';
    el.innerHTML = `${headingHTML}<div class="card-grid">${items.map((it,i)=>cardHTML(it,cat||catById(it.category),i)).join('')}</div>`;
    return el;
  }

  function render(){
    const query = document.getElementById('searchInput').value.trim();
    const container = document.getElementById('library');
    container.innerHTML = '';
    let total = 0;

    const pinnedItems = libraryItems.filter(i=>state.pinned.has(i.id) && matches(i,query));
    if(pinnedItems.length){
      total += pinnedItems.length;
      container.appendChild(section(`<div class="cat-heading pinned-heading"><span class="cat-dot"></span><h2 class="cat-title">Pinned</h2><span class="cat-count">${pinnedItems.length}</span></div>`, sortItems(pinnedItems)));
    }

    const rest = libraryItems.filter(i=>!state.pinned.has(i.id)
      && (!state.activeCategory || i.category===state.activeCategory) && matches(i,query));

    if(state.sort !== 'category'){
      if(rest.length){ total += rest.length; container.appendChild(section('', sortItems(rest))); }
    } else {
      categories.forEach(cat=>{
        const items = rest.filter(i=>i.category===cat.id);
        if(!items.length) return;
        total += items.length;
        const head = `<div class="cat-heading" style="--cat-color:${cat.color}">
            <span class="cat-dot"></span><h2 class="cat-title">${cat.label}</h2>
            <span class="cat-ar" lang="ar" dir="rtl">${cat.arabic}</span><span class="cat-count">${items.length}</span></div>`
          + (cat.blurb && !query ? `<p class="cat-intro">${cat.blurb}</p>` : '');
        container.appendChild(section(head, items, cat));
      });
    }
    if(!total){
      container.innerHTML = `<p class="empty-state">Nothing matches${query?` "${esc(query)}"`:''}. Try a different word, or clear the filters.</p>`;
    }
    wireCards(container);
  }

  function updatePinIndicator(){
    document.getElementById('pinIndicator').textContent = state.pinned.size ? `${state.pinned.size} pinned` : '';
  }

  function makeChip(row, label, onPick, isActive, color){
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'chip' + (isActive ? ' active' : '');
    btn.textContent = label;
    if(color) btn.style.setProperty('--chip-color', color);
    btn.addEventListener('click', ()=>{
      row.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));
      btn.classList.add('active');
      onPick(); render();
    });
    row.appendChild(btn);
  }

  function buildChips(){
    const row = document.getElementById('chipRow');
    makeChip(row,'All',()=>{state.activeCategory=null;},true);
    categories.forEach(c=>makeChip(row,c.label.split(' ')[0].replace('&',''),()=>{state.activeCategory=c.id;},false,c.color));
    const aud = document.getElementById('audRow');
    const lab = document.createElement('span'); lab.className='chip-label'; lab.textContent='For'; aud.appendChild(lab);
    makeChip(aud,'Everyone',()=>{state.activeAud=null;},true);
    audiences.forEach(a=>makeChip(aud,a+'s',()=>{state.activeAud=a;},false));
  }

  /* ---------------- wiring ---------------- */
  document.getElementById('viewerClose').addEventListener('click', closeViewer);
  document.getElementById('viewerModal').addEventListener('click', (e)=>{ if(e.target.id==='viewerModal') closeViewer(); });
  document.addEventListener('keydown', (e)=>{
    if(e.key==='Escape' && !document.getElementById('viewerModal').hidden) closeViewer();
    if(e.key==='/' && document.activeElement.id!=='searchInput' && document.getElementById('viewerModal').hidden){
      e.preventDefault(); document.getElementById('searchInput').focus();
    }
  });
  document.getElementById('searchInput').addEventListener('input', render);
  document.getElementById('sortSelect').addEventListener('change', (e)=>{ state.sort = e.target.value; render(); });
  document.getElementById('themeToggle').addEventListener('click', function(){
    const isInk = document.body.getAttribute('data-theme') === 'ink';
    document.body.setAttribute('data-theme', isInk ? 'parchment' : 'ink');
    this.classList.toggle('active', !isInk);
    this.textContent = isInk ? 'Ink Mode' : 'Parchment Mode';
  });

  const fileCount = libraryItems.filter(i=>i.isLocal).length;
  document.getElementById('heroMeta').textContent = `Updated ${lastUpdated} · ${fileCount} files across ${categories.length-1} shelves`;

  buildChips();
  render();
  updatePinIndicator();
  requestAnimationFrame(()=>document.body.classList.add('loaded'));
</script>
</body>
</html>
