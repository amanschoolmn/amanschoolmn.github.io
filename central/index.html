/* ================= MODULE: ADMINISTRATION — OPERATIONAL CONTROL CENTER ================= */
function famKey(s){ if(s.family) return s.family;
  const m=s.name.match(/(?: بن | بنت )(.+)$/); return m? m[1].trim() : ''; }
function famList(){ // auto-derived families from patronymics + overrides
  const map={};
  DB.data.students.forEach(s=>{ const k=famKey(s)||'__solo_'+s.id;
    (map[k]=map[k]||{key:k, solo:!famKey(s), members:[]}).members.push(s); });
  return Object.values(map).sort((a,b)=>b.members.length-a.members.length);
}
function famRec(key){ return DB.data.families[key]=DB.data.families[key]||{phone:'', note:'', log:[]}; }
function famPlan(key){ return DB.data.finance.plans[key]=DB.data.finance.plans[key]||{monthly:0, rateMode:'auto', perStudentRate:null, regFee:0, regPaid:false, start:today().slice(0,7), note:''}; }
function famActiveCount(key){ return DB.data.students.filter(s=>s.active!==false && famKey(s)===key).length; }
function famEffectiveMonthly(key, activeCount){
  const p=famPlan(key);
  if(p.rateMode==='manual') return p.monthly||0;
  const rate=(p.perStudentRate!=null && p.perStudentRate>0)? p.perStudentRate : (DB.data.settings.defaultTuitionRate||0);
  return rate*(activeCount==null?famActiveCount(key):activeCount);
}
function monthsBetween(a, b){ // 'YYYY-MM' inclusive count
  const [ay,am]=a.split('-').map(Number), [by,bm]=b.split('-').map(Number);
  return Math.max(0,(by-ay)*12+(bm-am)+1);
}
function famFinance(key){
  const p=famPlan(key); const pays=DB.data.finance.payments.filter(x=>x.fam===key);
  const activeCount=famActiveCount(key);
  const monthly=famEffectiveMonthly(key, activeCount);
  const paid=pays.filter(x=>x.kind!=='excused').reduce((a,x)=>a+(+x.amount||0),0);
  const nowM=today().slice(0,7);
  const excusedMonths=new Set(pays.filter(x=>x.kind==='excused').map(x=>x.date.slice(0,7)));
  let expected=0;
  if(monthly>0 && p.start){
    const totalMonths=monthsBetween(p.start, nowM);
    expected += Math.max(0, totalMonths-excusedMonths.size)*monthly;
  }
  if(p.regFee>0 && !p.regPaid) expected += p.regFee;
  const paidThisMonth=pays.filter(x=>x.date.slice(0,7)===nowM && x.kind!=='registration' && x.kind!=='excused').reduce((a,x)=>a+(+x.amount||0),0);
  const excusedThisMonth=excusedMonths.has(nowM);
  const monthStatus = excusedThisMonth?'Excused' : monthly>0? (paidThisMonth>=monthly?'Paid':paidThisMonth>0?'Partial':'Due') : '—';
  return {plan:p, pays:pays.sort((a,b)=>b.date.localeCompare(a.date)), paid, expected, balance:Math.max(0,expected-paid),
    monthStatus, paidThisMonth, monthly, activeCount, excusedMonths};
}
const TUITION_MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function famMonthMatrix(key, year){
  const p=famPlan(key); const pays=DB.data.finance.payments.filter(x=>x.fam===key);
  const monthly=famEffectiveMonthly(key);
  const nowM=today().slice(0,7);
  const months=[];
  for(let m=1;m<=12;m++){
    const ym=year+'-'+String(m).padStart(2,'0');
    let status;
    if(p.start && ym<p.start) status='before';
    else if(ym>nowM) status='future';
    else {
      const monthPays=pays.filter(x=>x.date.slice(0,7)===ym);
      if(monthPays.some(x=>x.kind==='excused')) status='excused';
      else {
        const sum=monthPays.filter(x=>x.kind!=='registration').reduce((a,x)=>a+(+x.amount||0),0);
        status = monthly>0 && sum>=monthly ? 'paid' : sum>0 ? 'partial' : 'unpaid';
      }
    }
    months.push({m, label:TUITION_MONTHS[m-1], ym, status});
  }
  return months;
}
function regComplete(s){ // registration completeness per student
  const missing=[];
  if(!s.dob) missing.push('DOB'); if(!s.guardians||!s.guardians.length) missing.push('guardian');
  if(!s.guardians||!s.guardians.some(g=>g.phone)) missing.push('phone'); if(!s.emergencyContacts||!s.emergencyContacts.length) missing.push('emergency contact');
  if(!s.photo) missing.push('photo');
  return missing;
}

    }).join('');

     <div class="kpis" style="margin-bottom:16px">
       ${[['🎓',act.length,'Active students','#/students'],
          ['👪',fams.filter(f=>!f.solo).length+(fams.some(f=>f.solo)?'+':''),'Families','#/tuition/families'],
          ['💵',(collected?'$'+collected:'—'),'Collected · '+nowM,'#/tuition/overview'],
          ['🧾',(outstanding?'$'+outstanding:'$0'),'Outstanding','#/tuition/overview'],
          ['☑️',openT.length,'Open tasks','#/admin/tasks'],

         .map(([i,val,lab,go])=>`<button class="kpi-card" data-go="${go}"><span class="ki">${i}</span><b style="font-size:17px">${val}</b><span>${lab}</span></button>`).join('')}</div>
     <div class="grid g2">
      <div class="widget wfull"><div class="whead"><h3>⚡ Administrative attention</h3><span class="tag ${items.length?'tag-gold':'tag-green'}">${items.length||'all clear'}</span></div>
        ${items.length? groupedHtml
        :'<p style="font-family:var(--f-body);color:var(--ok)">The office is in order, al-ḥamdu lillāh.</p>'}</div>
      <div class="widget"><div class="whead"><h3>Upcoming</h3><button class="btn btn-ghost btn-sm" data-go="#/admin/calendar">Calendar →</button></div>

  /* ---------- ENROLLMENT ---------- */
  enroll(el){
    const d=DB.data, tdy=today();
    const act=d.students.filter(s=>s.active!==false && !(s.startDate&&s.startDate>tdy));
    const incoming=d.students.filter(s=>s.active!==false && s.startDate&&s.startDate>tdy);
    const gone=d.students.filter(s=>s.active===false);
    const withMiss = act.map(s=>({s, miss:regComplete(s)}));
    const done = withMiss.filter(x=>!x.miss.length);
    const incomplete = withMiss.filter(x=>x.miss.length);
    // shared row: icon + name (+optional date tag), missing/complete tags
    // always wrap onto their own line via .rowtags — this is what was
    // breaking on phones: a long "starts <date>" tag getting squeezed into
    // an unreadable circle, and a "missing: …" string running off-screen.
    const stuRow = (s, dateTag, miss, okLabel)=> `<div class="wrow-wrap ${miss.length?'frow':''}" data-go="#/students/${s.id}">
      <span>${miss.length?(dateTag?'🌱':'📋'):'✅'}</span>
      <span class="t">${esc(s.name)}${dateTag?' · '+esc(s.level):''}</span>
      ${dateTag||''}
      <div class="rowtags">${miss.length? miss.map(m=>`<span class="tag tag-gold">${esc(m)}</span>`).join('') : `<span class="tag tag-green">${okLabel}</span>`}</div>
    </div>`;
    el.innerHTML = `<div class="grid g3" style="margin-bottom:16px">
      <div class="widget"><div class="whead"><h3>Enrolled</h3></div><div class="kpi">${act.length}</div></div>
      <div class="widget"><div class="whead"><h3>Records complete</h3></div><div class="kpi">${done.length}<small>of ${act.length}</small></div></div>
      <div class="widget"><div class="whead"><h3>Incoming</h3></div><div class="kpi">${incoming.length}<small>${incoming[0]?'start '+fmtDate(incoming[0].startDate):'none scheduled'}</small></div></div></div>
     ${incoming.length?`<div class="sect">Incoming students<span class="rule"></span></div>
      <div class="wlist" style="margin-bottom:14px">${incoming.map(s=>stuRow(s, `<span class="tag tag-blue">starts ${fmtDate(s.startDate)}</span>`, regComplete(s), 'record complete ✓')).join('')}</div>`:''}
     <div class="sect">Registration completeness<span class="rule"></span><span style="font-size:11.5px;color:var(--ink3);font-weight:400">tap a student to complete their record</span></div>
     ${incomplete.length? `<div class="wlist">${incomplete.map(x=>stuRow(x.s, null, x.miss, 'complete')).join('')}</div>`
       : `<div class="empty"><div class="big">✅</div><h3>Every active record is complete</h3><p>DOB, guardian, phone, emergency contact, and photo are all on file, mā shāʾ Allāh.</p></div>`}
     ${done.length? `<details style="margin-top:${incomplete.length?'10px':'0'}" class="no-print"><summary style="cursor:pointer;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink3);font-weight:700">✓ Complete · ${done.length}</summary><div class="wlist" style="margin-top:8px">${done.map(x=>stuRow(x.s, null, x.miss, 'complete')).join('')}</div></details>`:''}
     ${gone.length?`<div class="sect">Withdrawn<span class="rule"></span></div>
      <div class="wlist">${gone.map(s=>`<div class="wrow" data-go="#/students/${s.id}"><span>🚪</span><span class="t">${esc(s.name)} · ${esc(s.level)}</span><span class="m">records kept</span></div>`).join('')}</div>`:''}
     <p style="font-size:12px;color:var(--ink3);margin-top:14px">Waiting list: planned for the online-registration version (v7 roadmap) — not built as an empty shell.</p>`;
    wireCommon(el);
  },

        ${e.checklist.length?`<div class="wlist">${e.checklist.map((c,i)=>`<div class="wrow" style="cursor:default"><input type="checkbox" ${c.done?'checked':''} data-ck="${e.id}_${i}" style="width:auto"><span class="t" style="${c.done?'text-decoration:line-through;opacity:.6':''}">${esc(c.text)}</span><button class="btn btn-ghost btn-sm" data-ckdel="${e.id}_${i}">✕</button></div>`).join('')}</div>`:''}
        <div class="field" style="margin-top:8px"><label>Post-event notes</label><textarea data-ef="postNotes" placeholder="what went well · what to change next time">${esc(e.postNotes||'')}</textarea></div>

      </div>`; };
    el.innerHTML = `<div style="display:flex;justify-content:flex-end;margin-bottom:12px" class="no-print"><button class="btn btn-p btn-sm" id="evAdd">＋ Add event</button></div>

     ${past.length?`<div class="sect">Past<span class="rule"></span></div><div>${past.slice(-6).map(row).join('')}</div>`:''}`;

  /* ---------- TASKS (priority · category · links) ---------- */
  tasks(el){
    const d=DB.data;
    const PR={High:0,Normal:1,Low:2};
    const tdy=today();
    const weekOut=new Date(Date.now()+7*864e5).toISOString().slice(0,10);
    const open=d.tasks.filter(t=>!t.done), done=d.tasks.filter(t=>t.done);
    const overdue=open.filter(t=>t.due&&t.due<tdy);
    const dueToday=open.filter(t=>t.due===tdy);
    const thisWeek=open.filter(t=>t.due&&t.due>tdy&&t.due<=weekOut);
    const later=open.filter(t=>t.due&&t.due>weekOut);
    const noDue=open.filter(t=>!t.due);
    const sortP=(a,b)=>(PR[a.pri||'Normal']-PR[b.pri||'Normal'])||String(a.due||'9').localeCompare(String(b.due||'9'));
    [overdue,dueToday,thisWeek,later,noDue].forEach(g=>g.sort(sortP));
    const high=open.filter(t=>t.pri==='High').length;
    const row = t=>{
      const link = t.link? (t.link[0]==='s'? d.students.find(s=>s.id===t.link.slice(2)) : DB.res(t.link.slice(2))) : null;
      return `<div class="card" style="margin-bottom:8px;display:flex;align-items:center;gap:11px;flex-wrap:wrap;${t.done?'opacity:.5':''}">
       <input type="checkbox" ${t.done?'checked':''} data-tk="${t.id}" aria-label="Mark '${esc(t.text)}' done" style="width:auto">
       <span style="flex:1;min-width:150px;${t.done?'text-decoration:line-through':''}">${esc(t.text)}</span>
       ${t.pri==='High'?'<span class="tag tag-red">high</span>':t.pri==='Low'?'<span class="tag tag-dim">low</span>':''}
       ${t.cat&&t.cat!=='General'?`<span class="tag tag-blue">${esc(t.cat)}</span>`:''}
       ${link?`<button class="chip" data-go="${t.link[0]==='s'?'#/students/':'#/resource/'}${esc(t.link.slice(2))}">${t.link[0]==='s'?'🎓':'📄'} ${esc((link.name||link.title).slice(0,22))}</button>`:''}
       ${t.due?`<span class="tag ${t.due<today()&&!t.done?'tag-red':'tag-dim'}">${fmtDate(t.due)}</span>`:''}
       <button class="btn btn-ghost btn-sm" data-del="${t.id}">✕</button></div>`; };
    const groups=[['Overdue',overdue,'var(--bad)'],['Today',dueToday,'var(--gold-text)'],['This Week',thisWeek,'var(--ink3)'],['Later',later,'var(--ink3)'],['No due date',noDue,'var(--ink3)']];
    el.innerHTML = `<div class="kpis" style="margin-bottom:16px">${[
       ['☐',open.length,'Open tasks'],['⏰',overdue.length,'Overdue'],['🔴',high,'High priority'],['✅',done.length,'Completed']]
       .map(([i,val,lab])=>`<div class="kpi-card" style="cursor:default"><span class="ki">${i}</span><b style="font-size:18px">${val}</b><span>${lab}</span></div>`).join('')}</div>
     <div class="card" style="margin-bottom:16px"><label>New task</label>
      <div style="display:flex;gap:8px;flex-wrap:wrap"><input id="tk-t" placeholder="What needs doing?" aria-label="Task description" style="flex:2;min-width:180px">
       <select id="tk-p" aria-label="Priority" style="max-width:110px"><option>Normal</option><option>High</option><option>Low</option></select>
       <select id="tk-c" aria-label="Category" style="max-width:140px">${['General','Tuition','Enrollment','Communication','Facility','Event'].map(c=>`<option>${c}</option>`).join('')}</select>
       <input id="tk-d" type="date" aria-label="Due date" style="max-width:150px"><button class="btn btn-p" id="tk-add">Add</button></div>
      <div class="field" style="margin-top:9px;margin-bottom:0"><label>Link (optional)</label>
       <select id="tk-l"><option value="">— none —</option>
        <optgroup label="Students">${d.students.filter(s=>s.active!==false).map(s=>`<option value="s:${s.id}">${esc(s.name)}</option>`).join('')}</optgroup>
        <optgroup label="Resources">${d.resources.slice(0,40).map(r=>`<option value="r:${r.id}">${esc(r.title.slice(0,40))}</option>`).join('')}</optgroup></select></div></div>
     ${groups.map(([label,list,color])=> list.length? `<div style="margin:16px 0 8px"><b style="font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:${color}">${label} · ${list.length}</b></div><div class="wlist">${list.map(row).join('')}</div>` : '').join('')}
     ${done.length? `<details style="margin-top:18px" class="no-print"><summary style="cursor:pointer;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink3);font-weight:700">Completed · ${done.length}</summary><div class="wlist" style="margin-top:10px">${done.map(row).join('')}</div></details>` : ''}
     ${!d.tasks.length?'<div class="empty"><p>No tasks.</p></div>':''}`;
    wireCommon(el);
    $('#tk-add',el).onclick=()=>{ const t=$('#tk-t',el).value.trim(); if(!t)return;
      d.tasks.unshift({id:uid(), text:t, due:$('#tk-d',el).value, done:false, pri:$('#tk-p',el).value, cat:$('#tk-c',el).value, link:$('#tk-l',el).value||''});
      DB.log('Task added: '+t); DB.save(); Router.render(); };
    $$('input[data-tk]',el).forEach(c=>c.onchange=()=>{ const t=d.tasks.find(x=>x.id===c.dataset.tk); t.done=c.checked; DB.save(); Router.render(); });
    $$('button[data-del]',el).forEach(b=>b.onclick=()=>{ d.tasks=d.tasks.filter(x=>x.id!==b.dataset.del); DB.save(); Router.render(); });
  },

    const card=$('#pr-card',o), wrap=$('#prCardWrap',o), frame=$('#prStageFrame',o);

      const btn = $('#prDownload',o), origLabel = btn.textContent;
      btn.textContent = 'Generating\u2026'; btn.disabled = true;
      try {
        // useCORS pairs with the crossorigin="anonymous" on the Google Fonts
        // <link> in <head>. A hard timeout below means a stuck render can
        // never leave the button on "Generating\u2026" forever with no way
        // out \u2014 if PNG export doesn't finish in 15s, fail loudly and
        // point at Print/PDF, which uses the browser's own print pipeline
        // instead of trying to redraw the page in a canvas, so it doesn't
        // share any of html2canvas's font/filter/CORS limitations.
        const timeout = new Promise((_,rej)=>setTimeout(()=>rej(new Error('timed out after 15s')), 15000));
        const canvas = await Promise.race([html2canvas(card, {scale:2, backgroundColor:null, useCORS:true}), timeout]);
        const slug = (($('#pr-student',o).value||'reminder')).replace(/[^a-z0-9]+/gi,'_');

          try {
            const url = URL.createObjectURL(blob);
            // Try the automatic download first (works on desktop and most
            // Android browsers) \u2014 but iOS Safari can silently ignore a
            // programmatic download click once the async render above has
            // spent its "user activation" window, with no error to catch.
            // Since that failure is invisible, always surface a real,
            // tappable link plus the image itself right after, so there's a
            // path that works even when the automatic one doesn't.
            const auto = document.createElement('a');
            auto.href = url; auto.download = filename;
            document.body.appendChild(auto); auto.click(); document.body.removeChild(auto);
            $('#prResultImg',o).src = url;
            const link = $('#prResultLink',o);
            link.href = url; link.download = filename;
            $('#prResult',o).style.display = 'block';
            if($('#prResult',o).scrollIntoView) $('#prResult',o).scrollIntoView({behavior:'smooth', block:'nearest'});
          } catch(e2) {
            console.error('Flyer result display failed:', e2);
            toast('Image generated, but showing it failed \u2014 try again');
          }
        }, 'image/png');
        DB.log('Generated payment reminder flyer \u2014 '+famKey);
      } catch(e) {
        btn.textContent = origLabel; btn.disabled = false;
        console.error('Flyer PNG generation failed:', e);
        toast('Could not generate the image \u2014 try "Print / Save as PDF" instead, it always works');
      }
    };
    $('#prPrint',o).onclick=()=>{
      // Reuses the app's own printWindow() pipeline \u2014 the same one every
      // letter and report already goes through successfully \u2014 instead of
      // trying to redraw the page into a canvas, so it doesn't depend on
      // html2canvas at all and can't hit any of its limitations. Pulls the
      // .pr- rules straight from this page's own stylesheet so the printed
      // version can never drift out of sync with what's on screen.
      const css = extractCssRules('.pr-') + '\nbody{margin:0;padding:28px;display:flex;justify-content:center;background:#fff}'
        + "\n@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Amiri:ital,wght@0,400;0,700;1,400&display=swap');";
      printWindow('AMAN Payment Reminder \u2014 '+famKey, css, card.outerHTML);
      DB.log('Printed payment reminder flyer \u2014 '+famKey);
    };
    $('#prCopyTxt',o).onclick=()=>{
      const d = { student:$('#pr-student',o).value, period:$('#pr-period',o).value, due:$('#pr-due',o).value, amount:$('#pr-amount',o).value, cashapp:$('#pr-cashapp',o).value, zelle:$('#pr-zelle',o).value };

      if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(()=>toast('Copied to clipboard'));
      else toast('Could not copy \u2014 select the text manually');
    };
    renderCard();
    if(document.fonts && document.fonts.ready) document.fonts.ready.then(fitCard);
  },

       <div class="field"><label>Date</label><input id="py-d" type="date" value="${prefillYM?prefillYM+'-01':today()}"></div></div>
      <div id="py-method-wrap" class="field"><label>Method</label><select id="py-m"><option value="">\u2014</option><option>Zelle</option><option>CashApp</option><option>Cash</option><option>Check</option><option>Other</option></select></div>
      <div class="field"><label>Note (optional)</label><input id="py-n" placeholder="covers August \u00b7 reason if excused"></div>
      <div class="mfoot"><button class="btn btn-o" data-x="c">Cancel</button><button class="btn btn-p" data-x="s">Record</button></div></div>`,true);
    const kindSel=$('#py-k',o), amtInput=$('#py-a',o), dateInput=$('#py-d',o), hint=$('#py-a-hint',o);
    let amtDirty=false;
    amtInput.addEventListener('input', ()=>{ amtDirty=true; });
    // Auto-calculates the amount so all that's usually left to do is pick a
    // payment method — tuition defaults to whatever's still owed for that
    // month (monthly rate minus anything already logged), not just the flat
    // rate, so it's correct even for a family that's partway through paying.
    // Still fully editable — typing over it just stops the auto-fill from
    // overwriting what you typed until you switch type or hit Cancel/Record.
    const autoAmount=()=>{
      const kind=kindSel.value;
      if(kind==='registration'){
        const fee=famPlan(fam).regFee||0;
        hint.textContent = fee>0 ? 'Registration fee on file' : '';
        return fee>0 ? fee : '';
      }
      if(kind==='tuition'){
        const ym=(dateInput.value||today()).slice(0,7);
        const monthly=famEffectiveMonthly(fam);
        const already=DB.data.finance.payments.filter(x=>x.fam===fam && x.date.slice(0,7)===ym && x.kind!=='registration' && x.kind!=='excused').reduce((a,x)=>a+(+x.amount||0),0);
        const remaining=Math.max(0, monthly-already);
        if(monthly<=0){ hint.textContent='No tuition rate set for this family — check Overview.'; return ''; }
        hint.textContent = already>0 ? `$${monthly} monthly \u2212 $${already} already logged for ${ym}` : `$${monthly}/month for this family`;
        return remaining>0 ? remaining : monthly;
      }
      hint.textContent='';
      return '';
    };
    const syncMode=()=>{ const ex=kindSel.value==='excused';
      $('#py-amt-wrap',o).style.display=ex?'none':'grid'; $('#py-method-wrap',o).style.display=ex?'none':'block';
      if(!ex){ amtDirty=false; amtInput.value=autoAmount(); } };
    kindSel.onchange=syncMode;
    dateInput.onchange=()=>{ if(!amtDirty && kindSel.value==='tuition') amtInput.value=autoAmount(); };
    syncMode();
    $('[data-x=c]',o).onclick=()=>o.remove();
    $('[data-x=s]',o).onclick=()=>{
      const kind=kindSel.value;
      const payDate=$('#py-d',o).value;
      if(kind==='excused'){
        const note=$('#py-n',o).value.trim(); if(!note){toast('Add a brief reason');return;}
        DB.data.finance.payments.push({id:uid(), fam, amount:0, date:payDate, kind:'excused', note, method:''});
        DB.log('Excused \u2014 family '+fam+': '+note);
        DB.save(); o.remove(); toast('Marked excused'); Router.render(); return;
      }
      const a=+$('#py-a',o).value; if(!a){toast('Enter the amount');return;}
      DB.data.finance.payments.push({id:uid(), fam, amount:a, date:payDate, kind, note:$('#py-n',o).value.trim(), method:$('#py-m',o).value});
      if(kind==='registration') famPlan(fam).regPaid=true;
      DB.log('Payment recorded \u2014 $'+a+' from family '+fam);
      DB.save(); o.remove(); toast('$'+a+' recorded'); Router.render(); };
  },
};


/* ================= MODULE: ADMISSIONS — APPLICATION PIPELINE ================= */
// 7-step AMAN admissions process:
// 1) Submit Student Application (website)  2) Application Review  3) Waiting List (if full)
// 4) Mandatory Parent Interview  5) Parent Agreement Form  6) Acceptance Decision
// (Accepted / Waiting List / Not a Fit Right Now)  7) Enrollment Confirmation & Class Placement
const ADM_STAGES = [
  {id:'review',     label:'Application Review'},
  {id:'interview',  label:'Parent Interview'},
  {id:'agreement',  label:'Parent Agreement'},
  {id:'decision',   label:'Acceptance Decision'},
  {id:'enrollment', label:'Enrollment Confirmation'},
];
const ADM_STAGE_ORDER = ADM_STAGES.map(s=>s.id);
const ADM_STAGE_LABEL = Object.fromEntries(ADM_STAGES.map(s=>[s.id,s.label]));
function admNextStage(cur){ const i=ADM_STAGE_ORDER.indexOf(cur); return (i<0||i>=ADM_STAGE_ORDER.length-1)? null : ADM_STAGE_ORDER[i+1]; }
function admLog(a,text){ a.log = a.log||[]; a.log.unshift({date:today(), text}); }
function admWaitlistPos(a){
  const wl = DB.data.admissions.filter(x=>x.stage==='waitlist').sort((x,y)=>(x.waitlistSince||'').localeCompare(y.waitlistSince||''));
  const i = wl.findIndex(x=>x.id===a.id); return i<0? null : i+1;
}
function admStageDisplay(a){
  if(a.stage==='waitlist') return 'Waiting List';
  if(a.stage==='notfit') return 'Not a Fit Right Now';
  if(a.stage==='enrolled') return 'Enrolled';
  if(a.stage==='enrollment') return a.decision==='accepted' ? 'Accepted — Ready to Enroll' : ADM_STAGE_LABEL.enrollment;
  return ADM_STAGE_LABEL[a.stage] || a.stage;
}
function admStageTagClass(a){
  if(a.stage==='waitlist') return 'tag-gold';
  if(a.stage==='notfit') return 'tag-red';
  if(a.stage==='enrolled' || a.stage==='enrollment') return 'tag-green';
  if(a.stage==='decision') return 'tag-stage-decision';
  if(a.stage==='interview') return 'tag-stage-interview';
  if(a.stage==='agreement') return 'tag-stage-agreement';
  return 'tag-stage-review';
}
function admPhaseKey(a){
  if(a.stage==='waitlist') return 'waitlist';
  if(a.stage==='notfit') return 'notfit';
  if(a.stage==='enrolled' || a.stage==='enrollment') return 'accepted';
  if(a.stage==='decision') return 'decision';
  if(a.stage==='interview') return 'interview';
  if(a.stage==='agreement') return 'agreement';
  return 'review';
}
function admSectHeader(phaseKey, label, count){
  return `<div class="sect" id="sect-${phaseKey}"><span class="sect-dot" data-phase="${phaseKey}"></span>${esc(label)}<span class="rule"></span><span style="font-family:var(--f-mono);font-size:12px;color:var(--ink3);font-weight:400">${count}</span></div>`;
}
let admLastMoved = null;
function admSetStage(a, stage, note){
  a.stage = stage;
  if(stage==='waitlist' && !a.waitlistSince) a.waitlistSince = today();
  admLog(a, note || ('Moved to '+admStageDisplay(a)));
  DB.log('Admissions: '+a.studentName+' → '+admStageDisplay(a));
  DB.save();
  admLastMoved = a.id;
}
function admBtnRow(a, list){ return list.map(([label,act])=>`<button class="btn btn-o btn-sm" data-adm="${a.id}" data-act="${act}">${esc(label)}</button>`).join(''); }
function admProfileActions(a){
  if(a.stage==='review')     return admBtnRow(a,[['✓ Advance to Interview','adv'],['🕒 Waitlist','wl'],['✕ Not a Fit','nf']]);
  if(a.stage==='interview')  return admBtnRow(a,[['✓ Interview Done → Agreement','adv'],['🕒 Waitlist','wl'],['✕ Not a Fit','nf']]);
  if(a.stage==='agreement')  return admBtnRow(a,[['✓ Agreement Signed → Decision','adv'],['🕒 Waitlist','wl'],['✕ Not a Fit','nf']]);
  if(a.stage==='decision')   return admBtnRow(a,[['✓ Accept','accept'],['🕒 Waitlist','wl'],['✕ Not a Fit','nf']]);
  if(a.stage==='enrollment') return admBtnRow(a,[['🎓 Enroll Student','enroll'],['💳 Payment Received','paid']]);
  if(a.stage==='waitlist')   return admBtnRow(a,[['↩ Resume → Interview','resume'],['✕ Not a Fit','nf']]);
  if(a.stage==='notfit')     return admBtnRow(a,[['↺ Reopen (Reapply)','reopen']]);
  if(a.stage==='enrolled')   return `<button class="btn btn-o btn-sm" data-go="#/students/${esc(a.enrolledStudentId)}">View in Roster →</button>`;
  return '';
}
function admField(label, val){
  return `<div><label style="display:block;font-size:11px;font-weight:600;color:var(--ink3);text-transform:uppercase;letter-spacing:.03em;margin-bottom:2px">${esc(label)}</label><div style="font-size:14px">${val? esc(val) : '<span style="color:var(--ink3)">—</span>'}</div></div>`;
}
function admAgeDays(a){
  const since=(a.log&&a.log[0]&&a.log[0].date)||a.submitted||today();
  return Math.max(0, Math.round((new Date(today())-new Date(since))/864e5));
}
function agingBadge(days){
  if(days==null) return '';
  const cls = days>=8?'tag-red':days>=4?'tag-gold':'tag-dim';
  return `<span class="tag ${cls}" title="${days} day${days===1?'':'s'} since the last stage change — nothing has moved on this application" style="margin-left:4px">${days}d</span>`;
}
function admCard(a){
  const siblings = DB.data.admissions.filter(x=>x.appId===a.appId && x.id!==a.id);
  const lastLog = (a.log&&a.log[0]) || null;
  const wlPos = a.stage==='waitlist'? admWaitlistPos(a) : null;
  const ageDays = ['notfit','enrolled'].includes(a.stage)? null : admAgeDays(a);
  const stageTag = `<span class="tag ${admStageTagClass(a)}">${esc(admStageDisplay(a))}${wlPos?' #'+wlPos:''}</span>${agingBadge(ageDays)}`;
  const justMoved = a.id===admLastMoved;
  if(justMoved) admLastMoved = null;
  const phase = admPhaseKey(a);
  const initial = (a.studentName||'?').trim().charAt(0).toUpperCase() || '?';
  const meta = [a.studentAge?a.studentAge+' yrs':'', a.studentGender||'', a.parentName?'Parent: '+a.parentName:''].filter(Boolean).join(' · ');
  const healthNote = (a.health && !/^(n\/a|none)$/i.test(a.health.trim())) ? 'Health: '+a.health : '';
  const allergyNote = (a.allergy && !/^(n\/a|none|no)$/i.test(a.allergy.trim())) ? 'Allergies: '+a.allergy+(a.allergyDetail?' ('+a.allergyDetail+')':'') : '';
  const healthFlagText = [healthNote, allergyNote].filter(Boolean).join(' · ');
  return `<div class="card${justMoved?' just-moved':''}" data-phase="${phase}" style="display:flex;flex-direction:column;gap:8px">
    <div style="cursor:pointer;display:flex;gap:10px;align-items:flex-start" data-go="#/admissions/${a.id}">
      <div class="adm-avatar" data-phase="${phase}">${esc(initial)}</div>
      <div style="min-width:0;flex:1">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px"><b style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(a.studentName)||'(unnamed)'}</b>
          <span style="display:flex;align-items:center;gap:5px;flex-shrink:0">${healthFlagText?`<span class="adm-healthflag" title="${esc(healthFlagText)}" aria-label="Health or allergy note on file: ${esc(healthFlagText)}">⚕</span>`:''}${stageTag}</span></div>
        <div style="font-size:12px;color:var(--ink2);margin-top:2px">${esc(meta)}${a.parentPhone?' · '+esc(a.parentPhone):''}</div>
        ${siblings.length?`<div style="font-size:11.5px;color:var(--ink3);margin-top:2px">+ ${siblings.length} sibling${siblings.length===1?'':'s'} applying</div>`:''}
        ${lastLog?`<div style="font-size:11px;color:var(--ink3);margin-top:4px">${esc(lastLog.text)} · ${rel(lastLog.date)}</div>`:''}
      </div>
    </div>
    <div style="display:flex;gap:6px;flex-wrap:wrap">${admProfileActions(a)}
      <button class="btn btn-ghost btn-sm" data-adm="${a.id}" data-act="note" title="Add note">📝</button>
    </div>
  </div>`;
}
Registry.register({ id:'admissions', name:'AMAN Admissions', icon:'inbox', group:'Workspaces',

       <div class="ph-legend">${healthSegs.filter(([,,n])=>n>0).map(([key,label,n])=>`<span class="ph-item" data-jump="${key}"><i data-phase="${key}"></i>${esc(label)} <b>${n}</b></span>`).join('')}</div>

    const funnel = [['Applied', d.admissions.length, null], ['Interviewed', atOrPast('interview'), 'interview'],
      ['Agreement', atOrPast('agreement'), 'agreement'], ['Decision', atOrPast('decision'), 'decision'], ['Enrolled', enrolled.length, null]];
    const funnelStrip = !d.admissions.length ? '' : `<div class="no-print" style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:2px 0 14px">

      </div>`;
    v.innerHTML = `<div class="page-wm"><div class="eyebrow">AMAN Admissions Pipeline</div><h2 class="page-title">AMAN Admissions</h2>
     <p class="page-sub">${esc(summary)}</p>

     <div class="filters no-print">

       <button class="btn btn-o btn-sm" id="admSyncAgr">✅ Check Signed Agreements</button>
       <button class="btn btn-o btn-sm" id="admAdd">＋ Add Application</button>
       <button class="btn btn-ghost btn-sm" id="admCfg">⚙ Sync Settings</button>
       ${d.admissions.length?`<input type="search" id="admFind" placeholder="Find applicant or parent…" value="${esc(Admissions._find||'')}" style="max-width:220px">`:''}
       <span style="margin-left:auto;font-size:11.5px;color:var(--ink3);font-family:var(--f-mono)">${d.settings.admissionsLastSync?'Last synced '+rel(d.settings.admissionsLastSync):'Never synced'}</span>
     </div>
     ${(()=>{ const pending = d.unmatchedAgreements.map((u,i)=>({u,i})).filter(x=>!x.u.dismissed); return pending.length?`<details class="no-print" open style="margin-bottom:14px">
       <summary style="cursor:pointer;padding:10px 14px;background:color-mix(in srgb,var(--warn) 10%,var(--surface));border:1px solid var(--warn);border-radius:10px;font-size:13.5px;font-weight:600">⚠ ${pending.length} agreement submission${pending.length===1?'':'s'} couldn\u2019t be auto-matched \u2014 needs a quick manual match</summary>
       <div style="margin-top:8px">${pending.map(({u,i})=>`<div class="card" style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px">

     ${!d.admissions.length? `<div class="empty"><div class="big">📥</div><h3>No applications yet</h3>

     : ADM_STAGES.map(st=>{ const g=active.filter(a=>a.stage===st.id); if(!g.length) return '';

     ${(()=>{ const wl=active.filter(a=>a.stage==='waitlist').sort((a,b)=>(a.waitlistSince||'').localeCompare(b.waitlistSince||''));
        if(!wl.length) return '';
        return `${admSectHeader('waitlist','Waiting List',wl.length)}

      <div class="grid g3">${notfit.map(admCard).join('')}</div>`:''}
     ${enrolled.length?`<div class="sect" id="sect-accepted-roster"><span class="sect-dot" data-phase="accepted"></span>Recently Enrolled<span class="rule"></span></div>
      <div class="grid g3">${enrolled.slice(0,6).map(admCard).join('')}</div>`:''}
     ${healthTotal?'<div class="no-print" style="height:55vh" aria-hidden="true"></div>':''}</div>`;
    wireCommon(v); Admissions._wireActions(v);
    $$('[data-jump]',v).forEach(el=>el.addEventListener('click',()=>{
      const key = el.dataset.jump;

    $('#admCfg',v)&&($('#admCfg',v).onclick=()=>Admissions.settingsForm());
    $('#admSyncAgr',v)&&($('#admSyncAgr',v).onclick=()=>Admissions.syncAgreements());
    $$('[data-match-unmatched]',v).forEach(b=>b.onclick=()=>Admissions.matchAgreementForm(+b.dataset.matchUnmatched));

      confirmBox('Dismiss this submission? It won\u2019t be matched to any applicant, and won\u2019t show up again on future syncs.', ()=>{

    const f=$('#admFind',v); if(f){ f.oninput=()=>{ Admissions._find=f.value; clearTimeout(Admissions._ft); Admissions._ft=setTimeout(()=>{Router.render(); const nf=$('#admFind'); if(nf){nf.focus(); nf.setSelectionRange(nf.value.length,nf.value.length);}},250); }; }

  paymentReceivedForm(a){
    const siblings = DB.data.admissions.filter(x=>x.appId===a.appId && x.id!==a.id && x.stage==='enrollment');
    const o = overlay(`<div class="modal" style="max-width:480px"><h3>Payment Received</h3>
      <div id="pd-step1">
      ${siblings.length?`<div class="field"><label>Include siblings also accepted?</label>
        ${siblings.map(s=>`<label style="display:flex;align-items:center;gap:8px;font-size:13.5px;margin-bottom:4px;font-weight:400"><input type="checkbox" class="sib-cb" data-sid="${s.id}" checked style="width:auto"> ${esc(s.studentName)}</label>`).join('')}
        </div>`:''}
      <div class="field"><label>Amount received</label><input id="pd-amt" placeholder="e.g., $140"></div>
      <div class="grid" style="grid-template-columns:1fr 1fr;gap:12px">
        <div class="field"><label>Date received (optional)</label><input id="pd-date" type="date"></div>
        <div class="field"><label>First day of class (optional)</label><input id="pd-first" type="date"></div>
      </div>
      <p style="font-size:12.5px;color:var(--ink3);margin-top:-4px">Confirming this logs the payment on the timeline and prepares a welcome email for you to review and send.</p>
      <div class="mfoot"><button class="btn btn-o" data-x="c">Cancel</button><button class="btn btn-p" id="pd-go">Confirm</button></div>
      </div></div>`, true);
    $('[data-x=c]',o).onclick=()=>o.remove();
    $('#pd-go',o).onclick=()=>{
      const amount = $('#pd-amt',o).value.trim();
      const dateVal = $('#pd-date',o).value, firstVal = $('#pd-first',o).value;
      const paidOnFmt = dateVal? fmtDate(dateVal) : '';
      const firstDayFmt = firstVal? fmtDate(firstVal) : '';
      const selectedSibs = siblings.filter(s => { const cb = o.querySelector(`[data-sid="${s.id}"]`); return cb && cb.checked; });
      const group = [a, ...selectedSibs];
      const note = 'Payment received'+(amount?' — '+amount:'')+(paidOnFmt?' on '+paidOnFmt:'');
      group.forEach(x=> admLog(x, note));
      // Also record this in the real tuition ledger — previously this only
      // wrote a free-text timeline note, invisible to the family's actual
      // balance until someone re-entered it later in Administration. Split
      // sensibly: cover any outstanding registration fee first (if the
      // family already has a plan with one set), remainder as tuition. One
      // ledger entry per family, not per sibling, since this is one payment
      // covering however many of them were selected.
      const numAmount = parseFloat((amount||'').replace(/[^0-9.]/g,''));
      if(numAmount>0){
        const payDate = dateVal||today();
        const famsHit = new Set();
        group.forEach(x=>{
          const key = famKey({name:x.studentName});
          if(!key || famsHit.has(key)) return;
          famsHit.add(key);
          const plan = famPlan(key);
          const regPortion = (plan.regFee>0 && !plan.regPaid) ? Math.min(numAmount, plan.regFee) : 0;
          const tuitionPortion = numAmount-regPortion;
          if(regPortion>0){ DB.data.finance.payments.push({id:uid(), fam:key, amount:regPortion, date:payDate, kind:'registration', note:'Recorded via Admissions enrollment payment', method:''}); plan.regPaid=true; }
          if(tuitionPortion>0){ DB.data.finance.payments.push({id:uid(), fam:key, amount:tuitionPortion, date:payDate, kind:'tuition', note:'Recorded via Admissions enrollment payment', method:''}); }
          DB.log('Payment recorded — $'+numAmount+' from family '+key+' (via Admissions)');
        });
      }
      DB.save();
      const studentsJoined = admJoinNames(group.map(x=>x.studentName));
      const mailto = buildPaymentReceivedMailto(a.parentEmail, admFirstName(a.parentName), studentsJoined, group.length>1, amount, paidOnFmt, firstDayFmt);
      const sms = smsHref(a.parentPhone, buildPaymentReceivedSms(admFirstName(a.parentName), studentsJoined, group.length>1, amount, firstDayFmt));
      Router.render();
      toast('Payment logged to the timeline and family ledger');
      $('#pd-step1',o).innerHTML = `<p style="font-size:13.5px;color:var(--ink2);margin-bottom:14px">Ready to send — review, then open it in your email client.</p>
        <div class="field"><label>Preview</label><textarea readonly style="min-height:180px;font-size:12.5px;font-family:var(--f-mono)">${esc(decodeURIComponent(mailto.split('&body=')[1]||''))}</textarea></div>
        <div class="mfoot"><button class="btn btn-o" data-x="c2">Close</button><a class="btn btn-p" href="${mailto}" target="_blank">📧 Open Email Draft</a>${sms?`<a class="btn btn-o" href="${sms}" target="_blank">💬 Text</a>`:''}</div>`;
      wireFieldLabels(o);
      $('[data-x=c2]',o).onclick=()=>o.remove();
    };
  },

  async syncAgreements(){
    const url = (DB.data.settings.agreementCsvUrl||'').trim();
    if(!url){ Admissions.agreementSettingsForm(); return; }
    toast('Checking for signed agreements…');
    try{
      const res = await fetch(url, {cache:'no-store'});
      if(!res.ok) throw new Error('HTTP '+res.status);
      const text = await res.text();
      const rows = csvToObjects(text);
      let matched=0, unmatched=0;
      const haveUnmatched = new Set(DB.data.unmatchedAgreements.map(u=>u.key));
      rows.forEach(row=>{
        const appId=(row['Application ID']||'').trim();
        const ts=(row['Timestamp']||'').trim();
        const parentEmail=(row['Parent Email']||'').trim();
        const key = ts+'|'+parentEmail;
        // No Application ID at all (family used "I can't find it — continue
        // without verifying") or an ID that doesn't match any known
        // applicant (typo, or the admission hasn't been synced in yet) —
        // either way, don't silently drop a real family's submission.
        // Surface it for staff to match by hand instead.
        const group = appId ? DB.data.admissions.filter(a=>a.appId===appId && !a.agreementSubmitted) : [];
        if(appId && group.length){
          const signed = /^y/i.test(row['Signature Captured']||'');
          group.forEach(a=>{
            a.agreementSubmitted = true;
            a.agreementSubmittedDate = ts || today();
            admLog(a, 'Parental Agreement Form submitted'+(signed?' (signed)':' (no signature on file)'));
          });
          matched += group.length;
        } else {
          const alreadyDone = appId && DB.data.admissions.some(a=>a.appId===appId && a.agreementSubmitted);
          if(alreadyDone || haveUnmatched.has(key)) return;
          DB.data.unmatchedAgreements.push({
            key, timestamp:ts, parentName:(row['Parent Name']||'').trim(), parentEmail,
            studentNames:(row['Student Names']||'').trim(), matchMethod:(row['Match Method']||'').trim(),
            signatureCaptured: /^y/i.test(row['Signature Captured']||'')
          });
          haveUnmatched.add(key);
          unmatched++;
        }
      });
      DB.data.settings.agreementLastSync = new Date().toISOString();
      if(matched) DB.log('Agreement sync: matched '+matched+' applicant'+(matched===1?'':'s'));
      if(unmatched) DB.log('Agreement sync: '+unmatched+' submission'+(unmatched===1?'':'s')+' need'+(unmatched===1?'s':'')+' manual matching');
      DB.save(); Router.render();
      const parts=[];
      if(matched) parts.push(matched+' applicant'+(matched===1?'':'s')+' matched');
      if(unmatched) parts.push(unmatched+' need'+(unmatched===1?'s':'')+' manual matching');
      toast(parts.length? parts.join(' · ') : 'No new agreement submissions found');
    }catch(err){ toast(syncErrorMessage(err)); }
  },

/* ================= MODULE: ANALYTICS — SCHOOL INTELLIGENCE CENTER ================= */
const Ana = { range:'90', from:'', to:'' };
function anaRange(){ // resolve current range → {a,b,pa,pb} ISO dates (b inclusive), prior period same length
  const tdy=today(); let a,b=tdy;
  if(Ana.range==='month'){ a=tdy.slice(0,7)+'-01'; }
  else if(Ana.range==='all'){ a='2000-01-01'; }
  else if(Ana.range==='custom'){ a=Ana.from||'2000-01-01'; b=Ana.to||tdy; }
  else { a=new Date(Date.now()-(+Ana.range)*864e5).toISOString().slice(0,10); }
  const len=Math.max(1, Math.round((new Date(b)-new Date(a))/864e5)+1);
  const pb=new Date(new Date(a)-864e5).toISOString().slice(0,10);
  const pa=new Date(new Date(pb)-(len-1)*864e5).toISOString().slice(0,10);
  return {a,b,pa,pb,len};
}
const inR=(d,a,b)=> d>=a && d<=b;
// compact version for embedding directly on a KPI card, next to the number —
// only used where "prior period" is a real, cleanly computable comparison
// (a dated, period-summed metric); point-in-time states like "active students
// right now" or "curriculum % complete" have no historical snapshot in the
// data model, so they don't get a fabricated arrow.
function deltaMini(cur, prev){
  if(prev==null||!isFinite(prev)||cur==null) return '';
  const df=Math.round((cur-prev)*10)/10; if(!df) return '<span style="font-size:10px;font-weight:700;color:var(--ink3);margin-left:4px">=</span>';
  return `<span style="font-size:10px;font-weight:700;margin-left:4px;color:${df>0?'var(--ok)':'var(--bad)'}">${df>0?'▲':'▼'}${Math.abs(df)}</span>`;
}
function attRate(a,b){ let P=0,T=0,sess=0;
  for(const day in DB.data.attendance){ if(!inR(day,a,b)) continue; sess++;
    for(const sid in DB.data.attendance[day]){ T++; if(DB.data.attendance[day][sid]==='P')P++; } }
  return {rate: T?Math.round(P/T*100):null, sess, marks:T}; }
function stuFlags(a,b){ // transparent rules: behind / ahead / attention
  const d=DB.data, act=d.students.filter(s=>s.active!==false && !(s.startDate&&s.startDate>today()));
  const lastQ={}; d.quran.forEach(q=>{ if(!lastQ[q.sid]||q.date>lastQ[q.sid]) lastQ[q.sid]=q.date; });
  const cut14=new Date(Date.now()-14*864e5).toISOString().slice(0,10);
  return act.map(s=>{
    const att=Object.entries(d.attendance).filter(([day])=>inR(day,a,b)).map(([,rec])=>rec[s.id]).filter(Boolean);
    const attP=att.length? Math.round(att.filter(x=>x==='P').length/att.length*100) : null;
    const q=d.quran.filter(x=>x.sid===s.id && inR(x.date,a,b));
    const needsRev=q.filter(x=>x.grade==='Needs review').length;
    const flags=[];
    if(attP!=null && attP<70) flags.push(['behind','attendance '+attP+'%']);
    if(s.level==='Level 3' && d.quran.length && (!lastQ[s.id]||lastQ[s.id]<cut14)) flags.push(['behind','no entry 14d+']);
    if(q.length && needsRev/q.length>=0.5) flags.push(['behind','½+ entries need review']);
    if(q.length>=4 && needsRev===0 && (attP==null||attP>=90)) flags.push(['ahead','consistent + excellent']);
    const prog = s.level==='Level 1'? Math.round(((s.gb&&s.gb.page)||0)/GB_TOTAL*100)
      : s.level==='Level 2'? ((s.mus&&s.mus.page)||0)
      : Math.round(hifzStats(s).pct);
    return {s, attP, q:q.length, needsRev, flags, prog};
  });
}

/* ================= MODULE: AI ASSISTANT — OFFLINE OPERATIONS ASSISTANT =================
   Earlier versions of this module called the Anthropic API directly from the browser
   with no API key attached — a real key can never live safely in a public GitHub
   Pages file, since anyone can view-source it. Every request 401'd/CORS-failed and
   silently fell back to a small local answer function. In effect this was already a
   rule-based assistant wearing a "live chat" costume.
   This version drops the costume. Nothing below calls a network model. Every answer
   is computed instantly from DB.data, on this device, every time — which also means
   no tuition or student data ever leaves the browser. AIx.answer() is the dispatcher;
   aiContext() and AI_SYSTEM just below are RESERVED, NOT CURRENTLY CALLED — they were
   solid prompt-engineering work for a real model call, kept here in case a small
   backend proxy (e.g. a Cloudflare Worker holding a real key server-side) ever gets
   built. Do not point a fetch() at api.anthropic.com from this file again — the key
   would be public the moment this is pushed to GitHub Pages. */

/* ---------- rule engine: shared helpers ---------- */
function aiNextWeekend(){
  const now=new Date(), day=now.getDay();
  const add=(dt,n)=>{ const x=new Date(dt); x.setDate(x.getDate()+n); return x; };
  const sat = day===6? now : day===0? add(now,-1) : add(now,6-day);
  const iso = x=>x.toISOString().slice(0,10);
  return {sat: iso(sat), sun: iso(add(sat,1))};
}
function aiWeakestArea(){
  const areas=[['Madinah Arabic','mad'],['Names & Attributes of Allah','na'],['Tawḥīd','tawhid']];
  return areas.reduce((a,b)=>unitsPct(b[1])<=unitsPct(a[1])?b:a);
}
function aiBehindList(){
  return stuFlags(new Date(Date.now()-30*864e5).toISOString().slice(0,10), today())

}

/* ---------- rule engine: intent handlers (each returns final HTML, or null/falsy to fall through) ---------- */
function aiTuitionReminderHandler(text){
  const m=text.match(/family\s+([^:]+):\s*monthly\s*\$([\d.?]+),\s*status\s*(\w+),\s*outstanding balance\s*\$([\d.]+)/i);
  if(m){
    const [,fam,monthly,status,balance]=m; const nowM=today().slice(0,7);
    const msg=`As-salāmu ʿalaykum ${fam.trim()} family,\n\nJust a gentle reminder that AMAN tuition for ${nowM} is $${monthly}${/partial/i.test(status)?' (partially received, jazākumullāhu khayran)':''}. Current outstanding balance: $${balance}.\n\nYou can pay by Zelle, CashApp, or in person — whatever's easiest. Let me know if anything's changed on your end.\n\nJazākumullāhu khayran,\nUstādh Nur\nAl-Madrasatu An-Nuriyyah`;
    return `Drafted from this family's real balance in Tuition — nothing invented:<br>${aiCopyBox(msg)}`;
  }
  const due=aiFamsDue();
  if(!due.length) return `No family owes anything this month, al-ḥamdu lillāh — nothing to remind.`;
  const list=due.slice(0,8).map(({f,fin})=>`<b>${esc(f.key)}</b> — $${fin.balance} (${fin.monthStatus})`).join('<br>');
  return `I need a specific family to draft a real reminder — so the amount is right, not invented. ${due.length} famil${due.length===1?'y':'ies'} currently owe:<br>${list}<br><br>Tap <b>✨ Reminder draft</b> next to any family in <b>Tuition → Who Owes Now</b> and I'll write the exact message with their real balance.`;
}
function aiParentUpdate(text){

  const nameMatch=stats.match(/^([^(]+)\(/);
  const name=nameMatch?nameMatch[1].trim():'your child';

}

function aiPermissionSlipHandler(text){

function aiKBCleanup(){
  const res=DB.data.resources;
  const broken=res.filter(r=>r.status==='Missing — Re-upload');
  const seen={}, dupes=[];
  res.forEach(r=>{ const k=(r.title||'').toLowerCase().trim(); if(seen[k]) dupes.push(r); else seen[k]=1; });
  const meta=res.filter(r=>!r.subject||!r.grade||!r.status);
  const steps=[];
  if(broken.length) steps.push(`Re-link or remove ${broken.length} resource${broken.length===1?'':'s'} marked "Missing — Re-upload" — actually broken right now for anyone who opens them.`);
  if(dupes.length) steps.push(`Merge or retitle ${dupes.length} duplicate title${dupes.length===1?'':'s'} — pick the canonical version, archive the other.`);
  if(meta.length) steps.push(`Fill in ${meta.length} resource${meta.length===1?'':'s'} with incomplete metadata — lowest priority, do this last.`);
  if(!steps.length) return `${res.length} resources, all clean — nothing broken, no duplicates, no missing metadata.`;
  return `${res.length} resources total. Suggested order (roughly 30 min):<br>`+steps.map((s,i)=>`${i+1}. ${s}`).join('<br>')+`<br><br><button class="btn btn-o btn-sm" data-go="#/library">Open Knowledge Base →</button>`;
}
function aiWorkflowTips(){
  const d=DB.data;
  const openT=d.tasks.filter(t=>!t.done).length;
  const overT=d.tasks.filter(t=>!t.done&&t.due&&t.due<today()).length;
  const incomplete=d.students.filter(s=>s.active!==false&&regComplete(s).length).length;
  const tips=[];
  if(overT>3) tips.push(`${overT} tasks are overdue — that's the biggest drag right now. A fixed 10-minute weekly task triage would catch this before it piles up.`);
  if(incomplete) tips.push(`${incomplete} student record${incomplete>1?'s are':' is'} missing a required field (guardian/phone/emergency/photo) — closing these now prevents scrambling later.`);
  if(openT>15) tips.push(`${openT} open tasks total — worth splitting into "this week" vs "someday" so the list stays actionable instead of just long.`);
  if(!tips.length) return `Nothing structurally wrong right now — ${openT} open tasks, records look complete. The workflow itself is in decent shape.`;
  return tips.map((t,i)=>`${i+1}. ${t}`).join('<br>');
}

function aiHomeworkSuggest(text){
  const lvlM=text.match(/level\s*(\d)/i);
  const level = lvlM? 'Level '+lvlM[1] : 'Level 1';
  const res=DB.data.resources.filter(r=>(r.grade===level||r.grade==='All Levels'));
  const active=res.filter(r=>r.status==='Active'), planned=res.filter(r=>r.status==='Planned');
  let out=`Can't write new homework content offline, but here's what's already on hand for ${esc(level)}:<br>`;
  out+= active.length? active.slice(0,6).map(r=>`<button class="rlink" data-r="${r.id}">${TYPE_ICON[r.type]||'📄'} ${esc(r.title)}</button>`).join('') : `No active resources tagged for ${esc(level)} yet.`;
  if(planned.length) out+=`<br><span style="font-size:12.5px;color:var(--ink3)">${planned.length} more planned but not built yet.</span>`;
  out+=`<br><br><button class="btn btn-o btn-sm" data-go="#/teacher/homework">＋ Open homework form →</button>`;
  return out;
}
function aiMonthSummary(){
  const d=DB.data, ym=today().slice(0,7);
  const act=d.students.filter(s=>s.active!==false);
  const days=Object.keys(d.attendance).filter(day=>day.startsWith(ym));
  let P=0,tot=0; days.forEach(day=>{ Object.values(d.attendance[day]).forEach(v=>{ tot++; if(v==='P')P++; }); });
  const rate=tot?Math.round(P/tot*100):null;
  const qN=d.quran.filter(q=>q.date.startsWith(ym)).length;
  const curAvg=Math.round((unitsPct('na')+unitsPct('tawhid')+unitsPct('mad'))/3);
  const collected=d.finance.payments.filter(p=>p.date.startsWith(ym)&&p.kind!=='excused').reduce((a,p)=>a+(+p.amount||0),0);
  const outst=famList().filter(f=>!f.solo).reduce((a,f)=>a+famFinance(f.key).balance,0);
  return `${ym}: ${act.length} active students${days.length?`, attendance ${rate}% over ${days.length} session${days.length===1?'':'s'}`:', no sessions logged yet this month'}. ${qN} Qur'ān ${qN===1?'entry':'entries'} this month. Curriculum average ${curAvg}%. $${collected} collected so far, $${outst} total outstanding across all families.`;
}
function aiPrioritize(){
  const d=DB.data, tdy=today();
  const items=[];
  const overT=d.tasks.filter(t=>!t.done&&t.due&&t.due<tdy);
  const openT=d.tasks.filter(t=>!t.done&&(!t.due||t.due>=tdy));
  const behind=aiBehindList();
  const due=aiFamsDue();
  const missing=d.resources.filter(r=>r.status==='Missing — Re-upload');
  if(overT.length) items.push(`⏰ ${overT.length} overdue task${overT.length>1?'s':''} — oldest: ${esc(overT[0].text)}`);
  if(behind.length) items.push(`📖 ${behind.length} student${behind.length>1?'s':''} need a memorization check`);
  if(due.length) items.push(`💵 ${due.length} famil${due.length===1?'y':'ies'} owe tuition this month`);

  if(!items.length) return 'Nothing urgent on the board this week, al-ḥamdu lillāh — good time to work ahead on curriculum.';
  return items.map((t,i)=>`${i+1}. ${t}`).join('<br>');
}

render(v){
  v.innerHTML = `<div class="eyebrow">Operations Assistant · Instant · Offline · Explainable</div><h2 class="page-title">Assistant</h2>
   <p class="page-sub">Every answer here is computed live from your school's data, right on this device — nothing is sent anywhere. Ask a question or tap a shortcut.</p>
   <div class="ai-wrap"><div class="ai-msgs" id="aiMsgs"></div>
    <div class="ai-chips no-print" id="aiChips">

     <button class="chip" id="aiNew" style="margin-left:auto">🗑 New chat</button></div>

  const msgs=$('#aiMsgs',v), q=$('#aiQ',v);
  const add=(cls,html)=>{ const m=document.createElement('div'); m.className='msg '+cls; m.innerHTML=html; msgs.append(m); msgs.scrollTop=msgs.scrollHeight; return m; };
  AIx.history = AIx.history||[];
  // restore prior turns (already-rendered HTML, computed — not markdown needing reformatting) or open with the proactive briefing
  if(AIx.history.length){
    AIx.history.forEach(h=>{ const el=add(h.role==='user'?'user':'ai', h.role==='user'?esc(h.content):h.content); if(h.role!=='user') AIx.wire(el); });
  } else {
    AIx.wire(add('ai', AIx.briefing()));
  }
  function send(text){
    if(!text.trim()) return;
    add('user', esc(text)); q.value='';
    AIx.history.push({role:'user', content:text});
    const typing=add('ai','<span class="typing">computing</span>');
    // computed instantly — the brief pause is just for a natural chat feel, not a network round-trip
    setTimeout(()=>{
      const out=AIx.answer(text);

      typing.innerHTML=out; AIx.wire(typing);
      msgs.scrollTop=msgs.scrollHeight;

  $$('button[data-chip]',v).forEach(b=>b.onclick=()=>send(b.dataset.chip));

const AIx = {
  history:[],
  /* ---- wire: entity/action buttons on any message bubble (briefing, rule answers, restored history) ---- */
  wire(el){

  },
  /* ---- answer: rule dispatcher — every branch is computed from DB.data, nothing invented ---- */

    const overT=d.tasks.filter(t=>!t.done&&t.due&&t.due<tdy);
    const nextEv=d.events.filter(e=>e.date>=tdy).sort((a,b)=>a.date.localeCompare(b.date))[0];

    h+=`<br><span style="font-size:12px;color:var(--ink3)">Every item above shows the rule that fired. Ask me anything — I'll answer from live data and explain with the numbers.</span>`;

       <div class="wrow" style="cursor:default"><span class="t">Students on roster</span><span class="m">${d.students.length}</span></div>
       <div class="wrow" style="cursor:default"><span class="t">Knowledge Base resources</span><span class="m">${d.resources.length}</span></div>
       <div class="wrow" style="cursor:default"><span class="t">Admissions on file</span><span class="m">${d.admissions.length}</span></div>
       <div class="wrow" style="cursor:default"><span class="t">Activity log entries</span><span class="m">${d.activity.length}</span></div>
     </div></div>
    <div class="card"><h3 style="font-family:var(--f-display);font-size:17px;margin-bottom:10px;color:var(--bad)">⚠️ Danger zone</h3>
     <p style="font-size:13.5px;color:var(--ink2);margin-bottom:12px">Reset wipes everything in this browser and restores the seed catalog. Export a backup first.</p>
     <button class="btn btn-danger" id="sReset">Reset AMAN Central</button></div></div>`;
  $('#sTheme',v).onclick=()=>Theme.toggle();
  $('#sExp',v).onclick=()=>{ DB.export(); Router.render(); };
  $('#sImp',v).onchange=e=>{ if(e.target.files[0]) DB.import(e.target.files[0]); };
  $('#sColAdd',v).onclick=()=>{ const c=$('#sCol',v).value.trim(); if(!c)return;
    if(DB.data.collections.includes(c)){toast('Collection exists');return;}
    DB.data.collections.push(c); DB.log('Collection added: '+c); DB.save(); toast('Added'); $('#sCol',v).value=''; };
  $('#sReset',v).onclick=()=>confirmBox('Erase ALL AMAN Central data in this browser and restore the seed catalog?',()=>{
    localStorage.removeItem(DB.KEY); DB.load(); Router.go('#/dashboard'); toast('Reset complete'); });
}});

/* ---------- navigation + boot ---------- */

};
function buildNav(){
  const groups={};
  Registry.modules.filter(m=>m.group).forEach(m=>(groups[m.group]=groups[m.group]||[]).push(m));
  $('#nav').innerHTML = Object.entries(groups).map(([g,ms])=>`<div class="grp">${g}</div>`+ms.map(m=>
    `<a href="#/${m.id}" data-mod="${m.id}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${NAV_ICONS[m.icon]||NAV_ICONS.book}</svg>${m.name}</a>`).join('')).join('');
  $$('#nav a').forEach(a=>a.addEventListener('click', e=>{ e.preventDefault(); e.stopPropagation(); Router.go('#/'+a.dataset.mod); }));
}
// ---------- authentication (client-side lock screen — see setup notes) ----------
// This is a deterrent, not real security: the file has no server, so the
// username/password below are visible to anyone who views the page source,
// and the check can be bypassed entirely via the browser console. It stops
// casual access to the file/device; it does not stop a determined user.
const AUTH_USER = 'Admin', AUTH_PASS = 'Aman@2020', AUTH_KEY = 'aman_central_auth';
function bootApp(){
  DB.load();
  Theme.apply(DB.data.settings.theme||'light');
  buildNav();
  $('#openPalette').onclick=()=>Palette.open();
  $('#quickAdd').onclick=()=>ResourceForm.open();
  $('#themeBtn').onclick=()=>Theme.toggle();
  $('#logoutBtn').onclick=()=>confirmBox('Log out of AMAN Central?', doLogout);
  $('#hambBtn').onclick=()=>$('#sidebar').classList.toggle('open');
  document.addEventListener('click', e=>{ if(window.innerWidth<=900 && !e.target.closest('#sidebar') && !e.target.closest('#hambBtn')) $('#sidebar').classList.remove('open'); });
  Router.render();
}
function showApp(){
  $('#loginScreen').style.display='none';
  $('#app').style.display='';
  bootApp();
}
function doLogin(){
  const u=$('#login-user').value.trim(), p=$('#login-pass').value, err=$('#login-err');
  if(u===AUTH_USER && p===AUTH_PASS){
    sessionStorage.setItem(AUTH_KEY,'ok');
    err.style.display='none';
    showApp();
  } else {
    err.textContent='Incorrect username or password.';
    err.style.display='block';
    $('#login-pass').value='';
    $('#login-pass').focus();
  }
}
function doLogout(){ sessionStorage.removeItem(AUTH_KEY); location.reload(); }
$('#login-btn').onclick=doLogin;
$('#login-user').addEventListener('keydown', e=>{ if(e.key==='Enter') $('#login-pass').focus(); });
$('#login-pass').addEventListener('keydown', e=>{ if(e.key==='Enter') doLogin(); });
wireFieldLabels(document);
if(sessionStorage.getItem(AUTH_KEY)==='ok'){ showApp(); } else { $('#login-user').focus(); }
// PWA: register the app-shell service worker regardless of login state — this
// only caches the shell (this page, manifest, icons), never DB data, and is
// what makes "Add to Home Screen" / offline-open actually available.
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{ navigator.serviceWorker.register('./sw.js').catch(()=>{}); });
}
</script>
