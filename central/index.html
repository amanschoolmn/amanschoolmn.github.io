const Dashboard = {_clk:null};
/* inline SVG mini bar chart — dependency-free, theme-aware */
function spark(vals, label, fixedMax){
  const W=260, H=54, max=fixedMax||Math.max(...vals,1), bw=W/vals.length;
  const bars=vals.map((val,i)=>{ const bh=Math.max(2, val/max*(H-6));
    return `<rect x="${(i*bw+2).toFixed(1)}" y="${(H-bh).toFixed(1)}" width="${(bw-4).toFixed(1)}" height="${bh.toFixed(1)}" rx="2.5" class="sbar"><title>${val}</title></rect>`; }).join('');
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:56px" role="img" aria-label="${esc(label)}">${bars}</svg>
   <div style="font-family:var(--f-mono);font-size:10.5px;color:var(--ink3)">${esc(label)}</div>`;
}

function wResList(title, arr, meta, emptyMsg){
  return `<div class="whead"><h3>${title}</h3></div><div class="wlist">${
    arr.length?arr.map(r=>`<div class="wrow" data-go="#/resource/${r.id}"><span class="pi" style="font-size:14px">${TYPE_ICON[r.type]||'📄'}</span><span class="t">${esc(r.title)}</span><span class="m">${meta(r)}</span></div>`).join('')
    :`<div class="wrow" style="color:var(--ink3);cursor:default">${emptyMsg||'Nothing yet'}</div>`}</div>`;
}
function attSummary(){
  const a=DB.data.attendance; let P=0,A=0,L=0,E=0,sessions=0;
  for(const day in a){ sessions++; for(const sid in a[day]){ const v=a[day][sid]; if(v==='P')P++; else if(v==='A')A++; else if(v==='L')L++; else if(v==='E')E++; } }
  const tot=P+A+L+E; return {P,A,L,E,sessions,rate: tot?Math.round(P/tot*100):0};
}
function unitsPct(key){ const p=DB.data.planner['prog_'+key]; return p==null? {na:33,tawhid:100,mad:20}[key] ?? 0 : +p; }
function wireCommon(v){

   Scoped to the same "real teaching content" categories as the cover-card treatment —
   administrative/brand/communication resources stay out of this view on purpose;
   they're still one click away via Search & Filter. */
const CURRICULUM_SUBJECT_ORDER = ['Qur’an','Islamic Studies','Arabic'];
function kbBySubject(){
  const items = DB.data.resources.filter(r=>COVER_CATEGORIES.includes(r.category));
  const by = {};
  items.forEach(r=>{ (by[r.subject]=by[r.subject]||[]).push(r); });

function kbAllBookKeys(){

}
function kbBookKey(subj, series){ return subj+'|'+(series||'— Unsorted —'); }
/* "4" -> [4] · "4-6" -> [4,5,6] · "3, 5" -> [3,5] · "4-6, 9" -> [4,5,6,9] */
function parseUnitList(str){
  const out = new Set();
  String(str||'').split(',').map(s=>s.trim()).filter(Boolean).forEach(part=>{
    const m = part.match(/^(\d+)\s*-\s*(\d+)$/);
    if(m){ let a=+m[1], b=+m[2]; if(a>b){ const t=a; a=b; b=t; } for(let i=a;i<=b;i++) out.add(i); }
    else { const n=+part; if(Number.isFinite(n) && n>0) out.add(n); }
  });
  return [...out].sort((a,b)=>a-b);
}
function unitFirstNum(str){ const l=parseUnitList(str); return l.length? l[0] : null; }
/* [4,5,6,9] -> "4–6, 9" — collapses consecutive runs for compact display */
function fmtUnitRanges(nums){
  if(!nums.length) return '';
  const out=[]; let start=nums[0], prev=nums[0];
  for(let i=1;i<=nums.length;i++){
    const n=nums[i];
    if(n===prev+1){ prev=n; continue; }
    out.push(start===prev? String(start) : start+'–'+prev);
    start=n; prev=n;
  }
  return out.join(', ');
}
/* ---------- per-book completeness: gaps, not just counts ----------
   A book only gets a gap signal once you've told AMAN Central how many units
   it has (bookMeta.totalUnits) — no total, no claim either way, since a
   fabricated "complete" or "incomplete" is worse than no signal at all.
   Once a total is set, a category (Lesson Slides, Assessments, …) is only
   checked for gaps if at least one resource in that category has actually
   been tagged with a unit number — untracked categories stay silent rather
   than being flagged as 100% missing. Only Active resources count as
   coverage; Planned/Draft/Missing don't fill the gap they're meant to fill. */
function kbBookCompleteness(subj, series){
  const key = kbBookKey(subj, series);
  const meta = DB.data.bookMeta[key];
  const total = (meta && meta.totalUnits>0) ? meta.totalUnits : null;
  if(!total) return {key, total:null, gaps:[]};
  const items = DB.data.resources.filter(r=>COVER_CATEGORIES.includes(r.category) && r.subject===subj && (r.series||'— Unsorted —')===series);
  const byCat = {};
  items.forEach(r=>{
    const u = parseUnitList(r.units); if(!u.length) return;
    const c = (byCat[r.category] = byCat[r.category] || new Set());
    if(r.status==='Active') u.forEach(n=>c.add(n));
  });
  const gaps=[];
  Object.entries(byCat).forEach(([cat,covered])=>{
    const missing=[]; for(let i=1;i<=total;i++) if(!covered.has(i)) missing.push(i);
    if(missing.length) gaps.push({category:cat, missing});
  });
  return {key, total, gaps};
}

/* ---------- shared print-window opener ----------

   button) that need to reproduce a chunk of on-page styling inside a
   printWindow() document. Cross-origin sheets throw on .cssRules access —
   skipped, not fatal, since those are fonts loaded separately anyway. Keeps
   one source of truth for the styling instead of a hand-copied duplicate
   that quietly drifts out of sync the next time the CSS changes. */
function extractCssRules(prefix){
  let css = '';
  for(const sheet of document.styleSheets){
    let rules;
    try { rules = sheet.cssRules; } catch(e){ continue; }
    if(!rules) continue;
    for(const rule of rules){
      if(rule.selectorText && rule.selectorText.includes(prefix)) css += rule.cssText+'\n';
    }
  }
  return css;
}
function printWindow(title, styleCss, bodyHtml){
  const w=window.open('','_blank');
  if(!w){ toast('Pop-up blocked — allow pop-ups for this site to print.'); return null; }
  w.document.write(`<html><head><title>${esc(title)}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;0,900;1,500&family=Crimson+Pro:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <style>*{box-sizing:border-box}html{-webkit-print-color-adjust:exact;print-color-adjust:exact;color-adjust:exact}
    /* Print-safety defaults shared by every report/roster that goes through this
       function — the same "looks different on paper than on screen" risk that
       was fixed for the acceptance letters (which print via their own real
       window, not this one) also applies to multi-page tables here: without
       these, a table header doesn't repeat past page 1 and a row can split
       across a page break mid-line. Low specificity on purpose — any caller's
       styleCss below can still override a rule for its own document. */
    table{border-collapse:collapse} thead{display:table-header-group} tfoot{display:table-footer-group}
    tr{page-break-inside:avoid;break-inside:avoid} img{max-width:100%}
    h1,h2,h3{page-break-after:avoid;break-after:avoid}
    @page{margin:0.6in}
    ${styleCss||''}</style>
    </head><body>${bodyHtml}<script>window.print()<\/script></body></html>`);
  w.document.close();
  return w;
}
function kbMissingReport(){
  const d=DB.data;
  const missing=d.resources.filter(r=>r.status==='Missing — Re-upload');
  const planned=d.resources.filter(r=>r.status==='Planned');
  const unlinked=d.resources.filter(r=>r.loc.kind==='device'&&!r.loc.href&&r.status==='Active');
  const sec=(t,arr,note)=> arr.length?`<h2>${t} (${arr.length})</h2><ol>${arr.map(r=>`<li><b>${esc(r.title)}</b> — ${esc(r.desc.slice(0,140))}</li>`).join('')}</ol>${note?`<p class="n">${note}</p>`:''}`:'';
  // per-book unit gaps — only books someone has opted into tracking (bookMeta.totalUnits)
  const bookGaps=[];
  kbAllBookKeys().forEach(key=>{
    const i=key.indexOf('|'), subj=key.slice(0,i), series=key.slice(i+1);
    if(series==='— Unsorted —') return;
    const comp = kbBookCompleteness(subj, series);
    if(comp.total!=null && comp.gaps.length) bookGaps.push({subj, series, gaps:comp.gaps});
  });
  const bookGapsSec = bookGaps.length? `<h2>Book completeness gaps (${bookGaps.length})</h2><ol>${bookGaps.map(bg=>
    `<li><b>${esc(bg.series)}</b> (${esc(bg.subj)})<ul>${bg.gaps.map(g=>`<li>${esc(g.category)} — missing unit${g.missing.length===1?'':'s'} ${fmtUnitRanges(g.missing)}</li>`).join('')}</ul></li>`).join('')}</ol>
    <p class="n">Only books with a total unit count set (Knowledge Base → Browse Curriculum → track completeness) appear here.</p>` : '';
  printWindow('AMAN — Missing Resources Report',
    `body{font-family:Georgia,serif;max-width:720px;margin:34px auto;padding:0 20px;color:#111;line-height:1.55}h1{font-size:22px;border-bottom:2px solid #1a4a35;padding-bottom:8px}h2{font-size:15px;color:#1a4a35;margin-top:26px}.meta{font-size:12px;color:#555}li{margin:8px 0;font-size:14px}ul{margin:4px 0 0}.n{font-size:12px;color:#666;font-style:italic}`,
    `<h1>Missing Resources Report</h1><div class="meta">Al-Madrasatu An-Nuriyyah · Knowledge Base · ${new Date().toLocaleDateString()}</div>
     ${sec('Files needing re-upload', missing,'Re-upload these so the Knowledge Base reaches 100% coverage.')}
     ${sec('Planned — does not exist yet', planned,'Recommended builds, in priority order as flagged on the dashboard.')}
     ${sec('On device but not linked', unlinked,'Open each resource → Edit → Location and paste its Drive link, site URL, or folder path.')}
     ${bookGapsSec}
     ${!missing.length&&!planned.length&&!unlinked.length&&!bookGaps.length?'<p>Nothing missing — the Knowledge Base is fully linked, mā shāʾ Allāh.</p>':''}`);
}

function graphSVG(center, nodes){
  const W=760, H=320, cx=W/2, cy=H/2, rad=Math.min(W,H)/2-58;
  let s = `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Knowledge graph">`;
  nodes.forEach((n,i)=>{ const a=(i/Math.max(nodes.length,1))*Math.PI*2 - Math.PI/2;
    const x=cx+Math.cos(a)*rad, y=cy+Math.sin(a)*rad*0.86;
    s+=`<line class="gedge" x1="${cx}" y1="${cy}" x2="${x}" y2="${y}"/>`;
    const label = n.title.length>24? n.title.slice(0,23)+'…':n.title;
    s+=`<g class="gnode" data-gid="${n.id}" tabindex="0"><circle cx="${x}" cy="${y}" r="22"/><text x="${x}" y="${y+3}" text-anchor="middle" font-size="13">${TYPE_ICON[n.type]||'📄'}</text><text x="${x}" y="${y+38}" text-anchor="middle">${esc(label)}</text></g>`;
  });
  const cl = center.title.length>20? center.title.slice(0,19)+'…':center.title;
  s+=`<g class="gnode gcenter"><circle cx="${cx}" cy="${cy}" r="30"/><text x="${cx}" y="${cy+4}" text-anchor="middle">${esc(cl.split(' ').slice(0,2).join(' '))}</text></g></svg>`;
  return nodes.length? s : '<div class="empty" style="padding:60px 20px"><p>No relationships yet — add tags or explicit links in Edit.</p></div>';
}

    <div class="widget" style="margin-bottom:14px"><div style="display:flex;flex-wrap:wrap;gap:8px">

      <div style="display:flex;gap:7px;flex-wrap:wrap">${kit.map(r=>`<button class="chip" data-go="#/resource/${r.id}">${TYPE_ICON[r.type]||'📄'} ${esc(r.title.slice(0,30))}</button>`).join('')}</div></div>
    <div class="sect">3 · After class<span class="rule"></span></div>
    <div class="grid g2">
      <div class="widget"><div class="whead"><h3>Today’s summary</h3></div>

        <div style="display:flex;gap:7px;flex-wrap:wrap;margin-top:9px">
          <button class="chip" data-ai="Summarize today: ${present} present of ${d.students.length}, ${qToday.length} Quran entries. Suggest what to focus on next session.">✨ AI class summary</button>

        <button class="btn btn-p btn-sm" data-act="hw" style="margin-top:9px">＋ Assign homework</button></div>
      <div class="widget"><div class="whead"><h3>Reflection — 60 seconds</h3><button class="btn btn-ghost btn-sm" data-go="#/teacher/reflect">All →</button></div>
        <textarea id="ckRef" placeholder="What landed today? What flopped? One change for next time…"></textarea>
        <div style="display:flex;justify-content:flex-end;margin-top:8px"><button class="btn btn-p btn-sm" id="ckRefSave">Save reflection</button></div></div>
      <div class="widget"><div class="whead"><h3>Next weekend</h3></div>
        <p style="font-size:13px;color:var(--ink2);margin-bottom:9px">Close the loop while it’s fresh — sketch next Saturday now.</p>
        <div style="display:flex;gap:7px;flex-wrap:wrap"><button class="btn btn-o btn-sm" data-go="#/teacher/planner">📅 Plan next weekend</button>

        <button class="btn btn-o btn-sm" data-go="#/teacher/quiz">🧪 New quiz</button></div></div>
    </div>`;
    wireCommon(el);

    $$('[data-act=quran]',el).forEach(b=>b.onclick=()=>Teacher.quickQuran());
    $$('[data-act=behavior]',el).forEach(b=>b.onclick=()=>Teacher.quickStudent('Behavior note','behavior'));
    $$('[data-act=achieve]',el).forEach(b=>b.onclick=()=>Teacher.quickStudent('Achievement','achievements'));
    $$('[data-act=cnote]',el).forEach(b=>b.onclick=()=>{

      <div class="mfoot"><button class="btn btn-o" data-x="c">Cancel</button><button class="btn btn-p" data-x="s">Save</button></div></div>`,true);
      $('[data-x=c]',o).onclick=()=>o.remove();

    $$('input[data-mat]',el).forEach(c=>c.onchange=()=>{ const [lid,i]=c.dataset.mat.split('_'); const L=d.lessons.find(x=>x.id===lid);

    $('#ckRefSave',el).onclick=()=>{ const t=$('#ckRef',el).value.trim(); if(!t)return;
      (d.planner['notes_reflect']=d.planner['notes_reflect']||[]).unshift({d:new Date().toISOString(), t}); DB.save(); $('#ckRef',el).value=''; toast('Reflection saved'); };

      if(k==='stop'){ clearInterval(TT.iv); TT.end=null; const e=$('#ttDisp'); if(e)e.textContent='--:--'; return; }

  startTimer(min){
    clearInterval(TT.iv); TT.end=Date.now()+min*60000;
    toast('Timer: '+min+' min');
    TT.iv=setInterval(()=>{ const left=TT.end-Date.now(); const e=$('#ttDisp');
      if(left<=0){ clearInterval(TT.iv); TT.end=null; if(e)e.textContent='00:00'; toast('⏰ Time is up'); return; }
      if(e) e.textContent=fmtLeft(left); },500);
  },
  /* ---------- CLASS MODE: full-screen, minimal-chrome, tablet-sized touch targets for
     use DURING live class — sidebar/topbar hidden entirely, one job: take attendance
     and log the two most time-pressured actions without hunting through menus ---------- */
  openClassMode(){
    const d=DB.data;
    const date=today();
    d.attendance[date]=d.attendance[date]||{};
    const overlay=document.createElement('div');
    overlay.id='classModeOverlay';
    overlay.style.cssText='position:fixed;inset:0;z-index:9000;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)';
    const paint=()=>{
      const rec=d.attendance[date];
      const stu=d.students.filter(s=>s.active!==false && (!s.startDate||s.startDate<=date));
      const present=Object.values(rec).filter(x=>x==='P').length;
      const cyc={undefined:'P', P:'L', L:'A', A:'E', E:undefined};
      overlay.innerHTML=`
        <div style="display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line);flex-shrink:0;flex-wrap:wrap">
          <b style="font-family:var(--f-display);font-size:19px">🖥 Class Mode</b>
          <span style="font-family:var(--f-mono);font-size:13px;color:var(--ink2)">${present}/${stu.length} present</span>
          <b id="cmTtDisp" style="font-family:var(--f-mono);font-size:19px;margin-left:auto">${TT.end?fmtLeft(TT.end-Date.now()):'--:--'}</b>
          <button class="btn btn-o btn-sm" data-cmt="5">5m</button><button class="btn btn-o btn-sm" data-cmt="10">10m</button><button class="btn btn-o btn-sm" data-cmt="15">15m</button>
          <button class="btn btn-ghost btn-sm" data-cmt="stop">■</button>
          <button class="btn btn-o btn-sm" id="cmAllP">Mark all present</button>
          <button class="btn btn-o btn-sm" id="cmQuran">📖 Memorization</button>
          <button class="btn btn-o btn-sm" id="cmNote">📝 Note</button>
          <button class="btn btn-p btn-sm" id="cmExit">✕ Exit Class Mode</button>
        </div>
        <div style="flex:1;overflow-y:auto;padding:18px">
          <div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px">
            ${stu.map(s=>{ const st=rec[s.id];
              const bg = st==='P'?'var(--ok)':st==='L'?'var(--warn)':st==='A'?'var(--bad)':st==='E'?'var(--info)':'var(--surface2)';
              const fg = st?'#fff':'var(--ink)';
              const stName={P:'present',L:'late',A:'absent, unexcused',E:'absent, excused'}[st]||'unmarked';
              const nextName={undefined:'present',P:'late',L:'absent',A:'excused absence',E:'unmarked'}[st];
              const name=s.preferredName||s.name;
              return `<button class="classmode-card" data-cmstu="${s.id}" aria-label="${esc(name)} — currently ${stName}. Tap to mark ${nextName}." style="background:${st?`color-mix(in srgb,${bg} 88%,transparent)`:bg};color:${fg};border-color:${st?'transparent':'var(--line2)'}">
                <span style="font-size:15px;font-weight:600;line-height:1.25">${esc(name)}</span>
                <span style="font-size:12px;font-family:var(--f-mono);opacity:.85;margin-top:6px" aria-hidden="true">${st||'tap to mark'}</span>
              </button>`; }).join('')}
          </div>
          ${!stu.length?'<div class="empty"><h3>No students to mark</h3></div>':''}
        </div>`;
      $$('[data-cmstu]',overlay).forEach(b=>b.onclick=()=>{
        const sid=b.dataset.cmstu; const next=cyc[rec[sid]];
        if(next===undefined) delete rec[sid]; else rec[sid]=next;
        DB.save(); paint();
      });
      $('#cmAllP',overlay).onclick=()=>{ stu.forEach(s=>rec[s.id]='P'); DB.log('Attendance: all present · '+date); DB.save(); paint(); };
      $('#cmExit',overlay).onclick=()=>{ overlay.remove(); if(Router.parse().id==='teacher') Router.render(); };
      $('#cmQuran',overlay).onclick=()=>Teacher.quickQuran();
      $('#cmNote',overlay).onclick=()=>Teacher.quickStudent('Behavior note','behavior');
      $$('[data-cmt]',overlay).forEach(b=>b.onclick=()=>{
        const k=b.dataset.cmt;
        if(k==='stop'){ clearInterval(TT.iv); TT.end=null; const e=$('#cmTtDisp',overlay); if(e)e.textContent='--:--'; return; }
        Teacher.startTimer(+k);
      });
    };
    // keep the header clock/countdown live while Class Mode is open; stop cleanly on exit
    clearInterval(overlay._iv);
    overlay._iv=setInterval(()=>{ const e=$('#cmTtDisp',overlay); if(e&&TT.end) e.textContent=fmtLeft(TT.end-Date.now()); },1000);
    const cmObserver=new MutationObserver(()=>{ if(!document.body.contains(overlay)){ clearInterval(overlay._iv); cmObserver.disconnect(); } });
    cmObserver.observe(document.body,{childList:true});
    paint();
    document.body.appendChild(overlay);
  },
  /* sequential fast-record: one modal, whole class */
  quickQuran(){
    const stu=DB.data.students.filter(s=>s.active!==false&&(!s.startDate||s.startDate<=today()));
    if(!stu.length){ toast('Add or import students first'); Router.go('#/students'); return; }
    const order=[...stu].sort((a,b)=>b.level.localeCompare(a.level)||a.name.localeCompare(b.name)); // L3 first
    const opts=order.map(s=>`<option value="${s.id}">${esc(s.name)} · ${s.level.replace('Level ','L')}</option>`).join('');
    const o=overlay(`<div class="modal" style="max-width:440px"><h3>📖 Record memorization</h3>
      <div class="field"><label>Student</label><select id="qq-s">${opts}</select></div>
      <div class="field"><label>Sūrah / portion</label><input id="qq-w" placeholder="e.g., Al-Mulk 1–10 · Green Book p. 34"></div>
      <div class="grid" style="grid-template-columns:1fr 1fr;gap:12px">
        <div class="field"><label>Type</label><select id="qq-k"><option>New</option><option>Review</option></select></div>
        <div class="field"><label>Grade</label><select id="qq-g"><option>Excellent</option><option>Good</option><option>Needs review</option></select></div></div>
      <div class="mfoot"><button class="btn btn-o" data-x="done">Done</button><button class="btn btn-p" data-x="next">Save & next student →</button></div></div>`,true);
    const save=()=>{ const w=$('#qq-w',o).value.trim(); if(!w){toast('What was recited?');return false;}
      const sid=$('#qq-s',o).value; const s=stu.find(x=>x.id===sid);
      DB.data.quran.push({sid, what:w, kind:$('#qq-k',o).value, grade:$('#qq-g',o).value, date:today()});
      DB.log('Qur’an entry for '+s.name); DB.save(); toast(s.name+' ✓'); return true; };
    $('[data-x=done]',o).onclick=()=>{ const w=$('#qq-w',o).value.trim(); if(w) save(); o.remove(); if(Router.parse().id==='teacher')Router.render(); };
    $('[data-x=next]',o).onclick=()=>{ if(!save())return;
      const sel=$('#qq-s',o); if(sel.selectedIndex<sel.options.length-1) sel.selectedIndex++;
      $('#qq-w',o).value=''; $('#qq-w',o).focus(); };
    $('#qq-w',o).focus();
  },
  quickStudent(title, store){
    const stu=DB.data.students.filter(s=>s.active!==false);
    if(!stu.length){ toast('Add or import students first'); Router.go('#/students'); return; }
    const opts=[...stu].sort((a,b)=>a.name.localeCompare(b.name)).map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('');
    const isBeh=store==='behavior';
    const o=overlay(`<div class="modal" style="max-width:430px"><h3>${isBeh?'📝':'🏅'} ${title}</h3>
      <div class="field"><label>Student</label><select id="qs-s">${opts}</select></div>
      ${isBeh?'<div class="field"><label>Type</label><select id="qs-k"><option>Positive</option><option>Concern</option></select></div>':''}
      <div class="field"><label>${isBeh?'Note':'Achievement'}</label><${isBeh?'textarea':'input'} id="qs-t" placeholder="${isBeh?'What happened…':'e.g., Completed Juz ʿAmma'}"></${isBeh?'textarea':'input'}></div>
      <div class="mfoot"><button class="btn btn-o" data-x="done">Done</button><button class="btn btn-p" data-x="next">Save & another →</button></div></div>`,true);
    const save=()=>{ const t=$('#qs-t',o).value.trim(); if(!t){toast('Write it first');return false;}
      const sid=$('#qs-s',o).value; const s=stu.find(x=>x.id===sid);
      const rec = isBeh? {sid, kind:$('#qs-k',o).value, text:t, date:today()} : {sid, text:t, date:today()};
      DB.data[store].push(rec); if(!isBeh) DB.log('Achievement — '+s.name+': '+t);
      DB.save(); toast(s.name+' ✓'); return true; };
    $('[data-x=done]',o).onclick=()=>{ if($('#qs-t',o).value.trim()) save(); o.remove(); };
    $('[data-x=next]',o).onclick=()=>{ if(save()) { $('#qs-t',o).value=''; $('#qs-t',o).focus(); } };
  },

(function(){ /* fractional starts: distribute pages shared by multiple surahs; spans sum to exactly 604 */

/* extensible per-student memorization path registry */
const HIFZ_PATHS = {

  reverse:{ name:'Reverse — Al-Baqarah → An-Nās', order(){ const a=[]; for(let n=2;n<=114;n++)a.push(n); return a; } },

function hifzStats(s){

  const order=HIFZ_PATHS[pid].order();

function ayahStats(st){

function paceETA(log, curVal, total, field){ // generic pace from dated logs
  if(!log||log.length<2) return null;
  const srt=[...log].sort((a,b)=>a.date.localeCompare(b.date));
  // Prefer a recent window (~8 weeks) so pace reflects current trajectory
  // rather than a stale average since day one; falls back to full history
  // if there isn't enough recent data yet.
  const cutoff = new Date(Date.now()-56*864e5).toISOString().slice(0,10);
  let win = srt.filter(x=>x.date>=cutoff);
  if(win.length<2) win = srt;
  const a=win[0], b=win[win.length-1];
  const weeks=Math.max(1,(new Date(b.date)-new Date(a.date))/6048e5);
  const pace=(b[field]-a[field])/weeks;
  if(pace<=0) return null;
  const weeksToGo=Math.ceil((total-curVal)/pace);
  const date=new Date(Date.now()+weeksToGo*6048e5);
  const shortWeeks=Math.min(4,weeksToGo);
  const shortTarget=Math.round(Math.min(total, curVal+pace*shortWeeks));
  return {pace:Math.round(pace*10)/10, weeks:weeksToGo, date, shortWeeks, shortTarget};
}

  /* ---------- Absence Notice: same escalating design as the standalone tool this
     replaces, but auto-filled from real attendance data instead of hand-typed and
     hand-counted. Unexcused count is cumulative since enrollment, matching the
     policy language ("three (3) unexcused absences" — not "three this term"). ---------- */
  unexcusedCount(sid){
    const a=DB.data.attendance; let n=0;
    for(const day in a){ if(a[day][sid]==='A') n++; }
    return n;
  },
  /* ---------- shared stage/message logic — both the printed notice and the
     text/copy version pull from this one place, so the two never drift ---------- */
  absenceStageInfo(s){
    const n = this.unexcusedCount(s.id);
    const stage = Math.min(3, Math.max(1, n||1));
    const PAL = {
      1:{strong:'#f1a81e', on:'#1a1207', tint:'#fdeecb', hot:'#b8540a', kicker:'Attendance Notice', title:'First Notice', stage:'1st Unexcused Absence'},
      2:{strong:'#ea7317', on:'#fff', tint:'#fde0c4', hot:'#a8340a', kicker:'Attendance Notice — Escalated', title:'Second Notice', stage:'2nd Unexcused Absence'},
      3:{strong:'#d61f1f', on:'#ffe9a8', tint:'#fbdcd6', hot:'#a10d0d', kicker:'Final Warning', title:'Final Notice', stage:'3rd Unexcused Absence'}
    };
    const p = PAL[stage];
    const who = s.preferredName||s.name;
    const parent = (s.guardians&&s.guardians[0]&&s.guardians[0].name) || '';
    const phone = (s.guardians&&s.guardians[0]&&s.guardians[0].phone) || '';
    const leadPlain = stage===1
      ? `${who} now has one (1) unexcused absence, without prior notice. AMAN policy: three (3) unexcused absences result in removal from the program. We don\u2019t want it to reach that point — we\u2019re glad to work with you so ${who} stays enrolled.`
      : stage===2
      ? `${who} now has two (2) unexcused absences, both without prior notice. One more will mean removal from the program. We truly want to avoid that — let\u2019s talk so ${who} stays enrolled.`

  sotmForm(s){
    const yrNow = new Date().getFullYear();

    const o = overlay(`<div class="modal" style="max-width:460px"><h3>🌟 Student of the Month</h3>

        <div class="field"><label>Through (optional)</label><select id="sotm-monend"><option value="">(single month)</option>${SOTM_MONTHS.map((m,i)=>`<option value="${i}">${m}</option>`).join('')}</select></div>
        <div class="field"><label>Year</label><select id="sotm-yr">${yrOpts.map(y=>`<option ${y===yrNow?'selected':''}>${y}</option>`).join('')}</select></div>

      <p style="font-size:12.5px;color:var(--ink3);margin-top:-4px">Confirming this generates the certificate — ready to print/save as PDF — and adds it to this student's Student of the Month history.</p>
      <div class="mfoot"><button class="btn btn-o" data-x="c">Cancel</button><button class="btn btn-p" data-x="s">Generate Certificate</button></div></div>`, true);
    $('[data-x=c]',o).onclick=()=>o.remove();
    $('[data-x=s]',o).onclick=()=>{
      const name = $('#sotm-name',o).value.trim() || s.name;
      const monIdx = +$('#sotm-mon',o).value;
      const monEndVal = $('#sotm-monend',o).value;
      const year = +$('#sotm-yr',o).value;
      const customBody = $('#sotm-body',o).value.trim();
      const isRange = monEndVal!=='' && +monEndVal!==monIdx;

      const html = renderSOTMCertificate({ name, monthDisplay, year, isRange, customBody: customBody||null });
      DB.data.achievements.push({sid:s.id, text:'🌟 Student of the Month — '+monthDisplay, date:today(), type:'sotm'});

      DB.save();
      o.remove();
      toast('Added to Student of the Month history — opening the certificate');
      Router.render();
      openLetterPreview(html);
    };
  },

/* ================= MODULE: PROGRESS TRACKER (attendance/Qur'an/HW/CW) =================
   Session-by-session tracker layered on top of the existing roster.
   Attendance reuses DB.data.attendance/attendanceReasons as-is (same P/A/L/E
   codes attSummary(), the Class Day cockpit, and Prep radar already read) so
   nothing else in the app needs to change. Qur'an-reading-check/HW/CW are new
   per-session fields in DB.data.progress, since those questions ("did today's
   reading check pass", "did the 3 HW pages come back") aren't the same as the
   existing d.quran ḥifẓ-portion log or d.homework assignment sheets — both of
   those stay untouched and keep meaning what they already mean. */
const PT_MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
// Every real Saturday+Sunday for ANY given year — computed live rather than
// hardcoded, so the app keeps working correctly every future season without
// ever needing another manual date fix like the one applied on 2026-08-05
// (the original hardcoded 2026 list was wrong from July on). All 12 months
// are available — not just June–Dec — since some terms run outside that
// window too. A weekend spanning a month boundary (e.g. Oct 31/Nov 1) is
// split into each date's own calendar month.
function ptWeekendDates(year){
  const out = {};
  PT_MONTHS.forEach((name, i) => {
    const m = i + 1; // January=1 ... December=12
    const lastDay = new Date(year, m, 0).getDate();
    const days = [];
    for (let d = 1; d <= lastDay; d++) {
      const dow = new Date(year, m - 1, d).getDay();
      if (dow === 6 || dow === 0) days.push(String(m).padStart(2, '0') + '-' + String(d).padStart(2, '0'));
    }
    out[name] = days;
  });
  return out;
}
const PT_isSat = dateKey => new Date(dateKey+'T00:00:00').getDay()===6;
const ptFullDate = (year, md) => year+'-'+md;
const ptChip = (year, md) => md+' '+(PT_isSat(ptFullDate(year,md))?'Sat':'Sun');
// School closures — field trips, weather, illness, and (since these shift
// every year on the Gregorian calendar and can't be reliably computed) the
// two Eids and the last ten nights of Ramadan, added manually once known.
const CLOSURE_REASONS = ['Field Trip','Weather/Storm','Teacher Unavailable','Illness','Eid al-Fitr','Eid al-Adha','Ramadan (Last 10 Nights)','Other'];
const closureFor = dateKey => (DB.data.closures||[]).find(c=>c.date===dateKey) || null;
// Excludes closed dates — a closure isn't a session, so it never counts
// toward attendance/Qur'an/HW/CW totals or rates. Session-chip/schedule
// DISPLAY still uses ptWeekendDates() directly so closed days are still
// visible, just marked closed rather than hidden.
const ptMonthKeys = (year, m) => (ptWeekendDates(year)[m]||[]).map(md=>ptFullDate(year,md)).filter(dk=>!closureFor(dk));
const ptYearKeys = (year) => PT_MONTHS.flatMap(m=>ptMonthKeys(year,m));
// Given either half of a weekend, returns the real calendar dates for both
// the Saturday and the following Sunday — plain Date arithmetic, so a
// weekend that spans a month or year boundary (e.g. Oct 31/Nov 1) still
// pairs correctly without any special-casing.
function ptWeekendPair(session){
  const d = new Date(session+'T00:00:00');
  const iso = dt => dt.toISOString().slice(0,10);
  if(PT_isSat(session)){ const sun=new Date(d); sun.setDate(sun.getDate()+1); return {sat:session, sun:iso(sun)}; }
  const sat=new Date(d); sat.setDate(sat.getDate()-1); return {sat:iso(sat), sun:session};
}

// Attendance cycle writes the SAME codes attSummary()/cockpit already read
// (P/A/L/E); UA and EXC are just this module's friendlier on-screen labels
// for the existing 'A' (unexcused) and 'E' (excused) codes.
const PT_ATT_CYCLE = [undefined,'P','L','A','E'];
const PT_ATT_LABEL = {P:'P', L:'L', A:'UA', E:'EXC'};
const PT_Q_CYCLE = [null,'PASS','FAIL','EXC'];
const PT_HW_CYCLE = [null,'DONE','INC','EXC'];
const PT_CW_CYCLE = [null,'DONE','INC','EXC'];

const PT_GRADE_SCALE = [[95,'A+'],[90,'A'],[87,'A-'],[83,'B+'],[80,'B'],[77,'B-'],[73,'C+'],[70,'C'],[67,'C-'],[63,'D+'],[60,'D'],[0,'F']];
const ptGrade = pct => (PT_GRADE_SCALE.find(([m])=>pct>=m) || PT_GRADE_SCALE[PT_GRADE_SCALE.length-1])[1];
const ptLevelTag = L => L==='Level 1'?'tag-green':L==='Level 2'?'tag-blue':'tag-purple';

// Roster ordering — "Name" sorts on the full name string (which starts
// with the first name in this school's naming convention, so it reads as
// alphabetical-by-first-name with a natural tie-break on the rest of the
// name) using Arabic collation; "age-asc"/"age-desc" sort youngest\u2192oldest
// or oldest\u2192youngest. Undated students always land at the end of an age
// sort either way, rather than jumping to the top when the direction flips.
const ptAgeYears = s => s.dob ? (Date.now()-new Date(s.dob+'T00:00:00'))/3.15576e10 : null;
function ptSortStudents(arr, sort){
  const byName = (a,b) => (a.name||'').localeCompare(b.name||'','ar');
  if(sort==='age-asc' || sort==='age-desc') return [...arr].sort((a,b)=>{
    const aa=ptAgeYears(a), ab=ptAgeYears(b);
    if(aa==null && ab==null) return byName(a,b);
    if(aa==null) return 1; if(ab==null) return -1;
    return sort==='age-desc' ? ab-aa : aa-ab;
  });
  return [...arr].sort(byName);
}

function ptEntry(dateKey, sid){
  const d = DB.data;
  const att = (d.attendance[dateKey]||{})[sid];
  const p = (d.progress[dateKey]||{})[sid] || {};
  return {att, quran:p.quran||null, hw:p.hw||null, cw:p.cw||null};
}

function ptStats(sid, dateKeys){
  let present=0,late=0,ua=0,exc=0,total=0;
  let qPass=0,qTotal=0,hwDone=0,hwTotal=0,cwDone=0,cwTotal=0;
  let streak=0, broke=false;
  for(let i=dateKeys.length-1;i>=0;i--){
    const e = ptEntry(dateKeys[i], sid);
    if(e.quran==='PASS'){ if(!broke) streak++; }
    else if(e.quran==='FAIL'){ broke=true; }
  }
  dateKeys.forEach(dk=>{
    const e = ptEntry(dk, sid);
    if(e.att){
      total++;
      if(e.att==='P') present++;
      else if(e.att==='L'){ present++; late++; }
      else if(e.att==='A') ua++;
      else if(e.att==='E') exc++;
    }
    if(e.quran && e.quran!=='EXC'){ qTotal++; if(e.quran==='PASS') qPass++; }
    if(PT_isSat(dk) && e.hw && e.hw!=='EXC'){ hwTotal++; if(e.hw==='DONE') hwDone++; }
    if(e.cw && e.cw!=='EXC'){ cwTotal++; if(e.cw==='DONE') cwDone++; }
  });
  const nonExc = total-exc;
  return {
    total, present, late, ua, exc,
    attPct: nonExc>0 ? (present/nonExc)*100 : null,
    quranPct: qTotal>0 ? (qPass/qTotal)*100 : null,
    hwPct: hwTotal>0 ? (hwDone/hwTotal)*100 : null,
    cwPct: cwTotal>0 ? (cwDone/cwTotal)*100 : null,
    streak,
  };
}
// Student of the Month: 60% Qur'an pass rate + 25% HW + 15% CW.
function ptSom(st){ return (st.quranPct||0)*0.6 + (st.hwPct||0)*0.25 + (st.cwPct||0)*0.15; }

// Picks a sensible default year/month/session for "today", whatever year
// (and month — all 12 are valid now) that actually is.
function ptDefaultMonthSession(){
  const t=new Date(), y=t.getFullYear(), m=t.getMonth()+1, day=t.getDate();
  const weekends = ptWeekendDates(y);
  const month = PT_MONTHS[m-1];
  const md = String(m).padStart(2,'0')+'-'+String(day).padStart(2,'0');
  const chips = weekends[month];
  const cand = chips.filter(c=>c<=md);
  const openCand = cand.filter(c=>!closureFor(ptFullDate(y,c)));
  const pick = openCand.length ? openCand[openCand.length-1] : (cand.length ? cand[cand.length-1] : chips[0]);
  return {year:y, month, session: ptFullDate(y, pick)};
}

// Printable Weekend Recap — same convention as ptReportCardHTML/
// clnScheduleHTML: a self-contained HTML document with its own inline
// styles, opened via printHTMLDocument()'s Shadow DOM isolation (see that
// function's comment for why this can't be a live DOM clone or
// window.open()+document.write()). Mirrors whatever's on screen when it's
// generated — same weekend, same sort order, same percentage-hidden/
// revealed state — so it reads as a clean export of exactly what Nur is
// looking at, not a separate data view.
function ptPillColor(kind, val){
  if(kind==='att'){ if(val==='P'||val==='L') return '#276b43'; if(val==='A') return '#a13a2e'; if(val==='E') return '#33607e'; return '#9a9488'; }
  if(val==='PASS'||val==='DONE') return '#276b43';
  if(val==='FAIL'||val==='INC') return '#a13a2e';
  if(val==='EXC') return '#33607e';
  return '#9a9488';
}
function ptPrintDayCell(e, closed){
  if(closed) return `<div class="closedcell">Closed</div>`;
  return `<div class="daywrap">
    <span class="pchip" style="color:${ptPillColor('att',e.att)};border-color:${ptPillColor('att',e.att)}">${PT_ATT_LABEL[e.att]||'—'}</span>
    <span class="pchip" style="color:${ptPillColor('quran',e.quran)};border-color:${ptPillColor('quran',e.quran)}">${e.quran||'—'}</span>
    <span class="pchip" style="color:${ptPillColor('hw',e.hw)};border-color:${ptPillColor('hw',e.hw)}">${e.hw||'—'}</span>
    <span class="pchip" style="color:${ptPillColor('cw',e.cw)};border-color:${ptPillColor('cw',e.cw)}">${e.cw||'—'}</span>
  </div>`;
}
function ptPrintStudentRow(s, satDate, sunDate, satClosed, sunClosed, monthKeys, pctHidden, pctRevealed){
  const eSat = ptEntry(satDate, s.id), eSun = ptEntry(sunDate, s.id);
  const st = ptStats(s.id, monthKeys);
  const age = s.dob ? Math.floor(ptAgeYears(s)) : null;
  const showPct = !pctHidden || (pctRevealed && pctRevealed.has(s.id));
  return `<tr>
    <td><div class="who">
      <div class="photo">${s.photo?`<img src="${s.photo}" alt="">`:esc(initials(s.name))}</div>
      <div class="name" dir="rtl">${esc(s.name)}${age!=null?`<span class="age">${age}y</span>`:''}</div>
    </div></td>
    <td>${ptPrintDayCell(eSat, satClosed)}</td>
    <td>${ptPrintDayCell(eSun, sunClosed)}</td>
    <td class="pct">${showPct ? `<div>Qur\u2019an ${st.quranPct!=null?st.quranPct.toFixed(0)+'%':'—'}</div><div>HW ${st.hwPct!=null?st.hwPct.toFixed(0)+'%':'—'}</div><div>CW ${st.cwPct!=null?st.cwPct.toFixed(0)+'%':'—'}</div>` : `<span class="hiddenpct">Hidden</span>`}</td>
  </tr>`;
}
function ptWeekendPrintHTML(year, month, satDate, sunDate, levelGroups, pctHidden, pctRevealed){
  const monthKeys = ptMonthKeys(year, month);
  const satClosed = closureFor(satDate), sunClosed = closureFor(sunDate);
  const sections = LEVELS.map(L=>{
    const g = levelGroups[L]||[];
    if(!g.length) return '';
    return `<h2>${esc(L)} <span class="sub">${esc(LEVEL_SUB[L]||'')} · ${g.length}</span></h2>
    <table>
      <thead><tr><th>Student</th><th>Sat · ${fmtDate(satDate)}</th><th>Sun · ${fmtDate(sunDate)}</th><th>This month</th></tr></thead>
      <tbody>${g.map(s=>ptPrintStudentRow(s, satDate, sunDate, satClosed, sunClosed, monthKeys, pctHidden, pctRevealed)).join('')}</tbody>
    </table>`;
  }).join('');
  return `<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>Weekend Progress \u2014 ${fmtDate(satDate)}\u2013${fmtDate(sunDate)}</title>
<style>
  *{box-sizing:border-box}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background:#fff;color:#20261f;margin:0;padding:28px}
  .toolbar-actions{position:sticky;top:0;background:#123626;padding:10px 16px;display:flex;gap:10px;justify-content:center;margin:-28px -28px 20px;z-index:100}
  .toolbar-actions button{padding:9px 18px;border-radius:8px;border:none;font-weight:600;cursor:pointer;font-size:13.5px;background:#b8872a;color:#20261f}
  @media print{.toolbar-actions{display:none}body{padding:0}}
  h1{font-size:19px;color:#1a4a35;margin:0 0 2px}
  .subhd{font-size:12px;color:#686e5f;margin-bottom:6px}
  h2{font-size:14.5px;color:#1a4a35;border-bottom:2px solid #1a4a35;padding-bottom:5px;margin:22px 0 10px}
  h2 .sub{font-size:11px;font-weight:400;color:#686e5f}
  table{width:100%;border-collapse:collapse;font-size:12px;margin-bottom:4px}
  th{text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:#686e5f;padding:6px 8px;border-bottom:1px solid #d3c6a6}
  td{padding:8px;border-bottom:1px solid #e2d7bd;vertical-align:middle}
  .who{display:flex;align-items:center;gap:8px;min-width:140px}
  .photo{width:30px;height:30px;border-radius:50%;overflow:hidden;flex-shrink:0;background:#e7cf9b;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#1a4a35}
  .photo img{width:100%;height:100%;object-fit:cover}
  .name{direction:rtl;font-weight:600}
  .age{direction:ltr;display:inline-block;margin-left:6px;font-size:10px;font-weight:400;color:#686e5f}
  .daywrap{display:flex;gap:4px;flex-wrap:wrap}
  .pchip{display:inline-block;border:1px solid;border-radius:6px;padding:2px 6px;font-size:10px;font-weight:700;font-family:'DM Mono',monospace}
  .closedcell{color:#a13a2e;font-style:italic;font-size:11.5px}
  .pct{font-size:10.5px;color:#3a4139;line-height:1.5}
  .hiddenpct{font-style:italic;color:#9a9488}
  @media print{tr{page-break-inside:avoid}}
</style></head>
<body>
<div class="toolbar-actions"><button onclick="window.print()">\ud83d\udda8\ufe0f Print / Save as PDF</button></div>
<h1>Al-Madrasatu An-Nuriyyah \u2014 Weekend Progress</h1>
<div class="subhd">${fmtDate(satDate)} \u2013 ${fmtDate(sunDate)} \u00b7 Attendance (P/L/UA/EXC) \u00b7 Qur\u2019an/HW/CW (PASS or DONE / FAIL or INC / EXC)${pctHidden?' \u00b7 percentages hidden except where individually revealed':''}</div>
${sections || '<p style="font-size:13px;color:#686e5f">No students to show.</p>'}
</body></html>`;
}

const Progress = {
  render(v){ this._openId ? this.detail(v, this._openId) : this.roster(v); },

  // Shared by the full roster() render and _patchAfterCycle() below, so a
  // single tap-to-cycle never has to redraw more than the one row that
  // actually changed — see the comment on _patchAfterCycle for why that
  // matters (rebuilding avatar <img> markup on every tap was causing a
  // visible green flash on every student photo, every single tap).
  _rowHTML(s, L, session, monthKeys, sat){
    const e = ptEntry(session, s.id);
    const st = ptStats(s.id, monthKeys);
    const age = s.dob ? Math.floor(ptAgeYears(s)) : null;
    const uaTone = st.ua>=3 ? 'color:var(--bad);font-weight:800' : st.ua===2 ? 'color:var(--warn);font-weight:800' : '';
    const revealed = this._pctRevealed && this._pctRevealed.has(s.id);
    const showPct = !this._pctHidden || revealed;
    return `<div style="display:flex;align-items:center;gap:10px;cursor:pointer" data-ptopen="${s.id}">
        ${avatarHTML(s,'width:44px;height:44px;border-radius:50%;font-size:15px')}
        <div style="min-width:0;flex:1">
          <div style="font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis" dir="rtl">${esc(s.name)}</div>
          <div style="display:flex;gap:6px;align-items:center;margin-top:2px">
            <span class="tag ${ptLevelTag(L)}">${L}</span>
            ${this._ptSort!=='name' && age!=null?`<span style="font-size:11px;color:var(--ink3);font-family:var(--f-mono)">${age}y</span>`:''}
            ${st.streak>0?`<span style="font-size:11px;font-weight:700;color:var(--gold-text)">🔥${st.streak}</span>`:''}
          </div>
        </div>
      </div>
      <div style="display:flex;gap:6px;flex-wrap:wrap">
        <button class="pill-cyc ${e.att==='A'?'FAIL':e.att==='E'?'EXC':e.att==='P'?'PASS':e.att==='L'?'':''}" data-cyc="${s.id}_att" title="🕌 Attendance">${PT_ATT_LABEL[e.att]||'—'}</button>
        <button class="pill-cyc ${e.quran||''}" data-cyc="${s.id}_quran" title="📖 Qur'an">${e.quran||'—'}</button>
        <button class="pill-cyc ${e.hw||''}" data-cyc="${s.id}_hw" ${sat?'':'disabled'} title="📝 Homework">${sat?(e.hw||'—'):'—'}</button>
        <button class="pill-cyc ${e.cw||''}" data-cyc="${s.id}_cw" title="✏️ Classwork">${e.cw||'—'}</button>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:11px;font-family:var(--f-mono);color:var(--ink3)">
        ${showPct ? `
        <span>📖 ${st.quranPct!=null?st.quranPct.toFixed(0)+'%':'—'}</span>
        <span>📚 ${st.hwPct!=null?st.hwPct.toFixed(0)+'%':'—'}</span>
        <span>✏️ ${st.cwPct!=null?st.cwPct.toFixed(0)+'%':'—'}</span>
        <span style="${uaTone}">🚫 ${st.ua}</span>
        <span>⏱️ ${st.late}</span>
        ` : `<span style="font-style:italic;display:inline-flex;align-items:center;gap:4px">${PT_ICO_LOCK} Hidden</span>`}
        ${this._pctHidden ? `<button class="btn btn-ghost btn-sm no-print" data-ptpct="${s.id}" style="padding:1px 8px;font-size:11px;margin-left:auto" title="${revealed?'Hide again':'Reveal just this student'}">${revealed?PT_ICO_EYE_OFF+' Hide':PT_ICO_EYE+' Reveal'}</button>` : ''}
      </div>`;
  },
  // Weekend Recap variant of _rowHTML — same card, but shows Saturday's and
  // Sunday's cells as two stacked rows instead of just the one selected
  // session, so one screenshot covers the whole weekend. Tap-to-cycle still
  // works on either row; each pill carries its own date (data-cycw) since
  // two different dates are live on screen at once instead of one.
  _rowHTMLWeekend(s, L, satDate, sunDate, monthKeys){
    const eSat = ptEntry(satDate, s.id), eSun = ptEntry(sunDate, s.id);
    const satClosed = closureFor(satDate), sunClosed = closureFor(sunDate);
    const st = ptStats(s.id, monthKeys);
    const age = s.dob ? Math.floor(ptAgeYears(s)) : null;
    const uaTone = st.ua>=3 ? 'color:var(--bad);font-weight:800' : st.ua===2 ? 'color:var(--warn);font-weight:800' : '';
    const revealed = this._pctRevealed && this._pctRevealed.has(s.id);
    const showPct = !this._pctHidden || revealed;
    const dayRow = (dateKey, e, label, closed, hwEnabled) => `
      <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">
        <span style="font-size:10px;font-weight:700;color:var(--ink3);font-family:var(--f-mono);min-width:30px">${label}</span>
        ${closed ? `<span style="font-size:11px;color:var(--ink3);font-style:italic">⛔ Closed</span>` : `
        <button class="pill-cyc ${e.att==='A'?'FAIL':e.att==='E'?'EXC':e.att==='P'?'PASS':e.att==='L'?'':''}" data-cycw="${s.id}_att_${dateKey}" title="🕌 Attendance">${PT_ATT_LABEL[e.att]||'—'}</button>
        <button class="pill-cyc ${e.quran||''}" data-cycw="${s.id}_quran_${dateKey}" title="📖 Qur'an">${e.quran||'—'}</button>
        <button class="pill-cyc ${e.hw||''}" data-cycw="${s.id}_hw_${dateKey}" ${hwEnabled?'':'disabled'} title="📝 Homework">${hwEnabled?(e.hw||'—'):'—'}</button>
        <button class="pill-cyc ${e.cw||''}" data-cycw="${s.id}_cw_${dateKey}" title="✏️ Classwork">${e.cw||'—'}</button>
        `}
      </div>`;
    return `<div style="display:flex;align-items:center;gap:10px;cursor:pointer" data-ptopen="${s.id}">
        ${avatarHTML(s,'width:44px;height:44px;border-radius:50%;font-size:15px')}
        <div style="min-width:0;flex:1">
          <div style="font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis" dir="rtl">${esc(s.name)}</div>
          <div style="display:flex;gap:6px;align-items:center;margin-top:2px">
            <span class="tag ${ptLevelTag(L)}">${L}</span>
            ${this._ptSort!=='name' && age!=null?`<span style="font-size:11px;color:var(--ink3);font-family:var(--f-mono)">${age}y</span>`:''}
            ${st.streak>0?`<span style="font-size:11px;font-weight:700;color:var(--gold-text)">🔥${st.streak}</span>`:''}
          </div>
        </div>
      </div>
      <div style="display:flex;flex-direction:column;gap:5px">
        ${dayRow(satDate, eSat, 'Sat', satClosed, true)}
        ${dayRow(sunDate, eSun, 'Sun', sunClosed, false)}
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:11px;font-family:var(--f-mono);color:var(--ink3)">
        ${showPct ? `
        <span>📖 ${st.quranPct!=null?st.quranPct.toFixed(0)+'%':'—'}</span>
        <span>📚 ${st.hwPct!=null?st.hwPct.toFixed(0)+'%':'—'}</span>
        <span>✏️ ${st.cwPct!=null?st.cwPct.toFixed(0)+'%':'—'}</span>
        <span style="${uaTone}">🚫 ${st.ua}</span>
        <span>⏱️ ${st.late}</span>
        ` : `<span style="font-style:italic;display:inline-flex;align-items:center;gap:4px">${PT_ICO_LOCK} Hidden</span>`}
        ${this._pctHidden ? `<button class="btn btn-ghost btn-sm no-print" data-ptpct="${s.id}" style="padding:1px 8px;font-size:11px;margin-left:auto" title="${revealed?'Hide again':'Reveal just this student'}">${revealed?PT_ICO_EYE_OFF+' Hide':PT_ICO_EYE+' Reveal'}</button>` : ''}
      </div>`;
  },
  _liveCounterHTML(all, session, sat){
    let present=0,late=0,ua=0,qP=0,qT=0,hD=0,hT=0,cD=0,cT=0;
    all.forEach(s=>{ const e=ptEntry(session,s.id);
      if(e.att==='P') present++; else if(e.att==='L'){ present++; late++; } else if(e.att==='A') ua++;
      if(e.quran && e.quran!=='EXC'){ qT++; if(e.quran==='PASS') qP++; }
      if(sat && e.hw && e.hw!=='EXC'){ hT++; if(e.hw==='DONE') hD++; }
      if(e.cw && e.cw!=='EXC'){ cT++; if(e.cw==='DONE') cD++; }
    });
    return `<b style="font-family:var(--f-mono);font-size:11.5px;opacity:.85">${fmtDate(session)}</b>
       <span>✅ ${present} present</span><span>🕐 ${late} late</span><span>⚠️ ${ua} UA</span>
       <span>📖 ${qT?Math.round(qP/qT*100)+'%':'—'}</span>
       <span>📝 HW ${hT?Math.round(hD/hT*100)+'%':'—'}</span>
       <span>✏️ CW ${cT?Math.round(cD/cT*100)+'%':'—'}</span>`;
  },
  // Weekend Recap variant — same tally, combined across both Saturday and
  // Sunday's sessions instead of just the one selected date.
  _liveCounterHTMLWeekend(all, satDate, sunDate){
    let present=0,late=0,ua=0,qP=0,qT=0,hD=0,hT=0,cD=0,cT=0;
    all.forEach(s=>{
      [satDate,sunDate].forEach((dk,i)=>{ if(!dk || closureFor(dk)) return; const e=ptEntry(dk,s.id);
        if(e.att==='P') present++; else if(e.att==='L'){ present++; late++; } else if(e.att==='A') ua++;
        if(e.quran && e.quran!=='EXC'){ qT++; if(e.quran==='PASS') qP++; }
        if(i===0 && e.hw && e.hw!=='EXC'){ hT++; if(e.hw==='DONE') hD++; } // HW is Saturday-only
        if(e.cw && e.cw!=='EXC'){ cT++; if(e.cw==='DONE') cD++; }
      });
    });
    return `<b style="font-family:var(--f-mono);font-size:11.5px;opacity:.85">🗓️ ${fmtDate(satDate)} – ${fmtDate(sunDate)}</b>
       <span>✅ ${present} present</span><span>🕐 ${late} late</span><span>⚠️ ${ua} UA</span>
       <span>📖 ${qT?Math.round(qP/qT*100)+'%':'—'}</span>
       <span>📝 HW ${hT?Math.round(hD/hT*100)+'%':'—'}</span>
       <span>✏️ CW ${cT?Math.round(cD/cT*100)+'%':'—'}</span>`;
  },
  _somBodyHTML(all, monthKeys){
    const somByLevel={};
    LEVELS.forEach(L=>{
      const scored = all.filter(s=>s.level===L).map(s=>({s, st:ptStats(s.id,monthKeys)})).filter(x=>x.st.total>0)
        .map(x=>({...x, score:ptSom(x.st)})).sort((a,b)=>b.score-a.score);
      somByLevel[L] = scored[0]||null;
    });
    return LEVELS.map(L=>{ const top=somByLevel[L];
      return `<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 10px;border-radius:9px;background:var(--surface2)">
        <div style="display:flex;align-items:center;gap:8px">
          <span class="tag ${ptLevelTag(L)}">${L}</span>
          ${top ? `<b dir="rtl">${esc(top.s.name)}</b>` : `<span style="color:var(--ink3);font-size:12.5px">No students currently enrolled</span>`}
        </div>
        ${top?`<b style="font-family:var(--f-mono)">${top.score.toFixed(1)}</b>`:''}
      </div>`; }).join('');
  },
  // A tap-to-cycle only ever changes ONE cell's underlying data — patching
  // just that row (plus the live counter and SoM panel, which are the only
  // other things a single tap can affect) instead of calling _repaint()
  // (which redraws the entire roster via v.innerHTML) means every other
  // student's avatar is never touched, so it can't flash. Previously every
  // tap rebuilt all ~40 <img> tags at once; the brief moment before each one
  // repaints is when .avatar's green gradient fallback background shows
  // through — that's what was flashing.
  _patchAfterCycle(v, sid){
    const year=this._year, month=this._month, session=this._session, sat=PT_isSat(session);
    const monthKeys = ptMonthKeys(year, month);
    const all = DB.data.students.filter(s=>s.active!==false);
    const s = all.find(x=>x.id===sid);
    // Weekend Recap patches both days' worth of cells from the same
    // single-row patch, since either day's pill can be the one tapped.
    const wk = this._weekendView ? ptWeekendPair(session) : null;
    if(s){
      const row = v.querySelector(`[data-row="${sid}"]`);
      if(row) row.innerHTML = wk ? this._rowHTMLWeekend(s, s.level, wk.sat, wk.sun, monthKeys) : this._rowHTML(s, s.level, session, monthKeys, sat);
    }
    const lc = $('#ptLiveCounter',v);
    if(lc) lc.innerHTML = wk ? this._liveCounterHTMLWeekend(all, wk.sat, wk.sun) : this._liveCounterHTML(all, session, sat);
    const somBody = $('#ptSomBody',v);
    if(somBody) somBody.innerHTML = this._somBodyHTML(all, monthKeys);
    // Re-wire only the patched row's own cells — everything else's
    // listeners are untouched since their DOM nodes were never replaced.
    if(s){
      const row = v.querySelector(`[data-row="${sid}"]`);
      if(row){
        $$('[data-cyc]',row).forEach(b=>{ if(b.disabled) return; b.onclick=()=>{
          const [rsid,field]=b.dataset.cyc.split('_');
          this.cycle(session, rsid, field); this._patchAfterCycle(v, rsid);
        }; });
        $$('[data-cycw]',row).forEach(b=>{ if(b.disabled) return; b.onclick=()=>{
          const [rsid,field,dateKey]=b.dataset.cycw.split('_');
          this.cycle(dateKey, rsid, field); this._patchAfterCycle(v, rsid);
        }; });
        $$('[data-ptopen]',row).forEach(b=>b.onclick=()=>{ this._openId=b.dataset.ptopen; this._tab='overview'; Router.render(); });
        $$('[data-ptpct]',row).forEach(b=>b.onclick=()=>{
          const rsid=b.dataset.ptpct;
          if(this._pctRevealed.has(rsid)) this._pctRevealed.delete(rsid); else this._pctRevealed.add(rsid);
          this._repaint(v);
        });
      }
    }
  },

  roster(v){
    if(!this._month){ const dm=ptDefaultMonthSession(); this._year=dm.year; this._month=dm.month; this._session=dm.session; }
    if(this._somOpen===undefined) this._somOpen=true;
    if(this._pctHidden===undefined) this._pctHidden=false;
    if(!this._pctRevealed) this._pctRevealed=new Set();
    if(this._weekendView===undefined) this._weekendView=false;
    if(this._ptSort===undefined) this._ptSort='name';
    if(this._liveCounterOpen===undefined) this._liveCounterOpen=true;
    if(this._sortOpen===undefined) this._sortOpen=true;
    const year=this._year, month=this._month, session=this._session, sat=PT_isSat(session);
    const monthKeys = ptMonthKeys(year, month);
    const all = DB.data.students.filter(s=>s.active!==false);
    const lvl = this._levelFilter||'', find=(this._find||'').trim();
    const shown = ptSortStudents(all.filter(s => (!lvl||s.level===lvl) && (!find||s.name.includes(find))), this._ptSort);
    // Grouped once here (respecting the current level/search filter and
    // sort order) so the on-screen cards and the Print/PDF export below
    // both read from the exact same ordering — the export is a clean copy
    // of what's on screen, not a separately-computed view.
    const levelGroups = {};
    LEVELS.forEach(L=>{ levelGroups[L] = shown.filter(s=>s.level===L); });
    // In Weekend Recap mode a single closed day shouldn't blank the whole
    // roster — _rowHTMLWeekend already shows "⛔ Closed" for just that
    // day's row. Only fall back to the full-page closed banner when BOTH
    // days of the pair are closed (nothing to show either way).
    const wk = this._weekendView ? ptWeekendPair(session) : null;
    const closed = wk ? (closureFor(wk.sat) && closureFor(wk.sun) ? closureFor(wk.sat) : null) : closureFor(session);

    v.innerHTML = `<button class="btn btn-ghost btn-sm no-print" data-go="#/students">← Students</button>
     <div class="eyebrow" style="margin-top:12px">Student Progress</div><h2 class="page-title">Progress Tracker</h2>
     <p class="page-sub">Attendance · Qur'an · Homework · Classwork — one tap per cell, saves instantly.</p>
     <div class="filters no-print">
       <button class="btn btn-o btn-sm" id="ptClosures">📅 Manage closures</button>
       <button class="btn ${this._pctHidden?'btn-p':'btn-o'} btn-sm" id="ptPctHide">${this._pctHidden?PT_ICO_EYE+' Percentages hidden':PT_ICO_EYE_OFF+' Hide percentages for screenshot'}</button>
       <button class="btn ${this._weekendView?'btn-p':'btn-o'} btn-sm" id="ptWeekendView">${this._weekendView?'📅 Single day':'🗓️ Show Sat + Sun'}</button>
       ${wk?`<button class="btn btn-p btn-sm" id="ptWeekendPrint">🖨️ Print / Save as PDF</button>`:''}
     </div>
     ${this._pctHidden?`<p class="page-sub" style="margin-top:-6px">Percentages are hidden class-wide. Tap Reveal on one student at a time before you screenshot, then Hide it again for the next.</p>`:''}
     ${wk?`<p class="page-sub" style="margin-top:-6px">Showing the weekend of ${fmtDate(wk.sat)} – ${fmtDate(wk.sun)} — both days on one card, good for a single screenshot.</p>`:''}

     <div class="filters no-print" style="align-items:center;gap:10px">
       <button class="btn btn-ghost btn-sm" id="ptYearPrev" aria-label="Previous year">←</button>
       <b style="font-family:var(--f-mono);font-size:15px;min-width:52px;text-align:center">${year}</b>
       <button class="btn btn-ghost btn-sm" id="ptYearNext" aria-label="Next year">→</button>
     </div>
     <div class="filters no-print" style="align-items:center;gap:10px;margin-top:-6px">
       <button class="btn btn-ghost btn-sm" id="ptMonthPrev" aria-label="Previous month">←</button>
       <b style="font-family:var(--f-display);font-size:15px;min-width:120px;text-align:center">${month}</b>
       <button class="btn btn-ghost btn-sm" id="ptMonthNext" aria-label="Next month">→</button>
     </div>
     <div class="filters no-print" style="overflow-x:auto;flex-wrap:nowrap;margin-top:-6px">
       ${ptWeekendDates(year)[month].map(md=>{ const dk=ptFullDate(year,md); const c=closureFor(dk);
         return `<button class="chip ${dk===session?'on':''}" style="${c?'opacity:.6;text-decoration:line-through':''}" data-ptsession="${md}">${c?'⛔ ':''}${ptChip(year,md)}</button>`; }).join('')}
     </div>

     ${closed ? `
     <div class="notice warn" style="margin-bottom:14px">
       <span>⛔</span><span><b>School closed — ${esc(closed.reason)}</b>${closed.note?` · ${esc(closed.note)}`:''}<br><span style="font-size:12px;color:var(--ink2)">${wk?`Both ${fmtDate(wk.sat)} and ${fmtDate(wk.sun)} aren't`:`${fmtDate(session)} isn't`} counted as a session. Pick a different date above to take attendance.</span></span>
     </div>` : `
     <details class="card" style="margin-bottom:14px" id="ptLiveCounterD" ${this._liveCounterOpen?'open':''}>
       <summary style="cursor:pointer;font-weight:700;color:var(--green);font-size:13px">📊 Class totals — ${wk?`${fmtDate(wk.sat)} – ${fmtDate(wk.sun)}`:fmtDate(session)}</summary>
       <div id="ptLiveCounter" style="background:var(--green);color:#fff;display:flex;flex-wrap:wrap;gap:14px;align-items:center;padding:12px 16px;margin-top:10px;border-radius:10px">${wk ? this._liveCounterHTMLWeekend(all, wk.sat, wk.sun) : this._liveCounterHTML(all, session, sat)}</div>
     </details>

     <div class="filters no-print">
       <button class="chip ${!lvl?'on':''}" data-ptlvl="">All</button>
       ${LEVELS.map(L=>`<button class="chip ${lvl===L?'on':''}" data-ptlvl="${L}">${L}</button>`).join('')}
       <input type="search" id="ptFind" placeholder="Find student…" value="${esc(find)}" dir="rtl" style="max-width:190px">
     </div>
     <details class="card" style="margin-bottom:14px" id="ptSortD" ${this._sortOpen?'open':''}>
       <summary style="cursor:pointer;font-weight:700;color:var(--green);font-size:13px">Sort</summary>
       <div class="filters" style="margin-top:10px">
         <button class="chip ${this._ptSort==='name'?'on':''}" data-ptsort="name">Name</button>
         <button class="chip ${this._ptSort==='age-asc'?'on':''}" data-ptsort="age-asc">Youngest first</button>
         <button class="chip ${this._ptSort==='age-desc'?'on':''}" data-ptsort="age-desc">Oldest first</button>
       </div>
     </details>

     ${shown.length ? LEVELS.map(L=>{ const g=levelGroups[L]; if(!g.length) return '';
       return `<div class="sect">${L} — ${LEVEL_SUB[L]}<span class="rule"></span><span style="font-family:var(--f-mono);font-size:12px;color:var(--ink3);font-weight:400">${g.length}</span></div>
        <div class="grid g2">${g.map(s=>`<div class="card" data-row="${s.id}" style="padding:12px 14px;display:flex;flex-direction:column;gap:9px">${wk ? this._rowHTMLWeekend(s, L, wk.sat, wk.sun, monthKeys) : this._rowHTML(s, L, session, monthKeys, sat)}</div>`).join('')}</div>`;
     }).join('') : '<div class="empty"><p>No students match.</p></div>'}
     `}

     <details class="card" style="margin-top:6px" ${this._somOpen?'open':''} id="ptSom">
       <summary style="cursor:pointer;font-weight:700;color:var(--green)">🌟 Student of the Month — ${month} ${year}</summary>
       <div id="ptSomBody" style="display:flex;flex-direction:column;gap:8px;margin-top:12px">${this._somBodyHTML(all, monthKeys)}</div>
     </details>`;

    wireCommon(v);
    // These five all edit state on the roster you're already looking at —
    // they repaint in place via _repaint(), never through Router.render().
    // Router.render() always does window.scrollTo(0,0) (correct for an
    // actual page navigation, e.g. opening a student below), but calling it
    // for something as small as one tap-to-cycle button meant every single
    // attendance/Qur'an/HW/CW tap threw the whole page back to the top —
    // exactly the "jumps to the top every tap" bug reported.
    $('#ptYearPrev',v).onclick=()=>{ this._year--; this._month='June'; this._session=ptFullDate(this._year, ptWeekendDates(this._year).June[0]); this._repaint(v); };
    $('#ptYearNext',v).onclick=()=>{ this._year++; this._month='June'; this._session=ptFullDate(this._year, ptWeekendDates(this._year).June[0]); this._repaint(v); };
    // Steps by month rather than jumping to a fixed month like the Year
    // buttons do, and rolls the year over automatically at Dec\u2194Jan so
    // browsing never gets stuck at a year boundary.
    $('#ptMonthPrev',v).onclick=()=>{ let idx=PT_MONTHS.indexOf(this._month)-1, yr=this._year; if(idx<0){ idx=11; yr--; } this._year=yr; this._month=PT_MONTHS[idx]; this._session=ptFullDate(yr, ptWeekendDates(yr)[this._month][0]); this._repaint(v); };
    $('#ptMonthNext',v).onclick=()=>{ let idx=PT_MONTHS.indexOf(this._month)+1, yr=this._year; if(idx>11){ idx=0; yr++; } this._year=yr; this._month=PT_MONTHS[idx]; this._session=ptFullDate(yr, ptWeekendDates(yr)[this._month][0]); this._repaint(v); };
    $$('[data-ptsession]',v).forEach(b=>b.onclick=()=>{ this._session=ptFullDate(year, b.dataset.ptsession); this._repaint(v); });
    $$('[data-ptlvl]',v).forEach(b=>b.onclick=()=>{ this._levelFilter=b.dataset.ptlvl; this._repaint(v); });
    const f=$('#ptFind',v);
    if(f) f.oninput=()=>{ this._find=f.value; clearTimeout(this._ft); this._ft=setTimeout(()=>{ this._repaint(v); const nf=$('#ptFind'); if(nf){ nf.focus(); nf.setSelectionRange(nf.value.length,nf.value.length); } },250); };
    const somEl=$('#ptSom',v); if(somEl) somEl.ontoggle=()=>{ this._somOpen=somEl.open; };
    const lcD=$('#ptLiveCounterD',v); if(lcD) lcD.ontoggle=()=>{ this._liveCounterOpen=lcD.open; };
    const sortD=$('#ptSortD',v); if(sortD) sortD.ontoggle=()=>{ this._sortOpen=sortD.open; };
    // Opening a student IS a real navigation to a new screen, so this one
    // keeps Router.render() — scrolling to the top of the detail view on
    // open is the behavior you'd actually want here.
    $$('[data-ptopen]',v).forEach(b=>b.onclick=()=>{ this._openId=b.dataset.ptopen; this._tab='overview'; Router.render(); });
    $$('[data-cyc]',v).forEach(b=>{ if(b.disabled) return; b.onclick=()=>{
      const [sid,field]=b.dataset.cyc.split('_');
      this.cycle(session, sid, field); this._patchAfterCycle(v, sid);
    }; });
    $$('[data-cycw]',v).forEach(b=>{ if(b.disabled) return; b.onclick=()=>{
      const [sid,field,dateKey]=b.dataset.cycw.split('_');
      this.cycle(dateKey, sid, field); this._patchAfterCycle(v, sid);
    }; });
    $('#ptClosures',v).onclick=()=>this.closuresModal(v);
    $('#ptPctHide',v).onclick=()=>{ this._pctHidden=!this._pctHidden; if(!this._pctHidden) this._pctRevealed.clear(); this._repaint(v); };
    $('#ptWeekendView',v).onclick=()=>{ this._weekendView=!this._weekendView; this._repaint(v); };
    $$('[data-ptsort]',v).forEach(b=>b.onclick=()=>{ this._ptSort=b.dataset.ptsort; this._repaint(v); });
    const wPrint = $('#ptWeekendPrint',v);
    if(wPrint) wPrint.onclick=()=>printHTMLDocument(ptWeekendPrintHTML(year, month, wk.sat, wk.sun, levelGroups, this._pctHidden, this._pctRevealed));
    $$('[data-ptpct]',v).forEach(b=>b.onclick=()=>{
      const sid=b.dataset.ptpct;
      if(this._pctRevealed.has(sid)) this._pctRevealed.delete(sid); else this._pctRevealed.add(sid);
      this._repaint(v);
    });
  },

  // Add/remove school closures (field trips, weather, illness, Eid, the
  // last ten nights of Ramadan, etc.). Shared by Progress Tracker and the
  // Cleaning Schedule — both read DB.data.closures directly.
  closuresModal(v, onChange){
    const repaint = onChange || (()=>this._repaint(v));
    const list = (DB.data.closures||[]).slice().sort((a,b)=>a.date<b.date?-1:1);
    const o = overlay(`<div class="modal" style="max-width:480px">
      <h3>📅 School closures</h3>
      <p style="font-size:12.5px;color:var(--ink2);margin-top:-6px">A closed date isn't counted as a session — it won't affect attendance or Qur'an/HW/CW rates, and the Cleaning Schedule skips it.</p>
      <div style="display:flex;flex-direction:column;gap:6px;max-height:220px;overflow-y:auto;margin:12px 0">
        ${list.length ? list.map(c=>`<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 10px;background:var(--surface2);border-radius:8px">
          <div><b style="font-family:var(--f-mono);font-size:12.5px">${fmtDate(c.date)}</b> <span style="font-size:12.5px">— ${esc(c.reason)}</span>${c.note?`<div style="font-size:11.5px;color:var(--ink3)">${esc(c.note)}</div>`:''}</div>
          <button class="btn btn-ghost btn-sm" data-delclosure="${c.id}">✕</button>
        </div>`).join('') : '<p style="font-size:13px;color:var(--ink2)">No closures added yet.</p>'}
      </div>
      <div class="grid" style="grid-template-columns:1fr 1fr;gap:10px">
        <div class="field"><label>Date</label><input type="date" id="cl-d1"></div>
        <div class="field"><label>Through (optional — for a range like Ramadan's last 10 nights)</label><input type="date" id="cl-d2"></div>
      </div>
      <div class="field"><label>Reason</label><select id="cl-r">${CLOSURE_REASONS.map(r=>`<option>${esc(r)}</option>`).join('')}</select></div>
      <div class="field"><label>Note (optional)</label><input id="cl-n" placeholder="e.g. Six Flags trip, or which masjid confirmed Eid"></div>
      <div class="mfoot"><button class="btn btn-o" data-x="c">Close</button><button class="btn btn-p" id="cl-add">＋ Add</button></div>
    </div>`, true);
    $('[data-x=c]',o).onclick=()=>{ o.remove(); repaint(); };
    $$('[data-delclosure]',o).forEach(b=>b.onclick=()=>{
      DB.data.closures = (DB.data.closures||[]).filter(c=>c.id!==b.dataset.delclosure);
      DB.save(); o.remove(); this.closuresModal(v, onChange);
    });
    $('#cl-add',o).onclick=()=>{
      const d1=$('#cl-d1',o).value, d2=$('#cl-d2',o).value, reason=$('#cl-r',o).value, note=$('#cl-n',o).value.trim();
      if(!d1){ toast('Pick a date'); return; }
      const start=new Date(d1+'T00:00:00'), end=d2? new Date(d2+'T00:00:00') : start;
      if(end<start){ toast('"Through" date is before the start date'); return; }
      DB.data.closures = DB.data.closures || [];
      for(let dt=new Date(start); dt<=end; dt.setDate(dt.getDate()+1)){
        const dk = dt.toISOString().slice(0,10);
        if(!DB.data.closures.some(c=>c.date===dk)) DB.data.closures.push({id:uid(), date:dk, reason, note});
      }
      DB.save(); DB.log('School closure added — '+reason+' ('+d1+(d2&&d2!==d1?' through '+d2:'')+')');
      o.remove(); toast('Closure added'); this.closuresModal(v, onChange);
    };
  },

  // Redraws just the roster in place. Deliberately not Router.render(): no
  // scroll reset, no focus change, no sidebar/nav-highlight side effects —
  // those all make sense for a real navigation, not for a one-tap edit to
  // the list already on screen.
  _repaint(v){ this.roster(v); },

  cycle(dateKey, sid, field){
    const d=DB.data;
    if(field==='att'){
      d.attendance[dateKey]=d.attendance[dateKey]||{};
      const nv=ptNext(PT_ATT_CYCLE, d.attendance[dateKey][sid]);
      if(nv===undefined) delete d.attendance[dateKey][sid]; else d.attendance[dateKey][sid]=nv;
    } else {
      d.progress[dateKey]=d.progress[dateKey]||{};
      d.progress[dateKey][sid]=d.progress[dateKey][sid]||{quran:null,hw:null,cw:null};
      const cycle = field==='quran'?PT_Q_CYCLE:field==='hw'?PT_HW_CYCLE:PT_CW_CYCLE;
      d.progress[dateKey][sid][field]=ptNext(cycle, d.progress[dateKey][sid][field]);
    }
    DB.save();
  },

  detail(v, sid){
    const s=DB.data.students.find(x=>x.id===sid);
    if(!s){ this._openId=null; return this.roster(v); }
    const tab=this._tab||'overview';
    const year=this._year||new Date().getFullYear();
    const yearKeys=ptYearKeys(year);
    const yearStats=ptStats(sid, yearKeys);
    const monthlyRows=PT_MONTHS.map(m=>({month:m, ...ptStats(sid, ptMonthKeys(year,m))}));
    const age = s.dob ? Math.floor((Date.now()-new Date(s.dob+'T00:00:00'))/3.15576e10) : null;
    const T={overview:'Overview', quran:'Qur\u2019an', attendance:'Attendance', report:'Report Card'};

    v.innerHTML = `<button class="btn btn-ghost btn-sm no-print" id="ptBack">← Back to Progress Tracker</button>
     <div class="card" style="display:flex;gap:14px;align-items:center;margin:12px 0 16px">
       ${avatarHTML(s,'width:64px;height:64px;border-radius:50%;font-size:20px')}
       <div style="min-width:0">
         <div style="font-size:19px;font-weight:700" dir="rtl">${esc(s.name)}</div>
         <div style="display:flex;gap:8px;align-items:center;margin-top:4px;flex-wrap:wrap">
           <span class="tag ${ptLevelTag(s.level)}">${s.level}</span>
           <span style="font-size:12px;color:var(--ink2)">${LEVEL_SUB[s.level]}</span>
           <span class="tag tag-dim">${year}</span>
         </div>
         <div style="font-size:12px;color:var(--ink3);font-family:var(--f-mono);margin-top:3px">${s.dob?('DOB '+s.dob+(age!=null?' · '+age+'y':'')):''}</div>
       </div>
     </div>
     <div class="tabs no-print">${Object.entries(T).map(([k,n])=>`<button class="${k===tab?'on':''}" data-pttab="${k}">${n}</button>`).join('')}</div>
     <div id="ptTabBody" style="margin-top:14px"></div>`;
    wireCommon(v);
    $('#ptBack',v).onclick=()=>{ this._openId=null; Router.render(); };
    $$('[data-pttab]',v).forEach(b=>b.onclick=()=>{ this._tab=b.dataset.pttab; Router.render(); });

    const body=$('#ptTabBody',v);
    if(tab==='overview') body.innerHTML=this._tplOverview(monthlyRows);
    else if(tab==='quran') body.innerHTML=this._tplQuran(sid, yearKeys, yearStats, year);
    else if(tab==='attendance') body.innerHTML=this._tplAttendance(sid, yearKeys, yearStats);
    else body.innerHTML=this._tplReport(s, monthlyRows, yearStats);

    if(tab==='report'){
      const ta=$('#ptComment',v);
      if(ta) ta.onblur=()=>{ DB.data.progressComments[sid]=ta.value.trim(); DB.save(); };
      const pb=$('#ptPrint',v);
      if(pb) pb.onclick=()=>printHTMLDocument(ptReportCardHTML(s, monthlyRows, yearStats, DB.data.progressComments[sid]||''));
    }
  },

  _tplOverview(monthlyRows){
    const avg = k => { const vals=monthlyRows.map(r=>r[k]).filter(v=>v!=null); return vals.length? vals.reduce((a,b)=>a+b,0)/vals.length : null; };
    const cur = ptDefaultMonthSession().month;
    const curRow = monthlyRows.find(r=>r.month===cur) || monthlyRows[0];
    const som = ptSom(curRow);
    return `<div class="card" style="margin-bottom:14px;overflow-x:auto">
      <table class="tbl"><thead><tr><th>Month</th><th style="text-align:right">Qur'an%</th><th style="text-align:right">HW%</th><th style="text-align:right">CW%</th><th style="text-align:right">UA</th><th style="text-align:right">Late</th></tr></thead>
      <tbody>${monthlyRows.map(r=>`<tr><td><b>${r.month}</b></td>
        <td style="text-align:right">${r.quranPct!=null?r.quranPct.toFixed(0):'—'}</td>
        <td style="text-align:right">${r.hwPct!=null?r.hwPct.toFixed(0):'—'}</td>
        <td style="text-align:right">${r.cwPct!=null?r.cwPct.toFixed(0):'—'}</td>
        <td style="text-align:right">${r.ua}</td><td style="text-align:right">${r.late}</td></tr>`).join('')}
        <tr style="border-top:2px solid var(--line2)"><td><b>Year avg</b></td>
        <td style="text-align:right"><b>${avg('quranPct')!=null?avg('quranPct').toFixed(0):'—'}</b></td>
        <td style="text-align:right"><b>${avg('hwPct')!=null?avg('hwPct').toFixed(0):'—'}</b></td>
        <td style="text-align:right"><b>${avg('cwPct')!=null?avg('cwPct').toFixed(0):'—'}</b></td>
        <td style="text-align:right"><b>${monthlyRows.reduce((a,r)=>a+r.ua,0)}</b></td>
        <td style="text-align:right"><b>${monthlyRows.reduce((a,r)=>a+r.late,0)}</b></td></tr>
      </tbody></table>
    </div>
    <div class="card" style="margin-bottom:14px">
      <div style="font-size:12px;font-weight:700;color:var(--ink2);margin-bottom:8px">${cur.toUpperCase()} — STUDENT OF THE MONTH SCORE</div>
      <div style="display:flex;align-items:center;gap:12px">
        <div class="bar" style="flex:1"><i style="width:${Math.min(100,som)}%"></i></div>
        <b style="font-family:var(--f-mono);font-size:18px;min-width:44px;text-align:right">${som.toFixed(1)}</b>
      </div>
    </div>
    <div class="notice info"><span>📖</span><span>Memorization tracking (current sūrah, progress, ayāt done) lives in AMAN Central's separate ḥifẓ module — not shown here.</span></div>`;
  },

  _tplQuran(sid, yearKeys, yearStats, year){
    const monthly = PT_MONTHS.map(m=>({month:m, pct: ptStats(sid, ptMonthKeys(year,m)).quranPct}));
    const timeline = yearKeys.map(dk=>({dk, e:ptEntry(dk,sid)})).filter(x=>x.e.quran);
    return `<div class="grid g2" style="margin-bottom:14px">
      <div class="card" style="text-align:center">
        <div style="font-size:26px;font-weight:800;color:var(--gold-text)">🔥 ${yearStats.streak}</div>
        <div style="font-size:11.5px;color:var(--ink2);font-weight:600">Current streak</div>
      </div>
      <div class="card" style="text-align:center">
        <div style="font-size:26px;font-weight:800;color:var(--green)">${yearStats.quranPct!=null?yearStats.quranPct.toFixed(0)+'%':'—'}</div>
        <div style="font-size:11.5px;color:var(--ink2);font-weight:600">Year pass rate</div>
      </div>
    </div>
    <div class="card" style="margin-bottom:14px">
      <div style="font-size:12px;font-weight:700;color:var(--ink2);margin-bottom:10px">PASS RATE BY MONTH</div>
      <div style="display:flex;gap:8px;align-items:flex-end;height:74px">
        ${monthly.map(m=>`<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end">
          <div style="width:100%;flex:1;background:var(--surface2);border-radius:4px;display:flex;align-items:flex-end;overflow:hidden">
            ${m.pct!=null?`<div style="width:100%;height:${Math.max(4,m.pct)}%;background:linear-gradient(180deg,var(--gold),var(--green))"></div>`:''}
          </div>
          <span style="font-size:9.5px;color:var(--ink3);font-family:var(--f-mono)">${m.month.slice(0,3)}</span>
        </div>`).join('')}
      </div>
    </div>
    <div class="card">
      <div style="font-size:12px;font-weight:700;color:var(--ink2);margin-bottom:10px">SESSION-BY-SESSION TIMELINE</div>
      <div style="display:flex;flex-direction:column;gap:6px;max-height:340px;overflow-y:auto">
        ${timeline.length? timeline.map(({dk,e})=>`<div style="display:flex;justify-content:space-between;align-items:center;padding:7px 10px;border-radius:8px;background:var(--surface2)">
          <span style="font-size:12px;font-family:var(--f-mono)">${dk}</span>
          <span class="pill-cyc ${e.quran}" style="pointer-events:none">${e.quran}</span>
        </div>`).join('') : '<p style="font-size:13px;color:var(--ink2)">No Qur\u2019an results recorded yet.</p>'}
      </div>
    </div>`;
  },

  _tplAttendance(sid, yearKeys, yearStats){
    const list = yearKeys.map(dk=>({dk, e:ptEntry(dk,sid)})).filter(x=>x.e.att||x.e.hw||x.e.cw);
    const warn = yearStats.ua>=3 ? `<div class="notice warn"><span>⚠️</span><span>3 unexcused absences — removal warning threshold reached.</span></div>`
      : yearStats.ua===2 ? `<div class="notice warn"><span>⚠️</span><span>2 unexcused absences — one more triggers a removal warning.</span></div>` : '';
    return `${warn}
    <div class="grid" style="grid-template-columns:repeat(5,1fr);gap:8px;margin:${warn?'12px':'0'} 0 14px">
      ${[['Total',yearStats.total],['Present',yearStats.present],['Late',yearStats.late],['Excused',yearStats.exc],['Unexcused',yearStats.ua]].map(([l,val])=>`

/* ================= MODULE: CLEANING SCHEDULE =================
   Brothers and sisters paired separately for classroom cleanup duty.
   Pairs reshuffle once a month (kept stable within the month so posted
   schedules don't shift underfoot); Saturday and Sunday draw a different
   pair from that month's list rather than sharing one. Reuses the same
   session calendar (ptWeekendDates/PT_MONTHS) as the Progress Tracker so
   both modules agree on which dates are actual class days, and — like that
   calendar — is never pinned to one year. */
function clnMakePairs(ids){
  const arr=[...ids];
  for(let i=arr.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]]; }
  const groups=[]; let i=0;
  while(i<arr.length){
    // odd one out joins the last pair as a trio, rather than being left solo
    if(arr.length-i===3){ groups.push([arr[i],arr[i+1],arr[i+2]]); i+=3; }
    else if(arr.length-i===1){ groups.push([arr[i]]); i+=1; }
    else { groups.push([arr[i],arr[i+1]]); i+=2; }
  }
  return groups;
}
function clnGenerate(){
  const active = DB.data.students.filter(s=>s.active!==false);
  return {
    brothers: clnMakePairs(active.filter(s=>s.gender==='Brother').map(s=>s.id)),
    sisters: clnMakePairs(active.filter(s=>s.gender==='Sister').map(s=>s.id)),
    generatedAt: new Date().toISOString(),
  };
}
// Cache key includes the year (e.g. "2026-August") so different years' pairs
// never collide with or overwrite one another.
const clnKey = (year,month) => year+'-'+month;
function clnEnsureMonth(year,month){
  DB.data.cleaning = DB.data.cleaning || {pairsByMonth:{}};
  const k = clnKey(year,month);
  if(!DB.data.cleaning.pairsByMonth[k]){ DB.data.cleaning.pairsByMonth[k]=clnGenerate(); DB.save(); }
  return DB.data.cleaning.pairsByMonth[k];
}
function clnReshuffleMonth(year,month){ DB.data.cleaning.pairsByMonth[clnKey(year,month)]=clnGenerate(); DB.save(); }
function clnGroupNames(ids){ return ids.map(id=>{ const s=DB.data.students.find(x=>x.id===id); return s?s.name:'—'; }); }
// Photo + name chip for one student, used everywhere a duty group is shown
// on screen (pair overview cards and the per-date schedule). Avatar sits
// above the name so chips wrap cleanly in a row regardless of group size.
