d\">reflect</span></div></div><table class=\"tbl\"><thead><tr><th>#</th><th>Sentence</th></tr></thead><tbody><tr><td class=\"wc\">1</td><td class=\"wc\">The grave questions require a ____ that truly knows Allah.</td></tr><tr><td class=\"wc\">2</td><td class=\"wc\">____ alone is not enough.</td></tr><tr><td class=\"wc\">3</td><td class=\"wc\">You must ____ Tawhid, not just recite it.</td></tr><tr><td class=\"wc\">4</td><td class=\"wc\">At the end, students ____ on how their answer has changed.</td></tr></tbody></table><div class=\"sec-hd\"><h3>⏸ Checkpoint 2</h3></div><div class=\"q\"><div class=\"qt\">Checkpoint: what does the unit's closing message say about memorization versus living Tawhid?</div><div class=\"al\"></div></div>", "lesson": 7}, {"id": "INDEP7", "cat": "classwork", "title": "Independent Practice — S7: Vocabulary Mastery & the Three Grave Questions", "badge": "Work Alone · S7", "points": 9, "html": "<div class=\"sh-hdr\"><div class=\"sh-top\"><div class=\"sh-title\">Independent Practice — Vocabulary Mastery & the Three Grave Questions</div><div class=\"sh-badge\">Work Alone · S7</div></div><div class=\"sh-meta\"><div class=\"mf\"><div class=\"ml\">Name</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Date</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\"></div><div class=\"mv\"></div></div></div></div><div class=\"note\"><b>Note:</b> Complete this ON YOUR OWN, using what you've learned. No partner, no teacher help — show what YOU know.</div><div class=\"sec-hd\"><h3>On Your Own</h3><span class=\"pts\">9 pts</span></div><div class=\"q\"><div class=\"qn\">Question 1</div><div class=\"qt\">Write the Three Questions of the Grave with their EXTENDED reflective answers, from memory.</div></div><div class=\"als\"><div class=\"aline\"></div><div class=\"aline\"></div></div><div class=\"q\"><div class=\"qn\">Question 2</div><div class=\"qt\">Write all 6 Q&A pairs from the whole unit, in order, from memory.</div></div><div class=\"als\"><div class=\"aline\"></div><div class=\"aline\"></div></div><div class=\"q\"><div class=\"qn\">Question 3</div><div class=\"qt\">In 3-5 sentences, explain what \"living Tawhid\" means beyond simply memorizing answers.</div></div><div class=\"als\"><div class=\"aline\"></div><div class=\"aline\"></div></div>", "lesson": 7}, {"id": "READ7", "cat": "classwork", "title": "Reading Comprehension — S7: Vocabulary Mastery & the Three Grave Questions", "badge": "Read & Answer · S7", "points": 8, "html": "<div class=\"sh-hdr\"><div class=\"sh-top\"><div class=\"sh-title\">Reading Comprehension — Vocabulary Mastery & the Three Grave Questions</div><div class=\"sh-badge\">Read & Answer · S7</div></div><div class=\"sh-meta\"><div class=\"mf\"><div class=\"ml\">Name</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Date</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\"></div><div class=\"mv\"></div></div></div></div><div class=\"sec-hd\"><h3>Read the passage carefully</h3></div><div class=\"q\" style=\"line-height:1.7;\">Every Muslim will be asked three questions after death: مَنْ رَبُّكَ؟ (Who is your Lord?), مَا دِينُكَ؟ (What is your religion?), and مَنْ نَبِيُّكَ؟ (Who is your Prophet?). The unit gives extended, reflective versions of these answers: \"My Lord is Allah, who nurtured me and all the worlds with His blessings. My religion is Islam, through which I surrendered to Allah and believed. My Prophet is Muhammad ﷺ, whom Allah sent as a mercy to all the worlds.\" The unit makes a crucial point here: these questions CANNOT be answered with memorization alone. They require living Tawhid — truly knowing Allah, worshipping Him alone, and following His Prophet ﷺ — with the heart, not just the tongue. At the start of the unit, students were asked to write down the most important thing a Muslim must know. The unit closes by asking them to look at that paper again and reflect on how their understanding has grown. The vocabulary master list ties everything together: at-Tawhid, ar-Rabb, al-'Ibadah, ash-Shirk, ad-Du'a, at-Taghut, al-Islam, al-Iman, al-Qadar, al-Ba'th, and Khatam an-Nabiyyin — each term a piece of the same complete picture the whole book has been building.</div><div class=\"sec-hd\"><h3>Answer the Questions</h3><span class=\"pts\">8 pts</span></div><div class=\"q\"><div class=\"qn\">Question 1</div><div class=\"qt\">What are the Three Questions of the Grave, with their extended answers?</div></div><div class=\"als\"><div class=\"aline\"></div></div><div class=\"q\"><div class=\"qn\">Question 2</div><div class=\"qt\">Why does the unit say memorization alone is not enough?</div></div><div class=\"als\"><div class=\"aline\"></div></div><div class=\"q\"><div class=\"qn\">Question 3</div><div class=\"qt\">What does the unit ask students to do with what they wrote at the very start?</div></div><div class=\"als\"><div class=\"aline\"></div></div><div class=\"q\"><div class=\"qn\">Question 4</div><div class=\"qt\">Name at least 5 terms from the vocabulary master list and their meanings.</div></div><div class=\"als\"><div class=\"aline\"></div></div>", "lesson": 7}, {"id": "SORT7", "cat": "games", "title": "Sorting Activity — S7: Vocabulary Mastery & the Three Grave Questions", "badge": "Sort the Items · S7", "points": 5, "html": "<div class=\"sh-hdr\"><div class=\"sh-top\"><div class=\"sh-title\">Sorting Activity — Vocabulary Mastery & the Three Grave Questions</div><div class=\"sh-badge\">Sort the Items · S7</div></div><div class=\"sh-meta\"><div class=\"mf\"><div class=\"ml\">Name</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Date</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\"></div><div class=\"mv\"></div></div></div></div><div class=\"note\"><b>Note:</b> Cut out the items below (or number them) and sort each into the correct category.</div><div class=\"sec-hd\"><h3>Items to Sort</h3></div><div class=\"wb\"><h4>Word Bank</h4 // ══ CATEGORY DEFINITIONS ══
const CATEGORIES = [
  {id:'openers', label:'🔔 Daily Openers & Exit Tickets'},
  {id:'classwork', label:'📝 Classwork'},
  {id:'collab', label:'👥 Partner & Group'},
  {id:'oral', label:'🗣 Oral Review'},
  {id:'vocab', label:'🔤 Vocabulary, Ayah & Hadith'},
  {id:'games', label:'🧩 Puzzles & Games'},
  {id:'homework', label:'📚 Homework'},
  {id:'quiz', label:'✏️ Quizzes'},
  {id:'reviewpackets', label:'🔁 Review Packets'},
  {id:'test', label:'📋 Tests'},
  {id:'keys', label:'🗝 Answer Keys & Reference'},
];

let currentCat = CATEGORIES[0].id;
let searchTerm = '';
let lessonFilter = 'all';

function sheetsForCat(cat){
  return SHEETS.filter(s=>s.cat===cat);
}

function matchesFilters(s){
  if (lessonFilter!=='all' && String(s.lesson)!==lessonFilter) return false;
  if (searchTerm){
    const hay = (s.title+' '+s.badge+' '+s.html).toLowerCase();
    if (!hay.includes(searchTerm.toLowerCase())) return false;
  }
  return true;
}

function renderTabs(){
  const bar = document.getElementById('tabBar');
  bar.innerHTML = CATEGORIES.map(c=>{
    const count = sheetsForCat(c.id).length;
    return `<button class="tbtn ${c.id===currentCat?'active':''}" role="tab" aria-selected="${c.id===currentCat}"
      onclick="switchCat('${c.id}')">${c.label} <span style="opacity:.6;">(${count})</span></button>`;
  }).join('');
}

let activeSheetId = null;

function switchCat(cat){
  currentCat = cat;
  const sheets = sheetsForCat(cat).filter(matchesFilters);
  activeSheetId = sheets.length ? sheets[0].id : null;
  renderTabs();
  renderAssignBar();
  renderSheet();
}

function renderAssignBar(){
  const bar = document.getElementById('assignBar');
  const sheets = sheetsForCat(currentCat).filter(matchesFilters);
  if (!sheets.length){ bar.innerHTML=''; return; }
  bar.innerHTML = sheets.map(s=>`<button class="abtn ${s.id===activeSheetId?'active':''}" onclick="selectSheet('${s.id}')">${s.id.replace(/^([A-Z]+)(\d)/,'$1 $2')}</button>`).join('');
}

function selectSheet(id){
  activeSheetId = id;
  renderAssignBar();
  renderSheet();
}

function renderSheet(){
  const wrap = document.getElementById('sheetWrap');
  const sheets = sheetsForCat(currentCat).filter(matchesFilters);
  if (!sheets.length){
    wrap.innerHTML = '<div class="no-results">No sheets match your search/filter in this tab. Try clearing the search box or picking "All Lessons."</div>';
    return;
  }
  const s = sheets.find(x=>x.id===activeSheetId) || sheets[0];
  activeSheetId = s.id;
  wrap.innerHTML = `<div class="sheet active" id="sheet-${s.id}" data-cat="${s.cat}">${s.html}</div>`;
}

// ══ SEARCH / FILTER ══
function onSearch(v){
  searchTerm = v;
  renderTabs(); renderAssignBar(); renderSheet();
}
function setLessonFilter(v, btn){
  lessonFilter = v;
  document.querySelectorAll('.lfbtn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  renderTabs(); renderAssignBar(); renderSheet();
}

// ══ PRINT (fixed: page breaks now also inserted between categories) ══
function printCurrent(){
  const html = document.getElementById('sheetWrap').innerHTML;
  printHTML(html);
}
function printSection(){
  const sheets = sheetsForCat(currentCat).filter(matchesFilters);
  const html = sheets.map(s=>`<div class="sheet active print-page">${s.html}</div>`).join('');
  printHTML(html);
}
function printAll(){
  const html = SHEETS.map(s=>`<div class="sheet active print-page">${s.html}</div>`).join('');
  printHTML(html);
}
function printHTML(bodyHtml){
  const w = document.getElementById('printFrame').contentWindow;
  const styles = document.querySelectorAll('style,link[rel=stylesheet]');
  let styleHtml = '';
  styles.forEach(s=>styleHtml += s.outerHTML);
  w.document.open();
  w.document.write(`<!DOCTYPE html><html><head><meta charset="UTF-8">${styleHtml}
    <style>
      body{background:#fff;font-size:10.5pt;margin:0;padding:16px;}
      .print-page{page-break-after:always;}
      .print-page:last-child{page-break-after:auto;}
      .sheet{display:block!important;}
    </style></head><body>${bodyHtml}</body></html>`);
  w.document.close();
  setTimeout(()=>{ w.focus(); w.print(); }, 250);
}

// ══ INIT ══
document.addEventListener('DOMContentLoaded', function(){
  renderTabs();
  renderAssignBar();
  renderSheet();
});

</script>
</body>
