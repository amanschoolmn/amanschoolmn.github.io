\">إِنَّهُمْ كَانُوا يُسَارِعُونَ فِي …</td><td class=\"wc\"></td></tr><tr><td class=\"wc\">وَلَقَدْ بَعَثْنَا فِي كُلِّ أُمَّة…</td><td class=\"wc\"></td></tr><tr><td class=\"wc\">إِنَّ الدِّينَ عِندَ اللَّهِ الإِسْ…</td><td class=\"wc\"></td></tr><tr><td class=\"wc\">وَمَن يَبْتَغِ غَيْرَ الإِسْلَامِ د…</td><td class=\"wc\"></td></tr><tr><td class=\"wc\">وَمَا أُمِرُوا إِلَّا لِيَعْبُدُوا …</td><td class=\"wc\"></td></tr><tr><td class=\"wc\">يَا أَيُّهَا الَّذِينَ آمَنُوا كُتِ…</td><td class=\"wc\"></td></tr><tr><td class=\"wc\">وَلِلَّهِ عَلَى النَّاسِ حِجُّ الْب…</td><td class=\"wc\"></td></tr></tbody></table>", "lesson": 0}, {"id": "FINALREV", "cat": "reviewpackets", "title": "Final Review Packet — All 6 Q&As + Full Unit", "badge": "Low-Stakes Practice · Before Final Unit Test", "points": null, "html": "<div class=\"sh-hdr\"><div class=\"sh-top\"><div class=\"sh-title\">Final Review Packet — All 6 Q&As + Full Unit</div><div class=\"sh-badge\">Low-Stakes Practice · Before Final Unit Test</div></div><div class=\"sh-meta\"><div class=\"mf\"><div class=\"ml\">Name</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Date</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Score</div><div class=\"mv\"></div></div></div></div><div class=\"note\"><b>Note:</b> This packet does NOT count toward your grade. Work through it with a partner, then alone, then check yourself against the Master Answer Key.</div><div class=\"sec-hd\"><h3>All 8 Core Prompts — Speed Recall</h3><span class=\"pts\">16 pts</span></div><div class=\"q\"><div class=\"qn\">Q1</div><span class=\"qar\">مَنْ رَبُّكَ؟</span><div class=\"al\"></div></div><div class=\"q\"><div class=\"qn\">Q2</div><span class=\"qar\">وَمَا مَعْنَى الرَّبِّ؟</span><div class=\"al\"></div></div><div class=\"q\"><div class=\"qn\">Q3</div><span class=\"qar\">بِمَ تَعْرِفُ رَبَّكَ؟</span><div class=\"al\"></div></div><div class=\"q\"><div class=\"qn\">Q4</div><span class=\"qar\">لِأَيِّ شَيْءٍ td class=\"wc\"></td></tr><tr><td class=\"wc\">An-Nisa 4:103</td><td class=\"wc\"></td></tr><tr><td class=\"wc\">Az-Zukhruf 43:26-28</td><td class=\"wc\"></td></tr><tr><td class=\"wc\">Al-Anfal 8:39</td><td class=\"wc\"></td></tr><tr><td class=\"wc\">Al-Jinn 72:20</td><td class=\"wc\"></td></tr><tr><td class=\"wc\">Az-Zumar 39:14</td><td class=\"wc\"></td></tr><tr><td class=\"wc\">Ar-Ra'd 13:36</td><td class=\"wc\"></td></tr><tr><td class=\"wc\">An-Nisa 4:163</td><td class=\"wc\"></td></tr><tr><td class=\"wc\">Al-Ahzab 33:40</td><td class=\"wc\"></td></tr><tr><td class=\"wc\">Al Imran 3:144</td><td class=\"wc\"></td></tr><tr><td class=\"wc\">Taha 20:55</td><td class=\"wc\"></td></tr><tr><td class=\"wc\">Ar-Ra'd 13:5</td><td class=\"wc\"></td></tr></tbody></table><div class=\"sec-hd\"><h3>Full 5-Hadith Reference Speed Drill</h3><span class=\"pts\">5 pts</span></div><table class=\"tbl\"><thead><tr><th>Hadith</th><th>What it proves</th></tr></thead><tbody><tr><td class=\"wc\">Al-Bukhari 4777 / Muslim 102</td><td class=\"wc\"></td></tr><tr><td class=\"wc\">At-Tirmidhi 3371 (weak — da'if per al-Albani)</td><td class=\"wc\"></td></tr><tr><td class=\"wc\">Ahmad 18378 (sahih per al-Albani)</td><td class=\"wc\"></td></tr><tr><td class=\"wc\">Al-Bukhari 2652 / Muslim 6635</td><td class=\"wc\"></td></tr><tr><td class=\"wc\">Muslim 7560</td><td class=\"wc\"></td></tr></tbody></table><div class=\"sec-hd\"><h3>Cumulative Essay Practice</h3></div><div class=\"q\"><div class=\"qn\">Question 1</div><div class=\"qt\">In 5-6 sentences, explain how Q1 through Q6 build on each other into one complete argument. (This is essentially Final Test Part F practice.)</div></div><div class=\"als\"><div class=\"aline\"></div><div class=\"aline\"></div><div class=\"aline\"></div><div class=\"aline\"></div><div class=\"aline\"></div></div>", "lesson": 0}, {"id": "GAME1", "cat": "games", "title": "Review Game — Three Questions Speed Relay", "badge": "Classroom Competition", "points": null, "html": "<div class=\"sh-hdr\"><div class=\"sh-top\"><div class=\"sh-title\">Review Game — Three Questions Speed Relay</div><div class=\"sh-badge\">Classroom Competition · Teacher Instructions</div></div><div class=\"sh-meta\"><div class=\"mf\"><div class=\"ml\">Name</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Date</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Score</div><div class=\"mv\"></div></div></div></div><div class=\"sec-hd\"><h3>Setup</h3></div><div class=\"q\"><div class=\"qt\">Split the class into 2-4 teams in relay order. Place the 6 question cards (س١-س٦) face-down at the front.</div></div><div class=\"sec-hd\"><h3>How to Play</h3></div><div class=\"q\"><div class=\"qt\">1. First student runs up, flips a card, and must answer correctly (checked against the Master Answer Key).<br>2. Correct = team scores a point, next teammate goes. Incorrect = back of the line, try again next turn.<br>3. First team to correctly answer all 6 wins. For a longer game, require the Qur'anic proof reference too for bonus points.</div></div><div class=\"note\"><b>Note:</b> Variation: \"Ayah Reference Bee\" — same format, but cards show a key Arabic phrase and students give the Surah & Ayah reference from the 30-ayah master list.</div>", "lesson": 0}, {"id": "GAME2", "cat": "games", "title": "Review Game — Tawhid Trivia Board", "badge": "Classroom Competition", "points": null, "html": "<div class=\"sh-hdr\"><div class=\"sh-top\"><div class=\"sh-title\">Review Game — Tawhid Trivia Board</div><div class=\"sh-badge\">Classroom Competition · Teacher Instructions</div></div><div class=\"sh-meta\"><div class=\"mf\"><div class=\"ml\">Name</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Date</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Score</div><div class=\"mv\"></div></div></div></div><div class=\"sec-hd\"><h3>Setup</h3></div><div class=\"q\"><div class=\"qt\">Draw a 5×5 grid with 5 category columns: Rabb & Creation (S1-2) · Shirk & Heart Worship (S3) · Taghut & Pillars (S4) · Shahadah & Worship (S5) · The Prophet ﷺ & Iman (S6-7). Point values 10-20-30-40-50 down each column. Pull questions from the Weekly Review Packets and Oral Review Scripts.</div></div><div class=\"sec-hd\"><h3>How to Play</h3></div><div class=\"q\"><div class=\"qt\">Teams pick a category and point value; higher value = harder question requiring full Arabic + proof. Track scores on the board.</div></div>", "lesson": 0}, {"id": "GAME3", "cat": "games", "title": "Memory Game — Match the Heart-Worship Types (Printable)", "badge": "Memory / Cut-and-Paste", "points": null, "html": "<div class=\"sh-hdr\"><div class=\"sh-top\"><div class=\"sh-title\">Memory Game — Match the Heart-Worship Types</div><div class=\"sh-badge\">Memory / Cut-and-Paste · Printable</div></div><div class=\"sh-meta\"><div class=\"mf\"><div class=\"ml\">Name</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Date</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Score</div><div class=\"mv\"></div></div></div></div><div class=\"note\"><b>Note:</b> Print, then cut out all cards. Shuffle and lay face-down in a grid. Players flip 2 cards per turn, trying to match each Arabic term to its meaning. Keep a match if correct; flip back if not.</div><div class=\"sec-hd\"><h3>Cards — cut along the lines</h3></div><div class=\"fc-grid\"><div class=\"fc\"><div class=\"fc-front\"><span class=\"qar\" style=\"font-size:1.6rem;\">الشِّرْكُ</span><div class=\"fc-tr\">Ash-Shirk</div></div><div class=\"fc-back\">Associating partners with Allah — the greatest sin</div></div><div class=\"fc\"><div class=\"fc-front\"><span class=\"qar\" style=\"font-size:1.6rem;\">النِّدُّ</span><div class=\"fc-tr\">An-Nidd</div></div><div class=\"fc-back\">A rival / equal given to Allah in worship</div></div><div class=\"fc\"><div class=\"fc-front\"><span class=\"qar\" style=\"font-size:1.6rem;\">الدُّعَاءُ</span><div class=\"fc-tr\">Ad-Du'a</div></div><div class=\"fc-back\">Supplication — the heart and soul of worship</div></div><div class=\"fc\"><div class=\"fc-front\"><span class=\"qar\" style=\"font-size:1.6rem;\">الْخَوْفُ</span><div class=\"fc-tr\">Al-Khawf</div></div><div class=\"fc-back\">Fear — the special fear that belongs to Allah alone</div></div><div class=\"fc\"><div class=\"fc-front\"><span class=\"qar\" style=\"font-size:1.6rem;\">الرَّجَاءُ</span><div class=\"fc-tr\">Ar-Raja'</div></div><div class=\"fc-back\">Hope in Allah's mercy and reward</div></div><div class=\"fc\"><div class=\"fc-front\"><span class=\"qar\" style=\"font-size:1.6rem;\">التَّوَكُّلُ</span><div class=\"fc-tr\">At-Tawakkul</div></div><div class=\"fc-back\">Reliance on Allah after doing your part</div></div></div><div class=\"sec-hd\"><h3>Coloring Activity (younger students)</h3></div><div class=\"note\"><b>Note:</b> Color each Arabic term card a color, then color its matching meaning card the SAME color before playing the memory game.</div>", "lesson": 0}, {"id": "EVIDENCE", "cat": "keys", "title": "Master Evidence Reference — All 30 Ayahs & 5 Hadiths", "badge": "Teacher & Student Reference", "points": null, "html": "<div class=\"sh-hdr\"><div class=\"sh-top\"><div class=\"sh-title\">Master Evidence Reference — All 30 Ayahs & 5 Hadiths</div><div class=\"sh-badge\">Teacher & Student Reference</div></div><div class=\"sh-meta\"><div class=\"mf\"><div class=\"ml\">Name</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Date</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Score</div><div class=\"mv\"></div></div></div></div><div class=\"note\"><b>Note:</b> Expanded from the original assignment file, which tested only a handful of scattered references. This reference now covers every ayah and hadith actually cited in the corrected slide deck, organized by session.</div><div class=\"sec-hd\"><h3>All 30 Qur'anic References</h3><span class=\"pts\">30 pts</span></div><table class=\"tbl\"><thead><tr><th>Ref.</th><th>Key Arabic phrase</th><th>What it proves</th><th>Session</th></tr></thead><tbody><tr><td class=\"wc\">Al-A'raf 7:54</td><td class=\"wc\">إِنَّ رَبَّكُمُ اللَّهُ الَّذِي خَلَقَ السَّمَاوَاتِ وَ…</td><td class=\"wc\">Allah is our Lord and Creator — proof for Q1/Q2/Q3 together</td><td class=\"wc\">S2</td></tr><tr><td class=\"wc\">Adh-Dhariyat 51:56</td><td class=\"wc\">وَمَا خَلَقْتُ الْجِنَّ وَالإِنسَ إِلَّا لِيَعْبُدُونِ</td><td class=\"wc\">Q4 — the purpose of creation is worship alone</td><td class=\"wc\">S2</td></tr><tr><td class=\"wc\">An-Nisa 4:36</td><td class=\"wc\">وَاعْبُدُوا اللَّهَ وَلَا تُشْرِكُوا بِهِ شَيْئًا</td><td class=\"wc\">Q4 — worship Allah and associate nothing with Him</td><td class=\"wc\">S2</td></tr><tr><td class=\"wc\">Al-Ma'idah 5:72</td><td class=\"wc\">إِنَّهُ مَن يُشْرِكْ بِاللَّهِ فَقَدْ حَرَّمَ اللَّهُ ع…</td><td class=\"wc\">Consequence of Shirk — Paradise forbidden, home is the Fire</td><td class=\"wc\">S3</td></tr><tr><td class=\"wc\">Az-Zumar 39:65</td><td class=\"wc\">لَئِن أَشْرَكْتَ لَيَحْبَطَنَّ عَمَلُكَ وَلَتَكُونَنَّ …</td><td class=\"wc\">Shirk nullifies ALL deeds — warned even to the Prophet ﷺ</td><td class=\"wc\">S3</td></tr><tr><td class=\"wc\">Al-Jinn 72:18</td><td class=\"wc\">وَأَنَّ الْمَسَاجِدَ لِلَّهِ فَلَا تَدْعُوا مَعَ اللَّه…</td><td class=\"wc\">Du'a Proof 1 — masjids are for Allah alone</td><td class=\"wc\">S3</td></tr><tr><td class=\"wc\">Ghafir 40:60</td><td class=\"wc\">وَقَالَ رَبُّكُمُ ادْعُونِي أَسْتَجِبْ لَكُمْ</td><td class=\"wc\">Du'a Proof 2 — Call upon Me, I will respond</td><td class=\"wc\">S3</td></tr><tr><td class=\"wc\">Al-Mu'minun 23:117</td><td class=\"wc\">وَمَن يَدْعُ مَعَ اللَّهِ إِلَهًا آخَرَ لَا بُرْهَانَ ل…</td><td class=\"wc\">Du'a Proof 3 — calling on another god alongside Allah is KUFR</td><td class=\"wc\">S3</td></tr><tr><td class=\"wc\">Al Imran 3:175</td><td class=\"wc\">إِنَّمَا ذَلِكُمُ الشَّيْطَانُ يُخَوِّفُ أَوْلِيَاءَهُ …</td><td class=\"wc\">Proof for Khawf (fear) — fear Allah, not Shaytan's allies</td><td class=\"wc\">S3</td></tr><tr><td class=\"wc\">Al-Kahf 18:110</td><td class=\"wc\">فَمَن كَانَ يَرْجُو لِقَاءَ رَبِّهِ فَلْيَعْمَلْ عَمَلً…</td><td class=\"wc\">Proof for Raja' (hope) — hoping to meet your Lord requires no Shirk</td><td class=\"wc\">S3</td></tr><tr><td class=\"wc\">Al-Ma'idah 5:23 / At-Talaq 65:3</td><td class=\"wc\">وَعَلَى اللَّهِ فَتَوَكَّلُوا إِن كُنتُم مُّؤْمِنِينَ ·…</td><td class=\"wc\">Proof for Tawakkul (reliance) — trust in Allah, He is sufficient</td><td class=\"wc\">S3</td></tr><tr><td class=\"wc\">Al-Anbiya 21:90</td><td class=\"wc\">إِنَّهُمْ كَانُوا يُسَارِعُونَ فِي الْخَيْرَاتِ وَيَدْع…</td><td class=\"wc\">Proof for Raghbah & Rahbah (desire & awe)</td><td class=\"wc\">S3</td></tr><tr><td class=\"wc\">An-Nahl 16:36</td><td class=\"wc\">وَلَقَدْ بَعَثْنَا فِي كُلِّ أُمَّةٍ رَسُولًا أَنِ اعْب…</td><td class=\"wc\">Every prophet's universal message: worship Allah, avoid Taghut</td><td class=\"wc\">S4</td></tr><tr><td class=\"wc\">Al Imran 3:19</td><td class=\"wc\">إِنَّ الدِّينَ عِندَ اللَّهِ الإِسْلَامُ</td><td class=\"wc\">Islam is THE religion accepted by Allah</td><td class=\"wc\">S4</td></tr><tr><td class=\"wc\">Al Imran 3:85</td><td class=\"wc\">وَمَن يَبْتَغِ غَيْرَ الإِسْلَامِ دِينًا فَلَن يُقْبَلَ…</td><td class=\"wc\">A religion other than Islam will never be accepted</td><td class=\"wc\">S4</td></tr><tr><td class=\"wc\">Al-Bayyinah 98:5</td><td class=\"wc\">وَمَا أُمِرُوا إِلَّا لِيَعْبُدُوا اللَّهَ مُخْلِصِينَ …</td><td class=\"wc\">Proof for Salah & Zakah — begins with Tawhid</td><td class=\"wc\">S4</td></tr><tr><td class=\"wc\">Al-Baqarah 2:183-185</td><td class=\"wc\">يَا أَيُّهَا الَّذِينَ آمَنُوا كُتِبَ عَلَيْكُمُ الصِّي…</td><td class=\"wc\">Fasting (Sawm) is prescribed</td><td class=\"wc\">S4</td></tr><tr><td class=\"wc\">Al Imran 3:97</td><td class=\"wc\">وَلِلَّهِ عَلَى النَّاسِ حِجُّ الْبَيْتِ مَنِ اسْتَطَاع…</td><td class=\"wc\">Hajj is a duty for whoever is able</td><td class=\"wc\">S4</td></tr><tr><td class=\"wc\">Al-Baqarah 2:222</td><td class=\"wc\">إِنَّ اللَّهَ يُحِبُّ التَّوَّابِينَ وَيُحِبُّ الْمُتَط…</td><td class=\"wc\">Proof for Taharah (purification) as worship</td><td class=\"wc\">S5</td></tr><tr><td class=\"wc\">An-Nisa 4:103</td><td class=\"wc\">إِنَّ الصَّلَاةَ كَانَتْ عَلَى الْمُؤْمِنِينَ كِتَابًا …</td><td class=\"wc\">Proof that Salah is required at fixed times</td><td class=\"wc\">S5</td></tr><tr><td class=\"wc\">Az-Zukhruf 43:26-28</td><td class=\"wc\">إِنَّنِي بَرَاءٌ مِّمَّا تَعْبُدُونَ ۞ إِلَّا الَّذِي ف…</td><td class=\"wc\">Ibrahim's declaration — proof for the meaning of La ilaha illa Allah</td><td class=\"wc\">S5</td></tr><tr><td class=\"wc\">Al-Anfal 8:39</td><td class=\"wc\">وَقَاتِلُوهُمْ حَتَّى لَا تَكُونَ فِتْنَةٌ وَيَكُونَ ال…</td><td class=\"wc\">The mission: fight until no more Fitnah (=Shirk)</td><td class=\"wc\">S6</td></tr><tr><td class=\"wc\">Al-Jinn 72:20</td><td class=\"wc\">قُلْ إِنَّمَا أَدْعُو رَبِّي وَلَا أُشْرِكُ بِهِ أَحَدً…</td><td class=\"wc\">Mission summary quote 1 — sincerity of du'a to Allah alone</td><td class=\"wc\">S6</td></tr><tr><td class=\"wc\">Az-Zumar 39:14</td><td class=\"wc\">قُلِ اللَّهَ أَعْبُدُ مُخْلِصًا لَّهُ دِينِي</td><td class=\"wc\">Mission summary quote 2 — sincerity of worship</td><td class=\"wc\">S6</td></tr><tr><td class=\"wc\">Ar-Ra'd 13:36</td><td class=\"wc\">قُلْ إِنَّمَا أُمِرْتُ أَنْ أَعْبُدَ اللَّهَ وَلَا أُشْ…</td><td class=\"wc\">Mission summary quote 3 — complete mission statement</td><td class=\"wc\">S6</td></tr><tr><td class=\"wc\">An-Nisa 4:163</td><td class=\"wc\">إِنَّا أَوْحَيْنَا إِلَيْكَ كَمَا أَوْحَيْنَا إِلَى نُو…</td><td class=\"wc\">Nuh ﷺ = the first Messenger (Rasul)</td><td class=\"wc\">S6</td></tr><tr><td class=\"wc\">Al-Ahzab 33:40</td><td class=\"wc\">وَلَٰكِن رَّسُولَ اللَّهِ وَخَاتَمَ النَّبِيِّينَ</td><td class=\"wc\">Muhammad ﷺ = the Seal of the Prophets</td><td class=\"wc\">S6</td></tr><tr><td class=\"wc\">Al Imran 3:144</td><td class=\"wc\">وَمَا مُحَمَّدٌ إِلَّا رَسُولٌ</td><td class=\"wc\">Muhammad ﷺ is only a Messenger — not to be worshipped</td><td class=\"wc\">S6</td></tr><tr><td class=\"wc\">Taha 20:55</td><td class=\"wc\">مِنْهَا خَلَقْنَاكُمْ وَفِيهَا نُعِيدُكُمْ وَمِنْهَا نُ…</td><td class=\"wc\">Proof of the Resurrection</td><td class=\"wc\">S6</td></tr><tr><td class=\"wc\">Ar-Ra'd 13:5</td><td class=\"wc\">أُولَٰئِكَ الَّذِينَ كَفَرُوا بِرَبِّهِمْ ۚ وَأُولَٰئِك…</td><td class=\"wc\">Denying the Resurrection = Kufr, eternal Fire</td><td class=\"wc\">S6</td></tr></tbody></table><div class=\"sec-hd\"><h3>5 Key Hadiths</h3></div><table class=\"tbl\"><thead><tr><th>Collection & Number</th><th>Content</th><th>Used to prove</th></tr></thead><tbody><tr><td class=\"wc\">Al-Bukhari 4777 / Muslim 102</td><td class=\"wc\">Hadith of Jibril / Umar — الإِسْلَامُ أَنْ تَشْهَدَ أَنْ لَا إِلَه…</td><td class=\"wc\">Defines Islam as the 5 Pillars</td></tr><tr><td class=\"wc\">At-Tirmidhi 3371 (weak — da'if per al-Albani)</td><td class=\"wc\">Du'a is the marrow of worship — الدُّعَاءُ مُخُّ الْعِبَادَةِ…</td><td class=\"wc\">Popular but WEAK wording — the text still cites it, with the caveat noted</td></tr><tr><td class=\"wc\">Ahmad 18378 (sahih per al-Albani)</td><td class=\"wc\">Du'a IS worship — الدُّعَاءُ هُوَ الْعِبَادَةُ…</td><td class=\"wc\">The stronger, authenticated wording — use with confidence</td></tr><tr><td class=\"wc\">Al-Bukhari 2652 / Muslim 6635</td><td class=\"wc\">Best generations — خَيْرُ الْقُرُونِ قَرْنِي ثُمَّ الَّذِين…</td><td class=\"wc\">Best generations = the Sahabah and the two after them</td></tr><tr><td class=\"wc\">Muslim 7560</td><td class=\"wc\">The return of 'Isa — وَعِيسَى صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ…</td><td class=\"wc\">'Isa will descend and slay al-Dajjal — a major sign of the Last Hour</td></tr></tbody></table>", "lesson": 0}, {"id": "MASTERQA", "cat": "keys", "title": "Master Q&A Reference — All 6 Questions", "badge": "Teacher Only", "points": null, "html": "<div class=\"sh-hdr\"><div class=\"sh-top\"><div class=\"sh-title\">Master Q&A Reference — All 6 Questions</div><div class=\"sh-badge\">Teacher Only</div></div><div class=\"sh-meta\"><div class=\"mf\"><div class=\"ml\">Name</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Date</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Score</div><div class=\"mv\"></div></div></div></div><div class=\"sec-hd\"><h3>[س١-س٢] — Who is your Lord? / Meaning of Rabb</h3></div><div class=\"qt qar\">مَنْ رَبُّكَ؟ — رَبِّيَ اللهُ</div><div class=\"qt qar\">وَمَا مَعْنَى الرَّبِّ؟ — الْمَالِكُ الْمَعْبُودُ</div><div class=\"qt\">Meaning of \"Allah\": ذُو الأُلُوهِيَّةِ وَالْعُبُودِيَّةِ عَلَى خَلْقِهِ أَجْمَعِينَ · Proof: Al-A'raf 7:54</div><div class=\"sec-hd\"><h3>[س٣] — How do you know your Lord?</h3></div><div class=\"qt qar\">بِمَ تَعْرِفُ رَبَّكَ؟ — أَعْرِفُهُ بِآيَاتِهِ وَمَخْلُوقَاتِهِ</div><div class=\"qt\">Signs: اللَّيْلُ وَالنَّهَارُ وَالشَّمْسُ وَالْقَمَرُ · Creation: السَّمَاوَاتُ وَالأَرْضُ وَمَا فِيهِمَا</div><div class=\"sec-hd\"><h3>[س٤] — Why were you created?</h3></div><div class=\"qt qar\">لِأَيِّ شَيْءٍ خَلَقَكَ؟ — لِعِبَادَتِهِ وَحْدَهُ لَا شَرِيكَ لَهُ بِامْتِثَالِ مَا أَمَرَ بِهِ وَتَرْكِ مَا نَهَى عَنْهُ</div><div class=\"qt\">Proofs: Adh-Dhariyat 51:56 · An-Nisa 4:36 · 'Ibadah = 3 categories (statements, outward actions, inward actions)</div><div class=\"note\"><b>Note:</b> Shirk section also covers: Al-Ma'idah 5:72 (consequence) · Al-Jinn 72:18, Ghafir 40:60, Al-Mu'minun 23:117 (3 du'a proofs) · the 5 heart-worship types with 4 proofs (Al Imran 3:175, Al-Kahf 18:110, Al-Ma'idah 5:23/At-Talaq 65:3, Al-Anbiya 21:90) · Az-Zumar 39:65 (nullification).</div><div class=\"sec-hd\"><h3>[س٥] — What is your religion?</h3></div><div class=\"qt qar\">مَا دِينُكَ؟ — دِينِيَ الإِسْلَامُ</div><div class=\"qt\">الاسْتِسْلَامُ لِلَّهِ بِالتَّوْحِيدِ وَالانْقِيَادُ لَهُ بِالطَّاعَةِ وَمُوَالَاةُ الْمُسْلِمِينَ وَمُعَادَاةُ الْمُشْرِكِينَ</div><div class=\"qt\">Islam is THE religion: Al Imran 3:19 + 3:85 · La ilaha illa Allah: لَا مَعْبُودَ حَقٌّ إِلَّا اللهُ (Ibrahim proof: Az-Zukhruf 43:26-28)</div><div class=\"qt\">5 Pillars: Hadith of Jibril (Bukhari 4777/Muslim 102) · Taharah/Salah/Zakah also worship (Al-Baqarah 2:222, An-Nisa 4:103)</div><div class=\"sec-hd\"><h3>[س٦] — Who is your Prophet?</h3></div><div class=\"qt qar\">مَنْ نَبِيُّكَ؟ — نَبِيُّنَا مُحَمَّدُ بْنُ عَبْدِ اللهِ بْنِ عَبْدِ الْمُطَّلِبِ بْنِ هَاشِمِ بْنِ عَبْدِ مَنَافٍ</div><div class=\"qt\">Chosen from Quraysh · sent to al-ahmar wal-aswad · Timeline: age 40, ~10 years Makkah, Mi'raj (no intermediary), Hijrah, ~10 years Jihad, age 63 deen completed</div><div class=\"qt\">First Messenger: Nuh (An-Nisa 4:163) · Last: Muhammad, Seal (Al-Ahzab 33:40, Al Imran 3:144) · Mission summary: Al-Jinn 72:20 + Az-Zumar 39:14 + Ar-Ra'd 13:36</div><div class=\"qt\">Best after prophets: Abu Bakr → 'Umar → 'Uthman → 'Ali · Best generations: Bukhari 2652/Muslim 6635 · 'Isa returns: Muslim 7560</div><div class=\"note\"><b>Depth note:</b> The distinction between Nabi (receives revelation) and Rasul (sent with a law) is worth teaching explicitly: Adam ﷺ was the first Nabi; Nuh ﷺ was the first Rasul.</div>", "lesson": 0}, {"id": "RUBRICS", "cat": "keys", "title": "Rubrics & Grade Scale", "badge": "Teacher Only", "points": null, "html": "<div class=\"sh-hdr\"><div class=\"sh-top\"><div class=\"sh-title\">Rubrics & Grade Scale</div><div class=\"sh-badge\">Teacher Only</div></div><div class=\"sh-meta\"><div class=\"mf\"><div class=\"ml\">Name</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Date</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Score</div><div class=\"mv\"></div></div></div></div><div class=\"sec-hd\"><h3>Arabic Recall Rubric (applies to all)</h3></div><table class=\"tbl\"><thead><tr><th>Points</th><th>Arabic writing quality</th><th>Accuracy</th><th>Harakat</th></tr></thead><tbody><tr><td class=\"wc\">Full</td><td class=\"wc\">Clear, recognizable Arabic script</td><td class=\"wc\">All words correct, correctly spelled</td><td class=\"wc\">Harakat present and correct</td></tr><tr><td class=\"wc\">-1</td><td class=\"wc\">Minor letter formation issues</td><td class=\"wc\">1-2 words off or slightly incorrect</td><td class=\"wc\">Some harakat missing</td></tr><tr><td class=\"wc\">Half</td><td class=\"wc\">Transliteration only</td><td class=\"wc\">Meaning correct but no Arabic</td><td class=\"wc\">N/A</td></tr><tr><td class=\"wc\">0</td><td class=\"wc\">Blank or completely wrong</td><td class=\"wc\">Wrong answer</td><td class=\"wc\">N/A</td></tr></tbody></table><div class=\"note\"><b>Note:</b> For Level 2 students: accept transliteration for half credit at teacher's discretion; Level 3 students should be held to full Arabic.</div><div class=\"sec-hd\"><h3>Short Answer / Essay Rubric (4-point scale)</h3></div><table class=\"tbl\"><thead><tr><th>Score</th><th>Criteria</th></tr></thead><tbody><tr><td class=\"wc\">4 — Excellent</td><td class=\"wc\">Answers completely · Uses specific evidence from the text (page ref or Arabic) · Shows understanding, not memorization</td></tr><tr><td class=\"wc\">3 — Good</td><td class=\"wc\">Answers the question · Some text evidence · Solid understanding with minor gaps</td></tr><tr><td class=\"wc\">2 — Developing</td><td class=\"wc\">Partially answers · Limited evidence · Surface understanding</td></tr><tr><td class=\"wc\">1 — Beginning</td><td class=\"wc\">Minimal attempt · No evidence · Significant confusion</td></tr></tbody></table><div class=\"sec-hd\"><h3>NEW — True/False & Matching Rubric</h3></div><table class=\"tbl\"><thead><tr><th>Points</th><th>Standard</th></tr></thead><tbody><tr><td class=\"wc\">Full credit</td><td class=\"wc\">Correct T/F judgment, or correct match</td></tr><tr><td class=\"wc\">No credit</td><td class=\"wc\">Incorrect judgment or match</td></tr></tb </tr><tr><td class=\"wc\">Quiz 1-2</td><td class=\"wc\">50 / 50</td><td class=\"wc\">See individual sheets</td></tr><tr><td class=\"wc\">Mid-Unit Test</td><td class=\"wc\">100</td><td class=\"wc\">Sessions 1-4</td></tr><tr><td class=\"wc\">Final Unit Test</td><td class=\"wc\">100</td><td class=\"wc\">Full unit, comprehensive</td></tr><tr><td class=\"wc\">Daily Openers / Exit Tickets / Oral Review</td><td class=\"wc\">Not graded</td><td class=\"wc\">Formative — completion credit only</td></tr><tr><td class=\"wc\">Vocabulary / Matching / T-F / Puzzles</td><td class=\"wc\">≤5% of unit grade</td><td class=\"wc\">Fluency-building, low-stakes</td></tr><tr><td class=\"wc\">Weekly & Midterm/Final Review Packets</td><td class=\"wc\">Not graded</td><td class=\"wc\">Practice only</td></tr></tbody></table>", "lesson": 0}, {"id": "GUID1", "cat": "classwork", "title": "Guided Practice — S1: The Book's Opening & Why Tawhid Comes First", "badge": "Teacher-Led · S1", "points": 7, "html": "<div class=\"sh-hdr\"><div class=\"sh-top\"><div class=\"sh-title\">Guided Practice — The Book's Opening</div><div class=\"sh-badge\">Teacher-Led · S1</div></div><div class=\"sh-meta\"><div class=\"mf\"><div class=\"ml\">Name</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Date</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\"></div><div class=\"mv\"></div></div></div></div><div class=\"note\"><b>Note:</b> Work through this WITH your teacher, one section at a time. Stop at each checkpoint (⏸) to check answers together before moving on.</div><div class=\"sec-hd\"><h3>Step 1 — Read Together</h3></div><div class=\"q\"><div class=\"qt\">The book Ta'lim al-Sibyan al-Tawhid opens the way every classical Islamic book opens: with praise of Allah, then peace on the Prophet ﷺ, then the phrase أَمَّا بَعْدُ (\"as for what follows\"), which signals the real content is about to begin. The author then states his purpose: to teach Tawhid BEFORE the Qur'an, so the child becomes مُسْلِمًا كَامِلًا (a complete Muslim) and مُوَحِّدًا جَيِّدًا (a good Muwahhid).</div></div><div class=\"sec-hd\"><h3>⏸ Checkpoint 1</h3></div><div class=\"q\"><div class=\"qt\">Before moving on: why does the author begin by praising Allah instead of talking about himself?</div><div class=\"al\"></div></div><div class=\"sec-hd\"><h3>Step 2 — Fill In Together</h3><span class=\"pts\">5 pts</span></div><div class=\"wb\"><h4>Word Bank</h4><div class=\"words\"><span class=\"word\">praise</span><span class=\"word\">peace</span><span class=\"word\">transition</span><span class=\"word\">complete</span><span class=\"word\">good</span></div></div><table class=\"tbl\"><thead><tr><th>#</th><th>Sentence</th></tr></thead><tbody><tr><td class=\"wc\">1</td><td class=\"wc\">The book begins with ____ of Allah.</td></tr><tr><td class=\"wc\">2</td><td class=\"wc\">Then ____ on the Prophet ﷺ.</td></tr><tr><td class=\"wc\">3</td><td class=\"wc\">أَمَّا بَعْدُ is a classical ____ phrase.</td></tr><tr><td class=\"wc\">4</td><td class=\"wc\">Goal 1: a ____ Muslim.</td></tr><tr><td class=\"wc\">5</td><td class=\"wc\">Goal 2: a ____ Muwahhid.</td></tr></tbody></table><div class=\"sec-hd\"><h3>⏸ Checkpoint 2</h3></div><div class=\"q\"><div class=\"qt\">Checkpoint: what does أَمَّا بَعْدُ mean, and who else used this phrase?</div><div class=\"al\"></div></div>", "lesson": 1}, {"id": "INDEP1", "cat": "classwork", "title": "Independent Practice — S1: The Book's Opening & Why Tawhid Comes First", "badge": "Work Alone · S1", "points": 9, "html": "<div class=\"sh-hdr\"><div class=\"sh-top\"><div class=\"sh-title\">Independent Practice — The Book's Opening</div><div class=\"sh-badge\">Work Alone · S1</div></div><div class=\"sh-meta\"><div class=\"mf\"><div class=\"ml\">Name</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Date</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\"></div><div class=\"mv\"></div></div></div></div><div class=\"note\"><b>Note:</b> Complete this ON YOUR OWN, using what you've learned. No partner, no teacher help — show what YOU know.</div><div class=\"sec-hd\"><h3>On Your Own</h3><span class=\"pts\">9 pts</span></div><div class=\"q\"><div class=\"qn\">Question 1</div><div class=\"qt\">Write the classical opening (Isti'adhah through أَمَّا بَعْدُ) from memory.</div></div><div class=\"als\"><div class=\"aline\"></div><div class=\"aline\"></div></div><div class=\"q\"><div class=\"qn\">Question 2</div><div class=\"qt\">Explain in 2-3 sentences why the author states TWO goals instead of one.</div></div><div class=\"als\"><div class=\"aline\"></div><div class=\"aline\"></div></div><div class=\"q\"><div class=\"qn\">Question 3</div><div class=\"qt\">What does the purpose statement (p.8) say is required of every person regarding children?</div></div><div class=\"als\"><div class=\"aline\"></div><div class=\"aline\"></div></div>", "lesson": 1}, {"id": "READ1", "cat": "classwork", "title": "Reading Comprehension — S1: The Book's Opening & Why Tawhid Comes First", "badge": "Read & Answer · S1", "points": 8, "html": "<div class=\"sh-hdr\"><div class=\"sh-top\"><div class=\"sh-title\">Reading Comprehension — The Book's Opening</div><div class=\"sh-badge\">Read & Answer · S1</div></div><div class=\"sh-meta\"><div class=\"mf\"><div class=\"ml\">Name</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Date</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\"></div><div class=\"mv\"></div></div></div></div><div class=\"sec-hd\"><h3>Read the passage carefully</h3></div><div class=\"q\" style=\"line-height:1.7;\">Every great work of Islamic scholarship begins the same way: with the name and praise of Allah. Ta'lim al-Sibyan al-Tawhid, written by Shaykh Muhammad ibn 'Abd al-Wahhab, is no exception. It opens with the Isti'adhah (seeking refuge from Shaytan), the Basmalah (in the name of Allah), and the Hamdalah and Salawat — praising Allah as Lord of all the worlds and sending peace upon the Prophet ﷺ, his family, and his companions. Then comes a classical transition phrase used even by the Prophet ﷺ himself in his sermons: أَمَّا بَعْدُ, \"as for what follows.\" This signals that the introductory praise is finished and the real content is about to begin. The author then states his purpose directly: فَهَذِهِ رِسَالَةٌ نَافِعَةٌ فِيمَا يَجِبُ عَلَى الإِنْسَانِ أَنْ يُعَلِّمَ الصِّبْيَانَ — \"This is a beneficial treatise regarding what is required upon a person: that they teach the children.\" He explains that Tawhid must be taught to children BEFORE the Qur'an, so they become مُسْلِمًا كَامِلًا عَلَى فِطْرَةِ الإِسْلَامِ (a COMPLETE Muslim on the natural way of Islam) and مُوَحِّدًا جَيِّدًا عَلَى طَرِيقَةِ الإِيمَانِ (a GOOD Muwahhid on the path of true faith). The word جَيِّدًا — GOOD — is intentional: it is not enough to call yourself a Muwahhid in name only. The goal is genuine, well-rooted understanding.</div><div class=\"sec-hd\"><h3>Answer the Questions</h3><span class=\"pts\">8 pts</span></div><div class=\"q\"><div class=\"qn\">Question 1</div><div class=\"qt\">What are the four parts of the classical opening, in order?</div></div><div class=\"als\"><div class=\"aline\"></div></div><div class=\"q\"><div class=\"qn\">Question 2</div><div class=\"qt\">What does أَمَّا بَعْدُ signal, and who else used this phrase?</div></div><div class=\"als\"><div class=\"aline\"></div></div><div class=\"q\"><div class=\"qn\">Question 3</div><div class=\"qt\">What is the author's stated purpose for writing the book?</div></div><div class=\"als\"><div class=\"aline\"></div></div><div class=\"q\"><div class=\"qn\">Question 4</div><div class=\"qt\">Why does the passage say the word جَيِّدًا (good) is intentional and important?</div></div><div class=\"als\"><div class=\"aline\"></div></div>", "lesson": 1}, {"id": "SORT1", "cat": "games", "title": "Sorting Activity — S1: The Book's Opening & Why Tawhid Comes First", "badge": "Sort the Items · S1", "points": 6, "html": "<div class=\"sh-hdr\"><div class=\"sh-top\"><div class=\"sh-title\">Sorting Activity — The Book's Opening</div><div class=\"sh-badge\">Sort the Items · S1</div></div><div class=\"sh-meta\"><div class=\"mf\"><div class=\"ml\">Name</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Date</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\"></div><div class=\"mv\"></div></div></div></div><div class=\"note\"><b>Note:</b> Cut out the items below (or number them) and sort each into the correct category.</div><div class=\"sec-hd\"><h3>Items to Sort</h3></div><div class=\"wb\"><h4>Word Bank</h4><div class=\"words\"><span class=\"word\">Seeking refuge from Shaytan</span><span class=\"word\">Praise of Allah</span><span class=\"word\">Peace upon the Prophet ﷺ</span><span class=\"word\">Teaching Tawhid before Qur'an</span><span class=\"word\">Becoming a complete Muslim</span><span class=\"word\">أَمَّا بَعْدُ</span></div></div><div class=\"sec-hd\"><h3>Sort Them Here</h3><span class=\"pts\">6 pts</span></div><table class=\"tbl\"><thead><tr><th>Part of the Classical Opening</th><th>Part of the Purpose Statement</th></tr></thead><tbody><tr><td class=\"wc\"></td><td class=\"wc\"></td></tr><tr><td class=\"wc\"></td><td class=\"wc\"></td></tr><tr><td class=\"wc\"></td><td class=\"wc\"></td></tr><tr><td class=\"wc\"></td><td class=\"wc\"></td></tr></tbody></table>", "lesson": 1}, {"id": "SEQ1", "cat": "games", "title": "Sequencing Activity — S1: The Book's Opening & Why Tawhid Comes First", "badge": "Put in Order · S1", "points": 6, "html": "<div class=\"sh-hdr\"><div class=\"sh-top\"><div class=\"sh-title\">Sequencing Activity — The Book's Opening</div><div class=\"sh-badge\">Put in Order · S1</div></div><div class=\"sh-meta\"><div class=\"mf\"><div class=\"ml\">Name</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Date</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\"></div><div class=\"mv\"></div></div></div></div><div class=\"note\"><b>Note:</b> Number these events 1, 2, 3... in the correct order.</div><div class=\"sec-hd\"><h3>Put These in the Correct Order</h3><span class=\"pts\">6 pts</span></div><div class=\"q\" style=\"display:flex;gap:10px;align-items:center;\"><div class=\"al\" style=\"width:36px;flex:none;height:32px;\"></div><div class=\"qt\">The author seeks refuge from Shaytan (Isti'adhah).</div></div><div class=\"q\" style=\"display:flex;gap:10px;align-items:center;\"><div class=\"al\" style=\"width:36px;flex:none;height:32px;\"></div><div class=\"qt\">The author says the Basmalah.</div></div><div class=\"q\" style=\"display:flex;gap:10px;align-items:center;\"><div class=\"al\" style=\"width:36px;flex:none;height:32px;\"></div><div class=\"qt\">The author praises Allah (Hamdalah) and sends peace on the Prophet ﷺ (Salawat).</div></div><div class=\"q\" style=\"display:flex;gap:10px;align-items:center;\"><div class=\"al\" style=\"width:36px;flex:none;height:32px;\"></div><div class=\"qt\">The author transitions with أَمَّا بَعْدُ.</div></div><div class=\"q\" style=\"display:flex;gap:10px;align-items:center;\"><div class=\"al\" style=\"width:36px;flex:none;height:32px;\"></div><div class=\"qt\">The author states his purpose: teaching Tawhid before Qur'an.</div></div><div class=\"q\" style=\"display:flex;gap:10px;align-items:center;\"><div class=\"al\" style=\"width:36px;flex:none;height:32px;\"></div><div class=\"qt\">The author states the two goals: complete Muslim and good Muwahhid.</div></div>", "lesson": 1}, {"id": "GUID2", "cat": "classwork", "title": "Guided Practice — S2: Q1, Q2 & Q3 — Who is Your Lord, and How Do You Know Him?", "badge": "Teacher-Led · S2", "points": 5, "html": "<div class=\"sh-hdr\"><div class=\"sh-top\"><div class=\"sh-title\">Guided Practice — Q1, Q2 & Q3 — Who is Your Lord?</div><div class=\"sh-badge\">Teacher-Led · S2</div></div><div class=\"sh-meta\"><div class=\"mf\"><div class=\"ml\">Name</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Date</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\"></div><div class=\"mv\"></div></div></div></div><div class=\"note\"><b>Note:</b> Work through this WITH your teacher, one section at a time. Stop at each checkpoint (⏸) to check answers together before moving on.</div><div class=\"sec-hd\"><h3>Step 1 — Read Together</h3></div><div class=\"q\"><div class=\"qt\">Q1 asks مَنْ رَبُّكَ؟ and the answer is رَبِّيَ اللهُ. Q2 asks the meaning of Rabb, answered الْمَالِكُ الْمَعْبُودُ — the Owner and the One Worshipped. Q3 asks بِمَ تَعْرِفُ رَبَّكَ؟ and the answer is أَعْرِفُهُ بِآيَاتِهِ وَمَخْلُوقَاتِهِ — through His Signs and His Creation.</div></div><div class=\"sec-hd\"><h3>⏸ Checkpoint 1</h3></div><div class=\"q\"><div class=\"qt\">Before moving on: what does the Name Allah mean, in the text's exact words?</div><div class=\"al\"></div></div><div class=\"sec-hd\"><h3>Step 2 — Fill In Together</h3><span class=\"pts\">3 pts</span></div><div class=\"wb\"><h4>Word Bank</h4><div class=\"words\"><span class=\"word\">Owner</span><span class=\"word\">Worshipped</span><span class=\"word\">signs</span><span class=\"word\">creation</span><span class=\"word\">six days</span></div></div><table class=\"tbl\"><thead><tr><th>#</th><th>Sentence</th></tr></thead><tbody><tr><td class=\"wc\">1</td><td class=\"wc\">Rabb means the ____ and the One ____.</td></tr><tr><td class=\"wc\">2</td><td class=\"wc\">We know Allah through His ____ and His ____.</td></tr><tr><td class=\"wc\">3</td><td class=\"wc\">Allah created the heavens and earth in ____.</td></tr></tbody></table><div class=\"sec-hd\"><h3>⏸ Checkpoint 2</h3></div><div class=\"q\"><div class=\"qt\">Checkpoint: which single ayah (Al-A'raf 7:54) proves Q1, Q2, and Q3 together?</div><div class=\"al\"></div></div>", "lesson": 2}, {"id": "INDEP2", "cat": "classwork", "title": "Independent Practice — S2: Q1, Q2 & Q3 — Who is Your Lord, and How Do You Know Him?", "badge": "Work Alone · S2", "points": 9, "html": "<div class=\"sh-hdr\"><div class=\"sh-top\"><div class=\"sh-title\">Independent Practice — Q1, Q2 & Q3 — Who is Your Lord?</div><div class=\"sh-badge\">Work Alone · S2</div></div><div class=\"sh-meta\"><div class=\"mf\"><div class=\"ml\">Name</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Date</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\"></div><div class=\"mv\"></div></div></div></div><div class=\"note\"><b>Note:</b> Complete this ON YOUR OWN, using what you've learned. No partner, no teacher help — show what YOU know.</div><div class=\"sec-hd\"><h3>On Your Own</h3><span class=\"pts\">9 pts</span></div><div class=\"q\"><div class=\"qn\">Question 1</div><div class=\"qt\">Write Q1, Q2, and Q3 with their full Arabic answers, from memory.</div></div><div class=\"als\"><div class=\"aline\"></div><div class=\"aline\"></div></div><div class=\"q\"><div class=\"qn\">Question 2</div><div class=\"qt\">Explain the meaning of Allah (اللهُ) using the terms Uluhiyyah and Ubudiyyah.</div></div><div class=\"als\"><div class=\"aline\"></div><div class=\"aline\"></div></div><div class=\"q\"><div class=\"qn\">Question 3</div><div class=\"qt\">Write out Al-A'raf 7:54 as far as you can, and explain what it proves.</div></div><div class=\"als\"><div class=\"aline\"></div><div class=\"aline\"></div></div>", "lesson": 2}, {"id": "READ2", "cat": "classwork", "title": "Reading Comprehension — S2: Q1, Q2 & Q3 — Who is Your Lord, and How Do You Know Him?", "badge": "Read & Answer · S2", "points": 8, "html": "<div class=\"sh-hdr\"><div class=\"sh-top\"><div class=\"sh-title\">Reading Comprehension — Q1, Q2 & Q3 — Who is Your Lord?</div><div class=\"sh-badge\">Read & Answer · S2</div></div><div class=\"sh-meta\"><div class=\"mf\"><div class=\"ml\">Name</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Date</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\"></div><div class=\"mv\"></div></div></div></div><div class=\"sec-hd\"><h3>Read the passage carefully</h3></div><div class=\"q\" style=\"line-height:1.7;\">The book's very first question is Q1: مَنْ رَبُّكَ؟ — \"Who is your Lord?\" This is also the FIRST question the angels will ask in the grave. The answer is short: رَبِّيَ اللهُ, \"My Lord is Allah.\" Q2 then asks what Rabb means, and the text answers: الْمَالِكُ الْمَعْبُودُ — \"The Owner, the One Worshipped.\" The text explains that Rabb actually carries four meanings: al-Malik (the Owner of everything), al-Khaliq (the Creator), ar-Raziq (the Provider), and al-Ma'bud (the Only One deserving worship) — because He is the Owner, Creator, and Provider, only He deserves worship. The text also explains the meaning of the Name Allah itself: ذُو الأُلُوهِيَّةِ وَالْعُبُودِيَّةِ عَلَى خَلْقِهِ أَجْمَعِينَ — the One who possesses al-Uluhiyyah (the exclusive right to be worshipped) and al-'Ubudiyyah (complete servanthood, which is the state of every created thing before Him). Q3 then asks بِمَ تَعْرِفُ رَبَّكَ؟ — \"How do you recognize your Lord?\" The answer: أَعْرِفُهُ بِآيَاتِهِ وَمَخْلُوقَاتِهِ — \"I recognize Him through His Signs and His Creation.\" His Signs include the night, the day, the sun, and the moon; His Creation includes the heavens, the earth, and everything within them. The proof for all of this is Al-A'raf 7:54, which describes Allah creating the heavens and earth in six days, then rising above the Throne, and covering the night with the day.</div><div class=\"sec-hd\"><h3>Answer the Questions</h3><span class=\"pts\">8 pts</span></div><div class=\"q\"><div class=\"qn\">Question 1</div><div class=\"qt\">What is Q1 and its answer, and why is it especially important?</div></div><div class=\"als\"><div class=\"aline\"></div></div><div class=\"q\"><div class=\"qn\">Question 2</div><div class=\"qt\">What does Rabb mean, and what are its four meanings?</div></div><div class=\"als\"><div class=\"aline\"></div></div><div class=\"q\"><div class=\"qn\">Question 3</div><div class=\"qt\">What does the Name Allah mean according to the text?</div></div><div class=\"als\"><div class=\"aline\"></div></div><div class=\"q\"><div class=\"qn\">Question 4</div><div class=\"qt\">What is Q3's answer, and what examples does the text give for Signs and Creation?</div></div><div class=\"als\"><div class=\"aline\"></div></div>", "lesson": 2}, {"id": "SORT2", "cat": "games", "title": "Sorting Activity — S2: Q1, Q2 & Q3 — Who is Your Lord, and How Do You Know Him?", "badge": "Sort the Items · S2", "points": 6, "html": "<div class=\"sh-hdr\"><div class=\"sh-top\"><div class=\"sh-title\">Sorting Activity — Q1, Q2 & Q3 — Who is Your Lord?</div><div class=\"sh-badge\">Sort the Items · S2</div></div><div class=\"sh-meta\"><div class=\"mf\"><div class=\"ml\">Name</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Date</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\"></div><div class=\"mv\"></div></div></div></div><div class=\"note\"><b>Note:</b> Cut out the items below (or number them) and sort each into the correct category.</div><div class=\"sec-hd\"><h3>Items to Sort</h3></div><div class=\"wb\"><h4>Word Bank</h4><div class=\"words\"><span class=\"word\">الْمَالِكُ — the Owner</span><span class=\"word\">اللَّيْلُ — the night</span><span class=\"word\">السَّمَاوَاتُ — the heavens</span><span class=\"word\">الْمَعْبُودُ — the Worshipped</span><span class=\"word\">الشَّمْسُ — the sun</span><span class=\"word\">الأَرْضُ — the earth</span></div></div><div class=\"sec-hd\"><h3>Sort Them Here</h3><span class=\"pts\">6 pts</span></div><table class=\"tbl\"><thead><tr><th>Meaning of ar-Rabb</th><th>SIGNS (آيَات)</th><th>CREATION (مَخْلُوقَات)</th></tr></thead><tbody><tr><td class=\"wc\"></td><td class=\"wc\"></td><td class=\"wc\"></td></tr><tr><td class=\"wc\"></td><td class=\"wc\"></td><td class=\"wc\"></td></tr><tr><td class=\"wc\"></td><td class=\"wc\"></td><td class=\"wc\"></td></tr></tbody></table>", "lesson": 2}, {"id": "SEQ2", "cat": "games", "title": "Sequencing Activity — S2: Q1, Q2 & Q3 — Who is Your Lord, and How Do You Know Him?", "badge": "Put in Order · S2", "points": 6, "html": "<div class=\"sh-hdr\"><div class=\"sh-top\"><div class=\"sh-title\">Sequencing Activity — Q1, Q2 & Q3 — Who is Your Lord?</div><div class=\"sh-badge\">Put in Order · S2</div></div><div class=\"sh-meta\"><div class=\"mf\"><div class=\"ml\">Name</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Date</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\"></div><div class=\"mv\"></div></div></div></div><div class=\"note\"><b>Note:</b> Number these events 1, 2, 3... in the correct order.</div><div class=\"sec-hd\"><h3>Put These in the Correct Order</h3><span class=\"pts\">6 pts</span></div><div class=\"q\" style=\"display:flex;gap:10px;align-items:center;\"><div class=\"al\" style=\"width:36px;flex:none;height:32px;\"></div><div class=\"qt\">Q1 is asked: مَنْ رَبُّكَ؟</div></div><div class=\"q\" style=\"display:flex;gap:10px;align-items:center;\"><div class=\"al\" style=\"width:36px;flex:none;height:32px;\"></div><div class=\"qt\">Q2 is asked: وَمَا مَعْنَى الرَّبِّ؟</div></div><div class=\"q\" style=\"display:flex;gap:10px;align-items:center;\"><div class=\"al\" style=\"width:36px;flex:none;height:32px;\"></div><div class=\"qt\">The meaning of the Name Allah is explained.</div></div><div class=\"q\" style=\"display:flex;gap:10px;align-items:center;\"><div class=\"al\" style=\"width:36px;flex:none;height:32px;\"></div><div class=\"qt\">Q3 is asked: بِمَ تَعْرِفُ رَبَّكَ؟</div></div><div class=\"q\" style=\"display:flex;gap:10px;align-items:center;\"><div class=\"al\" style=\"width:36px;flex:none;height:32px;\"></div><div class=\"qt\">The Signs and Creation are listed.</div></div><div class=\"q\" style=\"display:flex;gap:10px;align-items:center;\"><div class=\"al\" style=\"width:36px;flex:none;height:32px;\"></div><div class=\"qt\">Al-A'raf 7:54 is brought as the proof for all three.</div></div>", "lesson": 2}, {"id": "GUID3", "cat": "classwork", "title": "Guided Practice — S3: Shirk, Du'a & the Five Heart-Worship Acts", "badge": "Teacher-Led · S3", "points": 7, "html": "<div class=\"sh-hdr\"><div class=\"sh-top\"><div class=\"sh-title\">Guided Practice — Shirk, Du'a & Heart Worship</div><div class=\"sh-badge\">Teacher-Led · S3</div></div><div class=\"sh-meta\"><div class=\"mf\"><div class=\"ml\">Name</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Date</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\"></div><div class=\"mv\"></div></div></div></div><div class=\"note\"><b>Note:</b> Work through this WITH your teacher, one section at a time. Stop at each checkpoint (⏸) to check answers together before moving on.</div><div class=\"sec-hd\"><h3>Step 1 — Read Together</h3></div><div class=\"q\"><div class=\"qt\">The text calls Shirk أَعْظَمُ ذَنْبٍ عُصِيَ اللهُ بِهِ — the greatest sin. It is defined as giving Allah a نِدّ (rival) through 5 acts. Du'a is called مُخُّ الْعِبَادَةِ (weak hadith) or الْعِبَادَةُ itself (authentic hadith) — either way, the heart and soul of worship. Five more heart-worship types are then taught: khawf, raja', tawakkul, raghbah/rahbah, and inabah.</div></div><div class=\"sec-hd\"><h3>⏸ Checkpoint 1</h3></div><div class=\"q\"><div class=\"qt\">Before moving on: what is the difference between the weak and authentic du'a hadith?</div><div class=\"al\"></div></div><div class=\"sec-hd\"><h3>Step 2 — Fill In Together</h3><span class=\"pts\">5 pts</span></div><div class=\"wb\"><h4>Word Bank</h4><div class=\"words\"><span class=\"word\">rival</span><span class=\"word\">fear</span><span class=\"word\">hope</span><span class=\"word\">reliance</span><span class=\"word\">turning back</span></div></div><table class=\"tbl\"><thead><tr><th>#</th><th>Sentence</th></tr></thead><tbody><tr><td class=\"wc\">1</td><td class=\"wc\">A نِدّ is a ____ given to Allah.</td></tr><tr><td class=\"wc\">2</td><td class=\"wc\">الْخَوْفُ means special ____ that belongs to Allah.</td></tr><tr><td class=\"wc\">3</td><td class=\"wc\">الرَّجَاءُ means ____ in Allah's mercy.</td></tr><tr><td class=\"wc\">4</td><td class=\"wc\">التَّوَكُّلُ means ____ on Allah after doing your part.</td></tr><tr><td class=\"wc\">5</td><td class=\"wc\">الإِنَابَةُ means ____ to Allah in repentance.</td></tr></tbody></table><div class=\"sec-hd\"><h3>⏸ Checkpoint 2</h3></div><div class=\"q\"><div class=\"qt\">Checkpoint: name the proof ayah for each of the 5 heart-worship types.</div><div class=\"al\"></div></div>", "lesson": 3}, {"id": "INDEP3", "cat": "classwork", "title": "Independent Practice — S3: Shirk, Du'a & the Five Heart-Worship Acts", "badge": "Work Alone · S3", "points": 9, "html": "<div class=\"sh-hdr\"><div class=\"sh-top\"><div class=\"sh-title\">Independent Practice — Shirk, Du'a & Heart Worship</div><div class=\"sh-badge\">Work Alone · S3</div></div><div class=\"sh-meta\"><div class=\"mf\"><div class=\"ml\">Name</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Date</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\"></div><div class=\"mv\"></div></div></div></div><div class=\"note\"><b>Note:</b> Complete this ON YOUR OWN, using what you've learned. No partner, no teacher help — show what YOU know.</div><div class=\"sec-hd\"><h3>On Your Own</h3><span class=\"pts\">9 pts</span></div><div class=\"q\"><div class=\"qn\">Question 1</div><div class=\"qt\">Write the text's full definition of Shirk and all 5 forms, from memory.</div></div><div class=\"als\"><div class=\"aline\"></div><div class=\"aline\"></div></div><div class=\"q\"><div class=\"qn\">Question 2</div><div class=\"qt\">Explain the difference between الدُّعَاءُ مُخُّ الْعِبَادَةِ (weak) and الدُّعَاءُ هُوَ الْعِبَادَةُ (authentic), and why the text still mentions the weak one.</div></div><div class=\"als\"><div class=\"aline\"></div><div class=\"aline\"></div></div><div class=\"q\"><div class=\"qn\">Question 3</div><div class=\"qt\">List all 5 heart-worship types with their Arabic names and proof ayahs.</div></div><div class=\"als\"><div class=\"aline\"></div><div class=\"aline\"></div></div>", "lesson": 3}, {"id": "READ3", "cat": "classwork", "title": "Reading Comprehension — S3: Shirk, Du'a & the Five Heart-Worship Acts", "badge": "Read & Answer · S3", "points": 8, "html": "<div class=\"sh-hdr\"><div class=\"sh-top\"><div class=\"sh-title\">Reading Comprehension — Shirk, Du'a & Heart Worship</div><div class=\"sh-badge\">Read & Answer · S3</div></div><div class=\"sh-meta\"><div class=\"mf\"><div class=\"ml\">Name</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Date</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\"></div><div class=\"mv\"></div></div></div></div><div class=\"sec-hd\"><h3>Read the passage carefully</h3></div><div class=\"q\" style=\"line-height:1.7;\">The text does not soften its words about Shirk: وَالشِّرْكُ أَعْظَمُ ذَنْبٍ عُصِيَ اللهُ بِهِ — \"Shirk is the greatest sin by which Allah is disobeyed.\" It is defined as making a نِدّ — a rival — for Allah, through five specific acts: calling upon, hoping in, fearing, relying upon, or desiring something besides Allah. Al-Ma'idah 5:72 warns that whoever commits Shirk has Paradise forbidden to them. The text then turns to Du'a, calling it مِنْ أَعْظَمِ أَنْوَاعِ الْعِبَادَاتِ — one of the greatest forms of worship. It quotes a well-known but WEAK hadith, الدُّعَاءُ مُخُّ الْعِبَادَةِ (\"du'a is the marrow of worship\"), and notes the stronger, authenticated version: الدُّعَاءُ هُوَ الْعِبَادَةُ (\"du'a IS worship\"). Three ayahs prove three rulings: du'a to Allah is the greatest worship, refusing to make du'a at all is arrogance, and du'a to other than Allah is Kufr. The text then teaches five more heart-worship acts that belong to Allah alone: khawf (fear), raja' (hope), tawakkul (reliance — \"tie your camel first, then trust Allah\"), raghbah wa rahbah (desire and awe), and inabah (turning back to Allah). Each has its own Qur'anic proof. The key rule: if any of these five is directed to other than Allah, it becomes Shirk.</div><div class=\"sec-hd\"><h3>Answer the Questions</h3><span class=\"pts\">8 pts</span></div><div class=\"q\"><div class=\"qn\">Question 1</div><div class=\"qt\">What does the text call Shirk, and how does it define it?</div></div><div class=\"als\"><div class=\"aline\"></div></div><div class=\"q\"><div class=\"qn\">Question 2</div><div class=\"qt\">What is the difference between the weak and authentic du'a hadith?</div></div><div class=\"als\"><div class=\"aline\"></div></div><div class=\"q\"><div class=\"qn\">Question 3</div><div class=\"qt\">What are the three rulings on du'a proven by the three ayahs?</div></div><div class=\"als\"><div class=\"aline\"></div></div><div class=\"q\"><div class=\"qn\">Question 4</div><div class=\"qt\">List the 5 heart-worship types and explain what tawakkul means using the camel example.</div></div><div class=\"als\"><div class=\"aline\"></div></div>", "lesson": 3}, {"id": "SORT3", "cat": "games", "title": "Sorting Activity — S3: Shirk, Du'a & the Five Heart-Worship Acts", "badge": "Sort the Items · S3", "points": 6, "html": "<div class=\"sh-hdr\"><div class=\"sh-top\"><div class=\"sh-title\">Sorting Activity — Shirk, Du'a & Heart Worship</div><div class=\"sh-badge\">Sort the Items · S3</div></div><div class=\"sh-meta\"><div class=\"mf\"><div class=\"ml\">Name</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Date</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\"></div><div class=\"mv\"></div></div></div></div><div class=\"note\"><b>Note:</b> Cut out the items below (or number them) and sort each into the correct category.</div><div class=\"sec-hd\"><h3>Items to Sort</h3></div><div class=\"wb\"><h4>Word Bank</h4><div class=\"words\"><span class=\"word\">الْخَوْفُ — Fear</span><span class=\"word\">الرَّجَاءُ — Hope</span><span class=\"word\">الصَّلَاةُ — Prayer</span><span class=\"word\">التَّوَكُّلُ — Reliance</span><span class=\"word\">الزَّكَاةُ — Charity</span><span class=\"word\">الإِنَابَةُ — Turning back</span></div></div><div class=\"sec-hd\"><h3>Sort Them Here</h3><span class=\"pts\">6 pts</span></div><table class=\"tbl\"><thead><tr><th>Heart-Worship Type</th><th>NOT a Heart-Worship Type (from this lesson)</th></tr></thead><tbody><tr><td class=\"wc\"></td><td class=\"wc\"></td></tr><tr><td class=\"wc\"></td><td class=\"wc\"></td></tr><tr><td class=\"wc\"></td><td class=\"wc\"></td></tr><tr><td class=\"wc\"></td><td class=\"wc\"></td></tr></tbody></table>", "lesson": 3}, {"id": "SEQ3", "cat": "games", "title": "Sequencing Activity — S3: Shirk, Du'a & the Five Heart-Worship Acts", "badge": "Put in Order · S3", "points": 6, "html": "<div class=\"sh-hdr\"><div class=\"sh-top\"><div class=\"sh-title\">Sequencing Activity — Shirk, Du'a & Heart Worship</div><div class=\"sh-badge\">Put in Order · S3</div></div><div class=\"sh-meta\"><div class=\"mf\"><div class=\"ml\">Name</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Date</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\"></div><div class=\"mv\"></div></div></div></div><div class=\"note\"><b>Note:</b> Number these events 1, 2, 3... in the correct order.</div><div class=\"sec-hd\"><h3>Put These in the Correct Order</h3><span class=\"pts\">6 pts</span></div><div class=\"q\" style=\"display:flex;gap:10px;align-items:center;\"><div class=\"al\" style=\"width:36px;flex:none;height:32px;\"></div><div class=\"qt\">The text states Shirk is the greatest sin.</div></div><div class=\"q\" style=\"display:flex;gap:10px;align-items:center;\"><div class=\"al\" style=\"width:36px;flex:none;height:32px;\"></div><div class=\"qt\">The text defines Shirk as giving Allah a rival, in 5 ways.</div></div><div class=\"q\" style=\"display:flex;gap:10px;align-items:center;\"><div class=\"al\" style=\"width:36px;flex:none;height:32px;\"></div><div class=\"qt\">The text brings Al-Ma'idah 5:72 as the consequence.</div></div><div class=\"q\" style=\"display:flex;gap:10px;align-items:center;\"><div class=\"al\" style=\"width:36px;flex:none;height:32px;\"></div><div class=\"qt\">The text introduces Du'a as the heart and soul of worship.</div></div><div class=\"q\" style=\"display:flex;gap:10px;align-items:center;\"><div class=\"al\" style=\"width:36px;flex:none;height:32px;\"></div><div class=\"qt\">The text gives the weak and authentic du'a hadiths.</div></div><div class=\"q\" style=\"display:flex;gap:10px;align-items:center;\"><div class=\"al\" style=\"width:36px;flex:none;height:32px;\"></div><div class=\"qt\">The text teaches the 5 heart-worship types with their proofs.</div></div>", "lesson": 3}, {"id": "GUID4", "cat": "classwork", "title": "Guided Practice — S4: Rejecting the Taghut, Q5 & the Five Pillars", "badge": "Teacher-Led · S4", "points": 5, "html": "<div class=\"sh-hdr\"><div class=\"sh-top\"><div class=\"sh-title\">Guided Practice — Rejecting the Taghut, Q5 & the Five Pillars</div><div class=\"sh-badge\">Teacher-Led · S4</div></div><div class=\"sh-meta\"><div class=\"mf\"><div class=\"ml\">Name</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Date</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\"></div><div class=\"mv\"></div></div></div></div><div class=\"note\"><b>Note:</b> Work through this WITH your teacher, one section at a time. Stop at each checkpoint (⏸) to check answers together before moving on.</div><div class=\"sec-hd\"><h3>Step 1 — Read Together</h3></div><div class=\"q\"><div class=\"qt\">The FIRST obligation is الْكُفْرُ بِالطَّاغُوتِ وَالإِيمَانُ بِاللَّهِ. Taghut is defined two ways. Q5 asks مَا دِينُكَ؟ and the answer is دِينِيَ الإِسْلَامُ, with a 4-part meaning. The 5 Pillars come from the Hadith of Jibril.</div></div><div class=\"sec-hd\"><h3>⏸ Checkpoint 1</h3></div><div class=\"q\"><div class=\"qt\">Before moving on: what ayah proves this was every prophet's message?</div><div class=\"al\"></div></div><div class=\"sec-hd\"><h3>Step 2 — Fill In Together</h3><span class=\"pts\">3 pts</span></div><div class=\"wb\"><h4>Word Bank</h4><div class=\"words\"><span class=\"word\">reject</span><span class=\"word\">believe</span><span class=\"word\">worshipped</span><span class=\"word\">followed</span><span class=\"word\">obeyed</span></div></div><table class=\"tbl\"><thead><tr><th>#</th><th>Sentence</th></tr></thead><tbody><tr><td class=\"wc\">1</td><td class=\"wc\">First obligation part 1: ____ the Taghut.</td></tr><tr><td class=\"wc\">2</td><td class=\"wc\">First obligation part 2: ____ in Allah.</td></tr><tr><td class=\"wc\">3</td><td class=\"wc\">Ibn al-Qayyim's 3 categories: ____, ____, ____.</td></tr></tbody></table><div class=\"sec-hd\"><h3>⏸ Checkpoint 2</h3></div><div class=\"q\"><div class=\"qt\">Checkpoint: name all 5 Pillars with their proofs.</div><div class=\"al\"></div></div>", "lesson": 4}, {"id": "INDEP4", "cat": "classwork", "title": "Independent Practice — S4: Rejecting the Taghut, Q5 & the Five Pillars", "badge": "Work Alone · S4", "points": 9, "html": "<div class=\"sh-hdr\"><div class=\"sh-top\"><div class=\"sh-title\">Independent Practice — Rejecting the Taghut, Q5 & the Five Pillars</div><div class=\"sh-badge\">Work Alone · S4</div></div><div class=\"sh-meta\"><div class=\"mf\"><div class=\"ml\">Name</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Date</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\"></div><div class=\"mv\"></div></div></div></div><div class=\"note\"><b>Note:</b> Complete this ON YOUR OWN, using what you've learned. No partner, no teacher help — show what YOU know.</div><div class=\"sec-hd\"><h3>On Your Own</h3><span class=\"pts\">9 pts</span></div><div class=\"q\"><div class=\"qn\">Question 1</div><div class=\"qt\">Write the first obligation and BOTH definitions of Taghut, from memory.</div></div><div class=\"als\"><div class=\"aline\"></div><div class=\"aline\"></div></div><div class=\"q\"><div class=\"qn\">Question 2</div><div class=\"qt\">Write Q5's answer and all 4 parts of the meaning of Islam.</div></div><div class=\"als\"><div class=\"aline\"></div><div class=\"aline\"></div></div><div class=\"q\"><div class=\"qn\">Question 3</div><div class=\"qt\">List the 5 Pillars in order with their Qur'anic proofs.</div></div><div class=\"als\"><div class=\"aline\"></div><div class=\"aline\"></div></div>", "lesson": 4}, {"id": "READ4", "cat": "classwork", "title": "Reading Comprehension — S4: Rejecting the Taghut, Q5 & the Five Pillars", "badge": "Read & Answer · S4", "points": 8, "html": "<div class=\"sh-hdr\"><div class=\"sh-top\"><div class=\"sh-title\">Reading Comprehension — Rejecting the Taghut, Q5 & the Five Pillars</div><div class=\"sh-badge\">Read & Answer · S4</div></div><div class=\"sh-meta\"><div class=\"mf\"><div class=\"ml\">Name</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Date</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\"></div><div class=\"mv\"></div></div></div></div><div class=\"sec-hd\"><h3>Read the passage carefully</h3></div><div class=\"q\" style=\"line-height:1.7;\">Before anything else, the text says: وَأَوَّلُ مَا فَرَضَ اللهُ عَلَى عِبَادِهِ: الْكُفْرُ بِالطَّاغُوتِ وَالإِيمَانُ بِاللَّهِ — \"The FIRST thing Allah required of His servants: rejecting the Taghut and believing in Allah.\" An-Nahl 16:36 proves this was every prophet's message. The text defines Taghut as مَا عُبِدَ مِنْ دُونِ اللهِ — whatever is worshipped besides Allah — including Shaytan, fortune-tellers, astrologers, and unjust rulers. Ibn al-Qayyim adds a sharper definition: whatever a person goes too far with, whether worshipped, followed, or obeyed. Q5 then asks مَا دِينُكَ؟ — \"What is your religion?\" — answered دِينِيَ الإِسْلَامُ, \"My religion is Islam.\" The text explains Islam has four parts: surrender to Allah with Tawhid, submission to Him in obedience, loyalty to the Muslims, and rejection of those who worship false gods. Two ayaht prove Islam is the ONLY accepted religion: Al Imran 3:19 and 3:85. The Prophet ﷺ himself defined Islam in the famous Hadith of Jibril, recorded in both Al-Bukhari and Muslim, as five things: the Shahadah, Salah, Zakah, Sawm, and Hajj — each with its own Qur'anic proof, including Al-Baqarah 2:183-185 for fasting and Al Imran 3:97 for Hajj.</div><div class=\"sec-hd\"><h3>Answer the Questions</h3><span class=\"pts\">8 pts</span></div><div class=\"q\"><div class=\"qn\">Question 1</div><div class=\"qt\">What is the first obligation, and what ayah proves it was every prophet's message?</div></div><div class=\"als\"><div class=\"aline\"></div></div><div class=\"q\"><div class=\"qn\">Question 2</div><div class=\"qt\">Give BOTH definitions of Taghut from the passage.</div></div><div class=\"als\"><div class=\"aline\"></div></div><div class=\"q\"><div class=\"qn\">Question 3</div><div class=\"qt\">What is Q5 and its answer, and what are the 4 parts of the meaning of Islam?</div></div><div class=\"als\"><div class=\"aline\"></div></div><div class=\"q\"><div class=\"qn\">Question 4</div><div class=\"qt\">What hadith defines the 5 Pillars, and where is it recorded?</div></div><div class=\"als\"><div class=\"aline\"></div></div>", "lesson": 4}, {"id": "SORT4", "cat": "games", "title": "Sorting Activity — S4: Rejecting the Taghut, Q5 & the Five Pillars", "badge": "Sort the Items · S4", "points": 7, "html": "<div class=\"sh-hdr\"><div class=\"sh-top\"><div class=\"sh-title\">Sorting Activity — Rejecting the Taghut, Q5 & the Five Pillars</div><div class=\"sh-badge\">Sort the Items · S4</div></div><div class=\"sh-meta\"><div class=\"mf\"><div class=\"ml\">Name</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Date</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\"></div><div class=\"mv\"></div></div></div></div><div class=\"note\"><b>Note:</b> Cut out the items below (or number them) and sort each into the correct category.</div><div class=\"sec-hd\"><h3>Items to Sort</h3></div><div class=\"wb\"><h4>Word Bank</h4><div class=\"words\"><span class=\"word\">Shahadah</span><span class=\"word\">Surrender with Tawhid</span><span class=\"word\">Salah</span><span class=\"word\">Loyalty to the Muslims</span><span class=\"word\">Zakah</span><span class=\"word\">Rejection of false gods</span><span class=\"word\">Hajj</span></div></div><div class=\"sec-hd\"><h3>Sort Them Here</h3><span class=\"pts\">7 pts</span></div><table class=\"tbl\"><thead><tr><th>One of the 5 Pillars of Islam</th><th>Part of the 4-Part Meaning of Islam</th></tr></thead><tbody><tr><td class=\"wc\"></td><td class=\"wc\"></td></tr><tr><td class=\"wc\"></td><td class=\"wc\"></td></tr><tr><td class=\"wc\"></td><td class=\"wc\"></td></tr><tr><td class=\"wc\"></td><td class=\"wc\"></td></tr></tbody></table>", "lesson": 4}, {"id": "SEQ4", "cat": "games", "title": "Sequencing Activity — S4: Rejecting the Taghut, Q5 & the Five Pillars", "badge": "Put in Order · S4", "points": 6, "html": "<div class=\"sh-hdr\"><div class=\"sh-top\"><div class=\"sh-title\">Sequencing Activity — Rejecting the Taghut, Q5 & the Five Pillars</div><div class=\"sh-badge\">Put in Order · S4</div></div><div class=\"sh-meta\"><div class=\"mf\"><div class=\"ml\">Name</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Date</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\"></div><div class=\"mv\"></div></div></div></div><div class=\"note\"><b>Note:</b> Number these events 1, 2, 3... in the correct order.</div><div class=\"sec-hd\"><h3>Put These in the Correct Order</h3><span class=\"pts\">6 pts</span></div><div class=\"q\" style=\"display:flex;gap:10px;align-items:center;\"><div class=\"al\" style=\"width:36px;flex:none;height:32px;\"></div><div class=\"qt\">The first obligation is stated: Kufr bil-Taghut and Iman billah.</div></div><div class=\"q\" style=\"display:flex;gap:10px;align-items:center;\"><div class=\"al\" style=\"width:36px;flex:none;height:32px;\"></div><div class=\"qt\">The text's own list of Taghut is given.</div></div><div class=\"q\" style=\"display:flex;gap:10px;align-items:center;\"><div class=\"al\" style=\"width:36px;flex:none;height:32px;\"></div><div class=\"qt\">Ibn al-Qayyim's definition is quoted.</div></div><div class=\"q\" style=\"display:flex;gap:10px;align-items:center;\"><div class=\"al\" style=\"width:36px;flex:none;height:32px;\"></div><div class=\"qt\">Q5 is asked and answered: دِينِيَ الإِسْلَامُ.</div></div><div class=\"q\" style=\"display:flex;gap:10px;align-items:center;\"><div class=\"al\" style=\"width:36px;flex:none;height:32px;\"></div><div class=\"qt\">The 4-part meaning of Islam is explained.</div></div><div class=\"q\" style=\"display:flex;gap:10px;align-items:center;\"><div class=\"al\" style=\"width:36px;flex:none;height:32px;\"></div><div class=\"qt\">The Hadith of Jibril gives the 5 Pillars.</div></div>", "lesson": 4}, {"id": "GUID5", "cat": "classwork", "title": "Guided Practice — S5: Worship with Body & Wealth, and the Meaning of the Shahadah", "badge": "Teacher-Led · S5", "points": 7, "html": "<div class=\"sh-hdr\"><div class=\"sh-top\"><div class=\"sh-title\">Guided Practice — Worship with Body & Wealth, and the Shahadah's Meaning</div><div class=\"sh-badge\">Teacher-Led · S5</div></div><div class=\"sh-meta\"><div class=\"mf\"><div class=\"ml\">Name</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Date</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\"></div><div class=\"mv\"></div></div></div></div><div class=\"note\"><b>Note:</b> Work through this WITH your teacher, one section at a time. Stop at each checkpoint (⏸) to check answers together before moving on.</div><div class=\"sec-hd\"><h3>Step 1 — Read Together</h3></div><div class=\"q\"><div class=\"qt\">The text adds Taharah, Salah, and Zakah as worship with proofs. The true meaning of La ilaha illa Allah is لَا مَعْبُودَ حَقٌّ إِلَّا اللهُ, proven by Ibrahim's declaration in Az-Zukhruf 26-28.</div></div><div class=\"sec-hd\"><h3>⏸ Checkpoint 1</h3></div><div class=\"q\"><div class=\"qt\">Before moving on: what ayah proves Taharah is worship, and what ayah proves Salah's fixed times?</div><div class=\"al\"></div></div><div class=\"sec-hd\"><h3>Step 2 — Fill In Together</h3><span class=\"pts\">5 pts</span></div><div class=\"wb\"><h4>Word Bank</h4><div class=\"words\"><span class=\"word\">purification</span><span class=\"word\">fixed times</span><span class=\"word\">truly</span><span class=\"word\">rejection</span><span class=\"word\">affirmation</span></div></div><table class=\"tbl\"><thead><tr><th>#</th><th>Sentence</th></tr></thead><tbody><tr><td class=\"wc\">1</td><td class=\"wc\">Taharah means ____ — an act of worship.</td></tr><tr><td class=\"wc\">2</td><td class=\"wc\">Salah is required at ____.</td></tr><tr><td class=\"wc\">3</td><td class=\"wc\">حَقّ means ____ — the key word in the Shahadah.</td></tr><tr><td class=\"wc\">4</td><td class=\"wc\">لَا إِلَهَ is the ____ part.</td></tr><tr><td class=\"wc\">5</td><td class=\"wc\">إِلَّا اللَّهُ is the ____ part.</td></tr></tbody></table><div class=\"sec-hd\"><h3>⏸ Checkpoint 2</h3></div><div class=\"q\"><div class=\"qt\">Checkpoint: what did Ibrahim ﷺ declare, and how does it prove the Shahadah's meaning?</div><div class=\"al\"></div></div>", "lesson": 5}, {"id": "INDEP5", "cat": "classwork", "title": "Independent Practice — S5: Worship with Body & Wealth, and the Meaning of the Shahadah", "badge": "Work Alone · S5", "points": 9, "html": "<div class=\"sh-hdr\"><div class=\"sh-top\"><div class=\"sh-title\">Independent Practice — Worship with Body & Wealth, and the Shahadah's Meaning</div><div class=\"sh-badge\">Work Alone · S5</div></div><div class=\"sh-meta\"><div class=\"mf\"><div class=\"ml\">Name</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Date</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\"></div><div class=\"mv\"></div></div></div></div><div class=\"note\"><b>Note:</b> Complete this ON YOUR OWN, using what you've learned. No partner, no teacher help — show what YOU know.</div><div class=\"sec-hd\"><h3>On Your Own</h3><span class=\"pts\">9 pts</span></div><div class=\"q\"><div class=\"qn\">Question 1</div><div class=\"qt\">Write the proofs for Taharah, Salah, and Zakah as forms of worship.</div></div><div class=\"als\"><div class=\"aline\"></div><div class=\"aline\"></div></div><div class=\"q\"><div class=\"qn\">Question 2</div><div class=\"qt\">Write the true meaning of La ilaha illa Allah and explain the Nafi and Ithbat parts.</div></div><div class=\"als\"><div class=\"aline\"></div><div class=\"aline\"></div></div><div class=\"q\"><div class=\"qn\">Question 3</div><div class=\"qt\">Write Q6's answer with the full lineage, from memory.</div></div><div class=\"als\"><div class=\"aline\"></div><div class=\"aline\"></div></div>", "lesson": 5}, {"id": "READ5", "cat": "classwork", "title": "Reading Comprehension — S5: Worship with Body & Wealth, and the Meaning of the Shahadah", "badge": "Read & Answer · S5", "points": 8, "html": "<div class=\"sh-hdr\"><div class=\"sh-top\"><div class=\"sh-title\">Reading Comprehension — Worship with Body & Wealth, and the Shahadah's Meaning</div><div class=\"sh-badge\">Read & Answer · S5</div></div><div class=\"sh-meta\"><div class=\"mf\"><div class=\"ml\">Name</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Date</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\"></div><div class=\"mv\"></div></div></div></div><div class=\"sec-hd\"><h3>Read the passage carefully</h3></div><div class=\"q\" style=\"line-height:1.7;\">Worship is not only in the heart — it is also in the body and the wallet. The text adds three more forms: وَمِنْهَا: الطَّهَارَةُ، وَمِنْهَا: الصَّلَاةُ، وَمِنْهَا: الزَّكَاةُ — \"and from it: purification, and from it: prayer, and from it: charity.\" Al-Baqarah 2:222 proves Taharah is worship: \"Allah loves those who repent and loves those who keep themselves clean.\" An-Nisa 4:103 proves Salah is required at fixed times. The key point is niyyah (intention) — washing your hands before eating is ordinary, but making wudu' before prayer is worship, because of WHY you're doing it. The text then explains the true meaning of the greatest statement in Islam: لَا إِلَهَ إِلَّا اللهُ مَعْنَاهَا: لَا مَعْبُودَ حَقٌّ إِلَّا اللهُ — \"its meaning is: there is no deity TRULY worthy of worship except Allah.\" The Shahadah has two parts: لَا إِلَهَ, the NO part (Nafi), rejecting all false gods, and إِلَّا اللهُ, the YES part (Ithbat), affirming Allah alone. Ibrahim ﷺ proved this structure in his own declaration: إِنَّنِي بَرَاءٌ مِّمَّا تَعْبُدُونَ إِلَّا الَّذِي فَطَرَنِي — \"I am free from what you worship, except the One who created me.\" Allah made this a كَلِمَةً بَاقِيَةً فِي عَقِبِهِ — a remaining word among his descendants — which includes every Muslim today.</div><div class=\"sec-hd\"><h3>Answer the Questions</h3><span class=\"pts\">8 pts</span></div><div class=\"q\"><div class=\"qn\">Question 1</div><div class=\"qt\">What three forms of worship does the text add here, with their proofs?</div></div><div class=\"als\"><div class=\"aline\"></div></div><div class=\"q\"><div class=\"qn\">Question 2</div><div class=\"qt\">What is the true meaning of La ilaha illa Allah?</div></div><div class=\"als\"><div class=\"aline\"></div></div><div class=\"q\"><div class=\"qn\">Question 3</div><div class=\"qt\">Explain the Nafi and Ithbat parts of the Shahadah, using Ibrahim's declaration.</div></div><div class=\"als\"><div class=\"aline\"></div></div><div class=\"q\"><div class=\"qn\">Question 4</div><div class=\"qt\">What does it mean that the Shahadah is a \"remaining word\" among Ibrahim's descendants?</div></div><div class=\"als\"><div class=\"aline\"></div></div>", "lesson": 5}, {"id": "SORT5", "cat": "games", "title": "Sorting Activity — S5: Worship with Body & Wealth, and the Meaning of the Shahadah", "badge": "Sort the Items · S5", "points": 4, "html": "<div class=\"sh-hdr\"><div class=\"sh-top\"><div class=\"sh-title\">Sorting Activity — Worship with Body & Wealth, and the Shahadah's Meaning</div><div class=\"sh-badge\">Sort the Items · S5</div></div><div class=\"sh-meta\"><div class=\"mf\"><div class=\"ml\">Name</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Date</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\"></div><div class=\"mv\"></div></div></div></div><div class=\"note\"><b>Note:</b> Cut out the items below (or number them) and sort each into the correct category.</div><div class=\"sec-hd\"><h3>Items to Sort</h3></div><div class=\"wb\"><h4>Word Bank</h4><div class=\"words\"><span class=\"word\">إِنَّنِي بَرَاءٌ مِّمَّا تَعْبُدُونَ</span><span class=\"word\">إِلَّا الَّذِي فَطَرَنِي</span><span class=\"word\">Rejecting all false gods</span><span class=\"word\">Affirming Allah alone</span></div></div><div class=\"sec-hd\"><h3>Sort Them Here</h3><span class=\"pts\">4 pts</span></div><table class=\"tbl\"><thead><tr><th>The NO part (Nafi) — لَا إِلَهَ</th><th>The YES part (Ithbat) — إِلَّا اللَّهُ</th></tr></thead><tbody><tr><td class=\"wc\"></td><td class=\"wc\"></td></tr><tr><td class=\"wc\"></td><td class=\"wc\"></td></tr><tr><td class=\"wc\"></td><td class=\"wc\"></td></tr></tbody></table>", "lesson": 5}, {"id": "SEQ5", "cat": "games", "title": "Sequencing Activity — S5: Worship with Body & Wealth, and the Meaning of the Shahadah", "badge": "Put in Order · S5", "points": 6, "html": "<div class=\"sh-hdr\"><div class=\"sh-top\"><div class=\"sh-title\">Sequencing Activity — Worship with Body & Wealth, and the Shahadah's Meaning</div><div class f Iman</div><div class=\"sh-badge\">Read & Answer · S6</div></div><div class=\"sh-meta\"><div class=\"mf\"><div class=\"ml\">Name</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Date</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\"></div><div class=\"mv\"></div></div></div></div><div class=\"sec-hd\"><h3>Read the passage carefully</h3></div><div class=\"q\" style=\"line-height:1.7;\">The text gives the Prophet's ﷺ life stage by stage. At age 40, prophethood began. For about ten years he called ONLY to Tawhid in Makkah — no prayer, no fasting, no Hajj required yet, because Tawhid is the foundation everything else is built on. Then came Al-Mi'raj, the Night Ascension, when the five daily prayers were made obligatory مِنْ غَيْرِ وَاسِطَةٍ — directly, with no intermediary between him and Allah, unlike every other command which came through Jibril. After the Hijrah to Madinah, Jihad was commanded, and roughly ten more years of striving followed until حَتَّى دَخَلَ النَّاسُ فِي دِينِ اللهِ أَفْوَاجًا — people entered the religion of Allah in multitudes. At age 63 he passed away, having completed the religion. The text summarizes his whole mission in three ayaht: قُلْ إِنَّمَا أَدْعُو رَبِّي وَلَا أُشْرِكُ بِهِ أَحَدًا (Al-Jinn 72:20), قُلِ اللَّهَ أَعْبُدُ مُخْلِصًا لَّهُ دِينِي (Az-Zumar 39:14), and قُلْ إِنَّمَا أُمِرْتُ أَنْ أَعْبُدَ اللَّهَ وَلَا أُشْرِكَ بِهِ (Ar-Ra'd 13:36) — sincerity of worship, prohibition of worshipping other than Allah, and worship restricted entirely to Allah. The text closes with the six pillars of Iman: belief in Allah, His Angels, His Books, His Messengers, the Last Day, and al-Qadar — its good AND its evil.</div><div class=\"sec-hd\"><h3>Answer the Questions</h3><span class=\"pts\">8 pts</span></div><div class=\"q\"><div class=\"qn\">Question 1</div><div class=\"qt\">Give the Prophet's ﷺ full timeline with ages and durations.</div></div><div class=\"als\"><div class=\"aline\"></div></div><div cl r><tr><td class=\"wc\"></td><td class=\"wc\"></td></tr><tr><td class=\"wc\"></td><td class=\"wc\"></td></tr></tbody></table>", "lesson": 6}, {"id": "SEQ6", "cat": "games", "title": "Sequencing Activity — S6: The Prophet's Mission & the Six Pillars of Iman", "badge": "Put in Order · S6", "points": 7, "html": "<div class=\"sh-hdr\"><div class=\"sh-top\"><div class=\"sh-title\">Sequencing Activity — The Prophet's Mission & the Six Pillars of Iman</div><div class=\"sh-badge\">Put in Order · S6</div></div><div class=\"sh-meta\"><div class=\"mf\"><div class=\"ml\">Name</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Date</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\"></div><div class=\"mv\"></div></div></div></div><div class=\"note\"><b>Note:</b> Number these events 1, 2, 3... in the correct order.</div><div class=\"sec-hd\"><h3>Put These in the Correct Order</h3><span class=\"pts\">7 pts</span></div><div class=\"q\" style=\"display:flex;gap:10px;align-items:center;\"><div class=\"al\" style=\"width:36px;flex:none;height:32px;\"></div><div class=\"qt\">Prophethood begins at age 40.</div></div><div class=\"q\" style=\"display:flex;gap:10px;align-items:center;\"><div class=\"al\" style=\"width:36px;flex:none;height:32px;\"></div><div class=\"qt\">Ten years of calling only to Tawhid in Makkah.</div></div><div class=\"q\" style=\"display:flex;gap:10px;align-items:center;\"><div class=\"al\" style=\"width:36px;flex:none;height:32px;\"></div><div class=\"qt\">Al-Mi'raj — the 5 prayers made obligatory directly.</div></div><div class=\"q\" style=\"display:flex;gap:10px;align-items:center;\"><div class=\"al\" style=\"width:36px;flex:none;height:32px;\"></div><div class=\"qt\">The Hijrah to Madinah, then Jihad commanded.</div></div><div class=\"q\" style=\"display:flex;gap:10px;align-items:center;\"><div class=\"al\" style=\"width:36px;flex:none;height:32px;\"></div><div class=\"qt\">People enter Islam in multitudes.</div></div><div cl
