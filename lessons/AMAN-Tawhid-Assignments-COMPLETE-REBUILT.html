<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>AMAN — Tawhid Complete Edition · Complete Assessment System</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>

:root{
  --g:#1A4A35;--g2:#22603F;--gp:#EAF3EE;
  --gold:#B8872A;--gold2:#D4A843;--goldp:#FBF3E3;
  --navy:#14231C;--cream:#FDF8F0;
  --ink:#1c1c1c;--ink2:#3a352b;--mu:#6B6152;--bd:#D8CFB8;
  --Fa:'Amiri',serif;--Fd:'Playfair Display',serif;--Fb:'Inter',sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:var(--Fb);background:var(--cream);color:var(--ink);font-size:14px;line-height:1.6;}

/* ── HEADER ── */
.hdr{background:var(--g);padding:12px 24px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;}
.hdr h1{font-family:var(--Fd);font-size:.92rem;color:#fff;font-weight:700;}
.hdr p{font-size:.62rem;color:rgba(255,255,255,.45);text-transform:uppercase;letter-spacing:.07em;}
.hdr-btns{display:flex;gap:6px;flex-wrap:wrap;}
.hbtn{padding:5px 12px;border-radius:6px;font-size:.76rem;font-weight:600;cursor:pointer;border:1.5px solid rgba(255,255,255,.3);color:#fff;background:transparent;font-family:var(--Fb);transition:.15s;}
.hbtn.gold{background:var(--gold2);color:var(--navy);border-color:var(--gold2);}

/* ── TABS ── */
.tab-bar{background:var(--navy);display:flex;gap:2px;padding:10px 20px 0;overflow-x:auto;}
.tab-bar::-webkit-scrollbar{display:none;}
.tbtn{padding:9px 18px;border-radius:8px 8px 0 0;font-size:.8rem;font-weight:700;cursor:pointer;border:none;background:rgba(255,255,255,.1);color:rgba(255,255,255,.55);font-family:var(--Fb);transition:.15s;white-space:nowrap;}
.tbtn.active{background:var(--cream);color:var(--g);}

/* ── PAGE ── */
.page{max-width:860px;margin:0 auto;padding:24px 20px 60px;}
.tab-pane{display:none;}.tab-pane.active{display:block;}
.assign-bar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:20px;}
.abtn{padding:5px 13px;border-radius:20px;font-size:.74rem;font-weight:600;cursor:pointer;border:1.5px solid var(--bd);background:#fff;color:var(--ink2);font-family:var(--Fb);transition:.15s;}
.abtn.active{background:var(--g);color:#fff;border-color:var(--g);}
.sheet{display:none;}.sheet.active{display:block;}
.pr-row{display:flex;gap:7px;margin-bottom:18px;flex-wrap:wrap;}
.pr-btn{padding:6px 14px;border-radius:6px;font-size:.76rem;font-weight:600;cursor:pointer;border:none;font-family:var(--Fb);}
.pr-btn.g{background:var(--g);color:#fff;} .pr-btn.gl{background:var(--gold2);color:var(--navy);}

/* ── SHEET HEADER ── */
.sh-hdr{border:2.5px solid var(--g);border-radius:9px;padding:14px 18px;margin-bottom:18px;}
.sh-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.sh-title{font-family:var(--Fd);font-size:1.05rem;color:var(--g);font-weight:700;}
.sh-badge{background:var(--g);color:#fff;border-radius:5px;padding:2px 9px;font-size:.7rem;font-weight:700;}
.sh-meta{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
.mf{display:flex;flex-direction:column;gap:2px;}
.ml{font-size:.62rem;font-weight:700;color:var(--mu);text-transform:uppercase;letter-spacing:.07em;}
.mv{border-bottom:1.5px solid var(--ink);height:22px;}

/* ── SECTIONS ── */
.sec{margin-bottom:20px;}
.sec-hd{display:flex;align-items:center;gap:8px;background:var(--g);color:#fff;padding:6px 13px;border-radius:6px;margin-bottom:10px;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
.sec-hd h3{font-family:var(--Fd);font-size:.86rem;font-weight:700;}
.pts{margin-left:auto;font-size:.7rem;opacity:.8;background:rgba(255,255,255,.2);padding:1px 7px;border-radius:4px;}

/* ── QUESTIONS ── */
.q{margin-bottom:12px;padding:11px 13px;background:#fff;border-radius:7px;border:1px solid var(--bd);border-left:3px solid var(--g);}
.qn{font-size:.65rem;font-weight:700;color:var(--g);text-transform:uppercase;letter-spacing:.07em;margin-bottom:4px;}
.qt{font-size:.875rem;color:var(--ink2);line-height:1.65;margin-bottom:6px;}
.qar{font-family:var(--Fa);font-size:1.2rem;direction:rtl;text-align:right;color:var(--g);display:block;margin:6px 0;}

/* ── ANSWER AREAS ── */
.al{border-bottom:1.5px solid var(--bd);height:26px;margin-bottom:6px;}
.als{display:flex;flex-direction:column;gap:8px;margin-top:6px;}
.aline{border-bottom:1.5px solid var(--bd);height:28px;}
.fib{display:inline-block;border-bottom:1.5px solid var(--bd);min-width:90px;margin:0 3px;}
.fib-lg{display:inline-block;border-bottom:1.5px solid var(--bd);min-width:140px;margin:0 3px;}

/* ── MC ── */
.mc{display:flex;flex-direction:column;gap:5px;margin-top:6px;}
.mco{display:flex;align-items:flex-start;gap:7px;padding:5px 9px;border-radius:5px;border:1.5px solid var(--bd);font-size:.855rem;color:var(--ink2);}
.bub{width:17px;height:17px;border-radius:50%;border:2px solid var(--bd);flex-shrink:0;margin-top:1px;}

/* ── MATCHING ── */
.match-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px;}
.match-col h4{font-size:.68rem;font-weight:700;color:var(--mu);text-transform:uppercase;letter-spacing:.07em;margin-bottom:5px;}
.mi{display:flex;align-items:center;gap:6px;padding:6px 9px;border-radius:5px;border:1.5px solid var(--bd);font-size:.83rem;color:var(--ink2);margin-bottom:4px;}
.mn{width:20px;height:20px;border-radius:50%;background:var(--g);color:#fff;display:flex;align-items:center;justify-content:center;font-size:.66rem;font-weight:700;flex-shrink:0;}
.mlt{width:20px;height:20px;border-radius:50%;border:2px solid var(--bd);display:flex;align-items:center;justify-content:center;font-size:.7rem;font-weight:700;flex-shrink:0;color:var(--mu);}
.mblk{width:24px;border-bottom:1.5px solid var(--bd);margin-right:4px;text-align:center;font-size:.8rem;flex-shrink:0;}

/* ── TABLE ── */
.tbl{width:100%;border-collapse:collapse;margin-top:7px;font-size:.81rem;}
.tbl th{background:var(--g);color:#fff;padding:7px 9px;text-align:left;font-weight:600;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
.tbl td{padding:7px 9px;border-bottom:1px solid var(--bd);vertical-align:top;}
.tbl tr:nth-child(even) td{background:var(--gp);}
.wc{min-height:26px;}

/* ── WORD BANK ── */
.wb{background:var(--goldp);border:1.5px solid var(--gold);border-radius:7px;padding:9px 13px;margin-bottom:12px;}
.wb h4{font-size:.66rem;font-weight:700;color:var(--gold);text-transform:uppercase;letter-spacing:.07em;margin-bottom:5px;}
.words{display:flex;flex-wrap:wrap;gap:5px;}
.word{background:#fff;border:1.5px solid var(--gold);border-radius:4px;padding:2px 9px;font-size:.8rem;font-weight:600;color:var(--g);}

/* ── AYAH BOX ── */
.ab{background:var(--gp);border-left:3px solid var(--g2);border-radius:0 7px 7px 0;padding:9px 13px;margin:7px 0;}
.ab .ar{font-family:var(--Fa);font-size:1.1rem;direction:rtl;text-align:right;color:var(--g);display:block;margin-bottom:3px;}
.ab .tr{font-size:.8rem;color:var(--ink2);font-style:italic;}
.ab .src{font-size:.68rem;color:var(--mu);margin-top:2px;text-align:right;}

/* ── SCORE BOX ── */
.sc-box{border:2px solid var(--g);border-radius:7px;padding:10px 14px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:16px;background:#fff;}
.sc-lbl{font-size:.7rem;font-weight:700;color:var(--mu);text-transform:uppercase;letter-spacing:.07em;}
.sc-val{font-family:var(--Fd);font-size:1.05rem;color:var(--g);min-width:60px;border-bottom:1.5px solid var(--bd);}

/* ── NOTE ── */
.note{background:var(--goldp);border:1.5px solid var(--gold);border-radius:7px;padding:9px 13px;margin-bottom:12px;font-size:.82rem;color:var(--ink2);}

/* ── JOURNAL ── */
.jnl{background:#fff;border:1.5px solid var(--bd);border-radius:7px;padding:12px;margin-bottom:10px;}
.jnl h4{font-size:.82rem;font-weight:700;color:var(--g);margin-bottom:8px;padding-bottom:5px;border-bottom:1px solid var(--bd);}

/* ── LINEAGE ── */
.lin{display:flex;flex-direction:column;align-items:center;gap:4px;margin:12px auto;max-width:320px;}
.lin-box{border:1.5px solid var(--g);border-radius:6px;padding:7px 16px;text-align:center;font-family:var(--Fa);font-size:1rem;direction:rtl;color:var(--g);}
.lin-box.main{background:var(--g);color:#fff;font-size:1.1rem;font-weight:700;}
.lin-arrow{font-size:.75rem;color:var(--mu);}

/* ══ PRINT ══ */
@media print{
  body{background:#fff;font-size:10.5pt;}
  .hdr,.tab-bar,.assign-bar,.hdr-btns,.pr-row{display:none!important;}
  .page{max-width:100%;padding:0;margin:0;}
  .tab-pane{display:none!important;}
  .tab-pane.print-active{display:block!important;}
  .sheet{display:none!important;}
  .sheet.print-active{display:block!important;}
  .sheet.print-active+.sheet.print-active{page-break-before:always;}
  .sh-hdr{border:2pt solid #1A5C25;}
  .q{page-break-inside:avoid;border:1pt solid #D1D5DB;border-left:3pt solid #1A5C25;}
  .sec-hd{background:#1A5C25!important;}
  .tbl th{background:#1A5C25!important;}
  .aline,.al{border-bottom:1pt solid #D1D5DB;}
}


/* ══ NEW COMPONENTS (audit additions) ══ */
.tf{display:flex;flex-direction:column;gap:6px;margin-top:6px;}
.tfrow{display:flex;align-items:center;gap:10px;padding:7px 10px;border:1.5px solid var(--bd);border-radius:6px;background:#fff;}
.tfopt{display:flex;gap:4px;flex-shrink:0;}
.tfbub{width:22px;height:22px;border-radius:5px;border:2px solid var(--bd);display:flex;align-items:center;justify-content:center;font-size:.68rem;font-weight:700;color:var(--mu);}
.tftext{font-size:.85rem;color:var(--ink2);}

.ws{border-collapse:collapse;margin:0 auto;}
.ws td{width:22px;height:22px;text-align:center;vertical-align:middle;font-family:var(--Fb);font-size:.68rem;font-weight:700;border:1px solid var(--bd);color:var(--ink2);}
.ws-wrap{display:flex;flex-direction:column;align-items:center;gap:10px;}

.xw-wrap{display:flex;flex-direction:column;gap:14px;}
.xw{border-collapse:collapse;margin:0 auto;}
.xw td{width:24px;height:24px;border:1px solid var(--ink2);position:relative;}
.xw td.xw-blank{border:none;background:transparent;}
.xw td.xw-cell{background:#fff;}
.xw-num{position:absolute;top:0;left:1px;font-size:.5rem;font-weight:700;color:var(--g);}
.xw-clue-cols{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.xw-clue-cols h4{font-size:.72rem;font-weight:700;color:var(--g);text-transform:uppercase;letter-spacing:.06em;margin-bottom:5px;}
.xw-clues{font-size:.78rem;color:var(--ink2);padding-left:18px;line-height:1.5;}

.fc-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:8px;}
.fc{border:1.5px dashed var(--bd);border-radius:8px;padding:10px;text-align:center;background:#fff;}
.fc-front{margin-bottom:6px;}
.fc-tr{font-size:.7rem;color:var(--mu);margin-top:2px;}
.fc-back{font-size:.76rem;color:var(--g);font-weight:600;border-top:1px dashed var(--bd);padding-top:6px;}

.oral{display:flex;flex-direction:column;gap:0;margin-top:6px;border:1px solid var(--bd);border-radius:7px;overflow:hidden;}
.oral-row{display:grid;grid-template-columns:26px 1fr 1fr;gap:8px;padding:7px 10px;border-bottom:1px solid var(--bd);align-items:center;}
.oral-row:last-child{border-bottom:none;}
.oral-row:nth-child(even){background:var(--gp);}
.oral-n{font-weight:700;color:var(--g);font-size:.75rem;}
.oral-p{font-family:var(--Fa);direction:rtl;text-align:right;font-size:.92rem;color:var(--ink2);}
.oral-a{font-size:.74rem;color:var(--mu);font-style:italic;}

.unsc{display:flex;flex-direction:column;gap:8px;margin-top:6px;}
.unsc-row{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1.5px solid var(--bd);border-radius:6px;background:#fff;flex-wrap:wrap;}
.unsc-n{font-weight:700;color:var(--g);width:18px;}
.unsc-scr{font-family:var(--Fb);letter-spacing:.15em;font-weight:700;color:var(--navy);background:var(--goldp);padding:3px 9px;border-radius:5px;font-size:.85rem;}
.unsc-cl{font-size:.76rem;color:var(--mu);flex:1;min-width:120px;}

.search-row{display:flex;gap:8px;align-items:center;margin-bottom:14px;flex-wrap:wrap;}
.search-input{flex:1;min-width:180px;padding:8px 12px;border-radius:8px;border:1.5px solid var(--bd);font-family:var(--Fb);font-size:.85rem;}
.search-input:focus{outline:2px solid var(--g);border-color:var(--g);}
.lesson-filter{display:flex;gap:5px;flex-wrap:wrap;}
.lfbtn{padding:5px 11px;border-radius:16px;font-size:.72rem;font-weight:600;cursor:pointer;border:1.5px solid var(--bd);background:#fff;color:var(--ink2);}
.lfbtn.active{background:var(--navy);color:#fff;border-color:var(--navy);}
.no-results{padding:30px;text-align:center;color:var(--mu);font-style:italic;}

.progress-chip{display:inline-flex;align-items:center;gap:5px;font-size:.68rem;color:rgba(255,255,255,.7);}
.pcheck{width:16px;height:16px;cursor:pointer;}

.calc-row{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap;}
.calc-row input{width:70px;padding:5px 8px;border-radius:5px;border:1.5px solid var(--bd);font-size:.85rem;}
.calc-btn{padding:5px 12px;border-radius:6px;font-size:.75rem;font-weight:600;cursor:pointer;border:none;background:var(--g);color:#fff;}
.calc-result{font-weight:700;color:var(--g);font-size:.9rem;}

/* ══ ACCESSIBILITY ══ */
.hbtn:focus-visible,.tbtn:focus-visible,.abtn:focus-visible,.lfbtn:focus-visible,.calc-btn:focus-visible{outline:3px solid var(--gold2);outline-offset:2px;}
.mv:focus-within,.al:focus-within{outline:2px solid var(--g);}
.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;}

/* ══ MOBILE RESPONSIVE (was entirely missing) ══ */
@media (max-width:640px){
  body{font-size:13px;}
  .hdr{padding:10px 12px;}
  .hdr h1{font-size:.8rem;}
  .hdr-btns{width:100%;justify-content:flex-start;}
  .tab-bar{padding:8px 10px 0;}
  .tbtn{padding:7px 12px;font-size:.72rem;}
  .page{padding:14px 10px 50px;}
  .sh-meta{grid-template-columns:1fr;}
  .match-grid{grid-template-columns:1fr;}
  .fc-grid{grid-template-columns:repeat(2,1fr);}
  .oral-row{grid-template-columns:20px 1fr;}
  .oral-a{grid-column:2;}
  .xw-clue-cols{grid-template-columns:1fr;}
  .tbl{font-size:.72rem;}
  .tbl th,.tbl td{padding:5px 6px;}
  .search-row{flex-direction:column;align-items:stretch;}
}
@media (max-width:400px){
  .ws td,.xw td{width:18px;height:18px;font-size:.58rem;}
}

/* ══ FUNCTIONAL SCORE CALCULATOR (fix: was dead code before) ══ */
.sc-input{width:56px;padding:4px 6px;border-radius:5px;border:1.5px solid var(--bd);font-size:.9rem;font-weight:700;text-align:center;margin-top:2px;}
.sc-input:focus{outline:2px solid var(--g);}
.sc-pct{font-size:.72rem;color:var(--g);font-weight:700;margin-top:2px;min-height:14px;}

</style>
</head>
<body>
<header class="hdr">
  <div>
    <h1>AMAN — Tawhid (Complete Edition) · Complete Assessment System</h1>
    <p>Al-Madrasatu An-Nuriyyah · Based on the Arabic treatise of Shaykh Muhammad ibn 'Abd al-Wahhab · Audited &amp; rebuilt against the corrected 7-session lesson slides</p>
  </div>
  <div class="hdr-btns">
    <button class="hbtn" onclick="printCurrent()" aria-label="Print the currently open sheet">🖨 Print Current</button>
    <button class="hbtn" onclick="printSection()" aria-label="Print all sheets in this tab">🖨 Print Tab</button>
    <button class="hbtn gold" onclick="printAll()" aria-label="Print the entire assessment system">🖨 Print All</button>
  </div>
</header>

<nav class="tab-bar" id="tabBar" role="tablist" aria-label="Assessment categories"></nav>

<main class="page">
  <div class="search-row">
    <label for="searchBox" class="visually-hidden">Search all assignments</label>
    <input type="search" id="searchBox" class="search-input" placeholder="🔍 Search all sheets (e.g. &quot;Shirk&quot;, &quot;Al-A'raf&quot;, &quot;matching&quot;)..." oninput="onSearch(this.value)">
    <div class="lesson-filter" role="group" aria-label="Filter by session">
      <button class="lfbtn active" onclick="setLessonFilter('all',this)">All Sessions</button>
      <button class="lfbtn" onclick="setLessonFilter('1',this)">S1</button>
      <button class="lfbtn" onclick="setLessonFilter('2',this)">S2</button>
      <button class="lfbtn" onclick="setLessonFilter('3',this)">S3</button>
      <button class="lfbtn" onclick="setLessonFilter('4',this)">S4</button>
      <button class="lfbtn" onclick="setLessonFilter('5',this)">S5</button>
      <button class="lfbtn" onclick="setLessonFilter('6',this)">S6</button>
      <button class="lfbtn" onclick="setLessonFilter('7',this)">S7</button>
      <button class="lfbtn" onclick="setLessonFilter('0',this)">Cross-Session</button>
    </div>
  </div>
  <div class="assign-bar" id="assignBar" role="tablist" aria-label="Sheets in this category"></div>
  <div id="sheetWrap"></div>
</main>

<iframe id="printFrame" title="Print output" style="position:absolute;width:0;height:0;border:0;visibility:hidden;"></iframe>

<script>
const SHEETS = [{"id": "CW1", "cat": "classwork", "title": "Tawhid Classwork 1 — The Book, Rabb, Signs of Allah", "badge": "CW 1 · Sessions 1-2", "points": 40, "html": "<div class=\"sh-hdr\"><div class=\"sh-top\"><div class=\"sh-title\">Tawhid Classwork 1 — The Book, Rabb, Signs of Allah</div><div class=\"sh-badge\">CW 1 · Sessions 1-2</div></div><div class=\"sh-meta\"><div class=\"mf\"><div class=\"ml\">Student Name</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Date</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Level / Class</div><div class=\"mv\"></div></div></div></div><div class=\"sec-hd\"><h3>Part A — Circle True or False</h3><span class=\"pts\">10 pts</span></div><div class=\"tf\"><div class=\"tfrow\"><div class=\"tfopt\"><span class=\"tfbub\">T</span><span class=\"tfbub\">F</span></div><div class=\"tftext\">1. We must learn Tawhid AFTER the Qur'an.</div></div><div class=\"tfrow\"><div class=\"tfopt\"><span class=\"tfbub\">T</span><span class=\"tfbub\">F</span></div><div class=\"tftext\">2. The author of this book is Shaykh Ibn Taymiyyah.</div></div><div class=\"tfrow\"><div class=\"tfopt\"><span class=\"tfbub\">T</span><span class=\"tfbub\">F</span></div><div class=\"tftext\">3. Rabb means: الْمَالِكُ الْمَعْبُودُ — The Owner and the One Worshipped.</div></div><div class=\"tfrow\"><div class=\"tfopt\"><span class=\"tfbub\">T</span><span class=\"tfbub\">F</span></div><div class=\"tftext\">4. We recognize Allah through His signs and His creation.</div></div><div class=\"tfrow\"><div class=\"tfopt\"><span class=\"tfbub\">T</span><span class=\"tfbub\">F</span></div><div class=\"tftext\">5. The sun and moon are examples of Allah's CREATION (مَخْلُوقَاتٌ), not His Signs (آيَاتٌ).</div></div><div class=\"tfrow\"><div class=\"tfopt\"><span class=\"tfbub\">T</span><span class=\"tfbub\">F</span></div><div class=\"tftext\">6. The meaning of \"Allah\" is: ذُو الأُلُوهِيَّةِ وَالْعُبُودِيَّةِ عَلَى خَلْقِهِ أَجْمَعِينَ.</div></div><div class=\"tfrow\"><div class=\"tfopt\"><span class=\"tfbub\">T</span><span class=\"tfbub\">F</span></div><div class=\"tftext\">7. Allah created the heavens and earth in seven days.</div></div><div class=\"tfrow\"><div class=\"tfopt\"><span class=\"tfbub\">T</span><span class=\"tfbub\">F</span></div><div class=\"tftext\">8. The question سُؤَالٌ ١ is: \"Who is your Lord?\" and the answer is: رَبِّيَ اللهُ.</div></div><div class=\"tfrow\"><div class=\"tfopt\"><span class=\"tfbub\">T</span><span class=\"tfbub\">F</span></div><div class=\"tftext\">9. The Fitrah is the name of the author's book.</div></div><div class=\"tfrow\"><div class=\"tfopt\"><span class=\"tfbub\">T</span><span class=\"tfbub\">F</span></div><div class=\"tftext\">10. The Q&A format makes it easy to memorize and check understanding.</div></div></div><div class=\"sec-hd\"><h3>Part B — Fill in the Blank</h3><span class=\"pts\">15 pts</span></div><div class=\"wb\"><h4>Word Bank</h4><div class=\"words\"><span class=\"word\">Allah</span><span class=\"word\">signs (āyāt)</span><span class=\"word\">creation (makhlūqāt)</span><span class=\"word\">Owner</span><span class=\"word\">question and answer</span><span class=\"word\">Tawhid</span></div></div><table class=\"tbl\"><thead><tr><th>#</th><th>Sentence</th></tr></thead><tbody><tr><td class=\"wc\">1</td><td class=\"wc\">We must teach children ______ before teaching them the Qur'an.</td></tr><tr><td class=\"wc\">2</td><td class=\"wc\">The book is arranged in a ______ format — سُؤَالٌ وَجَوَابٌ.</td></tr><tr><td class=\"wc\">3</td><td class=\"wc\">Rabb means: the ______ and the One Worshipped (الْمَالِكُ الْمَعْبُودُ).</td></tr><tr><td class=\"wc\">4</td><td class=\"wc\">We recognize Allah through His ______ and His ______.</td></tr><tr><td class=\"wc\">5</td><td class=\"wc\">The meaning of the name \"______\" is: ذُو الأُلُوهِيَّةِ وَالْعُبُودِيَّةِ عَلَى خَلْقِهِ أَجْمَعِينَ.</td></tr></tbody></table><div class=\"sec-hd\"><h3>Part C — Q&A Drill</h3><span class=\"pts\">15 pts</span></div><div class=\"q\"><div class=\"qn\">Question 1</div><div class=\"qt\">مَنْ رَبُّكَ؟ (Who is your Lord?)</div></div><div class=\"qt\">English meaning:</div><div class=\"al\"></div><div class=\"q\"><div class=\"qn\">Question 2</div><div class=\"qt\">وَمَا مَعْنَى الرَّبِّ؟ (What does Rabb mean?)</div></div><div class=\"qt\">English meaning:</div><div class=\"al\"></div><div class=\"q\"><div class=\"qn\">Question 3</div><div class=\"qt\">بِمَ تَعْرِفُ رَبَّكَ؟ (How do you recognize your Lord?)</div></div><div class=\"qt\">English meaning:</div><div class=\"al\"></div><div class=\"sc-box\"><div><div class=\"sc-lbl\">Score</div><input type=\"number\" class=\"sc-input\" min=\"0\" max=\"40\" placeholder=\"0\" aria-label=\"Enter earned score out of 40\" oninput=\"var p=this.value; var out=this.parentElement.querySelector('.sc-pct'); var g=this.closest('.sc-box').querySelector('.sc-grade'); if(p===''){out.textContent='';g.textContent='';return;} var pct=Math.round((p/40)*1000)/10; out.textContent=pct+'%'; g.textContent = pct>=90?'A':pct>=80?'B':pct>=70?'C':pct>=60?'D':'F';\"><div class=\"sc-pct\"></div></div><div><div class=\"sc-lbl\">Out of</div><div class=\"sc-val\">40</div></div><div><div class=\"sc-lbl\">Grade</div><div class=\"sc-val sc-grade\"></div></div><div><div class=\"sc-lbl\">Comments</div><div class=\"sc-val\" style=\"min-width:140px;\"></div></div></div>", "lesson": 2}, {"id": "CW2", "cat": "classwork", "title": "Tawhid Classwork 2 — Ibadah, Shirk, Du'a, Islam, Five Pillars", "badge": "CW 2 · Sessions 3-4", "points": 45, "html": "<div class=\"sh-hdr\"><div class=\"sh-top\"><div class=\"sh-title\">Tawhid Classwork 2 — Ibadah, Shirk, Du'a, Islam, Five Pillars</div><div class=\"sh-badge\">CW 2 · Sessions 3-4</div></div><div class=\"sh-meta\"><div class=\"mf\"><div class=\"ml\">Student Name</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Date</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Level / Class</div><div class=\"mv\"></div></div></div></div><div class=\"sec-hd\"><h3>Part A — Multiple Choice</h3><span class=\"pts\">20 pts</span></div><div class=\"q\"><div class=\"qn\">Question 1</div><div class=\"qt\">The purpose of our creation, according to Surat Adh-Dhariyat 51:56, is:</div></div><div class=\"mc\"><div class=\"mco\"><div class=\"bub\"></div><b>A.</b>&nbsp;To seek wealth and success</div><div class=\"mco\"><div class=\"bub\"></div><b>B.</b>&nbsp;To worship Allah alone</div><div class=\"mco\"><div class=\"bub\"></div><b>C.</b>&nbsp;To study the Qur'an only</div><div class=\"mco\"><div class=\"bub\"></div><b>D.</b>&nbsp;To serve our families</div></div><div class=\"q\"><div class=\"qn\">Question 2</div><div class=\"qt\">Ibadah (worship) is described in the text as:</div></div><div class=\"mc\"><div class=\"mco\"><div class=\"bub\"></div><b>A.</b>&nbsp;Only Salah and fasting</div><div class=\"mco\"><div class=\"bub\"></div><b>B.</b>&nbsp;A big category that covers everything — اسْمٌ جَامِعٌ — for everything Allah loves</div><div class=\"mco\"><div class=\"bub\"></div><b>C.</b>&nbsp;Acts done only in the masjid</div><div class=\"mco\"><div class=\"bub\"></div><b>D.</b>&nbsp;Saying the Shahadah once a day</div></div><div class=\"q\"><div class=\"qn\">Question 3</div><div class=\"qt\">Which of the following is an INWARD act of worship (عَمَلٌ بَاطِنٌ)?</div></div><div class=\"mc\"><div class=\"mco\"><div class=\"bub\"></div><b>A.</b>&nbsp;Salah (prayer)</div><div class=\"mco\"><div class=\"bub\"></div><b>B.</b>&nbsp;Giving Zakah</div><div class=\"mco\"><div class=\"bub\"></div><b>C.</b>&nbsp;Fear of Allah (خَوْفُ اللهِ)</div><div class=\"mco\"><div class=\"bub\"></div><b>D.</b>&nbsp;Making Hajj</div></div><div class=\"q\"><div class=\"qn\">Question 4</div><div class=\"qt\">Shirk is the greatest sin because:</div></div><div class=\"mc\"><div class=\"mco\"><div class=\"bub\"></div><b>A.</b>&nbsp;It only affects the person who does it</div><div class=\"mco\"><div class=\"bub\"></div><b>B.</b>&nbsp;It gives Allah a rival (نِدٌّ) in worship</div><div class=\"mco\"><div class=\"bub\"></div><b>C.</b>&nbsp;It makes prayer invalid</div><div class=\"mco\"><div class=\"bub\"></div><b>D.</b>&nbsp;It breaks the fast</div></div><div class=\"q\"><div class=\"qn\">Question 5</div><div class=\"qt\">Allah says in Surat Al-Ma'idah 5:72 that whoever commits Shirk:</div></div><div class=\"mc\"><div class=\"mco\"><div class=\"bub\"></div><b>A.</b>&nbsp;Must fast for 60 days</div><div class=\"mco\"><div class=\"bub\"></div><b>B.</b>&nbsp;Will be forgiven after repentance</div><div class=\"mco\"><div class=\"bub\"></div><b>C.</b>&nbsp;Allah has forbidden him Paradise — مَأْوَاهُ النَّارُ</div><div class=\"mco\"><div class=\"bub\"></div><b>D.</b>&nbsp;Must perform extra Hajj</div></div><div class=\"q\"><div class=\"qn\">Question 6</div><div class=\"qt\">The hadith says: الدُّعَاءُ مُخُّ الْعِبَادَةِ. This means:</div></div><div class=\"mc\"><div class=\"mco\"><div class=\"bub\"></div><b>A.</b>&nbsp;Du'a is the least important worship</div><div class=\"mco\"><div class=\"bub\"></div><b>B.</b>&nbsp;Du'a is the heart and soul of worship</div><div class=\"mco\"><div class=\"bub\"></div><b>C.</b>&nbsp;Du'a is only for Fridays</div><div class=\"mco\"><div class=\"bub\"></div><b>D.</b>&nbsp;Du'a replaces Salah when travelling</div></div><div class=\"q\"><div class=\"qn\">Question 7</div><div class=\"qt\">Calling upon someone other than Allah in du'a is:</div></div><div class=\"mc\"><div class=\"mco\"><div class=\"bub\"></div><b>A.</b>&nbsp;Permissible if the person is righteous</div><div class=\"mco\"><div class=\"bub\"></div><b>B.</b>&nbsp;A small mistake easily forgiven</div><div class=\"mco\"><div class=\"bub\"></div><b>C.</b>&nbsp;Kufr (disbelief) — دَعْوَةُ غَيْرِ اللهِ كُفْرٌ</div><div class=\"mco\"><div class=\"bub\"></div><b>D.</b>&nbsp;Only forbidden in the masjid</div></div><div class=\"q\"><div class=\"qn\">Question 8</div><div class=\"qt\">The meaning of Islam includes:</div></div><div class=\"mc\"><div class=\"mco\"><div class=\"bub\"></div><b>A.</b>&nbsp;الاسْتِسْلَامُ وَالانْقِيَادُ وَمُوَالاةُ الْمُسْلِمِينَ وَمُعَادَاةُ الْمُشْرِكِينَ</div><div class=\"mco\"><div class=\"bub\"></div><b>B.</b>&nbsp;Only the five pillars</div><div class=\"mco\"><div class=\"bub\"></div><b>C.</b>&nbsp;Only saying the Shahadah</div><div class=\"mco\"><div class=\"bub\"></div><b>D.</b>&nbsp;Attending the masjid every Friday</div></div><div class=\"q\"><div class=\"qn\">Question 9</div><div class=\"qt\">The dalil (proof) for fasting is from Surat:</div></div><div class=\"mc\"><div class=\"mco\"><div class=\"bub\"></div><b>A.</b>&nbsp;Al Imran 3:97</div><div class=\"mco\"><div class=\"bub\"></div><b>B.</b>&nbsp;Al-Baqarah 2:183-185</div><div class=\"mco\"><div class=\"bub\"></div><b>C.</b>&nbsp;Al-Bayyinah 98:5</div><div class=\"mco\"><div class=\"bub\"></div><b>D.</b>&nbsp;Al-A'raf 7:54</div></div><div class=\"q\"><div class=\"qn\">Question 10</div><div class=\"qt\">The correct ORDER of the Five Pillars of Islam starts with:</div></div><div class=\"mc\"><div class=\"mco\"><div class=\"bub\"></div><b>A.</b>&nbsp;Salah → Shahadah → Zakah → Sawm → Hajj</div><div class=\"mco\"><div class=\"bub\"></div><b>B.</b>&nbsp;Shahadah → Salah → Zakah → Sawm → Hajj</div><div class=\"mco\"><div class=\"bub\"></div><b>C.</b>&nbsp;Hajj → Sawm → Zakah → Salah → Shahadah</div><div class=\"mco\"><div class=\"bub\"></div><b>D.</b>&nbsp;Zakah → Shahadah → Salah → Hajj → Sawm</div></div><div class=\"sec-hd\"><h3>Part B — Match the Ayah to Its Topic</h3><span class=\"pts\">10 pts</span></div><div class=\"match-grid\"><div class=\"match-col\"><h4>Column A</h4><div class=\"mi\"><div class=\"mn\">1</div>وَمَا خَلَقْتُ الْجِنَّ وَالإِنسَ إِلَّا لِيَعْبُدُونِ [الذاريات:٥٦]</div><div class=\"mi\"><div class=\"mn\">2</div>إِنَّهُ مَن يُشْرِكْ بِاللَّهِ فَقَدْ حَرَّمَ اللَّهُ عَلَيْهِ الْجَنَّةَ [المائدة:٧٢]</div><div class=\"mi\"><div class=\"mn\">3</div>ادْعُونِي أَسْتَجِبْ لَكُمْ [غافر:٦٠]</div><div class=\"mi\"><div class=\"mn\">4</div>إِنَّ الدِّينَ عِندَ اللَّهِ الإِسْلَامُ [آل عمران:١٩]</div><div class=\"mi\"><div class=\"mn\">5</div>كُتِبَ عَلَيْكُمُ الصِّيَامُ [البقرة:١٨٣]</div></div><div class=\"match-col\"><h4>Column B</h4><div class=\"mi\"><div class=\"mlt\">A</div>Islam is the only accepted religion<div class=\"mblk\"></div></div><div class=\"mi\"><div class=\"mlt\">B</div>Fasting is required upon believers<div class=\"mblk\"></div></div><div class=\"mi\"><div class=\"mlt\">C</div>Allah commands us to call on Him and promises to respond<div class=\"mblk\"></div></div><div class=\"mi\"><div class=\"mlt\">D</div>We were created only to worship Allah<div class=\"mblk\"></div></div><div class=\"mi\"><div class=\"mlt\">E</div>Shirk leads to prohibition from Paradise<div class=\"mblk\"></div></div></div></div><div class=\"sec-hd\"><h3>Part C — Short Answer</h3><span class=\"pts\">15 pts</span></div><div class=\"q\"><div class=\"qn\">Question 1</div><div class=\"qt\">List THREE examples of inward acts of worship (الأَعْمَالُ الْبَاطِنَةُ) — name at least one beyond fear (خَوْف), such as hope (رَجَاء), reliance (تَوَكُّل), desire and awe (رَغْبَة وَرَهْبَة), or turning back to Allah (إِنَابَة):</div></div><div class=\"als\"><div class=\"aline\"></div><div class=\"aline\"></div></div><div class=\"q\"><div class=\"qn\">Question 2</div><div class=\"qt\">Explain what Shirk means in your own words, and give ONE example of an action that is Shirk:</div></div><div class=\"als\"><div class=\"aline\"></div><div class=\"aline\"></div></div><div class=\"q\"><div class=\"qn\">Question 3</div><div class=\"qt\">What are the FIVE PILLARS of Islam? List them in Arabic and English:</div></div><div class=\"als\"><div class=\"aline\"></div><div class=\"aline\"></div></div><div class=\"sc-box\"><div><div class=\"sc-lbl\">Score</div><input type=\"number\" class=\"sc-input\" min=\"0\" max=\"45\" placeholder iv class=\"match-grid\"><div class=\"match-col\"><h4>Column A</h4><div class=\"mi\"><div class=\"mn\">1</div>الإِخْلَاصُ</div><div class=\"mi\"><div class=\"mn\">2</div>الطَّاغُوتُ</div><div class=\"mi\"><div class=\"mn\">3</div>الشِّرْكُ</div><div class=\"mi\"><div class=\"mn\">4</div>مُخُّ الْعِبَادَةِ</div><div class=\"mi\"><div class=\"mn\">5</div>النِّدُّ</div><div class=\"mi\"><div class=\"mn\">6</div>الْعِبَادَةُ</div><div class=\"mi\"><div class=\"mn\">7</div>الإِسْلَامُ</div><div class=\"mi\"><div class=\"mn\">8</div>الْكُفْرُ بِالطَّاغُوتِ</div></div><div class=\"match-col\"><h4>Column B</h4><div class=\"mi\"><div class=\"mlt\">A</div>First obligation — reject false gods<div class=\"mblk\"></div></div><div class=\"mi\"><div class=\"mlt\">B</div>Sincerity — doing everything only for Allah<div class=\"mblk\"></div></div><div class=\"mi\"><div class=\"mlt\">C</div>Everything Allah loves — comprehensive worship<div class=\"mblk\"></div></div><div class=\"mi\"><div class=\"mlt\">D</div>A rival/equal given to Allah in worship<div class=\"mblk\"></div></div><div class=\"mi\"><div class=\"mlt\">E</div>False god / anything worshipped besides Allah<div class=\"mblk\"></div></div><div class=\"mi\"><div class=\"mlt\">F</div>Surrender to Allah with Tawhid<div class=\"mblk\"></div></div><div class=\"mi\"><div class=\"mlt\">G</div>Greatest sin — associating partners with Allah<div class=\"mblk\"></div></div><div class=\"mi\"><div class=\"mlt\">H</div>The heart and soul of worship<div class=\"mblk\"></div></div></div></div><div class=\"sec-hd\"><h3>Part B — True or False with Correction</h3><span class=\"pts\">10 pts</span></div><div class=\"tf\"><div class=\"tfrow\"><div class=\"tfopt\"><span class=\"tfbub\">T</span><span class=\"tfbub\">F</span></div><div class=\"tftext\">1. 'Ibadah (worship) includes ONLY Salah and fasting.</div></div><div class=\"tfrow\"><div class=\"tfopt\"><span class=\"tfbub\">T</span><span class=\"tfbub\">F</span></div><div class=\"tftext\">2. The hadith says: الدُّعَاءُ مُخُّ الْعِبَادَةِ — Du'a is the heart and soul of worship (a well-known but WEAK narration).</div></div><div class=\"tfrow\"><div class=\"tfopt\"><span class=\"tfbub\">T</span><span class=\"tfbub\">F</span></div><div class=\"tftext\">3. Making du'a to a dead person or saint is permissible if you really need help.</div></div><div class=\"tfrow\"><div class=\"tfopt\"><span class=\"tfbub\">T</span><span class=\"tfbub\">F</span></div><div class=\"tftext\">4. إِنَّ الدِّينَ عِنْدَ اللَّهِ الإِسْلَامُ is from Surat Al Imran 3:19.</div></div><div class=\"tfrow\"><div class=\"tfopt\"><span class=\"tfbub\">T</span><span class=\"tfbub\">F</span></div><div class=\"tftext\">5. The meaning of لَا إِلَهَ إِلَّا اللهُ is: there is no god that exists.</div></div></div><div class=\"sec-hd\"><h3>Part C — Fill in the Blank (Arabic)</h3><span class=\"pts\">12 pts</span></div><div class=\"wb\"><h4>Word Bank</h4><div class=\"words\"><span class=\"word\">لِعِبَادَتِهِ وَحْدَهُ</span><span class=\"word\">الْمَالِكُ الْمَعْبُودُ</span><span class=\"word\">الطَّاغُوتِ</span><span class=\"word\">دِينِيَ الإِسْلَامُ</span><span class=\"word\">لَا مَعْبُودَ حَقٌّ</span><span class=\"word\">مُخُّ الْعِبَادَةِ</span></div></div><table class=\"tbl\"><thead><tr><th>#</th><th>Sentence</th></tr></thead><tbody><tr><td class=\"wc\">1</td><td class=\"wc\">The true meaning of لَا إِلَهَ إِلَّا اللهُ is: ______ إِلَّا اللهُ</td></tr><tr><td class=\"wc\">2</td><td class=\"wc\">Q4 answer: لِأَيِّ شَيْءٍ خَلَقَكَ؟ → ______ لَا شَرِيكَ لَهُ</td></tr><tr><td class=\"wc\">3</td><td class=\"wc\">Q2 answer: وَمَا مَعْنَى الرَّبِّ؟ → ______</td></tr><tr><td class=\"wc\">4</td><td class=\"wc\">The hadith: الدُّعَاءُ ______ (du'a is the ______ of worship)</td></tr><tr><td class=\"wc\">5</td><td class=\"wc\">First obligation: الْكُفْرُ بِ ______ وَالإِيمَانُ بِاللهِ</td></tr><tr><td class=\"wc\">6</td><td class=\"wc\">Q5 answer: مَا دِينُكَ؟ → ______</td></tr></tbody></table><div class=\"not
