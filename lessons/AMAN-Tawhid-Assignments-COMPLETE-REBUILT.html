"mco\"><div class=\"bub\"></div><b>A.</b>&nbsp;مَا دِينُكَ؟</div><div class=\"mco\"><div class=\"bub\"></div><b>B.</b>&nbsp;مَنْ نَبِيُّكَ؟</div><div class=\"mco\"><div class=\"bub\"></div><b>C.</b>&nbsp;مَنْ رَبُّكَ؟</div><div class=\"mco\"><div class=\"bub\"></div><b>D.</b>&nbsp;لِأَيِّ شَيْءٍ خُلِقْتَ؟</div></div><div class=\"q\"><div class=\"qn\">Question 3</div><div class=\"qt\">The meaning of الرَّبُّ (Rabb) from the text is:</div></div><div class=\"mc\"><div class=\"mco\"><div class=\"bub\"></div><b>A.</b>&nbsp;The Most Merciful</div><div class=\"mco\"><div class=\"bub\"></div><b>B.</b>&nbsp;الْمَالِكُ الْمَعْبُودُ — The Owner and the One Worshipped</div><div class=\"mco\"><div class=\"bub\"></div><b>C.</b>&nbsp;The Creator only</div><div class=\"mco\"><div class=\"bub\"></div><b>D.</b>&nbsp;The First and the Last</div></div><div class=\"q\"><div class=\"qn\">Question 4</div><div class=\"qt\">The meaning of Allah (اللهُ) from the text is:</div></div><div class=\"mc\"><div class=\"mco\"><div class=\"bub\"></div><b>A.</b>&nbsp;The Most High</div><div class=\"mco\"><div class=\"bub\"></div><b>B.</b>&nbsp;The Creator of the heavens</div><div class=\"mco\"><div class=\"bub\"></div><b>C.</b>&nbsp;ذُو الأُلُوهِيَّةِ وَالْعُبُودِيَّةِ عَلَى خَلْقِهِ أَجْمَعِينَ</div><div class=\"mco\"><div class=\"bub\"></div><b>D.</b>&nbsp;The Sustainer of all worlds</div></div><div class=\"q\"><div class=\"qn\">Question 5</div><div class=\"qt\">From Allah's SIGNS (آيَاتِهِ) mentioned in the text — which of these is listed?</div></div><div class=\"mc\"><div class=\"mco\"><div class=\"bub\"></div><b>A.</b>&nbsp;Mountains and rivers</div><div class=\"mco\"><div class=\"bub\"></div><b>B.</b>&nbsp;اللَّيْلُ وَالنَّهَارُ وَالشَّمْسُ وَالْقَمَرُ</div><div class=\"mco\"><div class=\"bub\"></div><b>C.</b>&nbsp;The ocean and the stars</div><div class=\"mco\"><div class=\"bub\"></div><b>D.</b>&nbsp;Animals and plants</div></div><div class=\"q\"><div class=\"qn\">Question 6</div><div class=\"qt\">Surat Al-A'raf 7:54 is the proof for:</div></div><div class=\"mc\"><div class=\"mco\"><div class=\"bub\"></div><b>A.</b>&nbsp;The Five Pillars of Islam</div><div class=\"mco\"><div class=\"bub\"></div><b>B.</b>&nbsp;Allah being our Lord and Creator</div><div class=\"mco\"><div class=\"bub\"></div><b>C.</b>&nbsp;The six pillars of Iman</div><div class=\"mco\"><div class=\"bub\"></div><b>D.</b>&nbsp;The obligation of Hajj</div></div><div class=\"q\"><div class=\"qn\">Question 7</div><div class=\"qt\">The ayah وَمَا خَلَقْتُ الْجِنَّ وَالإِنسَ إِلَّا لِيَعْبُدُونِ is from:</div></div><div class=\"mc\"><div class=\"mco\"><div class=\"bub\"></div><b>A.</b>&nbsp;Surat Al-Baqarah</div><div class=\"mco\"><div class=\"bub\"></div><b>B.</b>&nbsp;Surat An-Nisa 4:36</div><div class=\"mco\"><div class=\"bub\"></div><b>C.</b>&nbsp;Surat Adh-Dhariyat 51:56</div><div class=\"mco\"><div class=\"bub\"></div><b>D.</b>&nbsp;Surat Al-Ma'idah</div></div><div class=\"q\"><div class=\"qn\">Question 8</div><div class=\"qt\">'Ibadah (worship) is described in the text as اسْمٌ جَامِعٌ. This means:</div></div><div class=\"mc\"><div class=\"mco\"><div class=\"bub\"></div><b>A.</b>&nbsp;A simple name for prayer</div><div class=\"mco\"><div class=\"bub\"></div><b>B.</b>&nbsp;A big category covering everything Allah loves — inward and outward</div><div class=\"mco\"><div class=\"bub\"></div><b>C.</b>&nbsp;A name used only for Arabic speakers</div><div class=\"mco\"><div class=\"bub\"></div><b>D.</b>&nbsp;A term that means only the Five Pillars</div></div><div class=\"q\"><div class=\"qn\">Question 9</div><div class=\"qt\">Shirk is described in the text as:</div></div><div class=\"mc\"><div class=\"mco\"><div class=\"bub\"></div><b>A.</b>&nbsp;A small sin easily forgiven</div><div class=\"mco\"><div class=\"bub\"></div><b>B.</b>&nbsp;أَعْظَمُ ذَنْبٍ عُصِيَ اللهُ بِهِ — the GREATEST sin against Allah</div><div class=\"mco\"><div class=\"bub\"></div><b>C.</b>&nbsp;A cultural practice to be avoided</div><div class=\"mco\"><div class=\"bub\"></div><b>D.</b>&nbsp;Only done by non-Muslims</div></div><div class=\"q\"><div class=\"qn\">Question 10</div><div class=\"qt\">The Prophet ﷺ said: الدُّعَاءُ مُخُّ الْعِبَادَةِ. مُخٌّ means:</div></div><div class=\"mc\"><div class=\"mco\"><div class=\"bub\"></div><b>A.</b>&nbsp;The least important part</div><div class=\"mco\"><div class=\"bub\"></div><b>B.</b>&nbsp;The outer shell</div><div class=\"mco\"><div class=\"bub\"></div><b>C.</b>&nbsp;The heart and soul — the innermost, most essential part</div><div class=\"mco\"><div class=\"bub\"></div><b>D.</b>&nbsp;A type of worship done at night</div></div><div class=\"sec-hd\"><h3>Part B — Fill in the Blank (No Word Bank!)</h3><span class=\"pts\">15 pts</span></div><div class=\"q\"><div class=\"qn\">Question 1</div><div class=\"qt\">The answer to مَنْ رَبُّكَ؟ is: ______ (in Arabic)</div></div><div class=\"q\"><div class=\"qn\">Question 2</div><div class=\"qt\">The answer to بِمَ تَعْرِفُ رَبَّكَ؟ is: أَعْرِفُهُ ______ (complete in Arabic)</div></div><div class=\"q\"><div class=\"qn\">Question 3</div><div class=\"qt\">The text says: وَالشِّرْكُ ______ ذَنْبٍ عُصِيَ اللهُ بِهِ (the greatest sin)</div></div><div class=\"q\"><div class=\"qn\">Question 4</div><div class=\"qt\">Allah says in Surat Al-Ma'idah 5:72: مَن يُشْرِكْ بِاللَّهِ فَقَدْ حَرَّمَ اللهُ عَلَيْهِ ______ (forbidden)</div></div><div class=\"q\"><div class=\"qn\">Question 5</div><div class=\"qt\">The five forms of Shirk mentioned in the text: يَدْعُوهُ، أَوْ ______، أَوْ ______، أَوْ ______، أَوْ ______ (fill all four)</div></div><div class=\"sec-hd\"><h3>Part C — Short Answer</h3><span class=\"pts\">15 pts</span></div><div class=\"q\"><div class=\"qn\">Question 1</div><div class=\"qt\">What does 'Ibadah (worship) mean? Write the definition AND list the three types of worship.</div></div><div class=\"als\"><div class=\"aline\"></div><div class=\"aline\"></div></div><div class=\"q\"><div class=\"qn\">Question 2</div><div class=\"qt\">Write the Arabic answer to Q3. What are Allah's Signs? What is His Creation? List each one.</div></div><div class=\"als\"><div class=\"aline\"></div><div class=\"aline\"></div></div><div class=\"q\"><div class=\"qn\">Question 3</div><div class=\"qt\">Why is Shirk the biggest sin? Give TWO reasons from what we learned + write ONE ayah with its Surah name and verse number.</div></div><div class=\"als\"><div class=\"aline\"></div><div class=\"aline\"></div></div><div class=\"sc-box\"><div><div class=\"sc-lbl\">Score</div><input type=\"number\" class=\"sc-input\" min=\"0\" max=\"50\" placeholder=\"0\" aria-label=\"Enter earned score out of 50\" oninput=\"var p=this.value; var out=this.parentElement.querySelector('.sc-pct'); var g=this.closest('.sc-box').querySelector('.sc-grade'); if(p===''){out.textContent='';g.textContent='';return;} var pct=Math.round((p/50)*1000)/10; out.textContent=pct+'%'; g.textContent = pct>=90?'A':pct>=80?'B':pct>=70?'C':pct>=60?'D':'F';\"><div class=\"sc-pct\"></div></div><div><div class=\"sc-lbl\">Out of</div><div class=\"sc-val\">50</div></div><div><div class=\"sc-lbl\">Grade</div><div class=\"sc-val sc-grade\"></div></div><div><div class=\"sc-lbl\">Comments</div><div class=\"sc-val\" style=\"min-width:140px;\"></div></div></div>", "lesson": 3}, {"id": "QZ2", "cat": "quiz", "title": "Tawhid Quiz 2 — Sessions 4-6", "badge": "Quiz 2 · 50 pts · 30 min · Closed Book", "points": 50, "html": "<div class=\"sh-hdr\"><div class=\"sh-top\"><div class=\"sh-title\">Tawhid Quiz 2 — Sessions 4-6</div><div class=\"sh-badge\">Quiz 2 · 50 pts · 30 min · Closed Book</div></div><div class=\"sh-meta\"><div class=\"mf\"><div class=\"ml\">Student Name</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Date</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Level / Class</div><div class=\"mv\"></div></div></div></div><div class=\"note\"><b>Note:</b> Rules: Closed book. No talking. توكلت على الله — do your best!</div><div class=\"sec-hd\"><h3>Part A — True or False with Correction</h3><span class=\"pts\">15 pts</span></div><div class=\"tf\"><div class=\"tfrow\"><div class=\"tfopt\"><span class=\"tfbub\">T</span><span class=\"tfbub\">F</span></div><div class=\"tftext\">1. The first thing Allah required from His servants was belief in the Five Pillars.</div></div><div class=\"tfrow\"><div class=\"tfopt\"><span class=\"tfbub\">T</span><span class=\"tfbub\">F</span></div><div class=\"tftext\">2. وَلَقَدْ بَعَثْنَا فِي كُلِّ أُمَّةٍ رَسُولًا أَنِ اعْبُدُوا اللَّهَ وَاجْتَنِبُوا الطَّاغُوتَ is from Surat An-Nahl 16:36.</div></div><div class=\"tfrow\"><div class=\"tfopt\"><span class=\"tfbub\">T</span><span class=\"tfbub\">F</span></div><div class=\"tftext\">3. The meaning of لَا إِلَهَ إِلَّا اللهُ is: there is no God in existence.</div></div><div class=\"tfrow\"><div class=\"tfopt\"><span class=\"tfbub\">T</span><span class=\"tfbub\">F</span></div><div class=\"tftext\">4. The Five Prayers were made required through the angel Jibril ﷺ in the normal way.</div></div><div class=\"tfrow\"><div class=\"tfopt\"><span class=\"tfbub\">T</span><span class=\"tfbub\">F</span></div><div class=\"tftext\">5. خَيْرُ الْقُرُونِ قَرْنِي — the best of generations is the generation of the Sahabah (Companions).</div></div></div><div class=\"sec-hd\"><h3>Part B — Multiple Choice</h3><span class=\"pts\">20 pts</span></div><div class=\"q\"><div class=\"qn\">Question 1</div><div class=\"qt\">The definition of the Taghut from the text is:</div></div><div class=\"mc\"><div class=\"mco\"><div class=\"bub\"></div><b>A.</b>&nbsp;A type of prayer for non-Muslims</div><div class=\"mco\"><div class=\"bub\"></div><b>B.</b>&nbsp;مَا عُبِدَ مِنْ دُونِ اللهِ — whatever is worshipped besides Allah</div><div class=\"mco\"><div class=\"bub\"></div><b>C.</b>&nbsp;The name of a mountain in Arabia</div><div class=\"mco\"><div class=\"bub\"></div><b>D.</b>&nbsp;The opposite of Tawarruk in prayer</div></div><div class=\"q\"><div class=\"qn\">Question 2</div><div class=\"qt\">Ibn al-Qayyim defined Taghut as:</div></div><div class=\"mc\"><div class=\"mco\"><div class=\"bub\"></div><b>A.</b>&nbsp;Anything that makes people forget Allah</div><div class=\"mco\"><div class=\"bub\"></div><b>B.</b>&nbsp;مَا تَجَاوَزَ بِهِ الْعَبْدُ حَدَّهُ مِنْ مَعْبُودٍ أَوْ مَتْبُوعٍ أَوْ مُطَاعٍ</div><div class=\"mco\"><div class=\"bub\"></div><b>C.</b>&nbsp;A category of innovation in the religion</div><div class=\"mco\"><div class=\"bub\"></div><b>D.</b>&nbsp;The name for political leaders who reject Islam</div></div><div class=\"q\"><div class=\"qn\">Question 3</div><div class=\"qt\">The true meaning of لَا إِلَهَ إِلَّا اللهُ is:</div></div><div class=\"mc\"><div class=\"mco\"><div class=\"bub\"></div><b>A.</b>&nbsp;There is no god in the universe</div><div class=\"mco\"><div class=\"bub\"></div><b>B.</b>&nbsp;لَا مَعْبُودَ حَقٌّ إِلَّا اللهُ — no TRULY WORTHY deity except Allah</div><div class=\"mco\"><div class=\"bub\"></div><b>C.</b>&nbsp;Allah is the greatest of all gods</div><div class=\"mco\"><div class=\"bub\"></div><b>D.</b>&nbsp;Allah alone created the universe</div></div><div class=\"q\"><div class=\"qn\">Question 4</div><div class=\"qt\">In Az-Zukhruf 43:26, Ibrahim ﷺ declares:</div></div><div class=\"mc\"><div class=\"mco\"><div class=\"bub\"></div><b>A.</b>&nbsp;إِنَّنِي بَرَاءٌ مِّمَّا تَعْبُدُونَ — I am free from what you worship</div><div class=\"mco\"><div class=\"bub\"></div><b>B.</b>&nbsp;I accept all religions as true</div><div class=\"mco\"><div class=\"bub\"></div><b>C.</b>&nbsp;There is no prophet after me</div><div class=\"mco\"><div class=\"bub\"></div><b>D.</b>&nbsp;Worship the Lord of the heavens and earth</div></div><div class=\"q\"><div class=\"qn\">Question 5</div><div class=\"qt\">The first Messenger (Rasul) sent to humanity was:</div></div><div class=\"mc\"><div class=\"mco\"><div class=\"bub\"></div><b>A.</b>&nbsp;Adam ﷺ</div><div class=\"mco\"><div class=\"bub\"></div><b>B.</b>&nbsp;Ibrahim ﷺ</div><div class=\"mco\"><div class=\"bub\"></div><b>C.</b>&nbsp;Nuh ﷺ</div><div class=\"mco\"><div class=\"bub\"></div><b>D.</b>&nbsp;Musa ﷺ</div></div><div class=\"q\"><div class=\"qn\">Question 6</div><div class=\"qt\">Muhammad ﷺ is described in Al-Ahzab 33:40 as:</div></div><div class=\"mc\"><div class=\"mco\"><div class=\"bub\"></div><b>A.</b>&nbsp;The first of the Prophets</div><div class=\"mco\"><div class=\"bub\"></div><b>B.</b>&nbsp;خَاتَمَ النَّبِيِّينَ — the Seal of the Prophets</div><div class=\"mco\"><div class=\"bub\"></div><b>C.</b>&nbsp;The father of all believers</div><div class=\"mco\"><div class=\"bub\"></div><b>D.</b>&nbsp;The greatest king ever to live</div></div><div class=\"q\"><div class=\"qn\">Question 7</div><div class=\"qt\">Allah sent the Prophet ﷺ to:</div></div><div class=\"mc\"><div class=\"mco\"><div class=\"bub\"></div><b>A.</b>&nbsp;Only the Arabs of Makkah</div><div class=\"mco\"><div class=\"bub\"></div><b>B.</b>&nbsp;Only the children of Isma'il</div><div class=\"mco\"><div class=\"bub\"></div><b>C.</b>&nbsp;الأَحْمَرَ وَالأَسْوَدَ — the red and the black — ALL of humanity</div><div class=\"mco\"><div class=\"bub\"></div><b>D.</b>&nbsp;Only the people of Madinah</div></div><div class=\"q\"><div class=\"qn\">Question 8</div><div class=\"qt\">The Prophet ﷺ spent approximately how many years in Makkah calling ONLY to Tawhid before other obligations were revealed?</div></div><div class=\"mc\"><div class=\"mco\"><div class=\"bub\"></div><b>A.</b>&nbsp;3 years</div><div class=\"mco\"><div class=\"bub\"></div><b>B.</b>&nbsp;7 years</div><div class=\"mco\"><div class=\"bub\"></div><b>C.</b>&nbsp;10 years — نَحْوًا مِنْ عَشْرِ سِنِينَ</div><div class=\"mco\"><div class=\"bub\"></div><b>D.</b>&nbsp;23 years</div></div><div class=\"q\"><div class=\"qn\">Question 9</div><div class=\"qt\">Allah says in Taha 20:55: مِنْهَا خَلَقْنَاكُمْ وَفِيهَا نُعِيدُكُمْ وَمِنْهَا نُخْرِجُكُمْ تَارَةً أُخْرَى. This proves:</div></div><div class=\"mc\"><div class=\"mco\"><div class=\"bub\"></div><b>A.</b>&nbsp;Allah created us from clay</div><div class=\"mco\"><div class=\"bub\"></div><b>B.</b>&nbsp;We will be resurrected — Resurrection is real</div><div class=\"mco\"><div class=\"bub\"></div><b>C.</b>&nbsp;The earth is special among all planets</div><div class=\"mco\"><div class=\"bub\"></div><b>D.</b>&nbsp;We must be buried near Makkah</div></div><div class=\"q\"><div class=\"qn\">Question 10</div><div class=\"qt\">The phrase الْجَنَّةُ وَالنَّارُ حَقٌّ means:</div></div><div class=\"mc\"><div class=\"mco\"><div class=\"bub\"></div><b>A.</b>&nbsp;Paradise and the Fire are metaphors</div><div class=\"mco\"><div class=\"bub\"></div><b>B.</b>&nbsp;Only special Muslims will see Paradise</div><div class=\"mco\"><div class=\"bub\"></div><b>C.</b>&nbsp;Paradise and the Fire are REAL — they exist and are permanent</div><div class=\"mco\"><div class=\"bub\"></div><b>D.</b>&nbsp;We cannot know about the afterlife</div></div><div class=\"sec-hd\"><h3>Part C — Short Answer</h3><span class=\"pts\">15 pts</span></div><div class=\"q\"><div class=\"qn\">Question 1</div><div class=\"qt\">Write the FULL Arabic answer to: مَنْ نَبِيُّكَ؟ — including the complete lineage as given in the text. Then explain: why is the lineage important?</div></div><div class=\"als\"><div class=\"aline\"></div><div class=\"aline\"></div></div><div class=\"q\"><div class=\"qn\">Question 2</div><div class=\"qt\">What was the Prophet's ﷺ three-part mission? Give each part in Arabic and explain each one in English.</div></div><div class=\"als\"><div class=\"aline\"></div><div class=\"aline\"></div></div><div class=\"q\"><div class=\"qn\">Question 3</div><div class=\"qt\">List all SIX Pillars of Iman in Arabic (the exact Arabic text from the book) and give the English for each.</div></div><div class=\"als\"><div class=\"aline\"></div><div class=\"aline\"></div></div><div class=\"sc-box\"><div><div class=\"sc-lbl\">Score</div><input type=\"number\" class=\"sc-input\" min=\"0\" max=\"50\" placeholder=\"0\" aria-label=\"Enter earned score out of 50\" oninput=\"var p=this.value; var out=this.parentElement.querySelector('.sc-pct'); var g=this.closest('.sc-box').querySelector('.sc-grade'); if(p===''){out.textContent='';g.textContent='';return;} var pct=Math.round((p/50)*1000)/10; out.textContent=pct+'%'; g.textContent = pct>=90?'A':pct>=80?'B':pct>=70?'C':pct>=60?'D':'F';\"><div class=\"sc-pct\"></div></div><div><div class=\"sc-lbl\">Out of</div><div class=\"sc-val\">50</div></div><div><div class=\"sc-lbl\">Grade</div><div class=\"sc-val sc-grade\"></div></div><div><div class=\"sc-lbl\">Comments</div><div class=\"sc-val\" style=\"min-width:140px;\"></div></div></div>", "lesson": 6}, {"id": "MIDTEST", "cat": "test", "title": "Tawhid Mid-Unit Test", "badge": "Mid-Unit Test · Sessions 1-4 · 100 pts", "points": 100, "html": "<div class=\"sh-hdr\"><div class=\"sh-top\"><div class=\"sh-title\">Tawhid Mid-Unit Test</div><div class=\"sh-badge\">Sessions 1-4 · Slides 1-11 · 45 Minutes · 100 pts</div></div><div class=\"sh-meta\"><div class=\"mf\"><div class=\"ml\">Student Name</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Date</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Level / Class</div><div class=\"mv\"></div></div></div></div><div class=\"note\"><b>Note:</b> Instructions: Closed book. No talking. Work quietly. بسم الله توكلت على الله — Begin with Allah's name. May He bless your effort!</div><div class=\"sec-hd\"><h3>Part A — True or False</h3><span class=\"pts\">10 pts</span></div><div class=\"tf\"><div class=\"tfrow\"><div class=\"tfopt\"><span class=\"tfbub\">T</span><span class=\"tfbub\">F</span></div><div class=\"tftext\">1. Tawhid must be taught BEFORE the Qur'an.</div></div><div class=\"tfrow\"><div class=\"tfopt\"><span class=\"tfbub\">T</span><span class=\"tfbub\">F</span></div><div class=\"tftext\">2. The meaning of Rabb is: الْخَالِقُ الرَّازِقُ (The Creator, The Provider).</div></div><div class=\"tfrow\"><div class=\"tfopt\"><span class=\"tfbub\">T</span><span class=\"tfbub\">F</span></div><div class=\"tftext\">3. From Allah's signs: الشَّمْسُ وَالْقَمَرُ (the sun and moon).</div></div><div class=\"tfrow\"><div class=\"tfopt\"><span class=\"tfbub\">T</span><span class=\"tfbub\">F</span></div><div class=\"tftext\">4. Allah says we were created for wealth and happiness.</div></div><div class=\"tfrow\"><div class=\"tfopt\"><span class=\"tfbub\">T</span><span class=\"tfbub\">F</span></div><div class=\"tftext\">5. 'Ibadah includes ONLY outward acts like prayer and fasting.</div></div><div class=\"tfrow\"><div class=\"tfopt\"><span class=\"tfbub\">T</span><span class=\"tfbub\">F</span></div><div class=\"tftext\">6. Shirk is the GREATEST sin against Allah.</div></div><div class=\"tfrow\"><div class=\"tfopt\"><span class=\"tfbub\">T</span><span class=\"tfbub\">F</span></div><div class=\"tftext\">7. Du'a directed to other than Allah is a minor mistake.</div></div><div class=\"tfrow\"><div class=\"tfopt\"><span class=\"tfbub\">T</span><span class=\"tfbub\">F</span></div><div class=\"tftext\">8. Islam means: الاسْتِسْلَامُ وَالانْقِيَادُ وَالْمُوَالاةُ وَالْمُعَادَاةُ.</div></div><div class=\"tfrow\"><div class=\"tfopt\"><span class=\"tfbub\">T</span><span class=\"tfbub\">F</span></div><div class=\"tftext\">9. The proof for Hajj is from Surat Al-Baqarah 2:183.</div></div><div class=\"tfrow\"><div class=\"tfopt\"><span class=\"tfbub\">T</span><span class=\"tfbub\">F</span></div><div class=\"tftext\">10. لَا إِلَهَ إِلَّا اللهُ means: there is no god that exists.</div></div></div><div class=\"sec-hd\"><h3>Part B — Multiple Choice</h3><span class=\"pts\">20 pts</span></div><div class=\"q\"><div class=\"qn\">Question 1</div><div class=\"qt\">The author says the goal is to produce: مُسْلِمًا كَامِلًا عَلَى فِطْرَةِ الإِسْلَامِ وَمُوَحِّدًا ______</div></div><div class=\"mc\"><div class=\"mco\"><div class=\"bub\"></div><b>A.</b>&nbsp;كَبِيرًا (great)</div><div class=\"mco\"><div class=\"bub\"></div><b>B.</b>&nbsp;جَيِّدًا (good/genuine)</div><div class=\"mco\"><div class=\"bub\"></div><b>C.</b>&nbsp;صَغِيرًا (small)</div><div class=\"mco\"><div class=\"bub\"></div><b>D.</b>&nbsp;عَالِمًا (a scholar)</div></div><div class=\"q\"><div class=\"qn\">Question 2</div><div class=\"qt\">How do we recognize Allah? The text answer (Q3) is:</div></div><div class=\"mc\"><div class=\"mco\"><div class=\"bub\"></div><b>A.</b>&nbsp;By reading the Qur'an daily</div><div class=\"mco\"><div class=\"bub\"></div><b>B.</b>&nbsp;أَعْرِفُهُ بِآيَاتِهِ وَمَخْلُوقَاتِهِ</div><div class=\"mco\"><div class=\"bub\"></div><b>C.</b>&nbsp;By making Hajj to the Ka'bah</div><div class=\"mco\"><div class=\"bub\"></div><b>D.</b>&nbsp;By studying Arabic language</div></div><div class=\"q\"><div class=\"qn\">Question 3</div><div class=\"qt\">The Qur'anic proof for Allah being our Lord (from text) is:</div></div><div class=\"mc\"><div class=\"mco\"><div class=\"bub\"></div><b>A.</b>&nbsp;Al-Baqarah 2:183</div><div class=\"mco\"><div class=\"bub\"></div><b>B.</b>&nbsp;Al-Dhariyat 51:56</div><div class=\"mco\"><div class=\"bub\"></div><b>C.</b>&nbsp;Al-A'raf 7:54 — إِنَّ رَبَّكُمُ اللَّهُ الَّذِي خَلَقَ...</div><div class=\"mco\"><div class=\"bub\"></div><b>D.</b>&nbsp;Al-Ma'idah 5:72</div></div><div class=\"q\"><div class=\"qn\">Question 4</div><div class=\"qt\">'Ibadah is defined in the text as اسْمٌ جَامِعٌ for:</div></div><div class=\"mc\"><div class=\"mco\"><div class=\"bub\"></div><b>A.</b>&nbsp;Everything done in the masjid</div><div class=\"mco\"><div class=\"bub\"></div><b>B.</b>&nbsp;The five pillars only</div><div class=\"mco\"><div class=\"bub\"></div><b>C.</b>&nbsp;كُلِّ مَا يُحِبُّهُ اللهُ وَيَرْضَاهُ مِنَ الأَقْوَالِ وَالأَعْمَالِ الْبَاطِنَةِ وَالظَّاهِرَةِ</div><div class=\"mco\"><div class=\"bub\"></div><b>D.</b>&nbsp;Friday prayer and Ramadan fasting</div></div><div class=\"q\"><div class=\"qn\">Question 5</div><div class=\"qt\">The text defines Shirk as: أَنْ يَجْعَلَ لِلَّهِ:</div></div><div class=\"mc\"><div class=\"mco\"><div class=\"bub\"></div><b>A.</b>&nbsp;نَبِيًّا (a prophet)</div><div class=\"mco\"><div class=\"bub\"></div><b>B.</b>&nbsp;كِتَابًا (a book)</div><div class=\"mco\"><div class=\"bub\"></div><b>C.</b>&nbsp;نِدًّا (a rival/equal)</div><div class=\"mco\"><div class=\"bub\"></div><b>D.</b>&nbsp;عِبَادَةً (a worship)</div></div><div class=\"q\"><div class=\"qn\">Question 6</div><div class=\"qt\">Allah says in Surat Al-Ma'idah 5:72 that whoever commits Shirk:</div></div><div class=\"mc\"><div class=\"mco\"><div class=\"bub\"></div><b>A.</b>&nbsp;Must perform 100 days of fasting</div><div class=\"mco\"><div class=\"bub\"></div><b>B.</b>&nbsp;حَرَّمَ اللهُ عَلَيْهِ الْجَنَّةَ وَمَأْوَاهُ النَّارُ</div><div class=\"mco\"><div class=\"bub\"></div><b>C.</b>&nbsp;Is forgiven after sincere repentance alone</div><div class=\"mco\"><div class=\"bub\"></div><b>D.</b>&nbsp;Must repeat the Shahadah three times</div></div><div class=\"q\"><div class=\"qn\">Question 7</div><div class=\"qt\">The hadith says الدُّعَاءُ مُخُّ الْعِبَادَةِ. What does مُخٌّ mean?</div></div><div class=\"mc\"><div class=\"mco\"><div class=\"bub\"></div><b>A.</b>&nbsp;The top — the most visible part</div><div class=\"mco\"><div class=\"bub\"></div><b>B.</b>&nbsp;The heart and soul — the deepest, most essential part</div><div class=\"mco\"><div class=\"bub\"></div><b>C.</b>&nbsp;The outer layer</div><div class=\"mco\"><div class=\"bub\"></div><b>D.</b>&nbsp;A special type of worship on Fridays</div></div><div class=\"q\"><div class=\"qn\">Question 8</div><div class=\"qt\">The Dalil for calling upon other than Allah being Kufr is from:</div></div><div class=\"mc\"><div class=\"mco\"><div class=\"bub\"></div><b>A.</b>&nbsp;Al-Fatihah 1:5</div><div class=\"mco\"><div class=\"bub\"></div><b>B.</b>&nbsp;Al-A'raf 7:54</div><div class=\"mco\"><div class=\"bub\"></div><b>C.</b>&nbsp;Al-Mu'minun 23:117 — وَمَن يَدْعُ مَعَ اللَّهِ إِلَهًا آخَرَ...</div><div class=\"mco\"><div class=\"bub\"></div><b>D.</b>&nbsp;Al-Bayyinah 98:5</div></div><div class=\"q\"><div class=\"qn\">Question 9</div><div class=\"qt\">The first OBLIGATION upon Allah's servants from the text is:</div></div><div class=\"mc\"><div class=\"mco\"><div class=\"bub\"></div><b>A.</b>&nbsp;الصَّلَاةُ وَالزَّكَاةُ (prayer and charity)</div><div class=\"mco\"><div class=\"bub\"></div><b>B.</b>&nbsp;الْكُفْرُ بِالطَّاغُوتِ وَالإِيمَانُ بِاللَّهِ</div><div class=\"mco\"><div class=\"bub\"></div><b>C.</b>&nbsp;الشَّهَادَةُ وَالْحَجُّ</div><div class=\"mco\"><div class=\"bub\"></div><b>D.</b>&nbsp;تَعَلُّمُ الْقُرْآنِ (learning the Qur'an)</div></div><div class=\"q\"><div class=\"qn\">Question 10</div><div class=\"qt\">The correct meaning of لَا إِلَهَ إِلَّا اللهُ is:</div></div><div class=\"mc\"><div class=\"mco\"><div class=\"bub\"></div><b>A.</b>&nbsp;Allah is the creator of all things</div><div class=\"mco\"><div class=\"bub\"></div><b>B.</b>&nbsp;There is no physical god in the universe</div><div class=\"mco\"><div class=\"bub\"></div><b>C.</b>&nbsp;لَا مَعْبُودَ حَقٌّ إِلَّا اللهُ — no TRULY WORTHY deity except Allah</div><div class=\"mco\"><div class=\"bub\"></div><b>D.</b>&nbsp;No one can worship except with Allah's permission</div></div><div class=\"sec-hd\"><h3>Part C — Arabic Matching</h3><span class=\"pts\">15 pts</span></div><div class=\"match-grid\"><div class=\"match-col\"><h4>Column A</h4><div class=\"mi\"><div class=\"mn\">1</div>مُخُّ الْعِبَادَةِ</div><div class=\"mi\"><div class=\"mn\">2</div>النِّدُّ</div><div class=\"mi\"><div class=\"mn\">3</div>الْكُفْرُ بِالطَّاغُوتِ وَالإِيمَانُ بِاللَّهِ</div><div class=\"mi\"><div class=\"mn\">4</div>الِاسْتِسْلَامُ لِلَّهِ بِالتَّوْحِيدِ</div><div class=\"mi\"><div class=\"mn\">5</div>آيَاتُ اللهِ</div><div class=\"mi\"><div class=\"mn\">6</div>الْعِبَادَةُ — اسْمٌ جَامِعٌ</div><div class=\"mi\"><div class=\"mn\">7</div>الطَّاغُوتُ</div><div class=\"mi\"><div class=\"mn\">8</div>أَعْمَالُ الْكُفْرِ</div><div class=\"mi\"><div class=\"mn\">9</div>مَخْلُوقَاتُ اللهِ</div><div class=\"mi\"><div class=\"mn\">10</div>مَعْنَى الإِسْلَامِ</div></div><div class=\"match-col\"><h4>Column B</h4><div class=\"mi\"><div class=\"mlt\">A</div>The way of Islam — surrendering and submitting<div class=\"mblk\"></div></div><div class=\"mi\"><div class=\"mlt\">B</div>A rival given to Allah in worship<div class=\"mblk\"></div></div><div class=\"mi\"><div class=\"mlt\">C</div>The first obligation upon Muslims<div class=\"mblk\"></div></div><div class=\"mi\"><div class=\"mlt\">D</div>Surrender to Allah with Tawhid<div class=\"mblk\"></div></div><div class=\"mi\"><div class=\"mlt\">E</div>Signs of Allah (night, day, sun, moon)<div class=\"mblk\"></div></div><div class=\"mi\"><div class=\"mlt\">F</div>Everything Allah loves — comprehensive worship<div class=\"mblk\"></div></div><div class=\"mi\"><div class=\"mlt\">G</div>False god worshipped besides Allah<div class=\"mblk\"></div></div><div class=\"mi\"><div class=\"mlt\">H</div>Disbelief in Allah — its deeds<div class=\"mblk\"></div></div><div class=\"mi\"><div class=\"mlt\">I</div>Heavens, earth, everything within them<div class=\"mblk\"></div></div><div class=\"mi\"><div class=\"mlt\">J</div>The heart and soul / essence of worship<div class=\"mblk\"></div></div></div></div><div class=\"sec-hd\"><h3>Part D — Short Answer</h3><span class=\"pts\">30 pts</span></div><div class=\"q\"><div class=\"qn\">Question 1</div><div class=\"qt\">Write the COMPLETE answer to سُؤَالٌ ٤ (Q4: Why were you created?) in Arabic, then explain it fully in English:</div></div><div class=\"als\"><div class=\"aline\"></div><div class=\"aline\"></div></div><div class=\"q\"><div class=\"qn\">Question 2</div><div class=\"qt\">Define 'Ibadah (worship) completely. What are the THREE categories? Give TWO examples of each category.</div></div><div class=\"als\"><div class=\"aline\"></div><div class=\"aline\"></div></div><div class=\"q\"><div class=\"qn\">Question 3</div><div class=\"qt\">What is Shirk? Write the Arabic definition from the text (all five forms). Why does Shirk wipe out all good deeds?</div></div><div class=\"als\"><div class=\"aline\"></div><div class=\"aline\"></div></div><div class=\"q\"><div class=\"qn\">Question 4</div><div class=\"qt\">What does Islam mean? Give the four-part definition in Arabic AND English. Which part surprises you most and why?</div></div><div class=\"als\"><div class=\"aline\"></div><div class=\"aline\"></div></div><div class=\"q\"><div class=\"qn\">Question 5</div><div class=\"qt\">Write ONE ayah that proves each of these — include the Surah name and verse number: (a) We were made to worship Allah (b) Du'a must go to Allah only (c) Allah only accepts Islam</div></div><div class=\"als\"><div class=\"aline\"></div><div class=\"aline\"></div></div><div class=\"sec-hd\"><h3>Part E — Essay</h3><span class=\"pts\">25 pts</span></div><div class=\"q\"><div class=\"qn\">Question 1</div><div class=\"qt\">In this unit we learned that Tawhid is the foundation of everything in Islam — more important than any other act of worship. EXPLAIN: (1) What is Tawhid and why does it come before everything else? (2) What is Shirk and why is it the most dangerous sin? (3) What is 'Ibadah and how does it connect to Tawhid? (4) How can YOU practice Tawhid in your daily life as a student? Be specific!</div></div><div class=\"als\"><div class=\"aline\"></div><div class=\"aline\"></div><div class=\"aline\"></div><div class=\"aline\"></div><div class=\"aline\"></div><div class=\"aline\"></div></div><table class=\"tbl\"><thead><tr><th>Part</th><th>Section</th><th>Max</th></tr></thead><tbody><tr><td class=\"wc\">A</td><td class=\"wc\">True or False</td><td class=\"wc\">10</td></tr><tr><td class=\"wc\">B</td><td class=\"wc\">Multiple Choice</td><td class=\"wc\">20</td></tr><tr><td class=\"wc\">C</td><td class=\"wc\">Arabic Matching</td><td class=\"wc\">15</td></tr><tr><td class=\"wc\">D</td><td class=\"wc\">Short Answer</td><td class=\"wc\">30</td></tr><tr><td class=\"wc\">E</td><td class=\"wc\">Essay</td><td class=\"wc\">25</td></tr><tr><td class=\"wc\">TOTAL</td><td class=\"wc\"></td><td class=\"wc\">100</td></tr></tbody></table>", "lesson": 0}, {"id": "FINALTEST", "cat": "test", "title": "Tawhid Final Unit Test", "badge": "Final Test · Complete Unit · 100 pts", "points": 100, "html": "<div class=\"sh-hdr\"><div class=\"sh-top\"><div class=\"sh-title\">Tawhid Final Unit Test</div><div class=\"sh-badge\">Complete Unit · All Sessions · 60 Minutes · Closed Book · 100 pts</div></div><div class=\"sh-meta\"><div class=\"mf\"><div class=\"ml\">Student Name</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Date</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Level / Class</div><div class=\"mv\"></div></div></div></div><div class=\"note\"><b>Note:</b> بسم الله الرحمن الرحيم — In the name of Allah. This is your final test. Show everything you know. اللهم يسّر وأعن.</div><div class=\"sec-hd\"><h3>Part A — True or False (Comprehensive)</h3><span class=\"pts\">10 pts</span></div><div class=\"tf\"><div class=\"tfrow\"><div class=\"tfopt\"><span class=\"tfbub\">T</span><span class=\"tfbub\">F</span></div><div class=\"tftext\">1. A good Muwahhid (مُوَحِّدٌ جَيِّدٌ) is someone who only SAYS the Shahadah.</div></div><div class=\"tfrow\"><div class=\"tfopt\"><span class=\"tfbub\">T</span><span class=\"tfbub\">F</span></div><div class=\"tftext\">2. وَمَعْنَى اللهِ: ذُو الأُلُوهِيَّةِ وَالْعُبُودِيَّةِ عَلَى خَلْقِهِ أَجْمَعِينَ.</div></div><div class=\"tfrow\"><div class=\"tfopt\"><span class=\"tfbub\">T</span><span class=\"tfbub\">F</span></div><div class=\"tftext\">3. Allah created us only for earning a good life in this world.</div></div><div class=\"tfrow\"><div class=\"tfopt\"><span class=\"tfbub\">T</span><span class=\"tfbub\">F</span></div><div class=\"tftext\">4. Heart actions of worship include things like: love for Allah, fear of Allah, and trusting Allah.</div></div><div class=\"tfrow\"><div class=\"tfopt\"><span class=\"tfbub\">T</span><span class=\"tfbub\">F</span></div><div class=\"tftext\">5. Shirk wipes out ALL your good deeds — as proven by Az-Zumar 39:65.</div></div><div class=\"tfrow\"><div class=\"tfopt\"><span class=\"tfbub\">T</span><span class=\"tfbub\">F</span></div><div class=\"tftext\">6. The first Messenger sent to humanity was Ibrahim ﷺ.</div></div><div class=\"tfrow\"><div class=\"tfopt\"><span class=\"tfbub\">T</span><span class=\"tfbub\">F</span></div><div class=\"tftext\">7. The Five Prayers were required DIRECTLY between Allah and the Prophet ﷺ.</div></div><div class=\"tfrow\"><div class=\"tfopt\"><span class=\"tfbub\">T</span><span class=\"tfbub\">F</span></div><div class=\"tftext\">8. خَاتَمَ النَّبِيِّينَ means Muhammad ﷺ was the first prophet.</div></div><div class=\"tfrow\"><div class=\"tfopt\"><span class=\"tfbub\">T</span><span class=\"tfbub\">F</span></div><div class=\"tftext\">9. وَعِيسَى ﷺ يَنزِلُ مِنَ السَّمَاءِ وَيَقْتُلُ الدَّجَّالَ — this will happen before the Last Day.</div></div><div class=\"tfrow\"><div class=\"tfopt\"><span class=\"tfbub\">T</span><span class=\"tfbub\">F</span></div><div class=\"tftext\">10. Denying the Resurrection (الْبَعْث) is a minor error in faith.</div></div></div><div class=\"sec-hd\"><h3>Part B — Multiple Choice (Full Unit)</h3><span class=\"pts\">25 pts</span></div><div class=\"q\"><div class=\"qn\">Question 1</div><div class=\"qt\">The book's opening purpose statement (Page 8) says teaching Tawhid before Qur'an produces:</div></div><div class=\"mc\"><div class=\"mco\"><div class=\"bub\"></div><b>A.</b>&nbsp;Better memorizers of hadith</div><div class=\"mco\"><div class=\"bub\"></div><b>B.</b>&nbsp;مُسْلِمًا كَامِلًا عَلَى فِطْرَةِ الإِسْلَامِ وَمُوَحِّدًا جَيِّدًا عَلَى طَرِيقَةِ الإِيمَانِ</div><div class=\"mco\"><div class=\"bub\"></div><b>C.</b>&nbsp;More obedient children at home</div><div class=\"mco\"><div class=\"bub\"></div><b>D.</b>&nbsp;Students ready for Hifz program</div></div><div class=\"q\"><div class=\"qn\">Question 2</div><div class=\"qt\">The answer to Q3 (How do you recognize your Lord?) is:</div></div><div class=\"mc\"><div class=\"mco\"><div class=\"bub\"></div><b>A.</b>&nbsp;By reading the Qur'an and the hadith</div><div class=\"mco\"><div class=\"bub\"></div><b>B.</b>&nbsp;أَعْرِفُهُ بِآيَاتِهِ وَمَخْلُوقَاتِهِ</div><div class=\"mco\"><div class=\"bub\"></div><b>C.</b>&nbsp;By performing the five pillars</div><div class=\"mco\"><div class=\"bub\"></div><b>D.</b>&nbsp;By learning the 99 names of Allah</div></div><div class=\"q\"><div class=\"qn\">Question 3</div><div class=\"qt\">The complete answer to Q4 (Why were you created?) includes:</div></div><div class=\"mc\"><div class=\"mco\"><div class=\"bub\"></div><b>A.</b>&nbsp;لِعِبَادَتِهِ وَحْدَهُ لَا شَرِيكَ لَهُ بِامْتِثَالِ مَا أَمَرَ بِهِ وَتَرْكِ مَا نَهَى عَنْهُ</div><div class=\"mco\"><div class=\"bub\"></div><b>B.</b>&nbsp;لِتَعَلُّمِ الْقُرْآنِ وَالْعُلُومِ الدِّينِيَّةِ</div><div class=\"mco\"><div class=\"bub\"></div><b>C.</b>&nbsp;لِلصَّلَاةِ وَالصِّيَامِ فَقَطْ</div><div class=\"mco\"><div class=\"bub\"></div><b>D.</b>&nbsp;لِرِضَا الْوَالِدَيْنِ</div></div><div class=\"q\"><div class=\"qn\">Question 4</div><div class=\"qt\">The text defines the Taghut as having THREE types (Ibn al-Qayyim):</div></div><div class=\"mc\"><div class=\"mco\"><div class=\"bub\"></div><b>A.</b>&nbsp;كَافِر، مُنَافِق، فَاسِق</div><div class=\"mco\"><div class=\"bub\"></div><b>B.</b>&nbsp;مَعْبُودٌ، مَتْبُوعٌ، مُطَاعٌ — worshipped, followed, obeyed</div><div class=\"mco\"><div class=\"bub\"></div><b>C.</b>&nbsp;صَنَمٌ، وَثَنٌ، نُصُبٌ</div><div class=\"mco\"><div class=\"bub\"></div><b>D.</b>&nbsp;شَيْطَانٌ، جِنٌّ، إِبْلِيسُ</div></div><div class=\"q\"><div class=\"qn\">Question 5</div><div class=\"qt\">The TRUE meaning of لَا إِلَهَ إِلَّا اللهُ from the text is:</div></div><div class=\"mc\"><div class=\"mco\"><div class=\"bub\"></div><b>A.</b>&nbsp;Allah exists alone in the universe</div><div class=\"mco\"><div class=\"bub\"></div><b>B.</b>&nbsp;لَا مَعْبُودَ حَقٌّ إِلَّا اللهُ — no TRULY WORTHY deity except Allah</div><div class=\"mco\"><div class=\"bub\"></div><b>C.</b>&nbsp;No one created the world except Allah</div><div class=\"mco\"><div class=\"bub\"></div><b>D.</b>&nbsp;Allah is the Lord of the Arabs</div></div><div class=\"q\"><div class=\"qn\">Question 6</div><div class=\"qt\">In Az-Zukhruf 43:28, Allah says Ibrahim ﷺ made the Shahadah:</div></div><div class=\"mc\"><div class=\"mco\"><div class=\"bub\"></div><b>A.</b>&nbsp;كَلِمَةً مَشْهُورَةً — a famous statement</div><div class=\"mco\"><div class=\"bub\"></div><b>B.</b>&nbsp;كَلِمَةً بَاقِيَةً فِي عَقِبِهِ — a remaining word among his descendants</div><div class=\"mco\"><div class=\"bub\"></div><b>C.</b>&nbsp;كَلِمَةً بَسِيطَةً — a simple statement</div><div class=\"mco\"><div class=\"bub\"></div><b>D.</b>&nbsp;كَلِمَةً جَدِيدَةً — a new word</div></div><div class=\"q\"><div class=\"qn\">Question 7</div><div class=\"qt\">The Prophet ﷺ was sent from which tribe, described as:</div></div><div class=\"mc\"><div class=\"mco\"><div class=\"bub\"></div><b>A.</b>&nbsp;بَنُو هَاشِمٍ only</div><div class=\"mco\"><div class=\"bub\"></div><b>B.</b>&nbsp;Al-Aws and Al-Khazraj</div><div class=\"mco\"><div class=\"bub\"></div><b>C.</b>&nbsp;قُرَيْشٌ — وَهُمْ صَفْوَةُ وَلَدِ إِسْمَاعِيلَ</div><div class=\"mco\"><div class=\"bub\"></div><b>D.</b>&nbsp;Banu Tamim and Najd</div></div><div class=\"q\"><div class=\"qn\">Question 8</div><div class=\"qt\">The text says people entered Islam in:</div></div><div class=\"mc\"><div class=\"mco\"><div class=\"bub\"></div><b>A.</b>&nbsp;Small numbers after long struggle</div><div class=\"mco\"><div class=\"bub\"></div><b>B.</b>&nbsp;أَفْوَاجًا — crowds and multitudes</div><div class=\"mco\"><div class=\"bub\"></div><b>C.</b>&nbsp;One generation only</div><div class=\"mco\"><div class=\"bub\"></div><b>D.</b>&nbsp;Secret groups hiding from the Romans</div></div><div class=\"q\"><div class=\"qn\">Question 9</div><div class=\"qt\">The Six Pillars of Iman are from:</div></div><div class=\"mc\"><div class=\"mco\"><div class=\"bub\"></div><b>A.</b>&nbsp;Surat Al-Baqarah 2:177</div><div class=\"mco\"><div class=\"bub\"></div><b>B.</b>&nbsp;حَدِيثُ عُمَرَ بْنِ الْخَطَّابِ — the Hadith of Jibril, in Al-Bukhari and Muslim</div><div class=\"mco\"><div class=\"bub\"></div><b>C.</b>&nbsp;The Qur'an only, not hadith</div><div class=\"mco\"><div class=\"bub\"></div><b>D.</b>&nbsp;The scholars' consensus only</div></div><div class=\"q\"><div class=\"qn\">Question 10</div><div class=\"qt\">The book's closing words are:</div></div><div class=\"mc\"><div class=\"mco\"><div class=\"bub\"></div><b>A.</b>&nbsp;سُبْحَانَ اللهِ وَبِحَمْدِهِ</div><div class=\"mco\"><div class=\"bub\"></div><b>B.</b>&nbsp;وَالْحَمْدُ لِلَّهِ رَبِّ الْعَالَمِينَ · تَمَّتْ عَلَى مَا تَقَدَّمَ</div><div class=\"mco\"><div class=\"bub\"></div><b>C.</b>&nbsp;الله أكبر كبيراً</div><div class=\"mco\"><div class=\"bub\"></div><b>D.</b>&nbsp;اللَّهُمَّ صَلِّ عَلَى مُحَمَّدٍ</div></div><div class=\"sec-hd\"><h3>Part C — Fill in the Blank (Exact Arabic from Text)</h3><span class=\"pts\">15 pts</span></div><div class=\"q\"><div class=\"qn\">Question 1</div><div class=\"qt\">مَنْ رَبُّكَ؟ → فَقُلْ: ______</div></div><div class=\"q\"><div class=\"qn\">Question 2</div><div class=\"qt\">بِمَ تَعْرِفُ رَبَّكَ؟ → فَقُلْ: أَعْرِفُهُ ______ وَ ______</div></div><div class=\"q\"><div class=\"qn\">Question 3</div><div class=\"qt\">لِأَيِّ شَيْءٍ خَلَقَكَ؟ → فَقُلْ: ______ وَحْدَهُ لَا شَرِيكَ لَهُ</div></div><div class=\"q\"><div class=\"qn\">Question 4</div><div class=\"qt\">مَا دِينُكَ؟ → فَقُلْ: ______</div></div><div class=\"q\"><div class=\"qn\">Question 5</div><div class=\"qt\">مَنْ نَبِيُّكَ؟ → فَقُلْ: نَبِيُّنَا مُحَمَّدُ بْنُ عَبْدِ اللهِ بْنِ ______ بْنِ هَاشِمِ بْنِ عَبْدِ مَنَافٍ</div></div><div class=\"q\"><div class=\"qn\">Question 6</div><div class=\"qt\">The text says: الشِّرْكُ: أَنْ يَجْعَلَ لِلَّهِ ______ يَدْعُوهُ أَوْ يَرْجُوهُ</div></div><div class=\"q\"><div class=\"qn\">Question 7</div><div class=\"qt\">فَأَعْظَمُ مَا أَمَرَ بِهِ ______، وَأَكْبَرُ مَا نَهَى عَنْهُ ______</div></div><div class=\"q\"><div class=\"qn\">Question 8</div><div class=\"qt\">وَأَوَّلُ الرُّسُلِ ______ عَلَيْهِ السَّلَامُ وَآخِرُهُمْ ______ ﷺ</div></div><div class=\"q\"><div class=\"qn\">Question 9</div><div class=\"qt\">وَخَيْرُ الْقُرُونِ ______، ثُمَّ الَّذِينَ يَلُونَهُمْ، ثُمَّ الَّذِينَ يَلُونَهُمْ</div></div><div class=\"q\"><div class=\"qn\">Question 10</div><div class=\"qt\">مِنَ الإِيمَانِ الْمُنَجِّي مِنَ الْكُفْرِ: الإِيمَانُ بِالْبَعْثِ وَالنَّشْرِ وَالْجَزَاءِ وَالْحِسَابِ وَ ______ حَقٌّ</div></div><div class=\"sec-hd\"><h3>Part D — Matching (Arabic Terms + Definitions)</h3><span class=\"pts\">15 pts</span></div><div class=\"match-grid\"><div class=\"match-col\"><h4>Column A</h4><div class=\"mi\"><div class=\"mn\">1</div>الشِّرْكُ</div><div class=\"mi\"><div class=\"mn\">2</div>خَاتَمُ النَّبِيِّينَ (مُحَمَّدٌ ﷺ)</div><div class=\"mi\"><div class=\"mn\">3</div>الاسْتِسْلَامُ لِلَّهِ بِالتَّوْحِيدِ</div><div class=\"mi\"><div class=\"mn\">4</div>الطَّاغُوتُ</div><div class=\"mi\"><div class=\"mn\">5</div>نُوحٌ ﷺ</div><div class=\"mi\"><div class=\"mn\">6</div>مُخُّ الْعِبَادَةِ</div><div class=\"mi\"><div class=\"mn\">7</div>آيَاتُهُ</div><div class=\"mi\"><div class=\"mn\">8</div>الْعُبُودِيَّةُ</div><div class=\"mi\"><div class=\"mn\">9</div>الْكُفْرُ بِالطَّاغُوتِ وَالإِيمَانُ بِاللَّهِ</div><div class=\"mi\"><div class=\"mn\">10</div>الْبَعْثُ</div></div><div class=\"match-col\"><h4>Column B</h4><div class=\"mi\"><div class=\"mlt\">A</div>The heart and soul of worship<div class=\"mblk\"></div></div><div class=\"mi\"><div class=\"mlt\">B</div>All of creation being servants of Allah<div class=\"mblk\"></div></div><div class=\"mi\"><div class=\"mlt\">C</div>Whatever a servant goes too far with — worshipped/followed/obeyed<div class=\"mblk\"></div></div><div class=\"mi\"><div class=\"mlt\">D</div>Surrender to Allah with Tawhid<div class=\"mblk\"></div></div><div class=\"mi\"><div class=\"mlt\">E</div>Signs of Allah — night, day, sun, moon<div class=\"mblk\"></div></div><div class=\"mi\"><div class=\"mlt\">F</div>The first Messenger<div class=\"mblk\"></div></div><div class=\"mi\"><div class=\"mlt\">G</div>Seal of the Prophets<div class=\"mblk\"></div></div><div class=\"mi\"><div class=\"mlt\">H</div>First obligation upon Allah's servants<div class=\"mblk\"></div></div><div class=\"mi\"><div class=\"mlt\">I</div>Resurrection — will be raised from the dead<div class=\"mblk\"></div></div><div class=\"mi\"><div class=\"mlt\">J</div>The greatest sin against Allah<div class=\"mblk\"></div></div></div></div><div class=\"sec-hd\"><h3>Part E — Short Answer (Full Unit)</h3><span class=\"pts\">20 pts</span></div><div class=\"q\"><div class=\"qn\">Question 1</div><div class=\"qt\">Write ALL SIX pillars of Iman in Arabic (exact text from book) and give the English meaning of each:</div></div><div class=\"als\"><div class=\"aline\"></div><div class=\"aline\"></div></div><div class=\"q\"><div class=\"qn\">Question 2</div><div class=\"qt\">What were the three things the Prophet ﷺ came to do? Write each one in Arabic and English. Also: what were the Arabs worshipping before he came? List at least 5 from what we learned.</div></div><div class=\"als\"><div class=\"aline\"></div><div class=\"aline\"></div></div><div class=\"q\"><div class=\"qn\">Question 3</div><div class=\"qt\">What does Islam mean? Write all FOUR parts in Arabic and English. Then write ONE ayah that proves Islam is the only accepted religion.</div></div><div class=\"als\"><div class=\"aline\"></div><div class=\"aline\"></div></div><div class=\"q\"><div class=\"qn\">Question 4</div><div class=\"qt\">The five prayers were given without a middleman. What event was this? Why does it make Salah uniquely special? How many years did the Prophet ﷺ call only to Tawhid before the other pillars were required?</div></div><div class=\"als\"><div class=\"aline\"></div><div class=\"aline\"></div></div><div class=\"sec-hd\"><h3>Part F — Final Essay</h3><span class=\"pts\">15 pts</span></div><div class=\"note\">Write 8-12 sentences. Show that you truly UNDERSTAND — don't just copy. Use Arabic words, mention ayat, and write in your own words! The entire book Ta'lim al-Sibyan al-Tawhid teaches us three core things. Write about ALL THREE: ① Knowing Allah (Tawhid) — who is He, what does knowing Him mean, what are His signs? ② Worshipping Allah Alone ('Ibadah vs Shirk) — what is real worship, what destroys it, why does it matter? ③ Following the Prophet ﷺ (His Mission & Our Response) — what did he come to do, and how should we live differently because of it? Use Arabic words we learned and write at least THREE ayat from the Qur'an in your answer.</div><div class=\"als\"><div class=\"aline\"></div><div class=\"aline\"></div><div class=\"aline\"></div><div class=\"aline\"></div><div class=\"aline\"></div><div class=\"aline\"></div><div class=\"aline\"></div><div class=\"aline\"></div></div><table class=\"tbl\"><thead><tr><th>Part</th><th>Section</th><th>Max</th></tr></thead><tbody><tr><td class=\"wc\">A</td><td class=\"wc\">True or False</td><td class=\"wc\">10</td></tr><tr><td class=\"wc\">B</td><td class=\"wc\">Multiple Choice (10 Qs)</td><td class=\"wc\">25</td></tr><tr><td class=\"wc\">C</td><td class=\"wc\">Fill in the Blank — Arabic</td><td class=\"wc\">15</td></tr><tr><td class=\"wc\">D</td><td class=\"wc\">Arabic Matching</td><td class=\"wc\">15</td></tr><tr><td class=\"wc\">E</td><td class=\"wc\">Short Answer (4 Qs)</td><td class=\"wc\">20</td></tr><tr><td class=\"wc\">F</td><td class=\"wc\">Essay</td><td class=\"wc\">15</td></tr><tr><td class=\"wc\">TOTAL</td><td class=\"wc\"></td><td class=\"wc\">100</td></tr></tbody></table>", "lesson": 0}, {"id": "OPEN1", "cat": "openers", "title": "Daily Opener — S1: The Book's Opening & Why Tawhid Comes First", "badge": "Bell Ringer + Warm-Up · S1", "points": null, "html": "<div class=\"sh-hdr\"><div class=\"sh-top\"><div class=\"sh-title\">Daily Opener — The Book's Opening</div><div class=\"sh-badge\">Bell Ringer + Warm-Up · S1</div></div><div class=\"sh-meta\"><div class=\"mf\"><div class=\"ml\">Name</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Date</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\"></div><div class=\"mv\"></div></div></div></div><div class=\"sec-hd\"><h3>🔔 Bell Ringer (3-5 min — books closed)</h3></div><div class=\"q\"><div class=\"qn\">Quick Recall</div><span class=\"qar\">رَبِّ زِدْنِي عِلْمًا</span><div class=\"qt\">Say the du'a the Prophet ﷺ was commanded to say before beginning to learn. What does it mean?</div><div class=\"al\"></div></div><div class=\"sec-hd\"><h3>☀️ Warm-Up (connects to today)</h3></div><div class=\"q\"><div class=\"qn\">Think About It</div><div class=\"qt\">This book was written specifically for children — for YOU. Before we start: what do you think is the most important thing a Muslim must know? Write it down. We'll come back to this at the end of the unit.</div><div class=\"al\"></div><div class=\"al\"></div></div>", "lesson": 1}, {"id": "EXIT1", "cat": "openers", "title": "Exit Ticket — S1: The Book's Opening & Why Tawhid Comes First", "badge": "Exit Ticket · S1", "points": null, "html": "<div class=\"sh-hdr\"><div class=\"sh-top\"><div class=\"sh-title\">Exit Ticket — The Book's Opening</div><div class=\"sh-badge\">Exit Ticket · S1</div></div><div class=\"sh-meta\"><div class=\"mf\"><div class=\"ml\">Name</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Date</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\"></div><div class=\"mv\"></div></div></div></div><div class=\"sec-hd\"><h3>Before you leave...</h3></div><div class=\"q\"><div class=\"qn\">Question 1</div><div class=\"qt\">What does the classical phrase أَمَّا بَعْدُ mean, and why do scholars use it?</div><span class=\"qar\">أَمَّا بَعْدُ</span></div><div class=\"q\"><div class=\"qn\">Question 2</div><div class=\"qt\">Why did the author say the goal is مُسْلِمًا كَامِلًا AND مُوَحِّدًا جَيِّدًا — not just one of the two?</div></div><div class=\"q\"><div class=\"qn\">Question 3 — Self-Check</div><div class=\"qt\">Rate how confident you feel with today's session:</div><div class=\"mc\"><div class=\"mco\"><div class=\"bub\"></div>😄 I could teach this to someone else</div><div class=\"mco\"><div class=\"bub\"></div>🙂 I understand it well</div><div class=\"mco\"><div class=\"bub\"></div>🤔 I need a bit more practice</div><div class=\"mco\"><div class=\"bub\"></div>😕 I need to review this with my teacher</div></div></div>", "lesson": 1}, {"id": "ORAL1", "cat": "oral", "title": "Oral Review Script — S1: The Book's Opening & Why Tawhid Comes First", "badge": "Teacher-Led Drill · S1", "points": null, "html": "<div class=\"sh-hdr\"><div class=\"sh-top\"><div class=\"sh-title\">Oral Review — The Book's Opening</div><div class=\"sh-badge\">Teacher-Led Drill · S1</div></div><div class=\"sh-meta\"><div class=\"mf\"><div class=\"ml\">Teacher</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Date</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Class</div><div class=\"mv\"></div></div></div></div><div class=\"note\"><b>Note:</b> Whole-class call-and-response. Say the prompt, point to a student (or the whole class), then reveal the expected answer. Move fast — this is retrieval practice, not re-teaching.</div><div class=\"sec-hd\"><h3>Call & Response</h3></div><div class=\"oral\"><div class=\"oral-row\"><div class=\"oral-n\">1</div><div class=\"oral-p\">Who is the author of this book?</div><div class=\"oral-a\">Shaykh Muhammad ibn 'Abd al-Wahhab al-Tamimi al-Najdi</div></div><div class=\"oral-row\"><div class=\"oral-n\">2</div><div class=\"oral-p\">What title did the scholars give him?</div><div class=\"oral-a\">al-Mujaddid — the Reviver</div></div><div class=\"oral-row\"><div class=\"oral-n\">3</div><div class=\"oral-p\">What does the book's title mean?</div><div class=\"oral-a\">Ta'lim al-Sibyan al-Tawhid — Teaching Children Tawhid</div></div><div class=\"oral-row\"><div class=\"oral-n\">4</div><div class=\"oral-p\">What does أَمَّا بَعْدُ mean?</div><div class=\"oral-a\">\"As for what follows\" — a classical transition phrase</div></div><div class=\"oral-row\"><div class=\"oral-n\">5</div><div class=\"oral-p\">What are the TWO goals stated in the purpose statement?</div><div class=\"oral-a\">مُسْلِمًا كَامِلًا (a complete Muslim) and مُوَحِّدًا جَيِّدًا (a good Muwahhid)</div></div><div class=\"oral-row\"><div class=\"oral-n\">6</div><div class=\"oral-p\">What method did the author use to arrange the book?</div><div class=\"oral-a\">سُؤَالٌ وَجَوَابٌ — question and answer</div></div></div>", "lesson": 1}, {"id": "VOCAB1", "cat": "vocab", "title": "Vocabulary & Flashcards — S1: The Book's Opening & Why Tawhid Comes First", "badge": "Arabic Terms · S1", "points": 2, "html": "<div class=\"sh-hdr\"><div class=\"sh-top\"><div class=\"sh-title\">Vocabulary Review — The Book's Opening</div><div class=\"sh-badge\">Arabic Terms · S1</div></div><div class=\"sh-meta\"><div class=\"mf\"><div class=\"ml\">Name</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Date</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Score</div><div class=\"mv\"></div></div></div></div><div class=\"sec-hd\"><h3>Flashcards — cut along the lines</h3></div><div class=\"fc-grid\"><div class=\"fc\"><div class=\"fc-front\"><span class=\"qar\" style=\"font-size:1.6rem;\">التَّوْحِيدُ</span><div class=\"fc-tr\">At-Tawhid</div></div><div class=\"fc-back\">The Oneness of Allah — worshipping Him alone</div></div><div class=\"fc\"><div clas  class=\"qt\">1. Copy this passage in your own handwriting: </div><div class=\"al\"></div><div class=\"al\"></div><div class=\"qt\">2. Recite it to a partner or your teacher from memory: </div><div class=\"qt\">3. Fill in the missing word: </div><div class=\"qt qar\">أَعُوذُ بِاللَّهِ مِنَ الشَّيْطَانِ الرَّجِيمِ ۝ بِسْمِ اللَّهِ الرَّحْمَنِ الرَّحِيمِ ۝ الْحَمْدُ لِلَّهِ ______ الْعَالَمِينَ، وَالصَّلَاةُ وَالسَّلَامُ عَلَى سَيِّدِ الْمُرْسَلِينَ وَعَلَى آلِهِ وَأَصْحَابِهِ أَجْمَعِينَ ۝ أَمَّا بَعْدُ</div><div class=\"qt\">4. In your own words, why does this passage matter? </div><div class=\"al\"></div></div><div class=\"note\"><b>Note:</b> This is the classical opening every Islamic scholar's book begins with — not a single Qur'anic ayah, but essential classical Arabic every student should memorize and recite fluently.</div>", "lesson": 1}, {"id": "MATCH1", "cat": "games", "title": "Matching Activity — S1: The Book's Opening & Why Tawhid Comes First", "badge": "Match the Terms · S1", "points": 4, "html": "<div class=\"sh-hdr\"><div class=\"sh-top\"><div class=\"sh-title\">Matching — The Book's Opening</div><div class=\"sh-badge\">Match the Terms · S1</div></div><div class=\"sh-meta\"><div class=\"mf\"><div class=\"ml\">Name</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Date</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Score</div><div class=\"mv\"></div></div></div></div><div class=\"sec-hd\"><h3>Draw a line (or write the letter) to match each item</h3><span class=\"pts\">4 pts</span></div><div class=\"match-grid\"><div class=\"match-col\"><h4>Column A</h4><div class=\"mi\"><div class=\"mn\">1</div>التَّوْحِيدُ</div><div class=\"mi\"><div class=\"mn\">2</div>الْفِطْرَةُ</div><div class=\"mi\"><div class=\"mn\">3</div>أَمَّا بَعْدُ</div><div class=\"mi\"><div class=\"mn\">4</div>سُؤَالٌ وَجَوَابٌ</div></div><div class=\"match-col\"><h4>Column B</h4><div class=\"mi\"><div class=\"mlt\">A</div>\"As for what follows\  class=\"sh-hdr\"><div class=\"sh-top\"><div class=\"sh-title\">Exit Ticket — Q1, Q2 & Q3 — Who is Your Lord?</div><div class=\"sh-badge\">Exit Ticket · S2</div></div><div class=\"sh-meta\"><div class=\"mf\"><div class=\"ml\">Name</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Date</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\"></div><div class=\"mv\"></div></div></div></div><div class=\"sec-hd\"><h3>Before you leave...</h3></div><div class=\"q\"><div class=\"qn\">Question 1</div><div class=\"qt\">Write today's Q3 and its Arabic answer.</div><span class=\"qar\">بِمَ تَعْرِفُ رَبَّكَ؟</span></div><div class=\"q\"><div class=\"qn\">Question 2</div><div class=\"qt\">Name one Sign (āyah) and one piece of Creation (makhluq) you noticed today, and explain which is which.</div></div><div class=\"q\"><div class=\"qn\">Question 3 — Self-Check</div><div class=\"qt\">Rate how confident you feel with today's session:</div><div class=\"mc\"><div class=\"mco\"><div class=\"bub\"></div>😄 I could teach this to someone else</div><div class=\"mco\"><div class=\"bub\"></div>🙂 I understand it well</div><div class=\"mco\"><div class=\"bub\"></div>🤔 I need a bit more practice</div><div class=\"mco\"><div class=\"bub\"></div>😕 I need to review this with my teacher</div></div></div>", "lesson": 2}, {"id": "ORAL2", "cat": "oral", "title": "Oral Review Script — S2: Q1, Q2 & Q3 — Who is Your Lord, and How Do You Know Him?", "badge": "Teacher-Led Drill · S2", "points": null, "html": "<div class=\"sh-hdr\"><div class=\"sh-top\"><div class=\"sh-title\">Oral Review — Q1, Q2 & Q3 — Who is Your Lord?</div><div class=\"sh-badge\">Teacher-Led Drill · S2</div></div><div class=\"sh-meta\"><div class=\"mf\"><div class=\"ml\">Teacher</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Date</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Class</div><div class=\"mv\"></div></div></div></div><div class=\"note\"><b>Note:</b> Whole-class call-and-response. Say the prompt, point to a student (or the whole class), then reveal the expected answer. Move fast — this is retrieval practice, not re-teaching.</div><div class=\"sec-hd\"><h3>Call & Response</h3></div><div class=\"oral\"><div class=\"oral-row\"><div class=\"oral-n\">1</div><div class=\"oral-p\">مَنْ رَبُّكَ؟</div><div class=\"oral-a\">رَبِّيَ اللهُ</div></div><div class=\"oral-row\"><div class=\"oral-n\">2</div><div class=\"oral-p\">وَمَا مَعْنَى الرَّبِّ؟</div><div class=\"oral-a\">الْمَالِكُ الْمَعْبُودُ</div></div><div class=\"oral-row\"><div class=\"oral-n\">3</div><div class=\"oral-p\">What does the Name Allah mean?</div><div class=\"oral-a\">ذُو الأُلُوهِيَّةِ وَالْعُبُودِيَّةِ عَلَى خَلْقِهِ أَجْمَعِينَ</div></div><div class=\"oral-row\"><div class=\"oral-n\">4</div><div class=\"oral-p\">بِمَ تَعْرِفُ رَبَّكَ؟</div><div class=\"oral-a\">أَعْرِفُهُ بِآيَاتِهِ وَمَخْلُوقَاتِهِ</div></div><div class=\"oral-row\"><div class=\"oral-n\">5</div><div class=\"oral-p\">Name the 4 Signs from the text.</div><div class=\"oral-a\">اللَّيْلُ وَالنَّهَارُ وَالشَّمْسُ وَالْقَمَرُ</div></div><div class=\"oral-row\"><div class=\"oral-n\">6</div><div class=\"oral-p\">What ayah is the proof for Q1, Q2, and Q3?</div><div class=\"oral-a\">Al-A'raf 7:54</div></div><div class=\"oral-row\"><div class=\"oral-n\">7</div><div class=\"oral-p\">لِأَيِّ شَيْءٍ خَلَقَكَ؟</div><div class=\"oral-a\">لِعِبَادَتِهِ وَحْدَهُ لَا شَرِيكَ لَهُ</div></div><div class=\"oral-row\"><div class=\"oral-n\">8</div><div class=\"oral-p\">What are the 3 categories in the definition of 'Ibadah?</div><div class=\"oral-a\">أَقْوَال (statements), أَعْمَال ظَاهِرَة (outward actions), أَعْمَال بَاطِنَة (inward actions)</div></div></div>", "lesson": 2}, {"id": "VOCAB2", "cat": "vocab", "title": "Vocabulary & Flashcards — S2: Q1, Q2 & Q3 — Who is Your Lord, and How Do You Know Him?", "badge": "Arabic Terms · S2", "points": 6, "html": "<div class=\"sh-hdr\"><div class=\"sh-top\"><div class=\"sh-title\">Vocabulary Review — Q1, Q2 & Q3 — Who is Your Lord?</div><div class=\"sh-badge\">Arabic Terms · S2</div></div><div class=\"sh-meta\"><div class=\"mf\"><div class=\"ml\">Name</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Date</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Score</div><div class=\"mv\"></div></div></div></div><div class=\"sec-hd\"><h3>Flashcards — cut along the lines</h3></div><div class=\"fc-grid\"><div class=\"fc\"><div class=\"fc-front\"><span class=\"qar\" style=\"font-size:1.6rem;\">الرَّبُّ</span><div class=\"fc-tr\">Ar-Rabb</div></div><div class=\"fc-back\">The Lord — the Owner and the One Worshipped</div></div><div class=\"fc\"><div class=\"fc-front\"><span class=\"qar\" style=\"font-size:1.6rem;\">الأُلُوهِيَّةُ</span><div class=\"fc-tr\">Al-Uluhiyyah</div></div><div class=\"fc-back\">The right to be worshipped — belonging only to Allah</div></div><div class=\"fc\"><div class=\"fc-front\"><span class=\"qar\" style=\"font-size:1.6rem;\">الْعُبُودِيَّةُ</span><div class=\"fc-tr\">Al-'Ubudiyyah</div></div><div class=\"fc-back\">Complete servanthood — the state of all creation before Allah</div></div><div class=\"fc\"><div class=\"fc-front\"><span class=\"qar\" style=\"font-size:1.6rem;\">آيَاتُهُ</span><div class=\"fc-tr\">Ayatuhu</div></div><div class=\"fc-back\">His signs — what Allah is doing right now</div></div><div class=\"fc\"><div class=\"fc-front\"><span class=\"qar\" style=\"font-size:1.6rem;\">مَخْلُوقَاتُهُ</span><div class=\"fc-tr\">Makhluqatuhu</div></div><div class=\"fc-back\">His creation — what Allah has made</div></div><div class=\"fc\"><div class=\"fc-front\"><span class=\"qar\" style=\"font-size:1.6rem;\">الْعِبَادَةُ</span><div class=\"fc-tr\">Al-'Ibadah</div></div><div class=\"fc-back\">Worship — a comprehensive term for all Allah loves</div></div></div><div class=\"sec-hd\"><h3>Quiz Yourself</h3><span class=\"pts\">6 pts</span></div><table class=\"tbl\"><thead><tr><th>Arabic</th><th>Transliteration</th><th>Meaning (cover and try to recall)</th></tr></thead><tbody><tr><td class=\"wc\">الرَّبُّ</td><td class=\"wc\">Ar-Rabb</td><td class=\"wc\"></td></tr><tr><td class=\"wc\">الأُلُوهِيَّةُ</td><td class=\"wc\">Al-Uluhiyyah</td><td class=\"wc\"></td></tr><tr><td class=\"wc\">الْعُبُودِيَّةُ</td><td class=\"wc\">Al-'Ubudiyyah</td><td class=\"wc\"></td></tr><tr><td class=\"wc\">آيَاتُهُ</td><td class=\"wc\">Ayatuhu</td><td class=\"wc\"></td></tr><tr><td class=\"wc\">مَخْلُوقَاتُهُ</td><td class=\"wc\">Makhluqatuhu</td><td class=\"wc\"></td></tr><tr><td class=\"wc\">الْعِبَادَةُ</td><td class=\"wc\">Al-'Ibadah</td><td class=\"wc\"></td></tr></tbody></table>", "lesson": 2}, {"id": "AYHD2", "cat": "vocab", "title": "Ayah & Hadith Review — S2: Q1, Q2 & Q3 — Who is Your Lord, and How Do You Know Him?", "badge": "Recitation Practice · S2", "points": 9, "html": "<div class=\"sh-hdr\"><div class=\"sh-top\"><div class=\"sh-title\">Ayah & Hadith Review — Q1, Q2 & Q3 — Who is Your Lord?</div><div class=\"sh-badge\">Recitation Practice · S2</div></div><div class=\"sh-meta\"><div class=\"mf\"><div class=\"ml\">Name</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Date</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Score</div><div class=\"mv\"></div></div></div></div><div class=\"sec-hd\"><h3>This Session's Ayahs (3)</h3><span class=\"pts\">15 pts</span></div><div class=\"q\"><div class=\"qn\">Ayah 1 — Al-A'raf 7:54</div><span class=\"qar\">إِنَّ رَبَّكُمُ اللَّهُ الَّذِي خَلَقَ السَّمَاوَاتِ وَالأَرْضَ فِي سِتَّةِ أَيَّامٍ ثُمَّ اسْتَوَى عَلَى الْعَرْشِ</span><div class=\"qt\">1. Copy the ayah above in your own handwriting: </div><div class=\"al\"></div><div class=\"qt\">2. Translate it in your own words: </div><div class=\"al\"></div><div class=\"qt\">3. What does the text use it to prove? </div><div class=\"al\"></div><div class=\"qt\">4. Fill in the missing word from memory: </div><div class=\"qt qar\">إِنَّ رَبَّكُمُ اللَّهُ الَّذِي خَلَقَ السَّمَاوَاتِ وَالأَرْضَ ______ سِتَّةِ أَيَّامٍ ثُمَّ اسْتَوَى عَلَى الْعَرْشِ</div><div class=\"qt\">5. Why does this matter for how YOU live today? </div><div class=\"al\"></div></div><div class=\"q\"><div class=\"qn\">Ayah 2 — Adh-Dhariyat 51:56</div><span class=\"qar\">وَمَا خَلَقْتُ الْجِنَّ وَالإِنسَ إِلَّا لِيَعْبُدُونِ</span><div class=\"qt\">1. Copy the ayah above in your own handwriting: </div><div class=\"al\"></div><div class=\"qt\">2. Translate it in your own words: </div><div class=\"al\"></div><div class=\"qt\">3. What does the text use it to prove? </div><div class=\"al\"></div><div class=\"qt\">4. Fill in the missing word from memory: </div><div class=\"qt qar\">وَمَا خَلَقْتُ الْجِنَّ ______ إِلَّا لِيَعْبُدُونِ</div><div class=\"qt\">5. Why does this matter for how YOU live today? </div><div class=\"al\"></div></div><div class=\"q\"><div class=\"qn\">Ayah 3 — An-Nisa 4:36</div><span class=\"qar\">وَاعْبُدُوا اللَّهَ وَلَا تُشْرِكُوا بِهِ شَيْئًا</span><div class=\"qt\">1. Copy the ayah above in your own handwriting: </div><div class=\"al\"></div><div class=\"qt\">2. Translate it in your own words: </div><div class=\"al\"></div><div class=\"qt\">3. What does the text use it to prove? </div><div class=\"al\"></div><div class=\"qt\">4. Fill in the missing word from memory: </div><div class=\"qt qar\">وَاعْبُدُوا اللَّهَ وَلَا ______ بِهِ شَيْئًا</div><div class=\"qt\">5. Why does this matter for how YOU live today? </div><div class=\"al\"></div></div>", "lesson": 2}, {"id": "MATCH2", "cat": "games", "title": "Matching Activity — S2: Q1, Q2 & Q3 — Who is Your Lord, and How Do You Know Him?", "badge": "Match the Terms · S2", "points": 6, "html": "<div class=\"sh-hdr\"><div class=\"sh-top\"><div class=\"sh-title\">Matching — Q1, Q2 & Q3 — Who is Your Lord?</div><div class=\"sh-badge\">Match the Terms · S2</div></div><div class=\"sh-meta\"><div class=\"mf\"><div class=\"ml\">Name</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Date</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Score</div><div class=\"mv\"></div></div></div></div><div class=\"sec-hd\"><h3>Draw a line (or write the letter) to match each item</h3><span class=\"pts\">6 pts</span></div><div class=\"match-grid\"><div class=\"match-col\"><h4>Column A</h4><div class=\"mi\"><div class=\"mn\">1</div>الرَّبُّ</div><div class=\"mi\"><div class=\"mn\">2</div>الأُلُوهِيَّةُ</div><div class=\"mi\"><div class=\"mn\">3</div>الْعُبُودِيَّةُ</div><div class=\"mi\"><div class=\"mn\">4</div>آيَاتُهُ</div><div class=\"mi\"><div class=\"mn\">5</div>مَخْلُوقَاتُهُ</div><div class=\"mi\"><div class=\"mn\">6</div>الْعِبَادَةُ</div></div><div class=\"match-col\"><h4>Column B</h4><div class=\"mi\"><div class=\"mlt\">A</div>Worship — everything Allah loves<div class=\"mblk\"></div></div><div class=\"mi\"><div class=\"mlt\">B</div>His creation<div class=\"mblk\"></div></div><div class=\"mi\"><div class=\"mlt\">C</div>The right to be worshipped<div class=\"mblk\"></div></div><div class=\"mi\"><div class=\"mlt\">D</div>The Lord — Owner and Worshipped<div class=\"mblk\"></div></div><div class=\"mi\"><div class=\"mlt\">E</div>His signs<div class=\"mblk\"></div></div><div class=\"mi\"><div class=\"mlt\">F</div>Complete servanthood<div class=\"mblk\"></div></div></div></div>", "lesson": 2}, {"id": "TF2", "cat": "games", "title": "True/False — S2: Q1, Q2 & Q3 — Who is Your Lord, and How Do You Know Him?", "badge": "T/F Quick Check · S2", "points": 6, "html": "<div class=\"sh-hdr\"><div class=\"sh-top\"><div class=\"sh-title\">True or False — Q1, Q2 & Q3 — Who is Your Lord?</div><div class=\"sh-badge\">T/F Quick Check · S2</div></div><div class=\"sh-meta\"><div class=\"mf\"><div class=\"ml\">Name</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Date</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Score</div><div class=\"mv\"></div></div></div></div><div class=\"sec-hd\"><h3>Circle T or F for each statement</h3><span class=\"pts\">6 pts</span></div><div class=\"tf\"><div class=\"tfrow\"><div class=\"tfopt\"><span class=\"tfbub\">T</span><span class=\"tfbub\">F</span></div><div class=\"tftext\">1. The answer to مَنْ رَبُّكَ؟ is رَبِّيَ اللهُ.</div></div><div class=\"tfrow\"><div class=\"tfopt\"><span class=\"tfbub\">T</span><span class=\"tfbub\">F</span></div><div class=\"tftext\">2. Rabb means الْمَالِكُ الْمَعْبُودُ — the Owner and the One Worshipped.</div></div><div class=\"tfrow\"><div class=\"tfopt\"><span class=\"tfbub\">T</span><span class=\"tfbub\">F</span></div><div class=\"tftext\">3. The night and day are examples of Allah's Creation (مَخْلُوقَات), not His Signs.</div></div><div class=\"tfrow\"><div class=\"tfopt\"><span class=\"tfbub\">T</span><span class=\"tfbub\">F</span></div><div class=\"tftext\">4. Al-A'raf 7:54 is used as proof for Q1, Q2, and Q3 together.</div></div><div class=\"tfrow\"><div class=\"tfopt\"><span class=\"tfbub\">T</span><span class=\"tfbub\">F</span></div><div class=\"tftext\">5. 'Ibadah only includes outward actions like prayer and fasting.</div></div><div class=\"tfrow\"><div class=\"tfopt\"><span class=\"tfbub\">T</span><span class=\"tfbub\">F</span></div><div class=\"tftext\">6. The condition for 'Ibadah to be accepted is that it must be for Allah alone and follow the Prophet ﷺ.</div></div></div>", "lesson": 2}, {"id": "WS2", "cat": "games", "title": "Word Search — S2: Q1, Q2 & Q3 — Who is Your Lord, and How Do You Know Him?", "badge": "Puzzle · S2", "points": null, "html": "<div class=\"sh-hdr\"><div class=\"sh-top\"><div class=\"sh-title\">Word Search — Q1, Q2 & Q3 — Who is Your Lord?</div><div class=\"sh-badge\">Puzzle · S2</div></div><div class=\"sh-meta\"><div class=\"mf\"><div class=\"ml\">Name</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Date</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Score</div><d :1;min-width:120px;\"></div></div><div class=\"unsc-row\"><div class=\"unsc-n\">5.</div><div class=\"unsc-scr\">L U U H T M U A K Q H A</div><div class=\"unsc-cl\">His creation — what Allah has made <span class=\"qar\" style=\"font-size:1.1rem;\">مَخْلُوقَاتُهُ</span></div><div class=\"al\" style=\"flex:1;min-width:120px;\"></div></div><div class=\"unsc-row\"><div class=\"unsc-n\">6.</div><div class=\"unsc-scr\">A A L D B A I H</div><div class=\"unsc-cl\">Worship — a comprehensive term for all Allah loves <span class=\"qar\" style=\"font-size:1.1rem;\">الْعِبَادَةُ</span></div><div class=\"al\" style=\"flex:1;min-width:120px;\"></div></div></div>", "lesson": 2}, {"id": "PAIR2", "cat": "collab", "title": "Partner Activity — S2: Q1, Q2 & Q3 — Who is Your Lord, and How Do You Know Him?", "badge": "Pair Work · S2", "points": null, "html": "<div class=\"sh-hdr\"><div class=\"sh-top\"><div class=\"sh-title\">Partner Activity — Q1, Q2 & Q3 — Who is Your Lord?</div><div class=\"sh-badge\">Pair Work · S2</div></div><div class=\"sh-meta\"><div class=\"mf\"><div class=\"ml\">Names</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Date</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\"></div><div class=\"mv\"></div></div></div></div><div class=\"note\"><b>Note:</b> Work with a partner. Take turns — both partners must speak, write, and be ready to be called on.</div><div class=\"sec-hd\"><h3>Task</h3></div><div class=\"q\"><div class=\"qn\">Question 1</div><div class=\"qt\">Partner A asks Partner B مَنْ رَبُّكَ؟ and وَمَا مَعْنَى الرَّبِّ؟ in Arabic. Partner B answers, then points to something in the room and says whether it is a Sign or Creation. Switch roles.</div></div><div class=\"q\"><div class=\"qn\">Question 2</div><div class=\"qt\">Together, list 2 things you do that are أَعْمَال ظَاهِرَة (outward worship) and 2 things that are أَعْمَال بَاطِنَة (inward worship):</div></div><div class=\"als\"><div class=\"aline\"></div><div class=\"aline\"></div></div>", "lesson": 2}, {"id": "GRP2", "cat": "collab", "title": "Group Activity — S2: Q1, Q2 & Q3 — Who is Your Lord, and How Do You Know Him?", "badge": "Small Group · S2", "points": null, "html": "<div class=\"sh-hdr\"><div class=\"sh-top\"><div class=\"sh-title\">Group Activity — Q1, Q2 & Q3 — Who is Your Lord?</div><div class=\"sh-badge\">Small Group · S2</div></div><div class=\"sh-meta\"><div class=\"mf\"><div class=\"ml\">Group Members</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Date</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\"></div><div class=\"mv\"></div></div></div></div><div class=\"note\"><b>Note:</b> Groups of 3-4. Assign roles: Reader, Recorder, Reporter, Timekeeper. Every group presents for 60 seconds when done.</div><div class=\"sec-hd\"><h3>Task</h3></div><div class=\"q\"><div class=\"qn\">Question 1</div><div class=\"qt\">Sort activity: your teacher will give your group picture/word cards. Sort them into SIGNS and CREATION as fast as you can. Compare your group's time to others.</div></div>", "lesson": 2}, {"id": "OPEN3", "cat": "openers", "title": "Daily Opener — S3: Shirk, Du'a & the Five Heart-Worship Acts", "badge": "Bell Ringer + Warm-Up · S3", "points": null, "html": "<div class=\"sh-hdr\"><div class=\"sh-top\"><div class=\"sh-title\">Daily Opener — Shirk, Du'a & Heart Worship</div><div class=\"sh-badge\">Bell Ringer + Warm-Up · S3</div></div><div class=\"sh-meta\"><div class=\"mf\"><div class=\"ml\">Name</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Date</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\"></div><div class=\"mv\"></div></div></div></div><div class=\"sec-hd\"><h3>🔔 Bell Ringer (3-5 min — books closed)</h3></div><div class=\"q\"><div class=\"qn\">Quick Recall</div><span class=\"qar\">لِأَيِّ شَيْءٍ خَلَقَكَ؟</span><div class=\"qt\">Give Q4's answer and name the 3 categories of 'Ibadah.</div><div class=\"al\"></div></div><div class=\"sec-hd\"><h3>☀️ Warm-Up (connects to today)</h3></div><div class=\"q\"><div class=\"qn\">Think About It</div><div class=\"qt\">If our whole purpose is to worship Allah alone (Q4) — what do you think happens when someone gives that worship to something else instead? Today we learn the text's answer: Shirk.</div><div class=\"al\"></div><div class=\"al\"></div></div>", "lesson": 3}, {"id": "EXIT3", "cat": "openers", "title": "Exit Ticket — S3: Shirk, Du'a & the Five Heart-Worship Acts", "badge": "Exit Ticket · S3", "points": null, "html": "<div class=\"sh-hdr\"><div class=\"sh-top\"><div class=\"sh-title\">Exit Ticket — Shirk, Du'a & Heart Worship</div><div class=\"sh-badge\">Exit Ticket · S3</div></div><div class=\"sh-meta\"><div class=\"mf\"><div class=\"ml\">Name</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Date</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\"></div><div class=\"mv\"></div></div></div></div><div class=\"sec-hd\"><h3>Before you leave...</h3></div><div class=\"q\"><div class=\"qn\">Question 1</div><div class=\"qt\">Write the text's definition of Shirk in Arabic (or as much as you remember).</div><span class=\"qar\">مَا الشِّرْكُ؟</span></div><div class=\"q\"><div class=\"qn\">Question 2</div><div class=\"qt\">Name ONE of the 5 heart-worship types (khawf, raja', tawakkul, raghbah/rahbah, inabah) and explain it in your own words.</div></div><div class=\"q\"><div class=\"qn\">Question 3 — Self-Check</div><div class=\"qt\">Rate how confident you feel with today's session:</div><div class=\"mc\"><div class=\"mco\"><div class=\"bub\"></div>😄 I could teach this to someone else</div><div class=\"mco\"><div class=\"bub\"></div>🙂 I understand it well</div><div class=\"mco\"><div class=\"bub\"></div>🤔 I need a bit more practice</div><div class=\"mco\"><div class=\"bub\"></div>😕 I need to review this with my teacher</div></div></div>", "lesson": 3}, {"id": "ORAL3", "cat": "oral", "title": "Oral Review Script — S3: Shirk, Du'a & the Five Heart-Worship Acts", "badge": "Teacher-Led Drill · S3", "points": null, "html": "<div class=\"sh-hdr\"><div class=\"sh-top\"><div class=\"sh-title\">Oral Review — Shirk, Du'a & Heart Worship</div><div class=\"sh-badge\">Teacher-Led Drill · S3</div></div><div class=\"sh-meta\"><div class=\"mf\"><div class=\"ml\">Teacher</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Date</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Class</div><div class=\"mv\"></div></div></div></div><div class=\"note\"><b>Note:</b> Whole-class call-and-response. Say the prompt, point to a student (or the whole class), then reveal the expected answer. Move fast — this is retrieval practice, not re-teaching.</div><div class=\"sec-hd\"><h3>Call & Response</h3></div><div class=\"oral\"><div class=\"oral-row\"><div class=\"oral-n\">1</div><div class=\"oral-p\">What does the text call Shirk?</div><div class=\"oral-a\">أَعْظَمُ ذَنْبٍ عُصِيَ اللهُ بِهِ — the greatest sin</div></div><div class=\"oral-row\"><div class=\"oral-n\">2</div><div class=\"oral-p\">What is a نِدّ?</div><div class=\"oral-a\">A rival — something made equal to Allah in worship</div></div><div class=\"oral-row\"><div class=\"oral-n\">3</div><div class=\"oral-p\">Name the 5 acts that become Shirk when directed elsewhere.</div><div class=\"oral-a\">يَدْعُوهُ (calling), يَرْجُوهُ (hoping), يَخَافُهُ (fearing), يَتَوَكَّلُ عَلَيْهِ (relying), يَرْغَبُ إِلَيْهِ (desiring)</div></div><div class=\"oral-row\"><div class=\"oral-n\">4</div><div class=\"oral-p\">What does Al-Ma'idah 5:72 say happens to a Mushrik?</div><div class=\"oral-a\">Paradise is forbidden to him; his home is the Fire</div></div><div class=\"oral-row\"><div class=\"oral-n\">5</div><div class=\"oral-p\">What is the WEAK hadith about du'a, and what is the AUTHENTIC one?</div><div class=\"oral-a\">Weak: الدُّعَاءُ مُخُّ الْعِبَادَةِ (Tirmidhi, da'if). Sahih: الدُّعَاءُ هُوَ الْعِبَادَةُ (Ahmad, sahih)</div></div><div class=\"oral-row\"><div class=\"oral-n\">6</div><div class=\"oral-p\">Name the 5 heart-worship types.</div><div class=\"oral-a\">الْخَوْفُ، الرَّجَاءُ، التَّوَكُّلُ، الرَّغْبَةُ وَالرَّهْبَةُ، الإِنَابَةُ</div></div><div class=\"oral-row\"><div class=\"oral-n\">7</div><div class=\"oral-p\">What ayah proves Khawf (fear) belongs to Allah alone?</div><div class=\"oral-a\">Al Imran 3:175</div></div><div class=\"oral-row\"><div class=\"oral-n\">8</div><div class=\"oral-p\">What is the key rule about all 5 heart-worship types?</div><div class=\"oral-a\">If directed to other than Allah, it is Shirk</div></div></div>", "lesson": 3}, {"id": "VOCAB3", "cat": "vocab", "title": "Vocabulary & Flashcards — S3: Shirk, Du'a & the Five Heart-Worship Acts", "badge": "Arabic Terms · S3", "points": 7, "html": "<div class=\"sh-hdr\"><div class=\"sh-top\"><div class=\"sh-title\">Vocabulary Review — Shirk, Du'a & Heart Worship</div><div class=\"sh-badge\">Arabic Terms · S3</div></div><div class=\"sh-meta\"><div class=\"mf\"><div class=\"ml\">Name</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Date</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Score</div><div class=\"mv\"></div></div></div></div><div class=\"sec-hd\"><h3>Flashcards — cut along the lines</h3></div><div class=\"fc-grid\"><div class=\"fc\"><div class=\"fc-front\"><span class=\"qar\" style=\"font-size:1.6rem;\">الشِّرْكُ</span><div class=\"fc-tr\">Ash-Shirk</div></div><div class=\"fc-back\">Associating partners with Allah — the greatest sin</div></div><div class=\"fc\"><div class=\"fc-front\"><span class=\"qar\" style=\"font-size:1.6rem;\">النِّدُّ</span><div class=\"fc-tr\">An-Nidd</div></div><div class=\"fc-back\">A rival / equal given to Allah in worship</div></div><div class=\"fc\"><div class=\"fc-front\"><span class=\"qar\" style=\"font-size:1.6rem;\">الدُّعَاءُ</span><div class=\"fc-tr\">Ad-Du'a</div></div><div class=\"fc-back\">Supplication — th ass=\"ml\">Names</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Date</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\"></div><div class=\"mv\"></div></div></div></div><div class=\"note\"><b>Note:</b> Work with a partner. Take turns — both partners must speak, write, and be ready to be called on.</div><div class=\"sec-hd\"><h3>Task</h3></div><div class=\"q\"><div class=\"qn\">Question 1</div><div class=\"qt\">Take turns: Partner A names one of the 5 Pillars, Partner B gives its Qur'anic proof (Surah & Ayah). Do all 5, then switch who goes first.</div></div><div class=\"q\"><div class=\"qn\">Question 2</div><div class=\"qt\">Together, list 2 examples in modern life of something that could become a Taghut if a person goes too far with obeying or following it. Write them:</div></div><div class=\"als\"><div class=\"aline\"></div><div class=\"aline\"></div></div>", "lesson": 4}, {"id": "GRP4", "cat": "collab", "title": "Group Activity — S4: Rejecting the Taghut, Q5 & the Five Pillars", "badge": "Small Group · S4", "points": null, "html": "<div class=\"sh-hdr\"><div class=\"sh-top\"><div class=\"sh-title\">Group Activity — Rejecting the Taghut, Q5 & the Five Pillars</div><div class=\"sh-badge\">Small Group · S4</div></div><div class=\"sh-meta\"><div class=\"mf\"><div class=\"ml\">Group Members</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Date</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\"></div><div class=\"mv\"></div></div></div></div><div class=\"note\"><b>Note:</b> Groups of 3-4. Assign roles: Reader, Recorder, Reporter, Timekeeper. Every group presents for 60 seconds when done.</div><div class=\"sec-hd\"><h3>Task</h3></div><div class=\"q\"><div class=\"qn\">Question 1</div><div class=\"qt\">Build a two-column chart: \"5 Pillars of Islam\" with Arabic name + English + proof ayah for each. Each group member takes 1-2 pillars. Combine into one chart and present.</div></div>", "l
