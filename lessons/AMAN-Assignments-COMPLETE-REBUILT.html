<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>AMAN — Teaching Children Tawhid · Complete Assessment System</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Lora:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>

:root{
  --g:#1A5C25;--g2:#2E7D32;--gp:#E8F5E9;
  --gold:#C8960C;--gold2:#F5C518;--goldp:#FFF8E1;
  --navy:#0C1F3F;--cream:#FAFAF5;
  --ink:#111827;--ink2:#374151;--mu:#6B7280;--bd:#D1D5DB;
  --Fa:'Amiri',serif;--Fd:'Lora',serif;--Fb:'Inter',sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:var(--Fb);background:var(--cream);color:var(--ink);font-size:14px;line-height:1.6;}

/* ── HEADER ── */
.hdr{background:var(--g);padding:12px 24px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;}
.hdr h1{font-family:var(--Fd);font-size:.92rem;color:#fff;font-weight:700;}
.hdr p{font-size:.62rem;color:rgba(255,255,255,.45);text-transform:uppercase;letter-spacing:.07em;}
.hdr-btns{display:flex;gap:6px;flex-wrap:wrap;}
.hbtn{padding:5px 12px;border-radius:6px;font-size:.76rem;font-weight:600;cursor:pointer;border:1.5px solid rgba(255,255,255,.3);color:#fff;background:transparent;font-family:var(--Fb);transition:.15s;}
.hbtn.gold{background:var(--gold2);color:var(--navy);border-color:var(--gold2);}

/* ── TABS ── */
.tab-bar{background:var(--navy);display:flex;gap:2px;padding:10px 20px 0;overflow-x:auto;}
.tab-bar::-webkit-scrollbar{display:none;}
.tbtn{padding:9px 18px;border-radius:8px 8px 0 0;font-size:.8rem;font-weight:700;cursor:pointer;border:none;background:rgba(255,255,255,.1);color:rgba(255,255,255,.55);font-family:var(--Fb);transition:.15s;white-space:nowrap;}
.tbtn.active{background:var(--cream);color:var(--g);}

/* ── PAGE ── */
.page{max-width:860px;margin:0 auto;padding:24px 20px 60px;}
.tab-pane{display:none;}.tab-pane.active{display:block;}
.assign-bar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:20px;}
.abtn{padding:5px 13px;border-radius:20px;font-size:.74rem;font-weight:600;cursor:pointer;border:1.5px solid var(--bd);background:#fff;color:var(--ink2);font-family:var(--Fb);transition:.15s;}
.abtn.active{background:var(--g);color:#fff;border-color:var(--g);}
.sheet{display:none;}.sheet.active{display:block;}
.pr-row{display:flex;gap:7px;margin-bottom:18px;flex-wrap:wrap;}
.pr-btn{padding:6px 14px;border-radius:6px;font-size:.76rem;font-weight:600;cursor:pointer;border:none;font-family:var(--Fb);}
.pr-btn.g{background:var(--g);color:#fff;} .pr-btn.gl{background:var(--gold2);color:var(--navy);}

/* ── SHEET HEADER ── */
.sh-hdr{border:2.5px solid var(--g);border-radius:9px;padding:14px 18px;margin-bottom:18px;}
.sh-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.sh-title{font-family:var(--Fd);font-size:1.05rem;color:var(--g);font-weight:700;}
.sh-badge{background:var(--g);color:#fff;border-radius:5px;padding:2px 9px;font-size:.7rem;font-weight:700;}
.sh-meta{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
.mf{display:flex;flex-direction:column;gap:2px;}
.ml{font-size:.62rem;font-weight:700;color:var(--mu);text-transform:uppercase;letter-spacing:.07em;}
.mv{border-bottom:1.5px solid var(--ink);height:22px;}

/* ── SECTIONS ── */
.sec{margin-bottom:20px;}
.sec-hd{display:flex;align-items:center;gap:8px;background:var(--g);color:#fff;padding:6px 13px;border-radius:6px;margin-bottom:10px;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
.sec-hd h3{font-family:var(--Fd);font-size:.86rem;font-weight:700;}
.pts{margin-left:auto;font-size:.7rem;opacity:.8;background:rgba(255,255,255,.2);padding:1px 7px;border-radius:4px;}

/* ── QUESTIONS ── */
.q{margin-bottom:12px;padding:11px 13px;background:#fff;border-radius:7px;border:1px solid var(--bd);border-left:3px solid var(--g);}
.qn{font-size:.65rem;font-weight:700;color:var(--g);text-transform:uppercase;letter-spacing:.07em;margin-bottom:4px;}
.qt{font-size:.875rem;color:var(--ink2);line-height:1.65;margin-bottom:6px;}
.qar{font-family:var(--Fa);font-size:1.2rem;direction:rtl;text-align:right;color:var(--g);display:block;margin:6px 0;}

/* ── ANSWER AREAS ── */
.al{border-bottom:1.5px solid var(--bd);height:26px;margin-bottom:6px;}
.als{display:flex;flex-direction:column;gap:8px;margin-top:6px;}
.aline{border-bottom:1.5px solid var(--bd);height:28px;}
.fib{display:inline-block;border-bottom:1.5px solid var(--bd);min-width:90px;margin:0 3px;}
.fib-lg{display:inline-block;border-bottom:1.5px solid var(--bd);min-width:140px;margin:0 3px;}

/* ── MC ── */
.mc{display:flex;flex-direction:column;gap:5px;margin-top:6px;}
.mco{display:flex;align-items:flex-start;gap:7px;padding:5px 9px;border-radius:5px;border:1.5px solid var(--bd);font-size:.855rem;color:var(--ink2);}
.bub{width:17px;height:17px;border-radius:50%;border:2px solid var(--bd);flex-shrink:0;margin-top:1px;}

/* ── MATCHING ── */
.match-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px;}
.match-col h4{font-size:.68rem;font-weight:700;color:var(--mu);text-transform:uppercase;letter-spacing:.07em;margin-bottom:5px;}
.mi{display:flex;align-items:center;gap:6px;padding:6px 9px;border-radius:5px;border:1.5px solid var(--bd);font-size:.83rem;color:var(--ink2);margin-bottom:4px;}
.mn{width:20px;height:20px;border-radius:50%;background:var(--g);color:#fff;display:flex;align-items:center;justify-content:center;font-size:.66rem;font-weight:700;flex-shrink:0;}
.mlt{width:20px;height:20px;border-radius:50%;border:2px solid var(--bd);display:flex;align-items:center;justify-content:center;font-size:.7rem;font-weight:700;flex-shrink:0;color:var(--mu);}
.mblk{width:24px;border-bottom:1.5px solid var(--bd);margin-right:4px;text-align:center;font-size:.8rem;flex-shrink:0;}

/* ── TABLE ── */
.tbl{width:100%;border-collapse:collapse;margin-top:7px;font-size:.81rem;}
.tbl th{background:var(--g);color:#fff;padding:7px 9px;text-align:left;font-weight:600;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
.tbl td{padding:7px 9px;border-bottom:1px solid var(--bd);vertical-align:top;}
.tbl tr:nth-child(even) td{background:var(--gp);}
.wc{min-height:26px;}

/* ── WORD BANK ── */
.wb{background:var(--goldp);border:1.5px solid var(--gold);border-radius:7px;padding:9px 13px;margin-bottom:12px;}
.wb h4{font-size:.66rem;font-weight:700;color:var(--gold);text-transform:uppercase;letter-spacing:.07em;margin-bottom:5px;}
.words{display:flex;flex-wrap:wrap;gap:5px;}
.word{background:#fff;border:1.5px solid var(--gold);border-radius:4px;padding:2px 9px;font-size:.8rem;font-weight:600;color:var(--g);}

/* ── AYAH BOX ── */
.ab{background:var(--gp);border-left:3px solid var(--g2);border-radius:0 7px 7px 0;padding:9px 13px;margin:7px 0;}
.ab .ar{font-family:var(--Fa);font-size:1.1rem;direction:rtl;text-align:right;color:var(--g);display:block;margin-bottom:3px;}
.ab .tr{font-size:.8rem;color:var(--ink2);font-style:italic;}
.ab .src{font-size:.68rem;color:var(--mu);margin-top:2px;text-align:right;}

/* ── SCORE BOX ── */
.sc-box{border:2px solid var(--g);border-radius:7px;padding:10px 14px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:16px;background:#fff;}
.sc-lbl{font-size:.7rem;font-weight:700;color:var(--mu);text-transform:uppercase;letter-spacing:.07em;}
.sc-val{font-family:var(--Fd);font-size:1.05rem;color:var(--g);min-width:60px;border-bottom:1.5px solid var(--bd);}

/* ── NOTE ── */
.note{background:var(--goldp);border:1.5px solid var(--gold);border-radius:7px;padding:9px 13px;margin-bottom:12px;font-size:.82rem;color:var(--ink2);}

/* ── JOURNAL ── */
.jnl{background:#fff;border:1.5px solid var(--bd);border-radius:7px;padding:12px;margin-bottom:10px;}
.jnl h4{font-size:.82rem;font-weight:700;color:var(--g);margin-bottom:8px;padding-bottom:5px;border-bottom:1px solid var(--bd);}

/* ── LINEAGE ── */
.lin{display:flex;flex-direction:column;align-items:center;gap:4px;margin:12px auto;max-width:320px;}
.lin-box{border:1.5px solid var(--g);border-radius:6px;padding:7px 16px;text-align:center;font-family:var(--Fa);font-size:1rem;direction:rtl;color:var(--g);}
.lin-box.main{background:var(--g);color:#fff;font-size:1.1rem;font-weight:700;}
.lin-arrow{font-size:.75rem;color:var(--mu);}

/* ══ PRINT ══ */
@media print{
  body{background:#fff;font-size:10.5pt;}
  .hdr,.tab-bar,.assign-bar,.hdr-btns,.pr-row{display:none!important;}
  .page{max-width:100%;padding:0;margin:0;}
  .tab-pane{display:none!important;}
  .tab-pane.print-active{display:block!important;}
  .sheet{display:none!important;}
  .sheet.print-active{display:block!important;}
  .sheet.print-active+.sheet.print-active{page-break-before:always;}
  .sh-hdr{border:2pt solid #1A5C25;}
  .q{page-break-inside:avoid;border:1pt solid #D1D5DB;border-left:3pt solid #1A5C25;}
  .sec-hd{background:#1A5C25!important;}
  .tbl th{background:#1A5C25!important;}
  .aline,.al{border-bottom:1pt solid #D1D5DB;}
}


/* ══ NEW COMPONENTS (audit additions) ══ */
.tf{display:flex;flex-direction:column;gap:6px;margin-top:6px;}
.tfrow{display:flex;align-items:center;gap:10px;padding:7px 10px;border:1.5px solid var(--bd);border-radius:6px;background:#fff;}
.tfopt{display:flex;gap:4px;flex-shrink:0;}
.tfbub{width:22px;height:22px;border-radius:5px;border:2px solid var(--bd);display:flex;align-items:center;justify-content:center;font-size:.68rem;font-weight:700;color:var(--mu);}
.tftext{font-size:.85rem;color:var(--ink2);}

.ws{border-collapse:collapse;margin:0 auto;}
.ws td{width:22px;height:22px;text-align:center;vertical-align:middle;font-family:var(--Fb);font-size:.68rem;font-weight:700;border:1px solid var(--bd);color:var(--ink2);}
.ws-wrap{display:flex;flex-direction:column;align-items:center;gap:10px;}

.xw-wrap{display:flex;flex-direction:column;gap:14px;}
.xw{border-collapse:collapse;margin:0 auto;}
.xw td{width:24px;height:24px;border:1px solid var(--ink2);position:relative;}
.xw td.xw-blank{border:none;background:transparent;}
.xw td.xw-cell{background:#fff;}
.xw-num{position:absolute;top:0;left:1px;font-size:.5rem;font-weight:700;color:var(--g);}
.xw-clue-cols{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.xw-clue-cols h4{font-size:.72rem;font-weight:700;color:var(--g);text-transform:uppercase;letter-spacing:.06em;margin-bottom:5px;}
.xw-clues{font-size:.78rem;color:var(--ink2);padding-left:18px;line-height:1.5;}

.fc-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:8px;}
.fc{border:1.5px dashed var(--bd);border-radius:8px;padding:10px;text-align:center;background:#fff;}
.fc-front{margin-bottom:6px;}
.fc-tr{font-size:.7rem;color:var(--mu);margin-top:2px;}
.fc-back{font-size:.76rem;color:var(--g);font-weight:600;border-top:1px dashed var(--bd);padding-top:6px;}

.oral{display:flex;flex-direction:column;gap:0;margin-top:6px;border:1px solid var(--bd);border-radius:7px;overflow:hidden;}
.oral-row{display:grid;grid-template-columns:26px 1fr 1fr;gap:8px;padding:7px 10px;border-bottom:1px solid var(--bd);align-items:center;}
.oral-row:last-child{border-bottom:none;}
.oral-row:nth-child(even){background:var(--gp);}
.oral-n{font-weight:700;color:var(--g);font-size:.75rem;}
.oral-p{font-family:var(--Fa);direction:rtl;text-align:right;font-size:.92rem;color:var(--ink2);}
.oral-a{font-size:.74rem;color:var(--mu);font-style:italic;}

.unsc{display:flex;flex-direction:column;gap:8px;margin-top:6px;}
.unsc-row{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1.5px solid var(--bd);border-radius:6px;background:#fff;flex-wrap:wrap;}
.unsc-n{font-weight:700;color:var(--g);width:18px;}
.unsc-scr{font-family:var(--Fb);letter-spacing:.15em;font-weight:700;color:var(--navy);background:var(--goldp);padding:3px 9px;border-radius:5px;font-size:.85rem;}
.unsc-cl{font-size:.76rem;color:var(--mu);flex:1;min-width:120px;}

.search-row{display:flex;gap:8px;align-items:center;margin-bottom:14px;flex-wrap:wrap;}
.search-input{flex:1;min-width:180px;padding:8px 12px;border-radius:8px;border:1.5px solid var(--bd);font-family:var(--Fb);font-size:.85rem;}
.search-input:focus{outline:2px solid var(--g);border-color:var(--g);}
.lesson-filter{display:flex;gap:5px;flex-wrap:wrap;}
.lfbtn{padding:5px 11px;border-radius:16px;font-size:.72rem;font-weight:600;cursor:pointer;border:1.5px solid var(--bd);background:#fff;color:var(--ink2);}
.lfbtn.active{background:var(--navy);color:#fff;border-color:var(--navy);}
.no-results{padding:30px;text-align:center;color:var(--mu);font-style:italic;}

.progress-chip{display:inline-flex;align-items:center;gap:5px;font-size:.68rem;color:rgba(255,255,255,.7);}
.pcheck{width:16px;height:16px;cursor:pointer;}

.calc-row{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap;}
.calc-row input{width:70px;padding:5px 8px;border-radius:5px;border:1.5px solid var(--bd);font-size:.85rem;}
.calc-btn{padding:5px 12px;border-radius:6px;font-size:.75rem;font-weight:600;cursor:pointer;border:none;background:var(--g);color:#fff;}
.calc-result{font-weight:700;color:var(--g);font-size:.9rem;}

/* ══ ACCESSIBILITY ══ */
.hbtn:focus-visible,.tbtn:focus-visible,.abtn:focus-visible,.lfbtn:focus-visible,.calc-btn:focus-visible{outline:3px solid var(--gold2);outline-offset:2px;}
.mv:focus-within,.al:focus-within{outline:2px solid var(--g);}
.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;}

/* ══ MOBILE RESPONSIVE (was entirely missing) ══ */
@media (max-width:640px){
  body{font-size:13px;}
  .hdr{padding:10px 12px;}
  .hdr h1{font-size:.8rem;}
  .hdr-btns{width:100%;justify-content:flex-start;}
  .tab-bar{padding:8px 10px 0;}
  .tbtn{padding:7px 12px;font-size:.72rem;}
  .page{padding:14px 10px 50px;}
  .sh-meta{grid-template-columns:1fr;}
  .match-grid{grid-template-columns:1fr;}
  .fc-grid{grid-template-columns:repeat(2,1fr);}
  .oral-row{grid-template-columns:20px 1fr;}
  .oral-a{grid-column:2;}
  .xw-clue-cols{grid-template-columns:1fr;}
  .tbl{font-size:.72rem;}
  .tbl th,.tbl td{padding:5px 6px;}
  .search-row{flex-direction:column;align-items:stretch;}
}
@media (max-width:400px){
  .ws td,.xw td{width:18px;height:18px;font-size:.58rem;}
}

/* ══ FUNCTIONAL SCORE CALCULATOR (fix: was dead code before) ══ */
.sc-input{width:56px;padding:4px 6px;border-radius:5px;border:1.5px solid var(--bd);font-size:.9rem;font-weight:700;text-align:center;margin-top:2px;}
.sc-input:focus{outline:2px solid var(--g);}
.sc-pct{font-size:.72rem;color:var(--g);font-weight:700;margin-top:2px;min-height:14px;}

</style>
</head>
<body>
<header class="hdr">
  <div>
    <h1>AMAN — Teaching Children Tawhid · Complete Assessment System</h1>
    <p>Al-Madrasatu An-Nuriyyah · Based on the Arabic treatise of Shaykh Muhammad ibn Abd al-Wahhab · Audited &amp; rebuilt against the corrected lesson slides</p>
  </div>
  <div class="hdr-btns">
    <button class="hbtn" onclick="printCurrent()" aria-label="Print the currently open sheet">🖨 Print Current</button>
    <button class="hbtn" onclick="printSection()" aria-label="Print all sheets in this tab">🖨 Print Tab</button>
    <button class="hbtn gold" onclick="printAll()" aria-label="Print the entire assessment system">🖨 Print All</button>
  </div>
</header>

<nav class="tab-bar" id="tabBar" role="tablist" aria-label="Assessment categories"></nav>

<main class="page">
  <div class="search-row">
    <label for="searchBox" class="visually-hidden">Search all assignments</label>
    <input type="search" id="searchBox" class="search-input" placeholder="🔍 Search all sheets (e.g. &quot;Shirk&quot;, &quot;Al-A'raf&quot;, &quot;matching&quot;)..." oninput="onSearch(this.value)">
    <div class="lesson-filter" role="group" aria-label="Filter by lesson">
      <button class="lfbtn active" onclick="setLessonFilter('all',this)">All Lessons</button>
      <button class="lfbtn" onclick="setLessonFilter('1',this)">L1</button>
      <button class="lfbtn" onclick="setLessonFilter('2',this)">L2</button>
      <button class="lfbtn" onclick="setLessonFilter('3',this)">L3</button>
      <button class="lfbtn" onclick="setLessonFilter('4',this)">L4</button>
      <button class="lfbtn" onclick="setLessonFilter('5',this)">L5</button>
      <button class="lfbtn" onclick="setLessonFilter('6',this)">L6</button>
      <button class="lfbtn" onclick="setLessonFilter('7',this)">L7</button>
      <button class="lfbtn" onclick="setLessonFilter('8',this)">Review</button>
      <button class="lfbtn" onclick="setLessonFilter('0',this)">Cross-Lesson</button>
    </div>
  </div>
  <div class="assign-bar" id="assignBar" role="tablist" aria-label="Sheets in this category"></div>
  <div id="sheetWrap"></div>
</main>

<iframe id="printFrame" title="Print output" style="position:absolute;width:0;height:0;border:0;visibility:hidden;"></iframe>

<script>
const SHEETS = [{"id": "CW1", "cat": "classwork", "lesson": 1, "title": "CW 1 — مَنْ رَبُّكَ؟ / مَا مَعْنَى الرَّبِّ؟", "badge": "Classwork · L1", "points": 30, "html": "<div class=\"sh-hdr\"><div class=\"sh-top\"><div class=\"sh-title\">CW 1 — مَنْ رَبُّكَ؟ / مَا مَعْنَى الرَّبِّ؟</div><div class=\"sh-badge\">Classwork · L1</div></div><div class=\"sh-meta\"><div class=\"mf\"><div class=\"ml\">Name</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Date</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Score</div><div class=\"mv\"></div></div></div></div><div class=\"sec-hd\"><h3>Part A — Q1 Arabic Drill</h3><span class=\"pts\">10 pts</span></div><div class=\"q\"><div class=\"qn\">Question 1</div><div class=\"qt\">Write the full Arabic Q&A for Question 1, exactly as the Imam wrote it on page 7, then give the English meaning of the answer.</div></div><div class=\"qt\">Question (السُّؤَال):</div><div class=\"al\"></div><div class=\"qt\">Answer (الجَوَاب):</div><div class=\"al\"></div><div class=\"qt\">English meaning of the answer:</div><div class=\"al\"></div><div class=\"q\"><div class=\"qn\">Question 2</div><div class=\"qt\">The Imam introduces this treatise stating his goal for the child. Complete his exact Arabic statement, then explain what the two missing words mean and why the Imam chose them.</div></div><span class=\"qar\">حَتَّى يَصِيرَ مُسْلِمًا ______ عَلَى فِطْرَةِ الإِسْلَامِ، وَمُوَحِّدًا ______ عَلَى طَرِيقَةِ الإِيمَانِ</span><div class=\"als\"><div class=\"aline\"></div><div class=\"aline\"></div><div class=\"aline\"></div></div><div class=\"sec-hd\"><h3>Part B — Q2: The 6 Terms of ar-Rabb</h3><span class=\"pts\">12 pts</span></div><div class=\"note\"><b>Textual Note:</b> The plain Arabic printing of this booklet gives the shorter form <b>الْمَالِكُ الْمَعْبُودُ</b> only. The fuller six-term wording below follows the published English translation used in this unit. Both are legitimate readings of the Imam's meaning — your teacher will tell you which one to memorize word-for-word.</div><div class=\"q\"><div class=\"qn\">Question 3</div><div class=\"qt\">The Imam answers Q2 with 6 Arabic terms (fuller reading). Write ALL 6, their English meanings, and one sentence explaining what each tells us about Allah:</div></div><table class=\"tbl\"><thead><tr><th>#</th><th>Arabic Term (p.7-8)</th><th>English Meaning</th><th>What this tells us about Allah</th></tr></thead><tbody><tr><td class=\"wc\">1</td><td class=\"wc\"></td><td class=\"wc\"></td><td class=\"wc\"></td></tr><tr><td class=\"wc\">2</td><td class=\"wc\"></td><td class=\"wc\"></td><td class=\"wc\"></td></tr><tr><td class=\"wc\">3</td><td class=\"wc\"></td><td class=\"wc\"></td><td class=\"wc\"></td></tr><tr><td class=\"wc\">4</td><td class=\"wc\"></td><td class=\"wc\"></td><td class=\"wc\"></td></tr><tr><td class=\"wc\">5</td><td class=\"wc\"></td><td class=\"wc\"></td><td class=\"wc\"></td></tr><tr><td class=\"wc\">6</td><td class=\"wc\"></td><td class=\"wc\"></td><td class=\"wc\"></td></tr></tbody></table><div class=\"sec-hd\"><h3>Part C — The Name \"Allah\" and La ilaha illa Allah</h3><span class=\"pts\">8 pts</span></div><div class=\"q\"><div class=\"qn\">Question 4</div><div class=\"qt\">The Imam defines \"Allah\" on page 8. Write his Arabic definition and translate it:</div></div><div class=\"qt\">Arabic:</div><div class=\"al\"></div><div class=\"qt\">Translation:</div><div class=\"al\"></div><div class=\"q\"><div class=\"qn\">Question 5</div><div class=\"qt\">The Imam says La ilaha illa Allah means: لَا مَعْبُودَ ______ إِلَّا اللَّهُ. What is the missing key word, and why is it crucial to the correct meaning?</div></div><div class=\"als\"><div class=\"aline\"></div><div class=\"aline\"></div></div><div class=\"sec-hd\"><h3>Part D — Quranic Proof & Fitrah</h3><span class=\"pts\">10 pts</span></div><div class=\"q\"><div class=\"qn\">Question 6</div><div class=\"qt\">The Imam uses Al-A'raf 7:54 as proof for Q1, Q2,  class=\"sh-top\"><div class=\"sh-title\">CW 2 — بِمَ تَعْرِفُ رَبَّكَ؟ (Signs & Creation)</div><div class=\"sh-badge\">Classwork · L2</div></div><div class=\"sh-meta\"><div class=\"mf\"><div class=\"ml\">Name</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Date</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Score</div><div class=\"mv\"></div></div></div></div><div class=\"sec-hd\"><h3>Part A — Q3 Full Answer from the Book</h3><span class=\"pts\">12 pts</span></div><div class=\"q\"><div class=\"qn\">Question 1</div><div class=\"qt\">Write the full Arabic answer to Q3 exactly as on pages 8-9, then list each example the Imam gives:</div></div><div class=\"qt\">Full Arabic answer:</div><div class=\"al\"></div><div class=\"qt\">From His Signs (الآيَات) — all 4 from the book:</div><div class=\"al\"></div><div class=\"qt\">From His Creation (الْمَخْلُوقَات) — from the book:</div><div class=\"al\"></div><div class=\"q\"><div class=\"qn\">Question 2</div><div class=\"qt\">Sort these items into the correct column. Each belongs to ONE category:</div></div><div class=\"wb\"><h4>Word Bank</h4><div class=\"words\"><span class=\"word\">Night coming</span><span class=\"word\">A mountain</span><span class=\"word\">The sunrise</span><span class=\"word\">The ocean</span><span class=\"word\">Moonlight</span><span class=\"word\">An elephant</span><span class=\"word\">Your heartbeat</span><span class=\"word\">A galaxy</span></div></div><table class=\"tbl\"><thead><tr><th>SIGNS — Things Allah DOES (الآيَات)</th><th>CREATION — Things Allah MADE (الْمَخْلُوقَات)</th></tr></thead><tbody><tr><td class=\"wc\"></td><td class=\"wc\"></td></tr><tr><td class=\"wc\"></td><td class=\"wc\"></td></tr><tr><td class=\"wc\"></td><td class=\"wc\"></td></tr><tr><td class=\"wc\"></td><td class=\"wc\"></td></tr></tbody></table><div class=\"sec-hd\"><h3>Part B — The Critical Distinction</h3><span class=\"pts\">10 pts</span></div><div class=\"q\"><div class=\"qn\">Question 3</div><div class=\"qt\">Explain in your own words the difference between a Sign (āyah) and Creation (makhluq). Use the Imam's own phrase أَلَا لَهُ الْخَلْقُ وَالْأَمْر to support your answer:</div></div><div class=\"als\"><div class=\"aline\"></div><div class=\"aline\"></div><div class=\"aline\"></div></div><div class=\"q\"><div class=\"qn\">Question 4</div><div class=\"qt\">The Imam uses ONE ayah as proof for THREE questions (Q1, Q2, and Q3). Draw a diagram connecting the key phrase from Al-A'raf 7:54 to each question it answers:</div></div><div class=\"al\" style=\"height:70px;\"></div><div class=\"sec-hd\"><h3>Part C — Tafakkur: The Scale of Creation</h3><span class=\"pts\">6 pts</span></div><div class=\"note\"><b>Enrichment:</b> This ayah is AMAN's own contemplation addition to bring the Imam's point to life — it is not one the Imam himself quotes in the treatise, but it illustrates exactly what he means by \"His creation.\"</div><div class=\"ab\"><span class=\"ar\">وَهُوَ الَّذِي خَلَقَ اللَّيْلَ وَالنَّهَارَ وَالشَّمْسَ وَالْقَمَرَ ۖ كُلٌّ فِي فَلَكٍ يَسْبَحُونَ</span><div class=\"tr\">\"And it is He who created the night and the day and the sun and the moon — each floating in an orbit.\"</div><div class=\"src\">Al-Anbiya 21:33</div></div><div class=\"q\"><div class=\"qn\">Question 5</div><div class=\"qt\">يَسْبَحُونَ means \"they are swimming.\" Scientists count over 2 trillion galaxies. Explain in 2-3 sentences how this ayah deepens your answer to Q3 (بِمَ تَعْرِفُ رَبَّكَ؟):</div></div><div class=\"als\"><div class=\"aline\"></div><div class=\"aline\"></div><div class=\"aline\"></div></div><div class=\"sec-hd\"><h3>Part D — Reflection & Application</h3><span class=\"pts\">8 pts</span></div><div class=\"q\"><div class=\"qn\">Question 6</div><div class=\"qt\">Look around you right now. Name ONE Sign and ONE piece of Creation. For each, explain specifically HOW it proves Allah exists and is in control:</div></div><div class=\"qt\">Sign I observe:< </h3><span class=\"pts\">12 pts</span></div><div class=\"wb\"><h4>Word Bank</h4><div class=\"words\"><span class=\"word\">worship</span><span class=\"word\">alone</span><span class=\"word\">partner</span><span class=\"word\">obedience</span><span class=\"word\">commanded</span><span class=\"word\">prohibited</span></div></div><div class=\"q\"><div class=\"qn\">Question 1</div><div class=\"qt\">Write Q4's full answer in Arabic (p.9-10), then translate using the word bank:</div></div><div class=\"qt\">Arabic:</div><div class=\"al\"></div><div class=\"qt\">To ______ Him ______, without associating any ______ with Him, and ______ to Him by carrying out what He ______ and abandoning what He ______.</div><div class=\"q\"><div class=\"qn\">Question 2</div><div class=\"qt\">The Imam brings TWO Quranic proofs for Q4. For each, write the Arabic phrase, the reference, and what it proves:</div></div><table class=\"tbl\"><thead><tr><th>#</th><th>Arabic phrase from the proof</th><th>Surah & Ayah</th><th>What it specifically proves</th></tr></thead><tbody><tr><td class=\"wc\">Proof 1</td><td class=\"wc\"></td><td class=\"wc\"></td><td class=\"wc\"></td></tr><tr><td class=\"wc\">Proof 2</td><td class=\"wc\"></td><td class=\"wc\"></td><td class=\"wc\"></td></tr></tbody></table><div class=\"qt\">Why does the Imam bring TWO proofs instead of one? What does each add?</div><div class=\"als\"><div class=\"aline\"></div><div class=\"aline\"></div></div><div class=\"sec-hd\"><h3>Part B — Ibadah: The Imam's Definition from p.11</h3><span class=\"pts\">12 pts</span></div><div class=\"q\"><div class=\"qn\">Question 3</div><div class=\"qt\">Write the Imam's definition of Ibadah (quoting Ibn Taymiyyah, p.11) in Arabic and English:</div></div><div class=\"qt\">Arabic:</div><div class=\"al\"></div><div class=\"qt\">English:</div><div class=\"al\"></div><div class=\"note\"><b>Correction:</b> Read carefully: the Imam's definition splits into <b>THREE</b> categories, not four. Only the <i>a'mal</i> (actions) are split into inward/outward — <i>aqwal</i> (statements) stands as ONE category on its own.</div><div class=\"q\"><div class=\"qn\">Question 4</div><div class=\"qt\">The definition has 3 categories. Give a real daily-life example for each:</div></div><table class=\"tbl\"><thead><tr><th>Category</th><th>What it includes</th><th>My personal daily-life example</th></tr></thead><tbody><tr><td class=\"wc\">أَقْوَال — Statements (spoken or silent)</td><td class=\"wc\">Shahadah, dhikr, du'a, Quran recitation, telling the truth</td><td class=\"wc\"></td></tr><tr><td class=\"wc\">أَعْمَال ظَاهِرَة — Outward Actions</td><td class=\"wc\">Salah, fasting, Hajj, helping someone</td><td class=\"wc\"></td></tr><tr><td class=\"wc\">أَعْمَال بَاطِنَة — Inward Actions</td><td class=\"wc\">Love, fear, hope, trust in Allah</td><td class=\"wc\"></td></tr></tbody></table><div class=\"sec-hd\"><h3>Part C — Application</h3><span class=\"pts\">6 pts</span></div><div class=\"q\"><div class=\"qn\">Question 5</div><div class=\"qt\">A student says: \"I only need to worship Allah in my prayer times — the rest of my day is mine.\" Using the Imam's definition of Ibadah AND the answer to Q4, explain fully why this student is mistaken. Give 3 specific examples of daily actions that ARE worship if done with the right intention:</div></div><div class=\"als\"><div class=\"aline\"></div><div class=\"aline\"></div><div class=\"aline\"></div><div class=\"aline\"></div></div><div class=\"sc-box\"><div><div class=\"sc-lbl\">Score</div><input type=\"number\" class=\"sc-input\" min=\"0\" max=\"30\" placeholder=\"0\" aria-label=\"Enter earned score out of 30\" oninput=\"var p=this.value; var out=this.parentElement.querySelector('.sc-pct'); var g=this.closest('.sc-box').querySelector('.sc-grade'); if(p===''){out.textContent='';g.textContent='';return;} var pct=Math.round((p/30)*1000)/10; out.textContent=pct+'%'; g.textContent = pct>=90?'A':pct>=80?'B':pct>=70?'C':pct>=60?'D':'F';\"><div class=\"sc-pct <td class=\"wc\">4</td><td class=\"wc\"></td><td class=\"wc\"></td><td class=\"wc\"></td></tr><tr><td class=\"wc\">5</td><td class=\"wc\"></td><td class=\"wc\"></td><td class=\"wc\"></td></tr></tbody></table><div class=\"sec-hd\"><h3>Part B — Five Proofs the Imam Brings</h3><span class=\"pts\">12 pts</span></div><div class=\"q\"><div class=\"qn\">Question 3</div><div class=\"qt\">The Imam brings FIVE Quranic proofs about sincerity of worship and Du'a (p.12-14). For each, write the reference, the key Arabic phrase, and what it proves:</div></div><table class=\"tbl\"><thead><tr><th>#</th><th>Reference</th><th>Key Arabic phrase</th><th>What this proves</th></tr></thead><tbody><tr><td class=\"wc\">Proof 1 (Du'a)</td><td class=\"wc\"></td><td class=\"wc\"></td><td class=\"wc\"></td></tr><tr><td class=\"wc\">Proof 2 (Du'a)</td><td class=\"wc\"></td><td class=\"wc\"></td><td class=\"wc\"></td></tr><tr><td class=\"wc\">Proof 3 (Du'a)</td><td class=\"wc\"></td><td class=\"wc\"></td><td class=\"wc\"></td></tr><tr><td class=\"wc\">Proof 4 (Sincerity)</td><td class=\"wc\"></td><td class=\"wc\"></td><td class=\"wc\"></td></tr><tr><td class=\"wc\">Proof 5 (Complete mission)</td><td class=\"wc\"></td><td class=\"wc\"></td><td class=\"wc\"></td></tr></tbody></table><div class=\"note\"><b>Note:</b> Proof 2 (Al-Mu'minun 23:117) uses the word كَافِرُون. What does this tell us about the severity of Du'a directed to other than Allah? Answer below.</div><div class=\"als\"><div class=\"aline\"></div><div class=\"aline\"></div></div><div class=\"q\"><div class=\"qn\">Question 4</div><div class=\"qt\">Az-Zumar 39:14 and Ar-Ra'd 13:36 are TWO MORE proofs the Imam brings on page 14 — beyond the three Du'a ayahs. Write both in Arabic, and explain what each adds that the Du'a ayahs do not:</div></div><div class=\"ab\"><span class=\"ar\">قُلِ اللَّهَ أَعْبُدُ مُخْلِصًا لَّهُ دِينِي</span><div class=\"tr\">\"Say: It is Allah I worship, sincere to Him in my religion.\"</div><div class=\"src\">Az-Zumar 39:14</div></div><div class=\"ab\"><span class=\"ar\">قُلْ إِنَّمَا أُمِرْتُ أَنْ أَعْبُدَ اللَّهَ وَلَا أُشْرِكَ بِهِ ۚ إِلَيْهِ أَدْعُو وَإِلَيْهِ مَآبِ</span><div class=\"tr\">\"Say: I am only commanded to worship Allah and not associate any partner with Him. To Him I call, and to Him is my return.\"</div><div class=\"src\">Ar-Ra'd 13:36</div></div><div class=\"als\"><div class=\"aline\"></div><div class=\"aline\"></div></div><div class=\"sec-hd\"><h3>Part C — Al-Zumar 64-66 & Foundations of Iman</h3><span class=\"pts\">10 pts</span></div><div class=\"q\"><div class=\"qn\">Question 5</div><div class=\"qt\">The Imam quotes Al-Zumar 64-66 (p.14). The key phrase is: لَيَحْبَطَنَّ عَمَلُكَ. What does this mean and why is it addressed even to the Prophet ﷺ?</div></div><div class=\"als\"><div class=\"aline\"></div><div class=\"aline\"></div></div><div class=\"q\"><div class=\"qn\">Question 6</div><div class=\"qt\">The Imam lists \"foundations of Iman saving from Kufr\" (p.14). List all of them and write one ayah the Imam uses as proof:</div></div><div class=\"als\"><div class=\"aline\"></div><div class=\"aline\"></div></div><div class=\"qt\">Ayah reference:</div><div class=\"al\"></div><div class=\"sc-box\"><div><div class=\"sc-lbl\">Score</div><input type=\"number\" class=\"sc-input\" min=\"0\" max=\"34\" placeholder=\"0\" aria-label=\"Enter earned score out of 34\" oninput=\"var p=this.value; var out=this.parentElement.querySelector('.sc-pct'); var g=this.closest('.sc-box').querySelector('.sc-grade'); if(p===''){out.textContent='';g.textContent='';return;} var pct=Math.round((p/34)*1000)/10; out.textContent=pct+'%'; g.textContent = pct>=90?'A':pct>=80?'B':pct>=70?'C':pct>=60?'D':'F';\"><div class=\"sc-pct\"></div></div><div><div class=\"sc-lbl\">Out of</div><div class=\"sc-val\">34</div></div><div><div class=\"sc-lbl\">Grade</div><div class=\"sc-val sc-grade\"></div></div><div><div class=\"sc-lbl\">Comments</div><div class=\"sc-val\" style=\"min-width:140px;\"></div></div></div>"}, {"id": "CW5", "cat": "classwork", "lesson": 5, "title": "CW 5 — الطَّاغُوت & الكُفْر بِالطَّاغُوت", "badge": "Classwork · L5", "points": 30, "html": "<div class=\"sh-hdr\"><div class=\"sh-top\"><div class=\"sh-title\">CW 5 — الطَّاغُوت & الكُفْر بِالطَّاغُوت</div><div class=\"sh-badge\">Classwork · L5</div></div><div class=\"sh-meta\"><div class=\"mf\"><div class=\"ml\">Name</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Date</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Score</div><div class=\"mv\"></div></div></div></div><div class=\"sec-hd\"><h3>Part A — First Obligation: Kufr bil-Taghut (p.14)</h3><span class=\"pts\">10 pts</span></div><div class=\"q\"><div class=\"qn\">Question 1</div><div class=\"qt\">The Imam makes a crucial statement (p.14). Write it in Arabic and translate it:</div></div><span class=\"qar\">وَأَوَّلُ مَا فَرَضَ اللَّهُ عَلَى عِبَادِهِ: ______</span><div class=\"qt\">Translation:</div><div class=\"al\"></div><div class=\"q\"><div class=\"qn\">Question 2</div><div class=\"qt\">The Imam uses An-Nahl 16:36 as proof. Write the Arabic and explain what it says about every prophet's message:</div></div><div class=\"ab\"><span class=\"ar\">وَلَقَدْ بَعَثْنَا فِي كُلِّ أُمَّةٍ رَسُولًا أَنِ اعْبُدُوا اللَّهَ وَاجْتَنِبُوا الطَّاغُوتَ</span><div class=\"tr\">\"And We certainly sent into every nation a messenger: worship Allah and avoid the Taghut.\"</div><div class=\"src\">An-Nahl 16:36</div></div><div class=\"qt\">This ayah proves that the message of every prophet was: (1) ______ and (2) ______</div><div class=\"al\"></div><div class=\"qt\">Connect this to La ilaha illa Allah: the negation (لَا إِلَهَ) = ______ and the affirmation (إِلَّا اللَّهُ) = ______</div><div class=\"al\"></div><div class=\"qt\">Why does Kufr bil-Taghut come FIRST?</div><div class=\"als\"><div class=\"aline\"></div><div class=\"aline\"></div></div><div class=\"sec-hd\"><h3>Part B — Taghut: Two Definitions (p.14-15)</h3><span class=\"pts\">12 pts</span></div><div class=\"q\"><div class=\"qn\">Question 3</div><div class=\"qt\">The Imam gives his own list defining Taghut (p.14-15) — 5 types. Fill in the table:</div></div><table class=\"tbl\"><thead><tr><th>#</th><th>Type of Taghut (from the Imam's list)</th><th>Brief explanation</th></tr></thead><tbody><tr><td class=\"wc\">1</td><td class=\"wc\"></td><td class=\"wc\"></td></tr><tr><td class=\"wc\">2</td><td class=\"wc\"></td><td class=\"wc\"></td></tr><tr><td class=\"wc\">3</td><td class=\"wc\"></td><td class=\"wc\"></td></tr><tr><td class=\"wc\">4</td><td class=\"wc\"></td><td class=\"wc\"></td></tr><tr><td class=\"wc\">5</td><td class=\"wc\"></td><td class=\"wc\"></td></tr></tbody></table><div class=\"q\"><div class=\"qn\">Question 4</div><div class=\"qt\">Ibn al-Qayyim defines Taghut (quoted by the Imam from I'lam al-Muwaqqi'in 1/5). Write his Arabic definition and explain the 3 categories it includes:</div></div><span class=\"qar\">الطَّاغُوتُ: مَا تَجَاوَزَ بِهِ الْعَبْدُ حَدَّهُ مِنْ ______ أَوْ ______ أَوْ ______</span><div class=\"qt\">The key phrase \"تَجَاوَزَ حَدَّهُ\" means ______. Explain what proper limits mean for: a ruler, a scholar, a parent.</div><div class=\"als\"><div class=\"aline\"></div><div class=\"aline\"></div><div class=\"aline\"></div></div><div class=\"sec-hd\"><h3>Part C — Al-Anfal 8:39 & The Mission (p.16)</h3><span class=\"pts\">8 pts</span></div><div class=\"q\"><div class=\"qn\">Question 5</div><div class=\"qt\">The Imam quotes Al-Anfal 8:39 and defines الفِتْنَة. Write the ayah and the Imam's definition of Fitnah:</div></div><span class=\"qar\">وَقَاتِلُوهُمْ حَتَّى لَا تَكُونَ ______ وَيَكُونَ الدِّينُ لِلَّهِ</span><div class=\"qt\">The Imam says: وَالْفِتْنَةُ: ______</div><div class=\"al\"></div><div class=\"q\"><div class=\"qn\">Question 6</div><div class=\"qt\">The Imam's summary statement (p.16) says the Prophet ﷺ was sent with 3 things. List all 3 in Arabic:</div></div><div class=\"als\"><div class=\"aline\"></div><div class=\"aline\"></div><div class=\"aline\"></div></div><div class=\"sc-box\"><div><div class=\"sc-lbl\">Score</div><input type=\"number\" class=\"sc-input\" min=\"0\" max=\"30\" placeholder=\"0\" aria-label=\"Enter earned score out of 30\" oninput=\"var p=this.value; var out=this.parentElement.querySelector('.sc-pct'); var g=this.closest('.sc-box').querySelector('.sc-grade'); if(p===''){out.textContent='';g.textContent='';return;} var pct=Math.round((p/30)*1000)/10; out.textContent=pct+'%'; g.textContent = pct>=90?'A':pct>=80?'B':pct>=70?'C':pct>=60?'D':'F';\"><div class=\"sc-pct\"></div></div><div><div class=\"sc-lbl\">Out of</div><div class=\"sc-val\">30</div></div><div><div class=\"sc-lbl\">Grade</div><div class=\"sc-val sc-grade\"></div></div><div><div class=\"sc-lbl\">Comments</div><div class=\"sc-val\" style=\"min-width:140px;\"></div></div></div>"}, {"id": "CW6", "cat": "classwork", "lesson": 6, "title": "CW 6 — مَا دِينُكَ؟ (Islam: Full Definition)", "badge": "Classwork · L6", "points": 30, "html": "<div class=\"sh-hdr\"><div class=\"sh-top\"><div class=\"sh-title\">CW 6 — مَا دِينُكَ؟ (Islam: Full Definition)</div><div class=\"sh-badge\">Classwork · L6</div></div><div class=\"sh-meta\"><div class=\"mf\"><div class=\"ml\">Name</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Date</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Score</div><div class=\"mv\"></div></div></div></div><div class=\"sec-hd\"><h3>Part A — Islam is THE Religion + The 4-Component Definition</h3><span class=\"pts\">16 pts</span></div><div class=\"q\"><div class=\"qn\">Question 1</div><div class=\"qt\">The Imam's answer to Q5: فَقُلْ: ______. Two ayahs prove Islam is THE religion of Allah — write both:</div></div><div class=\"ab\"><span class=\"ar\">إِنَّ الدِّينَ عِندَ اللَّهِ الْإِسْلَامُ</span><div class=\"tr\">\"Indeed, the religion accepted by Allah is Islam.\"</div><div class=\"src\">Al-Imran 3:19</div></div><div class=\"ab\"><span class=\"ar\">وَمَن يَبْتَغِ غَيْرَ الْإِسْلَامِ دِينًا فَلَن يُقْبَلَ مِنْهُ</span><div class=\"tr\">\"And whoever seeks a religion other than Islam — it will never be accepted from them.\"</div><div class=\"src\">Al-Imran 3:85</div></div><div class=\"qt\">فَلَن means ______. Why does the Imam bring BOTH ayahs instead of just one?</div><div class=\"als\"><div class=\"aline\"></div><div class=\"aline\"></div></div><div class=\"q\"><div class=\"qn\">Question 2</div><div class=\"qt\">Write the Imam's full Arabic definition of Islam (p.15-16), then break it into its 4 components — name each in Arabic, explain it, and give a practical example from your life:</div></div><div class=\"al\"></div><table class=\"tbl\"><thead><tr><th>#</th><th>Arabic component (from the book)</th><th>What it means</th><th>How I live this</th></tr></thead><tbody><tr><td class=\"wc\">1</td><td class=\"wc\"></td><td class=\"wc\"></td><td class=\"wc\"></td></tr><tr><td class=\"wc\">2</td><td class=\"wc\"></td><td class=\"wc\"></td><td class=\"wc\"></td></tr><tr><td class=\"wc\">3</td><td class=\"wc\"></td><td class=\"wc\"></td><td class=\"wc\"></td></tr><tr><td class=\"wc\">4</td><td class=\"wc\"></td><td class=\"wc\"></td><td class=\"wc\"></td></tr></tbody></table><div class=\"sec-hd\"><h3>Part B — La Ilaha Illa Allah: Correct Meaning (p.17-18)</h3><span class=\"pts\">8 pts</span></div><div class=\"q\"><div class=\"qn\">Question 3</div><div class=\"qt\">The Imam says the meaning of La ilaha illa Allah is: لَا مَعْبُودَ حَقٍّ إِلَّا اللَّهُ. He uses Ibrahim's statement (Az-Zukhruf 43:26-28) as proof. What are the TWO parts of Ibrahim's declaration and how do they map to La ilaha illa Allah?</div></div><div class=\"qt\">Ibrahim said: إِنَّنِي بَرَاءٌ مِّمَّا تَعْبُدُونَ — this is the ______ (negation = لَا إِلَهَ)</div><div class=\"qt\">Then: إِلَّا الَّذِي فَطَرَنِي — this is the ______ (affirmation = إِلَّا اللَّهُ)</div><div class=\"qt\">Why is the word حَقّ (in truth) the key to the correct meaning?</div><div class=\"als\"><div class=\"aline\"></div><div class=\"aline\"></div></div><div class=\"q\"><div class=\"qn\">Question 4</div><div class=\"qt\">The Imam also notes (p.19): فَبَدَأَ فِي هَذِهِ الآيَةِ بِالتَّوْحِيدِ وَالْبَرَاءَةِ مِنَ الشِّرْكِ — commenting on Al-Bayyinah 98:5. What is his point, and why must Tawhid AND freedom from Shirk BOTH come first?</div></div><div class=\"als\"><div class=\"aline\"></div><div class=\"aline\"></div></div><div class=\"sec-hd\"><h3>Part C — The 5 Pillars with All Proofs</h3><span class=\"pts\">8 pts</span></div><div class=\"q\"><div class=\"qn\">Question 5</div><div class=\"qt\">The Imam proves each pillar from Quran and Sunnah. Complete the table — all sources from the book:</div></div><table class=\"tbl\"><thead><tr><th>Pillar (Arabic name)</th><th>English</th><th>Quranic proof (Surah & Ayah)</th><th>Key note from the Imam</th></tr></thead><tbody><tr><td class=\"wc\">الشَّهَادَة</td><td class=\"wc\">Testimony of Faith</td><td class=\"wc\"></td><td class=\"wc\">From Hadith of Umar — Bukhari 4777 / Muslim 102</td></tr><tr><td class=\"wc\">الصَّلَاة</td><td class=\"wc\">Prayer</td><td class=\"wc\"></td><td class=\"wc\">Made obligatory on Al-Mi'raj WITHOUT intermediary</td></tr><tr><td class=\"wc\">الزَّكَاة</td><td class=\"wc\">Zakah</td><td class=\"wc\"></td><td class=\"wc\">In the same ayah as Salah — Al-Bayyinah 98:5</td></tr><tr><td class=\"wc\">الصِّيَام</td><td class=\"wc\">Fasting</td><td class=\"wc\"></td><td class=\"wc\">كُتِبَ عَلَيْكُمُ الصِّيَام</td></tr><tr><td class=\"wc\">الْحَجّ</td><td class=\"wc\">Hajj</td><td class=\"wc\"></td><td class=\"wc\">إِنِ اسْتَطَعْتَ — if able</td></tr></tbody></table><div class=\"sc-box\"><div><div class=\"sc-lbl\">Score</div><input type=\"number\" class=\"sc-input\" min=\"0\" max=\"30\" placeholder=\"0\" aria-label=\"Enter earned score out of 30\" oninput=\"var p=this.value; var out=this.parentElement.querySelector('.sc-pct'); var g=this.closest('.sc-box').querySelector('.sc-grade'); if(p===''){out.textContent='';g.textContent='';return;} var pct=Math.round((p/30)*1000)/10; out.textContent=pct+'%'; g.textContent = pct>=90?'A':pct>=80?'B':pct>=70?'C':pct>=60?'D':'F';\"><div class=\"sc-pct\"></div></div><div><div class=\"sc-lbl\">Out of</div><div class=\"sc-val\">30</div></div><div><div class=\"sc-lbl\">Grade</div><div class=\"sc-val sc-grade\"></div></div><div><div class=\"sc-lbl\">Comments</div><div class=\"sc-val\" style=\"min-width:140px;\"></div></div></div>"}, {"id": "CW7", "cat": "classwork", "lesson": 6, "title": "CW 7 — 6 Pillars of Iman & Al-Qadar (p.20-21)", "badge": "Classwork · L6 cont.", "points": 30, "html": "<div class=\"sh-hdr\"><div class=\"sh-top\"><div class=\"sh-title\">CW 7 — 6 Pillars of Iman & Al-Qadar</div><div class=\"sh-badge\">Classwork · L6 cont.</div></div><div class=\"sh-meta\"><div class=\"mf\"><div class=\"ml\">Name</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Date</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Score</div><div class=\"mv\"></div></div></div></div><div class=\"sec-hd\"><h3>Part A — 6 Pillars: Exact Arabic from the Book</h3><span class=\"pts\">14 pts</span></div><div class=\"q\"><div class=\"qn\">Question 1</div><div class=\"qt\">Write the Imam's full Arabic statement of the 6 Pillars (p.20-21) and its hadith source:</div></div><div class=\"qt\">Arabic:</div><div class=\"al\"></div><div class=\"qt\">Hadith source:</div><div class=\"al\"></div><div class=\"q\"><div class=\"qn\">Question 2</div><div class=\"qt\">Fill in the 6 Pillars with their Arabic names, English meanings, and the Imam's specific detail about each — this is what makes each belief REAL to you, not just a word to memorize:</div></div><table class=\"tbl\"><thead><tr><th>#</th><th>Arabic (from the book)</th><th>English</th><th>Key detail from the Imam</th></tr></thead><tbody><tr><td class=\"wc\">1</td><td class=\"wc\">الإِيمَانُ بِاللَّه</td><td class=\"wc\">Belief in Allah</td><td class=\"wc\">His existence, Lordship, Names, Attributes, exclusive right to worship</td></tr><tr><td class=\"wc\">2</td><td class=\"wc\">مَلَائِكَتِهِ</td><td class=\"wc\">His Angels</td><td class=\"wc\">Made from light; two are with you now recording everything</td></tr><tr><td class=\"wc\">3</td><td class=\"wc\">كُتُبِهِ</td><td class=\"wc\">His Books</td><td class=\"wc\">The Quran: perfectly preserved. Previous scriptures: altered</td></tr><tr><td class=\"wc\">4</td><td class=\"wc\">رُسُلِهِ</td><td class=\"wc\">His Messengers</td><td class=\"wc\">From Nuh to Muhammad ﷺ — the last, no prophet after him</td></tr><tr><td class=\"wc\">5</td><td class=\"wc\">الْيَوْمِ الآخِرِ</td><td class=\"wc\">The Last Day</td><td class=\"wc\">Resurrection, Reckoning, Jannah and Fire — all HAQQ</td></tr><tr><td class=\"wc\">6</td><td class=\"wc\">الْقَدَرِ خَيْرِهِ وَشَرِّهِ</td><td class=\"wc\">Divine Decree</td><td class=\"wc\">Good AND evil, both decreed with perfect wisdom</td></tr></tbody></table><div class=\"sec-hd\"><h3>Part B — Al-Qadar: The Hardest Pillar</h3><span class=\"pts\">8 pts</span></div><div class=\"q\"><div class=\"qn\">Question 3</div><div class=\"qt\">The Imam says al-Qadar must be believed in \"خَيْرِهِ وَشَرِّهِ.\" Why must you believe in the EVIL/difficult decrees too — not just the good? What happens to a person's Iman if they only accept the good Qadar?</div></div><div class=\"als\"><div class=\"aline\"></div><div class=\"aline\"></div><div class=\"aline\"></div></div><div class=\"q\"><div class=\"qn\">Question 4</div><div class=\"qt\">A student gets a low grade despite studying hard. They say: \"Allah must not care about me.\" Using al-Qadar AND the 5th Pillar (belief in the Last Day and Reckoning), give them a complete Islamic response:</div></div><div class=\"als\"><div class=\"aline\"></div><div class=\"aline\"></div><div class=\"aline\"></div></div><div class=\"sec-hd\"><h3>Part C — Resurrection: Foundations Saving from Kufr (p.14)</h3><span class=\"pts\">8 pts</span></div><div class=\"q\"><div class=\"qn\">Question 5</div><div class=\"qt\">The Imam says (p.14): الإِيمَانُ بِالْبَعْثِ وَالنَّشْرِ وَالْجَزَاءِ وَالْحِسَابِ وَالْجَنَّةُ وَالنَّارُ حَقٌّ. Translate all the terms and explain why the Imam calls these \"foundations saving from Kufr\":</div></div><table class=\"tbl\"><thead><tr><th>Arabic term</th><th>English meaning</th></tr></thead><tbody><tr><td class=\"wc\">الْبَعْث</td><td class=\"wc\"></td></tr><tr><td class=\"wc\">النَّشْر</td><td class=\"wc\"></td></tr><tr><td class=\"wc\">الْجَزَاء</td><td class=\"wc\"></td></tr><tr><td class=\"wc\">الْحِسَاب</td><td class=\"wc\"></td></tr><tr><td class=\"wc\">الْجَنَّة وَالنَّار حَقٌّ</td><td class=\"wc\"></td></tr></tbody></table><div class=\"q\"><div class=\"qn\">Question 6</div><div class=\"qt\">The Imam quotes Ar-Ra'd 13:5 as proof. What does this ayah say about those who deny the Resurrection, and what does the Imam conclude from it?</div></div><div class=\"als\"><div class=\"aline\"></div><div class=\"aline\"></div></div><div class=\"sc-box\"><div><div class=\"sc-lbl\">Score</div><input type=\"number\" class=\"sc-input\" min=\"0\" max=\"30\" placeholder=\"0\" aria-label=\"Enter earned score out of 30\" oninput=\"var p=this.value; var out=this.parentElement.querySelector('.sc-pct'); var g=this.closest('.sc-box').querySelector('.sc-grade'); if(p===''){out.textContent='';g.textContent='';return;} var pct=Math.round((p/30)*1000)/10; out.textContent=pct+'%'; g.textContent = pct>=90?'A':pct>=80?'B':pct>=70?'C':pct>=60?'D':'F';\"><div class=\"sc-pct\"></div></div><div><div class=\"sc-lbl\">Out of</div><div class=\"sc-val\">30</div></div><div><div class=\"sc-lbl\">Grade</div><div class=\"sc-val sc-grade\"></div></div><div><div class=\"sc-lbl\">Comments</div><div class=\"sc-val\" style=\"min-width:140px;\"></div></div></div>"}, {"id": "CW8", "cat": "classwork", "lesson": 7, "title": "CW 8 — مَنْ نَبِيُّكَ؟ (The Prophet ﷺ)", "badge": "Classwork · L7", "points": 30, "html": "<div class=\"sh-hdr\"><div class=\"sh-top\"><div class=\"sh-title\">CW 8 — مَنْ نَبِيُّكَ؟ (The Prophet ﷺ)</div><div class=\"sh-badge\">Classwork · L7</div></div><div class=\"sh-meta\"><div class=\"mf\"><div class=\"ml\">Name</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Date</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Score</div><div class=\"mv\"></div></div></div></div><div class=\"sec-hd\"><h3>Part A — Lineage & Selection (p.22-23)</h3><span class=\"pts\">12 pts</span></div><div class=\"q\"><div class=\"qn\">Question 1</div><div class=\"qt\">Write the Prophet's ﷺ full lineage exactly as the Imam wrote it on page 22:</div></div><div class=\"lin\"><div class=\"lin-box main\">مُحَمَّد ﷺ</div><div class=\"lin-arrow\">↑ ibn</div><div class=\"lin-box\">عَبْدِ اللَّهِ</div><div class=\"lin-arrow\">↑ ibn</div><div class=\"lin-box\">عَبْدِ الْمُطَّلِبِ</div><div class=\"lin-arrow\">↑ ibn</div><div class=\"lin-box\">هَاشِمٍ</div><div class=\"lin-arrow\">↑ ibn</div><div class=\"lin-box\">عَبْدِ مَنَافٍ</div></div><div class=\"q\"><div class=\"qn\">Question 2</div><div class=\"qt\">The Imam says: اصْطَفَاهُ اللَّهُ تَعَالَى مِنْ قُرَيْشٍ. Fill in and answer:</div></div><div class=\"qt\">Meaning of اصْطَفَاهُ: ______</div><div class=\"qt\">He was the elite of the children of ______. He was sent to ______ and ______ — meaning all peoples.</div><div class=\"qt\">He called people TOWARD: ______</div><div class=\"qt\">He called people AWAY FROM (list all 6 the Imam mentions, including prophets and the righteous):</div><div class=\"al\"></div><div class=\"sec-hd\"><h3>Part B — Timeline: The Imam's Exact Account (p.23-25)</h3><span class=\"pts\">10 pts</span></div><div class=\"q\"><div class=\"qn\">Question 3</div><div class=\"qt\">Put these events in the correct chronological order (1-6) and fill in the age or duration from the Imam's exact words:</div></div><table class=\"tbl\"><thead><tr><th>Order</th><th>Event</th><th>Age / Duration (from the book)</th></tr></thead><tbody><tr><td class=\"wc\"></td><td class=\"wc\">Passed away — Deen completed</td><td class=\"wc\"></td></tr><tr><td class=\"wc\"></td><td class=\"wc\">Prophethood began — called to Ikhlas</td><td class=\"wc\"></td></tr><tr><td class=\"wc\"></td><td class=\"wc\">Al-Mi'raj — 5 prayers obligatory WITHOUT intermediary</td><td class=\"wc\"></td></tr><tr><td class=\"wc\"></td><td class=\"wc\">Calling in Makkah — patience and steadfastness</td><td class=\"wc\"></td></tr><tr><td class=\"wc\"></td><td class=\"wc\">Hijrah to Madinah — ordered with Jihad</td><td class=\"wc\"></td></tr><tr><td class=\"wc\"></td><td class=\"wc\">Striving in Jihad until people entered in droves</td><td class=\"wc\"></td></tr></tbody></table><div class=\"qt\">The Imam uses a specific phrase about Al-Mi'raj: مِنْ غَيْرِ وَاسِطَةٍ. What does this mean and why did the Imam emphasize it?</div><div class=\"als\"><div class=\"aline\"></div><div class=\"aline\"></div></div><div class=\"sec-hd\"><h3>Part C — First/Last Messenger & Best of Humans (p.25-26)</h3><span class=\"pts\">8 pts</span></div><div class=\"q\"><div class=\"qn\">Question 4</div><div class=\"qt\">The Imam states three facts about prophets. Complete each from the book:</div></div><div class=\"qt\">First messenger (not prophet): ______ — Proof: ______</div><div class=\"qt\">Last messenger: ______ — Proof: Al-Ahzab ______</div><div class=\"qt\">'Eesa ﷺ will: ______ — Proof: Muslim ______</div><div class=\"q\"><div class=\"qn\">Question 5</div><div class=\"qt\">The Imam's exact statement (p.25): وَأَفْضَلُ الرُّسُلِ: ______ · وَأَفْضَلُ الْبَشَرِ بَعْدَ الأَنْبِيَاءِ: ______ ثُمَّ ______ ثُمَّ ______ ثُمَّ ______</div></div><div class=\"qt\">The Imam closes with: وَخَيْرُ الْقُرُونِ قَرْنِي. Source: Bukhari ______ / Muslim ______. What does this hadith tell us about how to understand Islam correctly?</div><div class=\"als\"><div class=\"aline\"></div><div class=\"aline\"></div></div><div class=\"sc-box\"><div><div class=\"sc-lbl\">Score</div><input type=\"number\" class=\"sc-input\" min=\"0\" max=\"30\" placeholder=\"0\" aria-label=\"Enter earned score out of 30\" oninput=\"var p=this.value; var out=this.parentElement.querySelector('.sc-pct'); var g=this.closest('.sc-box').querySelector('.sc-grade'); if(p===''){out.textContent='';g.textContent='';return;} var pct=Math.round((p/30)*1000)/10; out.textContent=pct+'%'; g.textContent = pct>=90?'A':pct>=80?'B':pct>=70?'C':pct>=60?'D':'F';\"><div class=\"sc-pct\"></div></div><div><div class=\"sc-lbl\">Out of</div><div class=\"sc-val\">30</div></div><div><div class=\"sc-lbl\">Grade</div><div class=\"sc-val sc-grade\"></div></div><div><div class=\"sc-lbl\">Comments</div><div class=\"sc-val\" style=\"min-width:140px;\"></div></div></div>"}, {"id": "CW9", "cat": "classwork", "lesson": 8, "title": "CW 9 — مُرَاجَعَة: All 6 Q&As from Memory", "badge": "Classwork · Review", "points": 51, "html": "<div class=\"sh-hdr\"><div class=\"sh-top\"><div class=\"sh-title\">CW 9 — مُرَاجَعَة: All 6 Q&As from Memory</div><div class=\"sh-badge\">Classwork · Review</div></div><div class=\"sh-meta\"><div class=\"mf\"><div class=\"ml\">Name</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Date</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Score</div><div class=\"mv\"></div></div></div></div><div class=\"note\">No notes. No help. This is from memory. Arabic answers required. Quranic proofs required where indicated.</div><div class=\"sec-hd\"><h3>All 6 Questions — Arabic Answers + Proofs</h3><span class=\"pts\">30 pts</span></div><div class=\"qt qar\">[س١] إِذَا قِيلَ لَكَ: مَنْ رَبُّكَ؟</div><div class=\"qt\">Arabic answer:</div><div class=\"al\"></div><div class=\"qt qar\">[س٢] وَمَا مَعْنَى الرَّبِّ؟</div><div class=\"qt\">6 Arabic terms defining ar-Rabb:</div><div class=\"al\"></div><div class=\"qt qar\">[س٣] فَإِذَا قِيلَ لَكَ: بِمَ تَعْرِفُ رَبَّكَ؟</div><div class=\"qt\">Full Arabic answer:</div><div class=\"al\"></div><div class=\"qt\">Quranic proof (Surah & Ayah):</div><div class=\"al\"></div><div class=\"qt qar\">[س٤] فَإِنْ قِيلَ: لِأَيِّ شَيْءٍ خَلَقَكَ؟</div><div class=\"qt\">Full Arabic answer:</div><div class=\"al\"></div><div class=\"qt\">Proof 1: ______ · Proof 2: ______</div><div class=\"qt qar\">[س٥] فَإِنْ قِيلَ لَكَ: مَا دِينُكَ؟</div><div class=\"qt\">Answer + 4 meanings of Islam in Arabic:</div><div class=\"al\"></div><div class=\"qt\">5 Pillars (Arabic names):</div><div class=\"al\"></div><div class=\"qt\">6 Pillars of Iman (Arabic names + خَيْرِهِ وَشَرِّهِ for Qadar):</div><div class=\"al\"></div><div class=\"qt qar\">[س٦] وَإِذَا قِيلَ لَكَ: مَنْ نَبِيُّكَ؟</div><div class=\"qt\">Full lineage in Arabic:</div><div class=\"al\"></div><div class=\"qt\">Proof for Seal of Prophets:</div><div class=\"al\"></div><div class=\"qt\">Best of humans after prophets (4 names in order):</div><div class=\"al\"></div><div class=\"sec-hd\"><h3>All 22 Ayah References — From Memory</h3><span class=\"pts\">22 pts</span></div><div class=\"qt\">Write what each ayah proves (1 pt each):</div><table class=\"tbl\"><thead><tr><th>Reference</th><th>What the Imam uses it to prove</th></tr></thead><tbody><tr><td class=\"wc\">Al-A'raf 7:54</td><td class=\"wc\"></td></tr><tr><td class=\"wc\">Adh-Dhariyat 51:56</td><td class=\"wc\"></td></tr><tr><td class=\"wc\">An-Nisa 4:36</td><td class=\"wc\"></td></tr><tr><td class=\"wc\">Al-Ma'idah 5:72</td><td class=\"wc\"></td></tr><tr><td class=\"wc\">Al-Jinn 72:18</td><td class=\"wc\"></td></tr><tr><td class=\"wc\">Al-Mu'minun 23:117</td><td class=\"wc\"></td></tr><tr><td class=\"wc\">Ghafir 40:60</td><td class=\"wc\"></td></tr><tr><td class=\"wc\">Az-Zumar 39:14</td><td class=\"wc\"></td></tr><tr><td class=\"wc\">Ar-Ra'd 13:36</td><td class=\"wc\"></td></tr><tr><td class=\"wc\">Az-Zumar 39:64-66</td><td class=\"wc\"></td></tr><tr><td class=\"wc\">Taha 20:55</td><td class=\"wc\"></td></tr><tr><td class=\"wc\">Ar-Ra'd 13:5</td><td class=\"wc\"></td></tr><tr><td class=\"wc\">An-Nahl 16:36</td><td class=\"wc\"></td></tr><tr><td class=\"wc\">Al-Anfal 8:39</td><td class=\"wc\"></td></tr><tr><td class=\"wc\">Al-Imran 3:19</td><td class=\"wc\"></td></tr><tr><td class=\"wc\">Al-Imran 3:85</td><td class=\"wc\"></td></tr><tr><td class=\"wc\">Az-Zukhruf 43:26-28</td><td class=\"wc\"></td></tr><tr><td class=\"wc\">Al-Bayyinah 98:5</td><td class=\"wc\"></td></tr><tr><td class=\"wc\">Al-Baqarah 2:183-185</td><td class=\"wc\"></td></tr><tr><td class=\"wc\">Al-Imran 3:97</td><td class=\"wc\"></td></tr><tr><td class=\"wc\">An-Nisa 4:163</td><td class=\"wc\"></td></tr><tr><td class=\"wc\">Al-Ahzab 33:40</td><td class=\"wc\"></td></tr></tbody></table><div class=\"sc-box\"><div><div class=\"sc-lbl\">Score</div><input type=\"number\" class=\"sc-input\" min=\"0\" max=\"51\" placeholder=\"0\" aria-label=\"Enter earned score out of 51\" oninput=\"var p=this.value; var out=this.parentElement.querySelector('.sc-pct'); var g=this.closest('.sc-box').querySelector('.sc-grade'); if(p===''){out.textContent='';g.textContent='';return;} var pct=Math.round((p/51)*1000)/10; out.textContent=pct+'%'; g.textContent = pct>=90?'A':pct>=80?'B':pct>=70?'C':pct>=60?'D':'F';\"><div class=\"sc-pct\"></div></div><div><div class=\"sc-lbl\">Out of</div><div class=\"sc-val\">51</div></div><div><div class=\"sc-lbl\">Grade</div><div class=\"sc-val sc-grade\"></div></div><div><div class=\"sc-lbl\">Comments</div><div class=\"sc-val\" style=\"min-width:140px;\"></div></div></div>"}, {"id": "HW1", "cat": "homework", "lesson": 1, "title": "HW 1 — Family Teaching Night: The 6 Questions", "badge": "Homework · Due Next Class", "points": 40, "html": "<div class=\"sh-hdr\"><div class=\"sh-top\"><div class=\"sh-title\">HW 1 — Family Teaching Night: The 6 Questions</div><div class=\"sh-badge\">Homework · Due Next Class</div></div><div class=\"sh-meta\"><div class=\"mf\"><div class=\"ml\">Name</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Date Done</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Parent Signature</div><div class=\"mv\"></div></div></div></div><div class=\"note\"><b>Note:</b> Sit with a parent or family member. Ask all 6 questions in Arabic. Explain the full answer from the book. Record what happens below. This is your da'wah practice — the Imam wrote this book precisely so you could teach it.</div><div class=\"sec-hd\"><h3>The 6 Questions — Teaching Record</h3><span class=\"pts\">36 pts</span></div><div class=\"qt qar\">[س١/س٢] مَنْ رَبُّكَ؟ / مَا مَعْنَى الرَّبِّ؟ — 6 pts</div><div class=\"qt\">Their initial answer before you explained:</div><div class=\"al\"></div><div class=\"qt\">Which of the 6 terms was most meaningful to them and why:</div><div class=\"al\"></div><div class=\"qt\">One thing they said that surprised you:</div><div class=\"al\"></div><div class=\"qt qar\">[س٣] بِمَ تَعْرِفُ رَبَّكَ؟ — 6 pts</div><div class=\"qt\">Point to something visible. Explain which category it belongs to (Sign or Creation) and why:</div><div class=\"al\"></div><div class=\"qt\">Their reaction to the distinction between Signs and Creation:</div><div class=\"al\"></div><div class=\"qt qar\">[س٤] لِأَيِّ شَيْءٍ خَلَقَكَ؟ — 6 pts</div><div class=\"qt\">Share the Imam's definition of Ibadah. Name 3 everyday things you'll both do as worship this week:</div><div class=\"al\"></div><div class=\"qt\">Their reaction to hearing that Du'a to other than Allah is kufr (Al-Mu'minun 23:117):</div><div class=\"al\"></div><div class=\"qt qar\">[س٥] مَا دِينُكَ؟ — 6 pts</div><div class=\"qt\">Explain the 4 meanings of Islam. Which component did they find most meaningful?</div><div class=\"al\"></div><div class=\"qt\">Explain La ilaha illa Allah means لَا مَعْبُودَ حَقٍّ إِلَّا اللَّه. What was their response?</div><div class=\"al\"></div><div class=\"qt qar\">[س٦] مَنْ نَبِيُّكَ؟ — 6 pts</div><div class=\"qt\">Recite the full lineage from memory for them. Did you get it? ☐ Perfect ☐ Almost ☐ Need more practice</div><div class=\"qt\">Share the Imam's statement: وَأَوَّلُ الرُّسُلِ نُوحٌ وَآخِرُهُمْ مُحَمَّدٌ ﷺ. Their response:</div><div class=\"al\"></div><div class=\"qt\">Share the best-generations hadith (Bukhari 2652). What did they say?</div><div class=\"al\"></div><div class=\"qt\">All 6 together — 6 pts. Have them ask you all 6 questions randomly. Check which you answered correctly from memory: ☐ Q1 ☐ Q2 ☐ Q3 ☐ Q4 ☐ Q5 ☐ Q6</div><div class=\"qt\">Which question will you study more before the next quiz?</div><div class=\"al\"></div><div class=\"sec-hd\"><h3>Reflection</h3><span class=\"pts\">4 pts</span></div><div class=\"q\"><div class=\"qn\">Question 1</div><div class=\"qt\">What was the most powerful moment of this teaching session? How did it change how you see your role in your family?</div></div><div class=\"als\"><div class=\"aline\"></div><div class=\"aline\"></div><div class=\"aline\"></div></div><div class=\"sc-box\"><div><div class=\"sc-lbl\">Score</div><input type=\"number\" class=\"sc-input\" min=\"0\" max=\"40\" placeholder=\"0\" aria-label=\"Enter earned score out of 40\" oninput=\"var p=this.value; var out=this.parentElement.querySelector('.sc-pct'); var g=this.closest('.sc-box').querySelector('.sc-grade'); if(p===''){out.textContent='';g.textContent='';return;} var pct=Math.round((p/40)*1000)/10; out.textContent=pct+'%'; g.textContent = pct>=90?'A':pct>=80?'B':pct>=70?'C':pct>=60?'D':'F';\"><div class=\"sc-pct\"></div></div><div><div class=\"sc-lbl\">Out of</div><div class=\"sc-val\">40</div></div><div><div class=\"sc-lbl\">Grade</div><div class=\"sc-val sc-grade\"></div></div><div><div class=\"sc-lbl\">Comments</div><div class=\"sc-val\" style=\"min-width:140px;\"></div></div></div>"}, {"id": "HW2", "cat": "homework", "lesson": 2, "title": "HW 2 — Signs of Allah: 3-Day Observation Journal", "badge": "Homework · L2", "points": 35, "html": "<div class=\"sh-hdr\"><div class=\"sh-top\"><div class=\"sh-title\">HW 2 — Signs of Allah: 3-Day Observation Journal</div><div class=\"sh-badge\">Homework · L2</div></div><div class=\"sh-meta\"><div class=\"mf\"><div class=\"ml\">Name</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Days Done</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Score</div><div class=\"mv\"></div></div></div></div><div class=\"note\"><b>Note:</b> For 3 days, spend 5 minutes in deliberate observation (not scrolling, not busy — just looking). Record using the Imam's categories: Signs (آيَات — what Allah DOES) and Creation (مَخْلُوقَات — what He MADE).</div><div class=\"jnl\"><h4>Day 1 — 10 pts</h4><div class=\"qt\">What I observed (be specific — not just \"the sky\"):</div><div class=\"al\"></div><div class=\"qt\">Category (circle): الآيَات — SIGN / الْمَخْلُوقَات — CREATION / BOTH</div><div class=\"qt\">Key phrase from Al-A'raf 7:54 that applies: ☐ خَلَقَ ☐ يُغْشِي اللَّيْلَ ☐ لَهُ الْخَلْقُ ☐ لَهُ الْأَمْر</div><div class=\"qt\">How it proves Allah exists and is in control:</div><div class=\"al\"></div><div class=\"qt\">Du'a I made after this reflection:</div><div class=\"al\"></div></div><div class=\"jnl\"><h4>Day 2 — 10 pts</h4><div class=\"qt\">What I observed:</div><div class=\"al\"></div><div class=\"qt\">Category: SIGN / CREATION / BOTH — because:</div><div class=\"al\"></div><div class=\"qt\">Connection to one of the 6 terms of ar-Rabb (e.g., this shows Allah is الرَّازِق because...):</div><div class=\"al\"></div></div><div class=\"jnl\"><h4>Day 3 — 10 pts</h4><div class=\"qt\">What I observed:</div><div class=\"al\"></div><div class=\"qt\">The Imam says: أَلَا لَهُ الْخَلْقُ وَالْأَمْر. Apply this to what you saw:</div><div class=\"al\"></div><div class=\"qt\">Write a du'a in Arabic or English inspired by what you observed:</div><div class=\"al\"></div></div><div class=\"sec-hd\"><h3>Final Reflection</h3><span class=\"pts\">5 pts</span></div><div class=\"q\"><div class=\"qn\">Question 1</div><div class=\"qt\">After 3 days of deliberate observation — including thinking about the ayah كُلٌّ فِي فَلَكٍ يَسْبَحُونَ (Al-Anbiya 21:33) from class — how has your answer to Q3 (بِمَ تَعْرِفُ رَبَّكَ؟) become more real and personal to you?</div></div><div class=\"als\"><div class=\"aline\"></div><div class=\"aline\"></div><div class=\"aline\"></div></div><div class=\"sc-box\"><div><div class=\"sc-lbl\">Score</div><input type=\"number\" class=\"sc-input\" min=\"0\" max=\"35\" placeholder=\"0\" aria-label=\"Enter earned score out of 35\" oninput=\"var p=this.value; var out=this.parentElement.querySelector('.sc-pct'); var g=this.closest('.sc-box').querySelector('.sc-grade'); if(p===''){out.textContent='';g.textContent='';return;} var pct=Math.round((p/35)*1000)/10; out.textContent=pct+'%'; g.textContent = pct>=90?'A':pct>=80?'B':pct>=70?'C':pct>=60?'D':'F';\"><div class=\"sc-pct\"></div></div><div><div class=\"sc-lbl\">Out of</div><div class=\"sc-val\">35</div></div><div><div class=\"sc-lbl\">Grade</div><div class=\"sc-val sc-grade\"></div></div><div><div class=\"sc-lbl\">Comments</div><div class=\"sc-val\" style=\"min-width:140px;\"></div></div></div>"}, {"id": "HW3", "cat": "homework", "lesson": 3, "title": "HW 3 — Full-Day Ibadah Diary", "badge": "Homework · L3", "points": 25, "html": "<div class=\"sh-hdr\"><div class=\"sh-top\"><div class=\"sh-title\">HW 3 — Full-Day Ibadah Diary</div><div class=\"sh-badge\">Homework · L3</div></div><div class=\"sh-meta\"><div class=\"mf\"><div class=\"ml\">Name</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Date</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Score</div><div class=\"mv\"></div></div></div></div><div class=\"note\"><b>Note:</b> Track your worship for ONE full day using the Imam's definition: \"everything Allah loves and is pleased with — from speech and actions, inward and outward.\" Also track what you need to improve. Be honest — this is between you and Allah.</div><div class=\"sec-hd\"><h3>Morning (wake-up through Dhuhr)</h3><span class=\"pts\">8 pts</span></div><table class=\"tbl\"><thead><tr><th>Act I did</th><th>Category (قَوْل / عَمَل ظَاهِر / عَمَل بَاطِن)</th><th>My intention (نِيَّة)</th><th>Was it Ibadah? Y/N</th></tr></thead><tbody><tr><td class=\"wc\"></td><td class=\"wc\"></td><td class=\"wc\"></td><td class=\"wc\"></td></tr><tr><td class=\"wc\"></td><td class=\"wc\"></td><td class=\"wc\"></td><td class=\"wc\"></td></tr><tr><td class=\"wc\"></td><td class=\"wc\"></td><td class=\"wc\"></td><td class=\"wc\"></td></tr></tbody></table><div class=\"sec-hd\"><h3>Afternoon & Evening</h3><span class=\"pts\">8 pts</span></div><table class=\"tbl\"><thead><tr><th>Act I did</th><th>Category</th><th>My intention</th><th>Ibadah? Y/N</th></tr></thead><tbody><tr><td class=\"wc\"></td><td class=\"wc\"></td><td class=\"wc\"></td><td class=\"wc\"></td></tr><tr><td class=\"wc\"></td><td class=\"wc\"></td><td class=\"wc\"></td><td class=\"wc\"></td></tr><tr><td class=\"wc\"></td><td class=\"wc\"></td><td class=\"wc\"></td><td class=\"wc\"></td></tr></tbody></table><div class=\"sec-hd\"><h3>Honest Assessment & Tomorrow's Plan</h3><span class=\"pts\">9 pts</span></div><div class=\"q\"><div class=\"qn\">Question 1</div><div class=\"qt\">List 2 things you did today that were NOT Ibadah (actions without the right intention):</div></div><div class=\"als\"><div class=\"aline\"></div><div class=\"aline\"></div></div><div class=\"q\"><div class=\"qn\">Question 2</div><div class=\"qt\">The Imam says the first obligation is الكُفْر بِالطَّاغُوت. Did any of your actions today involve directing any type of worship toward other than Allah? Be honest:</div></div><div class=\"als\"><div class=\"aline\"></div><div class=\"aline\"></div></div><div class=\"q\"><div class=\"qn\">Question 3</div><div class=\"qt\">The Imam's definition says Ibadah includes وَطَاعَتِهِ — obedience, including abandoning what He prohibited. Name one thing you will specifically change tomorrow based on Q4:</div></div><div class=\"als\"><div class=\"aline\"></div><div class=\"aline\"></div></div><div class=\"sc-box\"><div><div class=\"sc-lbl\">Score</div><input type=\"number\" class=\"sc-input\" min=\"0\" max=\"25\" placeholder=\"0\" aria-label=\"Enter earned score out of 25\" oninput=\"var p=this.value; var out=this.parentElement.querySelector('.sc-pct'); var g=this.closest('.sc-box').querySelector('.sc-grade'); if(p===''){out.textContent='';g.textContent='';return;} var pct=Math.round((p/25)*1000)/10; out.textContent=pct+'%'; g.textContent = pct>=90?'A':pct>=80?'B':pct>=70?'C':pct>=60?'D':'F';\"><div class=\"sc-pct\"></div></div><div><div class=\"sc-lbl\">Out of</div><div class=\"sc-val\">25</div></div><div><div class=\"sc-lbl\">Grade</div><div class=\"sc-val sc-grade\"></div></div><div><div class=\"sc-lbl\">Comments</div><div class=\"sc-val\" style=\"min-width:140px;\"></div></div></div>"}, {"id": "HW4", "cat": "homework", "lesson": 0, "title": "HW 4 — Complete Quranic & Hadith Reference Chart", "badge": "Homework · All Lessons", "points": 28, "html": "<div class=\"sh-hdr\"><div class=\"sh-top\"><div class=\"sh-title\">HW 4 — Complete Quranic & Hadith Reference Chart</div><div class=\"sh-badge\">Homework · All Lessons</div></div><div class=\"sh-meta\"><div class=\"mf\"><div class=\"ml\">Name</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Date</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Score</div><div class=\"mv\"></div></div></div></div><div class=\"note\"><b>Note:</b> From memory — no looking at notes. Fill in every row. The Imam proved each claim from Quran and Sunnah. Knowing these references is part of being a scholar of Islam, not just a student.</div><div class=\"sec-hd\"><h3>All 22 Ayahs from the Book</h3><span class=\"pts\">22 pts</span></div><table class=\"tbl\"><thead><tr><th>Surah & Ayah</th><th>What the Imam uses it to prove
