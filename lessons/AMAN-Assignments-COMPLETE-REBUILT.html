d><td class=\"wc\">30</td><td class=\"wc\">4 meanings + Ibrahim proof + both 3:19/3:85</td></tr><tr><td class=\"wc\">CW7 — 6 Pillars, Qadar, Resurrection</td><td class=\"wc\">30</td><td class=\"wc\">خَيْرِهِ وَشَرِّهِ + foundations saving from Kufr</td></tr><tr><td class=\"wc\">CW8 — Q6: Prophet ﷺ full</td><td class=\"wc\">30</td><td class=\"wc\">Lineage + timeline exact phrases + best of humans</td></tr><tr><td class=\"wc\">CW9 — Full Review: all 6 Q&As + 22 refs</td><td class=\"wc\">51</td><td class=\"wc\">All Arabic + all references — comprehensive</td></tr><tr><td class=\"wc\">HW1-6</td><td class=\"wc\">40/35/25/28/25/35</td><td class=\"wc\">See individual sheets</td></tr><tr><td class=\"wc\">Quiz 1-4</td><td class=\"wc\">40+5 / 45 / 50 / 50</td><td class=\"wc\">See individual sheets</td></tr><tr><td class=\"wc\">Mid-Unit Test</td><td class=\"wc\">60</td><td class=\"wc\">Q1-Q4 + Shirk + Taghut + essay on WHY Tawhid first</td></tr><tr><td class=\"wc\">Final Unit Test</td><td class=\"wc\">100</td><td class=\"wc\">All 6 Q&As + 22 refs + comprehensive short answer + essay</td></tr><tr><td class=\"wc\">Daily Openers / Exit Tickets / Oral Review</td><td class=\"wc\">Not graded</td><td class=\"wc\">Formative — completion credit only</td></tr><tr><td class=\"wc\">Vocabulary / Matching / T-F / Puzzles</td><td class=\"wc\">≤5% of unit grade</td><td class=\"wc\">Fluency-building, low-stakes</td></tr><tr><td class=\"wc\">Weekly & Midterm/Final Review Packets</td><td class=\"wc\">Not graded</td><td class=\"wc\">Practice only — see rubric above</td></tr></tbody></table>"}, {"id": "GUID1", "cat": "classwork", "lesson": 1, "title": "Guided Practice — L1: Q1 & Q2 — Who is Your Lord? The Meaning of ar-Rabb", "badge": "Teacher-Led · L1", "points": 8, "html": "<div class=\"sh-hdr\"><div class=\"sh-top\"><div class=\"sh-title\">Guided Practice — Who is Your Lord?</div><div class=\"sh-badge\">Teacher-Led · L1</div></div><div class=\"sh-meta\"><div class=\"mf\"><div class=\"ml\">Name</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Date</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\"></div><div class=\"mv\"></div></div></div></div><div class=\"note\"><b>Note:</b> Work through this WITH your teacher, one section at a time. Stop at each checkpoint (⏸) to check answers together before moving on.</div><div class=\"sec-hd\"><h3>Step 1 — Read Together</h3></div><div class=\"q\"><div class=\"qt\">The Imam opens his book by teaching that the very first thing a child must learn is Q1: مَنْ رَبُّكَ؟ — \"Who is your Lord?\" The answer is short but enormous: رَبِّيَ اللَّهُ — \"My Lord is Allah.\" Then the Imam asks a follow-up, Q2: وَمَا مَعْنَى الرَّبِّ؟ — \"What is the meaning of Rabb?\" He answers with six terms that together explain everything a Rabb is and does.</div></div><div class=\"sec-hd\"><h3>⏸ Checkpoint 1</h3></div><div class=\"q\"><div class=\"qt\">Before moving on: can you say Q1 and its answer from memory, in Arabic, right now?</div><div class=\"al\"></div></div><div class=\"sec-hd\"><h3>Step 2 — Fill In Together</h3><span class=\"pts\">6 pts</span></div><div class=\"wb\"><h4>Word Bank</h4><div class=\"words\"><span class=\"word\">Owner</span><span class=\"word\">Worshipped</span><span class=\"word\">Creator</span><span class=\"word\">Provider</span><span class=\"word\">helps</span><span class=\"word\">gives victory</span></div></div><table class=\"tbl\"><thead><tr><th>#</th><th>Sentence</th></tr></thead><tbody><tr><td class=\"wc\">1</td><td class=\"wc\">الْمَالِكُ means the ____.</td></tr><tr><td class=\"wc\">2</td><td class=\"wc\">الْمَعْبُودُ means the One ____.</td></tr><tr><td class=\"wc\">3</td><td class=\"wc\">الْخَالِقُ means the ____.</td></tr><tr><td class=\"wc\">4</td><td class=\"wc\">الرَّازِقُ means the ____.</td></tr><tr><td class=\"wc\">5</td><td class=\"wc\">الْمُعِينُ means the One who ____.</td></tr><tr><td class=\"wc\">6</td><td class=\"wc\">النَّاصِرُ means the One who ____.</td></tr></tbody></table><div class=\"sec-hd\"><h3>⏸ Checkpoint 2</h3></div><div class=\"q\"><div class=\"qt\">Checkpoint: which TWO of the six terms are paired together because ownership requires worship?</div><div class=\"al\"></div></div>"}, {"id": "INDEP1", "cat": "classwork", "lesson": 1, "title": "Independent Practice — L1: Q1 & Q2 — Who is Your Lord? The Meaning of ar-Rabb", "badge": "Work Alone · L1", "points": 12, "html": "<div class=\"sh-hdr\"><div class=\"sh-top\"><div class=\"sh-title\">Independent Practice — Who is Your Lord?</div><div class=\"sh-badge\">Work Alone · L1</div></div><div class=\"sh-meta\"><div class=\"mf\"><div class=\"ml\">Name</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Date</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\"></div><div class=\"mv\"></div></div></div></div><div class=\"note\"><b>Note:</b> Complete this ON YOUR OWN, using what you've learned. No partner, no teacher help — show what YOU know.</div><div class=\"sec-hd\"><h3>On Your Own</h3><span class=\"pts\">12 pts</span></div><div class=\"q\"><div class=\"qn\">Question 1</div><div class=\"qt\">Write Q1 and Q2 with their full Arabic answers, from memory, with no help.</div></div><div class=\"als\"><div class=\"aline\"></div><div class=\"aline\"></div></div><div class=\"q\"><div class=\"qn\">Question 2</div><div class=\"qt\">Explain in 2-3 sentences why the Imam defines ar-Rabb with SIX terms instead of just one.</div></div><div class=\"als\"><div class=\"aline\"></div><div class=\"aline\"></div></div><div class=\"q\"><div class=\"qn\">Question 3</div><div class=\"qt\">Write the Imam's definition of the Name \"Allah\" in Arabic, then explain what الأُلُوهِيَّة and الْعُبُودِيَّة mean.</div></div><div class=\"als\"><div class=\"aline\"></div><div class=\"aline\"></div></div><div class=\"q\"><div class=\"qn\">Question 4</div><div class=\"qt\">Write out Al-A'raf 7:54 as far as you can from memory, and explain what it proves.</div></div><div class=\"als\"><div class=\"aline\"></div><div class=\"aline\"></div></div>"}, {"id": "READ1", "cat": "classwork", "lesson": 1, "title": "Reading Comprehension — L1: Q1 & Q2 — Who is Your Lord? The Meaning of ar-Rabb", "badge": "Read & Answer · L1", "points": 10, "html": "<div class=\"sh-hdr\"><div class=\"sh-top\"><div class=\"sh-title\">Reading Comprehension — Who is Your Lord?</div><div class=\"sh-badge\">Read & Answer · L1</div></div><div class=\"sh-meta\"><div class=\"mf\"><div class=\"ml\">Name</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Date</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\"></div><div class=\"mv\"></div></div></div></div><div class=\"sec-hd\"><h3>Read the passage carefully</h3></div><div class=\"q\" style=\"line-height:1.7;\">Every child who has ever lived has asked, at some point, \"who takes care of me?\" The Imam Muhammad ibn 'Abd al-Wahhab begins his book with the most important version of that question: مَنْ رَبُّكَ؟ — Who is your Lord? The answer he gives is simple to say but takes a lifetime to fully understand: رَبِّيَ اللَّهُ, \"My Lord is Allah.\" But what does the word Rabb actually mean? The Imam explains it with six Arabic words: al-Malik (the Owner), al-Ma'bud (the One Worshipped), al-Mu'een (the Helper), an-Nasir (the Giver of Victory), al-Khaliq (the Creator), and ar-Raziq (the Provider). Notice that al-Malik and al-Ma'bud are placed first and are connected: because Allah OWNS everything, He alone DESERVES to be worshipped. The Imam also explains the meaning of the Name \"Allah\" itself: He is the One who possesses all uluhiyyah (the right to be worshipped) and ubudiyyah (the state of being a servant) over every single thing He created. Finally, the Imam brings one ayah — Al-A'raf 7:54 — that proves all of this at once: that Allah is our Lord, our Creator, and that we know Him through His signs and creation.</div><div class=\"sec-hd\"><h3>Answer the Questions</h3><span class=\"pts\">10 pts</span></div><div class=\"q\"><div class=\"qn\">Question 1</div><div class=\"qt\">What is the very first question the Imam teaches, and what is its answer?</div></div><div class=\"als\"><div class=\"aline\"></div></div><div class=\"q\"><div class=\"qn\">Question 2</div><div class=\"qt\">List all six terms the Imam uses to define ar-Rabb.</div></div><div class=\"als\"><div class=\"aline\"></div></div><div class=\"q\"><div class=\"qn\">Question 3</div><div class=\"qt\">Why are al-Malik and al-Ma'bud connected, according to the passage?</div></div><div class=\"als\"><div class=\"aline\"></div></div><div class=\"q\"><div class=\"qn\">Question 4</div><div class=\"qt\">What does the passage say the Name \"Allah\" means?</div></div><div class=\"als\"><div class=\"aline\"></div></div><div class=\"q\"><div class=\"qn\">Question 5</div><div class=\"qt\">Which ayah does the passage say proves multiple things at once, and what does it prove?</div></div><div class=\"als\"><div class=\"aline\"></div></div>"}, {"id": "SORT1", "cat": "games", "lesson": 1, "title": "Sorting Activity — L1: Q1 & Q2 — Who is Your Lord? The Meaning of ar-Rabb", "badge": "Sort the Items · L1", "points": 6, "html": "<div class=\"sh-hdr\"><div class=\"sh-top\"><div class=\"sh-title\">Sorting Activity — Who is Your Lord?</div><div class=\"sh-badge\">Sort the Items · L1</div></div><div class=\"sh-meta\"><div class=\"mf\"><div class=\"ml\">Name</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Date</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\"></div><div class=\"mv\"></div></div></div></div><div class=\"note\"><b>Note:</b> Cut out the items below (or number them) and sort each into the correct category.</div><div class=\"sec-hd\"><h3>Items to Sort</h3></div><div class=\"wb\"><h4>Word Bank</h4><div class=\"words\"><span class=\"word\">Owns everything that exists</span><span class=\"word\">Deserves all worship</span><span class=\"word\">Helps in times of need</span><span class=\"word\">Gives victory over enemies</span><span class=\"word\">Brings things into existence from nothing</span><span class=\"word\">Provides every meal and breath</span></div></div><div class=\"sec-hd\"><h3>Sort Them Here</h3><span class=\"pts\">6 pts</span></div><table class=\"tbl\"><thead><tr><th>Belongs to الْمَالِكُ / الْمَعْبُودُ pair</th><th>Belongs to الْمُعِينُ / النَّاصِرُ pair</th><th>Belongs to الْخَالِقُ / الرَّازِقُ pair</th></tr></thead><tbody><tr><td class=\"wc\"></td><td class=\"wc\"></td><td class=\"wc\"></td></tr><tr><td class=\"wc\"></td><td class=\"wc\"></td><td class=\"wc\"></td></tr><tr><td class=\"wc\"></td><td class=\"wc\"></td><td class=\"wc\"></td></tr></tbody></table>"}, {"id": "SEQ1", "cat": "games", "lesson": 1, "title": "Sequencing Activity — L1: Q1 & Q2 — Who is Your Lord? The Meaning of ar-Rabb", "badge": "Put in Order · L1", "points": 6, "html": "<div class=\"sh-hdr\"><div class=\"sh-top\"><div class=\"sh-title\">Sequencing Activity — Who is Your Lord?</div><div class=\"sh-badge\">Put in Order · L1</div></div><div class=\"sh-meta\"><div class=\"mf\"><div class=\"ml\">Name</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Date</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\"></div><div class=\"mv\"></div></div></div></div><div class=\"note\"><b>Note:</b> Number these events 1, 2, 3... in the correct order.</div><div class=\"sec-hd\"><h3>Put These in the Correct Order</h3><span class=\"pts\">6 pts</span></div><div class=\"q\" style=\"display:flex;gap:10px;align-items:center;\"><div class=\"al\" style=\"width:36px;flex:none;height:32px;\"></div><div class=\"qt\">The Imam states the two goals of the book (complete Muslim, good Muwahhid).</div></div><div class=\"q\" style=\"display:flex;gap:10px;align-items:center;\"><div class=\"al\" style=\"width:36px;flex:none;height:32px;\"></div><div class=\"qt\">The Imam introduces Q1: مَنْ رَبُّكَ؟ and its answer.</div></div><div class=\"q\" style=\"display:flex;gap:10px;align-items:center;\"><div class=\"al\" style=\"width:36px;flex:none;height:32px;\"></div><div class=\"qt\">The Imam introduces Q2 and explains the six terms of ar-Rabb.</div></div><div class=\"q\" style=\"display:flex;gap:10px;align-items:center;\"><div class=\"al\" style=\"width:36px;flex:none;height:32px;\"></div><div class=\"qt\">The Imam explains the meaning of the Name \"Allah.\"</div></div><div class=\"q\" style=\"display:flex;gap:10px;align-items:center;\"><div class=\"al\" style=\"width:36px;flex:none;height:32px;\"></div><div class=\"qt\">The Imam brings Al-A'raf 7:54 as the proof.</div></div><div class=\"q\" style=\"display:flex;gap:10px;align-items:center;\"><div class=\"al\" style=\"width:36px;flex:none;height:32px;\"></div><div class=\"qt\">The Imam brings the Fitrah hadith to explain why Tawhid is taught first.</div></div>"}, {"id": "GUID2", "cat": "classwork", "lesson": 2, "title": "Guided Practice — L2: Q3 — How Do You Know Your Lord?", "badge": "Teacher-Led · L2", "points": 6, "html": "<div class=\"sh-hdr\"><div class=\"sh-top\"><div class=\"sh-title\">Guided Practice — How Do You Know Your Lord?</div><div class=\"sh-badge\">Teacher-Led · L2</div></div><div class=\"sh-meta\"><div class=\"mf\"><div class=\"ml\">Name</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Date</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\"></div><div class=\"mv\"></div></div></div></div><div class=\"note\"><b>Note:</b> Work through this WITH your teacher, one section at a time. Stop at each checkpoint (⏸) to check answers together before moving on.</div><div class=\"sec-hd\"><h3>Step 1 — Read Together</h3></div><div class=\"q\"><div class=\"qt\">Q3 asks: بِمَ تَعْرِفُ رَبَّكَ؟ — \"How do you know your Lord?\" The Imam's answer has two parts: أَعْرِفُهُ بِآيَاتِهِ وَمَخْلُوقَاتِهِ — \"I know Him through His Signs and His Creation.\" Signs (āyāt) are things Allah is DOING right now — like the night arriving. Creation (makhluqat) are things Allah HAS MADE — like the heavens and the earth.</div></div><div class=\"sec-hd\"><h3>⏸ Checkpoint 1</h3></div><div class=\"q\"><div class=\"qt\">Before moving on: can you give ONE example of a Sign and ONE example of Creation from around you right now?</div><div class=\"al\"></div></div><div class=\"sec-hd\"><h3>Step 2 — Fill In Together</h3><span class=\"pts\">4 pts</span></div><div class=\"wb\"><h4>Word Bank</h4><div class=\"words\"><span class=\"word\">night</span><span class=\"word\">day</span><span class=\"word\">heavens</span><span class=\"word\">earth</span><span class=\"word\">doing</span><span class=\"word\">made</span></div></div><table class=\"tbl\"><thead><tr><th>#</th><th>Sentence</th></tr></thead><tbody><tr><td class=\"wc\">1</td><td class=\"wc\">The Signs include the ____ and the ____ arriving each day.</td></tr><tr><td class=\"wc\">2</td><td class=\"wc\">The Creation includes the ____ and the ____.</td></tr><tr><td class=\"wc\">3</td><td class=\"wc\">A Sign is something Allah is ____ right now.</td></tr><tr><td class=\"wc\">4</td><td class=\"wc\">Creation is something Allah has already ____.</td></tr></tbody></table><div class=\"sec-hd\"><h3>⏸ Checkpoint 2</h3></div><div class=\"q\"><div class=\"qt\">Checkpoint: which single ayah proves Q1, Q2, AND Q3 all at once?</div><div class=\"al\"></div></div>"}, {"id": "INDEP2", "cat": "classwork", "lesson": 2, "title": "Independent Practice — L2: Q3 — How Do You Know Your Lord?", "badge": "Work Alone · L2", "points": 12, "html": "<div class=\"sh-hdr\"><div class=\"sh-top\"><div class=\"sh-title\">Independent Practice — How Do You Know Your Lord?</div><div class=\"sh-badge\">Work Alone · L2</div></div><div class=\"sh-meta\"><div class=\"mf\"><div class=\"ml\">Name</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Date</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\"></div><div class=\"mv\"></div></div></div></div><div class=\"note\"><b>Note:</b> Complete this ON YOUR OWN, using what you've learned. No partner, no teacher help — show what YOU know.</div><div class=\"sec-hd\"><h3>On Your Own</h3><span class=\"pts\">12 pts</span></div><div class=\"q\"><div class=\"qn\">Question 1</div><div class=\"qt\">Write Q3's full Arabic answer from memory, then translate it.</div></div><div class=\"als\"><div class=\"aline\"></div><div class=\"aline\"></div></div><div class=\"q\"><div class=\"qn\">Question 2</div><div class=\"qt\">Explain the difference between a Sign (āyah) and a piece of Creation (makhluq), using the Imam's own examples.</div></div><div class=\"als\"><div class=\"aline\"></div><div class=\"aline\"></div></div><div class=\"q\"><div class=\"qn\">Question 3</div><div class=\"qt\">Write out the phrase أَلَا لَهُ الْخَلْقُ وَالْأَمْرُ and explain how it connects to Q3.</div></div><div class=\"als\"><div class=\"aline\"></div><div class=\"aline\"></div></div><div class=\"q\"><div class=\"qn\">Question 4</div><div class=\"qt\">Explain what the enrichment ayah (Al-Anbiya 21:33, \"كُلٌّ فِي فَلَكٍ يَسْبَحُونَ\") adds to your understanding of Allah's creation.</div></div><div class=\"als\"><div class=\"aline\"></div><div class=\"aline\"></div></div>"}, {"id": "READ2", "cat": "classwork", "lesson": 2, "title": "Reading Comprehension — L2: Q3 — How Do You Know Your Lord?", "badge": "Read & Answer · L2", "points": 10, "html": "<div class=\"sh-hdr\"><div class=\"sh-top\"><div class=\"sh-title\">Reading Comprehension — How Do You Know Your Lord?</div><div class=\"sh-badge\">Read & Answer · L2</div></div><div class=\"sh-meta\"><div class=\"mf\"><div class=\"ml\">Name</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Date</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\"></div><div class=\"mv\"></div></div></div></div><div class=\"sec-hd\"><h3>Read the passage carefully</h3></div><div class=\"q\" style=\"line-height:1.7;\">How can you know that Allah is real if you cannot see Him? The Imam answers this exact question with Q3: بِمَ تَعْرِفُ رَبَّكَ؟ — \"How do you know your Lord?\" His answer is: أَعْرِفُهُ بِآيَاتِهِ وَمَخْلُوقَاتِهِ — \"I know Him through His Signs and His Creation.\" The Imam explains that Allah's Signs (āyāt) include the night, the day, the sun, and the moon — things Allah is actively DOING, over and over, every single day. His Creation (makhluqat) includes the heavens, the earth, and everything within them — things Allah has already MADE. Both prove Allah exists and is in control, which is exactly what the ayah Al-A'raf 7:54 says: أَلَا لَهُ الْخَلْقُ وَالْأَمْرُ, \"Unquestionably, His is the creation and the command.\" الْخَلْقُ (the creation) matches Allah's Creation, and الْأَمْرُ (the command) matches His ongoing Signs. To bring this to life, we can also reflect on Al-Anbiya 21:33, which says the sun and moon are each يَسْبَحُونَ — \"swimming\" — in their orbit, by Allah's command. Scientists count over two trillion galaxies in the universe, each one a testimony to the same truth the Imam is teaching an 8-year-old child: everything you see is either a Sign of what Allah is doing, or a piece of what Allah has made.</div><div class=\"sec-hd\"><h3>Answer the Questions</h3><span class=\"pts\">10 pts</span></div><div class=\"q\"><div class=\"qn\">Question 1</div><div class=\"qt\">What question does this passage answer, and what is the Imam's answer?</div></div><div class=\"als\"><div class=\"aline\"></div></div><div class=\"q\"><div class=\"qn\">Question 2</div><div class=\"qt\">Give the passage's examples of Signs (āyāt) and Creation (makhluqat).</div></div><div class=\"als\"><div class=\"aline\"></div></div><div class=\"q\"><div class=\"qn\">Question 3</div><div class=\"qt\">How does the phrase أَلَا لَهُ الْخَلْقُ وَالْأَمْرُ connect to the two parts of Q3's answer?</div></div><div class=\"als\"><div class=\"aline\"></div></div><div class=\"q\"><div class=\"qn\">Question 4</div><div class=\"qt\">What does يَسْبَحُونَ mean, and which ayah is it from?</div></div><div class=\"als\"><div class=\"aline\"></div></div><div class=\"q\"><div class=\"qn\">Question 5</div><div class=\"qt\">According to the passage, what do the 2 trillion galaxies have to do with Q3?</div></div><div class=\"als\"><div class=\"aline\"></div></div>"}, {"id": "SORT2", "cat": "games", "lesson": 2, "title": "Sorting Activity — L2: Q3 — How Do You Know Your Lord?", "badge": "Sort the Items · L2", "points": 6, "html": "<div class=\"sh-hdr\"><div class=\"sh-top\"><div class=\"sh-title\">Sorting Activity — How Do You Know Your Lord?</div><div class=\"sh-badge\">Sort the Items · L2</div></div><div class=\"sh-meta\"><div class=\"mf\"><div class=\"ml\">Name</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Date</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\"></div><div class=\"mv\"></div></div></div></div><div class=\"note\"><b>Note:</b> Cut out the items below (or number them) and sort each into the correct category.</div><div class=\"sec-hd\"><h3>Items to Sort</h3></div><div class=\"wb\"><h4>Word Bank</h4><div class=\"words\"><span class=\"word\">The sun rising each morning</span><span class=\"word\">A mountain</span><span class=\"word\">The night arriving</span><span class=\"word\">The oceans</span><span class=\"word\">The moon's phases changing</span><span class=\"word\">The heavens and the earth</span></div></div><div class=\"sec-hd\"><h3>Sort Them Here</h3><span class=\"pts\">6 pts</span></div><table class=\"tbl\"><thead><tr><th>SIGNS — الآيَات (Allah is DOING)</th><th>CREATION — الْمَخْلُوقَات (Allah MADE)</th></tr></thead><tbody><tr><td class=\"wc\"></td><td class=\"wc\"></td></tr><tr><td class=\"wc\"></td><td class=\"wc\"></td></tr><tr><td class=\"wc\"></td><td class=\"wc\"></td></tr><tr><td class=\"wc\"></td><td class=\"wc\"></td></tr></tbody></table>"}, {"id": "SEQ2", "cat": "games", "lesson": 2, "title": "Sequencing Activity — L2: Q3 — How Do You Know Your Lord?", "badge": "Put in Order · L2", "points": 6, "html": "<div class=\"sh-hdr\"><div class=\"sh-top\"><div class=\"sh-title\">Sequencing Activity — How Do You Know Your Lord?</div><div class=\"sh-badge\">Put in Order · L2</div></div><div class=\"sh-meta\"><div class=\"mf\"><div class=\"ml\">Name</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Date</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\"></div><div class=\"mv\"></div></div></div></div><div class=\"note\"><b>Note:</b> Number these events 1, 2, 3... in the correct order.</div><div class=\"sec-hd\"><h3>Put These in the Correct Order</h3><span class=\"pts\">6 pts</span></div><div class=\"q\" style=\"display:flex;gap:10px;align-items:center;\"><div class=\"al\" style=\"width:36px;flex:none;height:32px;\"></div><div class=\"qt\">The Imam asks Q3: بِمَ تَعْرِفُ رَبَّكَ؟</div></div><div class=\"q\" style=\"display:flex;gap:10px;align-items:center;\"><div class=\"al\" style=\"width:36px;flex:none;height:32px;\"></div><div class=\"qt\">The Imam gives the two-part answer: Signs and Creation.</div></div><div class=\"q\" style=\"display:flex;gap:10px;align-items:center;\"><div class=\"al\" style=\"width:36px;flex:none;height:32px;\"></div><div class=\"qt\">The Imam lists the 4 Signs: night, day, sun, moon.</div></div><div class=\"q\" style=\"display:flex;gap:10px;align-items:center;\"><div class=\"al\" style=\"width:36px;flex:none;height:32px;\"></div><div class=\"qt\">The Imam lists the Creation: the heavens, earth, and everything within them.</div></div><div class=\"q\" style=\"display:flex;gap:10px;align-items:center;\"><div class=\"al\" style=\"width:36px;flex:none;height:32px;\"></div><div class=\"qt\">The Imam brings Al-A'raf 7:54 as proof, connecting الْخَلْقُ and الْأَمْرُ back to Q3.</div></div><div class=\"q\" style=\"display:flex;gap:10px;align-items:center;\"><div class=\"al\" style=\"width:36px;flex:none;height:32px;\"></div><div class=\"qt\">The class reflects on Al-Anbiya 21:33 and the scale of the universe (tafakkur).</div></div>"}, {"id": "GUID3", "cat": "classwork", "lesson": 3, "title": "Guided Practice — L3: Q4 — Why Were You Created? (Al-'Ibadah)", "badge": "Teacher-Led · L3", "points": 6, "html": "<div class=\"sh-hdr\"><div class=\"sh-top\"><div class=\"sh-title\">Guided Practice — Why Were You Created?</div><div class=\"sh-badge\">Teacher-Led · L3</div></div><div class=\"sh-meta\"><div class=\"mf\"><div class=\"ml\">Name</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Date</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\"></div><div class=\"mv\"></div></div></div></div><div class=\"note\"><b>Note:</b> Work through this WITH your teacher, one section at a time. Stop at each checkpoint (⏸) to check answers together before moving on.</div><div class=\"sec-hd\"><h3>Step 1 — Read Together</h3></div><div class=\"q\"><div class=\"qt\">Q4 asks: لِأَيِّ شَيْءٍ خَلَقَكَ؟ — \"For what purpose did Allah create you?\" The answer: لِعِبَادَتِهِ وَحْدَهُ لَا شَرِيكَ لَهُ — \"To worship Him alone, with no partner.\" The Imam then defines Ibadah (worship) using Ibn Taymiyyah's words: it covers THREE categories — statements, outward actions, and inward actions.</div></div><div class=\"sec-hd\"><h3>⏸ Checkpoint 1</h3></div><div class=\"q\"><div class=\"qt\">Before moving on: what are the TWO Quranic proofs for Q4?</div><div class=\"al\"></div></div><div class=\"sec-hd\"><h3>Step 2 — Fill In Together</h3><span class=\"pts\">4 pts</span></div><div class=\"wb\"><h4>Word Bank</h4><div class=\"words\"><span class=\"word\">statements</span><span class=\"word\">outward actions</span><span class=\"word\">inward actions</span><span class=\"word\">alone</span><span class=\"word\">no partner</span></div></div><table class=\"tbl\"><thead><tr><th>#</th><th>Sentence</th></tr></thead><tbody><tr><td class=\"wc\">1</td><td class=\"wc\">Category 1, أَقْوَال, means ____ like du'a and dhikr.</td></tr><tr><td class=\"wc\">2</td><td class=\"wc\">Category 2, أَعْمَال ظَاهِرَة, means ____ like salah.</td></tr><tr><td class=\"wc\">3</td><td class=\"wc\">Category 3, أَعْمَال بَاطِنَة, means ____ like love and fear of Allah.</td></tr><tr><td class=\"wc\">4</td><td class=\"wc\">Q4's answer says we worship Allah ____, with ____.</td></tr></tbody></table><div class=\"sec-hd\"><h3>⏸ Checkpoint 2</h3></div><div class=\"q\"><div class=\"qt\">Checkpoint: give one real example from your own day of each of the 3 categories of Ibadah.</div><div class=\"al\"></div></div>"}, {"id": "INDEP3", "cat": "classwork", "lesson": 3, "title": "Independent Practice — L3: Q4 — Why Were You Created? (Al-'Ibadah)", "badge": "Work Alone · L3", "points": 12, "html": "<div class=\"sh-hdr\"><div class=\"sh-top\"><div class=\"sh-title\">Independent Practice — Why Were You Created?</div><div class=\"sh-badge\">Work Alone · L3</div></div><div class=\"sh-meta\"><div class=\"mf\"><div class=\"ml\">Name</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Date</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\"></div><div class=\"mv\"></div></div></div></div><div class=\"note\"><b>Note:</b> Complete this ON YOUR OWN, using what you've learned. No partner, no teacher help — show what YOU know.</div><div class=\"sec-hd\"><h3>On Your Own</h3><span class=\"pts\">12 pts</span></div><div class=\"q\"><div class=\"qn\">Question 1</div><div class=\"qt\">Write Q4's full Arabic answer from memory, then translate it.</div></div><div class=\"als\"><div class=\"aline\"></div><div class=\"aline\"></div></div><div class=\"q\"><div class=\"qn\">Question 2</div><div class=\"qt\">Write Ibn Taymiyyah's definition of Ibadah in Arabic, then explain the THREE categories in your own words.</div></div><div class=\"als\"><div class=\"aline\"></div><div class=\"aline\"></div></div><div class=\"q\"><div class=\"qn\">Question 3</div><div class=\"qt\">Write out Adh-Dhariyat 51:56 and An-Nisa 4:36, and explain what each specifically proves about Q4.</div></div><div class=\"als\"><div class=\"aline\"></div><div class=\"aline\"></div></div><div class=\"q\"><div class=\"qn\">Question 4</div><div class=\"qt\">A classmate says worship only happens in the masjid. Using the definition of Ibadah, explain why they are wrong.</div></div><div class=\"als\"><div class=\"aline\"></div><div class=\"aline\"></div></div>"}, {"id": "READ3", "cat": "classwork", "lesson": 3, "title": "Reading Comprehension — L3: Q4 — Why Were You Created? (Al-'Ibadah)", "badge": "Read & Answer · L3", "points": 10, "html": "<div class=\"sh-hdr\"><div class=\"sh-top\"><div class=\"sh-title\">Reading Comprehension — Why Were You Created?</div><div class=\"sh-badge\">Read & Answer · L3</div></div><div class=\"sh-meta\"><div class=\"mf\"><div class=\"ml\">Name</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Date</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\"></div><div class=\"mv\"></div></div></div></div><div class=\"sec-hd\"><h3>Read the passage carefully</h3></div><div class=\"q\" style=\"line-height:1.7;\">Why do you exist? The Imam answers this with Q4: لِأَيِّ شَيْءٍ خَلَقَكَ؟ — \"For what purpose did Allah create you?\" His answer: لِعِبَادَتِهِ وَحْدَهُ لَا شَرِيكَ لَهُ وَطَاعَتِهِ — \"To worship Him alone, with no partner, and to obey Him.\" The Imam brings two proofs from the Quran. The first, Adh-Dhariyat 51:56, says: وَمَا خَلَقْتُ الْجِنَّ وَالْإِنسَ إِلَّا لِيَعْبُدُونِ — \"I did not create the Jinn and Mankind except to worship Me.\" This tells us WHY we were created. The second, An-Nisa 4:36, says: وَاعْبُدُوا اللَّهَ وَلَا تُشْرِكُوا بِهِ شَيْئًا — \"Worship Allah and associate nothing with Him.\" This tells us HOW to fulfill that purpose. But what exactly is Ibadah (worship)? The Imam quotes the scholar Ibn Taymiyyah, who defines it as a comprehensive word covering everything Allah loves and is pleased with — from THREE categories: statements (like saying Bismillah or making du'a), outward actions (like praying and fasting), and inward actions (like loving Allah, fearing Him, and trusting Him). This means worship is not limited to the masjid — it can fill your entire day, as long as your intention (niyyah) is for Allah.</div><div class=\"sec-hd\"><h3>Answer the Questions</h3><span class=\"pts\">10 pts</span></div><div class=\"q\"><div class=\"qn\">Question 1</div><div class=\"qt\">What is Q4, and what is its full answer?</div></div><div class=\"als\"><div class=\"aline\"></div></div><div class=\"q\"><div class=\"qn\">Question 2</div><div class=\"qt\">What does Adh-Dhariyat 51:56 specifically prove?</div></div><div class=\"als\"><div class=\"aline\"></div></div><div class=\"q\"><div class=\"qn\">Question 3</div><div class=\"qt\">What does An-Nisa 4:36 specifically prove?</div></div><div class=\"als\"><div class=\"aline\"></div></div><div class=\"q\"><div class=\"qn\">Question 4</div><div class=\"qt\">List the THREE categories of Ibadah according to Ibn Taymiyyah's definition, with an example of each.</div></div><div class=\"als\"><div class=\"aline\"></div></div><div class=\"q\"><div class=\"qn\">Question 5</div><div class=\"qt\">According to the passage, why is it wrong to think worship only happens in the masjid?</div></div><div class=\"als\"><div class=\"aline\"></div></div>"}, {"id": "SORT3", "cat": "games", "lesson": 3, "title": "Sorting Activity — L3: Q4 — Why Were You Created? (Al-'Ibadah)", "badge": "Sort the Items · L3", "points": 9, "html": "<div class=\"sh-hdr\"><div class=\"sh-top\"><div class=\"sh-title\">Sorting Activity — Why Were You Created?</div><div class=\"sh-badge\">Sort the Items · L3</div></div><div class=\"sh-meta\"><div class=\"mf\"><div class=\"ml\">Name</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Date</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\"></div><div class=\"mv\"></div></div></div></div><div class=\"note\"><b>Note:</b> Cut out the items below (or number them) and sort each into the correct category.</div><div class=\"sec-hd\"><h3>Items to Sort</h3></div><div class=\"wb\"><h4>Word Bank</h4><div class=\"words\"><span class=\"word\">Saying Bismillah before eating</span><span class=\"word\">Praying Salah</span><span class=\"word\">Loving Allah in your heart</span><span class=\"word\">Making du'a</span><span class=\"word\">Fasting Ramadan</span><span class=\"word\">Trusting Allah (tawakkul)</span><span class=\"word\">Reciting Quran</span><span class=\"word\">Giving sadaqah</span><span class=\"word\">Fearing Allah</span></div></div><div class=\"sec-hd\"><h3>Sort Them Here</h3><span class=\"pts\">9 pts</span></div><table class=\"tbl\"><thead><tr><th>أَقْوَال — Statements</th><th>أَعْمَال ظَاهِرَة — Outward Actions</th><th>أَعْمَال بَاطِنَة — Inward Actions</th></tr></thead><tbody><tr><td class=\"wc\"></td><td class=\"wc\"></td><td class=\"wc\"></td></tr><tr><td class=\"wc\"></td><td class=\"wc\"></td><td class=\"wc\"></td></tr><tr><td class=\"wc\"></td><td class=\"wc\"></td><td class=\"wc\"></td></tr><tr><td class=\"wc\"></td><td class=\"wc\"></td><td class=\"wc\"></td></tr></tbody></table>"}, {"id": "SEQ3", "cat": "games", "lesson": 3, "title": "Sequencing Activity — L3: Q4 — Why Were You Created? (Al-'Ibadah)", "badge": "Put in Order · L3", "points": 6, "html": "<div class=\"sh-hdr\"><div class=\"sh-top\"><div class=\"sh-title\">Sequencing Activity — Why Were You Created?</div><div class=\"sh-badge\">Put in Order · L3</div></div><div class=\"sh-meta\"><div class=\"mf\"><div class=\"ml\">Name</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Date</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\"></div><div class=\"mv\"></div></div></div></div><div class=\"note\"><b>Note:</b> Number these events 1, 2, 3... in the correct order.</div><div class=\"sec-hd\"><h3>Put These in the Correct Order</h3><span class=\"pts\">6 pts</span></div><div class=\"q\" style=\"display:flex;gap:10px;align-items:center;\"><div class=\"al\" style=\"width:36px;flex:none;height:32px;\"></div><div class=\"qt\">The Imam asks Q4: لِأَيِّ شَيْءٍ خَلَقَكَ؟</div></div><div class=\"q\" style=\"display:flex;gap:10px;align-items:center;\"><div class=\"al\" style=\"width:36px;flex:none;height:32px;\"></div><div class=\"qt\">The Imam gives the answer: to worship Allah alone.</div></div><div class=\"q\" style=\"display:flex;gap:10px;align-items:center;\"><div class=\"al\" style=\"width:36px;flex:none;height:32px;\"></div><div class=\"qt\">The Imam brings Proof 1: Adh-Dhariyat 51:56 (the purpose).</div></div><div class=\"q\" style=\"display:flex;gap:10px;align-items:center;\"><div class=\"al\" style=\"width:36px;flex:none;height:32px;\"></div><div class=\"qt\">The Imam brings Proof 2: An-Nisa 4:36 (the command).</div></div><div class=\"q\" style=\"display:flex;gap:10px;align-items:center;\"><div class=\"al\" style=\"width:36px;flex:none;height:32px;\"></div><div class=\"qt\">The Imam defines Ibadah using Ibn Taymiyyah's words.</div></div><div class=\"q\" style=\"display:flex;gap:10px;align-items:center;\"><div class=\"al\" style=\"width:36px;flex:none;height:32px;\"></div><div class=\"qt\">The class applies the definition to real daily actions.</div></div>"}, {"id": "GUID4", "cat": "classwork", "lesson": 4, "title": "Guided Practice — L4: Ash-Shirk — The Greatest Sin", "badge": "Teacher-Led · L4", "points": 8, "html": "<div class=\"sh-hdr\"><div class=\"sh-top\"><div class=\"sh-title\">Guided Practice — Ash-Shirk — The Greatest Sin</div><div class=\"sh-badge\">Teacher-Led · L4</div></div><div class=\"sh-meta\"><div class=\"mf\"><div class=\"ml\">Name</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Date</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\"></div><div class=\"mv\"></div></div></div></div><div class=\"note\"><b>Note:</b> Work through this WITH your teacher, one section at a time. Stop at each checkpoint (⏸) to check answers together before moving on.</div><div class=\"sec-hd\"><h3>Step 1 — Read Together</h3></div><div class=\"q\"><div class=\"qt\">The Imam warns that Shirk is أَعْظَمُ ذَنْبٍ عُصِيَ اللَّهُ بِهِ — \"the greatest sin by which Allah is disobeyed.\" Shirk means making a نِدّ (rival) for Allah in worship — through 5 specific acts: calling upon, hoping in, fearing, relying on, or intensely desiring something besides Allah.</div></div><div class=\"sec-hd\"><h3>⏸ Checkpoint 1</h3></div><div class=\"q\"><div class=\"qt\">Before moving on: what does Al-Ma'idah 5:72 say happens to someone who commits Shirk?</div><div class=\"al\"></div></div><div class=\"sec-hd\"><h3>Step 2 — Fill In Together</h3><span class=\"pts\">6 pts</span></div><div class=\"wb\"><h4>Word Bank</h4><div class=\"words\"><span class=\"word\">rival</span><span class=\"word\">calling</span><span class=\"word\">hoping</span><span class=\"word\">fearing</span><span class=\"word\">relying</span><span class=\"word\">desiring</span></div></div><table class=\"tbl\"><thead><tr><th>#</th><th>Sentence</th></tr></thead><tbody><tr><td class=\"wc\">1</td><td class=\"wc\">A نِدّ means a ____.</td></tr><tr><td class=\"wc\">2</td><td class=\"wc\">Shirk act 1: ____ upon other than Allah.</td></tr><tr><td class=\"wc\">3</td><td class=\"wc\">Shirk act 2: ____ in other than Allah.</td></tr><tr><td class=\"wc\">4</td><td class=\"wc\">Shirk act 3: ____ other than Allah.</td></tr><tr><td class=\"wc\">5</td><td class=\"wc\">Shirk act 4: ____ on other than Allah.</td></tr><tr><td class=\"wc\">6</td><td class=\"wc\">Shirk act 5: intensely ____ towards other than Allah.</td></tr></tbody></table><div class=\"sec-hd\"><h3>⏸ Checkpoint 2</h3></div><div class=\"q\"><div class=\"qt\">Checkpoint: name the 2 previously-overlooked ayahs (Az-Zumar 39:14 and Ar-Ra'd 13:36) and what each proves.</div><div class=\"al\"></div></div>"}, {"id": "INDEP4", "cat": "classwork", "lesson": 4, "title": "Independent Practice — L4: Ash-Shirk — The Greatest Sin", "badge": "Work Alone · L4", "points": 12, "html": "<div class=\"sh-hdr\"><div class=\"sh-top\"><div class=\"sh-title\">Independent Practice — Ash-Shirk — The Greatest Sin</div><div class=\"sh-badge\">Work Alone · L4</div></div><div class=\"sh-meta\"><div class=\"mf\"><div class=\"ml\">Name</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Date</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\"></div><div class=\"mv\"></div></div></div></div><div class=\"note\"><b>Note:</b> Complete this ON YOUR OWN, using what you've learned. No partner, no teacher help — show what YOU know.</div><div class=\"sec-hd\"><h3>On Your Own</h3><span class=\"pts\">12 pts</span></div><div class=\"q\"><div class=\"qn\">Question 1</div><div class=\"qt\">Write the Imam's full Arabic definition of Shirk from memory, then translate it.</div></div><div class=\"als\"><div class=\"aline\"></div><div class=\"aline\"></div></div><div class=\"q\"><div class=\"qn\">Question 2</div><div class=\"qt\">List all 5 types of Shirk in Arabic and English, with one modern example of each.</div></div><div class=\"als\"><div class=\"aline\"></div><div class=\"aline\"></div></div><div class=\"q\"><div class=\"qn\">Question 3</div><div class=\"qt\">Explain what Az-Zumar 64-66 (لَيَحْبَطَنَّ عَمَلُكَ) means, and why it is addressed even to the Prophet ﷺ.</div></div><div class=\"als\"><div class=\"aline\"></div><div class=\"aline\"></div></div><div class=\"q\"><div class=\"qn\">Question 4</div><div class=\"qt\">Write out Az-Zumar 39:14 and Ar-Ra'd 13:36 and explain what each adds beyond the 3 du'a proofs.</div></div><div class=\"als\"><div class=\"aline\"></div><div class=\"aline\"></div></div>"}, {"id": "READ4", "cat": "classwork", "lesson": 4, "title": "Reading Comprehension — L4: Ash-Shirk — The Greatest Sin", "badge": "Read & Answer · L4", "points": 10, "html": "<div class=\"sh-hdr\"><div class=\"sh-top\"><div class=\"sh-title\">Reading Comprehension — Ash-Shirk — The Greatest Sin</div><div class=\"sh-badge\">Read & Answer · L4</div></div><div class=\"sh-meta\"><div class=\"mf\"><div class=\"ml\">Name</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Date</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\"></div><div class=\"mv\"></div></div></div></div><div class=\"sec-hd\"><h3>Read the passage carefully</h3></div><div class=\"q\" style=\"line-height:1.7;\">If worshipping Allah alone is our entire purpose, what happens when someone gives that worship to something else? The Imam calls this Shirk, and he does not soften his words: وَالشِّرْكُ أَعْظَمُ ذَنْبٍ عُصِيَ اللَّهُ بِهِ — \"Shirk is the GREATEST sin by which Allah is disobeyed.\" He defines Shirk as making a نِدّ (a rival) for Allah — treating something as equal to Him in worship. This happens in five specific ways: calling upon something besides Allah, placing hope in it, fearing it, relying on it, or intensely desiring it over Allah. The Imam brings powerful proofs. Al-Ma'idah 5:72 warns that whoever commits Shirk has Paradise forbidden to them, with the Fire as their home. Three ayahs about du'a — Al-Jinn 72:18, Al-Mu'minun 23:117, and Ghafir 40:60 — show that calling upon anyone besides Allah is not just Shirk, it is Kufr (disbelief), while calling upon Allah alone is the greatest act of worship. Two more ayahs, Az-Zumar 39:14 and Ar-Ra'd 13:36, command sincerity: \"Say: It is Allah I worship, sincere to Him in my religion,\" and \"I am only commanded to worship Allah and not associate any partner with Him.\" Finally, Az-Zumar 64-66 delivers a warning so serious it was addressed even to the Prophet ﷺ himself: لَيَحْبَطَنَّ عَمَلُكَ — \"your work would surely become worthless\" — if Shirk were ever committed. This teaches every Muslim that Tawhid is not one good deed among many; it is the foundation every other good deed depends on.</div><div class=\"sec-hd\"><h3>Answer the Questions</h3><span class=\"pts\">10 pts</span></div><div class=\"q\"><div class=\"qn\">Question 1</div><div class=\"qt\">What does the Imam call Shirk, and why does he use such strong language?</div></div><div class=\"als\"><div class=\"aline\"></div></div><div class=\"q\"><div class=\"qn\">Question 2</div><div class=\"qt\">What is a نِدّ, and how does it relate to the definition of Shirk?</div></div><div class=\"als\"><div class=\"aline\"></div></div><div class=\"q\"><div class=\"qn\">Question 3</div><div class=\"qt\">List the 5 ways Shirk happens, according to the passage.</div></div><div class=\"als\"><div class=\"aline\"></div></div><div class=\"q\"><div class=\"qn\">Question 4</div><div class=\"qt\">What do the 3 du'a ayahs (Al-Jinn, Al-Mu'minun, Ghafir) each show?</div></div><div class=\"als\"><div class=\"aline\"></div></div><div class=\"q\"><div class=\"qn\">Question 5</div><div class=\"qt\">What does Az-Zumar 64-66 warn, and why is it significant that it was addressed to the Prophet ﷺ?</div></div><div class=\"als\"><div class=\"aline\"></div></div>"}, {"id": "SORT4", "cat": "games", "lesson": 4, "title": "Sorting Activity — L4: Ash-Shirk — The Greatest Sin", "badge": "Sort the Items · L4", "points": 8, "html": "<div class=\"sh-hdr\"><div class=\"sh-top\"><div class=\"sh-title\">Sorting Activity — Ash-Shirk — The Greatest Sin</div><div class=\"sh-badge\">Sort the Items · L4</div></div><div class=\"sh-meta\"><div class=\"mf\"><div class=\"ml\">Name</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Date</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\"></div><div class=\"mv\"></div></div></div></div><div class=\"note\"><b>Note:</b> Cut out the items below (or number them) and sort each into the correct category.</div><div class=\"sec-hd\"><h3>Items to Sort</h3></div><div class=\"wb\"><h4>Word Bank</h4><div class=\"words\"><span class=\"word\">Making du'a to a deceased saint</span><span class=\"word\">Making du'a to Allah alone</span><span class=\"word\">Fearing Allah's displeasure</span><span class=\"word\">Fearing a lucky charm's \"power\"</span><span class=\"word\">Trusting a horoscope</span><span class=\"word\">Trusting Allah after studying hard</span><span class=\"word\">Hoping in Allah's mercy</span><span class=\"word\">Hoping a talisman brings luck</span></div></div><div class=\"sec-hd\"><h3>Sort Them Here</h3><span class=\"pts\">8 pts</span></div><table class=\"tbl\"><thead><tr><th>SHIRK (directed to other than Allah)</th><th>NOT SHIRK (directed to Allah alone)</th></tr></thead><tbody><tr><td class=\"wc\"></td><td class=\"wc\"></td></tr><tr><td class=\"wc\"></td><td class=\"wc\"></td></tr><tr><td class=\"wc\"></td><td class=\"wc\"></td></tr><tr><td class=\"wc\"></td><td class=\"wc\"></td></tr><tr><td class=\"wc\"></td><td class=\"wc\"></td></tr></tbody></table>"}, {"id": "SEQ4", "cat": "games", "lesson": 4, "title": "Sequencing Activity — L4: Ash-Shirk — The Greatest Sin", "badge": "Put in Order · L4", "points": 8, "html": "<div class=\"sh-hdr\"><div class=\"sh-top\"><div class=\"sh-title\">Sequencing Activity — Ash-Shirk — The Greatest Sin</div><div class=\"sh-badge\">Put in Order · L4</div></div><div class=\"sh-meta\"><div class=\"mf\"><div class=\"ml\">Name</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Date</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\"></div><div class=\"mv\"></div></div></div></div><div class=\"note\"><b>Note:</b> Number these events 1, 2, 3... in the correct order.</div><div class=\"sec-hd\"><h3>Put These in the Correct Order</h3><span class=\"pts\">8 pts</span></div><div class=\"q\" style=\"display:flex;gap:10px;align-items:center;\"><div class=\"al\" style=\"width:36px;flex:none;height:32px;\"></div><div class=\"qt\">The Imam states Shirk is the greatest sin.</div></div><div class=\"q\" style=\"display:flex;gap:10px;align-items:center;\"><div class=\"al\" style=\"width:36px;flex:none;height:32px;\"></div><div class=\"qt\">The Imam defines Shirk as making a نِدّ for Allah.</div></div><div class=\"q\" style=\"display:flex;gap:10px;align-items:center;\"><div class=\"al\" style=\"width:36px;flex:none;height:32px;\"></div><div class=\"qt\">The Imam lists the 5 types of Shirk.</div></div><div class=\"q\" style=\"display:flex;gap:10px;align-items:center;\"><div class=\"al\" style=\"width:36px;flex:none;height:32px;\"></div><div class=\"qt\">The Imam brings Al-Ma'idah 5:72 — the consequence of Shirk.</div></div><div class=\"q\" style=\"display:flex;gap:10px;align-items:center;\"><div class=\"al\" style=\"width:36px;flex:none;height:32px;\"></div><div class=\"qt\">The Imam brings the 3 du'a proofs.</div></div><div class=\"q\" style=\"display:flex;gap:10px;align-items:center;\"><div class=\"al\" style=\"width:36px;flex:none;height:32px;\"></div><div class=\"qt\">The Imam brings the 2 sincerity proofs (Az-Zumar 39:14, Ar-Ra'd 13:36).</div></div><div class=\"q\" style=\"display:flex;gap:10px;align-items:center;\"><div class=\"al\" style=\"width:36px;flex:none;height:32px;\"></div><div class=\"qt\">The Imam brings Az-Zumar 64-66 — Shirk nullifies all deeds.</div></div><div class=\"q\" style=\"display:flex;gap:10px;align-items:center;\"><div class=\"al\" style=\"width:36px;flex:none;height:32px;\"></div><div class=\"qt\">The Imam lists the foundations of Iman that save from Kufr.</div></div>"}, {"id": "GUID5", "cat": "classwork", "lesson": 5, "title": "Guided Practice — L5: At-Taghut & Kufr bil-Taghut", "badge": "Teacher-Led · L5", "points": 5, "html": "<div class=\"sh-hdr\"><div class=\"sh-top\"><div class=\"sh-title\">Guided Practice — At-Taghut & Kufr bil-Taghut</div><div class=\"sh-badge\">Teacher-Led · L5</div></div><div class=\"sh-meta\"><div class=\"mf\"><div class=\"ml\">Name</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Date</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\"></div><div class=\"mv\"></div></div></div></div><div class=\"note\"><b>Note:</b> Work through this WITH your teacher, one section at a time. Stop at each checkpoint (⏸) to check answers together before moving on.</div><div class=\"sec-hd\"><h3>Step 1 — Read Together</h3></div><div class=\"q\"><div class=\"qt\">The Imam states: وَأَوَّلُ مَا فَرَضَ اللَّهُ عَلَى عِبَادِهِ: الْكُفْرُ بِالطَّاغُوتِ وَالإِيمَانُ بِاللَّهِ — \"The FIRST thing Allah required of His servants is rejecting the Taghut and believing in Allah.\" Rejection comes before affirmation, just like لَا إِلَهَ comes before إِلَّا اللَّهُ.</div></div><div class=\"sec-hd\"><h3>⏸ Checkpoint 1</h3></div><div class=\"q\"><div class=\"qt\">Before moving on: what ayah (An-Nahl 16:36) proves this was every prophet's message?</div><div class=\"al\"></div></div><div class=\"sec-hd\"><h3>Step 2 — Fill In Together</h3><span class=\"pts\">3 pts</span></div><div class=\"wb\"><h4>Word Bank</h4><div class=\"words\"><span class=\"word\">rejection</span><span class=\"word\">affirmation</span><span class=\"word\">limits</span><span class=\"word\">worshipped</span><span class=\"word\">followed</span><span class=\"word\">obeyed</span></div></div><table class=\"tbl\"><thead><tr><th>#</th><th>Sentence</th></tr></thead><tbody><tr><td class=\"wc\">1</td><td class=\"wc\">The first obligation has two parts: ____ of Taghut, then ____ of Allah.</td></tr><tr><td class=\"wc\">2</td><td class=\"wc\">Ibn al-Qayyim says Taghut is whatever a person goes beyond proper ____ with.</td></tr><tr><td class=\"wc\">3</td><td class=\"wc\">His 3 categories are: ____, ____, and ____.</td></tr></tbody></table><div class=\"sec-hd\"><h3>⏸ Checkpoint 2</h3></div><div class=\"q\"><div class=\"qt\">Checkpoint: name the Imam's own 5-item list of Taghut examples.</div><div class=\"al\"></div></div>"}, {"id": "INDEP5", "cat": "classwork", "lesson": 5, "title": "Independent Practice — L5: At-Taghut & Kufr bil-Taghut", "badge": "Work Alone · L5", "points": 12, "html": "<div class=\"sh-hdr\"><div class=\"sh-top\"><div class=\"sh-title\">Independent Practice — At-Taghut & Kufr bil-Taghut</div><div class=\"sh-badge\">Work Alone · L5</div></div><div class=\"sh-meta\"><div class=\"mf\"><div class=\"ml\">Name</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Date</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\"></div><div class=\"mv\"></div></div></div></div><div class=\"note\"><b>Note:</b> Complete this ON YOUR OWN, using what you've learned. No partner, no teacher help — show what YOU know.</div><div class=\"sec-hd\"><h3>On Your Own</h3><span class=\"pts\">12 pts</span></div><div class=\"q\"><div class=\"qn\">Question 1</div><div class=\"qt\">Write the Imam's statement of the first obligation from memory, in Arabic and English.</div></div><div class=\"als\"><div class=\"aline\"></div><div class=\"aline\"></div></div><div class=\"q\"><div class=\"qn\">Question 2</div><div class=\"qt\">Give BOTH definitions of Taghut — the Imam's own list AND Ibn al-Qayyim's 3-category definition.</div></div><div class=\"als\"><div class=\"aline\"></div><div class=\"aline\"></div></div><div class=\"q\"><div class=\"qn\">Question 3</div><div class=\"qt\">Explain why Kufr bil-Taghut must come BEFORE Iman billah, using the structure of La ilaha illa Allah.</div></div><div class=\"als\"><div class=\"aline\"></div><div class=\"aline\"></div></div><div class=\"q\"><div class=\"qn\">Question 4</div><div class=\"qt\">Write out Al-Anfal 8:39 and explain what الْفِتْنَة means according to the Imam.</div></div><div class=\"als\"><div class=\"aline\"></div><div class=\"aline\"></div></div>"}, {"id": "READ5", "cat": "classwork", "lesson": 5, "title": "Reading Comprehension — L5: At-Taghut & Kufr bil-Taghut", "badge": "Read & Answer · L5", "points": 10, "html": "<div class=\"sh-hdr\"><div class=\"sh-top\"><div class=\"sh-title\">Reading Comprehension — At-Taghut & Kufr bil-Taghut</div><div class=\"sh-badge\">Read & Answer · L5</div></div><div class=\"sh-meta\"><div class=\"mf\"><div class=\"ml\">Name</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Date</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\"></div><div class=\"mv\"></div></div></div></div><div class=\"sec-hd\"><h3>Read the passage carefully</h3></div><div class=\"q\" style=\"line-height:1.7;\">Before anything else — before prayer, before fasting, before any other obligation — the Imam says there is a first duty: وَأَوَّلُ مَا فَرَضَ اللَّهُ عَلَى عِبَادِهِ: الْكُفْرُ بِالطَّاغُوتِ وَالإِيمَانُ بِاللَّهِ — \"The first thing Allah required of His servants is rejecting the Taghut and believing in Allah.\" An-Nahl 16:36 proves this was the message of every single prophet: وَلَقَدْ بَعَثْنَا فِي كُلِّ أُمَّةٍ رَسُولًا أَنِ اعْبُدُوا اللَّهَ وَاجْتَنِبُوا الطَّاغُوتَ — \"We sent to every nation a messenger: worship Allah and avoid the Taghut.\" But what exactly is a Taghut? The Imam gives his own list: Shaytan, soothsayers, astrologers, those who rule by other than what Allah revealed, and anyone followed or obeyed without right. Ibn al-Qayyim gives a more precise definition, quoted directly by the Imam: الطَّاغُوتُ مَا تَجَاوَزَ بِهِ الْعَبْدُ حَدَّهُ مِنْ مَعْبُودٍ، أَوْ مَتْبُوعٍ، أَوْ مُطَاعٍ — \"Taghut is whatever a person goes too far with, whether worshipped, followed, or obeyed.\" This matters because rejection must come BEFORE belief — just like the Shahadah itself starts with لَا إِلَهَ (the NO) before إِلَّا اللَّهُ (the YES). The Imam closes this section with Al-Anfal 8:39, explaining that the entire mission of the prophets was to fight until there is no more فِتْنَة — which the Imam explicitly defines as Shirk — so that the religion belongs entirely to Allah.</div><div class=\"sec-hd\"><h3>Answer the Questions</h3><span class=\"pts\">10 pts</span></div><div class=\"q\"><div class=\"qn\">Question 1</div><div class=\"qt\">What does the Imam say is the FIRST obligation Allah placed on His servants?</div></div><div class=\"als\"><div class=\"aline\"></div></div><div class=\"q\"><div class=\"qn\">Question 2</div><div class=\"qt\">What does An-Nahl 16:36 prove?</div></div><div class=\"als\"><div class=\"aline\"></div></div><div class=\"q\"><div class=\"qn\">Question 3</div><div class=\"qt\">Give the Imam's own 5-item list of Taghut.</div></div><div class=\"als\"><div class=\"aline\"></div></div><div class=\"q\"><div class=\"qn\">Question 4</div><div class=\"qt\">Give Ibn al-Qayyim's 3-category definition of Taghut.</div></div><div class=\"als\"><div class=\"aline\"></div></div><div class=\"q\"><div class=\"qn\">Question 5</div><div class=\"qt\">Why must rejection come before belief, according to the passage?</div></div><div class=\"als\"><div class=\"aline\"></div></div>"}, {"id": "SORT5", "cat": "games", "lesson": 5, "title": "Sorting Activity — L5: At-Taghut & Kufr bil-Taghut", "badge": "Sort the Items · L5", "points": 6, "html": "<div class=\"sh-hdr\"><div class=\"sh-top\"><div class=\"sh-title\">Sorting Activity — At-Taghut & Kufr bil-Taghut</div><div class=\"sh-badge\">Sort the Items · L5</div></div><div class=\"sh-meta\"><div class=\"mf\"><div class=\"ml\">Name</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Date</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\"></div><div class=\"mv\"></div></div></div></div><div class=\"note\"><b>Note:</b> Cut out the items below (or number them) and sort each into the correct category.</div><div class=\"sec-hd\"><h3>Items to Sort</h3></div><div class=\"wb\"><h4>Word Bank</h4><div class=\"words\"><span class=\"word\">Praying to a false idol</span><span class=\"word\">Following a false ideology instead of Islam</span><span class=\"word\">Obeying a tyrant who commands disobedience to Allah</span><span class=\"word\">Making du'a to a soothsayer</span><span class=\"word\">Blindly following a leader against the truth</span><span class=\"word\">Obeying someone's sin without question</span></div></div><div class=\"sec-hd\"><h3>Sort Them Here</h3><span class=\"pts\">6 pts</span></div><table class=\"tbl\"><thead><tr><th>مَعْبُود — Worshipped</th><th>مَتْبُوع — Followed</th><th>مُطَاع — Obeyed</th></tr></thead><tbody><tr><td class=\"wc\"></td><td class=\"wc\"></td><td class=\"wc\"></td></tr><tr><td class=\"wc\"></td><td class=\"wc\"></td><td class=\"wc\"></td></tr><tr><td class=\"wc\"></td><td class=\"wc\"></td><td class=\"wc\"></td></tr></tbody></table>"}, {"id": "SEQ5", "cat": "games", "lesson": 5, "title": "Sequencing Activity — L5: At-Taghut & Kufr bil-Taghut", "badge": "Put in Order · L5", "points": 6, "html": "<div class=\"sh-hdr\"><div class=\"sh-top\"><div class=\"sh-title\">Sequencing Activity — At-Taghut & Kufr bil-Taghut</div><div class=\"sh-badge\">Put in Order · L5</div></div><div class=\"sh-meta\"><div class=\"mf\"><div class=\"ml\">Name</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Date</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\"></div><div class=\"mv\"></div></div></div></div><div class=\"note\"><b>Note:</b> Number these events 1, 2, 3... in the correct order.</div><div class=\"sec-hd\"><h3>Put These in the Correct Order</h3><span class=\"pts\">6 pts</span></div><div class=\"q\" style=\"display:flex;gap:10px;align-items:center;\"><div class=\"al\" style=\"width:36px;flex:none;height:32px;\"></div><div class=\"qt\">The Imam states the first obligation: Kufr bil-Taghut and Iman billah.</div></div><div class=\"q\" style=\"display:flex;gap:10px;align-items:center;\"><div class=\"al\" style=\"width:36px;flex:none;height:32px;\"></div><div class=\"qt\">The Imam brings An-Nahl 16:36 as proof this is every prophet's message.</div></div><div class=\"q\" style=\"display:flex;gap:10px;align-items:center;\"><div class=\"al\" style=\"width:36px;flex:none;height:32px;\"></div><div class=\"qt\">The Imam gives his own 5-item list defining Taghut.</div></div><div class=\"q\" style=\"display:flex;gap:10px;align-items:center;\"><div class=\"al\" style=\"width:36px;flex:none;height:32px;\"></div><div class=\"qt\">The Imam quotes Ibn al-Qayyim's 3-category definition.</div></div><div class=\"q\" style=\"display:flex;gap:10px;align-items:center;\"><div class=\"al\" style=\"width:36px;flex:none;height:32px;\"></div><div class=\"qt\">The Imam explains why rejection comes before affirmation.</div></div><div class=\"q\" style=\"display:flex;gap:10px;align-items:center;\"><div class=\"al\" style=\"width:36px;flex:none;height:32px;\"></div><div class=\"qt\">The Imam brings Al-Anfal 8:39 and defines Fitnah as Shirk.</div></div>"}, {"id": "GUID6", "cat": "classwork", "lesson": 6, "title": "Guided Practice — L6: Q5 — What is Your Religion? (Al-Islam)", "badge": "Teacher-Led · L6", "points": 6, "html": "<div class=\"sh-hdr\"><div class=\"sh-top\"><div class=\"sh-title\">Guided Practice — What is Your Religion?</div><div class=\"sh-badge\">Teacher-Led · L6</div></div><div class=\"sh-meta\"><div class=\"mf\"><div class=\"ml\">Name</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Date</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\"></div><div class=\"mv\"></div></div></div></div><div class=\"note\"><b>Note:</b> Work through this WITH your teacher, one section at a time. Stop at each checkpoint (⏸) to check answers together before moving on.</div><div class=\"sec-hd\"><h3>Step 1 — Read Together</h3></div><div class=\"q\"><div class=\"qt\">Q5 asks: مَا دِينُكَ؟ — \"What is your religion?\" The answer: دِينِيَ الإِسْلَامُ — \"My religion is Islam.\" The Imam explains Islam has 4 parts, and that Islam is proven to be THE religion Allah accepts by two ayahs together: Al-Imran 3:19 and 3:85.</div></div><div class=\"sec-hd\"><h3>⏸ Checkpoint 1</h3></div><div class=\"q\"><div class=\"qt\">Before moving on: what does Al-Imran 3:85 add beyond 3:19?</div><div class=\"al\"></div></div><div class=\"sec-hd\"><h3>Step 2 — Fill In Together</h3><span class=\"pts\">4 pts</span></div><div class=\"wb\"><h4>Word Bank</h4><div class=\"words\"><span class=\"word\">surrender</span><span class=\"word\">obedience</span><span class=\"word\">loyalty</span><span class=\"word\">rejection</span></div></div><table class=\"tbl\"><thead><tr><th>#</th><th>Sentence</th></tr></thead><tbody><tr><td class=\"wc\">1</td><td class=\"wc\">Part 1: الاسْتِسْلَامُ لِلَّهِ بِالتَّوْحِيدِ = ____ to Allah with Tawhid.</td></tr><tr><td class=\"wc\">2</td><td class=\"wc\">Part 2: الانْقِيَادُ لَهُ بِالطَّاعَةِ = ____ to Him.</td></tr><tr><td class=\"wc\">3</td><td class=\"wc\">Part 3: مُوَالَاةُ الْمُسْلِمِينَ = ____ to the Muslims.</td></tr><tr><td class=\"wc\">4</td><td class=\"wc\">Part 4: مُعَادَاةُ الْمُشْرِكِينَ = ____ of Shirk.</td></tr></tbody></table><div class=\"sec-hd\"><h3>⏸ Checkpoint 2</h3></div><div class=\"q\"><div class=\"qt\">Checkpoint: name all 5 Pillars in order with their Quranic proofs.</div><div class=\"al\"></div></div>"}, {"id": "INDEP6", "cat": "classwork", "lesson": 6, "title": "Independent Practice — L6: Q5 — What is Your Religion? (Al-Islam)", "badge": "Work Alone · L6", "points": 12, "html": "<div class=\"sh-hdr\"><div class=\"sh-top\"><div class=\"sh-title\">Independent Practice — What is Your Religion?</div><div class=\"sh-badge\">Work Alone · L6</div></div><div class=\"sh-meta\"><div class=\"mf\"><div class=\"ml\">Name</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Date</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\"></div><div class=\"mv\"></div></div></div></div><div class=\"note\"><b>Note:</b> Complete this ON YOUR OWN, using what you've learned. No partner, no teacher help — show what YOU know.</div><div class=\"sec-hd\"><h3>On Your Own</h3><span class=\"pts\">12 pts</span></div><div class=\"q\"><div class=\"qn\">Question 1</div><div class=\"qt\">Write Q5's Arabic answer and all 4 parts of the meaning of Islam, from memory.</div></div><div class=\"als\"><div class=\"aline\"></div><div class=\"aline\"></div></div><div class=\"q\"><div class=\"qn\">Question 2</div><div class=\"qt\">Write BOTH Al-Imran 3:19 and 3:85, and explain why the Imam brings both instead of just one.</div></div><div class=\"als\"><div class=\"aline\"></div><div class=\"aline\"></div></div><div class=\"q\"><div class=\"qn\">Question 3</div><div class=\"qt\">Explain the true meaning of La ilaha illa Allah using the word حَقّ, and give Ibrahim's proof (Az-Zukhruf 26-28).</div></div><div class=\"als\"><div class=\"aline\"></div><div class=\"aline\"></div></div><div class=\"q\"><div class=\"qn\">Question 4</div><div class=\"qt\">List the 5 Pillars with their Quranic proofs AND the 6 Pillars of Iman with the Qadar detail (خَيْرِهِ وَشَرِّهِ).</div></div><div class=\"als\"><div class=\"aline\"></div><div class=\"aline\"></div></div>"}, {"id": "READ6", "cat": "classwork", "lesson": 6, "title": "Reading Comprehension — L6: Q5 — What is Your Religion? (Al-Islam)", "badge": "Read & Answer · L6", "points": 10, "html": "<div class=\"sh-hdr\"><div class=\"sh-top\"><div class=\"sh-title\">Reading Comprehension — What is Your Religion?</div><div class=\"sh-badge\">Read & Answer · L6</div></div><div class=\"sh-meta\"><div class=\"mf\"><div class=\"ml\">Name</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Date</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\"></div><div class=\"mv\"></div></div></div></div><div class=\"sec-hd\"><h3>Read the passage carefully</h3></div><div class=\"q\" style=\"line-height:1.7;\">Q5 is مَا دِينُكَ؟ — \"What is your religion?\" The Imam's answer is دِينِيَ الإِسْلَامُ — \"My religion is Islam.\" But he doesn't stop there — he explains exactly what Islam MEANS, in four parts: al-istislam lillah bit-tawhid (surrendering to Allah with Tawhid), al-inqiyad lahu bit-ta'ah (submitting to Him in obedience), muwalat al-muslimin (loyalty to the Muslims), and mu'adat al-mushrikin (rejection of Shirk — not hatred of people). The Imam proves Islam is THE religion Allah accepts using TWO ayahs together: Al-Imran 3:19 says إِنَّ الدِّينَ عِندَ اللَّهِ الْإِسْلَامُ, \"the religion accepted by Allah is Islam,\" and 3:85 adds وَمَن يَبْتَغِ غَيْرَ الْإِسْلَامِ دِينًا فَلَن يُقْبَلَ مِنْهُ, \"whoever seeks a religion other than Islam — it will never be accepted.\" Together these show Islam is not just A religion, but THE religion. The Imam then explains La ilaha illa Allah correctly: it means لَا مَعْبُودَ حَقٍّ إِلَّا اللَّهُ — \"no deity TRULY deserving worship except Allah\" — proven by Ibrahim's declaration in Az-Zukhruf 26-28. Finally, the Imam lists the 5 Pillars of Islam (Shahadah, Salah, Zakah, Sawm, Hajj) each with its own Quranic proof, and the 6 Pillars of Iman — belief in Allah, His Angels, His Books, His Messengers, the Last Day, and al-Qadar, its good AND its evil.</div><div class=\"sec-hd\"><h3>Answer the Questions</h3><span class=\"pts\">10 pts</span></div><div class=\"q\"><div class=\"qn\">Question 1</div><div class=\"qt\">What is Q5, and what is its Arabic answer?</div></div><div class=\"als\"><div class=\"aline\"></div></div><div class=\"q\"><div class=\"qn\">Question 2</div><div class=\"qt\">List the 4 parts of the meaning of Islam.</div></div><div class=\"als\"><div class=\"aline\"></div></div><div class=\"q\"><div class=\"qn\">Question 3</div><div class=\"qt\">Why does the Imam bring BOTH Al-Imran 3:19 and 3:85?</div></div><div class=\"als\"><div class=\"aline\"></div></div><div class=\"q\"><div class=\"qn\">Question 4</div><div class=\"qt\">What is the correct meaning of La ilaha illa Allah, and what proves it?</div></div><div class=\"als\"><div class=\"aline\"></div></div><div class=\"q\"><div class=\"qn\">Question 5</div><div class=\"qt\">Name all 5 Pillars of Islam and the 6 Pillars of Iman.</div></div><div class=\"als\"><div class=\"aline\"></div></div>"}, {"id": "SORT6", "cat": "games", "lesson": 6, "title": "Sorting Activity — L6: Q5 — What is Your Religion? (Al-Islam)", "badge": "Sort the Items · L6", "points": 9, "html": "<div class=\"sh-hdr\"><div class=\"sh-top\"><div class=\"sh-title\">Sorting Activity — What is Your Religion?</div><div class=\"sh-badge\">Sort the Items · L6</div></div><div class=\"sh-meta\"><div class=\"mf\"><div class=\"ml\">Name</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Date</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\"></div><div class=\"mv\"></div></div></div></div><div class=\"note\"><b>Note:</b> Cut out the items below (or number them) and sort each into the correct category.</div><div class=\"sec-hd\"><h3>Items to Sort</h3></div><div class=\"wb\"><h4>Word Bank</h4><div class=\"words\"><span class=\"word\">Shahadah</span><span class=\"word\">Belief in the Angels</span><span class=\"word\">Salah</span><span class=\"word\">Belief in the Books</span><span class=\"word\">Zakah</span><span class=\"word\">Belief in al-Qadar</span><span class=\"word\">Sawm</span><span class=\"word\">Belief in the Last Day</span><span class=\"word\">Hajj</span></div></div><div class=\"sec-hd\"><h3>Sort Them Here</h3><span class=\"pts\">9 pts</span></div><table class=\"tbl\"><thead><tr><th>Pillar of ISLAM (5 Pillars)</th><th>Pillar of IMAN (6 Pillars)</th></tr></thead><tbody><tr><td class=\"wc\"></td><td class=\"wc\"></td></tr><tr><td class=\"wc\"></td><td class=\"wc\"></td></tr><tr><td class=\"wc\"></td><td class=\"wc\"></td></tr><tr><td class=\"wc\"></td><td class=\"wc\"></td></tr><tr><td class=\"wc\"></td><td class=\"wc\"></td></tr></tbody></table>"}, {"id": "SEQ6", "cat": "games", "lesson": 6, "title": "Sequencing Activity — L6: Q5 — What is Your Religion? (Al-Islam)", "badge": "Put in Order · L6", "points": 6, "html": "<div class=\"sh-hdr\"><div class=\"sh-top\"><div class=\"sh-title\">Sequencing Activity — What is Your Religion?</div><div class=\"sh-badge\">Put in Order · L6</div></div><div class=\"sh-meta\"><div class=\"mf\"><div class=\"ml\">Name</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Date</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\"></div><div class=\"mv\"></div></div></div></div><div class=\"note\"><b>Note:</b> Number these events 1, 2, 3... in the correct order.</div><div class=\"sec-hd\"><h3>Put These in the Correct Order</h3><span class=\"pts\">6 pts</span></div><div class=\"q\" style=\"display:flex;gap:10px;align-items:center;\"><div class=\"al\" style=\"width:36px;flex:none;height:32px;\"></div><div class=\"qt\">The Imam asks Q5 and gives the answer: دِينِيَ الإِسْلَامُ.</div></div><div class=\"q\" style=\"display:flex;gap:10px;align-items:center;\"><div class=\"al\" style=\"width:36px;flex:none;height:32px;\"></div><div class=\"qt\">The Imam explains the 4-part meaning of Islam.</div></div><div class=\"q\" style=\"display:flex;gap:10px;align-items:center;\"><div class=\"al\" style=\"width:36px;flex:none;height:32px;\"></div><div class=\"qt\">The Imam brings Al-Imran 3:19 and 3:85 as proof Islam is THE religion.</div></div><div class=\"q\" style=\"display:flex;gap:10px;align-items:center;\"><div class=\"al\" style=\"width:36px;flex:none;height:32px;\"></div><div class=\"qt\">The Imam explains the true meaning of La ilaha illa Allah using Ibrahim's proof.</div></div><div class=\"q\" style=\"display:flex;gap:10px;align-items:center;\"><div class=\"al\" style=\"width:36px;flex:none;height:32px;\"></div><div class=\"qt\">The Imam lists the 5 Pillars with their proofs.</div></div><div class=\"q\" style=\"display:flex;gap:10px;align-items:center;\"><div class=\"al\" style=\"width:36px;flex:none;height:32px;\"></div><div class=\"qt\">The Imam lists the 6 Pillars of Iman.</div></div>"}, {"id": "GUID7", "cat": "classwork", "lesson": 7, "title": "Guided Practice — L7: Q6 — Who is Your Prophet? ﷺ", "badge": "Teacher-Led · L7", "points": 7, "html": "<div class=\"sh-hdr\"><div class=\"sh-top\"><div class=\"sh-title\">Guided Practice — Who is Your Prophet?</div><div class=\"sh-badge\">Teacher-Led · L7</div></div><div class=\"sh-meta\"><div class=\"mf\"><div class=\"ml\">Name</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Date</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\"></div><div class=\"mv\"></div></div></div></div><div class=\"note\"><b>Note:</b> Work through this WITH your teacher, one section at a time. Stop at each checkpoint (⏸) to check answers together before moving on.</div><div class=\"sec-hd\"><h3>Step 1 — Read Together</h3></div><div class=\"q\"><div class=\"qt\">Q6 asks: مَنْ نَبِيُّكَ؟ — \"Who is your Prophet?\" The answer includes his FULL lineage: نَبِيُّنَا مُحَمَّدُ بْنُ عَبْدِ اللَّهِ بْنِ عَبْدِ الْمُطَّلِبِ بْنِ هَاشِمٍ بْنِ عَبْدِ مَنَافٍ ﷺ. The Imam then describes his selection, mission, and the full timeline of his life.</div></div><div class=\"sec-hd\"><h3>⏸ Checkpoint 1</h3></div><div class=\"q\"><div class=\"qt\">Before moving on: what did the Prophet ﷺ call people TOWARD, and what did he call them AWAY FROM?</div><div class=\"al\"></div></div><div class=\"sec-hd\"><h3>Step 2 — Fill In Together</h3><span class=\"pts\">5 pts</span></div><div class=\"wb\"><h4>Word Bank</h4><div class=\"words\"><span class=\"word\">40</span><span class=\"word\">10</span><span class=\"word\">five</span><span class=\"word\">direct</span><span class=\"word\">63</span></div></div><table class=\"tbl\"><thead><tr><th>#</th><th>Sentence</th></tr></thead><tbody><tr><td class=\"wc\">1</td><td class=\"wc\">Prophethood began at age ____.</td></tr><tr><td class=\"wc\">2</td><td class=\"wc\">He called in Makkah for about ____ years.</td></tr><tr><td class=\"wc\">3</td><td class=\"wc\">On Al-Mi'raj, the ____ prayers were made obligatory.</td></tr><tr><td class=\"wc\">4</td><td class=\"wc\">This happened through a ____ connection with no intermediary.</td></tr><tr><td class=\"wc\">5</td><td class=\"wc\">He passed away at age ____, with the Deen completed.</td></tr></tbody></table><div class=\"sec-hd\"><h3>⏸ Checkpoint 2</h3></div><div class=\"q\"><div class=\"qt\">Checkpoint: name the 4 best humans after the prophets, in order.</div><div class=\"al\"></div></div>"}, {"id": "INDEP7", "cat": "classwork", "lesson": 7, "title": "Independent Practice — L7: Q6 — Who is Your Prophet? ﷺ", "badge": "Work Alone · L7", "points": 12, "html": "<div class=\"sh-hdr\"><div class=\"sh-top\"><div class=\"sh-title\">Independent Practice — Who is Your Prophet?</div><div class=\"sh-badge\">Work Alone · L7</div></div><div class=\"sh-meta\"><div class=\"mf\"><div class=\"ml\">Name</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Date</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\"></div><div class=\"mv\"></div></div></div></div><div class=\"note\"><b>Note:</b> Complete this ON YOUR OWN, using what you've learned. No partner, no teacher help — show what YOU know.</div><div class=\"sec-hd\"><h3>On Your Own</h3><span class=\"pts\">12 pts</span></div><div class=\"q\"><div class=\"qn\">Question 1</div><div class=\"qt\">Write Q6's full Arabic answer, including the complete lineage, from memory.</div></div><div class=\"als\"><div class=\"aline\"></div><div class=\"aline\"></div></div><div class=\"q\"><div class=\"qn\">Question 2</div><div class=\"qt\">Describe the Prophet's ﷺ selection and mission using the Imam's exact phrases.</div></div><div class=\"als\"><div class=\"aline\"></div><div class=\"aline\"></div></div><div class=\"q\"><div class=\"qn\">Question 3</div><div class=\"qt\">Write out the full timeline of the Prophet's ﷺ life with ages/durations, in the correct order.</div></div><div class=\"als\"><div class=\"aline\"></div><div class=\"aline\"></div></div><div class=\"q\"><div class=\"qn\">Question 4</div><div class=\"qt\">Explain who the first and last messengers were, with their Quranic proofs, and name the 4 best humans after the prophets in order.</div></div><div class=\"als\"><div class=\"aline\"></div><div class=\"aline\"></div></div>"}, {"id": "READ7", "cat": "classwork", "lesson": 7, "title": "Reading Comprehension — L7: Q6 — Who is Your Prophet? ﷺ", "badge": "Read & Answer · L7", "points": 10, "html": "<div class=\"sh-hdr\"><div class=\"sh-top\"><div class=\"sh-title\">Reading Comprehension — Who is Your Prophet?</div><div class=\"sh-badge\">Read & Answer · L7</div></div><div class=\"sh-meta\"><div class=\"mf\"><div class=\"ml\">Name</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Date</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\"></div><div class=\"mv\"></div></div></div></div><div class=\"sec-hd\"><h3>Read the passage carefully</h3></div><div class=\"q\" style=\"line-height:1.7;\">The final of the six questions is Q6: مَنْ نَبِيُّكَ؟ — \"Who is your Prophet?\" The Imam's answer includes the Prophet's ﷺ full lineage: نَبِيُّنَا مُحَمَّدُ بْنُ عَبْدِ اللَّهِ بْنِ عَبْدِ الْمُطَّلِبِ بْنِ هَاشِمٍ بْنِ عَبْدِ مَنَافٍ. The Imam explains that Allah chose him from Quraysh, sent him to al-ahmar wal-aswad (every people, every color), and revealed to him the Book and Wisdom. His mission had a clear purpose: to call people to sincere worship of Allah alone, and to call them AWAY from worshipping idols, stones, trees, prophets, righteous people, and even angels. The Imam then gives an exact timeline: prophethood began at age 40; for about 10 years he called only to Tawhid in Makkah; on the night of Al-Mi'raj, the five daily prayers were made obligatory directly, with no intermediary between him and Allah — unlike every other command, which came through Jibril; after the Hijrah, about 10 more years of striving followed, until people entered the religion of Allah in multitudes; he passed away at age 63, by which time Allah had completed the religion. The Imam adds that Nuh ﷺ was the first messenger (proven by An-Nisa 4:163) and Muhammad ﷺ is the last, the Seal of the Prophets (proven by Al-Ahzab 33:40). After the prophets, the best of humanity are Abu Bakr, Umar, Uthman, and Ali, in that order — and the hadith of the best generations (Bukhari 2652/Muslim 6635) reminds us to understand Islam the way the earliest generations did.</div><div class=\"sec-hd\"><h3>Answer the Questions</h3><span class=\"pts\">10 pts</span></div><div class=\"q\"><div class=\"qn\">Question 1</div><div class=\"qt\">What is Q6, and what is included in its full answer?</div></div><div class=\"als\"><div class=\"aline\"></div></div><div class=\"q\"><div class=\"qn\">Question 2</div><div class=\"qt\">Describe the Prophet's ﷺ mission — what did he call people toward, and away from?</div></div><div class=\"als\"><div class=\"aline\"></div></div><div class=\"q\"><div class=\"qn\">Question 3</div><div class=\"qt\">Give the complete timeline of the Prophet's ﷺ life with ages and durations.</div></div><div class=\"als\"><div class=\"aline\"></div></div><div class=\"q\"><div class=\"qn\">Question 4</div><div class=\"qt\">What made the five prayers unique among all the commands he received?</div></div><div class=\"als\"><div class=\"aline\"></div></div><div class=\"q\"><div class=\"qn\">Question 5</div><div class=\"qt\">Name the first and last messengers with their proofs, and the 4 best humans after the prophets.</div></div><div class=\"als\"><div class=\"aline\"></div></div>"}, {"id": "SORT7", "cat": "games", "lesson": 7, "title": "Sorting Activity — L7: Q6 — Who is Your Prophet? ﷺ", "badge": "Sort the Items · L7", "points": 8, "html": "<div class=\"sh-hdr\"><div class=\"sh-top\"><div class=\"sh-title\">Sorting Activity — Who is Your Prophet?</div><div class=\"sh-badge\">Sort the Items · L7</div></div><div class=\"sh-meta\"><div class=\"mf\"><div class=\"ml\">Name</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Date</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\"></div><div class=\"mv\"></div></div></div></div><div class=\"note\"><b>Note:</b> Cut out the items below (or number them) and sort each into the correct category.</div><div class=\"sec-hd\"><h3>Items to Sort</h3></div><div class=\"wb\"><h4>Word Bank</h4><div class=\"words\"><span class=\"word\">Sincere worship of Allah alone</span><span class=\"word\">Worshipping idols</span><span class=\"word\">Worshipping stones</span><span class=\"word\">Worshipping trees</span><span class=\"word\">Worshipping prophets</span><span class=\"word\">Worshipping the righteous</span><span class=\"word\">Worshipping angels</span><span class=\"word\">Ikhlas al-'ibadah lillah</span></div></div><div class=\"sec-hd\"><h3>Sort Them Here</h3><span class=\"pts\">8 pts</span></div><table class=\"tbl\"><thead><tr><th>Called TOWARD</th><th>Called AWAY FROM</th></tr></thead><tbody><tr><td class=\"wc\"></td><td class=\"wc\"></td></tr><tr><td class=\"wc\"></td><td class=\"wc\"></td></tr><tr><td class=\"wc\"></td><td class=\"wc\"></td></tr><tr><td class=\"wc\"></td><td class=\"wc\"></td></tr><tr><td class=\"wc\"></td><td class=\"wc\"></td></tr></tbody></table>"}, {"id": "SEQ7", "cat": "games", "lesson": 7, "title": "Sequencing Activity — L7: Q6 — Who is Your Prophet? ﷺ", "badge": "Put in Order · L7", "points": 7, "html": "<div class=\"sh-hdr\"><div class=\"sh-top\"><div class=\"sh-title\">Sequencing Activity — Who is Your Prophet?</div><div class=\"sh-badge\">Put in Order · L7</div></div><div class=\"sh-meta\"><div class=\"mf\"><div class=\"ml\">Name</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Date</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\"></div><div class=\"mv\"></div></div></div></div><div class=\"note\"><b>Note:</b> Number these events 1, 2, 3... in the correct order.</div><div class=\"sec-hd\"><h3>Put These in the Correct Order</h3><span class=\"pts\">7 pts</span></div><div class=\"q\" style=\"display:flex;gap:10px;align-items:center;\"><div class=\"al\" style=\"width:36px;flex:none;height:32px;\"></div><div class=\"qt\">Prophethood begins at age 40.</div></div><div c
