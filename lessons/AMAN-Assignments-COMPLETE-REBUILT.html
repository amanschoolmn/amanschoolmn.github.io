e\"><b>Note:</b> Work with a partner. Take turns — both partners must speak, write, and be ready to be called on.</div><div class=\"sec-hd\"><h3>Task</h3></div><div class=\"q\"><div class=\"qn\">Question 1</div><div class=\"qt\">With your partner, list 3 people or things in modern life that SHOULD be obeyed/followed within proper limits (e.g., a parent, a teacher, a traffic law). For each, discuss: where is the proper limit, and what would crossing it look like?</div></div><div class=\"als\"><div class=\"aline\"></div><div class=\"aline\"></div><div class=\"aline\"></div></div>"}, {"id": "GRP5", "cat": "collab", "lesson": 5, "title": "Group Activity — L5: At-Taghut & Kufr bil-Taghut", "badge": "Small Group · L5", "points": null, "html": "<div class=\"sh-hdr\"><div class=\"sh-top\"><div class=\"sh-title\">Group Activity — At-Taghut & Kufr bil-Taghut</div><div class=\"sh-badge\">Small Group · L5</div></div><div class=\"sh-meta\"><div class=\"mf\"><div class=\"ml\">Group Members</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Date</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\"></div><div class=\"mv\"></div></div></div></div><div class=\"note\"><b>Note:</b> Groups of 3-4. Assign roles: Reader, Recorder, Reporter, Timekeeper. Every group presents for 60 seconds when done.</div><div class=\"sec-hd\"><h3>Task</h3></div><div class=\"q\"><div class=\"qn\">Question 1</div><div class=\"qt\">Group debate (3 minutes): \"Is it possible to say the Shahadah correctly without truly rejecting Taghut?\" Use La ilaha illa Allah's two-part structure to argue your side. Reporter summarizes both sides for the class.</div></div>"}, {"id": "OPEN6", "cat": "openers", "lesson": 6, "title": "Daily Opener — L6: Q5 — What is Your Religion? (Al-Islam)", "badge": "Bell Ringer + Warm-Up · L6", "points": null, "html": "<div class=\"sh-hdr\"><div class=\"sh-top\"><div class=\"sh-title\">Daily Opener — What is Your Religion?</div><div class=\"sh-badge\">Bell Ringer + Warm-Up · L6</div></div><div class=\"sh-meta\"><div class=\"mf\"><div class=\"ml\">Name</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Date</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\"></div><div class=\"mv\"></div></div></div></div><div class=\"sec-hd\"><h3>🔔 Bell Ringer (3-5 min — books closed)</h3></div><div class=\"q\"><div class=\"qn\">Quick Recall</div><span class=\"qar\">مَا الطَّاغُوت؟</span><div class=\"qt\">Give the Imam's own list of Taghut types (name at least 3).</div><div class=\"al\"></div></div><div class=\"sec-hd\"><h3>☀️ Warm-Up (connects to today)</h3></div><div class=\"q\"><div class=\"qn\">Think About It</div><div class=\"qt\">مَا دِينُكَ؟ — What is your Deen? Before we open the book: what do YOU think the word \"Islam\" means, in your own words?</div><div class=\"al\"></div><div class=\"al\"></div></div>"}, {"id": "EXIT6", "cat": "openers", "lesson": 6, "title": "Exit Ticket — L6: Q5 — What is Your Religion? (Al-Islam)", "badge": "Exit Ticket · L6", "points": null, "html": "<div class=\"sh-hdr\"><div class=\"sh-top\"><div class=\"sh-title\">Exit Ticket — What is Your Religion?</div><div class=\"sh-badge\">Exit Ticket · L6</div></div><div class=\"sh-meta\"><div class=\"mf\"><div class=\"ml\">Name</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Date</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\"></div><div class=\"mv\"></div></div></div></div><div class=\"sec-hd\"><h3>Before you leave...</h3></div><div class=\"q\"><div class=\"qn\">Question 1</div><div class=\"qt\">Write today's question and its Arabic answer.</div><span class=\"qar\">مَا دِينُكَ؟</span></div><div class=\"q\"><div class=\"qn\">Question 2</div><div class=\"qt\">Name ONE of the 5 Pillars and its Quranic proof from the book.</div></div><div class=\"q\"><div class=\"qn\">Question 3 — Self-Check</div><div class=\"qt\">Rate how confident you feel with today's lesson:</div><div class=\"mc\"><div class=\"mco\"><div class=\"bub\"></div>😄 I could teach this to someone else</div><div class=\"mco\"><div class=\"bub\"></div>🙂 I understand it well</div><div class=\"mco\"><div class=\"bub\"></div>🤔 I need a bit more practice</div><div class=\"mco\"><div class=\"bub\"></div>😕 I need to review this with my teacher</div></div></div>"}, {"id": "ORAL6", "cat": "oral", "lesson": 6, "title": "Oral Review Script — L6: Q5 — What is Your Religion? (Al-Islam)", "badge": "Teacher-Led Drill · L6", "points": null, "html": "<div class=\"sh-hdr\"><div class=\"sh-top\"><div class=\"sh-title\">Oral Review — What is Your Religion?</div><div class=\"sh-badge\">Teacher-Led Drill · L6</div></div><div class=\"sh-meta\"><div class=\"mf\"><div class=\"ml\">Teacher</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Date</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Class</div><div class=\"mv\"></div></div></div></div><div class=\"note\"><b>Note:</b> Whole-class call-and-response. Say the prompt, point to a student (or the whole class), then reveal the expected answer. Move fast — this is retrieval practice, not re-teaching.</div><div class=\"sec-hd\"><h3>Call & Response</h3></div><div class=\"oral\"><div class=\"oral-row\"><div class=\"oral-n\">1</div><div class=\"oral-p\">مَا دِينُكَ؟</div><div class=\"oral-a\">دِينِيَ الإِسْلَامُ</div></div><div class=\"oral-row\"><div class=\"oral-n\">2</div><div class=\"oral-p\">What ayah says Islam is THE religion of Allah?</div><div class=\"oral-a\">Al-Imran 3:19 — إِنَّ الدِّينَ عِندَ اللَّهِ الْإِسْلَامُ</div></div><div class=\"oral-row\"><div class=\"oral-n\">3</div><div class=\"oral-p\">What ayah says a religion other than Islam is never accepted?</div><div class=\"oral-a\">Al-Imran 3:85</div></div><div class=\"oral-row\"><div class=\"oral-n\">4</div><div class=\"oral-p\">Name the 4 components of the Imam's definition of Islam.</div><div class=\"oral-a\">الاسْتِسْلَامُ لِلَّهِ بِالتَّوْحِيدِ · الانْقِيَادُ لَهُ بِالطَّاعَةِ · مُوَالَاةُ الْمُسْلِمِينَ · مُعَادَاةُ الْمُشْرِكِينَ</div></div><div class=\"oral-row\"><div class=\"oral-n\">5</div><div class=\"oral-p\">What is the correct meaning of La ilaha illa Allah?</div><div class=\"oral-a\">لَا مَعْبُودَ حَقٍّ إِلَّا اللَّهُ — no deity TRULY deserving worship except Allah</div></div><div class=\"oral-row\"><div class=\"oral-n\">6</div><div class=\"oral-p\">Which prophet's declaration proves this meaning?</div><div class=\"oral-a\">Ibrahim ﷺ — Az-Zukhruf 43:26-28</div></div><div class=\"oral-row\"><div class=\"oral-n\">7</div><div class=\"oral-p\">What ayah proves Salah and Zakah (Pillars 2-3)?</div><div class=\"oral-a\">Al-Bayyinah 98:5</div></div><div class=\"oral-row\"><div class=\"oral-n\">8</div><div class=\"oral-p\">Name all 6 Pillars of Iman.</div><div class=\"oral-a\">Allah, His Angels, His Books, His Messengers, the Last Day, al-Qadar (good and evil)</div></div></div>"}, {"id": "VOCAB6", "cat": "vocab", "lesson": 6, "title": "Vocabulary & Flashcards — L6: Q5 — What is Your Religion? (Al-Islam)", "badge": "Arabic Terms · L6", "points": 9, "html": "<div class=\"sh-hdr\"><div class=\"sh-top\"><div class=\"sh-title\">Vocabulary Review — What is Your Religion?</div><div class=\"sh-badge\">Arabic Terms · L6</div></div><div class=\"sh-meta\"><div class=\"mf\"><div class=\"ml\">Name</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Date</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Score</div><div class=\"mv\"></div></div></div></div><div class=\"sec-hd\"><h3>Flashcards — cut along the lines</h3></div><div class=\"fc-grid\"><div class=\"fc\"><div class=\"fc-front\"><span class=\"qar\" style=\"font-size:1.6rem;\">إِسْلَام</span><div class=\"fc-tr\">Islam</div></div><div class=\"fc-back\">Submission to Allah alone</div></div><div class=\"fc\"><div class=\"fc-front\"><span class=\"qar\" style=\"font-size:1.6rem;\">اسْتِسْلَام</span><div class=\"fc-tr\">Istislam</div></div><div class=\"fc-back\">Submission</div></div><div class=\"fc\"><div class=\"fc-front\"><span class=\"qar\" style=\"font-size:1.6rem;\">انْقِيَاد</span><div class=\"fc-tr\">Inqiyad</div></div><div class=\"fc-back\">Compliance / following through</div></div><div class=\"fc\"><div class=\"fc-front\"><span class=\"qar\" style=\"font-size:1.6rem;\">مُوَالَاة</span><div class=\"fc-tr\">Muwalah</div></div><div class=\"fc-back\">Love and loyalty (to the Muslims)</div></div><div class=\"fc\"><div class=\"fc-front\"><span class=\"qar\" style=\"font-size:1.6rem;\">مُعَادَاة</span><div class=\"fc-tr\">Mu'adah</div></div><div class=\"fc-back\">Disavowal / enmity (toward Shirk)</div></div><div class=\"fc\"><div class=\"fc-front\"><span class=\"qar\" style=\"font-size:1.6rem;\">حَنِيف</span><div class=\"fc-tr\">Hanif</div></div><div class=\"fc-back\">One who turns away from falsehood toward Allah</div></div><div class=\"fc\"><div class=\"fc-front\"><span class=\"qar\" style=\"font-size:1.6rem;\">صَلَاة</span><div class=\"fc-tr\">Salah</div></div><div class=\"fc-back\">The prayer</div></div><div class=\"fc\"><div class=\"fc-front\"><span class=\"qar\" style=\"font-size:1.6rem;\">زَكَاة</span><div class=\"fc-tr\">Zakah</div></div><div class=\"fc-back\">The purifying charity</div></div><div class=\"fc\"><div class=\"fc-front\"><span class=\"qar\" style=\"font-size:1.6rem;\">قَدَر</span><div class=\"fc-tr\">Qadar</div></div><div class=\"fc-back\">Divine decree</div></div></div><div class=\"sec-hd\"><h3>Quiz Yourself</h3><span class=\"pts\">9 pts</span></div><table class=\"tbl\"><thead><tr><th>Arabic</th><th>Transliteration</th><th>Meaning (cover and try to recall)</th></tr></thead><tbody><tr><td class=\"wc\">إِسْلَام</td><td class=\"wc\">Islam</td><td class=\"wc\"></td></tr><tr><td class=\"wc\">اسْتِسْلَام</td><td class=\"wc\">Istislam</td><td class=\"wc\"></td></tr><tr><td class=\"wc\">انْقِيَاد</td><td class=\"wc\">Inqiyad</td><td class=\"wc\"></td></tr><tr><td cl لَامِ دِينًا فَلَن يُقْبَلَ مِنْهُ</span><div class=\"qt\">1. Copy the ayah above in your own handwriting: </div><div class=\"al\"></div><div class=\"qt\">2. Translate it in your own words: </div><div class=\"al\"></div><div class=\"qt\">3. What does this ayah prove or teach? </div><div class=\"al\"></div><div class=\"qt\">4. Fill in the missing word from memory: </div><div class=\"qt qar\">وَمَن يَبْتَغِ غَيْرَ الْإِسْلَامِ ______ فَلَن يُقْبَلَ مِنْهُ</div><div class=\"qt\">5. Why does this matter for how YOU live today? </div><div class=\"al\"></div></div><div class=\"q\"><div class=\"qn\">Ayah 3 — Az-Zukhruf 43:26-28</div><span class=\"qar\">إِنَّنِي بَرَاءٌ مِّمَّا تَعْبُدُونَ ۞ إِلَّا الَّذِي فَطَرَنِي</span><div class=\"qt\">1. Copy the ayah above in your own handwriting: </div><div class=\"al\"></div><div class=\"qt\">2. Translate it in your own words: </div><div class=\"al\"></div><div class=\"qt\">3. What does this ayah prove or teach? </div><div class=\"al\"></div><div class=\"qt\">4. Fill in the missing word from memory: </div><div class=\"qt qar\">إِنَّنِي بَرَاءٌ مِّمَّا تَعْبُدُونَ ______ إِلَّا الَّذِي فَطَرَنِي</div><div class=\"qt\">5. Why does this matter for how YOU live today? </div><div class=\"al\"></div></div><div class=\"q\"><div class=\"qn\">Ayah 4 — Al-Bayyinah 98:5</div><span class=\"qar\">وَمَا أُمِرُوا إِلَّا لِيَعْبُدُوا اللَّهَ مُخْلِصِينَ لَهُ الدِّينَ... وَيُقِيمُوا الصَّلَاةَ وَيُؤْتُوا الزَّكَاةَ</span><div class=\"qt\">1. Copy the ayah above in your own handwriting: </div><div class=\"al\"></div><div class=\"qt\">2. Translate it in your own words: </div><div class=\"al\"></div><div class=\"qt\">3. What does this ayah prove or teach? </div><div class=\"al\"></div><div class=\"qt\">4. Fill in the missing word from memory: </div><div class=\"qt qar\">وَمَا أُمِرُوا إِلَّا لِيَعْبُدُوا اللَّهَ مُخْلِصِينَ ______ الدِّينَ... وَيُقِيمُوا الصَّلَاةَ وَيُؤْتُوا الزَّكَاةَ</div><div class=\"qt\">5. Why does this matter for how YOU live today? </div><div class=\"al\"></div></div><div class=\"q\"><div class=\"qn\">Ayah 5 — Al-Baqarah 2:183-185</div><span class=\"qar\">يَا أَيُّهَا الَّذِينَ آمَنُوا كُتِبَ عَلَيْكُمُ الصِّيَامُ</span><div class=\"qt\">1. Copy the ayah above in your own handwriting: </div><div class=\"al\"></div><div class=\"qt\">2. Translate it in your own words: </div><div class=\"al\"></div><div class=\"qt\">3. What does this ayah prove or teach? </div><div class=\"al\"></div><div class=\"qt\">4. Fill in the missing word from memory: </div><div class=\"qt qar\">يَا أَيُّهَا الَّذِينَ ______ كُتِبَ عَلَيْكُمُ الصِّيَامُ</div><div class=\"qt\">5. Why does this matter for how YOU live today? </div><div class=\"al\"></div></div><div class=\"q\"><div class=\"qn\">Ayah 6 — Al-Imran 3:97</div><span class=\"qar\">وَلِلَّهِ عَلَى النَّاسِ حِجُّ الْبَيْتِ</span><div class=\"qt\">1. Copy the ayah above in your own handwriting: </div><div class=\"al\"></div><div class=\"qt\">2. Translate it in your own words: </div><div class=\"al\"></div><div class=\"qt\">3. What does this ayah prove or teach? </div><div class=\"al\"></div><div class=\"qt\">4. Fill in the missing word from memory: </div><div class=\"qt qar\">وَلِلَّهِ عَلَى ______ حِجُّ الْبَيْتِ</div><div class=\"qt\">5. Why does this matter for how YOU live today? </div><div class=\"al\"></div></div><div class=\"sec-hd\"><h3>This Lesson's Hadith (1)</h3><span class=\"pts\">4 pts</span></div><div class=\"q\"><div class=\"qn\">Hadith of Umar — the 5 Pillars — Bukhari 4777 / Muslim 102</div><span class=\"qar\">الإِسْلَامُ أَنْ تَشْهَدَ أَنْ لَا إِلَهَ إِلَّا اللَّهُ وَأَنَّ مُحَمَّدًا رَسُولُ اللَّهِ، وَتُقِيمَ الصَّلَاةَ، وَتُؤْتِيَ الزَّكَاةَ، وَتَصُومَ رَمَضَانَ، وَتَحُجَّ الْبَيْتَ إِنِ اسْتَطَعْتَ إِلَيْهِ سَبِيلًا</span><div class=\"qt\">1. What does this hadith prove? </div><div class=\"al\"></div><div class=\"qt\">2. Translate it in your own words: </div><div class=\"al\"></div><div class=\"qt\">3. Which collection(s) narrate it, and what does that tell you about its strength? </div><div class=\"al\"></div></div>"}, {"id": "MATCH6", "cat": "games", "lesson": 6, "title": "Matching Activity — L6: Q5 — What is Your Religion? (Al-Islam)", "badge": "Match the Terms · L6", "points": 6, "html": "<div class=\"sh-hdr\"><div class=\"sh-top\"><div class=\"sh-title\">Matching — What is Your Religion?</div><div class=\"sh-badge\">Match the Terms · L6</div></div><div class=\"sh-meta\"><div class=\"mf\"><div class=\"ml\">Name</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Date</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Score</div><div class=\"mv\"></div></div></div></div><div class=\"sec-hd\"><h3>Draw a line (or write the letter) to match each item</h3><span class=\"pts\">6 pts</span></div><div class=\"match-grid\"><div class=\"match-col\"><h4>Column A</h4><div class=\"mi\"><div class=\"mn\">1</div>اسْتِسْلَام</div><div class=\"mi\"><div class=\"mn\">2</div>انْقِيَاد</div><div class=\"mi\"><div class=\"mn\">3</div>مُوَالَاة</div><div class=\"mi\"><div class=\"mn\">4</div>مُعَادَاة</div><div class=\"mi\"><div class=\"mn\">5</div>حَنِيف</div><div class=\"mi\"><div class=\"mn\">6</div>قَدَر</div></div><div class=\"match-col\"><h4>Column B</h4><div class=\"mi\"><div class=\"mlt\">A</div>Turning away from falsehood toward Allah<div class=\"mblk\"></div></div><div class=\"mi\"><div class=\"mlt\">B</div>Submission<div class=\"mblk\"></div></div><div class=\"mi\"><div class=\"mlt\">C</div>Divine decree<div class=\"mblk\"></div></div><div class=\"mi\"><div class=\"mlt\">D</div>Compliance / following through<div class=\"mblk\"></div></div><div class=\"mi\"><div class=\"mlt\">E</div>Disavowal of Shirk<div class=\"mblk\"></div></div><div class=\"mi\"><div class=\"mlt\">F</div>Love and loyalty to Muslims<div class=\"mblk\"></div></div></div></div>"}, {"id": "TF6", "cat": "games", "lesson": 6, "title": "True/False — L6: Q5 — What is Your Religion? (Al-Islam)", "badge": "T/F Quick Check · L6", "points": 8, "html": "<div class=\"sh-hdr\"><div class=\"sh-top\"><div class=\"sh-title\">True or False — What is Your Religion?</div><div class=\"sh-badge\">T/F Quick Check · L6</div></div><div class=\"sh-meta\"><div class=\"mf\"><div class=\"ml\">Name</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Date</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Score</div><div class=\"mv\"></div></div></div></div><div class=\"sec-hd\"><h3>Circle T or F for each statement</h3><span class=\"pts\">8 pts</span></div><div class=\"tf\"><div class=\"tfrow\"><div class=\"tfopt\"><span class=\"tfbub\">T</span><span class=\"tfbub\">F</span></div><div class=\"tftext\">1. The Imam's answer to \"Ma dinuk?\" is \"Dini al-Islam\" — the article, not \"Dini-ya al-Islam,\" my religion.</div></div><div class=\"tfrow\"><div class=\"tfopt\"><span class=\"tfbub\">T</span><span class=\"tfbub\">F</span></div><div class=\"tftext\">2. Al-Imran 3:19 and 3:85 together prove Islam is THE only accepted religion.</div></div><div class=\"tfrow\"><div class=\"tfopt\"><span class=\"tfbub\">T</span><span class=\"tfbub\">F</span></div><div class=\"tftext\">3. The 4th component of Islam, مُعَادَاةُ الْمُشْرِكِينَ, means hating people who are not Muslim.</div></div><div class=\"tfrow\"><div class=\"tfopt\"><span class=\"tfbub\">T</span><span class=\"tfbub\">F</span></div><div class=\"tftext\">4. La ilaha illa Allah means \"there is no god,\" full stop.</div></div><div class=\"tfrow\"><div class=\"tfopt\"><span class=\"tfbub\">T</span><span class=\"tfbub\">F</span></div><div class=\"tftext\">5. The hadith of Umar (Bukhari 4777 / Muslim 102) lists all 5 Pillars of Islam.</div></div><div class=\"tfrow\"><div class=\"tfopt\"><span class=\"tfbub\">T</span><span class=\"tfbub\">F</span></div><div class=\"tftext\">6. Salah was made obligatory directly from Allah to the Prophet ﷺ on Al-Mi'raj, without an intermediary.</div></div><div class=\"tfrow\"><div class=\"tfopt\"><span class=\"tfbub\">T</span><span class=\"tfbub\">F</span></div><div class=\"tftext\">7. Al-Qadar must be believed in only for the good decrees, not the difficult ones.</div></div><div class=\"tfrow\"><div class=\"tfopt\"><span class=\"tfbub\">T</span><span class=\"tfbub\">F</span></div><div class=\"tftext\">8. The 6 Pillars of Iman include belief in Allah, Angels, Books, Messengers, the Last Day, and al-Qadar.</div></div></div>"}, {"id": "WS6", "cat": "games", "lesson": 6, "title": "Word Search — L6: Q5 — What is Your Religion? (Al-Islam)", "badge": "Puzzle · L6", "points": null, "html": "<div class=\"sh-hdr\"><div class=\"sh-top\"><div class=\"sh-title\">Word Search — What is Your Religion?</div><div class=\"sh-badge\">Puzzle · L6</div></div><div class=\"sh-meta\"><div class=\"mf\"><div class=\"ml\">Name</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Date</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Score</div><div class=\"mv\"></div></div></div></div><div class=\"sec-hd\"><h3>Find every term (transliterated)</h3></div><div class=\"ws-wrap\"><table class=\"ws\"><tr><td>P</td><td>M</td><td>U</td><td>A</td><td>D</td><td>A</td><td>H</td><td>H</td><td>O</td><td>R</td><td>E</td><td>M</td></tr><tr><td>I</td><td>G</td><td>T</td><td>Z</td><td>A</td><td>K</td><td>A</td><td>H</td><td>Q</td><td>X</td><td>H</td><td>E</td></tr><tr><td>C</td><td>S</td><td>I</td><td>Y</td><td>Q</td><td>Z</td><td>N</td><td>K</td><td>Z</td><td>A</td><td>Q</td><td>I</td></tr><tr><td>A</td><td>J</td><td>T</td><td>X</td><td>J</td><td>A</td><td>S</td><td>S</td><td>L</td><td>V</td><td>P</td><td>E</td></tr><tr><td>O</td><td>R</td><td>P</td><td>I</td><td>L</td><td>K</td><td>D</td><td>A</td><td>R</td><td>Y</td><td>R</td><td>M</td></tr><tr><td>O</td><td>K</td><td>G</td><td>W</td><td>S</td><td>H</td><td>S</td><td>A</td><td>S</td><td>M</td><td>H</td><td>Y</td></tr><tr><td>N</td><td>B</td><td>K</td><td>X</td><td>P</td><td>L</td><td>W</td><td>I< Activity — What is Your Religion?</div><div class=\"sh-badge\">Small Group · L6</div></div><div class=\"sh-meta\"><div class=\"mf\"><div class=\"ml\">Group Members</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Date</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\"></div><div class=\"mv\"></div></div></div></div><div class=\"note\"><b>Note:</b> Groups of 3-4. Assign roles: Reader, Recorder, Reporter, Timekeeper. Every group presents for 60 seconds when done.</div><div class=\"sec-hd\"><h3>Task</h3></div><div class=\"q\"><div class=\"qn\">Question 1</div><div class=\"qt\">Build a large two-column chart: \"5 Pillars of Islam\" and \"6 Pillars of Iman.\" Each group member is responsible for at least 2 pillars — write the Arabic name, English meaning, and proof/key detail. Combine into one chart and present.</div></div>"}, {"id": "OPEN7", "cat": "openers", "lesson": 7, "title": "Daily Opener — L7: Q6 — Who is Your Prophet? ﷺ", "badge": "Bell Ringer + Warm-Up · L7", "points": null, "html": "<div class=\"sh-hdr\"><div class=\"sh-top\"><div class=\"sh-title\">Daily Opener — Who is Your Prophet? ﷺ</div><div class=\"sh-badge\">Bell Ringer + Warm-Up · L7</div></div><div class=\"sh-meta\"><div class=\"mf\"><div class=\"ml\">Name</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Date</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\"></div><div class=\"mv\"></div></div></div></div><div class=\"sec-hd\"><h3>🔔 Bell Ringer (3-5 min — books closed)</h3></div><div class=\"q\"><div class=\"qn\">Quick Recall</div><span class=\"qar\">مَا دِينُكَ؟</span><div class=\"qt\">Name the 4 components of Islam from last lesson.</div><div class=\"al\"></div></div><div class=\"sec-hd\"><h3>☀️ Warm-Up (connects to today)</h3></div><div class=\"q\"><div class=\"qn\">Think About It</div><div class=\"qt\">Before we open the book: what do you already know and love about the Prophet Muhammad ﷺ? Share one thing.</div><div class=\"al\"></div><div class=\"al\"></div></div>"}, {"id": "EXIT7", "cat": "openers", "lesson": 7, "title": "Exit Ticket — L7: Q6 — Who is Your Prophet? ﷺ", "badge": "Exit Ticket · L7", "points": null, "html": "<div class=\"sh-hdr\"><div class=\"sh-top\"><div class=\"sh-title\">Exit Ticket — Who is Your Prophet? ﷺ</div><div class=\"sh-badge\">Exit Ticket · L7</div></div><div class=\"sh-meta\"><div class=\"mf\"><div class=\"ml\">Name</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Date</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\"></div><div class=\"mv\"></div></div></div></div><div class=\"sec-hd\"><h3>Before you leave...</h3></div><div class=\"q\"><div class=\"qn\">Question 1</div><div class=\"qt\">Write as much of the Prophet's ﷺ full lineage as you can recall.</div><span class=\"qar\">مَنْ نَبِيُّكَ؟</span></div><div class=\"q\"><div class=\"qn\">Question 2</div><div class=\"qt\">Name ONE thing the Prophet ﷺ called people AWAY from that surprised you, and explain why it's on the list.</div></div><div class=\"q\"><div class=\"qn\">Question 3 — Self-Check</div><div class=\"qt\">Rate how confident you feel with today's lesson:</div><div class=\"mc\"><div class=\"mco\"><div class=\"bub\"></div>😄 I could teach this to someone else</div><div class=\"mco\"><div class=\"bub\"></div>🙂 I understand it well</div><div class=\"mco\"><div class=\"bub\"></div>🤔 I need a bit more practice</div><div class=\"mco\"><div class=\"bub\"></div>😕 I need to review this with my teacher</div></div></div>"}, {"id": "ORAL7", "cat": "oral", "lesson": 7, "title": "Oral Review Script — L7: Q6 — Who is Your Prophet? ﷺ", "badge": "Teacher-Led Drill · L7", "points": null, "html": "<div class=\"sh-hdr\"><div class=\"sh-top\"><div class=\"sh-title\">Oral Review — Who is Your Prophet? ﷺ</div><div class=\"sh-badge\">Teacher-Led Drill · L7</div></div><div class=\"sh-meta\"><div class=\"mf\"><div class=\"ml\">Teacher</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Date</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Class</div><div class=\"mv\"></div></div></div></div><div class=\"note\"><b>Note:</b> Whole-class call-and-response. Say the prompt, point to a student (or the whole class), then reveal the expected answer. Move fast — this is retrieval practice, not re-teaching.</div><div class=\"sec-hd\"><h3>Call & Response</h3></div><div class=\"oral\"><div class=\"oral-row\"><div class=\"oral-n\">1</div><div class=\"oral-p\">مَنْ نَبِيُّكَ؟</div><div class=\"oral-a\">نَبِيُّنَا مُحَمَّدُ بْنُ عَبْدِ اللَّهِ بْنِ عَبْدِ الْمُطَّلِبِ بْنِ هَاشِمٍ بْنِ عَبْدِ مَنَافٍ ﷺ</div></div><div class=\"oral-row\"><div class=\"oral-n\">2</div><div class=\"oral-p\">What tribe was he chosen from?</div><div class=\"oral-a\">قُرَيْش — Quraysh, the elite of the children of Isma'il ﷺ</div></div><div class=\"oral-row\"><div class=\"oral-n\">3</div><div class=\"oral-p\">What does \"al-ahmar wal-aswad\" mean?</div><div class=\"oral-a\">All peoples — every nation, every color</div></div><div class=\"oral-row\"><div class=\"oral-n\">4</div><div class=\"oral-p\">At what age did prophethood begin?</div><div class=\"oral-a\">Age 40</div></div><div class=\"oral-row\"><div class=\"oral-n\">5</div><div class=\"oral-p\">How long did he call people in Makkah?</div><div class=\"oral-a\">نَحْوًا مِنْ عَشْرِ سِنِينَ — nearly 10 years</div></div><div class=\"oral-row\"><div class=\"oral-n\">6</div><div class=\"oral-p\">What made Al-Mi'raj (the 5 prayers) unique among all obligations?</div><div class=\"oral-a\">مِنْ غَيْرِ وَاسِطَةٍ — given directly, without any intermediary between him and Allah</div></div><div class=\"oral-row\"><div class=\"oral-n\">7</div><div class=\"oral-p\">Who was the first messenger, and what proves it?</div><div class=\"oral-a\">Nuh ﷺ — An-Nisa 4:163</div></div><div class=\"oral-row\"><div class=\"oral-n\">8</div><div class=\"oral-p\">What proves Muhammad ﷺ is the last, the Seal of the Prophets?</div><div class=\"oral-a\">Al-Ahzab 33:40</div></div><div class=\"oral-row\"><div class=\"oral-n\">9</div><div class=\"oral-p\">Name the 4 Rightly-Guided Caliphs in order.</div><div class=\"oral-a\">Abu Bakr, Umar, Uthman, Ali (may Allah be pleased with them all)</div></div></div>"}, {"id": "VOCAB7", "cat": "vocab", "lesson": 7, "title": "Vocabulary & Flashcards — L7: Q6 — Who is Your Prophet? ﷺ", "badge": "Arabic Terms · L7", "points": 7, "html": "<div class=\"sh-hdr\"><div class=\"sh-top\"><div class=\"sh-title\">Vocabulary Review — Who is Your Prophet? ﷺ</div><div class=\"sh-badge\">Arabic Terms · L7</div></div><div class=\"sh-meta\"><div class=\"mf\"><div class=\"ml\">Name</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Date</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Score</div><div class=\"mv\"></div></div></div></div><div class=\"sec-hd\"><h3>Flashcards — cut along the lines</h3></div><div class=\"fc-grid\"><div class=\"fc\"><div class=\"fc-front\"><span class=\"qar\" style=\"font-size:1.6rem;\">نَبِيّ</span><div class=\"fc-tr\">Nabi</div></div><div class=\"fc-back\">Prophet</div></div><div class=\"fc\"><div class=\"fc-front\"><span class=\"qar\" style=\"font-size:1.6rem;\">رَسُول</span><div class=\"fc-tr\">Rasul</div></div><div class=\"fc-back\">Messenger</div></div><div class=\"fc\"><div class=\"fc-front\"><span class=\"qar\" style=\"font-size:1.6rem;\">اصْطَفَى</span><div class=\"fc-tr\">Istafa</div></div><div class=\"fc-back\">He chose / selected</div></div><div class=\"fc\"><div class=\"fc-front\"><span class=\"qar\" style=\"font-size:1.6rem;\">هِجْرَة</span><div class=\"fc-tr\">Hijrah</div></div><div class=\"fc-back\">Migration (to Madinah)</div></div><div class=\"fc\"><div class=\"fc-front\"><span class=\"qar\" style=\"font-size:1.6rem;\">جِهَاد</span><div class=\"fc-tr\">Jihad</div></div><div class=\"fc-back\">Striving</div></div><div class=\"fc\"><div class=\"fc-front\"><span class=\"qar\" style=\"font-size:1.6rem;\">خَاتَم</span><div class=\"fc-tr\">Khatam</div></div><div class=\"fc-back\">Seal (the last of)</div></div><div class=\"fc\"><div class=\"fc-front\"><span class=\"qar\" style=\"font-size:1.6rem;\">خَلِيفَة</span><div class=\"fc-tr\">Khalifah</div></div><div class=\"fc-back\">Successor / caliph</div></div></div><div class=\"sec-hd\"><h3>Quiz Yourself</h3><span class=\"pts\">7 pts</span></div><table class=\"tbl\"><thead><tr><th>Arabic</th><th>Transliteration</th><th>Meaning (cover and try to recall)</th></tr></thead><tbody><tr><td class=\"wc\">نَبِيّ</td><td class=\"wc\">Nabi</td><td class=\"wc\"></td></tr><tr><td class=\"wc\">رَسُول</td><td class=\"wc\">Rasul</td><td class=\"wc\"></td></tr><tr><td class=\"wc\">اصْطَفَى</td><td class=\"wc\">Istafa</td><td class=\"wc\"></td></tr><tr><td class=\"wc\">هِجْرَة</td><td class=\"wc\">Hijrah</td><td class=\"wc\"></td></tr><tr><td class=\"wc\">جِهَاد</td><td class=\"wc\">Jihad</td><td class=\"wc\"></td></tr><tr><td class=\"wc\">خَاتَم</td><td class=\"wc\">Khatam</td><td class=\"wc\"></td></tr><tr><td class=\"wc\">خَلِيفَة</td><td class=\"wc\">Khalifah</td><td class=\"wc\"></td></tr></tbody></table>"}, {"id": "AYHD7", "cat": "vocab", "lesson": 7, "title": "Ayah & Hadith Review — L7: Q6 — Who is Your Prophet? ﷺ", "badge": "Recitation Practice · L7", "points": 12, "html": "<div class=\"sh-hdr\"><div class=\"sh-top\"><div class=\"sh-title\">Ayah & Hadith Review — Who is Your Prophet? ﷺ</div><div class=\"sh-badge\">Recitation Practice · L7</div></div><div class=\"sh-meta\"><div class=\"mf\"><div class=\"ml\">Name</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Date</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Score</div><div class=\"mv\"></div></div></div></div><div class=\"sec-hd\"><h3>This Lesson's Ayahs (2)</h3><span class=\"pts\">10 pts</span></div><div class=\"q\"><div class=\"qn\">Ayah 1 — An-Nisa 4:163</div><span class=\"qar\">إِنَّا أَوْحَيْنَا إِلَيْكَ كَمَا أَوْحَيْنَا إِلَىٰ نُوحٍ وَالنَّبِيِّينَ مِن بَعْدِهِ</span><div class=\"qt\">1. Copy the ayah above in your own handwriting: </div><div class=\"al\"></div><div class=\"qt\">2. Translate it in your own words: </div><div class=\"al\"></div><div class=\"qt\">3. What does this ayah prove or teach? </div><div class=\"al\"></div><div class=\"qt\">4. Fill in the missing word from memory: </div><div class=\"qt qar\">إِنَّا أَوْحَيْنَا إِلَيْكَ كَمَا أَوْحَيْنَا ______ نُوحٍ وَالنَّبِيِّينَ مِن بَعْدِهِ</div><div class=\"qt\">5. Why does this matter for how YOU live today? </div><div class=\"al\"></div></div><div class=\"q\"><div class=\"qn\">Ayah 2 — Al-Ahzab 33:40</div><span class=\"qar\">وَخَاتَمَ النَّبِيِّينَ</span><div class=\"qt\">1. Copy the ayah above in your own handwriting: </div><div class=\"al\"></div><div class=\"qt\">2. Translate it in your own words: </div><div class=\"al\"></div><div class=\"qt\">3. What does this ayah prove or teach? </div><div class=\"al\"></div><div class=\"qt\">4. Fill in the missing word from memory: </div><div class=\"qt qar\">وَخَاتَمَ ______</div><div class=\"qt\">5. Why does this matter for how YOU live today? </div><div class=\"al\"></div></div><div class=\"sec-hd\"><h3>This Lesson's Hadith (2)</h3><span class=\"pts\">8 pts</span></div><div class=\"q\"><div class=\"qn\">Best generations — Bukhari 2652 / Muslim 6635</div><span class=\"qar\">خَيْرُ الْقُرُونِ قَرْنِي، ثُمَّ الَّذِينَ يَلُونَهُمْ، ثُمَّ الَّذِينَ يَلُونَهُمْ</span><div class=\"qt\">1. What does this hadith prove? </div><div class=\"al\"></div><div class=\"qt\">2. Translate it in your own words: </div><div class=\"al\"></div><div class=\"qt\">3. Which collection(s) narrate it, and what does that tell you about its strength? </div><div class=\"al\"></div></div><div class=\"q\"><div class=\"qn\">The return of 'Eesa — Sahih Muslim 7560</div><span class=\"qar\">عِيسَى صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ يَنْزِلُ مِنَ السَّمَاءِ وَيَقْتُلُ الدَّجَّالَ</span><div class=\"qt\">1. What does this hadith prove? </div><div class=\"al\"></div><div class=\"qt\">2. Translate it in your own words: </div><div class=\"al\"></div><div class=\"qt\">3. Which collection(s) narrate it, and what does that tell you about its strength? </div><div class=\"al\"></div></div>"}, {"id": "MATCH7", "cat": "games", "lesson": 7, "title": "Matching Activity — L7: Q6 — Who is Your Prophet? ﷺ", "badge": "Match the Terms · L7", "points": 7, "html": "<div class=\"sh-hdr\"><div class=\"sh-top\"><div class=\"sh-title\">Matching — Who is Your Prophet? ﷺ</div><div class=\"sh-badge\">Match the Terms · L7</div></div><div class=\"sh-meta\"><div class=\"mf\"><div class=\"ml\">Name</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Date</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Score</div><div class=\"mv\"></div></div></div></div><div class=\"sec-hd\"><h3>Draw a line (or write the letter) to match each item</h3><span class=\"pts\">7 pts</span></div><div class=\"match-grid\"><div class=\"match-col\"><h4>Column A</h4><div class=\"mi\"><div class=\"mn\">1</div>نَبِيّ</div><div class=\"mi\"><div class=\"mn\">2</div>رَسُول</div><div class=\"mi\"><div class=\"mn\">3</div>اصْطَفَى</div><div class=\"mi\"><div class=\"mn\">4</div>هِجْرَة</div><div class=\"mi\"><div class=\"mn\">5</div>جِهَاد</div><div class=\"mi\"><div class=\"mn\">6</div>خَاتَم</div><div class=\"mi\"><div class=\"mn\">7</div>خَلِيفَة</div></div><div class=\"match-col\"><h4>Column B</h4><div class=\"mi\"><div class=\"mlt\">A</div>Successor / caliph<div class=\"mblk\"></div></div><div class=\"mi\"><div class=\"mlt\">B</div>Seal (the last of)<div class=\"mblk\"></div></div><div class=\"mi\"><div class=\"mlt\">C</div>He chose / selected<div class=\"mblk\"></div></div><div class=\"mi\"><div class=\"mlt\">D</div>Prophet<div class=\"mblk\"></div></div><div class=\"mi\"><div class=\"mlt\">E</div>Striving<div class=\"mblk\"></div></div><div class=\"mi\"><div class=\"mlt\">F</div>Messenger<div class=\"mblk\"></div></div><div class=\"mi\"><div class=\"mlt\">G</div>Migration (to Madinah)<div class=\"mblk\"></div></div></div></div>"}, {"id": "TF7", "cat": "games", "lesson": 7, "title": "True/False — L7: Q6 — Who is Your Prophet? ﷺ", "badge": "T/F Quick Check · L7", "points": 8, "html": "<div class=\"sh-hdr\"><div class=\"sh-top\"><div class=\"sh-title\">True or False — Who is Your Prophet? ﷺ</div><div class=\"sh-badge\">T/F Quick Check · L7</div></div><div class=\"sh-meta\"><div class=\"mf\"><div class=\"ml\">Name</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Date</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Score</div><div class=\"mv\"></div></div></div></div><div class=\"sec-hd\"><h3>Circle T or F for each statement</h3><span class=\"pts\">8 pts</span></div><div class=\"tf\"><div class=\"tfrow\"><div class=\"tfopt\"><span class=\"tfbub\">T</span><span class=\"tfbub\">F</span></div><div class=\"tftext\">1. The Prophet's ﷺ lineage as the Imam wrote it traces back through Abd al-Muttalib and Hashim.</div></div><div class=\"tfrow\"><div class=\"tfopt\"><span class=\"tfbub\">T</span><span class=\"tfbub\">F</span></div><div class=\"tftext\">2. The Prophet ﷺ was sent only to the Arabs, not to all of humanity.</div></div><div class=\"tfrow\"><div class=\"tfopt\"><span class=\"tfbub\">T</span><span class=\"tfbub\">F</span></div><div class=\"tftext\">3. The 5 prayers were revealed through the angel Jibril, like every other command.</div></div><div class=\"tfrow\"><div class=\"tfopt\"><span class=\"tfbub\">T</span><span class=\"tfbub\">F</span></div><div class=\"tftext\">4. The Prophet ﷺ called people away from worshipping idols, stones, trees, prophets, the righteous, and angels.</div></div><div class=\"tfrow\"><div class=\"tfopt\"><span class=\"tfbub\">T</span><span class=\"tfbub\">F</span></div><div class=\"tftext\">5. Nuh ﷺ is described by the Imam as the first messenger.</div></div><div class=\"tfrow\"><div class=\"tfopt\"><span class=\"tfbub\">T</span><span class=\"tfbub\">F</span></div><div class=\"tftext\">6. Muhammad ﷺ is described as the Seal of the Prophets — no prophet will come after him.</div></div><div class=\"tfrow\"><div class=\"tfopt\"><span class=\"tfbub\">T</span><span class=\"tfbub\">F</span></div><div class=\"tftext\">7. The Imam lists the 4 Caliphs in this order: Umar, Abu Bakr, Ali, Uthman.</div></div><div class=\"tfrow\"><div class=\"tfopt\"><span class=\"tfbub\">T</span><span class=\"tfbub\">F</span></div><div class=\"tftext\">8. 'Eesa ﷺ will descend from the sky and slay al-Dajjal, according to Sahih Muslim 7560.</div></div></div>"}, {"id": "WS7", "cat": "games", "lesson": 7, "title": "Word Search — L7: Q6 — Who is Your Prophet? ﷺ", "badge": "Puzzle · L7", "points": null, "html": "<div class=\"sh-hdr\"><div class=\"sh-top\"><div class=\"sh-title\">Word Search — Who is Your Prophet? ﷺ</div><div class=\"sh-badge\">Puzzle · L7</div></div><div class=\"sh-meta\"><div class=\"mf\"><div class=\"ml\">Name</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Date</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Score</div><div class=\"mv\"></div></div></div></div><div class=\"sec-hd\"><h3>Find every term (transliterated)</h3></div><div class=\"ws-wrap\"><table class=\"ws\"><tr><td>I</td><td>F</td><td>I</td><td>P</td><td>Z</td><td>J</td><td>X</td><td>K</td><td>H</td><td>Z</td><td>D</td><td>O</td></tr><tr><td>C</td><td>E</td><td>Y</td><td>H</td><td>V</td><td>X</td><td>V</td><td>A</td><td>M</td><td>Z</td><td>R</td><td>L</td></tr><tr><td>C</td><td>Z</td><td>M</td><td>A</td><td>I</td><td>R</td><td>R</td><td>D</td><td>O</td><td>L</td><td>V</td><td>X</td></tr><tr><td>V</td><td>I</td><td>S</td><td>M</td><td>U</td><td>J</td><td>I</td><td>L</td><td>D</td><td>V</td><td>H</td><td>P</td></tr><tr><td>A</td><td>T</td><td>R</td><td>K</td><td>I</td><td>K</td><td>T</td><td>S</td><td>H</td><td>U</td><td>C</td> div><div class=\"sc-lbl\">Comments</div><div class=\"sc-val\" style=\"min-width:140px;\"></div></div></div>"}, {"id": "MIDREV", "cat": "reviewpackets", "lesson": 0, "title": "Midterm Review Packet — Q1-Q4, Shirk & Taghut", "badge": "Low-Stakes Practice · Before Mid-Unit Test", "points": null, "html": "<div class=\"sh-hdr\"><div class=\"sh-top\"><div class=\"sh-title\">Midterm Review Packet — Q1-Q4, Shirk & Taghut</div><div class=\"sh-badge\">Low-Stakes Practice · Before Mid-Unit Test</div></div><div class=\"sh-meta\"><div class=\"mf\"><div class=\"ml\">Name</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Date</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Score</div><div class=\"mv\"></div></div></div></div><div class=\"note\"><b>Note:</b> This packet does NOT count toward your grade. Use it honestly — every gap you find here is one less surprise on the Mid-Unit Test.</div><div class=\"sec-hd\"><h3>Speed Recall — no notes, 60 seconds per item</h3><span class=\"pts\">12 pts</span></div><div class=\"q\"><div class=\"qn\">Q1</div><span class=\"qar\">مَنْ رَبُّكَ؟</span><div class=\"al\"></div></div><div class=\"q\"><div class=\"qn\">Q2</div><span class=\"qar\">مَا مَعْنَى الرَّبِّ؟</span><div class=\"al\"></div></div><div class=\"q\"><div class=\"qn\">Q3</div><span class=\"qar\">بِمَ تَعْرِفُ رَبَّكَ؟</span><div class=\"al\"></div></div><div class=\"q\"><div class=\"qn\">Q4</div><span class=\"qar\">لِأَيِّ شَيْءٍ خَلَقَكَ؟</span><div class=\"al\"></div></div><div class=\"q\"><div class=\"qn\">Shirk</div><span class=\"qar\">مَا الشِّرْكُ؟</span><div class=\"al\"></div></div><div class=\"q\"><div class=\"qn\">Taghut</div><span class=\"qar\">مَا الطَّاغُوت؟</span><div class=\"al\"></div></div><div class=\"sec-hd\"><h3>Self-Check Against the Key</h3></div><div class=\"note\"><b>Answers:</b> Q1: رَبِّيَ اللَّهُ · Q2: الْمَالِكُ الْمَعْبُودُ الْمُعِينُ النَّاصِرُ الْخَالِقُ الرَّازِقُ · Q3: أَعْرِفُهُ بِآيَاتِهِ وَمَخْلُوقَاتِهِ — Al-A'raf 7:54 · Q4: لِعِبَادَتِهِ وَحْدَهُ لَا شَرِيكَ لَهُ وَطَاعَتِهِ · Shirk: أَنْ يَجْعَلَ لِلَّهِ نِدًّا — 5 types · Taghut: 2 definitions — the Imam's list + Ibn al-Qayyim's</div><div class=\"sec-hd\"><h3>Ayah Speed-Round</h3><span class=\"pts\">12 pts</span></div><div class=\"qt\">Write the reference (Surah:Ayah) for each phrase — you have 5 minutes:</div><table class=\"tbl\"><thead><tr><th>Key phrase</th><th>Reference</th></tr></thead><tbody><tr><td class=\"wc\">إِنَّ رَبَّكُمُ اللَّهُ الَّذِي خَل…</td><td class=\"wc\"></td></tr><tr><td class=\"wc\">وَمَا خَلَقْتُ الْجِنَّ وَالْإِنسَ …</td><td class=\"wc\"></td></tr><tr><td class=\"wc\">وَاعْبُدُوا اللَّهَ وَلَا تُشْرِكُو…</td><td class=\"wc\"></td></tr><tr><td class=\"wc\">فَقَدْ حَرَّمَ اللَّهُ عَلَيْهِ الْ…</td><td class=\"wc\"></td></tr><tr><td class=\"wc\">فَلَا تَدْعُوا مَعَ اللَّهِ أَحَدًا…</td><td class=\"wc\"></td></tr><tr><td class=\"wc\">إِنَّهُ لَا يُفْلِحُ الْكَافِرُونَ…</td><td class=\"wc\"></td></tr><tr><td class=\"wc\">ادْعُونِي أَسْتَجِبْ لَكُمْ…</td><td class=\"wc\"></td></tr><tr><td class=\"wc\">قُلِ اللَّهَ أَعْبُدُ مُخْلِصًا لَّ…</td><td class=\"wc\"></td></tr><tr><td class=\"wc\">قُلْ إِنَّمَا أُمِرْتُ أَنْ أَعْبُد…</td><td class=\"wc\"></td></tr><tr><td class=\"wc\">لَئِنْ أَشْرَكْتَ لَيَحْبَطَنَّ عَم…</td><td class=\"wc\"></td></tr><tr><td class=\"wc\">مِنْهَا خَلَقْنَاكُمْ وَفِيهَا نُعِ…</td><td class=\"wc\"></td></tr><tr><td class=\"wc\">أُولَٰئِكَ الَّذِينَ كَفَرُوا بِرَب…</td><td class=\"wc\"></td></tr><tr><td class=\"wc\">وَلَقَدْ بَعَثْنَا فِي كُلِّ أُمَّة…</td><td class=\"wc\"></td></tr><tr><td class=\"wc\">وَقَاتِلُوهُمْ حَتَّى لَا تَكُونَ ف…</td><td class=\"wc\"></td></tr></tbody></table>"}, {"id": "FINALREV", "cat": "reviewpackets", "lesson": 0, "title": "Final Review Packet — All 6 Q&As + Full Unit", "badge": "Low-Stakes Practice · Before Final Unit Test", "points": null, "html": "<div class=\"sh-hdr\"><div class=\"sh-top\"><div class=\"sh-title\">Final Review Packet — All 6 Q&As + Full Unit</div><div class=\"sh-badge\">Low-Stakes Practice · Before Final Unit Test</div></div><div class=\"sh-meta\"><div class=\"mf\"><div class=\"ml\">Name</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Date</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Score</div><div class=\"mv\"></div></div></div></div><div class=\"note\"><b>Note:</b> This packet does NOT count toward your grade. Work through it with a partner, then alone, then check yourself against the Master Answer Key.</div><div class=\"sec-hd\"><h3>All 8 Core Prompts — Speed Recall</h3><span class=\"pts\">16 pts</span></div><div class=\"q\"><div class=\"qn\">Q1</div><span class=\"qar\">مَنْ رَبُّكَ؟</span><div class=\"al\"></div></div><div class=\"q\"><div class=\"qn\">Q2</div><span class=\"qar\">مَا مَعْنَى الرَّبِّ؟</span><div class=\"al\"></div></div><div class=\"q\"><div class=\"qn\">Q3</div><span class=\"qar\">بِمَ تَعْرِفُ رَبَّكَ؟</span><div class=\"al\"></div></div><div class=\"q\"><div class=\"qn\">Q4</div><span class=\"qar\">لِأَيِّ شَيْءٍ خَلَقَكَ؟</span><div class=\"al\"></div></div><div class=\"q\"><div class=\"qn\">Shirk</div><span class=\"qar\">مَا الشِّرْكُ؟</span><div class=\"al\"></div></div><div class=\"q\"><div class=\"qn\">Taghut</div><span class=\"qar\">مَا الطَّاغُوت؟</span><div class=\"al\"></div></div><div class=\"q\"><div class=\"qn\">Q5</div><span class=\"qar\">مَا دِينُكَ؟</span><div class=\"al\"></div></div><div class=\"q\"><div class=\"qn\">Q6</div><span class=\"qar\">مَنْ نَبِيُّكَ؟</span><div class=\"al\"></div></div><div class=\"sec-hd\"><h3>Full 22-Ayah Reference Speed Drill</h3><span class=\"pts\">22 pts</span></div><table class=\"tbl\"><thead><tr><th>Reference</th><th>What it proves (in your own words)</th></tr></thead><tbody><tr><td class=\"wc\">Al-A'raf 7:54</td><td class=\"wc\"></td></tr><tr><td class=\"wc\">Adh-Dhariyat 51:56</td><td class=\"wc\"></td></tr><tr><td class=\"wc\">An-Nisa 4:36</td><td class=\"wc\"></td></tr><tr><td class=\"wc\">Al-Ma'idah 5:72</td><td class=\"wc\"></td></tr><tr><td class=\"wc\">Al-Jinn 72:18</td><td class=\"wc\"></td></tr><tr><td class=\"wc\">Al-Mu'minun 23:117</td><td class=\"wc\"></td></tr><tr><td class=\"wc\">Ghafir 40:60</td><td class=\"wc\"></td></tr><tr><td class=\"wc\">Az-Zumar 39:14</td><td class=\"wc\"></td></tr><tr><td class=\"wc\">Ar-Ra'd 13:36</td><td class=\"wc\"></td></tr><tr><td class=\"wc\">Az-Zumar 39:64-66</td><td class=\"wc\"></td></tr><tr><td class=\"wc\">Taha 20:55</td><td class=\"wc\"></td></tr><tr><td class=\"wc\">Ar-Ra'd 13:5</td><td class=\"wc\"></td></tr><tr><td class=\"wc\">An-Nahl 16:36</td><td class=\"wc\"></td></tr><tr><td class=\"wc\">Al-Anfal 8:39</td><td class=\"wc\"></td></tr><tr><td class=\"wc\">Al-Imran 3:19</td><td class=\"wc\"></td></tr><tr><td class=\"wc\">Al-Imran 3:85</td><td class=\"wc\"></td></tr><tr><td class=\"wc\">Az-Zukhruf 43:26-28</td><td class=\"wc\"></td></tr><tr><td class=\"wc\">Al-Bayyinah 98:5</td><td class=\"wc\"></td></tr><tr><td class=\"wc\">Al-Baqarah 2:183-185</td><td class=\"wc\"></td></tr><tr><td class=\"wc\">Al-Imran 3:97</td><td class=\"wc\"></td></tr><tr><td class=\"wc\">An-Nisa 4:163</td><td class=\"wc\"></td></tr><tr><td class=\"wc\">Al-Ahzab 33:40</td><td class=\"wc\"></td></tr></tbody></table><div class=\"sec-hd\"><h3>Full 5-Hadith Reference Speed Drill</h3><span class=\"pts\">5 pts</span></div><table class=\"tbl\"><thead><tr><th>Hadith</th><th>What it proves</th></tr></thead><tbody><tr><td class=\"wc\">Bukhari 4777 / Muslim 102</td><td class=\"wc\"></td></tr><tr><td class=\"wc\">Ahmad 18378 (authenticated)</td><td class=\"wc\"></td></tr><tr><td class=\"wc\">Sahih al-Bukhari (Abu Hurairah)</td><td class=\"wc\"></td></tr><tr><td class=\"wc\">Bukhari 2652 / Muslim 6635</td><td class=\"wc\"></td></tr><tr><td class=\"wc\">Sahih Muslim 7560</td><td class=\"wc\"></td></tr></tbody></table><div class=\"sec-hd\"><h3>Cumulative Essay Practice</h3></div><div class=\"q\"><div class=\"qn\">Question 1</div><div class=\"qt\">In 5-6 sentences, explain how Q1 through Q6 build on each other into one complete argument. (This is essentially Final Test Option A — practicing it here means you walk into the test having already thought it through.)</div></div><div class=\"als\"><div class=\"aline\"></div><div class=\"aline\"></div><div class=\"aline\"></div><div class=\"aline\"></div><div class=\"aline\"></div></div>"}, {"id": "GAME1", "cat": "games", "lesson": 0, "title": "Review Game — Six Questions Speed Relay", "badge": "Classroom Competition", "points": null, "html": "<div class=\"sh-hdr\"><div class=\"sh-top\"><div class=\"sh-title\">Review Game — Six Questions Speed Relay</div><div class=\"sh-badge\">Classroom Competition · Teacher Instructions</div></div><div class=\"sh-meta\"><div class=\"mf\"><div class=\"ml\">Name</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Date</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Score</div><div class=\"mv\"></div></div></div></div><div class=\"sec-hd\"><h3>Setup</h3></div><div class=\"q\"><div class=\"qt\">Split the class into 2-4 teams, lined up in relay order. Place the 6 question cards (س١-س٦) face-down at the front of the room.</div></div><div class=\"sec-hd\"><h3>How to Play</h3></div><div class=\"q\"><div class=\"qt\">1. First student in each team runs up, flips a card, and must answer the Arabic Q&A correctly (with the teacher or a \"judge\" student checking against the Master Answer Key).<br>2. Correct answer = team scores a point and the next teammate goes. Incorrect = student returns to the back of their line and tries again on their next turn.<br>3. First team to correctly answer all 6 questions wins. For a longer game, require the Quranic proof reference too for bonus points.</div></div><div class=\"note\"><b>Note:</b> Variation: \"Ayah Reference Bee\" — same format, but cards show a key Arabic phrase and students must give the Surah & Ayah reference from the 22-ayah master list.</div>"}, {"id": "GAME2", "cat": "games", "lesson": 0, "title": "Review Game — Tawhid Trivia Board", "badge": "Classroom Competition", "points": null, "html": "<div class=\"sh-hdr\"><div class=\"sh-top\"><div class=\"sh-title\">Review Game — Tawhid Trivia Board</div><div class=\"sh-badge\">Classroom Competition · Teacher Instructions</div></div><div class=\"sh-meta\"><div class=\"mf\"><div class=\"ml\">Name</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Date</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Score</div><div class=\"mv\"></div></div></div></div><div class=\"sec-hd\"><h3>Setup</h3></div><div class=\"q\"><div class=\"qt\">Draw a 5×5 grid on the board with 5 categories as column headers: Rabb & Signs (L1-L2) · Purpose & Shirk (L3-L4) · Taghut (L5) · Islam & Pillars (L6) · The Prophet ﷺ (L7). Each column has point values 10-20-30-40-50 going down (harder = more points). Pull questions from the Weekly Review Packets and Oral Review Scripts to fill the board.</div></div><div class=\"sec-hd\"><h3>How to Play</h3></div><div class=\"q\"><div class=\"qt\">Teams take turns picking a category and point value. Higher point values = harder questions requiring full Arabic + proof. Track team scores on the board. Bonus \"Daily Double\" squares let a team wager their own points.</div></div>"}, {"id": "GAME3", "cat": "games", "lesson": 0, "title": "Memory Game — Match the 6 Terms of ar-Rabb (Printable)", "badge": "Memory / Cut-and-Paste", "points": null, "html": "<div class=\"sh-hdr\"><div class=\"sh-top\"><div class=\"sh-title\">Memory Game — Match the 6 Terms of ar-Rabb</div><div class=\"sh-badge\">Memory / Cut-and-Paste · Printable</div></div><div class=\"sh-meta\"><div class=\"mf\"><div class=\"ml\">Name</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Date</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Score</div><div class=\"mv\"></div></div></div></div><div class=\"note\"><b>Note:</b> Print, then cut out all 12 cards along the lines. Shuffle and lay face-down in a 3×4 grid. Players flip 2 cards per turn, trying to match each Arabic term to its English meaning. Keep a match if correct; flip back if not. Most matches wins.</div><div class=\"sec-hd\"><h3>Cards — cut along the lines</h3></div><div class=\"fc-grid\"><div class=\"fc\"><div class=\"fc-front\"><span class=\"qar\" style=\"font-size:1.6rem;\">رَبّ</span><div class=\"fc-tr\">Rabb</div></div><div class=\"fc-back\">Lord / Master / Sustainer</div></div><div class=\"fc\"><div class=\"fc-front\"><span class=\"qar\" style=\"font-size:1.6rem;\">مَالِك</span><div class=\"fc-tr\">Malik</div></div><div class=\"fc-back\">The Owner of Dominion</div></div><div class=\"fc\"><div class=\"fc-front\"><span class=\"qar\" style=\"font-size:1.6rem;\">مَعْبُود</span><div class=\"fc-tr\">Ma'bud</div></div><div class=\"fc-back\">The One Worshipped</div></div><div class=\"fc\"><div class=\"fc-front\"><span class=\"qar\" style=\"font-size:1.6rem;\">مُعِين</span><div class=\"fc-tr\">Mu'een</div></div><div class=\"fc-back\">The One who Helps</div></div><div class=\"fc\"><div class=\"fc-front\"><span class=\"qar\" style=\"font-size:1.6rem;\">نَاصِر</span><div class=\"fc-tr\">Nasir</div></div><div class=\"fc-back\">The One who Gives Victory</div></div><div class=\"fc\"><div class=\"fc-front\"><span class=\"qar\" style=\"font-size:1.6rem;\">خَالِق</span><div class=\"fc-tr\">Khaliq</div></div><div class=\"fc-back\">The Creator</div></div></div><div class=\"sec-hd\"><h3>Coloring Activity (younger students)</h3></div><div class=\"note\"><b>Note:</b> Color each Arabic term card a different color, then color the matching English meaning card the SAME color. This reinforces the pairing visually before the cut-and-paste memory game.</div>"}, {"id": "EVIDENCE", "cat": "keys", "lesson": 0, "title": "Master Evidence Reference — All 22 Ayahs & 5 Hadiths", "badge": "Teacher & Student Reference", "points": null, "html": "<div class=\"sh-hdr\"><div class=\"sh-top\"><div class=\"sh-title\">Master Evidence Reference — All 22 Ayahs & 5 Hadiths</div><div class=\"sh-badge\">Teacher & Student Reference</div></div><div class=\"sh-meta\"><div class=\"mf\"><div class=\"ml\">Name</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Date</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Score</div><div class=\"mv\"></div></div></div></div><div class=\"note\"><b>Note:</b> Updated from the original 19-ayah list: Al-Imran 3:85, Az-Zumar 39:14, and Ar-Ra'd 13:36 have been added — all three are cited explicitly \"from the book\" in the corrected lesson slides and were missing from the original reference. Al-Anbiya 21:33 is tracked separately below as an AMAN enrichment ayah, since the Imam does not cite it himself.</div><div class=\"sec-hd\"><h3>All 22 Quranic References from the Book</h3><span class=\"pts\">22 pts</span></div><table class=\"tbl\"><thead><tr><th>Ref.</th><th>Key Arabic phrase</th><th>What the Imam proves</th><th>Page</th></tr></thead><tbody><tr><td class=\"wc\">Al-A'raf 7:54</td><td class=\"wc\">إِنَّ رَبَّكُمُ اللَّهُ الَّذِي خَلَقَ السَّمَوَاتِ وَالْأَر…</td><td class=\"wc\">Q1 (Lord is Allah) + Q2 (Creator/Rabb) + Q3 (Creation + Signs) — ONE ayah for THREE questions</td><td class=\"wc\">9</td></tr><tr><td class=\"wc\">Adh-Dhariyat 51:56</td><td class=\"wc\">وَمَا خَلَقْتُ الْجِنَّ وَالْإِنسَ إِلَّا لِيَعْبُدُونِ</td><td class=\"wc\">Q4 — PURPOSE of creation: only to worship Allah</td><td class=\"wc\">10</td></tr><tr><td class=\"wc\">An-Nisa 4:36</td><td class=\"wc\">وَاعْبُدُوا اللَّهَ وَلَا تُشْرِكُوا بِهِ شَيْئًا</td><td class=\"wc\">Q4 — HOW to fulfill purpose: worship Allah alone, no partner</td><td class=\"wc\">10</td></tr><tr><td class=\"wc\">Al-Ma'idah 5:72</td><td class=\"wc\">فَقَدْ حَرَّمَ اللَّهُ عَلَيْهِ الْجَنَّةَ وَمَأْوَاهُ النَّ…</td><td class=\"wc\">Consequence of Shirk — Jannah forbidden, Fire is the abode</td><td class=\"wc\">10-11</td></tr><tr><td class=\"wc\">Al-Jinn 72:18</td><td class=\"wc\">فَلَا تَدْعُوا مَعَ اللَّهِ أَحَدًا</td><td class=\"wc\">Du'a Proof 1 — mosques are for Allah alone; don't invoke ALONG WITH Allah = Shirk</td><td class=\"wc\">12-13</td></tr><tr><td class=\"wc\">Al-Mu'minun 23:117</td><td class=\"wc\">إِنَّهُ لَا يُفْلِحُ الْكَافِرُونَ</td><td class=\"wc\">Du'a Proof 2 — du'a to another deity = KUFR (not merely Shirk)</td><td class=\"wc\">13</td></tr><tr><td class=\"wc\">Ghafir 40:60</td><td class=\"wc\">ادْعُونِي أَسْتَجِبْ لَكُمْ</td><td class=\"wc\">Du'a Proof 3 — \"Call upon Me, I will answer\"; du'a is the greatest worship</td><td class=\"wc\">13</td></tr><tr><td class=\"wc\">Az-Zumar 39:14</td><td class=\"wc\">قُلِ اللَّهَ أَعْبُدُ مُخْلِصًا لَّهُ دِينِي</td><td class=\"wc\">Sincerity of worship commanded even to the Prophet ﷺ himself</td><td class=\"wc\">14</td></tr><tr><td class=\"wc\">Ar-Ra'd 13:36</td><td class=\"wc\">قُلْ إِنَّمَا أُمِرْتُ أَنْ أَعْبُدَ اللَّهَ وَلَا أُشْرِكَ …</td><td class=\"wc\">Complete mission statement: worship alone + no partner + call to Him + return to Him</td><td class=\"wc\">14</td></tr><tr><td class=\"wc\">Az-Zumar 39:64-66</td><td class=\"wc\">لَئِنْ أَشْرَكْتَ لَيَحْبَطَنَّ عَمَلُكَ وَلَتَكُونَنَّ مِنَ…</td><td class=\"wc\">Shirk nullifies ALL deeds — addressed even to the Prophet ﷺ</td><td class=\"wc\">14</td></tr><tr><td class=\"wc\">Taha 20:55</td><td class=\"wc\">مِنْهَا خَلَقْنَاكُمْ وَفِيهَا نُعِيدُكُمْ وَمِنْهَا نُخْرِج…</td><td class=\"wc\">Resurrection: created from earth, returned to it, raised again</td><td class=\"wc\">14</td></tr><tr><td class=\"wc\">Ar-Ra'd 13:5</td><td class=\"wc\">أُولَٰئِكَ الَّذِينَ كَفَرُوا بِرَبِّهِمْ ۚ وَأُولَٰئِكَ أَص…</td><td class=\"wc\">Denying the Resurrection = Kufr → eternal Fire</td><td class=\"wc\">14</td></tr><tr><td class=\"wc\">An-Nahl 16:36</td><td class=\"wc\">وَلَقَدْ بَعَثْنَا فِي كُلِّ أُمَّةٍ رَسُولًا أَنِ اعْبُدُوا…</td><td class=\"wc\">Every prophet's message: worship Allah AND avoid Taghut; Kufr bil-Taghut is the first obligation</td><td class=\"wc\">14</td></tr><tr><td class=\"wc\">Al-Anfal 8:39</td><td class=\"wc\">وَقَاتِلُوهُمْ حَتَّى لَا تَكُونَ فِتْنَةٌ وَيَكُونَ الدِّين…</td><td class=\"wc\">The mission: fight until no more fitnah (=Shirk) and the religion is entirely for Allah</td><td class=\"wc\">16</td></tr><tr><td class=\"wc\">Al-Imran 3:19</td><td class=\"wc\">إِنَّ الدِّينَ عِندَ اللَّهِ الْإِسْلَامُ</td><td class=\"wc\">Islam is THE religion accepted by Allah — not a religion among many</td><td class=\"wc\">16-17</td></tr><tr><td class=\"wc\">Al-Imran 3:85</td><td class=\"wc\">وَمَن يَبْتَغِ غَيْرَ الْإِسْلَامِ دِينًا فَلَن يُقْبَلَ مِن…</td><td class=\"wc\">Whoever seeks a religion other than Islam — it will NEVER be accepted</td><td class=\"wc\">16-17</td></tr><tr><td class=\"wc\">Az-Zukhruf 43:26-28</td><td class=\"wc\">إِنَّنِي بَرَاءٌ مِّمَّا تَعْبُدُونَ ۞ إِلَّا الَّذِي فَطَرَ…</td><td class=\"wc\">Ibrahim's bara'ah — proof for the meaning of La ilaha illa Allah</td><td class=\"wc\">18</td></tr><tr><td class=\"wc\">Al-Bayyinah 98:5</td><td class=\"wc\">وَمَا أُمِرُوا إِلَّا لِيَعْبُدُوا اللَّهَ مُخْلِصِينَ لَهُ …</td><td class=\"wc\">Proof for Pillars 1-3 (Shahadah, Salah, Zakah) — begins with Tawhid & freedom from Shirk</td><td class=\"wc\">18-19</td></tr><tr><td class=\"wc\">Al-Baqarah 2:183-185</td><td class=\"wc\">يَا أَيُّهَا الَّذِينَ آمَنُوا كُتِبَ عَلَيْكُمُ الصِّيَامُ</td><td class=\"wc\">Fasting (Sawm) — Pillar 4</td><td class=\"wc\">20</td></tr><tr><td class=\"wc\">Al-Imran 3:97</td><td class=\"wc\">وَلِلَّهِ عَلَى النَّاسِ حِجُّ الْبَيْتِ</td><td class=\"wc\">Hajj — Pillar 5 (for one who is able)</td><td class=\"wc\">20</td></tr><tr><td class=\"wc\">An-Nisa 4:163</td><td class=\"wc\">إِنَّا أَوْحَيْنَا إِلَيْكَ كَمَا أَوْحَيْنَا إِلَىٰ نُوحٍ و…</td><td class=\"wc\">Nuh ﷺ = the first messenger</td><td class=\"wc\">25</td></tr><tr><td class=\"wc\">Al-Ahzab 33:40</td><td class=\"wc\">وَخَاتَمَ النَّبِيِّينَ</td><td class=\"wc\">Muhammad ﷺ = the Seal of the Prophets — no prophet after him</td><td class=\"wc\">25-26</td></tr></tbody></table><div class=\"sec-hd\"><h3>Enrichment Ayah (AMAN addition, not the Imam's own citation)</h3></div><table class=\"tbl\"><thead><tr><th>Ref.</th><th>Key Arabic phrase</th><th>What it's used for</th></tr></thead><tbody><tr><td class=\"wc\">Al-Anbiya 21:33</td><td class=\"wc\">وَهُوَ الَّذِي خَلَقَ اللَّيْلَ وَالنَّهَارَ وَالشَّمْسَ وَا…</td><td class=\"wc\">Tafakkur enrichment (AMAN addition, not the Imam's own citation) — the sun, moon, and 2 trillion galaxies each 'swimming' (يَسْبَحُونَ) in their orbit by Allah's command</td></tr></tbody></table><div class=\"sec-hd\"><h3>5 Key Hadiths from the Book</h3></div><table class=\"tbl\"><thead><tr><th>Collection & Number</th><th>Content</th><th>Used to prove</th></tr></thead><tbody><tr><td class=\"wc\">Bukhari 4777 / Muslim 102</td><td class=\"wc\">Hadith of Umar — the 5 Pillars — الإِسْلَامُ أَنْ تَشْهَدَ أَنْ لَا إِلَهَ إِل…</td><td class=\"wc\">All 5 Pillars of Islam from one hadith</td></tr><tr><td class=\"wc\">Ahmad 18378 (authenticated)</td><td class=\"wc\">Du'a is worship — الدُّعَاءُ هُوَ الْعِبَادَةُ…</td><td class=\"wc\">Du'a is the greatest type of worship (NOTE: a weaker version — الدعاء مخ العبادة, Tirmidhi 3371 — also circulates; the Imam's citation is the authenticated one)</td></tr><tr><td class=\"wc\">Sahih al-Bukhari (Abu Hurairah)</td><td class=\"wc\">The Fitrah hadith — كُلُّ مَوْلُودٍ يُولَدُ عَلَى الْفِطْرَةِ، فَ…</td><td class=\"wc\">Why Tawhid is taught before Quran — every child is born already knowing Allah</td></tr><tr><td class=\"wc\">Bukhari 2652 / Muslim 6635</td><td class=\"wc\">Best generations — خَيْرُ الْقُرُونِ قَرْنِي، ثُمَّ الَّذِينَ يَ…</td><td class=\"wc\">Best generations = understanding Islam through the Companions</td></tr><tr><td class=\"wc\">Sahih Muslim 7560</td><td class=\"wc\">The return of 'Eesa — عِيسَى صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ يَنْ…</td><td class=\"wc\">'Eesa ﷺ will descend and slay al-Dajjal — closes the treatise</td></tr></tbody></table>"}, {"id": "MASTERQA", "cat": "keys", "lesson": 0, "title": "Master Q&A Reference — All 6 Questions", "badge": "Teacher Only", "points": null, "html": "<div class=\"sh-hdr\"><div class=\"sh-top\"><div class=\"sh-title\">Master Q&A Reference — All 6 Questions</div><div class=\"sh-badge\">Teacher Only</div></div><div class=\"sh-meta\"><div class=\"mf\"><div class=\"ml\">Name</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Date</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Score</div><div class=\"mv\"></div></div></div></div><div class=\"note\"><b>Textual Note — apply to Q2 grading:</b> The plain Arabic printing of the booklet gives the shorter form الْمَالِكُ الْمَعْبُودُ for Q2; the fuller six-term wording here follows the published English translation used in this unit. Grade generously if a student gives the shorter authentic form.</div><div class=\"sec-hd\"><h3>[س١-س٢] — Pages 7-8</h3></div><div class=\"qt qar\">مَنْ رَبُّكَ؟ — رَبِّيَ اللَّهُ</div><div class=\"qt qar\">مَا مَعْنَى الرَّبِّ؟ — الْمَالِكُ الْمَعْبُودُ، الْمُعِينُ وَالنَّاصِرُ، الْخَالِقُ وَالرَّازِقُ</div><div class=\"qt\">Meaning of \"Allah\" (p.8): ذُو الأُلُوهِيَّةِ وَالْعُبُودِيَّةِ عَلَى خَلْقِهِ أَجْمَعِين · Proof: Al-A'raf 7:54</div><div class=\"sec-hd\"><h3>[س٣] — Pages 8-9</h3></div><div class=\"qt qar\">بِمَ تَعْرِفُ رَبَّكَ؟ — أَعْرِفُهُ بِآيَاتِهِ وَمَخْلُوقَاتِهِ</div><div class=\"qt\">وَمِنْ آيَاتِهِ: اللَّيْلُ وَالنَّهَارُ وَالشَّمْسُ وَالْقَمَرُ · وَمِنْ مَخْلُوقَاتِهِ: السَّمَوَاتُ وَالْأَرْضُ وَمَا فِيهِمَا</div><div class=\"qt\">Proof: Al-A'raf 7:54 — أَلَا لَهُ الْخَلْقُ (=مَخْلُوقَات) وَالْأَمْرُ (=آيَات). Enrichment: Al-Anbiya 21:33 (تَفَكُّر, not the Imam's own citation).</div><div class=\"sec-hd\"><h3>[س٤] — Pages 9-10</h3></div><div class=\"qt qar\">لِأَيِّ شَيْءٍ خَلَقَكَ؟ — لِعِبَادَتِهِ وَحْدَهُ لَا شَرِيكَ لَهُ وَطَاعَتِهِ</div><div class=\"qt\">Proof 1: الذَّارِيَات 51:56 (purpose) · Proof 2: النِّسَاء 4:36 (command: worship alone, no partner)</div><div class=\"qt\">Ibadah definition (p.11 — Ibn Taymiyyah): اسْمٌ جَامِعٌ لِكُلِّ مَا يُحِبُّهُ اللَّهُ وَيَرْضَاهُ مِنَ الأَقْوَالِ وَالأَعْمَالِ الْبَاطِنَةِ وَالظَّاهِرَةِ — THREE categories: أَقْوَال (one category) + أَعْمَال ظَاهِرَة + أَعْمَال بَاطِنَة.</div><div class=\"note\"><b>Note:</b> Shirk section (L4) also draws on: Al-Ma'idah 5:72 (consequence) · Al-Jinn 72:18, Al-Mu'minun 23:117, Ghafir 40:60 (3 du'a proofs) · Az-Zumar 39:14, Ar-Ra'd 13:36 (2 sincerity proofs, previously missing) · Az-Zumar 64-66 (nullification) · Taha 20:55, Ar-Ra'd 13:5 (resurrection).</div><div class=\"sec-hd\"><h3>[س٥] — Pages 15-21</h3></div><div class=\"qt qar\">مَا دِينُكَ؟ — فَقُلْ: دِينِيَ الإِسْلَامُ</div><div class=\"note\"><b>Correction:</b> Corrected from the previous key, which read \"دِينُ الإِسْلَامِ\" — the book's actual first-person wording is دِينِيَ (\"MY religion\"), matching the grammar of \"Ma dinuk?\" (What is YOUR religion?).</div><div class=\"qt\">الاسْتِسْلَامُ لِلَّهِ بِالتَّوْحِيدِ وَالانْقِيَادُ لَهُ بِالطَّاعَةِ وَمُوَالَاةُ الْمُسْلِمِينَ وَمُعَادَاةُ الْمُشْرِكِينَ</div><div class=\"qt\">La ilaha illa Allah: لَا مَعْبُودَ حَقٍّ إِلَّا اللَّهُ (Ibrahim proof: الزُّخْرُف 43:26-28) · Islam is THE religion: آل عِمْرَان 3:19 AND 3:85 (previously only 3:19 was referenced)</div><div class=\"qt\">5 Pillars: Bukhari 4777/Muslim 102 · 6 Pillars: Hadith Umar (Bukhari/Muslim) · Qadar: خَيْرِهِ وَشَرِّهِ</div><div class=\"sec-hd\"><h3>[س٦] — Pages 22-26</h3></div><div class=\"qt qar\">مَنْ نَبِيُّكَ؟ — نَبِيُّنَا مُحَمَّدُ بْنُ عَبْدِ اللَّهِ بْنِ عَبْدِ الْمُطَّلِبِ بْنِ هَاشِمٍ بْنِ عَبْدِ مَنَافٍ ﷺ</div><div class=\"qt\">Chosen from Quraysh (صَفْوَة وَلَد إِسْمَاعِيل) · Sent to al-ahmar wal-aswad (all peoples)</div><div class=\"qt\">Called toward: إِخْلَاص الْعِبَادَة لِلَّه · Away from: الأَصْنَام وَالأَحْجَار وَالأَشْجَار وَالأَنْبِيَاء وَالصَّالِحِين وَالْمَلَائِكَة</div><div class=\"qt\">Timeline: sent at 40 · called ~10 years (Makkah) · Mi'raj (prayers, no intermediary) · Hijrah · Jihad ~10 years · 63 years total</div><div class=\"qt\">First messenger: نُوح (An-Nisa 4:163) · Last: خَاتَمُ النَّبِيِّين (Al-Ahzab 33:40)</div><div class=\"qt\">Best after prophets: أَبُو بَكْر → عُمَر → عُثْمَان → عَلِيّ ﷡ · Best generations: Bukhari 2652/Muslim 6635 · 'Eesa returns: Muslim 7560</div>"}, {"id": "CWKEY", "cat": "keys", "lesson": 0, "title": "Classwork Answer Key — CW1 through CW9", "badge": "Teacher Only", "points": null, "html": "<div class=\"sh-hdr\"><div class=\"sh-top\"><div class=\"sh-title\">Classwork Answer Key — CW1 through CW9</div><div class=\"sh-badge\">Teacher Only</div></div><div class=\"sh-meta\"><div class=\"mf\"><div class=\"ml\">Name</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Date</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Score</div><div class=\"mv\"></div></div></div></div><div class=\"sec-hd\"><h3>CW1 — Key Answers</h3></div><div class=\"qt\">Q1 Arabic Q&A: Question: إِذَا قِيلَ لَكَ: مَنْ رَبُّكَ؟ · Answer: فَقُلْ: رَبِّيَ اللَّهُ</div><div class=\"qt\">Imam's 6 Terms (Q2): 1. الْمَالِكُ = Owner of Dominion · 2. الْمَعْبُودُ = The One Worshipped · 3. الْمُعِينُ = The One Who Aids · 4. النَّاصِرُ = The One Who Supports/Gives Victory · 5. الْخَالِقُ = The Creator · 6. الرَّازِقُ = The Sustainer/Provider</div><div class=\"qt\">Definition of \"Allah\" (p.8): ذُو الأُلُوهِيَّةِ وَالْعُبُودِيَّةِ عَلَى خَلْقِهِ أَجْمَعِين = The One who possesses all divinity and all servitude over His entire creation.</div><div class=\"qt\">La ilaha illa Allah key word: حَقّ (in truth) — other objects of worship exist but are all BATIL (falsehood). Only Allah is worshipped with truth and right.</div><div class=\"qt\">Al-A'raf 7:54 proves Q1, Q2, Q3 via: Q1: إِنَّ رَبَّكُمُ اللَّهُ · Q2: الَّذِي خَلَقَ + رَبُّ الْعَالَمِينَ · Q3: أَلَا لَهُ الْخَلْقُ (=مَخْلُوقَات) وَالْأَمْرُ (=آيَات)</div><div class=\"sec-hd\"><h3>CW3 — Q4 & Ibadah Key Answers</h3></div><div class=\"qt\">Q4 Answer (p.9-10): لِعِبَادَتِهِ وَحْدَهُ لَا شَرِيكَ لَهُ وَطَاعَتِهِ</div><div class=\"qt\">Two Proofs: Al-Dhariyat 51:56 (WHY created) · An-Nisa 4:36 (HOW to fulfill it)</div><div class=\"note\"><b>Correction:</b> Corrected: Ibadah definition categories are THREE, not four — أَقْوَال = statements, one category (du'a, dhikr, Quran recitation, telling the truth) · أَعْمَال ظَاهِرَة = outward actions (salah, fasting, helping) · أَعْمَال بَاطِنَة = inward feelings (love, fear, tawakkul). The original key incorrectly split أَقْوَال into inward/outward, creating a fourth category the Imam's own definition does not contain.</div><div class=\"sec-hd\"><h3>CW4 — Shirk & Sincerity/Du'a Key Answers</h3></div><div class=\"qt\">Shirk is greatest sin — proof: وَالشِّرْكُ أَعْظَمُ ذَنْبٍ عُصِيَ اللَّهُ بِهِ (p.10) · Proof: Al-Ma'idah 5:72</div><div class=\"qt\">5 types: 1. يَدْعُوهُ · 2. يَرْجُوهُ · 3. يَخَافُهُ · 4. يَتَوَكَّلُ عَلَيْهِ · 5. يَرْغَبُ إِلَيْهِ</div><div class=\"qt\">5 proofs: Al-Jinn 72:18 (Shirk) · Al-Mu'minun 23:117 (KUFR) · Ghafir 40:60 (greatest worship) · Az-Zumar 39:14 (sincerity, previously missing) · Ar-Ra'd 13:36 (complete mission, previously missing)</div><div class=\"qt\">Az-Zumar 64-66 — لَيَحْبَطَنَّ عَمَلُكَ: \"Your work would surely become worthless.\" Addressed to the Prophet ﷺ to show universal severity.</div><div class=\"qt\">Foundations of Iman saving from Kufr: al-Ba'th, an-Nashr, al-Jaza', al-Hisab, Jannah/Fire = HAQQ · Proof: Taha 20:55, Ar-Ra'd 13:5</div><div class=\"sec-hd\"><h3>CW5 — Taghut Key Answers</h3></div><div class=\"qt\">First Obligation: وَأَوَّلُ مَا فَرَضَ اللَّهُ عَلَى عِبَادِهِ: الْكُفْرُ بِالطَّاغُوتِ وَالإِيمَانُ بِاللَّهِ</div><div class=\"qt\">Imam's Taghut list: 1. Shaytan · 2. Soothsayers · 3. Astrologers · 4. One who rules by other than what Allah revealed · 5. Anyone followed/obeyed without right</div><div class=\"qt\">Ibn al-Qayyim's 3 categories: مَعْبُود (worshipped), مَتْبُوع (followed), مُطَاع (obeyed) — all beyond proper limits</div><div class=\"qt\">La ilaha illa Allah: لَا إِلَهَ = Kufr bil-Taghut · إِلَّا اللَّهُ = Iman billah</div><div class=\"qt\">Al-Anfal 8:39 — الفِتْنَة = الشِّرك</div><div class=\"sec-hd\"><h3>CW8 — Q6 Prophet ﷺ Key Answers</h3></div><div class=\"qt\">Full lineage (p.22): نَبِيُّنَا مُحَمَّدُ بْنُ عَبْدِ اللَّهِ بْنِ عَبْدِ الْمُطَّلِبِ بْنِ هَاشِمٍ بْنِ عَبْدِ مَنَافٍ ﷺ</div><div class=\"qt\">Timeline: Prophethood age 40 · Makkah نَحْوًا مِنْ عَشْرِ سِنِينَ · Mi'raj مِنْ غَيْرِ وَاسِطَةٍ · Jihad ~10 years · Passed away at 63, Deen completed</div><div class=\"qt\">Why prophets/righteous in \"away from\" list: this is how Shirk entered previous communities (Ibn Abbas narrates the idols of Nuh's people were originally righteous people). The Prophet ﷺ came to break this cycle for good.</div>"}, {"id": "QTKEY", "cat": "keys", "lesson": 0, "title": "Quiz & Test Answer Key", "badge": "Teacher Only", "points": null, "html": "<div class=\"sh-hdr\"><div class=\"sh-top\"><div class=\"sh-title\">Quiz & Test Answer Key</div><div class=\"sh-badge\">Teacher Only</div></div><div class=\"sh-meta\"><div class=\"mf\"><div class=\"ml\">Name</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Date</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Score</div><div class=\"mv\"></div></div></div></div><div class=\"sec-hd\"><h3>Quiz 1 Answer Key (40 pts)</h3></div><div class=\"qt\">Section 1: Q1: إِذَا قِيلَ لَكَ: مَنْ رَبُّكَ؟ / فَقُلْ: رَبِّيَ اللَّهُ · Q2 (6 terms): الْمَالِكُ · الْمَعْبُودُ · الْمُعِينُ · النَّاصِرُ · الْخَالِقُ · الرَّازِقُ · Q3: أَعْرِفُهُ بِآيَاتِهِ وَمَخْلُوقَاتِهِ</div><div class=\"qt\">Section 2 — MC: Q5→B · Q6→B · Q7→C · Q8→B · Q9→B</div><div class=\"sec-hd\"><h3>Quiz 2 Answer Key (45 pts)</h3></div><div class=\"qt\">Q4 Answer: لِعِبَادَتِهِ وَحْدَهُ لَا شَرِيكَ لَهُ وَطَاعَتِهِ · Proof 1: الذَّارِيَات 51:56 · Proof 2: النِّسَاء 4:36</div><div class=\"qt\">Shirk fill-in: نِدًّا (rival) · types: يَرْجُوهُ · يَخَافُهُ · يَتَوَكَّلُ عَلَيْهِ · يَرْغَبُ إِلَيْهِ</div><div class=\"note\"><b>Correction:</b> Ibadah matching (Q3) uses the CORRECTED 3-category system: أَقْوَال → statements (du'a, dhikr, truth-telling) · أَعْمَال ظَاهِرَة → outward actions (fasting, salah, sadaqah) · أَعْمَال بَاطِنَة → inward feelings (love, tawakkul, fear).</div><div class=\"qt\">Shirk scenarios: Crystal bracelet → YES (Tawakkul misdirected) · Horoscope → YES (Raja' misdirected) · Du'a to grave → YES (Du'a misdirected) · Fear of Allah → NO (correct worship) · Lucky shirt → YES (Tawakkul misdirected)</div><div class=\"qt\">Sincerity/Du'a proofs (any 3 of 5): الجِنّ 72:18 → Shirk · الْمُؤْمِنُون 23:117 → KUFR · غَافِر 40:60 → greatest worship · الزُّمَر 39:14 → sincerity · الرَّعد 13:36 → complete mission</div><div class=\"sec-hd\"><h3>Quiz 3 Answer Key (50 pts)</h3></div><div class=\"qt\">First obligation: الْكُفْرُ بِالطَّاغُوتِ وَالإِيمَانُ بِاللَّهِ · Ibn al-Qayyim 3 categories: مَعْبُود · مَتْبُوع · مُطَاع</div><div class=\"qt\">An-Nahl 16:36 two parts: (1) اعْبُدُوا اللَّهَ = إِلَّا اللَّه · (2) اجْتَنِبُوا الطَّاغُوتَ = لَا إِلَهَ</div><div class=\"qt\">Q5 proof: BOTH آل عِمْرَان 3:19 AND 3:85 (previously only 3:19 was expected) · 4 components: (1) الاسْتِسْلَامُ بِالتَّوْحِيدِ (2) الانْقِيَادُ بِالطَّاعَةِ (3) مُوَالَاةُ الْمُسْلِمِينَ (4) مُعَادَاةُ الْمُشْرِكِينَ</div><div class=\"qt\">5 Pillars proofs: Shahadah: Bukhari 4777/Muslim 102 · Salah+Zakah: البَيِّنَة 98:5 · Sawm: البَقَرَة 2:183-185 · Hajj: آل عِمْرَان 3:97</div><div class=\"sec-hd\"><h3>Quiz 4 Answer Key (50 pts)</h3></div><div class=\"qt\">Timeline: Prophethood age 40 · Makkah نَحْوًا مِنْ عَشْرِ سِنِينَ · Mi'raj مِنْ غَيْرِ وَاسِطَة · Jihad نَحْوًا مِنْ عَشْرِ سِنِينَ · Death ثَلَاثٌ وَسِتُّونَ سَنَةً / Deen completed</div><div class=\"qt\">MC: Q3→C (Nuh, An-Nisa 4:163) · Q4→B · Q5→B · Q6→B · Q7→C (Muslim 7560)</div><div class=\"qt\">Caliphs: أَبُو بَكْرٍ الصِّدِّيق ﷡ → عُمَرُ بْنُ الْخَطَّابِ الفَارُوق ﷡ → عُثْمَانُ بْنُ عَفَّانَ ذُو النُّورَيْن ﷡ → عَلِيُّ بْنُ أَبِي طَالِبٍ ﷡</div><div class=\"sec-hd\"><h3>New Activity Types — Self-Check Answers</h3></div><div class=\"note\"><b>Teacher Note:</b> True/False, Matching, and Word Search / Unscramble / Crossword answers are fully derivable from each sheet's own lesson content (VOCAB and AYAHS data) and from the Master Q&A Reference and Master Evidence Reference sheets in this Answer Keys tab. Teachers: every T/F statement in this unit was written so the true/false judgment can be checked directly against the Master Q&A Reference or Master Evidence Reference — there is no separate hidden key.</div>"}, {"id": "RUBRICS", "cat": "keys", "lesson": 0, "title": "Test Rubrics & Grade Scale", "badge": "Teacher Only", "points": null, "html": "<div class=\"sh-hdr\"><div class=\"sh-top\"><div class=\"sh-title\">Test Rubrics & Grade Scale</div><div class=\"sh-badge\">Teacher Only</div></div><div class=\"sh-meta\"><div class=\"mf\"><div class=\"ml\">Name</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Date</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Score</div><div class=\"mv\"></div></div></div></div><div class=\"sec-hd\"><h3>Arabic Recall Rubric (applies to all)</h3></div><table class=\"tbl\"><thead><tr><th>Points</th><th>Arabic writing quality</th><th>Accuracy</th><th>Harakat</th></tr></thead><tbody><tr><td class=\"wc\">Full</td><td class=\"wc\">Clear, recognizable Arabic script</td><td class=\"wc\">All words correct, correctly spelled</td><td class=\"wc\">Harakat present and correct</td></tr><tr><td class=\"wc\">-1</td><td class=\"wc\">Minor letter formation issues</td><td class=\"wc\">1-2 words off or slightly incorrect</td><td class=\"wc\">Some harakat missing</td></tr><tr><td class=\"wc\">Half</td><td class=\"wc\">Transliteration only (Rabbi Allah)</td><td class=\"wc\">Meaning correct but no Arabic</td><td class=\"wc\">N/A</td></tr><tr><td class=\"wc\">0</td><td class=\"wc\">Blank or completely wrong</td><td class=\"wc\">Wrong answer</td><td class=\"wc\">N/A</td></tr></tbody></table><div class=\"note\"><b>Note:</b> For Level 1 students: accept transliteration for half credit at teacher's discretion.</div><div class=\"sec-hd\"><h3>Short Answer / Essay Rubric (4-point scale)</h3></div><table class=\"tbl\"><thead><tr><th>Score</th><th>Criteria</th></tr></thead><tbody><tr><td class=\"wc\">4 — Excellent</td><td class=\"wc\">Answers completely · Uses specific evidence from the book (page ref or Arabic) · Shows understanding, not memorization · Clear and articulate</td></tr><tr><td class=\"wc\">3 — Good</td><td class=\"wc\">Answers the question · Some book evidence · Shows understanding with minor gaps</td></tr><tr><td class=\"wc\">2 — Developing</td><td class=\"wc\">Partially answers · Limited evidence · Surface understanding · Some confusion</td></tr><tr><td class=\"wc\">1 — Beginning</td><td class=\"wc\">Minimal attempt · No evidence · Significant confusion or misunderstanding</td></tr></tbody></table><div class=\"sec-hd\"><h3>Final Essay Rubric (30 pts)</h3></div><table class=\"tbl\"><thead><tr><th>Score</th><th>Criteria</th></tr></thead><tbody><tr><td class=\"wc\">27-30</td><td class=\"wc\">8+ sentences · 4+ Quranic references (correct Surah & Ayah) · Arabic phrases used accurately · Demonstrates mastery of the Imam's argument · Clear logical flow · Closing connects to the Imam's goal (مُوَحِّدًا جَيِّدًا)</td></tr><tr><td class=\"wc\">21-26</td><td class=\"wc\">6-7 sentences · 3-4 references · Some Arabic · Solid understanding · Minor gaps · Good flow</td></tr><tr><td class=\"wc\">14-20</td><td class=\"wc\">Minimum 6 sentences · 2-3 references · Basic understanding · Limited Arabic · Some factual errors</td></tr><tr><td class=\"wc\">7-13</td><td class=\"wc\">Incomplete · 1-2 references · Surface understanding · Mostly general statements</td></tr><tr><td class=\"wc\">0-6</td><td class=\"wc\">Minimal effort · Few or no references · Incorrect information · Does not engage the prompt</td></tr></tbody></table><div class=\"qt\">Option A key points: Shows how Q1→Q2→Q3 prove Allah's existence → Q4 establishes purpose → Shirk section shows the threat to that purpose → Taghut shows what must be rejected → Q5 Islam: the complete system → Q6 the Prophet ﷺ as the deliverer of the system → closing Walhamdulillah = acceptance and gratitude for this gift.</div><div class=\"qt\">Option B key points: Q3 (Signs + Creation) addresses \"how do you know Allah exists?\" · Q4 + Fitrah: built-in knowledge · Q5: Islam's self-consistency and completeness · Q6: Prophet ﷺ's track record, universal mission, Al-Ahzab 33:40.</div><div class=\"sec-hd\"><h3>NEW — True/False & Matching Rubric</h3></div><table class=\"tbl\"><thead><tr><th>Points</th><th>Standard</th></tr></thead><tbody><tr><td class=\"wc\">Full credit</td><td class=\"wc\">Correct T/F judgment, or correct match line/letter</td></tr><tr><td class=\"wc\">Half credit (T/F only, teacher discretion)</td><td class=\"wc\">Correct judgment but the student's brief 1-line justification (if requested) has a minor factual slip</td></tr><tr><td class=\"wc\">No credit</td><td class=\"wc\">Incorrect judgment or match</td></tr></tbody></table><div class=\"sec-hd\"><h3>NEW — Puzzle Rubric (Word Search / Unscramble / Crossword)</h3></div><div class=\"note\"><b>Note:</b> These are practice and fluency-building tools, not high-stakes assessments. Suggested grading: 1 point per word correctly found/unscrambled/filled, OR simply credit as complete/incomplete for a completion grade. Do not weight puzzles more than 5% of a unit grade.</div><div class=\"sec-hd\"><h3>NEW — Participation Rubric (Games, Partner & Group Activities)</h3></div><table class=\"tbl\"><thead><tr><th>Score</th><th>Criteria</th></tr></thead><tbody><tr><td class=\"wc\">4 — Excellent</td><td class=\"wc\">Actively engaged the whole time · Contributed correct, specific content · Helped teammates/partner · Stayed on-task</td></tr><tr><td class=\"wc\">3 — Good</td><td class=\"wc\">Engaged most of the time · Contributed relevant content · Minor off-task moments</td></tr><tr><td class=\"wc\">2 — Developing</td><td class=\"wc\">Participated when prompted · Limited content contribution</td></tr><tr><td class=\"wc\">1 — Beginning</td><td class=\"wc\">Mostly off-task or did not participate meaningfully</td></tr></tbody></table><div class=\"sec-hd\"><h3>Grade Scale & Points Summary</h3></div><table class=\"tbl\"><thead><tr><th>Grade</th><th>Range</th></tr></thead><tbody><tr><td class=\"wc\">A</td><td class=\"wc\">90-100%</td></tr><tr><td class=\"wc\">B</td><td class=\"wc\">80-89%</td></tr><tr><td class=\"wc\">C</td><td class=\"wc\">70-79%</td></tr><tr><td class=\"wc\">D</td><td class=\"wc\">60-69%</td></tr><tr><td class=\"wc\">F</td><td class=\"wc\">Below 60%</td></tr></tbody></table><table class=\"tbl\"><thead><tr><th>Assignment</th><th>Points</th><th>Key emphasis</th></tr></thead><tbody><tr><td class=\"wc\">CW1 — Q1, Q2, Rabb, Fitrah</td><td class=\"wc\">30</td><td class=\"wc\">6 Arabic terms + Allah definition + 7:54 structure</td></tr><tr><td class=\"wc\">CW2 — Q3, Signs vs Creation</td><td class=\"wc\">32</td><td class=\"wc\">Sorting activity + tafakkur enrichment (21:33)</td></tr><tr><td class=\"wc\">CW3 — Q4, Ibadah (3 categories)</td><td class=\"wc\">30</td><td class=\"wc\">Two proofs + corrected Ibn Taymiyyah definition</td></tr><tr><td class=\"wc\">CW4 — Shirk, sincerity/Du'a (5 proofs)</td><td class=\"wc\">34</td><td class=\"wc\">5 types of Shirk + 5 proofs (2 previously missing) + Az-Zumar</td></tr><tr><td class=\"wc\">CW5 — Taghut, Kufr bil-Taghut</td><td class=\"wc\">30</td><td class=\"wc\">First obligation + 2 definitions + mission summary</td></tr><tr><td class=\"wc\">CW6 — Q5: Islam, La ilaha, 5 Pillars</t
