n></div><div class=\"al\" style=\"flex:1;min-width:120px;\"></div></div></div>"}, {"id": "PAIR1", "cat": "collab", "lesson": 1, "title": "Partner Activity — L1: Q1 & Q2 — Who is Your Lord? The Meaning of ar-Rabb", "badge": "Pair Work · L1", "points": null, "html": "<div class=\"sh-hdr\"><div class=\"sh-top\"><div class=\"sh-title\">Partner Activity — Who is Your Lord?</div><div class=\"sh-badge\">Pair Work · L1</div></div><div class=\"sh-meta\"><div class=\"mf\"><div class=\"ml\">Names</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Date</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\"></div><div class=\"mv\"></div></div></div></div><div class=\"note\"><b>Note:</b> Work with a partner. Take turns — both partners must speak, write, and be ready to be called on.</div><div class=\"sec-hd\"><h3>Task</h3></div><div class=\"q\"><div class=\"qn\">Question 1</div><div class=\"qt\">Partner A asks Partner B مَنْ رَبُّكَ؟ in Arabic. Partner B answers, then explains ONE of the 6 terms of ar-Rabb using an example from today. Switch roles and repeat with a DIFFERENT term.</div></div><div class=\"q\"><div class=\"qn\">Question 2</div><div class=\"qt\">Together, find TWO things in your classroom right now that show Allah is الرَّازِق (the Provider). Write them below and be ready to share with the class.</div></div><div class=\"als\"><div class=\"aline\"></div><div class=\"aline\"></div></div>"}, {"id": "GRP1", "cat": "collab", "lesson": 1, "title": "Group Activity — L1: Q1 & Q2 — Who is Your Lord? The Meaning of ar-Rabb", "badge": "Small Group · L1", "points": null, "html": "<div class=\"sh-hdr\"><div class=\"sh-top\"><div class=\"sh-title\">Group Activity — Who is Your Lord?</div><div class=\"sh-badge\">Small Group · L1</div></div><div class=\"sh-meta\"><div class=\"mf\"><div class=\"ml\">Group Members</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Date</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\"></div><div class=\"mv\"></div></div></div></div><div class=\"note\"><b>Note:</b> Groups of 3-4. Assign roles: Reader, Recorder, Reporter, Timekeeper. Every group presents for 60 seconds when done.</div><div class=\"sec-hd\"><h3>Task</h3></div><div class=\"q\"><div class=\"qn\">Question 1</div><div class=\"qt\">As a group, build a poster (on the back of this sheet or on chart paper) titled \"The 6 Terms of ar-Rabb.\" Each group member illustrates or writes an everyday example for 1-2 terms. Reporter presents the poster in 60 seconds.</div></div><div class=\"note\"><b>Note:</b> Success check: does your poster include all 6 Arabic terms, their English meanings, AND a real-life example for each?</div>"}, {"id": "OPEN2", "cat": "openers", "lesson": 2, "title": "Daily Opener — L2: Q3 — How Do You Know Your Lord?", "badge": "Bell Ringer + Warm-Up · L2", "points": null, "html": "<div class=\"sh-hdr\"><div class=\"sh-top\"><div class=\"sh-title\">Daily Opener — How Do You Know Your Lord?</div><div class=\"sh-badge\">Bell Ringer + Warm-Up · L2</div></div><div class=\"sh-meta\"><div class=\"mf\"><div class=\"ml\">Name</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Date</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\"></div><div class=\"mv\"></div></div></div></div><div class=\"sec-hd\"><h3>🔔 Bell Ringer (3-5 min — books closed)</h3></div><div class=\"q\"><div class=\"qn\">Quick Recall</div><span class=\"qar\">مَنْ رَبُّكَ؟</span><div class=\"qt\">Quick-fire from last lesson: answer Q1 AND name 3 of the 6 terms of ar-Rabb.</div><div class=\"al\"></div></div><div class=\"sec-hd\"><h3>☀️ Warm-Up (connects to today)</h3></div><div class=\"q\"><div class=\"qn\">Think About It</div><div class=\"qt\">Can you see the wind? Can you tell it's there? Today's question asks the same thing about Allah — how do you know He's real if you can't see Him?</div><div class=\"al\"></div><div class=\"al\"></div></div>"}, {"id": "EXIT2", "cat": "openers", "lesson": 2, "title": "Exit Ticket — L2: Q3 — How Do You Know Your Lord?", "badge": "Exit Ticket · L2", "points": null, "html": "<div class=\"sh-hdr\"><div class=\"sh-top\"><div class=\"sh-title\">Exit Ticket — How Do You Know Your Lord?</div><div class=\"sh-badge\">Exit Ticket · L2</div></div><div class=\"sh-meta\"><div class=\"mf\"><div class=\"ml\">Name</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Date</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\"></div><div class=\"mv\"></div></div></div></div><div class=\"sec-hd\"><h3>Before you leave...</h3></div><div class=\"q\"><div class=\"qn\">Question 1</div><div class=\"qt\">Write today's question and its full Arabic answer.</div><span class=\"qar\">بِمَ تَعْرِفُ رَبَّكَ؟</span></div><div class=\"q\"><div class=\"qn\">Question 2</div><div class=\"qt\">Name one Sign (āyah) and one piece of Creation (makhluq) you noticed TODAY, and say which category each belongs to.</div></div><div class=\"q\"><div class=\"qn\">Question 3 — Self-Check</div><div class=\"qt\">Rate how confident you feel with today's lesson:</div><div class=\"mc\"><div class=\"mco\"><div class=\"bub\"></div>😄 I could teach this to someone else</div><div class=\"mco\"><div class=\"bub\"></div>🙂 I understand it well</div><div class=\"mco\"><div class=\"bub\"></div>🤔 I need a bit more practice</div><div class=\"mco\"><div class=\"bub\"></div>😕 I need to review this with my teacher</div></div></div>"}, {"id": "ORAL2", "cat": "oral", "lesson": 2, "title": "Oral Review Script — L2: Q3 — How Do You Know Your Lord?", "badge": "Teacher-Led Drill · L2", "points": null, "html": "<div class=\"sh-hdr\"><div class=\"sh-top\"><div class=\"sh-title\">Oral Review — How Do You Know Your Lord?</div><div class=\"sh-badge\">Teacher-Led Drill · L2</div></div><div class=\"sh-meta\"><div class=\"mf\"><div class=\"ml\">Teacher</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Date</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Class</div><div class=\"mv\"></div></div></div></div><div class=\"note\"><b>Note:</b> Whole-class call-and-response. Say the prompt, point to a student (or the whole class), then reveal the expected answer. Move fast — this is retrieval practice, not re-teaching.</div><div class=\"sec-hd\"><h3>Call & Response</h3></div><div class=\"oral\"><div class=\"oral-row\"><div class=\"oral-n\">1</div><div class=\"oral-p\">بِمَ تَعْرِفُ رَبَّكَ؟</div><div class=\"oral-a\">أَعْرِفُهُ بِآيَاتِهِ وَمَخْلُوقَاتِهِ</div></div><div class=\"oral-row\"><div class=\"oral-n\">2</div><div class=\"oral-p\">Name the 4 Signs the Imam lists.</div><div class=\"oral-a\">اللَّيْلُ وَالنَّهَارُ وَالشَّمْسُ وَالْقَمَرُ (night, day, sun, moon)</div></div><div class=\"oral-row\"><div class=\"oral-n\">3</div><div class=\"oral-p\">What does the Imam say about Creation?</div><div class=\"oral-a\">السَّمَوَاتُ وَالْأَرْضُ وَمَا فِيهِمَا — the heavens, the earth, and everything within them</div></div><div class=\"oral-row\"><div class=\"oral-n\">4</div><div class=\"oral-p\">What does آيَات mean in one word?</div><div class=\"oral-a\">Signs — what Allah is DOING</div></div><div class=\"oral-row\"><div class=\"oral-n\">5</div><div class=\"oral-p\">What does مَخْلُوقَات mean in one word?</div><div class=\"oral-a\">Creation — what Allah MADE</div></div><div class=\"oral-row\"><div class=\"oral-n\">6</div><div class=\"oral-p\">In Al-A'raf 7:54, which word equals مَخْلُوقَات and which equals آيَات?</div><div class=\"oral-a\">الْخَلْق = مَخْلُوقَات, الْأَمْر = آيَات</div></div><div class=\"oral-row\"><div class=\"oral-n\">7</div><div class=\"oral-p\">What does يَسْبَحُونَ mean in Al-Anbiya 21:33?</div><div class=\"oral-a\">\"They are swimming\" — the sun and moon actively moving in their orbits</div></div></div>"}, {"id": "VOCAB2", "cat": "vocab", "lesson": 2, "title": "Vocabulary & Flashcards — L2: Q3 — How Do You Know Your Lord?", "badge": "Arabic Terms · L2", "points": 6, "html": "<div class=\"sh-hdr\"><div class=\"sh-top\"><div class=\"sh-title\">Vocabulary Review — How Do You Know Your Lord?</div><div class=\"sh-badge\">Arabic Terms · L2</div></div><div class=\"sh-meta\"><div class=\"mf\"><div class=\"ml\">Name</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Date</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Score</div><div class=\"mv\"></div></div></div></div><div class=\"sec-hd\"><h3>Flashcards — cut along the lines</h3></div><div class=\"fc-grid\"><div class=\"fc\"><div class=\"fc-front\"><span class=\"qar\" style=\"font-size:1.6rem;\">آيَة</span><div class=\"fc-tr\">Ayah</div></div><div class=\"fc-back\">A sign — something Allah is DOING right now</div></div><div class=\"fc\"><div class=\"fc-front\"><span class=\"qar\" style=\"font-size:1.6rem;\">مَخْلُوق</span><div class=\"fc-tr\">Makhluq</div></div><div class=\"fc-back\">Something created — brought into being from nothing</div></div><div class=\"fc\"><div class=\"fc-front\"><span class=\"qar\" style=\"font-size:1.6rem;\">تَفَكُّر</span><div class=\"fc-tr\">Tafakkur</div></div><div class=\"fc-back\">Deep, deliberate contemplation</div></div><div class=\"fc\"><div class=\"fc-front\"><span class=\"qar\" style=\"font-size:1.6rem;\">يَسْبَحُون</span><div class=\"fc-tr\">Yasbahun</div></div><div class=\"fc-back\">\"They are swimming\" — describing the orbits</div></div><div class=\"fc\"><div class=\"fc-front\"><span class=\"qar\" style=\"font-size:1.6rem;\">سَمَاء</span><div class=\"fc-tr\">Sama'</div></div><div class=\"fc-back\">Sky / heaven</div></div><div class=\"fc\"><div class=\"fc-front\"><span class=\"qar\" style=\"font-size:1.6rem;\">أَرْض</span><div class=\"fc-tr\">Ard</div></div><div class=\"fc-back\">Earth</div></div></div><div class=\"sec-hd\"><h3>Quiz Yourself</h3><span class=\"pts\">6 pts</span></div><table class=\"tbl\"><thead><tr><th>Arabic</th><th>Transliteration</th><th>Meaning (cover and try to recall)</th></tr></thead><tbody><tr><td class=\"wc\">آيَة</td><td class=\"wc\">Ayah</td><td class=\"wc\"></td></tr><tr><td class=\"wc\">مَخْلُوق</td><td class=\"wc\">Makhluq</td><td class=\"wc\"></td></tr><tr><td class=\"wc\">تَفَكُّر</td><td class=\"wc\">Tafakkur</td><td class=\"wc\"></td></tr><tr><td class=\"wc\">يَسْبَحُون</td><td class=\"wc\">Yasbahun</td><td class=\"wc\"></td></tr><tr><td class=\"wc\">سَمَاء</td><td class=\"wc\">Sama'</td><td class=\"wc\"></td></tr><tr><td class=\"wc\">أَرْض</td><td class=\"wc\">Ard</td><td class=\"wc\"></td></tr></tbody></table>"}, {"id": "AYHD2", "cat": "vocab", "lesson": 2, "title": "Ayah & Hadith Review — L2: Q3 — How Do You Know Your Lord?", "badge": "Recitation Practice · L2", "points": 0, "html": "<div class=\"sh-hdr\"><div class=\"sh-top\"><div class=\"sh-title\">Ayah & Hadith Review — How Do You Know Your Lord?</div><div class=\"sh-badge\">Recitation Practice · L2</div></div><div class=\"sh-meta\"><div class=\"mf\"><div class=\"ml\">Name</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Date</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Score</div><div class=\"mv\"></div></div></div></div><div class=\"sec-hd\"><h3>This Lesson's Ayahs (1)</h3><span class=\"pts\">5 pts</span></div><div class=\"q\"><div class=\"qn\">Ayah 1 — Al-Anbiya 21:33 (Enrichment — not the Imam's own citation)</div><span class=\"qar\">وَهُوَ الَّذِي خَلَقَ اللَّيْلَ وَالنَّهَارَ وَالشَّمْسَ وَالْقَمَرَ ۖ كُلٌّ فِي فَلَكٍ يَسْبَحُونَ</span><div class=\"qt\">1. Copy the ayah above in your own handwriting: </div><div class=\"al\"></div><div class=\"qt\">2. Translate it in your own words: </div><div class=\"al\"></div><div class=\"qt\">3. What does this ayah prove or teach? </div><div class=\"al\"></div><div class=\"qt\">4. Fill in the missing word from memory: </div><div class=\"qt qar\">وَهُوَ الَّذِي خَلَقَ اللَّيْلَ وَالنَّهَارَ وَالشَّمْسَ ______ ۖ كُلٌّ فِي فَلَكٍ يَسْبَحُونَ</div><div class=\"qt\">5. Why does this matter for how YOU live today? </div><div class=\"al\"></div></div>"}, {"id": "MATCH2", "cat": "games", "lesson": 2, "title": "Matching Activity — L2: Q3 — How Do You Know Your Lord?", "badge": "Match the Terms · L2", "points": 6, "html": "<div class=\"sh-hdr\"><div class=\"sh-top\"><div class=\"sh-title\">Matching — How Do You Know Your Lord?</div><div class=\"sh-badge\">Match the Terms · L2</div></div><div class=\"sh-meta\"><div class=\"mf\"><div class=\"ml\">Name</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Date</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Score</div><div class=\"mv\"></div></div></div></div><div class=\"sec-hd\"><h3>Draw a line (or write the letter) to match each item</h3><span class=\"pts\">6 pts</span></div><div class=\"match-grid\"><div class=\"match-col\"><h4>Column A</h4><div class=\"mi\"><div class=\"mn\">1</div>آيَة (Sign)</div><div class=\"mi\"><div class=\"mn\">2</div>مَخْلُوق (Creation)</div><div class=\"mi\"><div class=\"mn\">3</div>تَفَكُّر</div><div class=\"mi\"><div class=\"mn\">4</div>يَسْبَحُونَ</div><div class=\"mi\"><div class=\"mn\">5</div>سَمَاء</div><div class=\"mi\"><div class=\"mn\">6</div>أَرْض</div></div><div class=\"match-col\"><h4>Column B</h4><div class=\"mi\"><div class=\"mlt\">A</div>Deep contemplation<div class=\"mblk\"></div></div><div class=\"mi\"><div class=\"mlt\">B</div>Sky<div class=\"mblk\"></div></div><div class=\"mi\"><div class=\"mlt\">C</div>\"They are swimming\"<div class=\"mblk\"></div></div><div class=\"mi\"><div class=\"mlt\">D</div>Earth<div class=\"mblk\"></div></div><div class=\"mi\"><div class=\"mlt\">E</div>Something Allah is DOING right now<div class=\"mblk\"></div></div><div class=\"mi\"><div class=\"mlt\">F</div>Something Allah MADE<div class=\"mblk\"></div></div></div></div>"}, {"id": "TF2", "cat": "games", "lesson": 2, "title": "True/False — L2: Q3 — How Do You Know Your Lord?", "badge": "T/F Quick Check · L2", "points": 8, "html": "<div class=\"sh-hdr\"><div class=\"sh-top\"><div class=\"sh-title\">True or False — How Do You Know Your Lord?</div><div class=\"sh-badge\">T/F Quick Check · L2</div></div><div class=\"sh-meta\"><div class=\"mf\"><div class=\"ml\">Name</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Date</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Score</div><div class=\"mv\"></div></div></div></div><div class=\"sec-hd\"><h3>Circle T or F for each statement</h3><span class=\"pts\">8 pts</span></div><div class=\"tf\"><div class=\"tfrow\"><div class=\"tfopt\"><span class=\"tfbub\">T</span><span class=\"tfbub\">F</span></div><div class=\"tftext\">1. A Sign (āyah) is something Allah MADE, like a mountain.</div></div><div class=\"tfrow\"><div class=\"tfopt\"><span class=\"tfbub\">T</span><span class=\"tfbub\">F</span></div><div class=\"tftext\">2. The night coming every evening is an example of a Sign.</div></div><div class=\"tfrow\"><div class=\"tfopt\"><span class=\"tfbub\">T</span><span class=\"tfbub\">F</span></div><div class=\"tftext\">3. The Imam's proof for Q3 comes from the same ayah used for Q1 and Q2 — Al-A'raf 7:54.</div></div><div class=\"tfrow\"><div class=\"tfopt\"><span class=\"tfbub\">T</span><span class=\"tfbub\">F</span></div><div class=\"tftext\">4. Al-Anbiya 21:33 is quoted directly by the Imam in the treatise.</div></div><div class=\"tfrow\"><div class=\"tfopt\"><span class=\"tfbub\">T</span><span class=\"tfbub\">F</span></div><div class=\"tftext\">5. Scientists estimate there are over 2 trillion galaxies in the universe.</div></div><div class=\"tfrow\"><div class=\"tfopt\"><span class=\"tfbub\">T</span><span class=\"tfbub\">F</span></div><div class=\"tftext\">6. يَسْبَحُونَ means \"they are sleeping.\"</div></div><div class=\"tfrow\"><div class=\"tfopt\"><span class=\"tfbub\">T</span><span class=\"tfbub\">F</span></div><div class=\"tftext\">7. The heavens, the earth, and everything within them are Allah's Creation.</div></div><div class=\"tfrow\"><div class=\"tfopt\"><span class=\"tfbub\">T</span><span class=\"tfbub\">F</span></div><div class=\"tftext\">8. Q3 answers the question: \"how do you know your Lord exists?\"</div></div></div>"}, {"id": "WS2", "cat": "games", "lesson": 2, "title": "Word Search — L2: Q3 — How Do You Know Your Lord?", "badge": "Puzzle · L2", "points": null, "html": "<div class=\"sh-hdr\"><div class=\"sh-top\"><div class=\"sh-title\">Word Search — How Do You Know Your Lord?</div><div class=\"sh-badge\">Puzzle · L2</div></div><div class=\"sh-meta\"><div class=\"mf\"><div class=\"ml\">Name</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Date</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Score</div><div class=\"mv\"></div></div></div></div><div class=\"sec-hd\"><h3>Find every term (transliterated)</h3></div><div class=\"ws-wrap\"><table class=\"ws\"><tr><td>N</td><td>Y</td><td>P</td><td>P</td><td>G</td><td>M</td><td>B</td><td>F</td><td>M</td><td>A</td><td>M</td><td>I</td></tr><tr><td>S</td><td>A</td><td>M</td><td>A</td><td>Z</td><td>T</td><td>Z</td><td>O</td><td>M</td><td>J</td><td>N</td><td>W</td></tr><tr><td>X</td><td>S</td><td>Z</td><td>R</td><td>V</td><td>A</td><td>W</td><td>P</td><td>A</td><td>E</td><td>G</td><td>J</td></tr><tr><td>G</td><td>B</td><td>A</td><td>B</td><td>S</td><td>F</td><td>X</td><td>R</td><td>K</td><td>B</td><td>X</td><td>K</td></tr><tr><td>B</td><td>A</td><td>B</td><td>R</td><td>S</td><td>A</td><td>P</td><td>Q</td><td>H</td><td>Q</td><td>F</td><td>B</td></tr><tr><td>Q</td><td>H</td><td>C</td><td>F</td><td>D</td><td>K</td><td>C</td><td>T</td><td>L</td><td>C</td><td>V</td><td>H</td></tr><tr><td>M</td><td>U</td><td>D</td><td>S</td><td>H</td><td>K</td><td>S</td><td>T</td><td>U</td><td>B</td><td>T</td><td>C</td></tr><tr><td>N</td><td>N</td><td>V</td><td>S</td><td>S</td><td>U</td><td>Q</td><td>K</td><td>Q</td><td>I</td><td>G</td><td>V</td></tr><tr><td>W</td><td>K</td><td>H</td><td>I</td><td>M</td><td>R</td><td>E</td><td>A</td><td>Y</td><td>A</td><td>H</td><td>V</td></tr><tr><td>U</td><td>J</td><td>O</td><td>K</td><td>Y</td><td>C</td><td>A</td><td>O</td><td>T</td><td>S</td><td>D</td><td>C</td></tr><tr><td>R</td><td>G</td><td>Q</td><td>I</td><td>E</td><td>L</td><td>C</td><td>H</td><td>L</td><td>J</td><td>F</td><td>O</td></tr><tr><td>R</td><td>W</td><td>J</td><td>T</td><td>Z</td><td>U</td><td>Q</td><td>A</td><td>V</td><td>R</td><td>J</td><td>V</td></tr></table><div class=\"wb\" style=\"margin-top:10px;\"><h4>L2 Terms — Word Bank</h4><div class=\"words\"><span class=\"word\">Ayah</span><span class=\"word\">Makhluq</span><span class=\"word\">Tafakkur</span><span class=\"word\">Yasbahun</span><span class=\"word\">Sama'</span><span class=\"word\">Ard</span></div></div></div>"}, {"id": "UNSC2", "cat": "games", "lesson": 2, "title": "Unscramble — L2: Q3 — How Do You Know Your Lord?", "badge": "Puzzle · L2", "points": 6, "html": "<div class=\"sh-hdr\"><div class=\"sh-top\"><div class=\"sh-title\">Unscramble — How Do You Know Your Lord?</div><div class=\"sh-badge\">Puzzle · L2</div></div><div class=\"sh-meta\"><div class=\"mf\"><div class=\"ml\">Name</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Date</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Score</div><div class=\"mv\"></div></div></div></div><div class=\"sec-hd\"><h3>Unscramble each term, then write it in Arabic</h3><span class=\"pts\">6 pts</span></div><div class=\"unsc\"><div class=\"unsc-row\"><div class=\"unsc-n\">1.</div><div class=\"unsc-scr\">A Y H A</div><div class=\"unsc-cl\">A sign — something Allah is DOING right now <span class=\"qar\" style=\"font-size:1.1rem;\">آيَة</span></div><div class=\"al\" style=\"flex:1;min-width:120px;\"></div></div><div class=\"unsc-row\"><div class=\"unsc-n\">2.</div><div class=\"unsc-scr\">U K H A L Q M</div><div class=\"unsc-cl\">Something created — brought into being from nothing <span class=\"qar\" style=\"font-size:1.1rem;\">مَخْلُوق</span></div><div class=\"al\" style=\"flex:1;min-width:120px;\"></div></div><div class=\"unsc-row\"><div class=\"unsc-n\">3.</div><div class=\"unsc-scr\">T K R U A F K A</div><div class=\"unsc-cl\">Deep, deliberate contemplation <span class=\"qar\" style=\"font-size:1.1rem;\">تَفَكُّر</span></div><div class=\"al\" style=\"flex:1;min-width:120px;\"></div></div><div class=\"unsc-row\"><div class=\"unsc-n\">4.</div><div class=\"unsc-scr\">S N A B H Y U A</div><div class=\"unsc-cl\">\"They are swimming\" — describing the orbits <span class=\"qar\" style=\"font-size:1.1rem;\">يَسْبَحُون</span></div><div class=\"al\" style=\"flex:1;min-width:120px;\"></div></div><div class=\"unsc-row\"><div class=\"unsc-n\">5.</div><div class=\"unsc-scr\">M A A S</div><div class=\"unsc-cl\">Sky / heaven <span class=\"qar\" style=\"font-size:1.1rem;\">سَمَاء</span></div><div class=\"al\" style=\"flex:1;min-width:120px;\"></div></div><div class=\"unsc-row\"><div class=\"unsc-n\">6.</div><div class=\"unsc-scr\">D R A</div><div class=\"unsc-cl\">Earth <span class=\"qar\" style=\"font-size:1.1rem;\">أَرْض</span></div><div class=\"al\" style=\"flex:1;min-width:120px;\"></div></div></div>"}, {"id": "PAIR2", "cat": "collab", "lesson": 2, "title": "Partner Activity — L2: Q3 — How Do You Know Your Lord?", "badge": "Pair Work · L2", "points": null, "html": "<div class=\"sh-hdr\"><div class=\"sh-top\"><div class=\"sh-title\">Partner Activity — How Do You Know Your Lord?</div><div class=\"sh-badge\">Pair Work · L2</div></div><div class=\"sh-meta\"><div class=\"mf\"><div class=\"ml\">Names</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Date</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\"></div><div class=\"mv\"></div></div></div></div><div class=\"note\"><b>Note:</b> Work with a partner. Take turns — both partners must speak, write, and be ready to be called on.</div><div class=\"sec-hd\"><h3>Task</h3></div><div class=\"q\"><div class=\"qn\">Question 1</div><div class=\"qt\">Take turns pointing to something in the room or outside the window. Your partner says whether it is a Sign or Creation (or both) and explains why in one sentence.</div></div><div class=\"q\"><div class=\"qn\">Question 2</div><div class=\"qt\">Together, write a 2-sentence du'a inspired by looking at the sky, using at least one word from today's vocabulary.</div></div><div class=\"als\"><div class=\"aline\"></div><div class=\"aline\"></div></div>"}, {"id": "GRP2", "cat": "collab", "lesson": 2, "title": "Group Activity — L2: Q3 — How Do You Know Your Lord?", "badge": "Small Group · L2", "points": null, "html": "<div class=\"sh-hdr\"><div class=\"sh-top\"><div class=\"sh-title\">Group Activity — How Do You Know Your Lord?</div><div class=\"sh-badge\">Small Group · L2</div></div><div class=\"sh-meta\"><div class=\"mf\"><div class=\"ml\">Group Members</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Date</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\"></div><div class=\"mv\"></div></div></div></div><div class=\"note\"><b>Note:</b> Groups of 3-4. Assign roles: Reader, Recorder, Reporter, Timekeeper. Every group presents for 60 seconds when done.</div><div class=\"sec-hd\"><h3>Task</h3></div><div class=\"q\"><div class=\"qn\">Question 1</div><div class=\"qt\">Sort activity: your teacher will give your group a stack of picture/word cards. Sort them into two piles — SIGNS and CREATION — as fast as you can. Recorder tracks your time. Compare times across groups at the end.</div></div><div class=\"note\"><b>Note:</b> Discuss as a group before reporting: was anything hard to sort? Why?</div>"}, {"id": "OPEN3", "cat": "openers", "lesson": 3, "title": "Daily Opener — L3: Q4 — Why Were You Created? (Al-'Ibadah)", "badge": "Bell Ringer + Warm-Up · L3", "points": null, "html": "<div class=\"sh-hdr\"><div class=\"sh-top\"><div class=\"sh-title\">Daily Opener — Why Were You Created?</div><div class=\"sh-badge\">Bell Ringer + Warm-Up · L3</div></div><div class=\"sh-meta\"><div class=\"mf\"><div class=\"ml\">Name</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Date</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\"></div><div class=\"mv\"></div></div></div></div><div class=\"sec-hd\"><h3>🔔 Bell Ringer (3-5 min — books closed)</h3></div><div class=\"q\"><div class=\"qn\">Quick Recall</div><span class=\"qar\">بِمَ تَعْرِفُ رَبَّكَ؟</span><div class=\"qt\">Answer today's bell ringer: what are Allah's 4 Signs and what is His Creation, per the Imam's exact words?</div><div class=\"al\"></div></div><div class=\"sec-hd\"><h3>☀️ Warm-Up (connects to today)</h3></div><div class=\"q\"><div class=\"qn\">Think About It</div><div class=\"qt\">A chair is made to be sat on. A car is made to drive. You were made too — on purpose. Before we open the book, write your honest guess: why do YOU think Allah created you?</div><div class=\"al\"></div><div class=\"al\"></div></div>"}, {"id": "EXIT3", "cat": "openers", "lesson": 3, "title": "Exit Ticket — L3: Q4 — Why Were You Created? (Al-'Ibadah)", "badge": "Exit Ticket · L3", "points": null, "html": "<div class=\"sh-hdr\"><div class=\"sh-top\"><div class=\"sh-title\">Exit Ticket — Why Were You Created?</div><div class=\"sh-badge\">Exit Ticket · L3</div></div><div class=\"sh-meta\"><div class=\"mf\"><div class=\"ml\">Name</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Date</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\"></div><div class=\"mv\"></div></div></div></div><div class=\"sec-hd\"><h3>Before you leave...</h3></div><div class=\"q\"><div class=\"qn\">Question 1</div><div class=\"qt\">Write today's question and its Arabic answer.</div><span class=\"qar\">لِأَيِّ شَيْءٍ خَلَقَكَ؟</span></div><div class=\"q\"><div class=\"qn\">Question 2</div><div class=\"qt\">Give ONE example of something you already do that counts as Ibadah if your intention is right — and explain why it counts.</div></div><div class=\"q\"><div class=\"qn\">Question 3 — Self-Check</div><div class=\"qt\">Rate how confident you feel with today's lesson:</div><div class=\"mc\"><div class=\"mco\"><div class=\"bub\"></div>😄 I could teach this to someone else</div><div class=\"mco\"><div class=\"bub\"></div>🙂 I understand it well</div><div class=\"mco\"><div class=\"bub\"></div>🤔 I need a bit more practice</div><div class=\"mco\"><div class=\"bub\"></div>😕 I need to review this with my teacher</div></div></div>"}, {"id": "ORAL3", "cat": "oral", "lesson": 3, "title": "Oral Review Script — L3: Q4 — Why Were You Created? (Al-'Ibadah)", "badge": "Teacher-Led Drill · L3", "points": null, "html": "<div class=\"sh-hdr\"><div class=\"sh-top\"><div class=\"sh-title\">Oral Review — Why Were You Created?</div><div class=\"sh-badge\">Teacher-Led Drill · L3</div></div><div class=\"sh-meta\"><div class=\"mf\"><div class=\"ml\">Teacher</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Date</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Class</div><div class=\"mv\"></div></div></div></div><div class=\"note\"><b>Note:</b> Whole-class call-and-response. Say the prompt, point to a student (or the whole class), then reveal the expected answer. Move fast — this is retrieval practice, not re-teaching.</div><div class=\"sec-hd\"><h3>Call & Response</h3></div><div class=\"oral\"><div class=\"oral-row\"><div class=\"oral-n\">1</div><div class=\"oral-p\">لِأَيِّ شَيْءٍ خَلَقَكَ؟</div><div class=\"oral-a\">لِعِبَادَتِهِ وَحْدَهُ لَا شَرِيكَ لَهُ وَطَاعَتِهِ</div></div><div class=\"oral-row\"><div class=\"oral-n\">2</div><div class=\"oral-p\">What is Proof 1 for Q4?</div><div class=\"oral-a\">Adh-Dhariyat 51:56 — وَمَا خَلَقْتُ الْجِنَّ وَالْإِنسَ إِلَّا لِيَعْبُدُونِ</div></div><div class=\"oral-row\"><div class=\"oral-n\">3</div><div class=\"oral-p\">What is Proof 2 for Q4?</div><div class=\"oral-a\">An-Nisa 4:36 — وَاعْبُدُوا اللَّهَ وَلَا تُشْرِكُوا بِهِ شَيْئًا</div></div><div class=\"oral-row\"><div class=\"oral-n\">4</div><div class=\"oral-p\">What are the Imam's 3 categories of Ibadah?</div><div class=\"oral-a\">أَقْوَال (statements) · أَعْمَال ظَاهِرَة (outward actions) · أَعْمَال بَاطِنَة (inward actions)</div></div><div class=\"oral-row\"><div class=\"oral-n\">5</div><div class=\"oral-p\">Who defined Ibadah in the words the Imam quotes?</div><div class=\"oral-a\">Ibn Taymiyyah</div></div><div class=\"oral-row\"><div class=\"oral-n\">6</div><div class=\"oral-p\">What Arabic word means \"intention\"?</div><div class=\"oral-a\">النِّيَّة</div></div><div class=\"oral-row\"><div class=\"oral-n\">7</div><div class=\"oral-p\">Fill in: Ibadah is a comprehensive term for everything Allah ______ and is ______ with.</div><div class=\"oral-a\">يُحِبُّهُ / يَرْضَاهُ</div></div></div>"}, {"id": "VOCAB3", "cat": "vocab", "lesson": 3, "title": "Vocabulary & Flashcards — L3: Q4 — Why Were You Created? (Al-'Ibadah)", "badge": "Arabic Terms · L3", "points": 7, "html": "<div class=\"sh-hdr\"><div class=\"sh-top\"><div class=\"sh-title\">Vocabulary Review — Why Were You Created?</div><div class=\"sh-badge\">Arabic Terms · L3</div></div><div class=\"sh-meta\"><div class=\"mf\"><div class=\"ml\">Name</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Date</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Score</div><div class=\"mv\"></div></div></div></div><div class=\"sec-hd\"><h3>Flashcards — cut along the lines</h3></div><div class=\"fc-grid\"><div class=\"fc\"><div class=\"fc-front\"><span class=\"qar\" style=\"font-size:1.6rem;\">عِبَادَة</span><div class=\"fc-tr\">Ibadah</div></div><div class=\"fc-back\">Worship — everything Allah loves and is pleased with</div></div><div class=\"fc\"><div class=\"fc-front\"><span class=\"qar\" style=\"font-size:1.6rem;\">قَوْل</span><div class=\"fc-tr\">Qawl</div></div><div class=\"fc-back\">A statement / something said</div></div><div class=\"fc\"><div class=\"fc-front\"><span class=\"qar\" style=\"font-size:1.6rem;\">عَمَل</span><div class=\"fc-tr\">'Amal</div></div><div class=\"fc-back\">An action / deed</div></div><div class=\"fc\"><div class=\"fc-front\"><span class=\"qar\" style=\"font-size:1.6rem;\">ظَاهِر</span><div class=\"fc-tr\">Zahir</div></div><div class=\"fc-back\">Outward / visible</div></div><div class=\"fc\"><div class=\"fc-front\"><span class=\"qar\" style=\"font-size:1.6rem;\">بَاطِن</span><div class=\"fc-tr\">Batin</div></div><div class=\"fc-back\">Inward / of the heart</div></div><div class=\"fc\"><div class=\"fc-front\"><span class=\"qar\" style=\"font-size:1.6rem;\">نِيَّة</span><div class=\"fc-tr\">Niyyah</div></div><div class=\"fc-back\">Intention</div></div><div class=\"fc\"><div class=\"fc-front\"><span class=\"qar\" style=\"font-size:1.6rem;\">شَرِيك</span><div class=\"fc-tr\">Sharik</div></div><div class=\"fc-back\">Partner (as in: no partner for Allah)</div></div></div><div class=\"sec-hd\"><h3>Quiz Yourself</h3><span class=\"pts\">7 pts</span></div><table class=\"tbl\"><thead><tr><th>Arabic</th><th>Transliteration</th><th>Meaning (cover and try to recall)</th></tr></thead><tbody><tr><td class=\"wc\">عِبَادَة</td><td class=\"wc\">Ibadah</td><td class=\"wc\"></td></tr><tr><td class=\"wc\">قَوْل</td><td class=\"wc\">Qawl</td><td class=\"wc\"></td></tr><tr><td class=\"wc\">عَمَل</td><td class=\"wc\">'Amal</td><td class=\"wc\"></td></tr><tr><td class=\"wc\">ظَاهِر</td><td class=\"wc\">Zahir</td><td class=\"wc\"></td></tr><tr><td class=\"wc\">بَاطِن</td><td class=\"wc\">Batin</td><td class=\"wc\"></td></tr><tr><td class=\"wc\">نِيَّة</td><td class=\"wc\">Niyyah</td><td class=\"wc\"></td></tr><tr><td class=\"wc\">شَرِيك</td><td class=\"wc\">Sharik</td><td class=\"wc\"></td></tr></tbody></table>"}, {"id": "AYHD3", "cat": "vocab", "lesson": 3, "title": "Ayah & Hadith Review — L3: Q4 — Why Were You Created? (Al-'Ibadah)", "badge": "Recitation Practice · L3", "points": 6, "html": "<div class=\"sh-hdr\"><div class=\"sh-top\"><div class=\"sh-title\">Ayah & Hadith Review — Why Were You Created?</div><div class=\"sh-badge\">Recitation Practice · L3</div></div><div class=\"sh-meta\"><div class=\"mf\"><div class=\"ml\">Name</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Date</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Score</div><div class=\"mv\"></div></div></div></div><div class=\"sec-hd\"><h3>This Lesson's Ayahs (2)</h3><span class=\"pts\">10 pts</span></div><div class=\"q\"><div class=\"qn\">Ayah 1 — Adh-Dhariyat 51:56</div><span class=\"qar\">وَمَا خَلَقْتُ الْجِنَّ وَالْإِنسَ إِلَّا لِيَعْبُدُونِ</span><div class=\"qt\">1. Copy the ayah above in your own handwriting: </div><div class=\"al\"></div><div class=\"qt\">2. Translate it in your own words: </div><div class=\"al\"></div><div class=\"qt\">3. What does this ayah prove or teach? </div><div class=\"al\"></div><div class=\"qt\">4. Fill in the missing word from memory: </div><div class=\"qt qar\">وَمَا خَلَقْتُ الْجِنَّ ______ إِلَّا لِيَعْبُدُونِ</div><div class=\"qt\">5. Why does this matter for how YOU live today? </div><div class=\"al\"></div></div><div class=\"q\"><div class=\"qn\">Ayah 2 — An-Nisa 4:36</div><span class=\"qar\">وَاعْبُدُوا اللَّهَ وَلَا تُشْرِكُوا بِهِ شَيْئًا</span><div class=\"qt\">1. Copy the ayah above in your own handwriting: </div><div class=\"al\"></div><div class=\"qt\">2. Translate it in your own words: </div><div class=\"al\"></div><div class=\"qt\">3. What does this ayah prove or teach? </div><div class=\"al\"></div><div class=\"qt\">4. Fill in the missing word from memory: </div><div class=\"qt qar\">وَاعْبُدُوا اللَّهَ وَلَا ______ بِهِ شَيْئًا</div><div class=\"qt\">5. Why does this matter for how YOU live today? </div><div class=\"al\"></div></div>"}, {"id": "MATCH3", "cat": "games", "lesson": 3, "title": "Matching Activity — L3: Q4 — Why Were You Created? (Al-'Ibadah)", "badge": "Match the Terms · L3", "points": 6, "html": "<div class=\"sh-hdr\"><div class=\"sh-top\"><div class=\"sh-title\">Matching — Why Were You Created?</div><div class=\"sh-badge\">Match the Terms · L3</div></div><div class=\"sh-meta\"><div class=\"mf\"><div class=\"ml\">Name</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Date</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Score</div><div class=\"mv\"></div></div></div></div><div class=\"sec-hd\"><h3>Draw a line (or write the letter) to match each item</h3><span class=\"pts\">6 pts</span></div><div class=\"match-grid\"><div class=\"match-col\"><h4>Column A</h4><div class=\"mi\"><div class=\"mn\">1</div>عِبَادَة</div><div class=\"mi\"><div class=\"mn\">2</div>قَوْل</div><div class=\"mi\"><div class=\"mn\">3</div>عَمَل</div><div class=\"mi\"><div class=\"mn\">4</div>ظَاهِر</div><div class=\"mi\"><div class=\"mn\">5</div>بَاطِن</div><div class=\"mi\"><div class=\"mn\">6</div>نِيَّة</div></div><div class=\"match-col\"><h4>Column B</h4><div class=\"mi\"><div class=\"mlt\">A</div>Intention<div class=\"mblk\"></div></div><div class=\"mi\"><div class=\"mlt\">B</div>Outward / visible<div class=\"mblk\"></div></div><div class=\"mi\"><div class=\"mlt\">C</div>Worship<div class=\"mblk\"></div></div><div class=\"mi\"><div class=\"mlt\">D</div>Inward / of the heart<div class=\"mblk\"></div></div><div class=\"mi\"><div class=\"mlt\">E</div>A statement<div class=\"mblk\"></div></div><div class=\"mi\"><div class=\"mlt\">F</div>An action<div class=\"mblk\"></div></div></div></div>"}, {"id": "TF3", "cat": "games", "lesson": 3, "title": "True/False — L3: Q4 — Why Were You Created? (Al-'Ibadah)", "badge": "T/F Quick Check · L3", "points": 8, "html": "<div class=\"sh-hdr\"><div class=\"sh-top\"><div class=\"sh-title\">True or False — Why Were You Created?</div><div class=\"sh-badge\">T/F Quick Check · L3</div></div><div class=\"sh-meta\"><div class=\"mf\"><div class=\"ml\">Name</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Date</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Score</div><div class=\"mv\"></div></div></div></div><div class=\"sec-hd\"><h3>Circle T or F for each statement</h3><span class=\"pts\">8 pts</span></div><div class=\"tf\"><div class=\"tfrow\"><div class=\"tfopt\"><span class=\"tfbub\">T</span><span class=\"tfbub\">F</span></div><div class=\"tftext\">1. According to the Imam, you were created to worship Allah alone, without partner.</div></div><div class=\"tfrow\"><div class=\"tfopt\"><span class=\"tfbub\">T</span><span class=\"tfbub\">F</span></div><div class=\"tftext\">2. Adh-Dhariyat 51:56 says Allah created jinn and mankind for many different purposes.</div></div><div class=\"tfrow\"><div class=\"tfopt\"><span class=\"tfbub\">T</span><span class=\"tfbub\">F</span></div><div class=\"tftext\">3. Ibn Taymiyyah's definition of Ibadah only includes outward actions like salah and fasting.</div></div><div class=\"tfrow\"><div class=\"tfopt\"><span class=\"tfbub\">T</span><span class=\"tfbub\">F</span></div><div class=\"tftext\">4. أَقْوَال (statements) is ONE category in the Imam's definition of Ibadah, not split into inward/outward.</div></div><div class=\"tfrow\"><div class=\"tfopt\"><span class=\"tfbub\">T</span><span class=\"tfbub\">F</span></div><div class=\"tftext\">5. Feeling love and fear of Allah in your heart can be a form of Ibadah.</div></div><div class=\"tfrow\"><div class=\"tfopt\"><span class=\"tfbub\">T</span><span class=\"tfbub\">F</span></div><div class=\"tftext\">6. An-Nisa 4:36 commands worshipping Allah and NOT associating any partner with Him.</div></div><div class=\"tfrow\"><div class=\"tfopt\"><span class=\"tfbub\">T</span><span class=\"tfbub\">F</span></div><div class=\"tftext\">7. The Imam brings only ONE proof for Q4.</div></div><div class=\"tfrow\"><div class=\"tfopt\"><span class=\"tfbub\">T</span><span class=\"tfbub\">F</span></div><div class=\"tftext\">8. Your >Z</td><td>X</td><td>M</td><td>F</td><td>V</td><td>C</td><td>J</td></tr><tr><td>Q</td><td>V</td><td>U</td><td>A</td><td>T</td><td>K</td><td>C</td><td>Y</td><td>A</td><td>H</td><td>V</td><td>J</td></tr><tr><td>H</td><td>Z</td><td>B</td><td>G</td><td>E</td><td>A</td><td>B</td><td>H</td><td>P</td><td>L</td><td>T</td><td>Y</td></tr></table><div class=\"wb\" style=\"margin-top:10px;\"><h4>L3 Terms — Word Bank</h4><div class=\"words\"><span class=\"word\">Ibadah</span><span class=\"word\">Qawl</span><span class=\"word\">'Amal</span><span class=\"word\">Zahir</span><span class=\"word\">Batin</span><span class=\"word\">Niyyah</span><span class=\"word\">Sharik</span></div></div></div>"}, {"id": "UNSC3", "cat": "games", "lesson": 3, "title": "Unscramble — L3: Q4 — Why Were You Created? (Al-'Ibadah)", "badge": "Puzzle · L3", "points": 7, "html": "<div class=\"sh-hdr\"><div class=\"sh-top\"><div class=\"sh-title\">Unscramble — Why Were You Created?</div><div class=\"sh-badge\">Puzzle · L3</div></div><div class=\"sh-meta\"><div class=\"mf\"><div class=\"ml\">Name</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Date</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Score</div><div class=\"mv\"></div></div></div></div><div class=\"sec-hd\"><h3>Unscramble each term, then write it in Arabic</h3><span class=\"pts\">7 pts</span></div><div class=\"unsc\"><div class=\"unsc-row\"><div class=\"unsc-n\">1.</div><div class=\"unsc-scr\">B H A A D I</div><div class=\"unsc-cl\">Worship — everything Allah loves and is pleased with <span class=\"qar\" style=\"font-size:1.1rem;\">عِبَادَة</span></div><div class=\"al\" style=\"flex:1;min-width:120px;\"></div></div><div class=\"unsc-row\"><div class=\"unsc-n\">2.</div><div class=\"unsc-scr\">Q W A L</div><div class=\"unsc-cl\">A statement / something said <span class=\"qar\" style=\"font-size:1.1rem;\">قَوْل</span></div><div class=\"al\" style=\"flex:1;min-width:120px;\"></div></div><div class=\"unsc-row\"><div class=\"unsc-n\">3.</div><div class=\"unsc-scr\">L A A M</div><div class=\"unsc-cl\">An action / deed <span class=\"qar\" style=\"font-size:1.1rem;\">عَمَل</span></div><div class=\"al\" style=\"flex:1;min-width:120px;\"></div></div><div class=\"unsc-row\"><div class=\"unsc-n\">4.</div><div class=\"unsc-scr\">A H R I Z</div><div class=\"unsc-cl\">Outward / visible <span class=\"qar\" style=\"font-size:1.1rem;\">ظَاهِر</span></div><div class=\"al\" style=\"flex:1;min-width:120px;\"></div></div><div class=\"unsc-row\"><div class=\"unsc-n\">5.</div><div class=\"unsc-scr\">A T B I N</div><div class=\"unsc-cl\">Inward / of the heart <span class=\"qar\" style=\"font-size:1.1rem;\">بَاطِن</span></div><div class=\"al\" style=\"flex:1;min-width:120px;\"></div></div><div class=\"unsc-row\"><div class=\"unsc-n\">6.</div><div class=\"unsc-scr\">H Y A I Y N</div><div class=\"unsc-cl\">Intention <span class=\"qar\" style=\"font-size:1.1rem;\">نِيَّة</span></div><div class=\"al\" style=\"flex:1;min-width:120px;\"></div></div><div class=\"unsc-row\"><div class=\"unsc-n\">7.</div><div class=\"unsc-scr\">S H A K I R</div><div class=\"unsc-cl\">Partner (as in: no partner for Allah) <span class=\"qar\" style=\"font-size:1.1rem;\">شَرِيك</span></div><div class=\"al\" style=\"flex:1;min-width:120px;\"></div></div></div>"}, {"id": "PAIR3", "cat": "collab", "lesson": 3, "title": "Partner Activity — L3: Q4 — Why Were You Created? (Al-'Ibadah)", "badge": "Pair Work · L3", "points": null, "html": "<div class=\"sh-hdr\"><div class=\"sh-top\"><div class=\"sh-title\">Partner Activity — Why Were You Created?</div><div class=\"sh-badge\">Pair Work · L3</div></div><div class=\"sh-meta\"><div class=\"mf\"><div class=\"ml\">Names</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Date</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\"></div><div class=\"mv\"></div></div></div></div><div class=\"note\"><b>Note:</b> Work with a partner. Take turns — both partners must speak, write, and be ready to be called on.</div><div class=\"sec-hd\"><h3>Task</h3></div><div class=\"q\"><div class=\"qn\">Question 1</div><div class=\"qt\">Tell your partner 3 things you plan to do after school today. For each, discuss: could this be Ibadah? What intention would make it count?</div></div><div class=\"q\"><div class=\"qn\">Question 2</div><div class=\"qt\">Quiz each other: Partner A says a category (قَوْل / عَمَل ظَاهِر / عَمَل بَاطِن). Partner B gives an example. Switch after each round — do 6 rounds total.</div></div>"}, {"id": "GRP3", "cat": "collab", "lesson": 3, "title": "Group Activity — L3: Q4 — Why Were You Created? (Al-'Ibadah)", "badge": "Small Group · L3", "points": null, "html": "<div class=\"sh-hdr\"><div class=\"sh-top\"><div class=\"sh-title\">Group Activity — Why Were You Created?</div><div class=\"sh-badge\">Small Group · L3</div></div><div class=\"sh-meta\"><div class=\"mf\"><div class=\"ml\">Group Members</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Date</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\"></div><div class=\"mv\"></div></div></div></div><div class=\"note\"><b>Note:</b> Groups of 3-4. Assign roles: Reader, Recorder, Reporter, Timekeeper. Every group presents for 60 seconds when done.</div><div class=\"sec-hd\"><h3>Task</h3></div><div class=\"q\"><div class=\"qn\">Question 1</div><div class=\"qt\">Build a T-chart titled \"Ibadah / Not Ibadah\" together. Your teacher will read out 10 scenarios. As a group, quickly decide which column each belongs in and why. Be ready to defend one answer to the class.</div></div><div class=\"note\"><b>Note:</b> Remember: the SAME action can be Ibadah or not, depending on the niyyah (intention) behind it.</div>"}, {"id": "OPEN4", "cat": "openers", "lesson": 4, "title": "Daily Opener — L4: Ash-Shirk — The Greatest Sin", "badge": "Bell Ringer + Warm-Up · L4", "points": null, "html": "<div class=\"sh-hdr\"><div class=\"sh-top\"><div class=\"sh-title\">Daily Opener — Ash-Shirk — The Greatest Sin</div><div class=\"sh-badge\">Bell Ringer + Warm-Up · L4</div></div><div class=\"sh-meta\"><div class=\"mf\"><div class=\"ml\">Name</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Date</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\"></div><div class=\"mv\"></div></div></div></div><div class=\"sec-hd\"><h3>🔔 Bell Ringer (3-5 min — books closed)</h3></div><div class=\"q\"><div class=\"qn\">Quick Recall</div><span class=\"qar\">لِأَيِّ شَيْءٍ خَلَقَكَ؟</span><div class=\"qt\">Answer Q4 and name the 3 categories of Ibadah.</div><div class=\"al\"></div></div><div class=\"sec-hd\"><h3>☀️ Warm-Up (connects to today)</h3></div><div class=\"q\"><div class=\"qn\">Think About It</div><div class=\"qt\">If worshipping Allah alone is your whole purpose (Q4) — what do you think happens when someone worships something ELSE instead? Today we learn the Imam's answer.</div><div class=\"al\"></div><div class=\"al\"></div></div>"}, {"id": "EXIT4", "cat": "openers", "lesson": 4, "title": "Exit Ticket — L4: Ash-Shirk — The Greatest Sin", "badge": "Exit Ticket · L4", "points": null, "html": "<div class=\"sh-hdr\"><div class=\"sh-top\"><div class=\"sh-title\">Exit Ticket — Ash-Shirk — The Greatest Sin</div><div class=\"sh-badge\">Exit Ticket · L4</div></div><div class=\"sh-meta\"><div class=\"mf\"><div class=\"ml\">Name</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Date</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\"></div><div class=\"mv\"></div></div></div></div><div class=\"sec-hd\"><h3>Before you leave...</h3></div><div class=\"q\"><div class=\"qn\">Question 1</div><div class=\"qt\">Write the Imam's definition of Shirk in Arabic (or as much as you remember).</div><span class=\"qar\">مَا الشِّرْكُ؟</span></div><div class=\"q\"><div class=\"qn\">Question 2</div><div class=\"qt\">Give ONE modern example of Shirk that is NOT a statue or an idol, and explain which of the 5 types it fits.</div></div><div class=\"q\"><div class=\"qn\">Question 3 — Self-Check</div><div class=\"qt\">Rate how confident you feel with today's lesson:</div><div class=\"mc\"><div class=\"mco\"><div class=\"bub\"></div>😄 I could teach this to someone else</div><div class=\"mco\"><div class=\"bub\"></div>🙂 I understand it well</div><div class=\"mco\"><div class=\"bub\"></div>🤔 I need a bit more practice</div><div class=\"mco\"><div class=\"bub\"></div>😕 I need to review this with my teacher</div></div></div>"}, {"id": "ORAL4", "cat": "oral", "lesson": 4, "title": "Oral Review Script — L4: Ash-Shirk — The Greatest Sin", "badge": "Teacher-Led Drill · L4", "points": null, "html": "<div class=\"sh-hdr\"><div class=\"sh-top\"><div class=\"sh-title\">Oral Review — Ash-Shirk — The Greatest Sin</div><div class=\"sh-badge\">Teacher-Led Drill · L4</div></div><div class=\"sh-meta\"><div class=\"mf\"><div class=\"ml\">Teacher</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Date</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Class</div><div class=\"mv\"></div></div></div></div><div class=\"note\"><b>Note:</b> Whole-class call-and-response. Say the prompt, point to a student (or the whole class), then reveal the expected answer. Move fast — this is retrieval practice, not re-teaching.</div><div class=\"sec-hd\"><h3>Call & Response</h3></div><div class=\"oral\"><div class=\"oral-row\"><div class=\"oral-n\">1</div><div class=\"oral-p\">What does the Imam call Shirk on page 10?</div><div class=\"oral-a\">أَعْظَمُ ذَنْبٍ عُصِيَ اللَّهُ بِهِ — the greatest sin</div></div><div class=\"oral-row\"><div class=\"oral-n\">2</div><div class=\"oral-p\">What is the key word نِدًّا?</div><div class=\"oral-a\">A rival — anything made equal to Allah in worship</div></div><div class=\"oral-row\"><div class=\"oral-n\">3</div><div class=\"oral-p\">Name the 5 types of Shirk in the Imam's definition.</div><div class=\"oral-a\">يَدْعُوهُ · يَرْجُوهُ · يَخَافُهُ · يَتَوَكَّلُ عَلَيْهِ · يَرْغَبُ إِلَيْهِ</div></div><div class=\"oral-row\"><div class=\"oral-n\">4</div><div class=\"oral-p\">What does Al-Ma'idah 5:72 say happens to a Mushrik?</div><div class=\"oral-a\">Jannah is forbidden to him and his abode is the Fire</div></div><div class=\"oral-row\"><div class=\"oral-n\">5</div><div class=\"oral-p\">What does Al-Mu'minun 23:117 call someone who invokes another god?</div><div class=\"oral-a\">كَافِرُون — disbelievers (Kufr, not merely Shirk)</div></div><div class=\"oral-row\"><div class=\"oral-n\">6</div><div class=\"oral-p\">What does Ghafir 40:60 promise?</div><div class=\"oral-a\">ادْعُونِي أَسْتَجِبْ لَكُمْ — Call upon Me, I will answer you</div></div><div class=\"oral-row\"><div class=\"oral-n\">7</div><div class=\"oral-p\">What does لَيَحْبَطَنَّ عَمَلُكَ mean, and who is it addressed to?</div><div class=\"oral-a\">\"Your work would become worthless\" — addressed even to the Prophet ﷺ</div></div><div class=\"oral-row\"><div class=\"oral-n\">8</div><div class=\"oral-p\">Name the 4 beliefs that are \"foundations of Iman saving from Kufr.\"</div><div class=\"oral-a\">al-Ba'th, an-Nashr, al-Jaza', al-Hisab — and Jannah/Fire are Haqq</div></div></div>"}, {"id": "VOCAB4", "cat": "vocab", "lesson": 4, "title": "Vocabulary & Flashcards — L4: Ash-Shirk — The Greatest Sin", "badge": "Arabic Terms · L4", "points": 8, "html": "<div class=\"sh-hdr\"><div class=\"sh-top\"><div class=\"sh-title\">Vocabulary Review — Ash-Shirk — The Greatest Sin</div><div class=\"sh-badge\">Arabic Terms · L4</div></div><div class=\"sh-meta\"><div class=\"mf\"><div class=\"ml\">Name</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Date</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Score</div><div class=\"mv\"></div></div></div></div><div class=\"sec-hd\"><h3>Flashcards — cut along the lines</h3></div><div class=\"fc-grid\"><div class=\"fc\"><div class=\"f class=\"sh-badge\">T/F Quick Check · L4</div></div><div class=\"sh-meta\"><div class=\"mf\"><div class=\"ml\">Name</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Date</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Score</div><div class=\"mv\"></div></div></div></div><div class=\"sec-hd\"><h3>Circle T or F for each statement</h3><span class=\"pts\">8 pts</span></div><div class=\"tf\"><div class=\"tfrow\"><div class=\"tfopt\"><span class=\"tfbub\">T</span><span class=\"tfbub\">F</span></div><div class=\"tftext\">1. The Imam says Shirk is one of the greatest sins, but not THE greatest.</div></div><div class=\"tfrow\"><div class=\"tfopt\"><span class=\"tfbub\">T</span><span class=\"tfbub\">F</span></div><div class=\"tftext\">2. Wearing a \"lucky bracelet\" and believing it protects you can be an example of Shirk.</div></div><div class=\"tfrow\"><div class=\"tfopt\"><span class=\"tfbub\">T</span><span class=\"tfbub\">F</span></div><div class=\"tftext\">3. Al-Jinn 72:18 says not to invoke anyone ALONG WITH Allah.</div></div><div class=\"tfrow\"><div class=\"tfopt\"><span class=\"tfbub\">T</span><span class=\"tfbub\">F</span></div><div class=\"tftext\">4. Az-Zumar 39:14 commands sincerity of worship even to the Prophet ﷺ himself.</div></div><div class=\"tfrow\"><div class=\"tfopt\"><span class=\"tfbub\">T</span><span class=\"tfbub\">F</span></div><div class=\"tftext\">5. The Imam's list of 5 types of Shirk is the complete, final list — nothing else counts.</div></div><div class=\"tfrow\"><div class=\"tfopt\"><span class=\"tfbub\">T</span><span class=\"tfbub\">F</span></div><div class=\"tftext\">6. Denying the Resurrection is described in Ar-Ra'd 13:5 as Kufr.</div></div><div class=\"tfrow\"><div class=\"tfopt\"><span class=\"tfbub\">T</span><span class=\"tfbub\">F</span></div><div class=\"tftext\">7. Allah's mercy is bigger than any sin, and sincere repentance is always accepted before death.</div></div><div class=\"tfrow\"><div class=\"tfopt\"><span class=\"tfbub\">T</span><span class=\"tfbub\">F</span></div><div class=\"tftext\">8. Ar-Ra'd 13:36 is a complete mission statement: worship alone, no partner, call to Him, return to Him.</div></div></div>"}, {"id": "WS4", "cat": "games", "lesson": 4, "title": "Word Search — L4: Ash-Shirk — The Greatest Sin", "badge": "Puzzle · L4", "points": null, "html": "<div class=\"sh-hdr\"><div class=\"sh-top\"><div class=\"sh-title\">Word Search — Ash-Shirk — The Greatest Sin</div><div class=\"sh-badge\">Puzzle · L4</div></div><div class=\"sh-meta\"><div class=\"mf\"><div class=\"ml\">Name</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Date</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Score</div><div class=\"mv\"></div></div></div></div><div class=\"sec-hd\"><h3>Find every term (transliterated)</h3></div><div class=\"ws-wrap\"><table class=\"ws\"><tr><td>R</td><td>X</td><td>X</td><td>R</td><td>Q</td><td>Z</td><td>T</td><td>H</td><td>P</td><td>H</td><td>I</td><td>N</td></tr><tr><td>P</td><td>A</td><td>M</td><td>Q</td><td>K</td><td>V</td><td>V</td><td>Z</td><td>M</td><td>X</td><td>F</td><td>O</td></tr><tr><td>E</td><td>T</td><td>A</td><td>R</td><td>A</td><td>M</td><td>S</td><td>S</td><td>V</td><td>A</td><td>C</td><td>U</td></tr><tr><td>N</td><td>H</td><td>E</td><td>O</td><td>F</td><td>B</td><td>I</td><td>M</td><td>K</td><td>G</td><td>O</td><td>K</td></tr><tr><td>K</td><td>Y</td><td>M</td><td>K</td><td>H</td><td>A</td><td>W</td><td>F</td><td>A</td><td>I</td><td>Y</td><td>N</td></tr><tr><td>I</td><td>C</td><td>P</td><td>A</td><td>X</td><td>R</td><td>B</td><td>U</td><td>L</td><td>H</td><td>U</td><td>C</td></tr><tr><td>R</td><td>A</td><td>J</td><td>A</td><td>Y</td><td>U</td><td>D</td><td>N</td><td>I</td><td>D</td><td>D</td><td>B</td></tr><tr><td>Y</td><td>A</td><td>H</td><td>G</td><td>T</td><td>A</td><td>W</td><td>A</td><td>K</td><td>K</td><td>U</td><td>L</td></tr><tr><td>A</td><td>B</td><td>A</td><td>T</td><td>H</td><td>T</td><td>E</td><td>S</td><td>H</td><td>I</td><td>R</td><td>K</td></tr><tr><td>H</td><td>E</td><td>P</td><td>V</td><td>D</td><td>S</td><td>G</td><td>O</td><td>W</td><td>I</td><td>Y</td><td>L</td></tr><tr><td>F</td><td>T</td><td>T</td><td>X</td><td>W</td><td>D</td><td>Y</td><td>F</td><td>J</td><td>D</td><td>S</td><td>A</td></tr><tr><td>J</td><td>S</td><td>V</td><td>M</td><td>M</td><td>W</td><td>G</td><td>C</td><td>S</td><td>W</td><td>U</td><td>H</td></tr></table><div class=\"wb\" style=\"margin-top:10px;\"><h4>L4 Terms — Word Bank</h4><div class=\"words\"><span class=\"word\">Shirk</span><span class=\"word\">Nidd</span><span class=\"word\">Du'a</span><span class=\"word\">Raja'</span><span class=\"word\">Khawf</span><span class=\"word\">Tawakkul</span><span class=\"word\">Ba'th</span><span class=\"word\">Haqq</span></div></div></div>"}, {"id": "UNSC4", "cat": "games", "lesson": 4, "title": "Unscramble — L4: Ash-Shirk — The Greatest Sin", "badge": "Puzzle · L4", "points": 8, "html": "<div class=\"sh-hdr\"><div class=\"sh-top\"><div class=\"sh-title\">Unscramble — Ash-Shirk — The Greatest Sin</div><div class=\"sh-badge\">Puzzle · L4</div></div><div class=\"sh-meta\"><div class=\"mf\"><div class=\"ml\">Name</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Date</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Score</div><div class=\"mv\"></div></div></div></div><div class=\"sec-hd\"><h3>Unscramble each term, then write it in Arabic</h3><span class=\"pts\">8 pts</span></div><div class=\"unsc\"><div class=\"unsc-row\"><div class=\"unsc-n\">1.</div><div class=\"unsc-scr\">H K R I S</div><div class=\"unsc-cl\">Associating a partner with Allah in worship <span class=\"qar\" style=\"font-size:1.1rem;\">شِرْك</span></div><div class=\"al\" style=\"flex:1;min-width:120px;\"></div></div><div class=\"unsc-row\"><div class=\"unsc-n\">2.</div><div class=\"unsc-scr\">D D I N</div><div class=\"unsc-cl\">A rival <span class=\"qar\" style=\"font-size:1.1rem;\">نِدّ</span></div><div class=\"al\" style=\"flex:1;min-width:120px;\"></div></div><div class=\"unsc-row\"><div class=\"unsc-n\">3.</div><div class=\"unsc-scr\">A U D</div><div class=\"unsc-cl\">Supplication / calling upon <span class=\"qar\" style=\"font-size:1.1rem;\">دُعَاء</span></div><div class=\"al\" style=\"flex:1;min-width:120px;\"></div></div><div class=\"unsc-row\"><div class=\"unsc-n\">4.</div><div class=\"unsc-scr\">A J A R</div><div class=\"unsc-cl\">Hope <span class=\"qar\" style=\"font-size:1.1rem;\">رَجَاء</span></div><div class=\"al\" style=\"flex:1;min-width:120px;\"></div></div><div class=\"unsc-row\"><div class=\"unsc-n\">5.</div><div class=\"unsc-scr\">F A H W K</div><div class=\"unsc-cl\">Fear <span class=\"qar\" style=\"font-size:1.1rem;\">خَوْف</span></div><div class=\"al\" style=\"flex:1;min-width:120px;\"></div></div><div class=\"unsc-row\"><div class=\"unsc-n\">6.</div><div class=\"unsc-scr\">T K U L K A A W</div><div class=\"unsc-cl\">Reliance / trust <span class=\"qar\" style=\"font-size:1.1rem;\">تَوَكُّل</span></div><div class=\"al\" style=\"flex:1;min-width:120px;\"></div></div><div class=\"unsc-row\"><div class=\"unsc-n\">7.</div><div class=\"unsc-scr\">B T A H</div><div class=\"unsc-cl\">Resurrection <span class=\"qar\" style=\"font-size:1.1rem;\">بَعْث</span></div><div class=\"al\" style=\"flex:1;min-width:120px;\"></div></div><div class=\"unsc-row\"><div class=\"unsc-n\">8.</div><div class=\"unsc-scr\">A Q H Q</div><div class=\"unsc-cl\">Real / true / certain <span class=\"qar\" style=\"font-size:1.1rem;\">حَقّ</span></div><div class=\"al\" style=\"flex:1;min-width:120px;\"></div></div></div>"}, {"id": "PAIR4", "cat": "collab", "lesson": 4, "title": "Partner Activity — L4: Ash-Shirk — The Greatest Sin", "badge": "Pair Work · L4", "points": null, "html": "<div class=\"sh-hdr\"><div class=\"sh-top\"><div class=\"sh-title\">Partner Activity — Ash-Shirk — The Greatest Sin</div><div class=\"sh-badge\">Pair Work · L4</div></div><div class=\"sh-meta\"><div class=\"mf\"><div class=\"ml\">Names</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Date</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\"></div><div class=\"mv\"></div></div></div></div><div class=\"note\"><b>Note:</b> Work with a partner. Take turns — both partners must speak, write, and be ready to be called on.</div><div class=\"sec-hd\"><h3>Task</h3></div><div class=\"q\"><div class=\"qn\">Question 1</div><div class=\"qt\">Partner A reads a scenario card (ask your teacher for the set). Partner B decides: Shirk or not Shirk, and which of the 5 types. Discuss any disagreement using the Imam's exact definition. Switch after 5 cards.</div></div><div class=\"q\"><div class=\"qn\">Question 2</div><div class=\"qt\">Together, write ONE sentence combining وَالشِّرْكُ أَعْظَمُ ذَنْبٍ and لَيَحْبَطَنَّ عَمَلُكَ that explains to a younger student why Shirk is so serious.</div></div><div class=\"als\"><div class=\"aline\"></div><div class=\"aline\"></div></div>"}, {"id": "GRP4", "cat": "collab", "lesson": 4, "title": "Group Activity — L4: Ash-Shirk — The Greatest Sin", "badge": "Small Group · L4", "points": null, "html": "<div class=\"sh-hdr\"><div class=\"sh-top\"><div class=\"sh-title\">Group Activity — Ash-Shirk — The Greatest Sin</div><div class=\"sh-badge\">Small Group · L4</div></div><div class=\"sh-meta\"><div class=\"mf\"><div class=\"ml\">Group Members</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Date</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\"></div><div class=\"mv\"></div></div></div></div><div class=\"note\"><b>Note:</b> Groups of 3-4. Assign roles: Reader, Recorder, Reporter, Timekeeper. Every group presents for 60 seconds when done.</div><div class=\"sec-hd\"><h3>Task</h3></div><div class=\"q\"><div class=\"qn\">Question 1</div><div class=\"qt\">As a group, design a \"Shirk Detector\" flowchart or checklist a Muslim could use to check their own actions: \"Am I calling on other than Allah? Am I hoping in it? Fearing it more than Allah? Relying on it? Desiring it above Allah?\" Present your flowchart to the class.</div></div>"}, {"id": "OPEN5", "cat": "openers", "lesson": 5, "title": "Daily Opener — L5: At-Taghut & Kufr bil-Taghut", "badge": "Bell Ringer + Warm-Up · L5", "points": null, "html": "<div class=\"sh-hdr\"><div class=\"sh-top\"><div class=\"sh-title\">Daily Opener — At-Taghut & Kufr bil-Taghut</div><div class=\"sh-badge\">Bell Ringer + Warm-Up · L5</div></div><div class=\"sh-meta\"><div class=\"mf\"><div class=\"ml\">Name</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Date</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\"></div><div class=\"mv\"></div></div></div></div><div class=\"sec-hd\"><h3>🔔 Bell Ringer (3-5 min — books closed)</h3></div><div class=\"q\"><div class=\"qn\">Quick Recall</div><span class=\"qar\">مَا الشِّرْكُ؟</span><div class=\"qt\">Name 3 of the 5 types of Shirk from last lesson.</div><div class=\"al\"></div></div><div class=\"sec-hd\"><h3>☀️ Warm-Up (connects to today)</h3></div><div class=\"q\"><div class=\"qn\">Think About It</div><div class=\"qt\">لَا إِلَهَ إِلَّا اللَّهُ has two halves: a NO and a YES. Which half do you think comes first, and why might the order matter?</div><div class=\"al\"></div><div class=\"al\"></div></div>"}, {"id": "EXIT5", "cat": "openers", "lesson": 5, "title": "Exit Ticket — L5: At-Taghut & Kufr bil-Taghut", "badge": "Exit Ticket · L5", "points": null, "html": "<div class=\"sh-hdr\"><div class=\"sh-top\"><div class=\"sh-title\">Exit Ticket — At-Taghut & Kufr bil-Taghut</div><div class=\"sh-badge\">Exit Ticket · L5</div></div><div class=\"sh-meta\"><div class=\"mf\"><div class=\"ml\">Name</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Date</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\"></div><div class=\"mv\"></div></div></div></div><div class=\"sec-hd\"><h3>Before you leave...</h3></div><div class=\"q\"><div class=\"qn\">Question 1</div><div class=\"qt\">Write the Imam's statement of the FIRST obligation upon Allah's servants.</div><span class=\"qar\">مَا الطَّاغُوت؟</span></div><div class=\"q\"><div class=\"qn\">Question 2</div><div class=\"qt\">Give ONE real-world example of something that has become a Taghut by going past its proper limit — and explain what the proper limit would have been.</div></div><div class=\"q\"><div class=\"qn\">Question 3 — Self-Check</div><div class=\"qt\">Rate how confident you feel with today's lesson:</div><div class=\"mc\"><div class=\"mco\"><div class=\"bub\"></div>😄 I could teach this to someone else</div><div class=\"mco\"><div class=\"bub\"></div>🙂 I understand it well</div><div class=\"mco\"><div class=\"bub\"></div>🤔 I need a bit more practice</div><div class=\"mco\"><div class=\"bub\"></div>😕 I need to review this with my teacher</div></div></div>"}, {"id": "ORAL5", "cat": "oral", "lesson": 5, "title": "Oral Review Script — L5: At-Taghut & Kufr bil-Taghut", "badge": "Teacher-Led Drill · L5", "points": null, "html": "<div class=\"sh-hdr\"><div class=\"sh-top\"><div class=\"sh-title\">Oral Review — At-Taghut & Kufr bil-Taghut</div><div class=\"sh-badge\">Teacher-Led Drill · L5</div></div><div class=\"sh-meta\"><div class=\"mf\"><div class=\"ml\">Teacher</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Date</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Class</div><div class=\"mv\"></div></div></div></div><div class=\"note\"><b>Note:</b> Whole-class call-and-response. Say the prompt, point to a student (or the whole class), then reveal the expected answer. Move fast — this is retrieval practice, not re-teaching.</div><div class=\"sec-hd\"><h3>Call & Response</h3></div><div class=\"oral\"><div class=\"oral-row\"><div class=\"oral-n\">1</div><div class=\"oral-p\">What is the FIRST obligation Allah placed on His servants?</div><div class=\"oral-a\">الْكُفْرُ بِالطَّاغُوتِ وَالإِيمَانُ بِاللَّهِ</div></div><div class=\"oral-row\"><div class=\"oral-n\">2</div><div class=\"oral-p\">What ayah proves every prophet carried this same message?</div><div class=\"oral-a\">An-Nahl 16:36</div></div><div class=\"oral-row\"><div class=\"oral-n\">3</div><div class=\"oral-p\">Name the 5 types in the Imam's own list of Taghut.</div><div class=\"oral-a\">Shaytan, soothsayers, astrologers, one who rules by other than what Allah revealed, one followed/obeyed without right</div></div><div class=\"oral-row\"><div class=\"oral-n\">4</div><div class=\"oral-p\">What are Ibn al-Qayyim's 3 categories?</div><div class=\"oral-a\">مَعْبُود (worshipped) · مَتْبُوع (followed) · مُطَاع (obeyed)</div></div><div class=\"oral-row\"><div class=\"oral-n\">5</div><div class=\"oral-p\">What does تَجَاوَزَ حَدَّهُ mean?</div><div class=\"oral-a\">Went beyond its proper limit</div></div><div class=\"oral-row\"><div class=\"oral-n\">6</div><div class=\"oral-p\">What does الْفِتْنَة mean in Al-Anfal 8:39?</div><div class=\"oral-a\">الشِّرْك — Shirk</div></div><div class=\"oral-row\"><div class=\"oral-n\">7</div><div class=\"oral-p\">What does لَا إِلَهَ map to, and what does إِلَّا اللَّهُ map to?</div><div class=\"oral-a\">لَا إِلَهَ = Kufr bil-Taghut (rejection); إِلَّا اللَّهُ = Iman billah (affirmation)</div></div></div>"}, {"id": "VOCAB5", "cat": "vocab", "lesson": 5, "title": "Vocabulary & Flashcards — L5: At-Taghut & Kufr bil-Taghut", "badge": "Arabic Terms · L5", "points": 6, "html": "<div class=\"sh-hdr\"><div class=\"sh-top\"><div class=\"sh-title\">Vocabulary Review — At-Taghut & Kufr bil-Taghut</div><div class=\"sh-badge\">Arabic Terms · L5</div></div><div class=\"sh-meta\"><div class=\"mf\"><div class=\"ml\">Name</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Date</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Score</div><div class=\"mv\"></div></div></div></div><div class=\"sec-hd\"><h3>Flashcards — cut along the lines</h3></div><div class=\"fc-grid\"><div class=\"fc\"><div class=\"fc-front\"><span class=\"qar\" style=\"font-size:1.6rem;\">طَاغُوت</span><div class=\"fc-tr\">Taghut</div></div><div class=\"fc-back\">Anything worshipped, followed, or obeyed beyond its proper limit</div></div><div class=\"fc\"><div class=\"fc-front\"><span class=\"qar\" style=\"font-size:1.6rem;\">كُفْر</span><div class=\"fc-tr\">Kufr</div></div><div class=\"fc-back\">Disbelief / rejection</div></div><div class=\"fc\"><div class=\"fc-front\"><span class=\"qar\" style=\"font-size:1.6rem;\">كَاهِن</span><div class=\"fc-tr\">Kahin</div></div><div class=\"fc-back\">A soothsayer / fortune-teller</div></div><div class=\"fc\"><div class=\"fc-front\"><span class=\"qar\" style=\"font-size:1.6rem;\">مُنَجِّم</span><div class=\"fc-tr\">Munajjim</div></div><div class=\"fc-back\">An astrologer</div></div><div class=\"fc\"><div class=\"fc-front\"><span class=\"qar\" style=\"font-size:1.6rem;\">فِتْنَة</span><div class=\"fc-tr\">Fitnah</div></div><div class=\"fc-back\">Trial / (here:) Shirk</div></div><div class=\"fc\"><div class=\"fc-front\"><span class=\"qar\" style=\"font-size:1.6rem;\">حَدّ</span><div class=\"fc-tr\">Hadd</div></div><div class=\"fc-back\">A limit / boundary</div></div></div><div class=\"sec-hd\"><h3>Quiz Yourself</h3><span class=\"pts\">6 pts</span></div><table class=\"tbl\"><thead><tr><th>Arabic</th><th>Transliteration</th><th>Meaning (cover and try to recall)</th></tr></thead><tbody><tr><td class=\"wc\">طَاغُوت</td><td class=\"wc\">Taghut</td><td class=\"wc\"></td></tr><tr><td class=\"wc\">كُفْر</td><td class=\"wc\">Kufr</td><td class=\"wc\"></td></tr><tr><td class=\"wc\">كَاهِن</td><td class=\"wc\">Kahin</td><td class=\"wc\"></td></tr><tr><td class=\"wc\">مُنَجِّم</td><td class=\"wc\">Munajjim</td><td class=\"wc\"></td></tr><tr><td class=\"wc\">فِتْنَة</td><td class=\"wc\">Fitnah</td><td class=\"wc\"></td></tr><tr><td class=\"wc\">حَدّ</td><td class=\"wc\">Hadd</td><td class=\"wc\"></td></tr></tbody></table>"}, {"id": "AYHD5", "cat": "vocab", "lesson": 5, "title": "Ayah & Hadith Review — L5: At-Taghut & Kufr bil-Taghut", "badge": "Recitation Practice · L5", "points": 6, "html": "<div class=\"sh-hdr\"><div class=\"sh-top\"><div class=\"sh-title\">Ayah & Hadith Review — At-Taghut & Kufr bil-Taghut</div><div class=\"sh-badge\">Recitation Practice · L5</div></div><div class=\"sh-meta\"><div class=\"mf\"><div class=\"ml\">Name</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Date</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Score</div><div class=\"mv\"></div></div></div></div><div class=\"sec-hd\"><h3>This Lesson's Ayahs (2)</h3><span class=\"pts\">10 pts</span></div><div class=\"q\"><div class=\"qn\">Ayah 1 — An-Nahl 16:36</div><span class=\"qar\">وَلَقَدْ بَعَثْنَا فِي كُلِّ أُمَّةٍ رَسُولًا أَنِ اعْبُدُوا اللَّهَ وَاجْتَنِبُوا الطَّاغُوتَ</span><div class=\"qt\">1. Copy the ayah above in your own handwriting: </div><div class=\"al\"></div><div class=\"qt\">2. Translate it in your own words: </div><div class=\"al\"></div><div class=\"qt\">3. What does this ayah prove or teach? </div><div class=\"al\"></div><div class=\"qt\">4. Fill in the missing word from memory: </div><div class=\"qt qar\">وَلَقَدْ بَعَثْنَا فِي كُلِّ أُمَّةٍ ______ أَنِ اعْبُدُوا اللَّهَ وَاجْتَنِبُوا الطَّاغُوتَ</div><div class=\"qt\">5. Why does this matter for how YOU live today? </div><div class=\"al\"></div></div><div class=\"q\"><div class=\"qn\">Ayah 2 — Al-Anfal 8:39</div><span class=\"qar\">وَقَاتِلُوهُمْ حَتَّى لَا تَكُونَ فِتْنَةٌ وَيَكُونَ الدِّينُ لِلَّهِ</span><div class=\"qt\">1. Copy the ayah above in your own handwriting: </div><div class=\"al\"></div><div class=\"qt\">2. Translate it in your own words: </div><div class=\"al\"></div><div class=\"qt\">3. What does this ayah prove or teach? </div><div class=\"al\"></div><div class=\"qt\">4. Fill in the missing word from memory: </div><div class=\"qt qar\">وَقَاتِلُوهُمْ حَتَّى لَا تَكُونَ ______ وَيَكُونَ الدِّينُ لِلَّهِ</div><div class=\"qt\">5. Why does this matter for how YOU live today? </div><div class=\"al\"></div></div>"}, {"id": "MATCH5", "cat": "games", "lesson": 5, "title": "Matching Activity — L5: At-Taghut & Kufr bil-Taghut", "badge": "Match the Terms · L5", "points": 6, "html": "<div class=\"sh-hdr\"><div class=\"sh-top\"><div class=\"sh-title\">Matching — At-Taghut & Kufr bil-Taghut</div><div class=\"sh-badge\">Match the Terms · L5</div></div><div class=\"sh-meta\"><div class=\"mf\"><div class=\"ml\">Name</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Date</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Score</div><div class=\"mv\"></div></div></div></div><div class=\"sec-hd\"><h3>Draw a line (or write the letter) to match each item</h3><span class=\"pts\">6 pts</span></div><div class=\"match-grid\"><div class=\"match-col\"><h4>Column A</h4><div class=\"mi\"><div class=\"mn\">1</div>طَاغُوت</div><div class=\"mi\"><div class=\"mn\">2</div>كُفْر</div><div class=\"mi\"><div class=\"mn\">3</div>كَاهِن</div><div class=\"mi\"><div class=\"mn\">4</div>مُنَجِّم</div><div class=\"mi\"><div class=\"mn\">5</div>فِتْنَة</div><div class=\"mi\"><div class=\"mn\">6</div>حَدّ</div></div><div class=\"match-col\"><h4>Column B</h4><div class=\"mi\"><div class=\"mlt\">A</div>A limit / boundary<div class=\"mblk\"></div></div><div class=\"mi\"><div class=\"mlt\">B</div>Disbelief / rejection<div class=\"mblk\"></div></div><div class=\"mi\"><div class=\"mlt\">C</div>Trial / (here:) Shirk<div class=\"mblk\"></div></div><div class=\"mi\"><div class=\"mlt\">D</div>A soothsayer<div class=\"mblk\"></div></div><div class=\"mi\"><div class=\"mlt\">E</div>Anything worshipped/followed/obeyed beyond its limit<div class=\"mblk\"></div></div><div class=\"mi\"><div class=\"mlt\">F</div>An astrologer<div class=\"mblk\"></div></div></div></div>"}, {"id": "TF5", "cat": "games", "lesson": 5, "title": "True/False — L5: At-Taghut & Kufr bil-Taghut", "badge": "T/F Quick Check · L5", "points": 8, "html": "<div class=\"sh-hdr\"><div class=\"sh-top\"><div class=\"sh-title\">True or False — At-Taghut & Kufr bil-Taghut</div><div class=\"sh-badge\">T/F Quick Check · L5</div></div><div class=\"sh-meta\"><div class=\"mf\"><div class=\"ml\">Name</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Date</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Score</div><div class=\"mv\"></div></div></div></div><div class=\"sec-hd\"><h3>Circle T or F for each statement</h3><span class=\"pts\">8 pts</span></div><div class=\"tf\"><div class=\"tfrow\"><div class=\"tfopt\"><span class=\"tfbub\">T</span><span class=\"tfbub\">F</span></div><div class=\"tftext\">1. The FIRST thing Allah obligated on His servants was learning to pray.</div></div><div class=\"tfrow\"><div class=\"tfopt\"><span class=\"tfbub\">T</span><span class=\"tfbub\">F</span></div><div class=\"tftext\">2. Obeying your parents is automatically Taghut.</div></div><div class=\"tfrow\"><div class=\"tfopt\"><span class=\"tfbub\">T</span><span class=\"tfbub\">F</span></div><div class=\"tftext\">3. Ibn al-Qayyim's definition of Taghut has 3 categories: worshipped, followed, obeyed.</div></div><div class=\"tfrow\"><div class=\"tfopt\"><span class=\"tfbub\">T</span><span class=\"tfbub\">F</span></div><div class=\"tftext\">4. An-Nahl 16:36 says every prophet's message was worship Allah AND avoid Taghut.</div></div><div class=\"tfrow\"><div class=\"tfopt\"><span class=\"tfbub\">T</span><span class=\"tfbub\">F</span></div><div class=\"tftext\">5. الفِتْنَة in Al-Anfal 8:39 means \"a natural disaster.\"</div></div><div class=\"tfrow\"><div class=\"tfopt\"><span class=\"tfbub\">T</span><span class=\"tfbub\">F</span></div><div class=\"tftext\">6. لَا إِلَهَ (the negation) comes before إِلَّا اللَّهُ (the affirmation) in the Shahadah.</div>
