lass=\"q\" style=\"display:flex;gap:10px;align-items:center;\"><div class=\"al\" style=\"width:36px;flex:none;height:32px;\"></div><div class=\"qt\">The Prophet ﷺ calls only to Tawhid in Makkah for ~10 years.</div></div><div class=\"q\" style=\"display:flex;gap:10px;align-items:center;\"><div class=\"al\" style=\"width:36px;flex:none;height:32px;\"></div><div class=\"qt\">Al-Mi'raj — the 5 prayers made obligatory directly.</div></div><div class=\"q\" style=\"display:flex;gap:10px;align-items:center;\"><div class=\"al\" style=\"width:36px;flex:none;height:32px;\"></div><div class=\"qt\">The Hijrah to Madinah.</div></div><div class=\"q\" style=\"display:flex;gap:10px;align-items:center;\"><div class=\"al\" style=\"width:36px;flex:none;height:32px;\"></div><div class=\"qt\">About 10 more years of striving (Jihad).</div></div><div class=\"q\" style=\"display:flex;gap:10px;align-items:center;\"><div class=\"al\" style=\"width:36px;flex:none;height:32px;\"></div><div class=\"qt\">People enter the religion of Allah in multitudes.</div></div><div class=\"q\" style=\"display:flex;gap:10px;align-items:center;\"><div class=\"al\" style=\"width:36px;flex:none;height:32px;\"></div><div class=\"qt\">The Prophet ﷺ passes away at age 63, the Deen complete.</div></div>"}];
// ══ CATEGORY DEFINITIONS ══
const CATEGORIES = [
  {id:'openers', label:'🔔 Daily Openers & Exit Tickets'},
  {id:'classwork', label:'📝 Classwork'},
  {id:'collab', label:'👥 Partner & Group'},
  {id:'oral', label:'🗣 Oral Review'},
  {id:'vocab', label:'🔤 Vocabulary, Ayah & Hadith'},
  {id:'games', label:'🧩 Puzzles & Games'},
  {id:'homework', label:'📚 Homework'},
  {id:'quiz', label:'✏️ Quizzes'},
  {id:'reviewpackets', label:'🔁 Review Packets'},
  {id:'test', label:'📋 Tests'},
  {id:'keys', label:'🗝 Answer Keys & Reference'},
];

let currentCat = CATEGORIES[0].id;
let searchTerm = '';
let lessonFilter = 'all';

function sheetsForCat(cat){
  return SHEETS.filter(s=>s.cat===cat);
}

function matchesFilters(s){
  if (lessonFilter!=='all' && String(s.lesson)!==lessonFilter) return false;
  if (searchTerm){
    const hay = (s.title+' '+s.badge+' '+s.html).toLowerCase();
    if (!hay.includes(searchTerm.toLowerCase())) return false;
  }
  return true;
}

function renderTabs(){
  const bar = document.getElementById('tabBar');
  bar.innerHTML = CATEGORIES.map(c=>{
    const count = sheetsForCat(c.id).length;
    return `<button class="tbtn ${c.id===currentCat?'active':''}" role="tab" aria-selected="${c.id===currentCat}"
      onclick="switchCat('${c.id}')">${c.label} <span style="opacity:.6;">(${count})</span></button>`;
  }).join('');
}

let activeSheetId = null;

function switchCat(cat){
  currentCat = cat;
  const sheets = sheetsForCat(cat).filter(matchesFilters);
  activeSheetId = sheets.length ? sheets[0].id : null;
  renderTabs();
  renderAssignBar();
  renderSheet();
}

function renderAssignBar(){
  const bar = document.getElementById('assignBar');
  const sheets = sheetsForCat(currentCat).filter(matchesFilters);
  if (!sheets.length){ bar.innerHTML=''; return; }
  bar.innerHTML = sheets.map(s=>`<button class="abtn ${s.id===activeSheetId?'active':''}" onclick="selectSheet('${s.id}')">${s.id.replace(/^([A-Z]+)(\d)/,'$1 $2')}</button>`).join('');
}

function selectSheet(id){
  activeSheetId = id;
  renderAssignBar();
  renderSheet();
}

function renderSheet(){
  const wrap = document.getElementById('sheetWrap');
  const sheets = sheetsForCat(currentCat).filter(matchesFilters);
  if (!sheets.length){
    wrap.innerHTML = '<div class="no-results">No sheets match your search/filter in this tab. Try clearing the search box or picking "All Lessons."</div>';
    return;
  }
  const s = sheets.find(x=>x.id===activeSheetId) || sheets[0];
  activeSheetId = s.id;
  wrap.innerHTML = `<div class="sheet active" id="sheet-${s.id}" data-cat="${s.cat}">${s.html}</div>`;
}

// ══ SEARCH / FILTER ══
function onSearch(v){
  searchTerm = v;
  renderTabs(); renderAssignBar(); renderSheet();
}
function setLessonFilter(v, btn){
  lessonFilter = v;
  document.querySelectorAll('.lfbtn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  renderTabs(); renderAssignBar(); renderSheet();
}

// ══ PRINT (fixed: page breaks now also inserted between categories) ══
function printCurrent(){
  const html = document.getElementById('sheetWrap').innerHTML;
  printHTML(html);
}
function printSection(){
  const sheets = sheetsForCat(currentCat).filter(matchesFilters);
  const html = sheets.map(s=>`<div class="sheet active print-page">${s.html}</div>`).join('');
  printHTML(html);
}
function printAll(){
  const html = SHEETS.map(s=>`<div class="sheet active print-page">${s.html}</div>`).join('');
  printHTML(html);
}
function printHTML(bodyHtml){
  const w = document.getElementById('printFrame').contentWindow;
  const styles = document.querySelectorAll('style,link[rel=stylesheet]');
  let styleHtml = '';
  styles.forEach(s=>styleHtml += s.outerHTML);
  w.document.open();
  w.document.write(`<!DOCTYPE html><html><head><meta charset="UTF-8">${styleHtml}
    <style>
      body{background:#fff;font-size:10.5pt;margin:0;padding:16px;}
      .print-page{page-break-after:always;}
      .print-page:last-child{page-break-after:auto;}
      .sheet{display:block!important;}
    </style></head><body>${bodyHtml}</body></html>`);
  w.document.close();
  setTimeout(()=>{ w.focus(); w.print(); }, 250);
}

// ══ INIT ══
document.addEventListener('DOMContentLoaded', function(){
  renderTabs();
  renderAssignBar();
  renderSheet();
});

</script>
