class=\"wc\"></td></tr></tbody></table><div class=\"sec-hd\"><h3>Key Hadiths from the Book</h3><span class=\"pts\">5 pts</span></div><table class=\"tbl\"><thead><tr><th>Hadith Collection & Number</th><th>Content / What it proves</th></tr></thead><tbody><tr><td class=\"wc\">Bukhari 4777 / Muslim 102</td><td class=\"wc\"></td></tr><tr><td class=\"wc\">Ahmad 18378 (authenticated)</td><td class=\"wc\"></td></tr><tr><td class=\"wc\">Sahih al-Bukhari (Abu Hurairah)</td><td class=\"wc\"></td></tr><tr><td class=\"wc\">Bukhari 2652 / Muslim 6635</td><td class=\"wc\"></td></tr><tr><td class=\"wc\">Sahih Muslim 7560</td><td class=\"wc\"></td></tr></tbody></table><div class=\"q\"><div class=\"qn\">Question 1</div><div class=\"qt\">Bonus enrichment (+1 pt): what surah and ayah is the class's tafakkur/contemplation verse, and what does يَسْبَحُونَ mean?</div></div><div class=\"als\"><div class=\"aline\"></div></div><div class=\"sc-box\"><div><div class=\"sc-lbl\">Score</div><input type=\"number\" class=\"sc-input\" min=\"0\" max=\"28\" placeholder=\"0\" aria-label=\"Enter earned score out of 28\" oninput=\"var p=this.value; var out=this.parentElement.querySelector('.sc-pct'); var g=this.closest('.sc-box').querySelector('.sc-grade'); if(p===''){out.textContent='';g.textContent='';return;} var pct=Math.round((p/28)*1000)/10; out.textContent=pct+'%'; g.textContent = pct>=90?'A':pct>=80?'B':pct>=70?'C':pct>=60?'D':'F';\"><div class=\"sc-pct\"></div></div><div><div class=\"sc-lbl\">Out of</div><div class=\"sc-val\">28</div></div><div><div class=\"sc-lbl\">Grade</div><div class=\"sc-val sc-grade\"></div></div><div><div class=\"sc-lbl\">Comments</div><div class=\"sc-val\" style=\"min-width:140px;\"></div></div></div>"}, {"id": "HW5", "cat": "homework", "lesson": 7, "title": "HW 5 — The Prophet ﷺ: Biography from the Book", "badge": "Homework · L7", "points": 25, "html": "<div class=\"sh-hdr\"><div class=\"sh-top\"><div class=\"sh-title\">HW 5 — The Prophet ﷺ: Biography from the Book</div><div class=\"sh-badge\">Homework · L7</div></div><div class=\"sh-meta\"><div class=\"mf\"><div class=\"ml\">Name</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Date</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Score</div><div class=\"mv\"></div></div></div></div><div class=\"sec-hd\"><h3>Part A — From the Imam's Exact Words (p.22-26)</h3><span class=\"pts\">18 pts</span></div><div class=\"q\"><div class=\"qn\">Question 1</div><div class=\"qt\">Full lineage from memory in Arabic AND English:</div></div><div class=\"qt\">Arabic:</div><div class=\"al\"></div><div class=\"qt\">English:</div><div class=\"al\"></div><div class=\"q\"><div class=\"qn\">Question 2</div><div class=\"qt\">Answer every question from the Imam's account:</div></div><table class=\"tbl\"><thead><tr><th>Question</th><th>Answer — exact from the book</th></tr></thead><tbody><tr><td class=\"wc\">He was chosen from which tribe?</td><td class=\"wc\"></td></tr><tr><td class=\"wc\">He is the elite of the children of whom?</td><td class=\"wc\"></td></tr><tr><td class=\"wc\">He was sent to \"al-ahmar wal-aswad\" — what does this mean?</td><td class=\"wc\"></td></tr><tr><td class=\"wc\">He called people TOWARD what (in Arabic)?</td><td class=\"wc\"></td></tr><tr><td class=\"wc\">He called people AWAY FROM what? (List all 6 the Imam names)</td><td class=\"wc\"></td></tr><tr><td class=\"wc\">Age at prophethood?</td><td class=\"wc\"></td></tr><tr><td class=\"wc\">How long calling in Makkah (Imam's exact phrase)?</td><td class=\"wc\"></td></tr><tr><td class=\"wc\">The 5 prayers were made obligatory HOW? (Imam's key phrase)</td><td class=\"wc\"></td></tr><tr><td class=\"wc\">How long of Jihad after Hijrah (Imam's phrase)?</td><td class=\"wc\"></td></tr><tr><td class=\"wc\">Age at passing / what was completed?</td><td class=\"wc\"></td></tr><tr><td class=\"wc\">First messenger (not prophet)?</td><td class=\"wc\"></td></tr><tr><td class=\"wc\">Proof for Seal of Prophets (Surah & Ayah)</td><td class=\"wc\"></td></tr></tbody></table><div class=\"sec-hd\"><h3>Part B — Reflection</h3><span class=\"pts\">7 pts</span></div><div class=\"q\"><div class=\"qn\">Question 3</div><div class=\"qt\">The Imam includes worshipping PROPHETS and THE RIGHTEOUS in the list of what the Prophet ﷺ called people away from. Most people would not expect this. Explain: Why is this in the list? What pattern from Islamic history does it relate to? How does knowing this protect YOU today?</div></div><div class=\"als\"><div class=\"aline\"></div><div class=\"aline\"></div><div class=\"aline\"></div><div class=\"aline\"></div></div><div class=\"sc-box\"><div><div class=\"sc-lbl\">Score</div><input type=\"number\" class=\"sc-input\" min=\"0\" max=\"25\" placeholder=\"0\" aria-label=\"Enter earned score out of 25\" oninput=\"var p=this.value; var out=this.parentElement.querySelector('.sc-pct'); var g=this.closest('.sc-box').querySelector('.sc-grade'); if(p===''){out.textContent='';g.textContent='';return;} var pct=Math.round((p/25)*1000)/10; out.textContent=pct+'%'; g.textContent = pct>=90?'A':pct>=80?'B':pct>=70?'C':pct>=60?'D':'F';\"><div class=\"sc-pct\"></div></div><div><div class=\"sc-lbl\">Out of</div><div class=\"sc-val\">25</div></div><div><div class=\"sc-lbl\">Grade</div><div class=\"sc-val sc-grade\"></div></div><div><div class=\"sc-lbl\">Comments</div><div class=\"sc-val\" style=\"min-width:140px;\"></div></div></div>"}, {"id": "HW6", "cat": "homework", "lesson": 8, "title": "HW 6 — Personal Statement: My Tawhid", "badge": "Homework · Final Unit", "points": 35, "html": "<div class=\"sh-hdr\"><div class=\"sh-top\"><div class=\"sh-title\">HW 6 — Personal Statement: My Tawhid</div><div class=\"sh-badge\">Homework · Final Unit</div></div><div class=\"sh-meta\"><div class=\"mf\"><div class=\"ml\">Name</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Date</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Score</div><div class=\"mv\"></div></div></div></div><div class=\"note\"><b>Note:</b> Prompt: A classmate who is not Muslim asks: \"How do you actually KNOW any of this is true? How do you know Allah exists, that Islam is the right religion, and that Muhammad ﷺ is really a prophet?\" Write a confident, evidence-based response using the Imam's book as your foundation. Minimum 6 sentences. At least 4 Quranic references. Your voice — proud, clear, grounded.</div><div class=\"sec-hd\"><h3>Planning: 3 Main Arguments</h3><span class=\"pts\">9 pts</span></div><table class=\"tbl\"><thead><tr><th>#</th><th>My argument (which Q from the book does this come from?)</th><th>Quranic evidence I'll use</th><th>From the book page</th></tr></thead><tbody><tr><td class=\"wc\">1</td><td class=\"wc\"></td><td class=\"wc\"></td><td class=\"wc\"></td></tr><tr><td class=\"wc\">2</td><td class=\"wc\"></td><td class=\"wc\"></td><td class=\"wc\"></td></tr><tr><td class=\"wc\">3</td><td class=\"wc\"></td><td class=\"wc\"></td><td class=\"wc\"></td></tr></tbody></table><div class=\"sec-hd\"><h3>My Full Response</h3><span class=\"pts\">26 pts</span></div><div class=\"als\"><div class=\"aline\"></div><div class=\"aline\"></div><div class=\"aline\"></div><div class=\"aline\"></div><div class=\"aline\"></div><div class=\"aline\"></div><div class=\"aline\"></div><div class=\"aline\"></div><div class=\"aline\"></div><div class=\"aline\"></div></div><div class=\"sc-box\"><div><div class=\"sc-lbl\">Score</div><input type=\"number\" class=\"sc-input\" min=\"0\" max=\"35\" placeholder=\"0\" aria-label=\"Enter earned score out of 35\" oninput=\"var p=this.value; var out=this.parentElement.querySelector('.sc-pct'); var g=this.closest('.sc-box').querySelector('.sc-grade'); if(p===''){out.textContent='';g.textContent='';return;} var pct=Math.round((p/35)*1000)/10; out.textContent=pct+'%'; g.textContent = pct>=90?'A':pct>=80?'B':pct>=70?'C':pct>=60?'D':'F';\"><div class=\"sc-pct\"></div></div><div><div class=\"sc-lbl\">Out of</div><div class=\"sc-val\">35</div></div><div><div class=\"sc-lbl\">Grade</div><div class=\"sc-val sc-grade\"></div></div><div><div class=\"sc-lbl\">Comments</div><div class=\"sc-val\" style=\"min-width:140px;\"></div></div></div>"}, {"id": "QZ1", "cat": "quiz", "lesson": 2, "title": "Quiz 1 — Q1, Q2 & Q3: Rabb, Signs & Creation", "badge": "Quiz · 40 Points", "points": 40, "html": "<div class=\"sh-hdr\"><div class=\"sh-top\"><div class=\"sh-title\">Quiz 1 — Q1, Q2 & Q3: Rabb, Signs & Creation</div><div class=\"sh-badge\">Quiz · 40 Points</div></div><div class=\"sh-meta\"><div class=\"mf\"><div class=\"ml\">Name</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Date</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Score ___/40</div><div class=\"mv\"></div></div></div></div><div class=\"sec-hd\"><h3>Section 1 — Arabic Recall (No Notes)</h3><span class=\"pts\">14 pts</span></div><div class=\"q\"><div class=\"qn\">Question 1</div><div class=\"qt\">Write the full Arabic Q&A for Question 1, exactly as the Imam wrote it:</div></div><div class=\"qt\">Question: ______ Answer: ______</div><div class=\"q\"><div class=\"qn\">Question 2</div><div class=\"qt\">Write all 6 Arabic terms that define ar-Rabb (1 pt each):</div></div><div class=\"als\"><div class=\"aline\"></div></div><div class=\"q\"><div class=\"qn\">Question 3</div><div class=\"qt\">Write the full Arabic answer to Q3, including the 4 Signs and all of Creation:</div></div><div class=\"als\"><div class=\"aline\"></div></div><div class=\"q\"><div class=\"qn\">Question 4</div><div class=\"qt\">Write the Imam's definition of the name \"Allah\" in Arabic (p.8):</div></div><div class=\"als\"><div class=\"aline\"></div></div><div class=\"sec-hd\"><h3>Section 2 — Multiple Choice</h3><span class=\"pts\">10 pts</span></div><div class=\"q\"><div class=\"qn\">Question 5</div><div class=\"qt\">The Imam uses ONE ayah as proof for THREE questions (Q1, Q2, Q3). Which ayah?</div></div><div class=\"mc\"><div class=\"mco\"><div class=\"bub\"></div><b>A.</b>&nbsp;Adh-Dhariyat 51:56</div><div class=\"mco\"><div class=\"bub\"></div><b>B.</b>&nbsp;Al-A'raf 7:54</div><div class=\"mco\"><div class=\"bub\"></div><b>C.</b>&nbsp;Al-Ahzab 33:40</div><div class=\"mco\"><div class=\"bub\"></div><b>D.</b>&nbsp;An-Nahl 16:36</div></div><div class=\"q\"><div class=\"qn\">Question 6</div><div class=\"qt\">The phrase أَلَا لَهُ الْخَلْقُ وَالْأَمْر means:</div></div><div class=\"mc\"><div class=\"mco\"><div class=\"bub\"></div><b>A.</b>&nbsp;\"He is the Lord of all worlds\"</div><div class=\"mco\"><div class=\"bub\"></div><b>B.</b>&nbsp;\"Unquestionably, His is the creation AND the command\"</div><div class=\"mco\"><div class=\"bub\"></div><b>C.</b>&nbsp;\"He created the heavens and earth\"</div><div class=\"mco\"><div class=\"bub\"></div><b>D.</b>&nbsp;\"The night pursues the day rapidly\"</div></div><div class=\"q\"><div class=\"qn\">Question 7</div><div class=\"qt\">According to the Imam, the correct meaning of La ilaha illa Allah is:</div></div><div class=\"mc\"><div class=\"mco\"><div class=\"bub\"></div><b>A.</b>&nbsp;\"There is no god but Allah\"</div><div class=\"mco\"><div class=\"bub\"></div><b>B.</b>&nbsp;\"There is no creator but Allah\"</div><div class=\"mco\"><div class=\"bub\"></div><b>C.</b>&nbsp;\"There is no deity TRULY DESERVING worship (حَقّ) except Allah\"</div><div class=\"mco\"><div class=\"bub\"></div><b>D.</b>&nbsp;\"Allah is the only powerful one\"</div></div><div class=\"q\"><div class=\"qn\">Question 8</div><div class=\"qt\">The Fitrah hadith is narrated by whom, in which collection?</div></div><div class=\"mc\"><div class=\"mco\"><div class=\"bub\"></div><b>A.</b>&nbsp;Umar ibn al-Khattab — Sahih Muslim</div><div class=\"mco\"><div class=\"bub\"></div><b>B.</b>&nbsp;Abu Hurairah — Sahih al-Bukhari</div><div class=\"mco\"><div class=\"bub\"></div><b>C.</b>&nbsp;Ibn Abbas — at-Tirmidhi</div><div class=\"mco\"><div class=\"bub\"></div><b>D.</b>&nbsp;Jundub ibn Abdillah — Ibn Majah</div></div><div class=\"q\"><div class=\"qn\">Question 9</div><div class=\"qt\">The Imam says the name \"Allah\" has NO:</div></div><div class=\"mc\"><div class=\"mco\"><div class=\"bub\"></div><b>A.</b>&nbsp;Meaning in Arabic</div><div class=\"mco\"><div class=\"bub\"></div><b>B.</b>&nbsp;Plural form AND no feminine form — it stands completely alone</div><div class=\"mco\"><div class=\"bub\"></div><b>C.</b>&nbsp;Connection to worship</div><div class=\"mco\"><div class=\"bub\"></div><b>D.</b>&nbsp;Use in the Quran</div></div><div class=\"sec-hd\"><h3>Section 3 — Short Answer</h3><span class=\"pts\">12 pts</span></div><div class=\"q\"><div class=\"qn\">Question 10</div><div class=\"qt\">A student says: \"al-Malik and al-Ma'bud are basically the same thing.\" The Imam lists them separately. Explain why they are DISTINCT yet CONNECTED — and why one REQUIRES the other:</div></div><div class=\"als\"><div class=\"aline\"></div><div class=\"aline\"></div></div><div class=\"q\"><div class=\"qn\">Question 11</div><div class=\"qt\">Explain the difference between a Sign (āyah) and Creation (makhluq) using the Imam's exact categories from page 8-9. Give one personal example of each from your own observation this week:</div></div><div class=\"als\"><div class=\"aline\"></div><div class=\"aline\"></div></div><div class=\"sec-hd\"><h3>Bonus</h3></div><div class=\"q\"><div class=\"qn\">Question Bonus</div><div class=\"qt\">Write the full text of Al-A'raf 7:54 in Arabic from memory (+5 pts):</div></div><div class=\"als\"><div class=\"aline\"></div><div class=\"aline\"></div></div><div class=\"sc-box\"><div><div class=\"sc-lbl\">Score</div><input type=\"number\" class=\"sc-input\" min=\"0\" max=\"40\" placeholder=\"0\" aria-label=\"Enter earned score out of 40\" oninput=\"var p=this.value; var out=this.parentElement.querySelector('.sc-pct'); var g=this.closest('.sc-box').querySelector('.sc-grade'); if(p===''){out.textContent='';g.textContent='';return;} var pct=Math.round((p/40)*1000)/10; out.textContent=pct+'%'; g.textContent = pct>=90?'A':pct>=80?'B':pct>=70?'C':pct>=60?'D':'F';\"><div class=\"sc-pct\"></div></div><div><div class=\"sc-lbl\">Out of</div><div class=\"sc-val\">40</div></div><div><div class=\"sc-lbl\">Grade</div><div class=\"sc-val sc-grade\"></div></div><div><div class=\"sc-lbl\">Comments</div><div class=\"sc-val\" style=\"min-width:140px;\"></div></div></div>"}, {"id": "QZ2", "cat": "quiz", "lesson": 4, "title": "Quiz 2 — Q4: Purpose, Ibadah, Shirk & Du'a", "badge": "Quiz · 45 Points", "points": 45, "html": "<div class=\"sh-hdr\"><div class=\"sh-top\"><div class=\"sh-title\">Quiz 2 — Q4: Purpose, Ibadah, Shirk & Du'a</div><div class=\"sh-badge\">Quiz · 45 Points</div></div><div class=\"sh-meta\"><div class=\"mf\"><div class=\"ml\">Name</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Date</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Score ___/45</div><div class=\"mv\"></div></div></div></div><div class=\"sec-hd\"><h3>Section 1 — Arabic Recall</h3><span class=\"pts\">10 pts</span></div><div class=\"q\"><div class=\"qn\">Question 1</div><div class=\"qt\">Write Q4's full Arabic answer (from p.9-10) and both Quranic proofs:</div></div><div class=\"qt\">Answer:</div><div class=\"al\"></div><div class=\"qt\">Proof 1: ______ · Proof 2: ______</div><div class=\"q\"><div class=\"qn\">Question 2</div><div class=\"qt\">Write the Imam's full Arabic definition of Shirk (p.11-12):</div></div><span class=\"qar\">وَالشِّرْكُ: أَنْ يَجْعَلَ لِلَّهِ ______ يَدْعُوهُ، أَوْ ______، أَوْ ______، أَوْ ______، أَوْ ______ مِنْ دُونِ اللَّهِ، وَغَيْرُ ذَلِكَ مِنْ أَنْوَاعِ الْعِبَادَاتِ</span><div class=\"sec-hd\"><h3>Section 2 — Ibadah: Matching & Application</h3><span class=\"pts\">12 pts</span></div><div class=\"note\"><b>Reminder:</b> The Imam's definition of Ibadah has THREE categories (not four) — statements are one category on their own, and only actions split into inward/outward.</div><div class=\"q\"><div class=\"qn\">Question 3</div><div class=\"qt\">Match each of the Imam's 3 categories of Ibadah to its examples:</div></div><div class=\"match-grid\"><div class=\"match-col\"><h4>Column A</h4><div class=\"mi\"><div class=\"mn\">1</div>أَقْوَال — Statements</div><div class=\"mi\"><div class=\"mn\">2</div>أَعْمَال ظَاهِرَة — Outward Actions</div><div class=\"mi\"><div class=\"mn\">3</div>أَعْمَال بَاطِنَة — Inward Actions</div></div><div class=\"match-col\"><h4>Column B</h4><div class=\"mi\"><div class=\"mlt\">A</div>Love of Allah, tawakkul, fear of Allah<div class=\"mblk\"></div></div><div class=\"mi\"><div class=\"mlt\">B</div>Saying Bismillah, du'a, speaking the truth<div class=\"mblk\"></div></div><div class=\"mi\"><div class=\"mlt\">C</div>Fasting, salah, giving sadaqah<div class=\"mblk\"></div></div></div></div><div class=\"q\"><div class=\"qn\">Question 4</div><div class=\"qt\">Apply: for each scenario, state whether it is Ibadah (Y/N), which category, and WHY:</div></div><table class=\"tbl\"><thead><tr><th>Scenario</th><th>Ibadah? Y/N</th><th>Category</th><th>Why / Why not</th></tr></thead><tbody><tr><td class=\"wc\">Studying hard because you want to please Allah and serve your family</td><td class=\"wc\"></td><td class=\"wc\"></td><td class=\"wc\"></td></tr><tr><td class=\"wc\">Helping a classmate but hoping they'll owe you a favor</td><td class=\"wc\"></td><td class=\"wc\"></td><td class=\"wc\"></td></tr><tr><td class=\"wc\">Feeling deep love for Allah while walking to school</td><td class=\"wc\"></td><td class=\"wc\"></td><td class=\"wc\"></td></tr><tr><td class=\"wc\">Saying Alhamdulillah after eating with awareness of ar-Raziq</td><td class=\"wc\"></td><td class=\"wc\"></td><td class=\"wc\"></td></tr></tbody></table><div class=\"sec-hd\"><h3>Section 3 — Du'a Proofs & Shirk Scenarios</h3><span class=\"pts\">13 pts</span></div><div class=\"q\"><div class=\"qn\">Question 5</div><div class=\"qt\">The Imam brings 5 ayahs about sincerity of worship and Du'a. For 3 of them, write the reference, the key phrase, and one sentence on what it proves:</div></div><table class=\"tbl\"><thead><tr><th>Reference</th><th>Key Arabic phrase</th><th>What it proves</th></tr></thead><tbody><tr><td class=\"wc\"></td><td class=\"wc\"></td><td class=\"wc\"></td></tr><tr><td class=\"wc\"></td><td class=\"wc\"></td><td class=\"wc\"></td></tr><tr><td class=\"wc\"></td><td class=\"wc\"></td><td class=\"wc\"></td></tr></tbody></table><div class=\"q\"><div class=\"qn\">Question 6</div><div class=\"qt\">For each scenario: Is it Shirk? Which of the 5 types from the Imam's definition applies? What is the Islamic alternative?</div></div><table class=\"tbl\"><thead><tr><th>Scenario</th><th>Shirk? Y/N</th><th>Type (from Imam's list)</th><th>Islamic alternative</th></tr></thead><tbody><tr><td class=\"wc\">Wearing a bracelet believing it protects from evil eye</td><td class=\"wc\"></td><td class=\"wc\"></td><td class=\"wc\"></td></tr><tr><td class=\"wc\">Checking horoscope daily to plan your day</td><td class=\"wc\"></td><td class=\"wc\"></td><td class=\"wc\"></td></tr><tr><td class=\"wc\">Making du'a to a deceased scholar at their grave</td><td class=\"wc\"></td><td class=\"wc\"></td><td class=\"wc\"></td></tr><tr><td class=\"wc\">Fearing Allah's displeasure and avoiding a sin</td><td class=\"wc\"></td><td class=\"wc\"></td><td class=\"wc\"></td></tr><tr><td class=\"wc\">Trusting a \"lucky shirt\" to help you win</td><td class=\"wc\"></td><td class=\"wc\"></td><td class=\"wc\"></td></tr></tbody></table><div class=\"sec-hd\"><h3>Section 4 — Essay</h3><span class=\"pts\">10 pts</span></div><div class=\"q\"><div class=\"qn\">Question 7</div><div class=\"qt\">The Imam says وَالشِّرْكُ أَعْظَمُ ذَنْبٍ عُصِيَ اللَّهُ بِهِ (p.10) AND لَيَحْبَطَنَّ عَمَلُكَ (Az-Zumar 64-66). Explain the full weight of these two statements. Why does Shirk hold this rank? What does it mean that it nullifies ALL deeds? How does this make Tawhid the most urgent matter for a Muslim?</div></div><div class=\"als\"><div class=\"aline\"></div><div class=\"aline\"></div><div class=\"aline\"></div><div class=\"aline\"></div><div class=\"aline\"></div></div><div class=\"sc-box\"><div><div class=\"sc-lbl\">Score</div><input type=\"number\" class=\"sc-input\" min=\"0\" max=\"45\" placeholder=\"0\" aria-label=\"Enter earned score out of 45\" oninput=\"var p=this.value; var out=this.parentElement.querySelector('.sc-pct'); var g=this.closest('.sc-box').querySelector('.sc-grade'); if(p===''){out.textContent='';g.textContent='';return;} var pct=Math.round((p/45)*1000)/10; out.textContent=pct+'%'; g.textContent = pct>=90?'A':pct>=80?'B':pct>=70?'C':pct>=60?'D':'F';\"><div class=\"sc-pct\"></div></div><div><div class=\"sc-lbl\">Out of</div><div class=\"sc-val\">45</div></div><div><div class=\"sc-lbl\">Grade</div><div class=\"sc-val sc-grade\"></div></div><div><div class=\"sc-lbl\">Comments</div><div class=\"sc-val\" style=\"min-width:140px;\"></div></div></div>"}, {"id": "QZ3", "cat": "quiz", "lesson": 6, "title": "Quiz 3 — Taghut, Q5: Islam, Pillars & Iman", "badge": "Quiz · 50 Points", "points": 50, "html": "<div class=\"sh-hdr\"><div class=\"sh-top\"><div class=\"sh-title\">Quiz 3 — Taghut, Q5: Islam, Pillars & Iman</div><div class=\"sh-badge\">Quiz · 50 Points</div></div><div class=\"sh-meta\"><div class=\"mf\"><div class=\"ml\">Name</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Date</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Score ___/50</div><div class=\"mv\"></div></div></div></div><div class=\"sec-hd\"><h3>Section 1 — Taghut: Arabic Recall</h3><span class=\"pts\">12 pts</span></div><div class=\"q\"><div class=\"qn\">Question 1</div><div class=\"qt\">Write the Imam's statement of the FIRST OBLIGATION (p.14) in Arabic and English:</div></div><div class=\"qt\">English:</div><div class=\"al\"></div><div class=\"q\"><div class=\"qn\">Question 2</div><div class=\"qt\">Ibn al-Qayyim's definition (quoted by the Imam): الطَّاغُوتُ: مَا تَجَاوَزَ بِهِ الْعَبْدُ حَدَّهُ مِنْ ______ أَوْ ______ أَوْ ______. Explain what \"تَجَاوَزَ حَدَّهُ\" means and give one example of each of the three categories:</div></div><div class=\"als\"><div class=\"aline\"></div><div class=\"aline\"></div></div><div class=\"q\"><div class=\"qn\">Question 3</div><div class=\"qt\">Write An-Nahl 16:36 and explain: what are the TWO parts of every prophet's message? How do these map to La ilaha illa Allah?</div></div><div class=\"qt\">Two parts: (1) ______ = لَا إِلَهَ · (2) ______ = إِلَّا اللَّه</div><div class=\"sec-hd\"><h3>Section 2 — Q5: Islam Full Definition</h3><span class=\"pts\">14 pts</span></div><div class=\"q\"><div class=\"qn\">Question 4</div><div class=\"qt\">Write Q5's Arabic answer AND the Imam's full 4-component definition with Arabic terms. Then explain component 4 (مُعَادَاةُ الْمُشْرِكِينَ) — why is it \"enmity toward SHIRK\" not toward people?</div></div><div class=\"qt\">Answer:</div><div class=\"al\"></div><div class=\"qt\">4 components (Arabic): (1) ______ (2) ______ (3) ______ (4) ______</div><div class=\"qt\">Explanation of component 4:</div><div class=\"al\"></div><div class=\"q\"><div class=\"qn\">Question 5</div><div class=\"qt\">The Imam brings TWO ayahs proving Islam is THE religion of Allah — write both references and explain why he needed both:</div></div><div class=\"als\"><div class=\"aline\"></div><div class=\"aline\"></div></div><div class=\"q\"><div class=\"qn\">Question 6</div><div class=\"qt\">The Imam uses Ibrahim's statement (Az-Zukhruf 43:26-28) to prove the meaning of La ilaha illa Allah. What are the TWO parts of Ibrahim's declaration and how do they show the structure of the Shahadah?</div></div><div class=\"als\"><div class=\"aline\"></div><div class=\"aline\"></div></div><div class=\"sec-hd\"><h3>Section 3 — 5 Pillars & 6 Pillars of Iman</h3><span class=\"pts\">14 pts</span></div><div class=\"q\"><div class=\"qn\">Question 7</div><div class=\"qt\">Fill in the 5 Pillars with Arabic names and Quranic proofs from the book:</div></div><table class=\"tbl\"><thead><tr><th>#</th><th>Arabic name</th><th>Proof (Surah & Ayah)</th><th>Special note from the Imam</th></tr></thead><tbody><tr><td class=\"wc\">1</td><td class=\"wc\"></td><td class=\"wc\"></td><td class=\"wc\">Hadith: Bukhari 4777 / Muslim 102</td></tr><tr><td class=\"wc\">2</td><td class=\"wc\"></td><td class=\"wc\"></td><td class=\"wc\">Made obligatory on Al-Mi'raj مِنْ غَيْرِ وَاسِطَة</td></tr><tr><td class=\"wc\">3</td><td class=\"wc\"></td><td class=\"wc\"></td><td class=\"wc\">Same ayah as Salah — Al-Bayyinah 98:5</td></tr><tr><td class=\"wc\">4</td><td class=\"wc\"></td><td class=\"wc\"></td><td class=\"wc\"></td></tr><tr><td class=\"wc\">5</td><td class=\"wc\"></td><td class=\"wc\"></td><td class=\"wc\">إِنِ اسْتَطَعْتَ إِلَيْهِ سَبِيلاً</td></tr></tbody></table><div class=\"q\"><div class=\"qn\">Question 8</div><div class=\"qt\">Write all 6 Pillars of Iman in Arabic. Then explain the Imam's exact phrase for al-Qadar and why BOTH خَيْر and شَرّ must be included:</div></div><div class=\"als\"><div class=\"aline\"></div></div><div class=\"qt\">Why خَيْرِهِ وَشَرِّهِ must BOTH be believed:</div><div class=\"al\"></div><div class=\"sec-hd\"><h3>Section 4 — Short Essay</h3><span class=\"pts\">10 pts</span></div><div class=\"q\"><div class=\"qn\">Question 9</div><div class=\"qt\">The Imam states (p.14): وَمِنْ أُصُولِ الإِيمَانِ الْمُنْجِي مِنَ الْكُفْرِ — and lists specific beliefs including resurrection, reckoning, Jannah and Fire as HAQQ. He also quotes Ar-Ra'd 13:5. Explain: What does it mean for Jannah and the Fire to be \"haqq\" (real)? What does denial of resurrection lead to? How does belief in the Last Day change how a Muslim lives TODAY?</div></div><div class=\"als\"><div class=\"aline\"></div><div class=\"aline\"></div><div class=\"aline\"></div><div class=\"aline\"></div><div class=\"aline\"></div></div><div class=\"sc-box\"><div><div class=\"sc-lbl\">Score</div><input type=\"number\" class=\"sc-input\" min=\"0\" max=\"50\" placeholder=\"0\" aria-label=\"Enter earned score out of 50\" oninput=\"var p=this.value; var out=this.parentElement.querySelector('.sc-pct'); var g=this.closest('.sc-box').querySelector('.sc-grade'); if(p===''){out.textContent='';g.textContent='';return;} var pct=Math.round((p/50)*1000)/10; out.textContent=pct+'%'; g.textContent = pct>=90?'A':pct>=80?'B':pct>=70?'C':pct>=60?'D':'F';\"><div class=\"sc-pct\"></div></div><div><div class=\"sc-lbl\">Out of</div><div class=\"sc-val\">50</div></div><div><div class=\"sc-lbl\">Grade</div><div class=\"sc-val sc-grade\"></div></div><div><div class=\"sc-lbl\">Comments</div><div class=\"sc-val\" style=\"min-width:140px;\"></div></div></div>"}, {"id": "QZ4", "cat": "quiz", "lesson": 7, "title": "Quiz 4 — Q6: The Prophet ﷺ, Caliphs & Full Review", "badge": "Quiz · 50 Points", "points": 50, "html": "<div class=\"sh-hdr\"><div class=\"sh-top\"><div class=\"sh-title\">Quiz 4 — Q6: The Prophet ﷺ, Caliphs & Full Review</div><div class=\"sh-badge\">Quiz · 50 Points</div></div><div class=\"sh-meta\"><div class=\"mf\"><div class=\"ml\">Name</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Date</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Score ___/50</div><div class=\"mv\"></div></div></div></div><div class=\"sec-hd\"><h3>Section 1 — Q6: Full Arabic Answer & Timeline</h3><span class=\"pts\">14 pts</span></div><div class=\"q\"><div class=\"qn\">Question 1</div><div class=\"qt\">Write the full lineage exactly as the Imam wrote it (p.22):</div></div><div class=\"als\"><div class=\"aline\"></div></div><div class=\"q\"><div class=\"qn\">Question 2</div><div class=\"qt\">From the Imam's account (p.22-25), complete the timeline with his EXACT phrases:</div></div><table class=\"tbl\"><thead><tr><th>Event</th><th>Age / Duration (Imam's exact Arabic phrase)</th></tr></thead><tbody><tr><td class=\"wc\">Prophethood began</td><td class=\"wc\"></td></tr><tr><td class=\"wc\">Calling in Makkah</td><td class=\"wc\"></td></tr><tr><td class=\"wc\">Al-Mi'raj — prayers made obligatory</td><td class=\"wc\"></td></tr><tr><td class=\"wc\">After Hijrah — Jihad</td><td class=\"wc\"></td></tr><tr><td class=\"wc\">Passed away / Deen completed</td><td class=\"wc\"></td></tr></tbody></table><div class=\"qt\">The Imam says about Al-Mi'raj: مِنْ غَيْرِ وَاسِطَةٍ بَيْنَهُ وَبَيْنَ اللَّهِ. What does this mean and why is it significant?</div><div class=\"als\"><div class=\"aline\"></div><div class=\"aline\"></div></div><div class=\"sec-hd\"><h3>Section 2 — Multiple Choice</h3><span class=\"pts\">10 pts</span></div><div class=\"q\"><div class=\"qn\">Question 3</div><div class=\"qt\">The Imam says: وَأَوَّلُ الرُّسُلِ — the first messenger was:</div></div><div class=\"mc\"><div class=\"mco\"><div class=\"bub\"></div><b>A.</b>&nbsp;Adam ﷺ</div><div class=\"mco\"><div class=\"bub\"></div><b>B.</b>&nbsp;Ibrahim ﷺ</div><div class=\"mco\"><div class=\"bub\"></div><b>C.</b>&nbsp;Nuh ﷺ — proven by An-Nisa 4:163</div><div class=\"mco\"><div class=\"bub\"></div><b>D.</b>&nbsp;Musa ﷺ</div></div><div class=\"q\"><div class=\"qn\">Question 4</div><div class=\"qt\">The Imam's statement: وَأَفْضَلُ الرُّسُلِ means:</div></div><div class=\"mc\"><div class=\"mco\"><div class=\"bub\"></div><b>A.</b>&nbsp;The most knowledgeable messenger is Muhammad ﷺ</div><div class=\"mco\"><div class=\"bub\"></div><b>B.</b>&nbsp;The best of the messengers is our Prophet ﷺ</div><div class=\"mco\"><div class=\"bub\"></div><b>C.</b>&nbsp;The last messenger is superior to all humans</div><div class=\"mco\"><div class=\"bub\"></div><b>D.</b>&nbsp;The seal of the prophets is the most beloved</div></div><div class=\"q\"><div class=\"qn\">Question 5</div><div class=\"qt\">The Imam's list of things the Prophet ﷺ called people AWAY from includes — surprisingly — worshipping:</div></div><div class=\"mc\"><div class=\"mco\"><div class=\"bub\"></div><b>A.</b>&nbsp;Only idols and stones</div><div class=\"mco\"><div class=\"bub\"></div><b>B.</b>&nbsp;Idols, stones, trees, prophets, the righteous, and angels</div><div class=\"mco\"><div class=\"bub\"></div><b>C.</b>&nbsp;Only the Mushrikeen of Makkah</div><div class=\"mco\"><div class=\"bub\"></div><b>D.</b>&nbsp;False religions and their books</div></div><div class=\"q\"><div class=\"qn\">Question 6</div><div class=\"qt\">The Imam's hadith about the best generations (Bukhari 2652 / Muslim 6635) teaches us that we understand the Quran and Sunnah through:</div></div><div class=\"mc\"><div class=\"mco\"><div class=\"bub\"></div><b>A.</b>&nbsp;Our personal reasoning and interpretation</div><div class=\"mco\"><div class=\"bub\"></div><b>B.</b>&nbsp;The understanding of the Companions and the first three generations</div><div class=\"mco\"><div class=\"bub\"></div><b>C.</b>&nbsp;The scholars of the 21st century</div><div class=\"mco\"><div class=\"bub\"></div><b>D.</b>&nbsp;Any scholar we find acceptable</div></div><div class=\"q\"><div class=\"qn\">Question 7</div><div class=\"qt\">'Eesa ﷺ will descend and slay al-Dajjal. The Imam cites this from:</div></div><div class=\"mc\"><div class=\"mco\"><div class=\"bub\"></div><b>A.</b>&nbsp;Sahih al-Bukhari 2652</div><div class=\"mco\"><div class=\"bub\"></div><b>B.</b>&nbsp;Ahmad 18378</div><div class=\"mco\"><div class=\"bub\"></div><b>C.</b>&nbsp;Sahih Muslim 7560</div><div class=\"mco\"><div class=\"bub\"></div><b>D.</b>&nbsp;An-Nisa 4:163</div></div><div class=\"sec-hd\"><h3>Section 3 — The 4 Caliphs & Best of Humans</h3><span class=\"pts\">10 pts</span></div><div class=\"q\"><div class=\"qn\">Question 8</div><div class=\"qt\">Write the Imam's exact statement (p.25) about the best of humans after the prophets. Fill in the full table:</div></div><span class=\"qar\">وَأَفْضَلُ الْبَشَرِ بَعْدَ الأَنْبِيَاءِ: ______ رَضِيَ اللَّهُ عَنْهُ، ثُمَّ ______، ثُمَّ ______، ثُمَّ ______، وَرَضِيَ اللَّهُ عَنْهُمْ أَجْمَعِينَ</span><table class=\"tbl\"><thead><tr><th>#</th><th>Full name</th><th>Title & meaning</th><th>One key fact</th></tr></thead><tbody><tr><td class=\"wc\">1st</td><td class=\"wc\"></td><td class=\"wc\"></td><td class=\"wc\"></td></tr><tr><td class=\"wc\">2nd</td><td class=\"wc\"></td><td class=\"wc\"></td><td class=\"wc\"></td></tr><tr><td class=\"wc\">3rd</td><td class=\"wc\"></td><td class=\"wc\"></td><td class=\"wc\"></td></tr><tr><td class=\"wc\">4th</td><td class=\"wc\"></td><td class=\"wc\"></td><td class=\"wc\"></td></tr></tbody></table><div class=\"sec-hd\"><h3>Section 4 — Essay</h3><span class=\"pts\">16 pts</span></div><div class=\"q\"><div class=\"qn\">Question 9</div><div class=\"qt\">The Imam says the Prophet ﷺ called people TOWARD ikhlas al-ibadah lillah AND AWAY FROM worshipping things besides Allah — including prophets and the righteous. Why is this second part so important? What historical pattern from Islamic history explains it? The Imam ends his treatise with وَالْحَمْدُ لِلَّهِ رَبِّ الْعَالَمِينَ — the same closing as Al-Fatiha and as our salah. Why is this the right close for a book about Tawhid? What connection does the Imam want you to feel between this treatise and your daily prayer?</div></div><div class=\"als\"><div class=\"aline\"></div><div class=\"aline\"></div><div class=\"aline\"></div><div class=\"aline\"></div><div class=\"aline\"></div><div class=\"aline\"></div></div><div class=\"sc-box\"><div><div class=\"sc-lbl\">Score</div><input type=\"number\" class=\"sc-input\" min=\"0\" max=\"50\" placeholder=\"0\" aria-label=\"Enter earned score out of 50\" oninput=\"var p=this.value; var out=this.parentElement.querySelector('.sc-pct'); var g=this.closest('.sc-box').querySelector('.sc-grade'); if(p===''){out.textContent='';g.textContent='';return;} var pct=Math.round((p/50)*1000)/10; out.textContent=pct+'%'; g.textContent = pct>=90?'A':pct>=80?'B':pct>=70?'C':pct>=60?'D':'F';\"><div class=\"sc-pct\"></div></div><div><div class=\"sc-lbl\">Out of</div><div class=\"sc-val\">50</div></div><div><div class=\"sc-lbl\">Grade</div><div class=\"sc-val sc-grade\"></div></div><div><div class=\"sc-lbl\">Comments</div><div class=\"sc-val\" style=\"min-width:140px;\"></div></div></div>"}, {"id": "MIDTEST", "cat": "test", "lesson": 0, "title": "Mid-Unit Test — Teaching Children Tawhid", "badge": "Test · 60 Points", "points": 60, "html": "<div class=\"sh-hdr\"><div class=\"sh-top\"><div class=\"sh-title\">Mid-Unit Test — Teaching Children Tawhid</div><div class=\"sh-badge\">Test · 60 Points</div></div><div class=\"sh-meta\"><div class=\"mf\"><div class=\"ml\">Name</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Date</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Score ___/60</div><div class=\"mv\"></div></div></div></div><div class=\"note\"><b>Note:</b> Covers: The Imam's Introduction · Q1 (Who is your Lord?) · Q2 (Meaning of ar-Rabb) · Q3 (How do you know Him?) · Q4 (Why were you created?) · Ibadah (3 categories) · Shirk (definition, 5 types, 5 sincerity/du'a proofs) · Az-Zumar 64-66 · Foundations of Iman saving from Kufr · Taghut (2 definitions, types) · Kufr bil-Taghut as first obligation · The Imam's mission summary (p.16)</div><div class=\"sec-hd\"><h3>Part 1 — Arabic Recall: Q1–Q4 (No Notes)</h3><span class=\"pts\">18 pts</span></div><div class=\"q\"><div class=\"qn\">Question 1</div><div class=\"qt\">Q1 — Write the Arabic question and its full answer:</div></div><div class=\"qt\">Question:</div><div class=\"al\"></div><div class=\"qt\">Answer:</div><div class=\"al\"></div><div class=\"q\"><div class=\"qn\">Question 2</div><div class=\"qt\">Q2 — Write all 6 Arabic terms defining ar-Rabb AND write the Imam's definition of \"Allah\" (p.8):</div></div><div class=\"als\"><div class=\"aline\"></div></div><div class=\"qt\">Definition of \"Allah\":</div><div class=\"al\"></div><div class=\"q\"><div class=\"qn\">Question 3</div><div class=\"qt\">Q3 — Write the full Arabic answer with all Signs and Creation listed:</div></div><div class=\"als\"><div class=\"aline\"></div></div><div class=\"q\"><div class=\"qn\">Question 4</div><div class=\"qt\">Q4 — Write the full Arabic answer AND both Quranic proofs:</div></div><div class=\"als\"><div class=\"aline\"></div></div><div class=\"qt\">Proof 1: ______ · Proof 2: ______</div><div class=\"q\"><div class=\"qn\">Question 5</div><div class=\"qt\">Write the Imam's Arabic statement that Shirk is the greatest sin, AND the Quranic proof (Al-Ma'idah 5:72) in Arabic:</div></div><div class=\"als\"><div class=\"aline\"></div></div><div class=\"sec-hd\"><h3>Part 2 — Multiple Choice</h3><span class=\"pts\">10 pts</span></div><div class=\"q\"><div class=\"qn\">Question 6</div><div class=\"qt\">The Imam's treatise goal: the child should become مُسْلِمًا كَامِلًا AND مُوَحِّدًا جَيِّدًا. These mean:</div></div><div class=\"mc\"><div class=\"mco\"><div class=\"bub\"></div><b>A.</b>&nbsp;\"A practicing Muslim\" and \"a good worshipper\"</div><div class=\"mco\"><div class=\"bub\"></div><b>B.</b>&nbsp;\"A complete Muslim\" upon the Fitrah of Islam AND \"a good, firm Muwahhid\" upon the path of correct faith</div><div class=\"mco\"><div class=\"bub\"></div><b>C.</b>&nbsp;\"A Muslim scholar\" and \"a memorizer of Quran\"</div><div class=\"mco\"><div class=\"bub\"></div><b>D.</b>&nbsp;\"An obedient Muslim\" and \"a knowledgeable believer\"</div></div><div class=\"q\"><div class=\"qn\">Question 7</div><div class=\"qt\">The phrase أَلَا لَهُ الْخَلْقُ وَالْأَمْر from 7:54 proves Q3 because:</div></div><div class=\"mc\"><div class=\"mco\"><div class=\"bub\"></div><b>A.</b>&nbsp;الْخَلق = الْمَخْلُوقَات (creation) AND الأَمر = الآيَات (signs/ongoing command)</div><div class=\"mco\"><div class=\"bub\"></div><b>B.</b>&nbsp;It lists the night, day, sun, and moon</div><div class=\"mco\"><div class=\"bub\"></div><b>C.</b>&nbsp;It says Allah is Lord of the worlds</div><div class=\"mco\"><div class=\"bub\"></div><b>D.</b>&nbsp;It mentions the six days of creation</div></div><div class=\"q\"><div class=\"qn\">Question 8</div><div class=\"qt\">The Imam's definition of Ibadah says it is \"inward and outward.\" This means:</div></div><div class=\"mc\"><div class=\"mco\"><div class=\"bub\"></div><b>A.</b>&nbsp;Only prayer and fasting count</div><div class=\"mco\"><div class=\"bub\"></div><b>B.</b>&nbsp;Both interior states (love, fear, hope) AND exterior actions (prayer, honesty, helping) are worship</div><div class=\"mco\"><div class=\"bub\"></div><b>C.</b>&nbsp;Ibadah only happens in the mosque</div><div class=\"mco\"><div class=\"bub\"></div><b>D.</b>&nbsp;Worship requires both Arabic and English intention</div></div><div class=\"q\"><div class=\"qn\">Question 9</div><div class=\"qt\">Al-Mu'minun 23:117 (one of the sincerity/Du'a proofs) calls those who invoke another deity alongside Allah:</div></div><div class=\"mc\"><div class=\"mco\"><div class=\"bub\"></div><b>A.</b>&nbsp;Mushrikeen</div><div class=\"mco\"><div class=\"bub\"></div><b>B.</b>&nbsp;Wrongdoers (Dhalimeen)</div><div class=\"mco\"><div class=\"bub\"></div><b>C.</b>&nbsp;Kafiroon (disbelievers) — this is called KUFR not just Shirk</div><div class=\"mco\"><div class=\"bub\"></div><b>D.</b>&nbsp;Hypocrites (Munafiqeen)</div></div><div class=\"q\"><div class=\"qn\">Question 10</div><div class=\"qt\">The Imam says the FIRST obligation upon servants is:</div></div><div class=\"mc\"><div class=\"mco\"><div class=\"bub\"></div><b>A.</b>&nbsp;Prayer and Zakah</div><div class=\"mco\"><div class=\"bub\"></div><b>B.</b>&nbsp;Learning the Quran</div><div class=\"mco\"><div class=\"bub\"></div><b>C.</b>&nbsp;الكُفْر بِالطَّاغُوت وَالإِيمَان بِاللَّه — Disbelief in Taghut AND belief in Allah</div><div class=\"mco\"><div class=\"bub\"></div><b>D.</b>&nbsp;Saying the Shahadah</div></div><div class=\"sec-hd\"><h3>Part 3 — Short Answer</h3><span class=\"pts\">20 pts</span></div><div class=\"q\"><div class=\"qn\">Question 11</div><div class=\"qt\">The Imam quotes Az-Zumar 64-66 (p.14) with the phrase لَيَحْبَطَنَّ عَمَلُكَ. This ayah is addressed to the Prophet ﷺ himself. Explain: What does لَيَحْبَطَنَّ عَمَلُكَ mean? Why address it to the Prophet ﷺ? What does this teach every Muslim about the relationship between Tawhid and good deeds?</div></div><div class=\"als\"><div class=\"aline\"></div><div class=\"aline\"></div><div class=\"aline\"></div></div><div class=\"q\"><div class=\"qn\">Question 12</div><div class=\"qt\">The Imam defines Taghut in two ways — his own list (p.14-15) and Ibn al-Qayyim's definition. Compare the two: what does each add? Then explain how Kufr bil-Taghut is the FIRST obligation using An-Nahl 16:36 and the structure of La ilaha illa Allah:</div></div><div class=\"als\"><div class=\"aline\"></div><div class=\"aline\"></div><div class=\"aline\"></div></div><div class=\"q\"><div class=\"qn\">Question 13</div><div class=\"qt\">The Imam's summary statement (p.16) says the Prophet ﷺ was sent with 3 things. List them in Arabic AND explain how ALL THREE together make up the complete mission of every prophet according to An-Nahl 16:36 and Al-Anfal 8:39:</div></div><div class=\"als\"><div class=\"aline\"></div><div class=\"aline\"></div><div class=\"aline\"></div></div><div class=\"sec-hd\"><h3>Part 4 — Essay</h3><span class=\"pts\">12 pts</span></div><div class=\"q\"><div class=\"qn\">Question 14</div><div class=\"qt\">The Imam opened this treatise saying it is \"a beneficial treatise concerning what is OBLIGATORY upon a person — that they teach children BEFORE teaching them the Quran.\" After studying Q1–Q4 and the Shirk/Taghut sections, explain in your own words WHY Tawhid BEFORE Quran. What would be missing if a child memorized Quran without first knowing Q1–Q4? Use at least 3 specific examples from the book's content to support your answer.</div></div><div class=\"als\"><div class=\"aline\"></div><div class=\"aline\"></div><div class=\"aline\"></div><div class=\"aline\"></div><div class=\"aline\"></div></div><div class=\"sc-box\"><div><div class=\"sc-lbl\">Score</div><input type=\"number\" class=\"sc-input\" min=\"0\" max=\"60\" placeholder=\"0\" aria-label=\"Enter earned score out of 60\" oninput=\"var p=this.value; var out=this.parentElement.querySelector('.sc-pct'); var g=this.closest('.sc-box').querySelector('.sc-grade'); if(p===''){out.textContent='';g.textContent='';return;} var pct=Math.round((p/60)*1000)/10; out.textContent=pct+'%'; g.textContent = pct>=90?'A':pct>=80?'B':pct>=70?'C':pct>=60?'D':'F';\"><div class=\"sc-pct\"></div></div><div><div class=\"sc-lbl\">Out of</div><div class=\"sc-val\">60</div></div><div><div class=\"sc-lbl\">Grade</div><div class=\"sc-val sc-grade\"></div></div><div><div class=\"sc-lbl\">Comments</div><div class=\"sc-val\" style=\"min-width:140px;\"></div></div></div>"}, {"id": "FINALTEST", "cat": "test", "lesson": 0, "title": "Final Unit Test — Teaching Children Tawhid", "badge": "Test · 100 Points", "points": 100, "html": "<div class=\"sh-hdr\"><div class=\"sh-top\"><div class=\"sh-title\">Final Unit Test — Teaching Children Tawhid</div><div class=\"sh-badge\">Test · 100 Points</div></div><div class=\"sh-meta\"><div class=\"mf\"><div class=\"ml\">Name</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Date</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Score ___/100</div><div class=\"mv\"></div></div></div></div><div class=\"note\"><b>Note:</b> Comprehensive — ALL Lessons: Imam's introduction · All 6 Q&As with proofs · Ibadah (definition + 3 categories) · Shirk (definition, 5 types, 5 sincerity/du'a proofs, Az-Zumar 64-66) · Foundations of Iman saving from Kufr · Taghut (both definitions, types) · Kufr bil-Taghut as first obligation · 4 meanings of Islam · La ilaha illa Allah (correct meaning + Ibrahim proof) · 5 Pillars with proofs · 6 Pillars of Iman with خَيْر وَشَرّ · Prophet's lineage, selection, mission, timeline · First/last messenger · 4 Caliphs · Best generations hadith · All 22 Quranic references · 5 key hadiths</div><div class=\"sec-hd\"><h3>Part 1 — All 6 Q&As from Memory (No Notes)</h3><span class=\"pts\">24 pts</span></div><div class=\"qt\">Write the Arabic answer AND Quranic proof for each (4 pts each):</div><div class=\"qt qar\">[س١] مَنْ رَبُّكَ؟</div><div class=\"al\"></div><div class=\"qt\">6 terms of ar-Rabb:</div><div class=\"al\"></div><div class=\"qt qar\">[س٣] بِمَ تَعْرِفُ رَبَّكَ؟</div><div class=\"qt\">Proof: Surah ______ Ayah ______</div><div class=\"qt qar\">[س٤] لِأَيِّ شَيْءٍ خَلَقَكَ؟</div><div class=\"qt\">Proof 1: ______ Proof 2: ______</div><div class=\"qt qar\">[س٥] مَا دِينُكَ؟ — 4 meanings of Islam:</div><div class=\"al\"></div><div class=\"qt\">5 Pillars:</div><div class=\"al\"></div><div class=\"qt\">6 Pillars of Iman:</div><div class=\"al\"></div><div class=\"qt qar\">[س٦] مَنْ نَبِيُّكَ؟ — Full lineage:</div><div class=\"al\"></div><div class=\"qt\">Proof for Seal of Prophets: Surah ______ Ayah ______</div><div class=\"qt\">Best of humans after prophets (4 names):</div><div class=\"al\"></div><div class=\"sec-hd\"><h3>Part 2 — Complete Evidence Chart</h3><span class=\"pts\">22 pts</span></div><div class=\"qt\">Fill in what the Imam uses each ayah to prove (1 pt each):</div><table class=\"tbl\"><thead><tr><th>Reference</th><th>What the Imam proves from it</th><th>Key Arabic phrase</th></tr></thead><tbody><tr><td class=\"wc\">Al-A'raf 7:54</td><td class=\"wc\"></td><td class=\"wc\"></td></tr><tr><td class=\"wc\">Adh-Dhariyat 51:56</td><td class=\"wc\"></td><td class=\"wc\"></td></tr><tr><td class=\"wc\">An-Nisa 4:36</td><td class=\"wc\"></td><td class=\"wc\"></td></tr><tr><td class=\"wc\">Al-Ma'idah 5:72</td><td class=\"wc\"></td><td class=\"wc\"></td></tr><tr><td class=\"wc\">Al-Jinn 72:18</td><td class=\"wc\"></td><td class=\"wc\"></td></tr><tr><td class=\"wc\">Al-Mu'minun 23:117</td><td class=\"wc\"></td><td class=\"wc\"></td></tr><tr><td class=\"wc\">Ghafir 40:60</td><td class=\"wc\"></td><td class=\"wc\"></td></tr><tr><td class=\"wc\">Az-Zumar 39:14</td><td class=\"wc\"></td><td class=\"wc\"></td></tr><tr><td class=\"wc\">Ar-Ra'd 13:36</td><td class=\"wc\"></td><td class=\"wc\"></td></tr><tr><td class=\"wc\">Az-Zumar 39:64-66</td><td class=\"wc\"></td><td class=\"wc\"></td></tr><tr><td class=\"wc\">Taha 20:55</td><td class=\"wc\"></td><td class=\"wc\"></td></tr><tr><td class=\"wc\">Ar-Ra'd 13:5</td><td class=\"wc\"></td><td class=\"wc\"></td></tr><tr><td class=\"wc\">An-Nahl 16:36</td><td class=\"wc\"></td><td class=\"wc\"></td></tr><tr><td class=\"wc\">Al-Anfal 8:39</td><td class=\"wc\"></td><td class=\"wc\"></td></tr><tr><td class=\"wc\">Al-Imran 3:19</td><td class=\"wc\"></td><td class=\"wc\"></td></tr><tr><td class=\"wc\">Al-Imran 3:85</td><td class=\"wc\"></td><td class=\"wc\"></td></tr><tr><td class=\"wc\">Az-Zukhruf 43:26-28</td><td class=\"wc\"></td><td class=\"wc\"></td></tr><tr><td class=\"wc\">Al-Bayyinah 98:5</td><td class=\"wc\"></td><td class=\"wc\"></td></tr><tr><td class=\"wc\">Al-Baqarah 2:183-185</td><td class=\"wc\"></td><td class=\"wc\"></td></tr><tr><td class=\"wc\">Al-Imran 3:97</td><td class=\"wc\"></td><td class=\"wc\"></td></tr><tr><td class=\"wc\">An-Nisa 4:163</td><td class=\"wc\"></td><td class=\"wc\"></td></tr><tr><td class=\"wc\">Al-Ahzab 33:40</td><td class=\"wc\"></td><td class=\"wc\"></td></tr></tbody></table><div class=\"sec-hd\"><h3>Part 3 — Short Answer</h3><span class=\"pts\">27 pts</span></div><div class=\"q\"><div class=\"qn\">Question 1</div><div class=\"qt\">The Imam defines Shirk as making a نِدّ (rival) for Allah — and lists 5 types. Write the full Arabic definition and explain why the Imam's phrase \"وَغَيْرُ ذَلِكَ مِنْ أَنْوَاعِ الْعِبَادَاتِ\" shows the list is NOT exhaustive. Give 2 modern examples not mentioned in the book:</div></div><div class=\"als\"><div class=\"aline\"></div><div class=\"aline\"></div><div class=\"aline\"></div></div><div class=\"q\"><div class=\"qn\">Question 2</div><div class=\"qt\">The Imam says وَأَوَّلُ مَا فَرَضَ اللَّهُ عَلَى عِبَادِهِ: الكُفْر بِالطَّاغُوت وَالإِيمَان بِاللَّه (p.14). Explain the two-part structure using: (a) the meaning of Kufr bil-Taghut, (b) Ibn al-Qayyim's definition of Taghut, (c) how this maps to La ilaha illa Allah, and (d) An-Nahl 16:36:</div></div><div class=\"als\"><div class=\"aline\"></div><div class=\"aline\"></div><div class=\"aline\"></div></div><div class=\"q\"><div class=\"qn\">Question 3</div><div class=\"qt\">Explain what the Imam means by \"Foundations of Iman saving from Kufr\" (p.14). Name all the beliefs listed. Cite Taha 20:55 and Ar-Ra'd 13:5 and explain what each proves. How does believing in وَالْجَنَّةُ وَالنَّارُ حَقٌّ change the way a Muslim lives every day?</div></div><div class=\"als\"><div class=\"aline\"></div><div class=\"aline\"></div><div class=\"aline\"></div></div><div class=\"q\"><div class=\"qn\">Question 4</div><div class=\"qt\">The Imam's account of the Prophet ﷺ (p.22-26) includes the phrase مِنْ غَيْرِ وَاسِطَةٍ about Al-Mi'raj. What does this mean? Why does the Imam specifically mention it? Also: the Imam includes worshipping prophets and the righteous in the list of things the Prophet ﷺ called people AWAY from. Why is this inclusion significant?</div></div><div class=\"als\"><div class=\"aline\"></div><div class=\"aline\"></div><div class=\"aline\"></div></div><div class=\"sec-hd\"><h3>Part 4 — Final Essay (Choose ONE)</h3><span class=\"pts\">27 pts</span></div><div class=\"note\"><b>Choose ONE option.</b> Minimum 8 sentences. At least 4 Quranic references (with Surah and Ayah). Arabic phrases required.</div><div class=\"q\"><b>Option A — The Book as a Complete System:</b> The Imam wrote this treatise as a single connected argument. Show how Q1→Q2→Q3→Q4→Shirk→Taghut→Q5→Q6 each builds on the previous. What is the Imam's complete argument? Where does it start, what does it prove along the way, and what does it leave you with by the end (the closing Walhamdulillah)? Use specific page references and Arabic quotes from the book.</div><div class=\"q\"><b>Option B — Responding to a Challenge:</b> A thoughtful non-Muslim classmate challenges you: \"Islam is just what you were born into. How do you know there is a God? How do you know Muhammad ﷺ was really a prophet? How do you know Islam is the right religion and not just YOUR religion?\" Write a complete, confident, evidence-based response using the Imam's book — Q1 through Q6 — as your foundation. Every claim must have an ayah or hadith from the book.</div><div class=\"qt\">I am answering: ☐ Option A ☐ Option B</div><div class=\"als\"><div class=\"aline\"></div><div class=\"aline\"></div><div class=\"aline\"></div><div class=\"aline\"></div><div class=\"aline\"></div><div class=\"aline\"></div><div class=\"aline\"></div><div class=\"aline\"></div></div><div class=\"sc-box\"><div><div class=\"sc-lbl\">Score</div><input type=\"number\" class=\"sc-input\" min=\"0\" max=\"100\" placeholder=\"0\" aria-label=\"Enter earned score out of 100\" oninput=\"var p=this.value; var out=this.parentElement.querySelector('.sc-pct'); var g=this.closest('.sc-box').querySelector('.sc-grade'); if(p===''){out.textContent='';g.textContent='';return;} var pct=Math.round((p/100)*1000)/10; out.textContent=pct+'%'; g.textContent = pct>=90?'A':pct>=80?'B':pct>=70?'C':pct>=60?'D':'F';\"><div class=\"sc-pct\"></div></div><div><div class=\"sc-lbl\">Out of</div><div class=\"sc-val\">100</div></div><div><div class=\"sc-lbl\">Grade</div><div class=\"sc-val sc-grade\"></div></div><div><div class=\"sc-lbl\">Comments</div><div class=\"sc-val\" style=\"min-width:140px;\"></div></div></div>"}, {"id": "OPEN1", "cat": "openers", "lesson": 1, "title": "Daily Opener — L1: Q1 & Q2 — Who is Your Lord? The Meaning of ar-Rabb", "badge": "Bell Ringer + Warm-Up · L1", "points": null, "html": "<div class=\"sh-hdr\"><div class=\"sh-top\"><div class=\"sh-title\">Daily Opener — Who is Your Lord?</div><div class=\"sh-badge\">Bell Ringer + Warm-Up · L1</div></div><div class=\"sh-meta\"><div class=\"mf\"><div class=\"ml\">Name</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Date</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\"></div><div class=\"mv\"></div></div></div></div><div class=\"sec-hd\"><h3>🔔 Bell Ringer (3-5 min — books closed)</h3></div><div class=\"q\"><div class=\"qn\">Quick Recall</div><span class=\"qar\">رَبِّي زِدْنِي عِلْمًا</span><div class=\"qt\">Say the du'a the Prophet ﷺ was commanded to say. What does it mean, and why is it the right way to start every lesson?</div><div class=\"al\"></div></div><div class=\"sec-hd\"><h3>☀️ Warm-Up (connects to today)</h3></div><div class=\"q\"><div class=\"qn\">Think About It</div><div class=\"qt\">Before we open the book: if a friend asked you \"who takes care of you and keeps your heart beating right now?\" — what would you say, in your own words?</div><div class=\"al\"></div><div class=\"al\"></div></div>"}, {"id": "EXIT1", "cat": "openers", "lesson": 1, "title": "Exit Ticket — L1: Q1 & Q2 — Who is Your Lord? The Meaning of ar-Rabb", "badge": "Exit Ticket · L1", "points": null, "html": "<div class=\"sh-hdr\"><div class=\"sh-top\"><div class=\"sh-title\">Exit Ticket — Who is Your Lord?</div><div class=\"sh-badge\">Exit Ticket · L1</div></div><div class=\"sh-meta\"><div class=\"mf\"><div class=\"ml\">Name</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Date</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\"></div><div class=\"mv\"></div></div></div></div><div class=\"sec-hd\"><h3>Before you leave...</h3></div><div class=\"q\"><div class=\"qn\">Question 1</div><div class=\"qt\">Write today's question and answer in Arabic.</div><span class=\"qar\">مَنْ رَبُّكَ؟</span></div><div class=\"q\"><div class=\"qn\">Question 2</div><div class=\"qt\">Name ONE of the 6 terms of ar-Rabb and explain, in your own words, why it matters to you personally.</div></div><div class=\"q\"><div class=\"qn\">Question 3 — Self-Check</div><div class=\"qt\">Rate how confident you feel with today's lesson:</div><div class=\"mc\"><div class=\"mco\"><div class=\"bub\"></div>😄 I could teach this to someone else</div><div class=\"mco\"><div class=\"bub\"></div>🙂 I understand it well</div><div class=\"mco\"><div class=\"bub\"></div>🤔 I need a bit more practice</div><div class=\"mco\"><div class=\"bub\"></div>😕 I need to review this with my teacher</div></div></div>"}, {"id": "ORAL1", "cat": "oral", "lesson": 1, "title": "Oral Review Script — L1: Q1 & Q2 — Who is Your Lord? The Meaning of ar-Rabb", "badge": "Teacher-Led Drill · L1", "points": null, "html": "<div class=\"sh-hdr\"><div class=\"sh-top\"><div class=\"sh-title\">Oral Review — Who is Your Lord?</div><div class=\"sh-badge\">Teacher-Led Drill · L1</div></div><div class=\"sh-meta\"><div class=\"mf\"><div class=\"ml\">Teacher</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Date</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Class</div><div class=\"mv\"></div></div></div></div><div class=\"note\"><b>Note:</b> Whole-class call-and-response. Say the prompt, point to a student (or the whole class), then reveal the expected answer. Move fast — this is retrieval practice, not re-teaching.</div><div class=\"sec-hd\"><h3>Call & Response</h3></div><div class=\"oral\"><div class=\"oral-row\"><div class=\"oral-n\">1</div><div class=\"oral-p\">مَنْ رَبُّكَ؟</div><div class=\"oral-a\">رَبِّيَ اللَّهُ</div></div><div class=\"oral-row\"><div class=\"oral-n\">2</div><div class=\"oral-p\">What are the 6 terms of ar-Rabb?</div><div class=\"oral-a\">الْمَالِكُ · الْمَعْبُودُ · الْمُعِينُ · النَّاصِرُ · الْخَالِقُ · الرَّازِقُ</div></div><div class=\"oral-row\"><div class=\"oral-n\">3</div><div class=\"oral-p\">Which two terms pair together because ownership requires worship?</div><div class=\"oral-a\">الْمَالِكُ and الْمَعْبُودُ</div></div><div class=\"oral-row\"><div class=\"oral-n\">4</div><div class=\"oral-p\">What is the Imam's definition of the Name \"Allah\"?</div><div class=\"oral-a\">ذُو الأُلُوهِيَّةِ وَالْعُبُودِيَّةِ عَلَى خَلْقِهِ أَجْمَعِين</div></div><div class=\"oral-row\"><div class=\"oral-n\">5</div><div class=\"oral-p\">Does the word \"Allah\" have a plural or a feminine form?</div><div class=\"oral-a\">No — it stands completely alone</div></div><div class=\"oral-row\"><div class=\"oral-n\">6</div><div class=\"oral-p\">What ayah proves Q1, Q2, AND Q3 at once?</div><div class=\"oral-a\">Al-A'raf 7:54</div></div><div class=\"oral-row\"><div class=\"oral-n\">7</div><div class=\"oral-p\">Who narrated the Fitrah hadith, and in which collection?</div><div class=\"oral-a\">Abu Hurairah, Sahih al-Bukhari</div></div><div class=\"oral-row\"><div class=\"oral-n\">8</div><div class=\"oral-p\">Every child is born upon the ______.</div><div class=\"oral-a\">الْفِطْرَة</div></div></div>"}, {"id": "VOCAB1", "cat": "vocab", "lesson": 1, "title": "Vocabulary & Flashcards — L1: Q1 & Q2 — Who is Your Lord? The Meaning of ar-Rabb", "badge": "Arabic Terms · L1", "points": 8, "html": "<div class=\"sh-hdr\"><div class=\"sh-top\"><div class=\"sh-title\">Vocabulary Review — Who is Your Lord?</div><div class=\"sh-badge\">Arabic Terms · L1</div></div><div class=\"sh-meta\"><div class=\"mf\"><div class=\"ml\">Name</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Date</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Score</div><div class=\"mv\"></div></div></div></div><div class=\"sec-hd\"><h3>Flashcards — cut along the lines</h3></div><div class=\"fc-grid\"><div class=\"fc\"><div class=\"fc-front\"><span class=\"qar\" style=\"font-size:1.6rem;\">رَبّ</span><div class=\"fc-tr\">Rabb</div></div><div class=\"fc-back\">Lord / Master / Sustainer</div></div><div class=\"fc\"><div class=\"fc-front\"><span class=\"qar\" style=\"font-size:1.6rem;\">مَالِك</span><div class=\"fc-tr\">Malik</div></div><div class=\"fc-back\">The Owner of Dominion</div></div><div class=\"fc\"><div class=\"fc-front\"><span class=\"qar\" style=\"font-size:1.6rem;\">مَعْبُود</span><div class=\"fc-tr\">Ma'bud</div></div><div class=\"fc-back\">The One Worshipped</div></div><div class=\"fc\"><div class=\"fc-front\"><span class=\"qar\" style=\"font-size:1.6rem;\">مُعِين</span><div class=\"fc-tr\">Mu'een</div></div><div class=\"fc-back\">The One who Helps</div></div><div class=\"fc\"><div class=\"fc-front\"><span class=\"qar\" style=\"font-size:1.6rem;\">نَاصِر</span><div class=\"fc-tr\">Nasir</div></div><div class=\"fc-back\">The One who Gives Victory</div></div><div class=\"fc\"><div class=\"fc-front\"><span class=\"qar\" style=\"font-size:1.6rem;\">خَالِق</span><div class=\"fc-tr\">Khaliq</div></div><div class=\"fc-back\">The Creator</div></div><div class=\"fc\"><div class=\"fc-front\"><span class=\"qar\" style=\"font-size:1.6rem;\">رَازِق</span><div class=\"fc-tr\">Raziq</div></div><div class=\"fc-back\">The Provider</div></div><div class=\"fc\"><div class=\"fc-front\"><span class=\"qar\" style=\"font-size:1.6rem;\">فِطْرَة</span><div class=\"fc-tr\">Fitrah</div></div><div class=\"fc-back\">The natural, pure state every child is born upon</div></div></div><div class=\"sec-hd\"><h3>Quiz Yourself</h3><span class=\"pts\">8 pts</span></div><table class=\"tbl\"><thead><tr><th>Arabic</th><th>Transliteration</th><th>Meaning (cover and try to recall)</th></tr></thead><tbody><tr><td class=\"wc\">رَبّ</td><td class=\"wc\">Rabb</td><td class=\"wc\"></td></tr><tr><td class=\"wc\">مَالِك</td><td class=\"wc\">Malik</td><td class=\"wc\"></td></tr><tr><td class=\"wc\">مَعْبُود</td><td class=\"wc\">Ma'bud</td><td class=\"wc\"></td></tr><tr><td class=\"wc\">مُعِين</td><td class=\"wc\">Mu'een</td><td class=\"wc\"></td></tr><tr><td class=\"wc\">نَاصِر</td><td class=\"wc\">Nasir</td><td class=\"wc\"></td></tr><tr><td class=\"wc\">خَالِق</td><td class=\"wc\">Khaliq</td><td class=\"wc\"></td></tr><tr><td class=\"wc\">رَازِق</td><td class=\"wc\">Raziq</td><td class=\"wc\"></td></tr><tr><td class=\"wc\">فِطْرَة</td><td class=\"wc\">Fitrah</td><td class=\"wc\"></td></tr></tbody></table>"}, {"id": "AYHD1", "cat": "vocab", "lesson": 1, "title": "Ayah & Hadith Review — L1: Q1 & Q2 — Who is Your Lord? The Meaning of ar-Rabb", "badge": "Recitation Practice · L1", "points": 6, "html": "<div class=\"sh-hdr\"><div class=\"sh-top\"><div class=\"sh-title\">Ayah & Hadith Review — Who is Your Lord?</div><div class=\"sh-badge\">Recitation Practice · L1</div></div><div class=\"sh-meta\"><div class=\"mf\"><div class=\"ml\">Name</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Date</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Score</div><div class=\"mv\"></div></div></div></div><div class=\"sec-hd\"><h3>This Lesson's Ayahs (1)</h3><span class=\"pts\">5 pts</span></div><div class=\"q\"><div class=\"qn\">Ayah 1 — Al-A'raf 7:54</div><span class=\"qar\">إِنَّ رَبَّكُمُ اللَّهُ الَّذِي خَلَقَ السَّمَوَاتِ وَالْأَرْضَ... أَلَا لَهُ الْخَلْقُ وَالْأَمْرُ</span><div class=\"qt\">1. Copy the ayah above in your own handwriting: </div><div class=\"al\"></div><div class=\"qt\">2. Translate it in your own words: </div><div class=\"al\"></div><div class=\"qt\">3. What does this ayah prove or teach? </div><div class=\"al\"></div><div class=\"qt\">4. Fill in the missing word from memory: </div><div class=\"qt qar\">إِنَّ رَبَّكُمُ اللَّهُ الَّذِي خَلَقَ ______ وَالْأَرْضَ... أَلَا لَهُ الْخَلْقُ وَالْأَمْرُ</div><div class=\"qt\">5. Why does this matter for how YOU live today? </div><div class=\"al\"></div></div><div class=\"sec-hd\"><h3>This Lesson's Hadith (1)</h3><span class=\"pts\">4 pts</span></div><div class=\"q\"><div class=\"qn\">The Fitrah hadith — Sahih al-Bukhari (Abu Hurairah)</div><span class=\"qar\">كُلُّ مَوْلُودٍ يُولَدُ عَلَى الْفِطْرَةِ، فَأَبَوَاهُ يُهَوِّدَانِهِ أَوْ يُنَصِّرَانِهِ أَوْ يُمَجِّسَانِهِ</span><div class=\"qt\">1. What does this hadith prove? </div><div class=\"al\"></div><div class=\"qt\">2. Translate it in your own words: </div><div class=\"al\"></div><div class=\"qt\">3. Which collection(s) narrate it, and what does that tell you about its strength? </div><div class=\"al\"></div></div>"}, {"id": "MATCH1", "cat": "games", "lesson": 1, "title": "Matching Activity — L1: Q1 & Q2 — Who is Your Lord? The Meaning of ar-Rabb", "badge": "Match the Terms · L1", "points": 6, "html": "<div class=\"sh-hdr\"><div class=\"sh-top\"><div class=\"sh-title\">Matching — Who is Your Lord?</div><div class=\"sh-badge\">Match the Terms · L1</div></div><div class=\"sh-meta\"><div class=\"mf\"><div class=\"ml\">Name</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Date</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Score</div><div class=\"mv\"></div></div></div></div><div class=\"sec-hd\"><h3>Draw a line (or write the letter) to match each item</h3><span class=\"pts\">6 pts</span></div><div class=\"match-grid\"><div class=\"match-col\"><h4>Column A</h4><div class=\"mi\"><div class=\"mn\">1</div>الْمَالِكُ</div><div class=\"mi\"><div class=\"mn\">2</div>الْمَعْبُودُ</div><div class=\"mi\"><div class=\"mn\">3</div>الْمُعِينُ</div><div class=\"mi\"><div class=\"mn\">4</div>النَّاصِرُ</div><div class=\"mi\"><div class=\"mn\">5</div>الْخَالِقُ</div><div class=\"mi\"><div class=\"mn\">6</div>الرَّازِقُ</div></div><div class=\"match-col\"><h4>Column B</h4><div class=\"mi\"><div class=\"mlt\">A</div>The Provider<div class=\"mblk\"></div></div><div class=\"mi\"><div class=\"mlt\">B</div>The Owner of Dominion<div class=\"mblk\"></div></div><div class=\"mi\"><div class=\"mlt\">C</div>The One who Gives Victory<div class=\"mblk\"></div></div><div class=\"mi\"><div class=\"mlt\">D</div>The Creator<div class=\"mblk\"></div></div><div class=\"mi\"><div class=\"mlt\">E</div>The One Worshipped<div class=\"mblk\"></div></div><div class=\"mi\"><div class=\"mlt\">F</div>The One who Helps<div class=\"mblk\"></div></div></div></div>"}, {"id": "TF1", "cat": "games", "lesson": 1, "title": "True/False — L1: Q1 & Q2 — Who is Your Lord? The Meaning of ar-Rabb", "badge": "T/F Quick Check · L1", "points": 8, "html": "<div class=\"sh-hdr\"><div class=\"sh-top\"><div class=\"sh-title\">True or False — Who is Your Lord?</div><div class=\"sh-badge\">T/F Quick Check · L1</div></div><div class=\"sh-meta\"><div class=\"mf\"><div class=\"ml\">Name</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Date</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Score</div><div class=\"mv\"></div></div></div></div><div class=\"sec-hd\"><h3>Circle T or F for each statement</h3><span class=\"pts\">8 pts</span></div><div class=\"tf\"><div class=\"tfrow\"><div class=\"tfopt\"><span class=\"tfbub\">T</span><span class=\"tfbub\">F</span></div><div class=\"tftext\">1. The Imam says the answer to \"Man Rabbuk?\" is \"Rabbi Allah.\"</div></div><div class=\"tfrow\"><div class=\"tfopt\"><span class=\"tfbub\">T</span><span class=\"tfbub\">F</span></div><div class=\"tftext\">2. The word \"Allah\" has a plural form, like most Arabic nouns.</div></div><div class=\"tfrow\"><div class=\"tfopt\"><span class=\"tfbub\">T</span><span class=\"tfbub\">F</span></div><div class=\"tftext\">3. Al-Malik and al-Ma'bud are unrelated ideas with no connection to each other.</div></div><div class=\"tfrow\"><div class=\"tfopt\"><span class=\"tfbub\">T</span><span class=\"tfbub\">F</span></div><div class=\"tftext\">4. The Fitrah hadith teaches that every child is born already believing in Allah.</div></div><div class=\"tfrow\"><div class=\"tfopt\"><span class=\"tfbub\">T</span><span class=\"tfbub\">F</span></div><div class=\"tftext\">5. Al-A'raf 7:54 is used by the Imam as proof for Q1, Q2, and Q3 together.</div></div><div class=\"tfrow\"><div class=\"tfopt\"><span class=\"tfbub\">T</span><span class=\"tfbub\">F</span></div><div class=\"tftext\">6. Ar-Raziq means \"The Creator\" and al-Khaliq means \"The Provider.\"</div></div><div class=\"tfrow\"><div class=\"tfopt\"><span class=\"tfbub\">T</span><span class=\"tfbub\">F</span></div><div class=\"tftext\">7. The Imam's introduction says his goal is for the child to become مُوَحِّدًا جَيِّدًا.</div></div><div class=\"tfrow\"><div class=\"tfopt\"><span class=\"tfbub\">T</span><span class=\"tfbub\">F</span></div><div class=\"tftext\">8. The Fitrah hadith was narrated by Umar ibn al-Khattab.</div></div></div>"}, {"id": "WS1", "cat": "games", "lesson": 1, "title": "Word Search — L1: Q1 & Q2 — Who is Your Lord? The Meaning of ar-Rabb", "badge": "Puzzle · L1", "points": null, "html": "<div class=\"sh-hdr\"><div class=\"sh-top\"><div class=\"sh-title\">Word Search — Who is Your Lord?</div><div class=\"sh-badge\">Puzzle · L1</div></div><div class=\"sh-meta\"><div class=\"mf\"><div class=\"ml\">Name</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Date</div><div class=\"mv\"></div></div><div class=\"mf\"><div class=\"ml\">Score</div><div class=\"mv\"></div></div></div></div><div class=\"sec-hd\"><h3>Find every term (transliterated)</h3></div><div class=\"ws-wrap\"><table class=\"ws\"><tr><td>F</td><td>O</td><td>M</td><td>I</td><td>U</td><td>W</td><td>R</td><td>H</td><td>V</td><td>K</td><td>Y</td><td>Y</td></tr><tr><td>B</td><td>H</td><td>B</td><td>N</td><td>Z</td><td>K</td><td>K</td><td>M</td><td>I</td><td>C</td><td>G</td><td>S</td></tr><tr><td>W</td><td>K</td><td>G</td><td>U</td><td>A</td><td>I</td><td>P</td><td>M</td><td>U</td><td>O</td><td>E</td><td>I</td></tr><tr><td>E</td><td>H</td><td>X</td><td>K</td><td>L</td><td>S</td><td>H</td><td>R</td><td>M</td><td>R</td><td>I</td><td>X</td></tr><tr><td>S</td><td>N</td><td>S</td><td>A</td><td>H</td><td>A</td><td>I</td><td>M</td><td>U</td><td>L</td><td>H</td><td>E</td></tr><tr><td>Q</td><td>P</td><td>M</td><td>C</td><td>R</td><td>A</td><td>Y</td><td>R</td><td>E</td><td>B</td><td
